name: SP001 publication candidate

on:
  pull_request:
    branches:
      - special/SP001-v2-work

permissions:
  contents: write

jobs:
  candidate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout candidate branch
        uses: actions/checkout@v6
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Core v2 dependencies
        run: python -m pip install -r config/survey-production-v2-requirements.txt
      - name: Build and prevalidate exact Publication Candidate
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=. python - <<'PY'
          import datetime as dt
          import pathlib
          from scripts import survey_production_v2 as core
          from scripts import survey_publication_v2 as publication
          from scripts import survey_stage_validation_v2 as stage

          root=pathlib.Path('.').resolve()
          state=root/'sources/SP001/production-state.json'
          payload=core.load_json(state)
          if payload.get('lifecycle_state')!='VALIDATED_DRAFT' or payload.get('next_action')!='stage:publication-candidate':
              raise SystemExit('Publication Candidate runner requires VALIDATED_DRAFT State')
          source=root/'sources/SP001/publication/v2/validated-source-manifest.json'
          pdf=root/'sources/SP001/publication/v2/SP001-publication-preview.pdf'
          bundle=root/'sources/SP001/publication/v2/quality-regression-bundle-v2.json'
          out=root/'sources/SP001/publication/v2/publication-candidate-v2.json'
          expected_pdf='8a363a33db80f55a047a8d6cdfecedb196f380939a3d40e68e3c3d21aded2764'
          if core.sha256_file(pdf)!=expected_pdf:
              raise SystemExit('Publication Candidate PDF SHA drift')
          publication.build_candidate(root,'SP001','LONGFORM_SPECIAL',source,pdf,11,bundle,out)
          candidate=publication.validate_candidate(root,out,issue_id='SP001')
          if candidate['pdf']['sha256']!=expected_pdf or candidate['pdf']['page_count']!=11:
              raise SystemExit('Publication Candidate exact-byte/page-count mismatch')
          cfg=core.load_json(root/core.DEFAULT_CONFIG)
          tmp=root/'sources/SP001/orchestration/v2/validation/VALIDATED_DRAFT.precheck.json'
          stage.validate_stage(root,cfg,state,{'publication-candidate':out},tmp,dt.datetime.now(dt.timezone.utc))
          tmp.unlink()
          print('SP001 Publication Candidate and VALIDATED_DRAFT stage prevalidation PASS')
          PY
      - name: Persist candidate authority only
        shell: bash
        env:
          PUSH_BRANCH: ${{ github.head_ref }}
        run: |
          set -euo pipefail
          rm -f .github/workflows/sp001-publication-candidate.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add sources/SP001 .github/workflows/sp001-publication-candidate.yml
          git commit -m 'Establish SP001 Publication Candidate'
          git push origin "HEAD:${PUSH_BRANCH}"
