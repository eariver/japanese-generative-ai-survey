name: Temporary SP001 r4 authority rebind fast

on:
  push:
    branches: [special/SP001-v2-work]
    paths:
      - 'sources/SP001/publication/v2/tmp-r4-authority-rebind-fast-trigger.txt'

permissions:
  contents: write

jobs:
  rebind-fast:
    runs-on: ubuntu-latest
    steps:
      - name: Sparse clone exact trigger head
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          url="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git clone --depth 1 --filter=blob:none --sparse --branch special/SP001-v2-work "$url" repo
          cd repo
          git sparse-checkout set \
            .github/workflows \
            scripts \
            tests \
            config \
            schemas \
            templates/survey \
            sources/SP001 \
            surveys/special/SP001
          actual=$(git rev-parse HEAD)
          echo "CLONED_HEAD=$actual" >> "$GITHUB_ENV"
          if [ "$actual" != "$GITHUB_SHA" ]; then
            echo "Branch moved before sparse clone: trigger=$GITHUB_SHA cloned=$actual"
            exit 78
          fi

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Core v2 dependencies
        working-directory: repo
        run: python -m pip install -r config/survey-production-v2-requirements.txt

      - name: Extract and execute canonical r4 rebind logic
        working-directory: repo
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import textwrap
          workflow = Path('.github/workflows/tmp-sp001-r4-authority-rebind.yml').read_text(encoding='utf-8')
          marker = "          python - <<'PY'\n"
          start = workflow.index(marker) + len(marker)
          end = workflow.index("\n          PY\n", start)
          code = textwrap.dedent(workflow[start:end]) + "\n"
          Path('/tmp/sp001-r4-rebind.py').write_text(code, encoding='utf-8')
          PY
          PYTHONPATH="$PWD" python /tmp/sp001-r4-rebind.py

      - name: Validate focused publication stack
        working-directory: repo
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest \
            tests.test_survey_publication_v2 \
            tests.test_survey_quality_v2 \
            tests.test_survey_reader_fidelity_v2 \
            -v

      - name: Commit exact r4 authority with race protection
        working-directory: repo
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          rm -f .github/workflows/tmp-sp001-r4-authority-rebind.yml
          rm -f .github/workflows/tmp-sp001-r4-authority-rebind-fast.yml
          rm -f sources/SP001/publication/v2/tmp-r4-authority-rebind-trigger.txt
          rm -f sources/SP001/publication/v2/tmp-r4-authority-rebind-fast-trigger.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Rebind SP001 r4 exact publication authority'
          git fetch --depth 1 origin special/SP001-v2-work
          remote_head=$(git rev-parse FETCH_HEAD)
          if [ "$remote_head" != "$GITHUB_SHA" ]; then
            echo "Remote branch moved during fast-path: trigger=$GITHUB_SHA remote=$remote_head; refusing overwrite"
            exit 78
          fi
          git push origin HEAD:special/SP001-v2-work
