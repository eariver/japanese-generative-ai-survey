name: One-shot retry Special standfirst and list contract

on:
  push:
    branches:
      - fix/special-standfirst-list-contract

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/special-standfirst-list-contract
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply original patch with corrected regression assertion
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import textwrap

          workflow = Path('.github/workflows/one-shot-fix-special-standfirst-list-contract.yml').read_text(encoding='utf-8')
          start_marker = "          python - <<'PY'\n"
          end_marker = "\n          PY\n"
          start = workflow.index(start_marker) + len(start_marker)
          end = workflow.index(end_marker, start)
          script = textwrap.dedent(workflow[start:end])
          exec(compile(script, '<standfirst-list-patch>', 'exec'), {})

          test_path = Path('tests/test_special_publication_contract_regressions.py')
          tests = test_path.read_text(encoding='utf-8')
          old = r'''self.assertIn(r"\end{itemize}\n\nTrailing explanation.", normalized)'''
          new = r'''self.assertIn("\\end{itemize}\n\nTrailing explanation.", normalized)'''
          if tests.count(old) != 1:
              raise SystemExit(f'bad assertion anchor count={tests.count(old)}')
          test_path.write_text(tests.replace(old, new, 1), encoding='utf-8')
          PY
          python -m py_compile \
            scripts/special_layout_text_normalization.py \
            scripts/revise_special_visual_review_repairs.py \
            scripts/special_publication_layout_check.py \
            tests/test_special_publication_contract_regressions.py
          python -m unittest tests.test_special_publication_contract_regressions -v
          git diff --check
      - name: Commit implementation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            scripts/special_layout_text_normalization.py \
            scripts/revise_special_visual_review_repairs.py \
            scripts/special_publication_layout_check.py \
            tests/test_special_publication_contract_regressions.py
          git commit -m 'Keep Special standfirsts full-width and normalize list markers'
          git push origin HEAD:fix/special-standfirst-list-contract
