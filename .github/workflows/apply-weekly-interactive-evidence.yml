name: Apply Weekly interactive Evidence

on:
  workflow_dispatch:
    inputs:
      issue_id:
        description: Weekly issue ID (YYYY-Www)
        required: true
        type: string
      review_reference:
        description: Interactive Evidence review reference
        required: true
        type: string

permissions:
  contents: write
  actions: read

concurrency:
  group: weekly-interactive-evidence-${{ inputs.issue_id }}
  cancel-in-progress: false

jobs:
  evidence:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout current control code
        uses: actions/checkout@v6
        with:
          ref: main
          path: control-src
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Resolve Weekly work branch
        id: issue
        shell: bash
        env:
          ISSUE_ID: ${{ inputs.issue_id }}
        run: |
          set -euo pipefail
          if ! [[ "${ISSUE_ID}" =~ ^[0-9]{4}-W[0-9]{2}$ ]]; then
            echo '::error::issue_id must use YYYY-Www form'
            exit 2
          fi
          echo "work_branch=weekly/${ISSUE_ID}-work" >> "$GITHUB_OUTPUT"

      - name: Checkout Weekly work branch
        uses: actions/checkout@v6
        with:
          ref: ${{ steps.issue.outputs.work_branch }}
          path: worktree
          fetch-depth: 0

      - name: Verify state, Raw provenance, and compact Evidence review
        id: input
        shell: bash
        env:
          ISSUE_ID: ${{ inputs.issue_id }}
        run: |
          set -euo pipefail
          python control-src/scripts/raw_provenance.py --repo-root worktree --issue-id "$ISSUE_ID" check
          state="worktree/sources/${ISSUE_ID}/pipeline-state.json"
          review="worktree/sources/${ISSUE_ID}/evidence/interactive-review-v0.1.json"
          test -s "$state"
          test -s "$review"
          python -m json.tool "$review" >/dev/null
          python - "$state" "$review" <<'PY'
          import json,sys
          state=json.load(open(sys.argv[1],encoding='utf-8'))
          review=json.load(open(sys.argv[2],encoding='utf-8'))
          assert state['lifecycle_state']=='CANDIDATES_NORMALIZED', state['lifecycle_state']
          assert state['gates']['candidate_inventory']=='passed'
          assert state['gates']['evidence_normalized']=='pending'
          assert state['gates']['candidate_selection']=='pending'
          assert review['issue_id']==state['issue_id']
          sha=review.get('screening_run_sha')
          assert isinstance(sha,str) and len(sha)==64
          print(sha)
          PY
          screening_sha="$(python -c "import json; print(json.load(open('$review'))['screening_run_sha'])")"
          echo "review_path=$review" >> "$GITHUB_OUTPUT"
          echo "screening_sha=$screening_sha" >> "$GITHUB_OUTPUT"

      - name: Generate, validate, and accept complete Evidence result set
        shell: bash
        env:
          ISSUE_ID: ${{ inputs.issue_id }}
          WORK_BRANCH: ${{ steps.issue.outputs.work_branch }}
          SCREENING_SHA: ${{ steps.input.outputs.screening_sha }}
          REVIEW_PATH: ${{ steps.input.outputs.review_path }}
          REVIEW_REFERENCE: ${{ inputs.review_reference }}
        run: |
          set -euo pipefail
          source_commit="$(git -C worktree rev-parse HEAD)"
          PYTHONPATH=control-src python control-src/scripts/run_weekly_interactive_evidence.py \
            --repo-root worktree \
            --issue-id "$ISSUE_ID" \
            --screening-run-sha "$SCREENING_SHA" \
            --source-ref "$WORK_BRANCH" \
            --source-commit "$source_commit" \
            --review "$REVIEW_PATH" \
            --review-reference "$REVIEW_REFERENCE" \
            --audit-output evidence-audit.json

      - name: Commit accepted Evidence set and state transition
        working-directory: worktree
        shell: bash
        env:
          ISSUE_ID: ${{ inputs.issue_id }}
          WORK_BRANCH: ${{ steps.issue.outputs.work_branch }}
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "sources/${ISSUE_ID}/evidence" "sources/${ISSUE_ID}/pipeline-state.json"
          if git diff --cached --quiet; then
            echo 'No Evidence change to commit.'
            exit 0
          fi
          git commit -m "Accept interactive Evidence for ${ISSUE_ID}"
          git push origin "HEAD:${WORK_BRANCH}"

      - name: Upload Evidence audit
        uses: actions/upload-artifact@v7
        with:
          name: weekly-interactive-evidence-${{ inputs.issue_id }}
          path: evidence-audit.json
          if-no-files-found: error
          retention-days: 14
