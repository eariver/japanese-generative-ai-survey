name: Import SP-2026-M05 reviewed source intake once

on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/import-m05-source-intake-once.yml'

permissions:
  contents: write
  actions: read
  pull-requests: read

concurrency:
  group: sp-2026-m05-source-intake-import-once
  cancel-in-progress: false

jobs:
  import:
    if: github.event.pull_request.number == 53 && github.head_ref == 'special/2026-M05-work'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout current control code
        uses: actions/checkout@v6
        with:
          ref: main
          path: control-src
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify exact reviewed Actions run and artifact
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          gh api "repos/${REPOSITORY}/actions/runs/31505633157" > source-run.json
          gh api "repos/${REPOSITORY}/actions/runs/31505633157/artifacts?per_page=100" > source-artifacts.json
          python - <<'PY'
          import json
          run=json.load(open('source-run.json',encoding='utf-8'))
          assert run['status']=='completed' and run['conclusion']=='success', run
          assert run['head_branch']=='special/2026-M05-work', run['head_branch']
          assert run['head_sha']=='72ca5a014a9de83cb3c05af484333949f093b882', run['head_sha']
          arts=json.load(open('source-artifacts.json',encoding='utf-8'))['artifacts']
          matches=[a for a in arts if a['id']==9106958827 and a['name']=='special-source-intake-2026-M05']
          assert len(matches)==1, matches
          a=matches[0]
          assert a['digest']=='sha256:c68c7ebdfd583403c0abbcc3819754eafbbe279d1b6225d108bfd28299162488', a['digest']
          PY
      - name: Checkout canonical Special work branch
        uses: actions/checkout@v6
        with:
          ref: special/2026-M05-work
          path: worktree
          fetch-depth: 0
      - name: Verify edition and initialized state
        shell: bash
        run: |
          set -euo pipefail
          cmp control-src/specials/2026-M05/edition.json worktree/specials/2026-M05/edition.json
          python control-src/scripts/special_pipeline.py --config control-src/config/special-pipeline.json validate --manifest control-src/specials/2026-M05/edition.json
          python - <<'PY'
          import json
          s=json.load(open('worktree/sources/SP-2026-M05/pipeline-state.json',encoding='utf-8'))
          assert s['lifecycle_state']=='ISSUE_INITIALIZED', s['lifecycle_state']
          assert all(v=='pending' for v in s['gates'].values()), s['gates']
          PY
      - name: Download exact reviewed artifact
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          mkdir -p artifact-download
          gh run download 31505633157 --repo "$REPOSITORY" --name special-source-intake-2026-M05 --dir artifact-download
          test -s artifact-download/special-source-intake/source-intake-report.json
          test -s artifact-download/special-source-intake-control/plan.json
          test -s artifact-download/special-source-intake-screening/screening-manifest.json
          python - <<'PY'
          import json
          r=json.load(open('artifact-download/special-source-intake/source-intake-report.json',encoding='utf-8'))
          assert r['overall_status']=='success' and len(r['runs'])==3, r
          assert all(x['status']=='success' for x in r['runs']), r
          m=json.load(open('artifact-download/special-source-intake-screening/screening-manifest.json',encoding='utf-8'))
          assert m['issue_id']=='SP-2026-M05'
          assert m['record_count']==1103, m['record_count']
          assert m['batch_count']==39, m['batch_count']
          PY
      - name: Accept reviewed collector bytes and discovery state
        shell: bash
        run: |
          set -euo pipefail
          python control-src/scripts/accept_special_source_intake_artifact.py \
            --artifact-root artifact-download \
            --repo-root worktree \
            --special-slug 2026-M05 \
            --workflow-run-id 31505633157 \
            --artifact-id 9106958827 \
            --artifact-name special-source-intake-2026-M05 \
            --artifact-digest sha256:c68c7ebdfd583403c0abbcc3819754eafbbe279d1b6225d108bfd28299162488 \
            --review-reference "Assistant artifact review: Actions run 31505633157; all collectors success; arXiv six categories complete with no errors; 1103 normalized records; 39 screening batches." \
            --report import-result.json
          python control-src/scripts/raw_provenance.py --repo-root worktree --issue-id SP-2026-M05 --report raw-update-report.json update
          python control-src/scripts/raw_provenance.py --repo-root worktree --issue-id SP-2026-M05 --report raw-check-report.json check
      - name: Remove one-shot runner files and commit reviewed intake
        working-directory: worktree
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/run-m05-source-intake-once.yml
          rm -f .github/workflows/import-m05-source-intake-once.yml
          rm -f .ai-work/m05-source-intake-trigger.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A sources/SP-2026-M05 .github/workflows .ai-work
          git commit -m "Import reviewed source intake for SP-2026-M05 from Actions run 31505633157"
          git push origin HEAD:special/2026-M05-work
      - name: Upload import audit
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: sp-2026-m05-source-intake-import-audit
          path: |
            source-run.json
            source-artifacts.json
            import-result.json
            raw-update-report.json
            raw-check-report.json
          if-no-files-found: warn
          retention-days: 14
