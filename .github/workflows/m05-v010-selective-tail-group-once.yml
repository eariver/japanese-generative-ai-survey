name: Build SP-2026-M05 v0.10 selective Technical Notes tails once

on:
  pull_request:
    types: [synchronize]
    paths:
      - 'sources/SP-2026-M05/editorial/v0.10-selective-tail-trigger.json'

permissions:
  contents: write

concurrency:
  group: special-m05-v010-selective-tail
  cancel-in-progress: false

jobs:
  build:
    if: github.event.pull_request.number == 53 && github.event.pull_request.head.ref == 'special/2026-M05-work'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout canonical control code
        uses: actions/checkout@v6
        with:
          ref: main
          path: control-src
          fetch-depth: 1

      - name: Checkout May work branch
        uses: actions/checkout@v6
        with:
          ref: special/2026-M05-work
          path: worktree
          fetch-depth: 0

      - name: Create immutable v0.10 from verified v0.7 stable layout
        working-directory: worktree
        shell: bash
        run: |
          set -euo pipefail
          python ../control-src/scripts/raw_provenance.py --repo-root . --issue-id SP-2026-M05 check >/dev/null
          python - <<'PY'
          import copy,hashlib,json,pathlib,shutil
          root=pathlib.Path('.'); issue='SP-2026-M05'; slug='2026-M05'
          state_path=root/'sources'/issue/'pipeline-state.json'; state=json.load(open(state_path,encoding='utf-8'))
          assert state['lifecycle_state']=='RELEASE_CANDIDATE'
          assert state['gates']['latex_build']=='passed' and state['gates']['visual_review']=='pending' and state['gates']['freeze']=='pending'
          current=copy.deepcopy(state['provenance']['validated_issue_source']); assert current['source_version']=='v0.9'
          current_path=root/current['path']
          def sha(p): return hashlib.sha256(p.read_bytes()).hexdigest()
          assert sha(current_path)==current['sha256']
          src=root/'surveys/special/2026-M05/revisions/v0.7/source-manifest.json'
          expected_v07='ef5bafbc46719321847960d4b945ccd1b0d7b4a3d4b3dd9737a87c5e55dbbb08'
          assert src.is_file() and sha(src)==expected_v07
          old=json.load(open(src,encoding='utf-8'))
          out=root/'surveys'/'special'/slug/'revisions'/'v0.10'
          if out.exists(): raise SystemExit('v0.10 already exists')
          shutil.copytree(src.parent,out)
          for name in ['main.pdf','main.log','main.aux','main.bcf','main.run.xml','main.bbl','main.blg','main.fdb_latexmk','main.fls','main.out','main.toc','jgaisurvey.sty']:
              (out/name).unlink(missing_ok=True)
          marker=root/'sources'/issue/'editorial'/'layout-revision-v0.10.json'
          titles=[
            'From Prompt Injection to Persistent Control: Defending Agentic Harness Against Trojan Backdoors',
            'An OpenAI model has disproved a central conjecture in discrete geometry',
            'A shared playbook for trustworthy third party evaluations'
          ]
          marker_data={
            'schema_version':'1.0','issue_id':issue,'revision':'v0.10','from_source_version':'v0.7','withheld_revisions':['v0.8','v0.9'],'review_issue':55,
            'constraints':{'new_external_evidence_allowed':False,'reader_claim_content_changed':False,'selected_evidence_only':True,'whole_card_unbreakable':False},
            'selected_tail_group_titles':titles,
            'changes':['Remove ineffective v0.7 list-local Needspace guards from all Technical Notes cards.','Apply deterministic minipage tail grouping only to the three cards whose actual renders exposed Issue #55 tails: ClawTrojan, discrete geometry, and the third-party evaluation playbook.','Keep the other 23 cards on normal breakable-card behavior.'],
            'qa_targets':['no ClawTrojan small page-top tail','no discrete-geometry small page-top tail','no playbook URL-only page-top tail','no Issue #40 structural whitespace regression','Issues #50/#54 remain fixed']
          }
          marker.write_text(json.dumps(marker_data,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          new=copy.deepcopy(old); new['source_version']='v0.10'; new['status']='VALIDATED_SELECTIVE_TECHNICAL_NOTES_TAIL_REVISION'
          new['derivation']='Selective layout follow-up based on stable v0.7. v0.8 was withheld for Issue #40 whitespace caused by global grouping; v0.9 fixed ClawTrojan/discrete geometry but its local reflow left the evaluation-playbook source URL alone at the next page top. v0.10 groups exactly those three render-confirmed tails. Reader wording, taxonomy, selected Evidence, accepted Article Draft content, Architecture, chronology, and narrative layout remain unchanged.'
          new['basis']=copy.deepcopy(old.get('basis') or {}); new['basis']['previous_source_manifest_path']='surveys/special/2026-M05/revisions/v0.7/source-manifest.json'; new['basis']['previous_source_manifest_sha256']=expected_v07; new['basis']['withheld_v0_9_manifest_path']=current['path']; new['basis']['withheld_v0_9_manifest_sha256']=current['sha256']
          reader=dict(new.get('reader_facing_technical_notes') or {}); reader['late_card_tail_group_titles']=titles; new['reader_facing_technical_notes']=reader
          new['review_repair']=copy.deepcopy(old.get('review_repair') or {}); new['review_repair']['follow_up_revision']='v0.10'; new['review_repair']['issue_55_selective_tail_layout_only']=True; new['review_repair']['selected_tail_group_titles']=titles; new['review_repair']['layout_revision_path']=marker.relative_to(root).as_posix(); new['review_repair']['layout_revision_sha256']=sha(marker)
          manifest=out/'source-manifest.json'; manifest.write_text(json.dumps(new,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          hist=state.setdefault('provenance_history',{}); hist.setdefault('validated_issue_source',[]).append(current)
          prev=copy.deepcopy(state.get('provenance',{}).get('latex_build') or {})
          if prev: hist.setdefault('latex_build',[]).append(prev)
          state['lifecycle_state']='VALIDATED_DRAFT'; state['gates']['latex_build']='pending'; state['gates']['visual_review']='pending'; state['gates']['freeze']='pending'
          state['provenance']['validated_issue_source']={'path':manifest.relative_to(root).as_posix(),'sha256':sha(manifest),'source_version':'v0.10','layout_mode':'balanced-multicol-adaptive-spacing-with-may-chronology-review-repairs-three-selective-tails','layout_revision_path':marker.relative_to(root).as_posix(),'layout_revision_sha256':sha(marker),'reader_facing_notes_language':'ja-reader-summary-v1','reader_facing_technical_notes':True}
          state['provenance'].pop('latex_build',None)
          state['provenance']['reader_layout_revision']={'source_version':'v0.10','layout_revision_path':marker.relative_to(root).as_posix(),'layout_revision_sha256':sha(marker),'reason':'v0.9 self-check found evaluation-playbook URL-only tail after fixing two earlier cards; select all three render-confirmed Issue #55 tails on stable v0.7 base.'}
          state_path.write_text(json.dumps(state,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          PY

      - name: Apply three selective tail groups and validate review repairs
        working-directory: worktree
        shell: bash
        env:
          PYTHONPATH: ../control-src
        run: |
          set -euo pipefail
          python ../control-src/scripts/postprocess_special_reader_facing_notes.py --repo-root . --issue-id SP-2026-M05 --special-slug 2026-M05 --source-version v0.10
          python ../control-src/scripts/special_reader_notes_ja.py check --repo-root . --issue-id SP-2026-M05
          python - <<'PY'
          import json,pathlib
          root=pathlib.Path('.'); s=json.load(open(root/'sources/SP-2026-M05/pipeline-state.json',encoding='utf-8'))
          m=root/s['provenance']['validated_issue_source']['path']; d=json.load(open(m,encoding='utf-8'))
          texts='\n'.join((m.parent/a['technical_notes_path']).read_text(encoding='utf-8') for a in d['articles'])
          assert texts.count('reader-facing Technical Notes coherent tail group') == 3, texts.count('reader-facing Technical Notes coherent tail group')
          assert texts.count('\\begin{minipage}{\\linewidth}') == 3, texts.count('\\begin{minipage}{\\linewidth}')
          assert '\\Needspace{12\\baselineskip}' not in texts
          assert 'reader-facing Technical Notes late-card tail guard' not in texts
          assert 'The preserved primary source identifies' not in texts
          assert 'were not independently reproduced' not in texts
          for token in ['OTHER','OFFICIAL\\_PUBLICATION','PRODUCT\\_UPDATE','MODEL\\_RELEASE','モデル\\_RELEASE','研究\\_RELEASE','論文\\_RELEASE']:
              assert token not in texts, token
          assert texts.count('評価ガイダンス') >= 2
          reader=d.get('reader_facing_technical_notes') or {}
          assert reader.get('whole_card_unbreakable') is False
          assert len(reader.get('late_card_tail_group_titles') or []) == 3
          PY

      - name: Commit v0.10 source before build
        working-directory: worktree
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'; git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add sources/SP-2026-M05/pipeline-state.json sources/SP-2026-M05/editorial/layout-revision-v0.10.json surveys/special/2026-M05/revisions/v0.10
          git commit -m 'Add M05 v0.10 three-tail Technical Notes revision'
          git push origin HEAD:special/2026-M05-work

      - name: Pin survey style
        shell: bash
        run: cp control-src/templates/survey/jgaisurvey.sty worktree/surveys/special/2026-M05/revisions/v0.10/jgaisurvey.sty

      - name: Set reproducible PDF timestamp
        run: echo 'SOURCE_DATE_EPOCH=1779926400' >> "$GITHUB_ENV"

      - name: Compile v0.10 Preview
        uses: xu-cheng/latex-action@v4
        with:
          root_file: main.tex
          working_directory: worktree/surveys/special/2026-M05/revisions/v0.10
          texlive_version: 2026
          latexmk_use_lualatex: true
          os: alpine

      - name: Audit v0.10 Preview
        id: audit
        shell: bash
        run: |
          set -euo pipefail
          dir=worktree/surveys/special/2026-M05/revisions/v0.10; pdf="$dir/main.pdf"; log="$dir/main.log"
          test -s "$pdf" && test -s "$log"
          bad=$(grep -E -n 'LaTeX Warning: (There were undefined references|Citation .* undefined)|Package biblatex Warning: Please (re)?run|Overfull \\hbox|Underfull \\hbox|Missing character:' "$log" || true)
          pages=$(python - "$log" <<'PY'
          import re,sys
          t=open(sys.argv[1],encoding='utf-8',errors='replace').read(); v=re.findall(r'Output written on .*?\((\d+) pages?',t,re.S); print(v[-1] if v else '-1')
          PY
          )
          sha=$(sha256sum "$pdf" | awk '{print $1}'); [ -z "$bad" ] && clean=true || clean=false
          python - "$pages" "$sha" "$clean" "$bad" <<'PY'
          import json,sys
          pages,sha,clean,bad=sys.argv[1:]; n=int(pages)
          r={'schema_version':'1.0','issue_id':'SP-2026-M05','source_version':'v0.10','page_count':n,'pdf_sha256':sha,'log_clean':clean=='true','log_gate_findings':bad.splitlines() if bad else [],'page_target_min':32,'page_target_max':40,'page_budget_passed':32<=n<=40,'review_issues':[50,54,55],'self_check_follow_up':'Issue #55 three selective grouped tails on stable v0.7 base'}
          open('special-pdf-build-audit.json','w',encoding='utf-8').write(json.dumps(r,ensure_ascii=False,indent=2)+'\n'); print(json.dumps(r,ensure_ascii=False,indent=2))
          if not r['log_clean'] or not r['page_budget_passed']: raise SystemExit(1)
          PY
          echo "pages=$pages" >> "$GITHUB_OUTPUT"; echo "sha=$sha" >> "$GITHUB_OUTPUT"

      - name: Upload v0.10 Preview artifact
        uses: actions/upload-artifact@v7
        with:
          name: japanese-generative-ai-survey-special-2026-M05-v0.10
          path: |
            worktree/surveys/special/2026-M05/revisions/v0.10/main.pdf
            worktree/surveys/special/2026-M05/revisions/v0.10/main.log
            special-pdf-build-audit.json
          if-no-files-found: error
          retention-days: 14

      - name: Record v0.10 release candidate with Visual Review pending
        working-directory: worktree
        shell: bash
        env:
          PAGES: ${{ steps.audit.outputs.pages }}
          PDF_SHA: ${{ steps.audit.outputs.sha }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib,json,pathlib,os
          p=pathlib.Path('sources/SP-2026-M05/pipeline-state.json'); s=json.load(open(p,encoding='utf-8')); src=s['provenance']['validated_issue_source']; m=pathlib.Path(src['path'])
          assert src['source_version']=='v0.10' and hashlib.sha256(m.read_bytes()).hexdigest()==src['sha256']
          s['lifecycle_state']='RELEASE_CANDIDATE'; s['gates']['latex_build']='passed'; s['gates']['visual_review']='pending'; s['gates']['freeze']='pending'
          s['provenance']['latex_build']={'workflow_run_id':int(os.environ['RUN_ID']),'pdf_sha256':os.environ['PDF_SHA'],'page_count':int(os.environ['PAGES']),'source_version':'v0.10','validated_issue_source_path':src['path'],'validated_issue_source_sha256':src['sha256'],'preview_only':True,'log_clean':True,'review_issues_addressed':[50,54,55],'self_check_follow_up':'Issue #55 three selective grouped tails on stable v0.7 base'}
          p.write_text(json.dumps(s,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          PY
          git config user.name 'github-actions[bot]'; git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add sources/SP-2026-M05/pipeline-state.json
          git commit -m 'Record M05 v0.10 pre-Human Preview candidate'
          git push origin HEAD:special/2026-M05-work
