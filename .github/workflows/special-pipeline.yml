name: Special survey pipeline spine

on:
  workflow_dispatch:
    inputs:
      command:
        description: Deterministic Special command
        required: true
        default: plan
        type: choice
        options:
          - bootstrap-plan
          - plan
          - validate
          - history-plan
          - source-intake
      special_slug:
        description: Configured Special slug; manifest is not required for bootstrap-plan
        required: false
        default: 2026-M07
        type: string
      collector:
        description: Source-intake collector set
        required: true
        default: all
        type: choice
        options:
          - all
          - arxiv
          - github
          - official
  push:
    paths:
      - 'config/special-pipeline.json'
      - 'config/source-intake.json'
      - 'schemas/special-edition-manifest.schema.json'
      - 'schemas/special-pipeline-state.schema.json'
      - 'scripts/special_pipeline.py'
      - 'scripts/source_intake.py'
      - 'scripts/special_source_intake.py'
      - 'tests/test_special_pipeline.py'
      - 'tests/test_special_source_intake.py'
      - 'specials/**/edition.json'
      - '.github/workflows/special-pipeline.yml'
  pull_request:
    paths:
      - 'config/special-pipeline.json'
      - 'config/source-intake.json'
      - 'schemas/special-edition-manifest.schema.json'
      - 'schemas/special-pipeline-state.schema.json'
      - 'scripts/special_pipeline.py'
      - 'scripts/source_intake.py'
      - 'scripts/special_source_intake.py'
      - 'tests/test_special_pipeline.py'
      - 'tests/test_special_source_intake.py'
      - 'specials/**/edition.json'
      - '.github/workflows/special-pipeline.yml'

permissions:
  contents: read

concurrency:
  group: special-pipeline-${{ github.ref }}-${{ inputs.special_slug || 'ci' }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate Special configuration and manifests
        shell: bash
        run: |
          set -euo pipefail
          python -m json.tool config/special-pipeline.json >/dev/null
          python -m json.tool config/source-intake.json >/dev/null
          python -m json.tool schemas/special-edition-manifest.schema.json >/dev/null
          python -m json.tool schemas/special-pipeline-state.schema.json >/dev/null
          while IFS= read -r manifest; do
            python -m json.tool "$manifest" >/dev/null
            python scripts/special_pipeline.py validate --manifest "$manifest"
          done < <(find specials -mindepth 2 -maxdepth 2 -name edition.json -type f | sort)
          python scripts/special_pipeline.py history-plan >/dev/null
          python scripts/special_pipeline.py bootstrap-plan --special-slug 2020-Y >/dev/null
          python scripts/special_pipeline.py bootstrap-plan --special-slug 2021-Y >/dev/null
          python scripts/special_pipeline.py bootstrap-plan --special-slug 2022-Y >/dev/null
      - name: Run Special unit tests
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest tests.test_special_pipeline tests.test_special_source_intake -v

  bootstrap-plan:
    needs: test
    if: github.event_name == 'workflow_dispatch' && inputs.command == 'bootstrap-plan'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Resolve configured Special before manifest initialization
        shell: bash
        env:
          SPECIAL_SLUG: ${{ inputs.special_slug }}
        run: |
          set -euo pipefail
          test -n "$SPECIAL_SLUG"
          mkdir -p out/special-pipeline
          python scripts/special_pipeline.py bootstrap-plan \
            --special-slug "$SPECIAL_SLUG" \
            --output out/special-pipeline/bootstrap-plan.json
      - uses: actions/upload-artifact@v7
        with:
          name: special-bootstrap-plan-${{ inputs.special_slug }}
          path: out/special-pipeline/bootstrap-plan.json
          if-no-files-found: error
          retention-days: 14

  plan:
    needs: test
    if: github.event_name == 'workflow_dispatch' && inputs.command == 'plan'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build explicit Special plan
        shell: bash
        env:
          SPECIAL_SLUG: ${{ inputs.special_slug }}
        run: |
          set -euo pipefail
          test -n "$SPECIAL_SLUG"
          mkdir -p out/special-pipeline
          python scripts/special_pipeline.py plan \
            --manifest "specials/${SPECIAL_SLUG}/edition.json" \
            --output out/special-pipeline/plan.json \
            --markdown-output out/special-pipeline/plan.md
          python scripts/special_pipeline.py init \
            --manifest "specials/${SPECIAL_SLUG}/edition.json" \
            --output out/special-pipeline/initial-state.json
      - uses: actions/upload-artifact@v7
        with:
          name: special-pipeline-plan-${{ inputs.special_slug }}
          path: out/special-pipeline/
          if-no-files-found: error
          retention-days: 14

  validate:
    needs: test
    if: github.event_name == 'workflow_dispatch' && inputs.command == 'validate'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate Special manifest
        shell: bash
        run: python scripts/special_pipeline.py validate --manifest 'specials/${{ inputs.special_slug }}/edition.json'

  history-plan:
    needs: test
    if: github.event_name == 'workflow_dispatch' && inputs.command == 'history-plan'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build historical granularity plan
        shell: bash
        run: |
          mkdir -p out/special-pipeline
          python scripts/special_pipeline.py history-plan --output out/special-pipeline/history-plan.json
      - uses: actions/upload-artifact@v7
        with:
          name: special-history-plan
          path: out/special-pipeline/history-plan.json
          if-no-files-found: error
          retention-days: 14

  source-intake:
    needs: test
    if: github.event_name == 'workflow_dispatch' && inputs.command == 'source-intake'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build exact historical collection plan
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out/special-source-intake-control
          python scripts/special_pipeline.py plan \
            --manifest 'specials/${{ inputs.special_slug }}/edition.json' \
            --output out/special-source-intake-control/plan.json \
            --markdown-output out/special-source-intake-control/plan.md
      - name: Reject accidental Grok requirement for retrospective source intake
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          plan=json.load(open('out/special-source-intake-control/plan.json', encoding='utf-8'))
          if plan['edition_kind'] == 'RETROSPECTIVE_PERIOD' and plan['community_research']['mode'] == 'ENABLED':
              raise SystemExit('retrospective Special may not require Grok/X source intake')
          print(f"Special intake: {plan['issue_id']} {plan['collection_window_start']} -> {plan['collection_window_end']}")
          PY
      - name: Run temporal-aware primary-source intake
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python scripts/special_source_intake.py \
            --plan out/special-source-intake-control/plan.json \
            --collector '${{ inputs.collector }}' \
            --output-root out/special-source-intake
      - name: Build deterministic screening index and batches
        shell: bash
        run: |
          set -euo pipefail
          ISSUE_ID="$(python -c "import json; print(json.load(open('out/special-source-intake-control/plan.json'))['issue_id'])")"
          python scripts/build_screening_index.py \
            --input-root out/special-source-intake \
            --output-dir out/special-source-intake-screening \
            --issue-id "$ISSUE_ID" \
            --max-records 40 \
            --max-json-chars 80000
      - name: Upload immutable Special source-intake review artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: special-source-intake-${{ inputs.special_slug }}
          path: |
            out/special-source-intake/
            out/special-source-intake-control/
            out/special-source-intake-screening/
          if-no-files-found: warn
          retention-days: 14
