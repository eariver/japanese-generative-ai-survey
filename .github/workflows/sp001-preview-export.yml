name: SP001 preview transport

on:
  push:
    branches:
      - transport/sp001-preview-export

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact preview branch
        uses: actions/checkout@v6
      - name: Verify preview bytes
        shell: bash
        run: |
          set -euo pipefail
          test -s surveys/special/SP001/main.pdf
          sha256sum surveys/special/SP001/main.pdf
      - name: Upload exact preview PDF
        uses: actions/upload-artifact@v7
        with:
          name: sp001-publication-preview-exact
          path: surveys/special/SP001/main.pdf
          if-no-files-found: error
          retention-days: 1
