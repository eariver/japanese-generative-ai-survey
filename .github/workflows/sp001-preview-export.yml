name: SP001 preview transport

on:
  pull_request:
    branches:
      - special/SP001-v2-work

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact preview branch
        uses: actions/checkout@v6
      - name: Verify preview bytes
        shell: bash
        run: |
          set -euo pipefail
          test -s surveys/special/SP001/main.pdf
          echo '2edff040ee1db2eb977d4216e5c1fbd42f2f629acd33bbbe73632a0791c29438  surveys/special/SP001/main.pdf' | sha256sum -c -
      - name: Upload exact preview PDF
        uses: actions/upload-artifact@v7
        with:
          name: sp001-publication-preview-exact
          path: surveys/special/SP001/main.pdf
          if-no-files-found: error
          retention-days: 1
