name: Survey Production Core v2 interactive Selection and Architecture

on:
  pull_request:
    branches:
      - 'weekly/*-v2-work'
      - 'special/*-v2-work'
    paths:
      - 'sources/**/selection/v2/interactive-selection-architecture.json'

permissions:
  contents: write

concurrency:
  group: survey-production-v2-interactive-selection-architecture-${{ github.base_ref }}
  cancel-in-progress: false

jobs:
  selection-architecture:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Checkout interactive Selection/Architecture branch
        uses: actions/checkout@v6
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Core v2 dependencies
        run: python -m pip install -r config/survey-production-v2-requirements.txt

      - name: Resolve and validate Selection/Architecture request identity
        id: request
        shell: bash
        env:
          TARGET_WORK_BRANCH: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          PYTHONPATH=. python - <<'PY' >> "$GITHUB_OUTPUT"
          import json, os, pathlib, re
          from scripts import survey_agent_control_v2 as agent
          from scripts import survey_production_v2 as core

          root=pathlib.Path('.').resolve()
          requests=sorted(root.glob('sources/*/selection/v2/interactive-selection-architecture.json'))
          if len(requests) != 1:
              raise SystemExit(f'exactly one interactive Selection/Architecture request required, found {len(requests)}')
          request=requests[0]
          issue=request.parts[-4]
          if not re.fullmatch(r'[A-Za-z0-9._-]+', issue): raise SystemExit('unsafe issue_id')
          payload=json.load(open(request,encoding='utf-8'))
          if payload.get('schema_version') != '2.0-rc1' or payload.get('issue_id') != issue:
              raise SystemExit('interactive Selection/Architecture request identity mismatch')
          state_path=root/'sources'/issue/'production-state.json'
          if not state_path.is_file(): raise SystemExit('missing canonical Production State')
          state=core.load_json(state_path)
          if state.get('lifecycle_state') != 'EVIDENCE_REVIEWED':
              raise SystemExit('interactive Selection/Architecture requires EVIDENCE_REVIEWED State')
          cfg=core.load_json(root/core.DEFAULT_CONFIG)
          errors=agent.validate_agent_state(root,cfg,state)
          if errors: raise SystemExit('; '.join(errors))
          profile=core.load_json(root/state['profile']['path'])
          if profile.get('paths',{}).get('work_branch') != os.environ['TARGET_WORK_BRANCH']:
              raise SystemExit('PR base does not match Production Profile work_branch')
          source_root=profile['paths']['source_root']
          expected=(root/source_root/'selection/v2/interactive-selection-architecture.json').resolve()
          if request.resolve() != expected: raise SystemExit('interactive Selection/Architecture request path is not canonical')
          print(f'issue_id={issue}')
          print(f'state={state_path.relative_to(root)}')
          print(f'request={request.relative_to(root)}')
          print(f'source_root={source_root}')
          PY

      - name: Generate exact Matrix, Selection, proposed Architecture, and review surfaces
        shell: bash
        env:
          STATE: ${{ steps.request.outputs.state }}
          REQUEST: ${{ steps.request.outputs.request }}
        run: |
          set -euo pipefail
          PYTHONPATH=. python scripts/run_selection_architecture_v2_interactive.py \
            --repo-root . --state "$STATE" --input "$REQUEST" \
            | tee selection-architecture-v2-output.json

      - name: Revalidate Selection stage and Architecture Review readiness
        shell: bash
        env:
          STATE: ${{ steps.request.outputs.state }}
        run: |
          set -euo pipefail
          PYTHONPATH=. python - <<'PY'
          import datetime, json, os, pathlib, tempfile
          from scripts import survey_architecture_v2 as architecture
          from scripts import survey_production_v2 as core
          from scripts import survey_review_attention_v2 as attention
          from scripts import survey_stage_validation_v2 as stage

          root=pathlib.Path('.').resolve()
          out=json.load(open('selection-architecture-v2-output.json',encoding='utf-8'))
          state_path=root/pathlib.Path(os.environ['STATE'])
          current={
              'candidate-matrix': root/out['candidate_matrix'],
              'candidate-selection': root/out['candidate_selection'],
          }
          with tempfile.TemporaryDirectory() as temp:
              report=pathlib.Path(temp)/'selection-stage-validation.json'
              stage.validate_stage(
                  root, core.load_json(root/core.DEFAULT_CONFIG), state_path, current, report,
                  datetime.datetime.now(datetime.timezone.utc)
              )
          profile=core.load_json(state_path)['profile']['path']
          profile_path=root/profile
          source_root=root/core.load_json(profile_path)['paths']['source_root']
          architecture_path=root/out['issue_architecture']
          selection_path=root/out['candidate_selection']
          matrix_path=root/out['candidate_matrix']
          completeness_path=source_root/'profile-completeness-v2.json'
          ledger_path=source_root/'materiality-ledger-v2.json'
          errors=architecture.validate_architecture(
              root, core.load_json(architecture_path), profile_path, completeness_path,
              ledger_path, matrix_path, selection_path, require_approved=False
          )
          if errors: raise SystemExit('; '.join(errors))
          attention.validate_attention(root, root/out['architecture_review_attention'])
          review=core.load_json(root/out['architecture_review_summary'])
          if review.get('readiness',{}).get('status') != 'READY_FOR_ARCHITECTURE_REVIEW':
              raise SystemExit('Architecture Review is not ready')
          print('Core v2 Selection/Architecture PASS')
          PY

      - name: Persist Selection/Architecture artifacts to execution branch
        shell: bash
        env:
          SOURCE_ROOT: ${{ steps.request.outputs.source_root }}
          REQUEST: ${{ steps.request.outputs.request }}
          ISSUE_ID: ${{ steps.request.outputs.issue_id }}
          PUSH_BRANCH: ${{ github.head_ref }}
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm -f "$REQUEST"
          git add "$SOURCE_ROOT"
          if git diff --cached --quiet; then
            echo 'No Selection/Architecture changes to commit.' >&2
            exit 1
          fi
          git commit -m "Establish ${ISSUE_ID} Core v2 Selection and proposed Architecture"
          git push origin "HEAD:${PUSH_BRANCH}"
