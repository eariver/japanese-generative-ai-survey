name: Survey Production Core v2 assistant control

on:
  push:
    branches:
      - automation-control
    paths:
      - automation/v2-request.json

permissions:
  actions: write
  contents: read

concurrency:
  group: survey-production-v2-assistant-control
  cancel-in-progress: false

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout request branch
        uses: actions/checkout@v6
        with:
          ref: automation-control
          path: request-src
          fetch-depth: 1

      - name: Checkout canonical main control contract
        uses: actions/checkout@v6
        with:
          ref: main
          path: control-src
          fetch-depth: 1

      - name: Validate allowlisted Core v2 request
        id: request
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json, pathlib, re
          request_path=pathlib.Path('request-src/automation/v2-request.json')
          data=json.load(open(request_path,encoding='utf-8'))
          if set(data) != {'schema_version','workflow','ref','inputs'} or data['schema_version'] != '2.0-rc1':
              raise SystemExit('invalid Core v2 assistant request envelope')
          if data['ref'] != 'main': raise SystemExit('Core v2 assistant dispatch ref must be main')
          cfg=json.load(open('control-src/config/survey-production-v2.json',encoding='utf-8'))['workflow_control']
          allowed={
              'survey-production-v2-control': cfg['production_control_workflow'],
              'survey-production-v2-release': cfg['release_workflow'],
          }
          workflow=data['workflow']
          if workflow not in allowed: raise SystemExit('workflow not allowlisted by Core v2 assistant control')
          inputs=data['inputs']
          if not isinstance(inputs,dict): raise SystemExit('inputs must be an object')
          issue=inputs.get('issue_id')
          if not isinstance(issue,str) or not re.fullmatch(r'[A-Za-z0-9._-]+',issue): raise SystemExit('unsafe issue_id')
          print(f'workflow_file={allowed[workflow]}')
          print(f'workflow_key={workflow}')
          print(f'issue_id={issue}')
          if workflow == 'survey-production-v2-control':
              required={
                  'operation','issue_id','work_branch','production_state_sha256',
                  'stage_artifacts_json','stage_reviews_path','stage_summary',
                  'reviewed_by','reviewed_at','review_reference','human_gate_authorized'
              }
              if set(inputs) != required: raise SystemExit('control inputs do not match exact allowlist')
              op=inputs['operation']
              if op not in {'adopt-stage','approve-architecture','approve-publication-preview'}: raise SystemExit('invalid control operation')
              branch=inputs['work_branch']
              if not isinstance(branch,str) or not re.fullmatch(r'[A-Za-z0-9._/-]+',branch) or '..' in branch.split('/'):
                  raise SystemExit('unsafe work_branch')
              state_sha=inputs['production_state_sha256']
              if not isinstance(state_sha,str) or not re.fullmatch(r'[0-9a-f]{64}',state_sha):
                  raise SystemExit('production_state_sha256 must be exact lowercase SHA-256')
              human=inputs['human_gate_authorized']
              if not isinstance(human,bool): raise SystemExit('human_gate_authorized must be boolean')
              if op == 'adopt-stage':
                  if human: raise SystemExit('adopt-stage cannot claim Human Gate authorization')
                  try: artifacts=json.loads(inputs['stage_artifacts_json'])
                  except Exception as exc: raise SystemExit(f'invalid stage_artifacts_json: {exc}')
                  if not isinstance(artifacts,dict): raise SystemExit('stage_artifacts_json must be an object')
                  for key in ('stage_reviews_path','stage_summary'):
                      if not isinstance(inputs[key],str) or not inputs[key].strip(): raise SystemExit(f'{key} required for adopt-stage')
                  for key in ('reviewed_by','reviewed_at','review_reference'):
                      if inputs[key] not in {None,''}: raise SystemExit(f'{key} must be empty for adopt-stage')
              else:
                  if human is not True: raise SystemExit('Human Gate operation requires explicit authorization')
                  if inputs['stage_artifacts_json'] not in {'','{}'} or inputs['stage_reviews_path'] not in {None,''} or inputs['stage_summary'] not in {None,''}:
                      raise SystemExit('Human Gate operation must not carry stage review inputs')
                  for key in ('reviewed_by','reviewed_at','review_reference'):
                      if not isinstance(inputs[key],str) or not inputs[key].strip(): raise SystemExit(f'{key} required for Human Gate')
              print(f'operation={op}')
              print(f'work_branch={branch}')
              print(f'production_state_sha256={state_sha}')
              print(f'stage_artifacts_json={json.dumps(inputs["stage_artifacts_json"], ensure_ascii=False)}')
              print(f'stage_reviews_path={inputs["stage_reviews_path"] or ""}')
              print(f'stage_summary={json.dumps(inputs["stage_summary"] or "", ensure_ascii=False)}')
              print(f'reviewed_by={inputs["reviewed_by"] or ""}')
              print(f'reviewed_at={inputs["reviewed_at"] or ""}')
              print(f'review_reference={inputs["review_reference"] or ""}')
              print(f'human_gate_authorized={str(human).lower()}')
          else:
              required={'issue_id','production_state_sha256','release_manifest_sha256','confirmation'}
              if set(inputs) != required: raise SystemExit('release inputs do not match exact allowlist')
              if inputs['confirmation'] != f'release:{issue}': raise SystemExit('release confirmation mismatch')
              for key in ('production_state_sha256','release_manifest_sha256'):
                  value=inputs[key]
                  if not isinstance(value,str) or not re.fullmatch(r'[0-9a-f]{64}',value):
                      raise SystemExit(f'{key} must be exact lowercase SHA-256')
                  print(f'{key}={value}')
              print(f'confirmation={inputs["confirmation"]}')
          PY

      - name: Dispatch one allowlisted agent-first production-control operation
        if: steps.request.outputs.workflow_key == 'survey-production-v2-control'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          gh workflow run '${{ steps.request.outputs.workflow_file }}' --repo "$REPOSITORY" --ref main \
            -f operation='${{ steps.request.outputs.operation }}' \
            -f issue_id='${{ steps.request.outputs.issue_id }}' \
            -f work_branch='${{ steps.request.outputs.work_branch }}' \
            -f production_state_sha256='${{ steps.request.outputs.production_state_sha256 }}' \
            -f stage_artifacts_json='${{ fromJSON(steps.request.outputs.stage_artifacts_json) }}' \
            -f stage_reviews_path='${{ steps.request.outputs.stage_reviews_path }}' \
            -f stage_summary='${{ fromJSON(steps.request.outputs.stage_summary) }}' \
            -f reviewed_by='${{ steps.request.outputs.reviewed_by }}' \
            -f reviewed_at='${{ steps.request.outputs.reviewed_at }}' \
            -f review_reference='${{ steps.request.outputs.review_reference }}' \
            -f human_gate_authorized='${{ steps.request.outputs.human_gate_authorized }}'

      - name: Dispatch one allowlisted exact-byte release
        if: steps.request.outputs.workflow_key == 'survey-production-v2-release'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          gh workflow run '${{ steps.request.outputs.workflow_file }}' --repo "$REPOSITORY" --ref main \
            -f issue_id='${{ steps.request.outputs.issue_id }}' \
            -f production_state_sha256='${{ steps.request.outputs.production_state_sha256 }}' \
            -f release_manifest_sha256='${{ steps.request.outputs.release_manifest_sha256 }}' \
            -f confirmation='${{ steps.request.outputs.confirmation }}'
