name: Temporary SP001 r3 reader regeneration

# retry-4: corrected delimiter matcher
on:
  push:
    branches: [special/SP001-v2-work]
    paths: ['.github/workflows/tmp-sp001-r3-reader.yml']

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: special/SP001-v2-work
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Repair generator delimiter and regenerate reader
        run: |
          python scripts/tmp_sp001_r3_reader_delimiter_fix.py
          python scripts/tmp_sp001_r3_reader_v2.py
      - name: Commit exact reader source basis locally
        id: source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add surveys/special/SP001/main.tex
          git commit -m 'Regenerate SP001 Publication r3 mixed-layout reader source'
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "epoch=$(git show -s --format=%ct HEAD)" >> "$GITHUB_OUTPUT"
          echo "source_sha256=$(sha256sum surveys/special/SP001/main.tex | awk '{print $1}')" >> "$GITHUB_OUTPUT"
      - name: Set revision-derived reproducible timestamp
        run: echo "SOURCE_DATE_EPOCH=${{ steps.source.outputs.epoch }}" >> "$GITHUB_ENV"
      - name: Compile exact r3 PDF
        uses: xu-cheng/latex-action@v4
        with:
          root_file: main.tex
          working_directory: surveys/special/SP001
          texlive_version: 2026
          latexmk_use_lualatex: true
      - name: Analyze exact build
        id: analyze
        shell: bash
        env:
          SOURCE_REVISION: ${{ steps.source.outputs.sha }}
          SOURCE_SHA256: ${{ steps.source.outputs.source_sha256 }}
        run: |
          set -euo pipefail
          pdf='surveys/special/SP001/main.pdf'; log='surveys/special/SP001/main.log'
          test -s "$pdf" && test -s "$log"
          blocking=$(grep -E -n 'LaTeX Warning: (There were undefined references|Citation .* undefined)|Package biblatex Warning: Please (re)?run|Missing character:' "$log" || true)
          layout=$(grep -E -n 'Overfull \\hbox|Underfull \\hbox' "$log" || true)
          pages=$(python - "$log" <<'PY'
          import re,sys
          s=open(sys.argv[1],encoding='utf-8',errors='replace').read()
          m=re.findall(r'Output written on .*?\((\d+) pages?',s,re.S)
          if not m: raise SystemExit('page count unavailable')
          print(m[-1])
          PY
          )
          digest=$(sha256sum "$pdf" | awk '{print $1}'); bytes=$(stat -c '%s' "$pdf")
          export PDF_SHA256="$digest" PAGE_COUNT="$pages" BYTE_COUNT="$bytes" BLOCKING="$blocking" LAYOUT="$layout" SOURCE_REVISION SOURCE_SHA256
          mkdir -p sources/SP001/publication/v2
          python - <<'PY'
          import json,os,pathlib
          p={'schema_version':'2.0-rc1','issue_id':'SP001','publication_revision':'r3',
             'source':{'path':'surveys/special/SP001/main.tex','sha256':os.environ['SOURCE_SHA256'],'repository_commit_sha':os.environ['SOURCE_REVISION']},
             'pdf':{'path':'surveys/special/SP001/main.pdf','sha256':os.environ['PDF_SHA256'],'byte_count':int(os.environ['BYTE_COUNT']),'page_count':int(os.environ['PAGE_COUNT'])},
             'build':{'source_date_epoch':int(os.environ['SOURCE_DATE_EPOCH']),'texlive_version':'2026','engine':'LuaLaTeX/latexmk'},
             'blocking_log_findings':os.environ['BLOCKING'].splitlines() if os.environ['BLOCKING'] else [],
             'layout_log_findings':os.environ['LAYOUT'].splitlines() if os.environ['LAYOUT'] else [],
             'status':'PASS' if not os.environ['BLOCKING'] else 'FAIL'}
          pathlib.Path('sources/SP001/publication/v2/pdf-build-audit-r3.json').write_text(json.dumps(p,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          print(json.dumps(p,ensure_ascii=False,indent=2))
          PY
          echo "page_count=$pages" >> "$GITHUB_OUTPUT"; echo "pdf_sha256=$digest" >> "$GITHUB_OUTPUT"
          [ -z "$blocking" ]
      - name: Render every exact PDF page
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils imagemagick
          mkdir -p r3-render
          pdftoppm -png -r 120 surveys/special/SP001/main.pdf r3-render/page >/dev/null
          montage r3-render/page-*.png -thumbnail 24% -tile 3x -geometry +8+8 r3-render/contact-sheet.png
          pdfinfo surveys/special/SP001/main.pdf > r3-render/pdfinfo.txt
          sha256sum surveys/special/SP001/main.pdf > r3-render/pdf.sha256
          test "$(find r3-render -maxdepth 1 -name 'page-*.png' | wc -l)" -eq "${{ steps.analyze.outputs.page_count }}"
      - uses: actions/upload-artifact@v7
        with:
          name: SP001-publication-r3-${{ steps.analyze.outputs.pdf_sha256 }}
          path: |
            surveys/special/SP001/main.pdf
            surveys/special/SP001/main.log
            sources/SP001/publication/v2/pdf-build-audit-r3.json
            r3-render/
          retention-days: 14
      - name: Commit canonical PDF and remove temporary transport
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/tmp-sp001-r3-reader.yml scripts/tmp_sp001_r3_reader.py scripts/tmp_sp001_r3_reader_v2.py scripts/tmp_sp001_r3_reader_delimiter_fix.py
          git add -A surveys/special/SP001/main.pdf sources/SP001/publication/v2/pdf-build-audit-r3.json .github/workflows/tmp-sp001-r3-reader.yml scripts/tmp_sp001_r3_reader.py scripts/tmp_sp001_r3_reader_v2.py scripts/tmp_sp001_r3_reader_delimiter_fix.py
          git commit -m 'Build SP001 Publication r3 exact reader PDF'
          git push origin HEAD:special/SP001-v2-work
