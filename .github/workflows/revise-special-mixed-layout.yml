name: Revise Special mixed layout

on:
  workflow_dispatch:
    inputs:
      special_slug:
        required: true
        type: string
      source_version:
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: special-mixed-layout-${{ inputs.special_slug }}
  cancel-in-progress: false

jobs:
  revise:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout current control code
        uses: actions/checkout@v6
        with:
          ref: main
          path: control-src
          fetch-depth: 1
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Resolve Special edition
        id: edition
        shell: bash
        env:
          SPECIAL_SLUG: ${{ inputs.special_slug }}
        run: |
          set -euo pipefail
          manifest="control-src/specials/${SPECIAL_SLUG}/edition.json"
          test -s "$manifest"
          python control-src/scripts/special_pipeline.py --config control-src/config/special-pipeline.json validate --manifest "$manifest"
          echo "special_id=$(python -c "import json; print(json.load(open('$manifest'))['special_id'])")" >> "$GITHUB_OUTPUT"
          echo "work_branch=$(python -c "import json; print(json.load(open('$manifest'))['paths']['work_branch'])")" >> "$GITHUB_OUTPUT"
      - name: Checkout Special work branch
        uses: actions/checkout@v6
        with:
          ref: ${{ steps.edition.outputs.work_branch }}
          path: worktree
          fetch-depth: 0
      - name: Verify revision boundary and raw provenance
        shell: bash
        env:
          SPECIAL_ID: ${{ steps.edition.outputs.special_id }}
          SOURCE_VERSION: ${{ inputs.source_version }}
        run: |
          set -euo pipefail
          python control-src/scripts/raw_provenance.py --repo-root worktree --issue-id "$SPECIAL_ID" check
          python - "$SPECIAL_ID" "$SOURCE_VERSION" <<'PY'
          import json,sys,pathlib
          issue,version=sys.argv[1:]
          root=pathlib.Path('worktree')
          state=json.load(open(root/'sources'/issue/'pipeline-state.json',encoding='utf-8'))
          lifecycle=state['lifecycle_state']
          gates=state['gates']
          if lifecycle=='RELEASE_CANDIDATE':
              assert gates['latex_build']=='passed'
          elif lifecycle=='VALIDATED_DRAFT':
              assert gates['claim_and_chronology_validation']=='passed'
              assert gates['latex_build']=='pending'
          else:
              raise AssertionError(lifecycle)
          assert gates['visual_review']=='pending'
          assert gates['freeze']=='pending'
          theme=root/'sources'/issue/'editorial'/f'theme-synthesis-{version}.json'
          final=root/'sources'/issue/'editorial'/f'final-synthesis-{version}.json'
          layout=root/'sources'/issue/'editorial'/f'layout-revision-{version}.json'
          assert theme.is_file() or final.is_file() or layout.is_file(), (theme,final,layout)
          if layout.is_file():
              spec=json.load(open(layout,encoding='utf-8'))
              changes=spec.get('layout_changes') or {}
              if changes.get('redraft_article_narrative') is True:
                  assert lifecycle=='RELEASE_CANDIDATE', 'narrative redraft begins from a machine-built Release Candidate'
                  revision=changes.get('draft_overrides_revision')
                  assert isinstance(revision,str) and revision, changes
                  overrides=root/'sources'/issue/'drafting'/f'interactive-overrides-{revision}'
                  assert overrides.is_dir(), overrides
                  assert state['automation']['human_gate_required_for_publication_preview'] is True
                  assert 'publication_preview' not in state.get('provenance',{}), 'redraft forbidden after Publication Preview approval'
          PY
      - name: Build immutable mixed-layout source revision
        shell: bash
        env:
          SPECIAL_ID: ${{ steps.edition.outputs.special_id }}
          SPECIAL_SLUG: ${{ inputs.special_slug }}
          SOURCE_VERSION: ${{ inputs.source_version }}
        run: |
          set -euo pipefail
          layout="worktree/sources/${SPECIAL_ID}/editorial/layout-revision-${SOURCE_VERSION}.json"
          final="worktree/sources/${SPECIAL_ID}/editorial/final-synthesis-${SOURCE_VERSION}.json"
          if test -s "$layout"; then
            mode=$(python - "$layout" <<'PY'
          import json,sys
          value=json.load(open(sys.argv[1],encoding='utf-8'))
          changes=value.get('layout_changes') or {}
          if changes.get('redraft_article_narrative') is True:
              print('redraft')
          elif changes.get('normalize_reader_event_enums') is True:
              print('reader-enum-cleanup')
          elif changes.get('compact_toc_to_sections') is True:
              print('compact-toc')
          elif changes.get('remove_subsection_needspace') is True:
              print('relaxed-subsection')
          elif changes.get('apply_to_layout_only_article_bodies') is True:
              print('subsection')
          elif changes.get('final_synthesis_subsection_spacing') is True:
              print('final-synthesis-subsection')
          else:
              print('adaptive')
          PY
            )
            case "$mode" in
              redraft)
                generated_at=$(python - <<'PY'
          from datetime import datetime
          from zoneinfo import ZoneInfo
          print(datetime.now(ZoneInfo('Asia/Tokyo')).isoformat(timespec='seconds'))
          PY
                )
                revision=$(python - "$layout" <<'PY'
          import json,sys
          changes=json.load(open(sys.argv[1],encoding='utf-8')).get('layout_changes') or {}
          print(changes['draft_overrides_revision'])
          PY
                )
                reference=$(python - "$layout" <<'PY'
          import json,sys
          value=json.load(open(sys.argv[1],encoding='utf-8'))
          print(value.get('review_reference') or 'Pre-publication evidence-bound narrative redraft')
          PY
                )
                PYTHONPATH=control-src python control-src/scripts/revise_special_interactive_drafts.py \
                  --repo-root worktree \
                  --issue-id "$SPECIAL_ID" \
                  --package-dir "sources/${SPECIAL_ID}/drafting/packages/v0.1" \
                  --overrides-dir "sources/${SPECIAL_ID}/drafting/interactive-overrides-${revision}" \
                  --prompt "config/prompts/editorial/article-drafting-v0.1.md" \
                  --provider "OpenAI" \
                  --model "GPT-5.6 Sol" \
                  --invocation "interactive ChatGPT pre-publication redraft after visual density review; no paid inference-provider API" \
                  --generated-at "$generated_at" \
                  --run-reference "$reference" \
                  --audit-output special-mixed-layout-audit.json
                ;;
              reader-enum-cleanup)
                PYTHONPATH=control-src python control-src/scripts/revise_special_reader_enum_cleanup.py \
                  --repo-root worktree --special-slug "$SPECIAL_SLUG" --issue-id "$SPECIAL_ID" --source-version "$SOURCE_VERSION" \
                  > special-mixed-layout-audit.json
                ;;
              compact-toc)
                PYTHONPATH=control-src python control-src/scripts/revise_special_compact_toc.py \
                  --repo-root worktree --special-slug "$SPECIAL_SLUG" --issue-id "$SPECIAL_ID" --source-version "$SOURCE_VERSION" \
                  > special-mixed-layout-audit.json
                ;;
              relaxed-subsection)
                PYTHONPATH=control-src python control-src/scripts/revise_special_relaxed_subsection_spacing.py \
                  --repo-root worktree --special-slug "$SPECIAL_SLUG" --issue-id "$SPECIAL_ID" --source-version "$SOURCE_VERSION" \
                  > special-mixed-layout-audit.json
                ;;
              subsection)
                PYTHONPATH=control-src python control-src/scripts/revise_special_subsection_spacing.py \
                  --repo-root worktree --special-slug "$SPECIAL_SLUG" --issue-id "$SPECIAL_ID" --source-version "$SOURCE_VERSION" \
                  > special-mixed-layout-audit.json
                ;;
              final-synthesis-subsection)
                PYTHONPATH=control-src python control-src/scripts/revise_special_final_synthesis_spacing.py \
                  --repo-root worktree --special-slug "$SPECIAL_SLUG" --issue-id "$SPECIAL_ID" --source-version "$SOURCE_VERSION" \
                  > special-mixed-layout-audit.json
                ;;
              *)
                PYTHONPATH=control-src python control-src/scripts/revise_special_adaptive_spacing.py \
                  --repo-root worktree --special-slug "$SPECIAL_SLUG" --issue-id "$SPECIAL_ID" --source-version "$SOURCE_VERSION" \
                  > special-mixed-layout-audit.json
                ;;
            esac
          elif test -s "$final"; then
            PYTHONPATH=control-src python control-src/scripts/revise_special_balanced_layout.py \
              --repo-root worktree --special-slug "$SPECIAL_SLUG" --issue-id "$SPECIAL_ID" --source-version "$SOURCE_VERSION" \
              > special-mixed-layout-audit.json
          else
            PYTHONPATH=control-src python control-src/scripts/run_revise_special_mixed_layout.py \
              --repo-root worktree --special-slug "$SPECIAL_SLUG" --issue-id "$SPECIAL_ID" --source-version "$SOURCE_VERSION" \
              > special-mixed-layout-audit.json
          fi
          cat special-mixed-layout-audit.json
      - name: Verify revised state and source manifest
        shell: bash
        env:
          SPECIAL_ID: ${{ steps.edition.outputs.special_id }}
          SOURCE_VERSION: ${{ inputs.source_version }}
        run: |
          set -euo pipefail
          python - "$SPECIAL_ID" "$SOURCE_VERSION" <<'PY'
          import hashlib,json,pathlib,sys
          issue,version=sys.argv[1:]
          root=pathlib.Path('worktree')
          layout=root/'sources'/issue/'editorial'/f'layout-revision-{version}.json'
          spec=json.load(open(layout,encoding='utf-8')) if layout.is_file() else {}
          lr=spec.get('layout_changes') or {}
          state=json.load(open(root/'sources'/issue/'pipeline-state.json',encoding='utf-8'))
          if lr.get('redraft_article_narrative') is True:
              assert state['lifecycle_state']=='DRAFT_COMPLETE', state['lifecycle_state']
              assert state['gates']['article_draft']=='passed'
              assert state['gates']['claim_and_chronology_validation']=='pending'
              assert state['gates']['latex_build']=='pending'
              assert state['gates']['visual_review']=='pending'
              assert state['gates']['freeze']=='pending'
              assert state['gates']['issue_architecture']=='passed'
              assert 'validated_issue_source' not in state.get('provenance',{})
              assert 'latex_build' not in state.get('provenance',{})
              assert state.get('provenance_history',{}).get('pre_publication_redraft')
              prov=state['provenance']['article_draft']
              run=root/../prov['result_set_path']
              assert run.is_dir(), run
              acceptance=json.load(open(run/'acceptance.json',encoding='utf-8'))
              assert acceptance['status']=='ACCEPTED'
              assert acceptance['article_draft_count']>=1
              raise SystemExit(0)
          assert state['lifecycle_state']=='VALIDATED_DRAFT'
          assert state['gates']['latex_build']=='pending'
          assert state['gates']['visual_review']=='pending'
          src=state['provenance']['validated_issue_source']
          assert src['source_version']==version
          path=root/src['path']
          assert path.is_file()
          assert hashlib.sha256(path.read_bytes()).hexdigest()==src['sha256']
          manifest=json.load(open(path,encoding='utf-8'))
          assert manifest['source_version']==version
          lr=manifest.get('layout_revision') or {}
          if lr.get('normalize_reader_event_enums') is True:
              assert manifest['status']=='VALIDATED_READER_ENUM_CLEANUP_REVISION'
              assert lr['reader_content_changed'] is False
              assert lr['new_external_evidence'] is False
              assert lr['machine_event_enum_replacement_count'] >= 1
              assert lr['article_sections_changed'] is False
              assert lr['theme_synthesis_changed'] is False
              assert lr['bibliography_data_changed'] is False
              assert manifest['reader_facing_technical_notes']['machine_enum_policy']=='reader-facing-labels-v5-canonical-casing'
          elif lr.get('compact_toc_to_sections') is True:
              assert manifest['status']=='VALIDATED_COMPACT_TOC_REVISION'
              assert lr['reader_content_changed'] is False
              assert lr['new_external_evidence'] is False
              assert lr['article_sections_changed'] is False
              assert lr['technical_notes_changed'] is False
              assert lr['theme_synthesis_changed'] is False
              assert lr['final_synthesis_changed'] is False
              assert lr['bibliography_data_changed'] is False
              assert manifest['layout']['toc_depth']=='section'
          elif lr.get('relaxed_subsection_spacing') is True:
              assert manifest['status']=='VALIDATED_RELAXED_SUBSECTION_SPACING_REVISION'
              assert lr['reader_content_changed'] is False
              assert lr['new_external_evidence'] is False
              assert lr['subsection_needspace_removed'] is True
              assert lr['accepted_article_sections_changed'] is False
              assert lr['theme_synthesis_changed'] is False
              assert lr['technical_notes_changed'] is False
              assert lr['final_synthesis_changed'] is False
          elif lr.get('subsection_spacing_guard') is True:
              assert manifest['status']=='VALIDATED_SUBSECTION_SPACING_REVISION'
              assert lr['reader_content_changed'] is False
              assert lr['new_external_evidence'] is False
              assert lr['subsection_needspace_baselines']==4
          elif lr.get('adaptive_chapter_starts') is True:
              assert manifest['status']=='VALIDATED_ADAPTIVE_SPACING_REVISION'
              assert lr['reader_content_changed'] is False
              assert lr['new_external_evidence'] is False
              assert lr['forced_bibliography_clearpage'] is False
          elif lr.get('retrospective_final_synthesis_repair') is True:
              assert manifest['status']=='VALIDATED_RETROSPECTIVE_SYNTHESIS_REPAIR_REVISION'
              assert lr['reader_content_changed'] is True
              assert lr['new_external_evidence'] is False
              assert lr['accepted_article_sections_changed'] is False
              assert lr['evidence_and_draft_packages_changed'] is False
              assert lr['final_synthesis_added'] is True
              assert manifest['layout']['body_mode'].startswith('mixed: narrative articles two-column')
              assert manifest['reader_facing_technical_notes']['machine_enum_policy']=='reader-facing-labels-v6-space-enum-guard'
              fs=manifest['final_synthesis']
              assert fs['required'] is True
              assert fs['selected_evidence_only'] is True
              assert fs['new_external_evidence'] is False
              assert fs['later_period_facts_used'] is False
              assert fs['toc_navigation'] is True
          elif lr.get('final_synthesis_subsection_spacing') is True:
              assert manifest['status']=='VALIDATED_FINAL_SYNTHESIS_SUBSECTION_SPACING_REVISION'
              assert lr['reader_content_changed'] is False
              assert lr['new_external_evidence'] is False
              assert lr['subsection_needspace_baselines']==5
              assert lr['numbered_subsection_guard_count'] >= 2
              assert lr['accepted_article_sections_changed'] is False
              assert lr['technical_notes_changed'] is False
              assert lr['theme_synthesis_changed'] is False
              assert lr['bibliography_data_changed'] is False
              assert lr['final_synthesis_wording_changed'] is False
              assert lr['final_synthesis_layout_changed'] is True
              fs=manifest['final_synthesis']
              assert fs['layout_only_revision'] is True
              assert fs['numbered_subsection_guard_count']==lr['numbered_subsection_guard_count']
          elif lr.get('half_year_review_repairs_v3') is True:
              if lr.get('half_year_source_specific_notes_v1') is True:
                  assert manifest['status']=='VALIDATED_HALF_YEAR_SOURCE_SPECIFIC_NOTES_REVISION'
                  assert lr['prior_half_year_structure_preserved'] is True
                  reader=manifest['reader_facing_technical_notes']
                  assert reader['source_specific_detail_contract']=='SCREENING_BACKED_FAIL_CLOSED'
                  assert reader['source_specific_detail_enrichment_count']==lr['technical_notes_source_specific_detail_enrichment_count']
                  assert reader['source_specific_detail_visible_card_count']==lr['technical_notes_visible_card_count']
                  assert reader['source_specific_detail_url_identity_checks']==lr['technical_notes_url_identity_checks']
              else:
                  assert manifest['status']=='VALIDATED_HALF_YEAR_REVIEW_REPAIR_V3_REVISION'
              assert lr['reader_content_changed'] is True
              assert lr['new_external_evidence'] is False
              assert lr['accepted_article_sections_changed'] is False
              assert lr['evidence_cards_changed'] is False
              assert lr['technical_notes_source_specific_replacement_count'] >= 1
              assert lr['technical_notes_common_limitation_removed_count'] >= 1
              assert lr['technical_notes_url_identity_checks'] >= lr['technical_notes_source_specific_replacement_count']
              assert lr['chronology_event_count'] >= 1
              assert lr['chronology_item_level_source_mapping'] is True
              assert lr['references_common_note_removed_count'] >= 1
              assert lr['references_common_note_consolidated'] is True
              expected={'HALF_YEAR_RECLASSIFICATION','CROSS_MONTH_COMPARISON','CROSS_LAYER_SYNTHESIS'}
              analysis=manifest['half_year_analysis']
              assert set(analysis['analysis_layers'])==expected
              assert set(lr['half_year_analysis_layers_added'])==expected
              assert analysis['selected_evidence_only'] is True
              assert analysis['new_external_evidence'] is False
              reader=manifest['reader_facing_technical_notes']
              assert reader['generic_fallback_policy']=='forbidden-fail-closed'
              assert reader['generic_fallback_findings']==0
              assert reader['source_specific_replacement_count']==lr['technical_notes_source_specific_replacement_count']
              if lr.get('half_year_source_specific_notes_v1') is not True:
                  assert reader['url_identity_checks']==lr['technical_notes_url_identity_checks']
          elif 'final_synthesis' in manifest:
              assert manifest['layout']['body_mode'].startswith('balanced mixed:')
              assert lr['full_width_chapter_headings'] is True
              assert lr['balanced_multicols'] is True
              assert lr['hard_column_mode_switches'] is False
              assert lr['final_chapter_added'] is True
              assert lr['new_external_evidence'] is False
          else:
              assert manifest['layout']['body_mode'].startswith('mixed: narrative articles two-column')
              assert lr['new_external_evidence'] is False
          PY
      - name: Commit revised source and state
        working-directory: worktree
        shell: bash
        env:
          SPECIAL_ID: ${{ steps.edition.outputs.special_id }}
          WORK_BRANCH: ${{ steps.edition.outputs.work_branch }}
          SPECIAL_SLUG: ${{ inputs.special_slug }}
          SOURCE_VERSION: ${{ inputs.source_version }}
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          layout="sources/${SPECIAL_ID}/editorial/layout-revision-${SOURCE_VERSION}.json"
          mode=$(python - "$layout" <<'PY'
          import json,sys,pathlib
          p=pathlib.Path(sys.argv[1])
          if not p.is_file():
              print('normal')
          else:
              changes=json.load(open(p,encoding='utf-8')).get('layout_changes') or {}
              print('redraft' if changes.get('redraft_article_narrative') is True else 'normal')
          PY
          )
          if [ "$mode" = redraft ]; then
            git add "sources/${SPECIAL_ID}/pipeline-state.json" "sources/${SPECIAL_ID}/drafting/runs"
            git add -A "sources/${SPECIAL_ID}/preview-transfer" || true
            git diff --cached --quiet && exit 0
            git commit -m "Accept pre-publication narrative redraft for ${SPECIAL_ID}"
          else
            git add "sources/${SPECIAL_ID}/pipeline-state.json" "surveys/special/${SPECIAL_SLUG}/revisions/${SOURCE_VERSION}"
            git commit -m "Revise ${SPECIAL_ID} reader layout ${SOURCE_VERSION}"
          fi
          git push origin "HEAD:${WORK_BRANCH}"
      - name: Upload revision audit
        uses: actions/upload-artifact@v7
        with:
          name: special-mixed-layout-${{ inputs.special_slug }}-${{ inputs.source_version }}
          path: special-mixed-layout-audit.json
          if-no-files-found: error
          retention-days: 14
