name: Temporary SP001 canonical Publication r2 PDF build

on:
  push:
    branches:
      - special/SP001-v2-work
    paths:
      - '.github/workflows/sp001-canonical-pdf-temp.yml'

permissions:
  contents: write

jobs:
  build-and-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout temporary trigger revision
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Bind build to parent source revision
        shell: bash
        run: |
          set -euo pipefail
          source_sha=$(git rev-parse "$GITHUB_SHA^")
          source_epoch=$(git show -s --format=%ct "$source_sha")
          echo "SOURCE_REVISION=$source_sha" >> "$GITHUB_ENV"
          echo "SOURCE_DATE_EPOCH=$source_epoch" >> "$GITHUB_ENV"
          test "$source_sha" = "8a0f02e0868a69397e9d3af6f5059155333476e8"
          test "$(git show "$source_sha:surveys/special/SP001/main.tex" | git hash-object --stdin)" = "85612a548167adca73a873a93d5292c76f7c8d18"

      - name: Compile exact SP001 source with LuaLaTeX
        uses: xu-cheng/latex-action@v4
        with:
          root_file: main.tex
          working_directory: surveys/special/SP001
          texlive_version: 2026
          latexmk_use_lualatex: true

      - name: Validate build and write deterministic audit
        shell: bash
        run: |
          set -euo pipefail
          pdf="surveys/special/SP001/main.pdf"
          log="surveys/special/SP001/main.log"
          test -s "$pdf"
          test -s "$log"
          blocking=$(grep -E -n 'LaTeX Warning: (There were undefined references|Citation .* undefined)|Package biblatex Warning: Please (re)?run|Missing character:' "$log" || true)
          test -z "$blocking"
          pages=$(python - "$log" <<'PY'
          import re,sys
          text=open(sys.argv[1],encoding='utf-8',errors='replace').read()
          matches=re.findall(r'Output written on .*?\((\d+) pages?',text,re.S)
          if not matches:
              raise SystemExit('could not determine page count')
          print(matches[-1])
          PY
          )
          test "$pages" = "13"
          digest=$(sha256sum "$pdf" | awk '{print $1}')
          bytes=$(stat -c '%s' "$pdf")
          layout=$(grep -E -n 'Overfull \\hbox|Underfull \\hbox' "$log" || true)
          export PDF_SHA256="$digest" PDF_BYTES="$bytes" PDF_PAGES="$pages" LAYOUT="$layout"
          mkdir -p sources/SP001/publication/v2/quality/results
          python - <<'PY'
          import json,os,pathlib
          payload={
            'schema_version':'2.0-rc1',
            'issue_id':'SP001',
            'check_id':'PDF_BUILD_R2',
            'status':'PASS',
            'source_revision':os.environ['SOURCE_REVISION'],
            'source':{
              'path':'surveys/special/SP001/main.tex',
              'git_blob_sha':'85612a548167adca73a873a93d5292c76f7c8d18'
            },
            'pdf':{
              'path':'surveys/special/SP001/main.pdf',
              'sha256':os.environ['PDF_SHA256'],
              'byte_count':int(os.environ['PDF_BYTES']),
              'page_count':int(os.environ['PDF_PAGES'])
            },
            'build':{
              'texlive_version':'2026',
              'engine':'LuaLaTeX/latexmk',
              'source_date_epoch':int(os.environ['SOURCE_DATE_EPOCH'])
            },
            'blocking_log_findings':[],
            'layout_log_findings':os.environ['LAYOUT'].splitlines() if os.environ['LAYOUT'] else []
          }
          pathlib.Path('sources/SP001/publication/v2/quality/results/pdf-build-r2.json').write_text(
            json.dumps(payload,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          print(json.dumps(payload,ensure_ascii=False,indent=2))
          PY

      - name: Commit only canonical PDF and build audit; remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/sp001-canonical-pdf-temp.yml
          git add surveys/special/SP001/main.pdf sources/SP001/publication/v2/quality/results/pdf-build-r2.json
          git commit -m 'Build SP001 canonical Publication r2 PDF'
          git push origin HEAD:special/SP001-v2-work
