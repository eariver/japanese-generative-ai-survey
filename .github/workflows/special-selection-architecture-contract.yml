name: Special Selection Architecture contract

on:
  pull_request:
    paths:
      - 'scripts/apply_special_selection_and_propose_architecture.py'
      - 'scripts/build_candidate_matrix.py'
      - '.github/workflows/apply-special-selection-and-propose-architecture.yml'
      - '.github/workflows/special-selection-architecture-contract.yml'
      - 'tests/test_special_selection_architecture.py'
      - 'tests/test_candidate_matrix_rfc_date.py'
      - 'tests/test_special_selection_decision_contract.py'
  push:
    branches: [main]
    paths:
      - 'scripts/apply_special_selection_and_propose_architecture.py'
      - 'scripts/build_candidate_matrix.py'
      - '.github/workflows/apply-special-selection-and-propose-architecture.yml'
      - '.github/workflows/special-selection-architecture-contract.yml'
      - 'tests/test_special_selection_architecture.py'
      - 'tests/test_candidate_matrix_rfc_date.py'
      - 'tests/test_special_selection_decision_contract.py'

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run Special Selection/Architecture contract tests
        run: |
          set -euo pipefail
          python -m unittest \
            tests.test_special_selection_architecture \
            tests.test_candidate_matrix_rfc_date \
            tests.test_special_selection_decision_contract
