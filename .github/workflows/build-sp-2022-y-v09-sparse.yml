name: Build SP-2022-Y v0.9 Sparse Preview

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: build-sp-2022-y-v09-sparse
  cancel-in-progress: false

jobs:
  build:
    if: github.event.pull_request.head.ref == 'special/2022-Y-work'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout current control code sparsely
        uses: actions/checkout@v6
        with:
          ref: main
          path: control-src
          fetch-depth: 1
          sparse-checkout: |
            scripts
            config
            specials/2022-Y
            templates/survey
          sparse-checkout-cone-mode: true

      - name: Checkout SP-2022-Y v0.9 validated working set sparsely
        uses: actions/checkout@v6
        with:
          ref: special/2022-Y-work
          path: worktree
          fetch-depth: 1
          sparse-checkout: |
            specials/2022-Y
            sources/SP-2022-Y/pipeline-state.json
            sources/SP-2022-Y/architecture
            sources/SP-2022-Y/drafting
            sources/SP-2022-Y/finalization
            sources/SP-2022-Y/editorial
            sources/SP-2022-Y/chronology
            surveys/special/2022-Y/revisions/v0.9
          sparse-checkout-cone-mode: false

      - name: Resolve and verify state-pinned v0.9 source
        id: source
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import hashlib,json,pathlib
          root=pathlib.Path('worktree')
          state=json.load(open(root/'sources/SP-2022-Y/pipeline-state.json',encoding='utf-8'))
          if state['lifecycle_state']=='RELEASE_CANDIDATE' and state['gates']['latex_build']=='passed':
              build=state.get('provenance',{}).get('latex_build',{})
              assert build.get('source_version')=='v0.9', build
              print('already_built=true')
              raise SystemExit(0)
          assert state['lifecycle_state']=='VALIDATED_DRAFT', state['lifecycle_state']
          assert state['gates']['claim_and_chronology_validation']=='passed'
          assert state['gates']['latex_build']=='pending'
          assert state['gates']['visual_review']=='pending' and state['gates']['freeze']=='pending'
          assert 'publication_preview' not in state.get('provenance',{})
          prov=state['provenance']['validated_issue_source']
          assert prov['source_version']=='v0.9', prov
          manifest=root/prov['path']
          assert manifest.is_file(), manifest
          digest=hashlib.sha256(manifest.read_bytes()).hexdigest()
          assert digest==prov['sha256'], (digest,prov['sha256'])
          data=json.load(open(manifest,encoding='utf-8'))
          source_dir=manifest.parent
          main=source_dir/data['main_tex']['path']
          assert main.is_file(), main
          print('already_built=false')
          print(f"source_manifest={manifest.as_posix()}")
          print(f"source_manifest_sha256={digest}")
          print(f"source_dir={source_dir.as_posix()}")
          print('source_version=v0.9')
          PY

      - name: Preflight reader-facing language, period, and layout consistency
        if: steps.source.outputs.already_built == 'false'
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=control-src python control-src/scripts/special_reader_notes_ja.py check \
            --repo-root worktree --issue-id SP-2022-Y
          PYTHONPATH=control-src python control-src/scripts/special_period_consistency.py check \
            --repo-root worktree --special-slug 2022-Y --issue-id SP-2022-Y
          PYTHONPATH=control-src python control-src/scripts/special_publication_layout_check.py \
            --repo-root worktree --issue-id SP-2022-Y

      - name: Pin current main survey style into ephemeral source directory
        if: steps.source.outputs.already_built == 'false'
        id: style
        shell: bash
        env:
          SOURCE_DIR: ${{ steps.source.outputs.source_dir }}
        run: |
          set -euo pipefail
          source_style="control-src/templates/survey/jgaisurvey.sty"
          target_style="${SOURCE_DIR}/jgaisurvey.sty"
          test -s "$source_style"
          cp "$source_style" "$target_style"
          control_commit=$(git -C control-src rev-parse HEAD)
          style_sha=$(sha256sum "$source_style" | awk '{print $1}')
          test "$style_sha" = "$(sha256sum "$target_style" | awk '{print $1}')"
          echo "control_commit=$control_commit" >> "$GITHUB_OUTPUT"
          echo "style_sha256=$style_sha" >> "$GITHUB_OUTPUT"

      - name: Set reproducible PDF timestamp
        if: steps.source.outputs.already_built == 'false'
        shell: bash
        run: echo 'SOURCE_DATE_EPOCH=1786406400' >> "$GITHUB_ENV"

      - name: Compile SP-2022-Y v0.9 with LuaLaTeX
        if: steps.source.outputs.already_built == 'false'
        uses: xu-cheng/latex-action@v4
        with:
          root_file: main.tex
          working_directory: ${{ steps.source.outputs.source_dir }}
          texlive_version: 2026
          latexmk_use_lualatex: true

      - name: Analyze final TeX log and page count
        if: steps.source.outputs.already_built == 'false'
        id: analyze
        shell: bash
        env:
          SOURCE_DIR: ${{ steps.source.outputs.source_dir }}
          SOURCE_MANIFEST: ${{ steps.source.outputs.source_manifest }}
          SOURCE_MANIFEST_SHA256: ${{ steps.source.outputs.source_manifest_sha256 }}
          CONTROL_COMMIT: ${{ steps.style.outputs.control_commit }}
          STYLE_SHA256: ${{ steps.style.outputs.style_sha256 }}
        run: |
          set -euo pipefail
          pdf="$SOURCE_DIR/main.pdf"
          log="$SOURCE_DIR/main.log"
          test -s "$pdf" && test -s "$log"
          bad=$(grep -E -n 'LaTeX Warning: (There were undefined references|Citation .* undefined)|Package biblatex Warning: Please (re)?run|Overfull \\hbox|Underfull \\hbox|Missing character:' "$log" || true)
          pages=$(python - "$log" <<'PY'
          import re,sys
          text=open(sys.argv[1],encoding='utf-8',errors='replace').read()
          matches=re.findall(r'Output written on .*?\((\d+) pages?',text,re.S)
          if not matches: raise SystemExit('could not determine PDF page count from TeX log')
          print(matches[-1])
          PY
          )
          digest=$(sha256sum "$pdf" | awk '{print $1}')
          if [ -z "$bad" ]; then clean=true; else clean=false; fi
          python - "$pages" "$digest" "$clean" "$bad" "$CONTROL_COMMIT" "$STYLE_SHA256" "$SOURCE_MANIFEST" "$SOURCE_MANIFEST_SHA256" <<'PY'
          import json,sys
          pages,digest,clean,bad,control_commit,style_sha,source_manifest,source_sha=sys.argv[1:]
          page_count=int(pages)
          out={
            'schema_version':'1.0','issue_id':'SP-2022-Y','special_slug':'2022-Y','source_version':'v0.9',
            'source_manifest_path':source_manifest,'source_manifest_sha256':source_sha,
            'page_count':page_count,'pdf_sha256':digest,'log_clean':clean=='true',
            'log_gate_findings':bad.splitlines() if bad else [],
            'page_target_soft':96,'page_target_max':144,'below_soft_target':page_count < 96,
            'page_target_status':'below-soft-target' if page_count < 96 else 'at-or-above-soft-target',
            'page_budget_policy':'manifest-soft-target-hard-ceiling',
            'build_style':{'source_ref':'main','control_commit_sha':control_commit,'path':'templates/survey/jgaisurvey.sty','sha256':style_sha,
              'application':'copied byte-for-byte into ephemeral state-pinned source directory'},
            'build_mode':'sparse-equivalent-of-build-special-pdf'
          }
          open('special-pdf-build-audit.json','w',encoding='utf-8').write(json.dumps(out,ensure_ascii=False,indent=2)+'\n')
          print(json.dumps(out,ensure_ascii=False,indent=2))
          PY
          echo "page_count=$pages" >> "$GITHUB_OUTPUT"
          echo "pdf_sha256=$digest" >> "$GITHUB_OUTPUT"
          echo "log_clean=$clean" >> "$GITHUB_OUTPUT"

      - name: Upload PDF preview artifact
        if: steps.source.outputs.already_built == 'false' && always()
        uses: actions/upload-artifact@v7
        with:
          name: japanese-generative-ai-survey-special-2022-Y-v0.9-sparse
          path: |
            ${{ steps.source.outputs.source_dir }}/main.pdf
            ${{ steps.source.outputs.source_dir }}/main.log
            special-pdf-build-audit.json
          if-no-files-found: error
          retention-days: 14

      - name: Enforce TeX log and page ceiling
        if: steps.source.outputs.already_built == 'false'
        shell: bash
        env:
          PAGE_COUNT: ${{ steps.analyze.outputs.page_count }}
          LOG_CLEAN: ${{ steps.analyze.outputs.log_clean }}
        run: |
          set -euo pipefail
          test "$LOG_CLEAN" = true
          test "$PAGE_COUNT" -le 144
          if [ "$PAGE_COUNT" -lt 96 ]; then
            echo "::warning title=Special page target::${PAGE_COUNT} pages is below the 96-page soft editorial target; no layout padding is permitted solely to reach it."
          fi

      - name: Record successful PDF build gate
        if: steps.source.outputs.already_built == 'false'
        working-directory: worktree
        shell: bash
        env:
          PAGE_COUNT: ${{ steps.analyze.outputs.page_count }}
          PDF_SHA256: ${{ steps.analyze.outputs.pdf_sha256 }}
          CONTROL_COMMIT: ${{ steps.style.outputs.control_commit }}
          STYLE_SHA256: ${{ steps.style.outputs.style_sha256 }}
          SOURCE_MANIFEST: ${{ steps.source.outputs.source_manifest }}
          SOURCE_MANIFEST_SHA256: ${{ steps.source.outputs.source_manifest_sha256 }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,os,pathlib
          path=pathlib.Path('sources/SP-2022-Y/pipeline-state.json')
          state=json.load(open(path,encoding='utf-8'))
          assert state['lifecycle_state']=='VALIDATED_DRAFT'
          assert state['gates']['visual_review']=='pending' and state['gates']['freeze']=='pending'
          assert 'publication_preview' not in state.get('provenance',{})
          state['lifecycle_state']='RELEASE_CANDIDATE'
          state['gates']['latex_build']='passed'
          state.setdefault('provenance',{})['latex_build']={
            'workflow_run_id':int(os.environ['RUN_ID']),
            'pdf_sha256':os.environ['PDF_SHA256'],
            'page_count':int(os.environ['PAGE_COUNT']),
            'source_version':'v0.9',
            'validated_issue_source_path':os.environ['SOURCE_MANIFEST'],
            'validated_issue_source_sha256':os.environ['SOURCE_MANIFEST_SHA256'],
            'page_budget':{'soft_target':96,'hard_max':144,'below_soft_target':int(os.environ['PAGE_COUNT']) < 96,
              'policy':'manifest-soft-target-hard-ceiling'},
            'build_style':{'control_commit_sha':os.environ['CONTROL_COMMIT'],'path':'templates/survey/jgaisurvey.sty','sha256':os.environ['STYLE_SHA256']},
            'build_mode':'sparse-equivalent-of-build-special-pdf'
          }
          path.write_text(json.dumps(state,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add sources/SP-2022-Y/pipeline-state.json
          git commit -m 'Record successful SP-2022-Y v0.9 PDF build'
          git push origin HEAD:special/2022-Y-work
