name: Special issue-only release contract

on:
  pull_request:
    paths:
      - '.github/workflows/accept-special-visual-review-issue-only.yml'
      - '.github/workflows/accept-special-freeze-issue-only.yml'
      - '.github/workflows/publish-special-frozen-release-issue-only.yml'
      - '.github/workflows/expand-special-validated-source-v2.yml'
      - '.github/workflows/special-issue-only-release-contract.yml'
      - 'scripts/release_identity.py'
      - 'scripts/accept_special_visual_review_issue_only.py'
      - 'scripts/accept_special_freeze_issue_only.py'
      - 'scripts/postprocess_special_reader_facing_notes.py'
      - 'schemas/weekly-release-manifest.schema.json'
      - 'tests/test_release_identity.py'
      - 'tests/test_special_reader_facing_notes.py'
      - 'tests/test_special_issue_only_release.py'
      - 'tests/test_release_manifest.py'
      - 'docs/release-identity-policy.md'
      - 'docs/special-layout-policy.md'
      - 'docs/special-visual-qa-checklist.md'
      - 'surveys/special/2026-M07/CURRENT_RELEASE.md'
      - 'surveys/special/2026-M07/main.tex'
  push:
    branches: [main]
    paths:
      - '.github/workflows/accept-special-visual-review-issue-only.yml'
      - '.github/workflows/accept-special-freeze-issue-only.yml'
      - '.github/workflows/publish-special-frozen-release-issue-only.yml'
      - '.github/workflows/expand-special-validated-source-v2.yml'
      - '.github/workflows/special-issue-only-release-contract.yml'
      - 'scripts/release_identity.py'
      - 'scripts/accept_special_visual_review_issue_only.py'
      - 'scripts/accept_special_freeze_issue_only.py'
      - 'scripts/postprocess_special_reader_facing_notes.py'
      - 'schemas/weekly-release-manifest.schema.json'
      - 'tests/test_release_identity.py'
      - 'tests/test_special_reader_facing_notes.py'
      - 'tests/test_special_issue_only_release.py'
      - 'tests/test_release_manifest.py'

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile issue-only release modules
        run: |
          set -euo pipefail
          python -m py_compile \
            scripts/release_identity.py \
            scripts/accept_special_visual_review_issue_only.py \
            scripts/accept_special_freeze_issue_only.py \
            scripts/postprocess_special_reader_facing_notes.py
      - name: Run issue-only and Issue 40 unit contracts
        run: |
          set -euo pipefail
          python -m unittest -v \
            tests.test_release_identity \
            tests.test_special_reader_facing_notes \
            tests.test_special_issue_only_release \
            tests.test_release_manifest
      - name: Verify public workflows cannot reintroduce release versions
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          visual=Path('.github/workflows/accept-special-visual-review-issue-only.yml').read_text(encoding='utf-8')
          freeze=Path('.github/workflows/accept-special-freeze-issue-only.yml').read_text(encoding='utf-8')
          publish=Path('.github/workflows/publish-special-frozen-release-issue-only.yml').read_text(encoding='utf-8')
          expand=Path('.github/workflows/expand-special-validated-source-v2.yml').read_text(encoding='utf-8')
          policy=Path('docs/release-identity-policy.md').read_text(encoding='utf-8')
          qa=Path('docs/special-visual-qa-checklist.md').read_text(encoding='utf-8')
          july=Path('surveys/special/2026-M07/CURRENT_RELEASE.md').read_text(encoding='utf-8')

          for name,text in [('visual',visual),('freeze',freeze),('publish',publish)]:
              assert 'release_revision:' not in text, name
              assert 'proposed_release_revision:' not in text, name
          assert 'freeze-candidate.json' in visual
          assert 'freeze-candidate.json' in freeze
          assert 'publish-special-frozen-release-issue-only.yml' in freeze
          assert 'gh release create' in publish
          assert "assert 'revision' not in manifest" in publish
          assert "for banned in ('Selection済みEvidence','normalized claim','Source-bound record:')" in expand
          assert 'issue number only' in policy
          assert 'isolated Claim Boundary' in qa
          assert 'revisions/v0.8/' in july
          assert 'is not the canonical source of the published PDF' in july
          PY
