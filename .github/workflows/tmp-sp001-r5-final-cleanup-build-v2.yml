name: Temporary SP001 r5 final cleanup build v2

on:
  push:
    branches: [special/SP001-v2-work]
    paths:
      - 'sources/SP001/publication/v2/tmp-r5-final-cleanup-build-v2-trigger.txt'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Sparse clone exact trigger head
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          url="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git clone --depth 20 --filter=blob:none --sparse --branch special/SP001-v2-work "$url" repo
          cd repo
          git sparse-checkout set \
            .github/workflows \
            config \
            schemas \
            scripts \
            tests \
            sources/SP001 \
            surveys/special/SP001 \
            templates/survey \
            docs
          actual=$(git rev-parse HEAD)
          test "$actual" = "$GITHUB_SHA" || { echo "branch moved trigger=$GITHUB_SHA cloned=$actual"; exit 78; }

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Core v2 dependencies
        working-directory: repo
        run: python -m pip install -r config/survey-production-v2-requirements.txt

      - name: Apply exact Issue 400 final wording cleanup and commit source-only revision
        working-directory: repo
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p=Path('surveys/special/SP001/main.tex')
          text=p.read_text(encoding='utf-8')
          replacements={
            'familyがどこをreader-facing technical surfaceとして強調しているか': 'familyが一次資料で技術的にどこを強調しているか',
            '何がfamily固有のまま残ったかをreader-facingに答える': '何がfamily固有のまま残ったかを読者に明確に示す',
          }
          assert text.count('reader-facing') == 2, text.count('reader-facing')
          for old,new in replacements.items():
              assert text.count(old)==1, old
              text=text.replace(old,new)
          assert 'reader-facing' not in text
          p.write_text(text,encoding='utf-8')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add surveys/special/SP001/main.tex
          git diff --cached --check
          test "$(git diff --cached --numstat | awk '{a+=$1;d+=$2} END {print a+0":"d+0}')" = '2:2'
          git commit -m 'Clean SP001 final reader prose for Issue 400'
          echo "SOURCE_COMMIT=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          echo "SOURCE_DATE_EPOCH=$(git show -s --format=%ct HEAD)" >> "$GITHUB_ENV"

      - name: Compile exact Special issue with LuaLaTeX
        uses: xu-cheng/latex-action@v4
        with:
          root_file: main.tex
          working_directory: repo/surveys/special/SP001
          texlive_version: 2026
          latexmk_use_lualatex: true

      - name: Validate exact build and Publication Boundary
        working-directory: repo
        shell: bash
        run: |
          set -euo pipefail
          test -s surveys/special/SP001/main.pdf
          test -s surveys/special/SP001/main.log
          blocking=$(grep -E -n 'LaTeX Warning: (There were undefined references|Citation .* undefined)|Package biblatex Warning: Please (re)?run|Missing character:' surveys/special/SP001/main.log || true)
          if [ -n "$blocking" ]; then printf '%s\n' "$blocking"; exit 1; fi
          PYTHONPATH=. python - <<'PY'
          from pathlib import Path
          import json,re,hashlib,os
          from pypdf import PdfReader
          source=Path('surveys/special/SP001/main.tex'); pdf=Path('surveys/special/SP001/main.pdf')
          text=source.read_text(encoding='utf-8')
          assert 'reader-facing' not in text
          assert len(re.findall(r'\\section\{',text))==6
          assert len(re.findall(r'\\subsection\{',text))==38
          reader=PdfReader(pdf,strict=True); pages=len(reader.pages); assert pages==14,pages
          sha=lambda p:hashlib.sha256(p.read_bytes()).hexdigest()
          source_sha=sha(source); pdf_sha=sha(pdf)
          extracted='\n'.join((p.extract_text() or '') for p in reader.pages)
          terms=[r'\bD0\d{2}\b',r'Core v2 Evidence',r'materiality:',r'accepted Evidence',r'Verify\s+',r'本 package',r'一次資料として昇格させない',r'coverage を広げる',r'reader-facing']
          matches=[{'pattern':pat,'match':m.group(0)} for pat in terms for m in re.finditer(pat,extracted,re.I)]
          assert not matches,matches
          build={'schema_version':'2.0-rc1','issue_id':'SP001','status':'PASS','source':{'path':'surveys/special/SP001/main.tex','sha256':source_sha,'byte_count':source.stat().st_size},'pdf':{'path':'surveys/special/SP001/main.pdf','sha256':pdf_sha,'byte_count':pdf.stat().st_size,'page_count':pages},'build':{'commit_sha':os.environ['SOURCE_COMMIT'],'source_date_epoch':int(os.environ['SOURCE_DATE_EPOCH']),'texlive_version':'2026','engine':'LuaLaTeX/latexmk'},'blocking_log_findings':[]}
          pub=Path('sources/SP001/publication/v2')
          (pub/'pdf-build-audit-r5.json').write_text(json.dumps(build,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          boundary={'schema_version':'2.0-rc1','issue_id':'SP001','status':'PASS','matches':matches,'source':build['source'],'pdf':build['pdf'],'scan_scope':'Issue #400 known reader-facing production/editorial meta-language regression set'}
          (pub/'publication-boundary-audit-r5.json').write_text(json.dumps(boundary,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          (pub/'r5-build-summary.txt').write_text(f'SOURCE_COMMIT={os.environ["SOURCE_COMMIT"]}\nSOURCE_SHA={source_sha}\nPDF_SHA={pdf_sha}\nPDF_BYTES={pdf.stat().st_size}\nPAGE_COUNT={pages}\n',encoding='utf-8')
          print((pub/'r5-build-summary.txt').read_text())
          PY

      - name: Install PDF renderer
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq poppler-utils
          command -v pdftoppm

      - name: Render all exact PDF pages for visual review
        working-directory: repo
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/sp001-r5-pages
          pdftoppm -png -r 120 surveys/special/SP001/main.pdf /tmp/sp001-r5-pages/page >/dev/null
          test "$(find /tmp/sp001-r5-pages -type f -name '*.png' | wc -l)" -eq 14

      - name: Commit exact build bytes and audits
        working-directory: repo
        shell: bash
        run: |
          set -euo pipefail
          git add surveys/special/SP001/main.pdf sources/SP001/publication/v2/pdf-build-audit-r5.json sources/SP001/publication/v2/publication-boundary-audit-r5.json sources/SP001/publication/v2/r5-build-summary.txt
          git diff --cached --check
          git commit -m 'Build SP001 r5 exact Publication Preview bytes'
          git fetch --depth 1 origin special/SP001-v2-work
          remote_head=$(git rev-parse FETCH_HEAD)
          test "$remote_head" = "$GITHUB_SHA" || { echo "remote moved trigger=$GITHUB_SHA remote=$remote_head"; exit 78; }
          git push origin HEAD:special/SP001-v2-work

      - name: Upload exact r5 PDF and rendered pages
        uses: actions/upload-artifact@v7
        with:
          name: sp001-r5-final-cleanup-build-v2-${{ github.run_id }}
          path: |
            repo/surveys/special/SP001/main.pdf
            repo/sources/SP001/publication/v2/pdf-build-audit-r5.json
            repo/sources/SP001/publication/v2/publication-boundary-audit-r5.json
            repo/sources/SP001/publication/v2/r5-build-summary.txt
            /tmp/sp001-r5-pages/*.png
          if-no-files-found: error
          retention-days: 14
