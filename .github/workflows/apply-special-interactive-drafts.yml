name: Apply Special interactive article drafts

on:
  workflow_dispatch:
    inputs:
      special_slug:
        required: true
        type: string
      review_reference:
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: special-interactive-drafts-${{ inputs.special_slug }}
  cancel-in-progress: false

jobs:
  drafting:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout current control code
        uses: actions/checkout@v6
        with:
          ref: main
          path: control-src
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Resolve Special edition
        id: edition
        shell: bash
        env:
          SPECIAL_SLUG: ${{ inputs.special_slug }}
        run: |
          set -euo pipefail
          manifest="control-src/specials/${SPECIAL_SLUG}/edition.json"
          test -s "$manifest"
          python control-src/scripts/special_pipeline.py --config control-src/config/special-pipeline.json validate --manifest "$manifest"
          echo "special_id=$(python -c "import json; print(json.load(open('$manifest'))['special_id'])")" >> "$GITHUB_OUTPUT"
          echo "work_branch=$(python -c "import json; print(json.load(open('$manifest'))['paths']['work_branch'])")" >> "$GITHUB_OUTPUT"
      - name: Checkout Special work branch
        uses: actions/checkout@v6
        with:
          ref: ${{ steps.edition.outputs.work_branch }}
          path: worktree
          fetch-depth: 0
      - name: Verify interactive Draft boundary
        shell: bash
        env:
          SPECIAL_ID: ${{ steps.edition.outputs.special_id }}
        run: |
          set -euo pipefail
          python control-src/scripts/raw_provenance.py --repo-root worktree --issue-id "$SPECIAL_ID" check
          python - "$SPECIAL_ID" <<'PY'
          import json,sys
          issue=sys.argv[1]
          state=json.load(open(f'worktree/sources/{issue}/pipeline-state.json',encoding='utf-8'))
          assert state['lifecycle_state']=='ARCHITECTURE_ESTABLISHED', state['lifecycle_state']
          assert state['gates']['issue_architecture']=='passed'
          assert state['gates']['article_draft']=='pending'
          PY
          test -s "worktree/sources/${SPECIAL_ID}/drafting/packages/v0.1/draft-package-manifest.json"
          test -s "worktree/config/prompts/editorial/article-drafting-v0.1.md"
          test -d "worktree/sources/${SPECIAL_ID}/drafting/interactive-overrides-v0.1"
          mkdir -p "worktree/sources/${SPECIAL_ID}/drafting/runs"
      - name: Accept, validate, and render complete interactive Draft set
        shell: bash
        env:
          SPECIAL_ID: ${{ steps.edition.outputs.special_id }}
          REVIEW_REFERENCE: ${{ inputs.review_reference }}
        run: |
          set -euo pipefail
          generated_at=$(python - <<'PY'
          from datetime import datetime
          from zoneinfo import ZoneInfo
          print(datetime.now(ZoneInfo('Asia/Tokyo')).isoformat(timespec='seconds'))
          PY
          )
          PYTHONPATH=control-src python control-src/scripts/accept_special_interactive_drafts.py \
            --repo-root worktree \
            --issue-id "$SPECIAL_ID" \
            --package-dir "sources/${SPECIAL_ID}/drafting/packages/v0.1" \
            --overrides-dir "sources/${SPECIAL_ID}/drafting/interactive-overrides-v0.1" \
            --prompt "config/prompts/editorial/article-drafting-v0.1.md" \
            --provider "OpenAI" \
            --model "GPT-5.6 Sol" \
            --invocation "interactive ChatGPT project drafting; no paid inference-provider API" \
            --generated-at "$generated_at" \
            --run-reference "$REVIEW_REFERENCE" \
            > interactive-draft-acceptance.json
      - name: Verify accepted state
        shell: bash
        env:
          SPECIAL_ID: ${{ steps.edition.outputs.special_id }}
        run: |
          set -euo pipefail
          python - "$SPECIAL_ID" <<'PY'
          import json,sys,pathlib
          issue=sys.argv[1]
          root=pathlib.Path('worktree')/'sources'/issue
          state=json.load(open(root/'pipeline-state.json',encoding='utf-8'))
          assert state['lifecycle_state']=='DRAFT_COMPLETE', state['lifecycle_state']
          assert state['gates']['article_draft']=='passed'
          prov=state['provenance']['article_draft']
          run=pathlib.Path('worktree')/prov['result_set_path']
          acceptance=json.load(open(run/'acceptance.json',encoding='utf-8'))
          assert acceptance['article_draft_count']==6, acceptance
          assert len(acceptance['results'])==6
          assert all((run/row['draft_path']).is_file() for row in acceptance['results'])
          assert all((run/row['tex_path']).is_file() for row in acceptance['results'])
          PY
      - name: Commit validated Draft results and renders
        working-directory: worktree
        shell: bash
        env:
          SPECIAL_ID: ${{ steps.edition.outputs.special_id }}
          WORK_BRANCH: ${{ steps.edition.outputs.work_branch }}
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "sources/${SPECIAL_ID}/pipeline-state.json" "sources/${SPECIAL_ID}/drafting/runs"
          git diff --cached --quiet && exit 0
          git commit -m "Accept validated interactive Drafts for ${SPECIAL_ID}"
          git push origin "HEAD:${WORK_BRANCH}"
      - name: Upload Draft acceptance audit
        uses: actions/upload-artifact@v7
        with:
          name: special-interactive-drafts-${{ inputs.special_slug }}
          path: interactive-draft-acceptance.json
          if-no-files-found: error
          retention-days: 14
