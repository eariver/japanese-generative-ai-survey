name: One-shot fix Special final spacing recovery re-entry

on:
  push:
    branches:
      - fix/special-final-spacing-reentrant

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/special-final-spacing-reentrant
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Make geometry recovery re-entrant
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p=Path('scripts/revise_special_final_spacing_recovery.py')
          text=p.read_text(encoding='utf-8')
          old='''    geometry_re = re.compile(r"\\\\geometry\\{margin=22mm,headsep=5mm,footskip=10mm\\}")\n'''
          new='''    geometry_re = re.compile(\n        r"\\\\geometry\\{(?:margin=22mm|left=22mm,right=22mm,"\n        r"top=(?P<vertical>\\d+(?:\\.\\d+)?)mm,bottom=(?P=vertical)mm),"\n        r"headsep=5mm,footskip=10mm\\}"\n    )\n'''
          if text.count(old) != 1:
              raise SystemExit(f'geometry anchor count={text.count(old)}')
          p.write_text(text.replace(old,new,1),encoding='utf-8')
          PY
          python -m py_compile scripts/revise_special_final_spacing_recovery.py
          python - <<'PY'
          import re
          from pathlib import Path
          text=Path('scripts/revise_special_final_spacing_recovery.py').read_text(encoding='utf-8')
          scope={}
          exec(compile(text,'script','exec'),scope)
          # Compile-equivalent direct pattern coverage by extracting the function source contract.
          pattern=re.compile(
              r"\\geometry\{(?:margin=22mm|left=22mm,right=22mm,"
              r"top=(?P<vertical>\d+(?:\.\d+)?)mm,bottom=(?P=vertical)mm),"
              r"headsep=5mm,footskip=10mm\}"
          )
          assert pattern.fullmatch(r'\geometry{margin=22mm,headsep=5mm,footskip=10mm}')
          assert pattern.fullmatch(r'\geometry{left=22mm,right=22mm,top=30mm,bottom=30mm,headsep=5mm,footskip=10mm}')
          assert pattern.fullmatch(r'\geometry{left=22mm,right=22mm,top=32mm,bottom=32mm,headsep=5mm,footskip=10mm}')
          assert not pattern.fullmatch(r'\geometry{left=22mm,right=22mm,top=30mm,bottom=31mm,headsep=5mm,footskip=10mm}')
          PY
          git diff --check
      - name: Commit implementation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/revise_special_final_spacing_recovery.py
          git commit -m 'Make Special final spacing recovery re-entrant'
          git push origin HEAD:fix/special-final-spacing-reentrant
