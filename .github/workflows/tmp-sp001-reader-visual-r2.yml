name: Temporary SP001 reader visual render r2

on:
  push:
    branches:
      - transport/sp001-reader-visual-r2

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Install renderer
        run: python -m pip install --quiet pymupdf pillow
      - name: Render exact repository PDF
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import fitz
          from PIL import Image, ImageDraw
          from pathlib import Path
          pdf=Path('surveys/special/SP001/main.pdf')
          out=Path('/tmp/sp001-visual-r2')
          out.mkdir(parents=True, exist_ok=True)
          doc=fitz.open(pdf)
          thumbs=[]
          for i,page in enumerate(doc):
              pix=page.get_pixmap(matrix=fitz.Matrix(1.5,1.5), alpha=False)
              img=Image.frombytes('RGB',[pix.width,pix.height],pix.samples)
              img.save(out/f'page-{i+1:02d}.png','PNG',optimize=True)
              thumb=img.copy(); thumb.thumbnail((280,400))
              canvas=Image.new('RGB',(300,435),'white')
              canvas.paste(thumb,((300-thumb.width)//2,10))
              ImageDraw.Draw(canvas).text((10,415),f'Page {i+1}',fill='black')
              thumbs.append(canvas)
          cols=4
          rows=(len(thumbs)+cols-1)//cols
          sheet=Image.new('RGB',(cols*300,rows*435),(235,235,235))
          for i,im in enumerate(thumbs): sheet.paste(im,((i%cols)*300,(i//cols)*435))
          sheet.save(out/'contact-sheet.png','PNG',optimize=True)
          print(f'pages={len(doc)}')
          PY
      - name: Upload exact-PDF review renders
        uses: actions/upload-artifact@v4
        with:
          name: sp001-reader-visual-renders-r2
          path: /tmp/sp001-visual-r2/*.png
          if-no-files-found: error
          retention-days: 1
