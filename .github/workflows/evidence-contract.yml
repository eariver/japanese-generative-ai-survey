name: Evidence contract CI

on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/build_evidence_tasks.py'
      - 'scripts/prepare_evidence_run.py'
      - 'scripts/accept_evidence_results.py'
      - 'scripts/validate_evidence_run.py'
      - 'scripts/merge_evidence_runs.py'
      - 'tests/test_build_evidence_tasks.py'
      - 'tests/test_prepare_evidence_run.py'
      - 'tests/test_accept_evidence_results.py'
      - 'tests/test_validate_evidence_run.py'
      - 'tests/test_merge_evidence_runs.py'
      - 'schemas/evidence-*.schema.json'
      - 'config/prompts/evidence/**'
      - '.github/workflows/evidence-contract.yml'
      - '.github/workflows/prepare-weekly-evidence.yml'
  pull_request:
    paths:
      - 'scripts/build_evidence_tasks.py'
      - 'scripts/prepare_evidence_run.py'
      - 'scripts/accept_evidence_results.py'
      - 'scripts/validate_evidence_run.py'
      - 'scripts/merge_evidence_runs.py'
      - 'tests/test_build_evidence_tasks.py'
      - 'tests/test_prepare_evidence_run.py'
      - 'tests/test_accept_evidence_results.py'
      - 'tests/test_validate_evidence_run.py'
      - 'tests/test_merge_evidence_runs.py'
      - 'schemas/evidence-*.schema.json'
      - 'config/prompts/evidence/**'
      - '.github/workflows/evidence-contract.yml'
      - '.github/workflows/prepare-weekly-evidence.yml'

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Validate all Evidence schemas
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r schema; do
            echo "Validating ${schema}"
            python -m json.tool "${schema}" >/dev/null
          done < <(find schemas -maxdepth 1 -name 'evidence-*.schema.json' -type f | sort)

      - name: Run Evidence contract tests
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest \
            tests.test_build_evidence_tasks \
            tests.test_prepare_evidence_run \
            tests.test_accept_evidence_results \
            tests.test_validate_evidence_run \
            tests.test_merge_evidence_runs \
            -v
