name: SP001 quality validation

on:
  pull_request:
    branches:
      - special/SP001-v2-work

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout quality branch
        uses: actions/checkout@v6
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Core v2 dependencies
        run: python -m pip install -r config/survey-production-v2-requirements.txt
      - name: Build and prevalidate exact quality bundle
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=. python - <<'PY'
          import datetime as dt
          import pathlib
          from scripts import survey_production_v2 as core
          from scripts import survey_quality_v2 as quality
          from scripts import survey_stage_validation_v2 as stage

          root=pathlib.Path('.').resolve()
          issue='SP001'
          source=root/'sources/SP001/publication/v2/validated-source-manifest.json'
          pdf=root/'sources/SP001/publication/v2/SP001-publication-preview.pdf'
          profile=root/'sources/SP001/production-profile.json'
          state=root/'sources/SP001/production-state.json'
          out=root/'sources/SP001/publication/v2/quality-regression-bundle-v2.json'
          expected_pdf='8a363a33db80f55a047a8d6cdfecedb196f380939a3d40e68e3c3d21aded2764'
          if core.sha256_file(pdf) != expected_pdf:
              raise SystemExit('final visual-review PDF SHA drift before quality binding')
          preflight=core.load_json(root/'sources/SP001/publication/v2/quality/pdf-preflight.json')
          if preflight.get('status')!='PASS' or preflight.get('pdf_sha256')!=expected_pdf or preflight.get('page_count')!=11:
              raise SystemExit('PDF preflight authority differs from final reviewed PDF')
          now=dt.datetime.now(dt.timezone.utc)
          recorded=core.iso_utc(now)
          det={
            'SUBJECT_ENTITY_PROPERTY_BINDING':'sources/SP001/publication/v2/quality/subject-entity-property-binding.json',
            'IDENTIFIER_PRESERVATION':'sources/SP001/publication/v2/quality/identifier-preservation.json',
            'PDF_PREFLIGHT':'sources/SP001/publication/v2/quality/pdf-preflight.json',
            'EMPTY_WRAPPER_SUPPRESSION':'sources/SP001/publication/v2/quality/empty-wrapper-suppression.json',
          }
          evidence={
            'SOURCE_SPECIFIC_FAIL_CLOSED_NOTES':'Reader-facing scope and per-section claim-boundary boxes preserve source-specific qualification: vendor/author efficiency and capability claims remain artifact-bound; Kimi 2023 chronology remains secondary-qualified; X/community runtime and license-friction observations are not promoted to technical facts; incompatible cross-family benchmark ranking remains excluded.',
            'BIBLIOGRAPHY_METADATA':'The generated bibliography contains 20 cited accepted Evidence artifacts. Each entry carries canonical title, organization/author label, canonical URL, retrieval date 2026-08-22, Evidence status, and materiality; HOLD/NEEDS_MORE Discovery records are excluded from factual citation support.',
            'POST_TRANSFORM_SEMANTIC_REVALIDATION':'The publication transform revalidated all seven established Draft Results and Profile Synthesis before rendering. The final summary synthesizes only already established lineages/boundaries, and the typography repair changes cover hyphenation only; no new external factual claim was introduced by rendering.',
            'THEMATIC_RESEARCH_CLOSURE':'The final issue closes all approved thematic dimensions through distinct GLM, Qwen, DeepSeek, and Kimi lineages, the MiniMax/Yi/Baichuan parallel or bridge context, efficiency/serving and developer distribution, Open Weight/license boundaries, and an explicit issue-level synthesis.',
            'THEMATIC_HISTORICAL_ATTRIBUTION':'Version-specific attribution survives into publication: later GLM/Qwen/DeepSeek/Kimi properties are not projected backward; Kimi 2023 remains explicitly secondary-source qualified; current MiniMax/Yi/Baichuan roles are not rewritten as a single continuous frontier lineage.',
            'TOC_HIERARCHY':'Exact PDF SHA 8a363a33db80f55a047a8d6cdfecedb196f380939a3d40e68e3c3d21aded2764, page 2: TOC visibly lists 本号について plus numbered sections 1-8 in reading order, with この号の総括 as section 8 on page 10; hierarchy and page references are legible and aligned.',
            'TECHNICAL_NOTES_TAIL_NEEDSPACE':'Exact 11-page render at 170 DPI shows every claim-boundary/technical-note-style tail wholly contained with its surrounding section; no orphaned heading, clipped box, or tail collision occurs on pages 3-9, and References begins cleanly on page 11 after the summary.',
            'LONGFORM_PAGE_BALANCE':'Exact rendered pages 1-11 were visually inspected. Cover, frontmatter/TOC, seven one-page thematic sections, final issue synthesis, and References form a coherent longform rhythm; dense pages remain readable with no overlap/clipping, while whitespace is intentional rather than caused by broken pagination.',
          }
          kinds={
            'SUBJECT_ENTITY_PROPERTY_BINDING':'DETERMINISTIC',
            'IDENTIFIER_PRESERVATION':'DETERMINISTIC',
            'SOURCE_SPECIFIC_FAIL_CLOSED_NOTES':'AGENT_SEMANTIC',
            'BIBLIOGRAPHY_METADATA':'AGENT_SEMANTIC',
            'POST_TRANSFORM_SEMANTIC_REVALIDATION':'AGENT_SEMANTIC',
            'PDF_PREFLIGHT':'DETERMINISTIC',
            'THEMATIC_RESEARCH_CLOSURE':'AGENT_SEMANTIC',
            'THEMATIC_HISTORICAL_ATTRIBUTION':'AGENT_SEMANTIC',
            'EMPTY_WRAPPER_SUPPRESSION':'DETERMINISTIC',
            'TOC_HIERARCHY':'AGENT_VISUAL',
            'TECHNICAL_NOTES_TAIL_NEEDSPACE':'AGENT_VISUAL',
            'LONGFORM_PAGE_BALANCE':'AGENT_VISUAL',
          }
          checks=[]
          for check_id,kind in kinds.items():
              if kind=='DETERMINISTIC':
                  path=root/det[check_id]
                  result={'path':det[check_id],'sha256':core.sha256_file(path)}
                  ev=f'Exact deterministic result {det[check_id]} validates the final source/PDF authority.'
                  executor='Core v2 deterministic publication preflight'
              else:
                  result=None
                  ev=evidence[check_id]
                  executor='ChatGPT GPT-5.6 Sol'
              checks.append({'check_id':check_id,'kind':kind,'status':'PASS','executor':executor,'evidence':ev,'recorded_at':recorded,'result':result})
          quality.build_bundle(root,issue,source,pdf,checks,out,production_profile_path=profile)
          quality.validate_bundle(root,out,issue_id=issue)
          cfg=core.load_json(root/core.DEFAULT_CONFIG)
          tmp=root/'sources/SP001/orchestration/v2/validation/DRAFT_COMPLETE.precheck.json'
          stage.validate_stage(root,cfg,state,{
              'validated-source':source,
              'publication-pdf':pdf,
              'quality-regression-bundle':out,
          },tmp,now)
          tmp.unlink()
          print('SP001 quality bundle and DRAFT_COMPLETE stage prevalidation PASS')
          PY
      - name: Persist quality authority only
        shell: bash
        env:
          PUSH_BRANCH: ${{ github.head_ref }}
        run: |
          set -euo pipefail
          rm -f .github/workflows/sp001-quality-validation.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add sources/SP001 .github/workflows/sp001-quality-validation.yml
          git commit -m 'Establish SP001 Core v2 quality regression bundle'
          git push origin "HEAD:${PUSH_BRANCH}"
