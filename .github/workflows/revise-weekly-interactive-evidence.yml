name: Revise Weekly interactive Evidence pre-selection

on:
  workflow_dispatch:
    inputs:
      issue_id:
        description: Weekly issue ID (YYYY-Www)
        required: true
        type: string
      prior_evidence_run_sha:
        description: Accepted Evidence result-set SHA to supersede
        required: true
        type: string
      review_reference:
        description: Evidence revision review reference
        required: true
        type: string

permissions:
  contents: write
  actions: read

concurrency:
  group: weekly-interactive-evidence-${{ inputs.issue_id }}
  cancel-in-progress: false

jobs:
  evidence-revision:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout current control code
        uses: actions/checkout@v6
        with:
          ref: main
          path: control-src
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Resolve Weekly work branch
        id: issue
        shell: bash
        env:
          ISSUE_ID: ${{ inputs.issue_id }}
        run: |
          set -euo pipefail
          if ! [[ "$ISSUE_ID" =~ ^[0-9]{4}-W[0-9]{2}$ ]]; then
            echo '::error::issue_id must use YYYY-Www form'
            exit 2
          fi
          echo "work_branch=weekly/${ISSUE_ID}-work" >> "$GITHUB_OUTPUT"

      - name: Checkout Weekly work branch
        uses: actions/checkout@v6
        with:
          ref: ${{ steps.issue.outputs.work_branch }}
          path: worktree
          fetch-depth: 0

      - name: Verify pre-selection revision boundary and resolve prior package basis
        id: prior
        shell: bash
        env:
          ISSUE_ID: ${{ inputs.issue_id }}
          PRIOR_SHA: ${{ inputs.prior_evidence_run_sha }}
        run: |
          set -euo pipefail
          python control-src/scripts/raw_provenance.py --repo-root worktree --issue-id "$ISSUE_ID" check
          state="worktree/sources/${ISSUE_ID}/pipeline-state.json"
          prior="worktree/sources/${ISSUE_ID}/evidence/runs/${PRIOR_SHA}/acceptance.json"
          review="worktree/sources/${ISSUE_ID}/evidence/interactive-review-v0.1.json"
          test -s "$state"
          test -s "$prior"
          test -s "$review"
          python - "$state" "$prior" "$review" "$PRIOR_SHA" "$GITHUB_OUTPUT" <<'PY'
          import json,re,sys
          state=json.load(open(sys.argv[1],encoding='utf-8'))
          prior=json.load(open(sys.argv[2],encoding='utf-8'))
          review=json.load(open(sys.argv[3],encoding='utf-8'))
          prior_sha=sys.argv[4]; output=sys.argv[5]
          if not re.fullmatch(r'[0-9a-f]{64}', prior_sha):
              raise SystemExit('prior Evidence SHA must be lowercase SHA-256')
          assert state['lifecycle_state']=='EVIDENCE_REVIEWED', state['lifecycle_state']
          assert state['gates']['evidence_normalized']=='passed'
          assert state['gates']['candidate_selection']=='pending'
          assert state['gates']['issue_architecture']=='pending'
          assert prior['status']=='ACCEPTED' and prior['result_set_sha256']==prior_sha
          pkg=prior['evidence_package']
          assert review['issue_id']==state['issue_id']
          assert review['screening_run_sha']==pkg['screening_result_set_sha256']
          with open(output,'a',encoding='utf-8') as fh:
              fh.write(f"screening_sha={pkg['screening_result_set_sha256']}\n")
              fh.write(f"source_ref={pkg['source_ref']}\n")
              fh.write(f"source_commit={pkg['source_commit_sha']}\n")
              fh.write(f"pipeline_state_sha={pkg['pipeline_state_sha256']}\n")
              fh.write(f"package_manifest_sha={pkg['package_manifest_sha256']}\n")
              fh.write(f"review_path={sys.argv[3]}\n")
          PY

      - name: Checkout exact prior Evidence basis commit
        uses: actions/checkout@v6
        with:
          ref: ${{ steps.prior.outputs.source_commit }}
          path: basis
          fetch-depth: 1

      - name: Rebuild and verify exact prior Evidence package
        id: package
        shell: bash
        env:
          ISSUE_ID: ${{ inputs.issue_id }}
          SCREENING_SHA: ${{ steps.prior.outputs.screening_sha }}
          SOURCE_REF: ${{ steps.prior.outputs.source_ref }}
          SOURCE_COMMIT: ${{ steps.prior.outputs.source_commit }}
          PIPELINE_STATE_SHA: ${{ steps.prior.outputs.pipeline_state_sha }}
          PACKAGE_MANIFEST_SHA: ${{ steps.prior.outputs.package_manifest_sha }}
        run: |
          set -euo pipefail
          basis_state="basis/sources/${ISSUE_ID}/pipeline-state.json"
          test -s "$basis_state"
          test "$(sha256sum "$basis_state" | cut -d' ' -f1)" = "$PIPELINE_STATE_SHA"
          rm -rf revision-package
          PYTHONPATH=basis python basis/scripts/prepare_evidence_run.py \
            --repo-root basis --output-root revision-package --issue-id "$ISSUE_ID" \
            --screening-run-sha "$SCREENING_SHA" --source-ref "$SOURCE_REF" --source-commit "$SOURCE_COMMIT" >/dev/null
          test "$(sha256sum revision-package/evidence-execution-package.json | cut -d' ' -f1)" = "$PACKAGE_MANIFEST_SHA"
          echo "basis_state=$basis_state" >> "$GITHUB_OUTPUT"

      - name: Generate, validate, and accept append-only Evidence revision
        shell: bash
        env:
          ISSUE_ID: ${{ inputs.issue_id }}
          PRIOR_SHA: ${{ inputs.prior_evidence_run_sha }}
          REVIEW_PATH: ${{ steps.prior.outputs.review_path }}
          BASIS_STATE: ${{ steps.package.outputs.basis_state }}
          REVIEW_REFERENCE: ${{ inputs.review_reference }}
        run: |
          set -euo pipefail
          PYTHONPATH=control-src python control-src/scripts/revise_weekly_interactive_evidence.py \
            --repo-root worktree --issue-id "$ISSUE_ID" --prior-evidence-run-sha "$PRIOR_SHA" \
            --package-root revision-package --basis-state "$BASIS_STATE" --review "$REVIEW_PATH" \
            --review-reference "$REVIEW_REFERENCE" --audit-output evidence-revision-audit.json

      - name: Assert pipeline state unchanged and commit revision
        working-directory: worktree
        shell: bash
        env:
          ISSUE_ID: ${{ inputs.issue_id }}
          WORK_BRANCH: ${{ steps.issue.outputs.work_branch }}
        run: |
          set -euo pipefail
          git diff --exit-code -- "sources/${ISSUE_ID}/pipeline-state.json"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "sources/${ISSUE_ID}/evidence"
          git diff --cached --quiet && exit 0
          git commit -m "Revise interactive Evidence for ${ISSUE_ID} before Selection"
          git push origin "HEAD:${WORK_BRANCH}"

      - name: Upload Evidence revision audit
        uses: actions/upload-artifact@v7
        with:
          name: weekly-interactive-evidence-revision-${{ inputs.issue_id }}
          path: evidence-revision-audit.json
          if-no-files-found: error
          retention-days: 14
