name: Special interactive Evidence contract

on:
  push:
    paths:
      - 'scripts/run_special_interactive_evidence.py'
      - 'tests/test_special_interactive_evidence.py'
      - '.github/workflows/apply-special-interactive-evidence.yml'
      - '.github/workflows/special-interactive-evidence-contract.yml'
  pull_request:
    paths:
      - 'scripts/run_special_interactive_evidence.py'
      - 'tests/test_special_interactive_evidence.py'
      - '.github/workflows/apply-special-interactive-evidence.yml'
      - '.github/workflows/special-interactive-evidence-contract.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest tests.test_special_interactive_evidence -v
      - run: python -m py_compile scripts/run_special_interactive_evidence.py
