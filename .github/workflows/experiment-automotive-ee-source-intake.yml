name: Experiment - Automotive E/E Source Intake

on:
  push:
    branches:
      - experiment/automotive-ee-architecture-special
    paths:
      - "experiments/automotive-ee-architecture/source-intake-profile.json"
      - "experiments/automotive-ee-architecture/source-intake-plan.json"
      - "experiments/automotive-ee-architecture/profiled_source_intake.py"
      - "experiments/automotive-ee-architecture/profiled_screening_index.py"
      - "experiments/automotive-ee-architecture/evidence-profile.json"
      - "experiments/automotive-ee-architecture/primary-source-verification-v0.1.md"
      - "experiments/automotive-ee-architecture/profiled_evidence_contract.py"
      - "experiments/automotive-ee-architecture/test_profiled_evidence_contract.py"
      - ".github/workflows/experiment-automotive-ee-source-intake.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  source-intake:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout experiment branch
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Test profiled Evidence contract boundary
        run: |
          set -euo pipefail
          python experiments/automotive-ee-architecture/test_profiled_evidence_contract.py

      - name: Run profiled Source Intake
        run: |
          set -euo pipefail
          OUT="${RUNNER_TEMP}/automotive-ee-source-intake"
          mkdir -p "$OUT"
          python experiments/automotive-ee-architecture/profiled_source_intake.py \
            --repo-root . \
            --profile experiments/automotive-ee-architecture/source-intake-profile.json \
            --plan experiments/automotive-ee-architecture/source-intake-plan.json \
            --output-root "$OUT" \
            --collector all

      - name: Dry-run canonical Screening normalizer
        run: |
          set -euo pipefail
          OUT="${RUNNER_TEMP}/automotive-ee-source-intake"
          SCREEN="$OUT/sources/SP-automotive-ee-architecture-2023-2026/screening/base"
          python scripts/build_screening_index.py \
            --input-root "$OUT" \
            --output-dir "$SCREEN" \
            --issue-id SP-automotive-ee-architecture-2023-2026

      - name: Run page-role profiled Screening normalizer
        run: |
          set -euo pipefail
          OUT="${RUNNER_TEMP}/automotive-ee-source-intake"
          SCREEN="$OUT/sources/SP-automotive-ee-architecture-2023-2026/screening/profiled"
          python experiments/automotive-ee-architecture/profiled_screening_index.py \
            --input-root "$OUT" \
            --output-dir "$SCREEN" \
            --issue-id SP-automotive-ee-architecture-2023-2026 \
            --profile experiments/automotive-ee-architecture/source-intake-profile.json

      - name: Build profiled Evidence contract probe
        run: |
          set -euo pipefail
          OUT="${RUNNER_TEMP}/automotive-ee-source-intake"
          python experiments/automotive-ee-architecture/profiled_evidence_contract.py \
            --repo-root . \
            --profile experiments/automotive-ee-architecture/evidence-profile.json \
            --output-root "$OUT/evidence-contract"
          python -m json.tool "$OUT/evidence-contract/evidence-contract-manifest.json" >/dev/null
          python -m json.tool "$OUT/evidence-contract/contract/evidence-run.schema.json" >/dev/null
          python -m json.tool "$OUT/evidence-contract/contract/evidence-card.schema.json" >/dev/null

      - name: Build compact intake digest
        if: always()
        run: |
          OUT="${RUNNER_TEMP}/automotive-ee-source-intake"
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          out = Path(os.environ["RUNNER_TEMP"]) / "automotive-ee-source-intake"
          issue = "SP-automotive-ee-architecture-2023-2026"
          report_path = out / "source-intake-report.json"
          report = json.loads(report_path.read_text(encoding="utf-8")) if report_path.exists() else None

          def screening_manifest(name: str):
              path = out / "sources" / issue / "screening" / name / "screening-manifest.json"
              return json.loads(path.read_text(encoding="utf-8")) if path.exists() else None

          canonical_screening = screening_manifest("base")
          profiled_screening = screening_manifest("profiled")
          evidence_contract_path = out / "evidence-contract" / "evidence-contract-manifest.json"
          evidence_contract = json.loads(evidence_contract_path.read_text(encoding="utf-8")) if evidence_contract_path.exists() else None

          def newest_summary(collector: str):
              paths = sorted((out / "sources" / issue / "collectors" / collector / "runs").glob("*/summary.json"))
              if not paths:
                  return None
              return json.loads(paths[-1].read_text(encoding="utf-8"))

          def screening_digest(value):
              if value is None:
                  return None
              return {
                  "record_count": value.get("record_count"),
                  "counts_by_source_type": value.get("counts_by_source_type"),
                  "batch_count": value.get("batch_count"),
                  "profiled_item_page_count": value.get("profiled_item_page_count"),
                  "screening_index_sha256": (value.get("screening_index") or {}).get("sha256"),
              }

          arxiv = newest_summary("arxiv")
          github = newest_summary("github-releases")
          official = newest_summary("official-pages")
          digest = {
              "schema_version": "1.0",
              "issue_id": issue,
              "purpose": "EXPERIMENTAL_SOURCE_INTAKE_DIGEST",
              "workflow_run_id": int(os.environ["GITHUB_RUN_ID"]),
              "workflow_run_attempt": int(os.environ["GITHUB_RUN_ATTEMPT"]),
              "commit_sha": os.environ["GITHUB_SHA"],
              "raw_storage": "GITHUB_ACTIONS_ARTIFACT_ONLY",
              "screening_storage": "GITHUB_ACTIONS_ARTIFACT_ONLY",
              "production_ai_pipeline_modified": False,
              "report": report,
              "screening": {
                  "canonical": screening_digest(canonical_screening),
                  "profiled": screening_digest(profiled_screening),
              },
              "evidence_contract": None if evidence_contract is None else {
                  "profile_id": evidence_contract.get("profile_id"),
                  "artifact_types": evidence_contract.get("artifact_types"),
                  "production_files_modified": evidence_contract.get("production_files_modified"),
                  "generated": evidence_contract.get("generated"),
              },
              "counts": {
                  "arxiv_unique_entries": None if arxiv is None else arxiv.get("unique_entry_count"),
                  "arxiv_query_success_count": None if arxiv is None else len(arxiv.get("queries", [])),
                  "arxiv_error_count": None if arxiv is None else len(arxiv.get("errors", [])),
                  "github_repository_success_count": None if github is None else len(github.get("repositories", [])),
                  "github_matching_release_count": None if github is None else github.get("matching_release_count"),
                  "github_error_count": None if github is None else len(github.get("errors", [])),
                  "official_page_success_count": None if official is None else len(official.get("pages", [])),
                  "official_error_count": None if official is None else len(official.get("errors", [])),
              },
              "errors": {
                  "arxiv": [] if arxiv is None else arxiv.get("errors", []),
                  "github": [] if github is None else github.get("errors", []),
                  "official": [] if official is None else official.get("errors", []),
              },
          }
          dest = Path("sources") / issue / "imports" / "source-intake" / "experiment-latest-digest.json"
          dest.parent.mkdir(parents=True, exist_ok=True)
          dest.write_text(json.dumps(digest, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
          print(json.dumps(digest, ensure_ascii=False, indent=2))
          PY

      - name: Upload immutable experiment artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: automotive-ee-source-intake-${{ github.run_id }}
          path: ${{ runner.temp }}/automotive-ee-source-intake/
          if-no-files-found: error
          retention-days: 30

      - name: Commit compact digest to experiment branch
        if: always()
        run: |
          set -euo pipefail
          DIGEST="sources/SP-automotive-ee-architecture-2023-2026/imports/source-intake/experiment-latest-digest.json"
          if [[ ! -f "$DIGEST" ]]; then
            echo "Digest was not produced"
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$DIGEST"
          if git diff --cached --quiet; then
            echo "Digest unchanged"
          else
            git commit -m "experiment: record automotive E/E source intake digest [skip ci]"
            git push origin HEAD:experiment/automotive-ee-architecture-special
          fi

      - name: Confirm production boundary
        if: always()
        run: |
          echo "Production AI files intentionally untouched:"
          echo "  config/source-intake.json"
          echo "  config/prompts/screening/source-screening-v0.1.md"
          echo "  config/prompts/evidence/primary-source-verification-v0.1.md"
          echo "  scripts/source_intake.py"
          echo "  scripts/build_screening_index.py"
          echo "  scripts/build_evidence_tasks.py"
          echo "  scripts/prepare_evidence_run.py"
          echo "  schemas/screening-batch-result.schema.json"
          echo "  schemas/evidence-run.schema.json"
          echo "  schemas/evidence-card.schema.json"
          echo "  config/special-pipeline.json"
          echo "  scripts/special_pipeline.py"
