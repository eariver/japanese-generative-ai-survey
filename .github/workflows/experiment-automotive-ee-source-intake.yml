name: Experiment - Automotive E/E Source Intake

on:
  push:
    branches:
      - experiment/automotive-ee-architecture-special
    paths:
      - "experiments/automotive-ee-architecture/**"
      - ".github/workflows/experiment-automotive-ee-source-intake.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  source-intake:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout experiment branch
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run profiled Source Intake
        run: |
          set -euo pipefail
          OUT="${RUNNER_TEMP}/automotive-ee-source-intake"
          mkdir -p "$OUT"
          python experiments/automotive-ee-architecture/profiled_source_intake.py \
            --repo-root . \
            --profile experiments/automotive-ee-architecture/source-intake-profile.json \
            --plan experiments/automotive-ee-architecture/source-intake-plan.json \
            --output-root "$OUT" \
            --collector all

      - name: Dry-run canonical Screening normalizer
        run: |
          set -euo pipefail
          OUT="${RUNNER_TEMP}/automotive-ee-source-intake"
          SCREEN="$OUT/sources/SP-automotive-ee-architecture-2023-2026/screening/base"
          python scripts/build_screening_index.py \
            --input-root "$OUT" \
            --output-dir "$SCREEN" \
            --issue-id SP-automotive-ee-architecture-2023-2026

      - name: Build compact intake digest
        if: always()
        run: |
          OUT="${RUNNER_TEMP}/automotive-ee-source-intake"
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          out = Path(os.environ["RUNNER_TEMP"]) / "automotive-ee-source-intake"
          issue = "SP-automotive-ee-architecture-2023-2026"
          report_path = out / "source-intake-report.json"
          report = json.loads(report_path.read_text(encoding="utf-8")) if report_path.exists() else None
          screening_path = out / "sources" / issue / "screening" / "base" / "screening-manifest.json"
          screening = json.loads(screening_path.read_text(encoding="utf-8")) if screening_path.exists() else None

          def newest_summary(collector: str):
              paths = sorted((out / "sources" / issue / "collectors" / collector / "runs").glob("*/summary.json"))
              if not paths:
                  return None
              return json.loads(paths[-1].read_text(encoding="utf-8"))

          arxiv = newest_summary("arxiv")
          github = newest_summary("github-releases")
          official = newest_summary("official-pages")
          digest = {
              "schema_version": "1.0",
              "issue_id": issue,
              "purpose": "EXPERIMENTAL_SOURCE_INTAKE_DIGEST",
              "workflow_run_id": int(os.environ["GITHUB_RUN_ID"]),
              "workflow_run_attempt": int(os.environ["GITHUB_RUN_ATTEMPT"]),
              "commit_sha": os.environ["GITHUB_SHA"],
              "raw_storage": "GITHUB_ACTIONS_ARTIFACT_ONLY",
              "screening_storage": "GITHUB_ACTIONS_ARTIFACT_ONLY",
              "production_ai_pipeline_modified": False,
              "report": report,
              "screening": None if screening is None else {
                  "record_count": screening.get("record_count"),
                  "counts_by_source_type": screening.get("counts_by_source_type"),
                  "batch_count": screening.get("batch_count"),
                  "screening_index_sha256": (screening.get("screening_index") or {}).get("sha256"),
              },
              "counts": {
                  "arxiv_unique_entries": None if arxiv is None else arxiv.get("unique_entry_count"),
                  "arxiv_query_success_count": None if arxiv is None else len(arxiv.get("queries", [])),
                  "arxiv_error_count": None if arxiv is None else len(arxiv.get("errors", [])),
                  "github_repository_success_count": None if github is None else len(github.get("repositories", [])),
                  "github_matching_release_count": None if github is None else github.get("matching_release_count"),
                  "github_error_count": None if github is None else len(github.get("errors", [])),
                  "official_page_success_count": None if official is None else len(official.get("pages", [])),
                  "official_error_count": None if official is None else len(official.get("errors", [])),
              },
              "errors": {
                  "arxiv": [] if arxiv is None else arxiv.get("errors", []),
                  "github": [] if github is None else github.get("errors", []),
                  "official": [] if official is None else official.get("errors", []),
              },
          }
          dest = Path("sources") / issue / "imports" / "source-intake" / "experiment-latest-digest.json"
          dest.parent.mkdir(parents=True, exist_ok=True)
          dest.write_text(json.dumps(digest, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
          print(json.dumps(digest, ensure_ascii=False, indent=2))
          PY

      - name: Upload immutable experiment artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: automotive-ee-source-intake-${{ github.run_id }}
          path: ${{ runner.temp }}/automotive-ee-source-intake/
          if-no-files-found: error
          retention-days: 30

      - name: Commit compact digest to experiment branch
        if: always()
        run: |
          set -euo pipefail
          DIGEST="sources/SP-automotive-ee-architecture-2023-2026/imports/source-intake/experiment-latest-digest.json"
          if [[ ! -f "$DIGEST" ]]; then
            echo "Digest was not produced"
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$DIGEST"
          if git diff --cached --quiet; then
            echo "Digest unchanged"
          else
            git commit -m "experiment: record automotive E/E source intake digest [skip ci]"
            git push origin HEAD:experiment/automotive-ee-architecture-special
          fi

      - name: Confirm production boundary
        if: always()
        run: |
          echo "Production AI files intentionally untouched:"
          echo "  config/source-intake.json"
          echo "  scripts/source_intake.py"
          echo "  scripts/build_screening_index.py"
          echo "  config/special-pipeline.json"
          echo "  scripts/special_pipeline.py"
