name: SP-2020-Y Annual Preview Repair r4

on:
  push:
    branches:
      - special/2020-Y-work
    paths:
      - 'sources/SP-2020-Y/editorial/repair-trigger-v0.10.json'

permissions:
  contents: write

concurrency:
  group: sp-2020-y-annual-preview-repair-r4
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout current control code
        uses: actions/checkout@v6
        with:
          ref: main
          path: control-src
          fetch-depth: 1
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Checkout SP-2020-Y work branch
        uses: actions/checkout@v6
        with:
          ref: special/2020-Y-work
          path: worktree
          fetch-depth: 0
      - name: Verify repair boundary
        shell: bash
        run: |
          set -euo pipefail
          python control-src/scripts/raw_provenance.py --repo-root worktree --issue-id SP-2020-Y check
          python - <<'PY'
          import hashlib,json,pathlib
          root=pathlib.Path('worktree')
          state=json.load(open(root/'sources/SP-2020-Y/pipeline-state.json',encoding='utf-8'))
          assert state['lifecycle_state']=='RELEASE_CANDIDATE'
          assert state['gates']['latex_build']=='passed'
          assert state['gates']['visual_review']=='pending'
          assert state['gates']['freeze']=='pending'
          assert 'publication_preview' not in state.get('provenance',{})
          src=state['provenance']['validated_issue_source']
          assert src['source_version']=='v0.4'
          p=root/src['path']
          assert hashlib.sha256(p.read_bytes()).hexdigest()==src['sha256']
          chrono=state['provenance']['annual_chronology']
          assert int(chrono['event_count'])==28
          assert int(chrono['unresolved_date_count'])==0
          marker=json.load(open(root/'sources/SP-2020-Y/editorial/layout-revision-v0.5.json',encoding='utf-8'))
          assert marker['constraints']['new_external_evidence_allowed'] is False
          assert marker['constraints']['selected_evidence_only'] is True
          assert marker['constraints']['accepted_article_claims_changed'] is False
          PY
      - name: Repair source-specific Technical Notes
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=control-src python control-src/scripts/revise_special_annual_source_specific_notes_v5.py \
            --repo-root worktree --special-slug 2020-Y --issue-id SP-2020-Y --source-version v0.5 \
            > annual-source-specific-audit.json
          cat annual-source-specific-audit.json
      - name: Apply strict ordered Annual review repairs
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=control-src python control-src/scripts/revise_special_annual_review_sequence_generic_v3.py \
            --repo-root worktree --special-slug 2020-Y --issue-id SP-2020-Y --parent-source-version v0.5 \
            > annual-ordered-review-audit.json
          cat annual-ordered-review-audit.json
      - name: Verify all seven findings
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib,json,pathlib,re
          root=pathlib.Path('worktree')
          state=json.load(open(root/'sources/SP-2020-Y/pipeline-state.json',encoding='utf-8'))
          assert state['lifecycle_state']=='VALIDATED_DRAFT'
          assert state['gates']['latex_build']=='pending'
          assert state['gates']['visual_review']=='pending'
          assert state['gates']['freeze']=='pending'
          src=state['provenance']['validated_issue_source']
          assert src['source_version']=='v0.10'
          mp=root/src['path']
          assert hashlib.sha256(mp.read_bytes()).hexdigest()==src['sha256']
          m=json.load(open(mp,encoding='utf-8'))
          assert [x['step'] for x in m['ordered_review_repairs'][-5:]]==['54','78-140','271','272','122']
          sd=mp.parent

          # #139/#54: all 15 visible cards are source-specific and chronology-bound.
          reader=m['reader_facing_technical_notes']
          assert reader['generic_fallback_policy']=='forbidden-fail-closed'
          assert reader['generic_fallback_findings']==0
          assert reader['source_specific_detail_visible_card_count']==15
          assert reader['source_specific_detail_enrichment_count']==15
          notes=[]
          for a in m['articles']:
              if int(a.get('evidence_record_count') or 0)>0:
                  notes.append((sd/a['technical_notes_path']).read_text(encoding='utf-8'))
          text='\n'.join(notes)
          assert '時系列 & —' not in text
          assert not re.search(r'一次資料で「.+?」が2020年の生成AI技術記録に含まれることを確認できる',text)
          assert not re.search(r'種別\s*&\s*(?:OTHER|PRODUCT|[A-Z][A-Z0-9]+_[A-Z0-9_]+)\s*\\\\',text)

          # #271: zero-card wrappers are absent from publication main.
          assert m['issue_271']['suppressed_count']==2
          assert set(m['issue_271']['suppressed_zero_card_packages'])=={'annual-chronology','synthesis-transition-2021'}
          main=(sd/'main.tex').read_text(encoding='utf-8')
          for a in m['articles']:
              if int(a.get('evidence_record_count') or 0)==0 and a.get('technical_notes_path'):
                  token='\\input{'+pathlib.Path(a['technical_notes_path']).with_suffix('').as_posix()+'}'
                  assert token not in main, token

          # #272: preserve Q1-Q4 narrative and append 28 cited objective events.
          i272=m['issue_272']
          assert i272['q1_q4_narrative_preserved'] is True
          assert i272['dated_event_count']==28 and i272['cited_event_count']==28
          ca=next(a for a in m['articles'] if a['package_id']=='annual-chronology')
          narrative=sd/ca['layout_body_path']
          assert hashlib.sha256(narrative.read_bytes()).hexdigest()==i272['narrative_sha256']
          idx=(sd/i272['objective_index_path']).read_text(encoding='utf-8')
          assert idx.count('\\cite{')==28

          # #78/#140: every bibliography entry with a chronology locator uses that source's actual title; no repeated note.
          chrono=json.load(open(root/state['provenance']['annual_chronology']['path'],encoding='utf-8'))
          titles={e['locator']:e['title'] for e in chrono['events']}
          refs=(sd/m['references']['path']).read_text(encoding='utf-8')
          assert 'Primary source used for chronology and technical verification' not in refs
          entry_re=re.compile(r'@online\{[^,]+,\n(.*?)\n\}',re.S)
          mapped=0
          for em in entry_re.finditer(refs):
              body=em.group(1)
              um=re.search(r'\n?\s*url\s*=\s*\{([^}]*)\}',body)
              tm=re.search(r'\n?\s*title\s*=\s*\{(.*?)\},',body,re.S)
              if not um or not tm or um.group(1).strip() not in titles:
                  continue
              mapped+=1
              actual=titles[um.group(1).strip()].replace('&',r'\&')
              assert tm.group(1).strip()==actual,(um.group(1),tm.group(1),actual)
          assert mapped>=19
          assert 'Language Models are Few-Shot Learners' in refs
          assert 'Retrieval-Augmented Generation for Knowledge-Intensive NLP Tasks' in refs

          # #122: compact section-level TOC.
          assert m['issue_122']['toc_depth']==1
          assert m['issue_122']['toc_render_size']=='footnotesize'
          assert m['issue_122']['compact_rendering'] is True
          front=(sd/m['frontmatter']['path']).read_text(encoding='utf-8')
          assert '\\setcounter{tocdepth}{1}' in front and '\\footnotesize' in front
          print(json.dumps({'passed':True,'source_version':'v0.10','mapped_reference_titles':mapped},ensure_ascii=False))
          PY
      - name: Commit repaired source
        working-directory: worktree
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A surveys/special/2020-Y sources/SP-2020-Y
          git diff --cached --quiet && { echo 'No repair changes' >&2; exit 1; }
          git commit -m 'Repair SP-2020-Y Publication Preview findings'
          git push origin HEAD:special/2020-Y-work
      - name: Upload repair audits
        uses: actions/upload-artifact@v4
        with:
          name: sp-2020-y-annual-preview-v0.10
          path: |
            annual-source-specific-audit.json
            annual-ordered-review-audit.json
          retention-days: 14
