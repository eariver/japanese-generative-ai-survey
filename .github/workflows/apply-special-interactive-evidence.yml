name: Apply Special interactive Evidence

on:
  workflow_dispatch:
    inputs:
      special_slug:
        required: true
        type: string
      review_reference:
        required: true
        type: string

permissions:
  contents: write
  actions: read

concurrency:
  group: special-interactive-evidence-${{ inputs.special_slug }}
  cancel-in-progress: false

jobs:
  evidence:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout current control code
        uses: actions/checkout@v6
        with:
          ref: main
          path: control-src
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Resolve Special edition
        id: edition
        shell: bash
        env:
          SPECIAL_SLUG: ${{ inputs.special_slug }}
        run: |
          set -euo pipefail
          manifest="control-src/specials/${SPECIAL_SLUG}/edition.json"
          test -s "$manifest"
          python control-src/scripts/special_pipeline.py --config control-src/config/special-pipeline.json validate --manifest "$manifest"
          echo "special_id=$(python -c "import json; print(json.load(open('$manifest'))['special_id'])")" >> "$GITHUB_OUTPUT"
          echo "work_branch=$(python -c "import json; print(json.load(open('$manifest'))['paths']['work_branch'])")" >> "$GITHUB_OUTPUT"
      - name: Checkout Special work branch
        uses: actions/checkout@v6
        with:
          ref: ${{ steps.edition.outputs.work_branch }}
          path: worktree
          fetch-depth: 0
      - name: Verify state, Raw, and interactive Evidence file
        id: input
        shell: bash
        env:
          SPECIAL_ID: ${{ steps.edition.outputs.special_id }}
        run: |
          set -euo pipefail
          python control-src/scripts/raw_provenance.py --repo-root worktree --issue-id "$SPECIAL_ID" check
          path="worktree/sources/${SPECIAL_ID}/evidence/interactive-cards-v0.1.json"
          test -s "$path"
          python -m json.tool "$path" >/dev/null
          screening_sha="$(python -c "import json; print(json.load(open('$path'))['screening_run_sha'])")"
          state="worktree/sources/${SPECIAL_ID}/pipeline-state.json"
          python - "$state" <<'PY'
          import json,sys
          s=json.load(open(sys.argv[1],encoding='utf-8'))
          assert s['lifecycle_state']=='CANDIDATES_NORMALIZED', s['lifecycle_state']
          assert s['gates']['candidate_inventory']=='passed'
          assert s['gates']['evidence_normalized']=='pending'
          assert s['gates']['candidate_selection']=='pending'
          PY
          echo "cards_path=$path" >> "$GITHUB_OUTPUT"
          echo "screening_sha=$screening_sha" >> "$GITHUB_OUTPUT"
      - name: Generate, validate, and accept complete Evidence result set
        shell: bash
        env:
          SPECIAL_ID: ${{ steps.edition.outputs.special_id }}
          WORK_BRANCH: ${{ steps.edition.outputs.work_branch }}
          SCREENING_SHA: ${{ steps.input.outputs.screening_sha }}
          CARDS_PATH: ${{ steps.input.outputs.cards_path }}
          REVIEW_REFERENCE: ${{ inputs.review_reference }}
        run: |
          set -euo pipefail
          source_commit="$(git -C worktree rev-parse HEAD)"
          PYTHONPATH=control-src python control-src/scripts/run_special_interactive_evidence.py \
            --repo-root worktree --issue-id "$SPECIAL_ID" --screening-run-sha "$SCREENING_SHA" \
            --source-ref "$WORK_BRANCH" --source-commit "$source_commit" --cards "$CARDS_PATH" \
            --review-reference "$REVIEW_REFERENCE" --audit-output evidence-audit.json
      - name: Commit accepted Evidence set and state transition
        working-directory: worktree
        shell: bash
        env:
          SPECIAL_ID: ${{ steps.edition.outputs.special_id }}
          WORK_BRANCH: ${{ steps.edition.outputs.work_branch }}
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "sources/${SPECIAL_ID}/evidence" "sources/${SPECIAL_ID}/pipeline-state.json"
          git diff --cached --quiet && exit 0
          git commit -m "Accept interactive Evidence for ${SPECIAL_ID}"
          git push origin "HEAD:${WORK_BRANCH}"
      - name: Upload Evidence audit
        uses: actions/upload-artifact@v7
        with:
          name: special-interactive-evidence-${{ inputs.special_slug }}
          path: evidence-audit.json
          if-no-files-found: error
          retention-days: 14
