name: Run M05 Selection and Architecture once

on:
  pull_request:
    types: [synchronize]

permissions:
  contents: write
  actions: read

concurrency:
  group: special-selection-architecture-2026-M05-run-once
  cancel-in-progress: false

jobs:
  editorial:
    if: github.event.pull_request.number == 53 && github.event.pull_request.head.ref == 'special/2026-M05-work'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout current control code
        uses: actions/checkout@v6
        with:
          ref: main
          path: control-src
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Checkout Special work branch
        uses: actions/checkout@v6
        with:
          ref: special/2026-M05-work
          path: worktree
          fetch-depth: 0
      - name: Verify Human Gate basis
        shell: bash
        run: |
          set -euo pipefail
          python control-src/scripts/raw_provenance.py --repo-root worktree --issue-id SP-2026-M05 check
          python - <<'PY'
          import json, pathlib
          root=pathlib.Path('worktree/sources/SP-2026-M05')
          state=json.load(open(root/'pipeline-state.json',encoding='utf-8'))
          proposal=json.load(open(root/'editorial/candidate-selection-proposal-v0.1.json',encoding='utf-8'))
          assert state['lifecycle_state']=='EVIDENCE_REVIEWED', state['lifecycle_state']
          assert state['gates']['evidence_normalized']=='passed'
          assert state['gates']['candidate_selection']=='pending'
          assert proposal['status']=='PENDING_APPROVAL'
          assert proposal['basis']['evidence_result_set_sha256']=='f462ffab2beca5d361385a330d8c2e83a118115a11b5add2a75a274dc8af4650'
          assert proposal['selection_summary']['positive_selected']==26
          assert proposal['selection_summary']['FEATURE_CORE']+proposal['selection_summary']['SECTION_CORE']==15
          PY
      - name: Build reviewed Selection and Architecture decision
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, pathlib
          from datetime import datetime
          from zoneinfo import ZoneInfo
          root=pathlib.Path('worktree/sources/SP-2026-M05')
          proposal=json.load(open(root/'editorial/candidate-selection-proposal-v0.1.json',encoding='utf-8'))
          assignments=[]
          for row in proposal['selection_assignments']:
              if row['evidence_recommendation']=='CANDIDATE':
                  assignments.append({
                      'evidence_task_id':row['evidence_task_id'],
                      'role':row['role'],
                      'rationale':row['rationale'],
                  })
          assert len(assignments)==37, len(assignments)
          ids={row['evidence_task_id'] for row in assignments}
          def E(s):
              x='evidence:SP-2026-M05:'+s
              assert x in ids, x
              return x
          packages=[
            {
              'package_id':'frontier-models-may','title':'Frontier Models & Voice — モデル更新が利用面へ広がった5月','package_type':'FEATURE','page_target':7,
              'primary_evidence_task_ids':[E('item-official-feed-01a8b52eee8198f545c2-8346b492d8'),E('item-official-index-anthropic-news-afddcb8068'),E('item-official-index-google-gemini-api-re-d5b8ea25b2'),E('item-official-index-google-deepmind-blog-9b2b580695'),E('item-official-feed-24a3c172de4842007009-03f3682026')],
              'supporting_evidence_task_ids':[E('item-official-index-alibaba-model-studio-154c528d30'),E('item-official-feed-5c3d93bd7160f244287b-342f518305')],
              'editorial_angle':'GPT-5.5 Instant、Anthropic、Gemini/DeepMind、Alibaba、Realtime voiceを単純ランキングせず、モデル更新がAPI lifecycle・音声対話・提供形態へ広がった月として比較する。',
              'must_cover':['GPT-5.5 InstantとAnthropic May releasesのchronology','Gemini APIとDeepMindのMay lifecycle','voice model/APIとlow-latency servingの接続','Alibabaはsupporting ecosystem chronologyとして扱う','vendor capability claimを独立検証済み性能へ昇格しない']
            },
            {
              'package_id':'agents-runtime-may','title':'Agents & Runtime — Codexを安全に長く動かす実行環境','package_type':'SECTION','page_target':5,
              'primary_evidence_task_ids':[E('item-official-feed-66be1220771465af8b1a-7856302980'),E('item-official-feed-4a3442a5ca8c193564d3-64f2b96644'),E('item-official-index-kimi-code-whats-new-788743b9bb'),E('item-official-index-mistral-news-e5054b4c4c')],
              'supporting_evidence_task_ids':[E('item-arxiv-2605-26297v1-3ac98fa507')],
              'editorial_angle':'agentをmodelの付属機能ではなく、sandbox、権限、長時間workload、CLI/MCP統合を備えた実行環境として整理する。',
              'must_cover':['Running Codex safelyの運用境界','Windows sandboxの設計意図','Kimi Code CLIのMay lifecycle','Mistralのagent/MCP/workflow更新','agentic workload researchはauthor-reported supporting evidenceとして扱う']
            },
            {
              'package_id':'inference-serving-may','title':'Inference & Serving — cache・MoE・kernel・runtimeの最適化','package_type':'DEEP_DIVE','page_target':6,
              'primary_evidence_task_ids':[E('series-github-series-vllm-project-vllm-14c8073114'),E('series-github-series-sgl-project-sglang-e63ed0bdf0'),E('duplicate-hint-github-series-flashinfer-7f4c25e2bf')],
              'supporting_evidence_task_ids':[E('item-arxiv-2605-24022v1-46c9a2231e'),E('item-arxiv-2605-27081v1-5ebb44e7f0')],
              'editorial_angle':'vLLM・SGLang・FlashInferのMay releaseを主軸に、KV cache reuseとMoE expert reuse研究を補助線として、モデル外側の実行効率化を説明する。',
              'must_cover':['vLLM May release series','SGLang May release series','FlashInfer v0.6.12','Adaptive KV cache reuseはauthor claimとして扱う','ReMoEはmemory-constrained MoE inferenceのresearch complementとして扱う']
            },
            {
              'package_id':'agent-safety-security-may','title':'Agent Safety & Security — 記憶・retrieval・harnessが新しい攻撃面になる','package_type':'DEEP_DIVE','page_target':6,
              'primary_evidence_task_ids':[E('item-arxiv-2605-31042v1-c387077175'),E('item-arxiv-2605-29960v1-5f120301f7')],
              'supporting_evidence_task_ids':[E('item-arxiv-2605-29224v1-a99bec87b1'),E('item-arxiv-2605-30837v2-48975417a3')],
              'editorial_angle':'persistent control、memory poisoning、retrieval degradation、adaptive detector allocationを別々のthreat modelとして扱い、長時間agentの制御境界を整理する。',
              'must_cover':['prompt injectionからpersistent controlへの拡張','conversation経由のagent memory poisoning','retrieval relevanceとsafety alignmentの関係','SCOUTのadaptive detector allocation','異なる研究結果を単一のagent危険論へ潰さない']
            },
            {
              'package_id':'capability-evaluation-may','title':'Capability & Evaluation — benchmarkの外で能力をどう確かめるか','package_type':'FEATURE','page_target':5,
              'primary_evidence_task_ids':[E('item-official-feed-1c93d6c1c7251e5ff843-6aba32b1d0')],
              'supporting_evidence_task_ids':[E('item-official-feed-8c84b8422093501f7094-f577b525fa')],
              'editorial_angle':'離散幾何の具体的研究成果を、単なる能力自慢ではなく、standard benchmark外の能力と第三者評価の設計を考える入口として扱う。',
              'must_cover':['discrete geometry成果のfirst-party chronology','成果の解釈はOpenAI側の説明として明示','third-party evaluation playbookの位置付け','単一成功例を一般的な数学能力へ過剰一般化しない']
            },
            {
              'package_id':'paper-watch-may','title':'Paper Watch — agent評価・測定bias・unified multimodal','package_type':'PAPER_WATCH','page_target':2,
              'primary_evidence_task_ids':[E('item-arxiv-2605-27705v1-e4df13546d'),E('item-arxiv-2605-24217v2-b4a80388d7'),E('item-arxiv-2605-31604v4-2ad57a9c16')],
              'supporting_evidence_task_ids':[],
              'editorial_angle':'AgenticVBench、production inference benchmarkのmeasurement bias、Representation Forcingを短く並べ、5月の研究側で評価方法とmultimodal統合がどう動いたかを見る。',
              'must_cover':['AgenticVBenchはauthor-reported benchmark','measurement bias研究のmethodological significance','Representation Forcingのunified multimodal設計','3論文を独立再現済み結果として扱わない']
            },
            {
              'package_id':'frontmatter-may-overview','title':'May 2026 — 月の全体像','package_type':'FRONTMATTER','page_target':2,
              'primary_evidence_task_ids':[],'supporting_evidence_task_ids':[],
              'editorial_angle':'5月を個別ニュースの羅列ではなく、モデル更新とagent実行環境・serving・security・evaluationが同時に前進した月として導入する。',
              'must_cover':['coverage windowとretrospective視点','why this Specialをreader-facingに提示','6テーマの読み方','一次事実とvendor/project/author claimの区別']
            },
            {
              'package_id':'references-and-technical-notes','title':'References & Technical Notes','package_type':'REFERENCES','page_target':3,
              'primary_evidence_task_ids':[],'supporting_evidence_task_ids':[],
              'editorial_angle':'reader-facingな参照・Technical Notesとして、一次資料、Claim Boundary、調査時点とsource classの読み方を示す。',
              'must_cover':['primary sources','Claim Boundary','調査時点','Repository provenanceへの導線']
            }
          ]
          # drafting order should follow reader flow; frontmatter first, refs last
          order=['frontmatter-may-overview','frontier-models-may','agents-runtime-may','inference-serving-may','agent-safety-security-may','capability-evaluation-may','paper-watch-may','references-and-technical-notes']
          packages=sorted(packages,key=lambda p:order.index(p['package_id']))
          decision={
            'schema_version':'1.0','issue_id':'SP-2026-M05','selection_version':'v0.1','approved_by':'eariver',
            'approved_at':datetime.now(ZoneInfo('Asia/Tokyo')).isoformat(timespec='seconds'),
            'selection_assignments':assignments,
            'architecture_proposal':{
              'architecture_version':'v0.1',
              'editorial_thesis':'2026年5月は、frontier modelの更新と並行して、agentの実運用がsandbox・権限・長期state・retrieval・serving最適化へ広がり、生成AIの競争軸がモデル単体から実行環境全体へ移った月だった。',
              'architecture_goals':[
                '6月Specialと同じく主要Coreを15件程度に保ち、Supporting EvidenceとPaper Watchをテーマpackageへ統合して個別ニュースの羅列を避ける。',
                'Frontier Models、Agents & Runtime、Inference & Serving、Agent Safety & Securityを独立した実行系テーマとして扱う。',
                'Capability & Evaluationではstandard benchmark外の具体的能力と評価設計を結び、単一成果の過剰一般化を避ける。',
                'vendor/project/author claimを一次事実から分離し、Technical Notesはreader-facingにする。',
                '36ページを計画値とし、40ページを超える場合はPreview生成前にレイアウトを調整する。'
              ],
              'cover_anchor_candidates':[E('item-official-feed-01a8b52eee8198f545c2-8346b492d8'),E('item-official-index-anthropic-news-afddcb8068'),E('item-official-feed-66be1220771465af8b1a-7856302980')],
              'packages':packages
            }
          }
          out=root/'editorial/selection-architecture-decision-v0.1.json'
          out.write_text(json.dumps(decision,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          PY
      - name: Approve Candidate Selection and propose Architecture
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=control-src python control-src/scripts/apply_special_selection_and_propose_architecture.py \
            --repo-root worktree \
            --issue-id SP-2026-M05 \
            --evidence-run-sha f462ffab2beca5d361385a330d8c2e83a118115a11b5add2a75a274dc8af4650 \
            --decision worktree/sources/SP-2026-M05/editorial/selection-architecture-decision-v0.1.json \
            --special-manifest control-src/specials/2026-M05/edition.json \
            --approval-reference 'User instruction 2026-08-12 JST: after comparing May granularity with June/July, retain the June-like 15-core plus supporting/Paper-Watch selection and proceed directly toward Preview; next Human Gate is Preview review.' \
            --audit-output selection-architecture-audit.json
          python - <<'PY'
          import json, pathlib
          p=pathlib.Path('worktree/sources/SP-2026-M05/architecture/issue-architecture-v0.1.json')
          plan=json.load(open(p,encoding='utf-8'))
          assert plan['status']=='PROPOSED'
          assert plan['page_budget']['planned']==36.0, plan['page_budget']
          assert len(plan['packages'])==8
          PY
      - name: Validate and approve Architecture under Preview mandate
        shell: bash
        run: |
          set -euo pipefail
          input=worktree/sources/SP-2026-M05/architecture/architecture-input-v0.1.json
          plan=worktree/sources/SP-2026-M05/architecture/issue-architecture-v0.1.json
          state=worktree/sources/SP-2026-M05/pipeline-state.json
          PYTHONPATH=control-src python control-src/scripts/validate_issue_architecture.py --architecture-input "$input" --plan "$plan" --report architecture-proposed-validation.json
          python - "$plan" "$state" <<'PY'
          import hashlib,json,sys
          from datetime import datetime
          from zoneinfo import ZoneInfo
          plan_path,state_path=sys.argv[1:]
          now=datetime.now(ZoneInfo('Asia/Tokyo')).isoformat(timespec='seconds')
          reference='User instruction 2026-08-12 JST: no intermediate Human Gate after granularity reconsideration; proceed to Preview, which is the next Human Gate.'
          plan=json.load(open(plan_path,encoding='utf-8'))
          plan['status']='APPROVED'
          plan['approval']={'approved_by':'eariver','approved_at':now,'approval_reference':reference}
          with open(plan_path,'w',encoding='utf-8') as f: json.dump(plan,f,ensure_ascii=False,indent=2); f.write('\n')
          sha=hashlib.sha256(open(plan_path,'rb').read()).hexdigest()
          state=json.load(open(state_path,encoding='utf-8'))
          assert state['lifecycle_state']=='SELECTION_COMPLETE'
          state['lifecycle_state']='ARCHITECTURE_ESTABLISHED'
          state['gates']['issue_architecture']='passed'
          state.setdefault('provenance',{})['issue_architecture']={'path':'sources/SP-2026-M05/architecture/issue-architecture-v0.1.json','sha256':sha,'approved_at':now,'approval_reference':reference}
          with open(state_path,'w',encoding='utf-8') as f: json.dump(state,f,ensure_ascii=False,indent=2); f.write('\n')
          PY
          PYTHONPATH=control-src python control-src/scripts/validate_issue_architecture.py --architecture-input "$input" --plan "$plan" --require-approved --report architecture-approved-validation.json
      - name: Build immutable Draft Packages
        shell: bash
        run: |
          set -euo pipefail
          out=worktree/sources/SP-2026-M05/drafting/packages/v0.1
          PYTHONPATH=control-src python control-src/scripts/build_draft_packages.py \
            --architecture-input worktree/sources/SP-2026-M05/architecture/architecture-input-v0.1.json \
            --architecture-plan worktree/sources/SP-2026-M05/architecture/issue-architecture-v0.1.json \
            --evidence-reviewed worktree/sources/SP-2026-M05/evidence/runs/f462ffab2beca5d361385a330d8c2e83a118115a11b5add2a75a274dc8af4650/evidence-reviewed.jsonl \
            --output-dir "$out" > draft-package-build.json
          python - "$out/draft-package-manifest.json" <<'PY'
          import json,sys
          m=json.load(open(sys.argv[1],encoding='utf-8'))
          assert m['passed'] is True, m['errors']
          assert m['materialized_package_count']==m['package_count']==8, m
          assert m['article_drafting_count']==6, m
          assert m['post_draft_summary_count']==1, m
          assert m['reference_generation_count']==1, m
          PY
      - name: Commit Selection, Architecture, and Draft Packages
        working-directory: worktree
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/m05-selection-architecture-run-once.yml
          git add sources/SP-2026-M05/editorial/selection-architecture-decision-v0.1.json sources/SP-2026-M05/selection sources/SP-2026-M05/architecture sources/SP-2026-M05/drafting/packages/v0.1 sources/SP-2026-M05/pipeline-state.json
          git commit -m 'Approve Selection and Architecture for SP-2026-M05'
          git push origin HEAD:special/2026-M05-work
      - name: Upload editorial audit
        uses: actions/upload-artifact@v7
        with:
          name: special-selection-architecture-2026-M05
          path: |
            selection-architecture-audit.json
            architecture-proposed-validation.json
            architecture-approved-validation.json
            draft-package-build.json
          if-no-files-found: error
          retention-days: 14
