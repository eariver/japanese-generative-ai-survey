name: Repair SP-2022-Y Publication Preview Sparse

on:
  pull_request:
    branches: [main]
    paths:
      - sources/SP-2022-Y/editorial/layout-revision-v0.3.json

permissions:
  contents: write
  actions: read

concurrency:
  group: repair-sp-2022-y-publication-preview-sparse
  cancel-in-progress: false

jobs:
  repair:
    if: github.event.pull_request.head.ref == 'special/2022-Y-work'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout control code sparsely
        uses: actions/checkout@v6
        with:
          ref: main
          path: control-src
          fetch-depth: 1
          sparse-checkout: |
            scripts
            schemas
            config
            specials/2022-Y
          sparse-checkout-cone-mode: true

      - name: Checkout Annual working set sparsely
        uses: actions/checkout@v6
        with:
          ref: special/2022-Y-work
          path: worktree
          fetch-depth: 1
          sparse-checkout: |
            specials/2022-Y
            sources/SP-2022-Y/pipeline-state.json
            sources/SP-2022-Y/screening
            sources/SP-2022-Y/evidence
            sources/SP-2022-Y/selection
            sources/SP-2022-Y/architecture
            sources/SP-2022-Y/drafting
            sources/SP-2022-Y/finalization
            sources/SP-2022-Y/editorial
            sources/SP-2022-Y/chronology
            surveys/special/2022-Y
            scripts/revise_special_annual_review_sequence_generic.py
          sparse-checkout-cone-mode: false

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Verify repair boundary
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib,json,pathlib
          root=pathlib.Path('worktree')
          state=json.load(open(root/'sources/SP-2022-Y/pipeline-state.json',encoding='utf-8'))
          assert state['lifecycle_state']=='RELEASE_CANDIDATE', state['lifecycle_state']
          assert state['gates']['latex_build']=='passed'
          assert state['gates']['visual_review']=='pending'
          assert state['gates']['freeze']=='pending'
          assert 'publication_preview' not in state.get('provenance',{})
          source=state['provenance']['validated_issue_source']
          assert source['source_version']=='v0.2', source
          path=root/source['path']
          assert path.is_file()
          assert hashlib.sha256(path.read_bytes()).hexdigest()==source['sha256']
          chrono=state['provenance']['annual_chronology']
          assert chrono['event_count']==59 and chrono['unresolved_date_count']==0
          PY

      - name: Harden Annual Technical Notes
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=control-src python control-src/scripts/revise_special_annual_source_specific_notes_v5.py \
            --repo-root worktree --special-slug 2022-Y --issue-id SP-2022-Y --source-version v0.3 \
            > annual-source-specific-v0.3.json

      - name: Apply ordered Annual review repairs
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=control-src python worktree/scripts/revise_special_annual_review_sequence_generic.py \
            --repo-root worktree --special-slug 2022-Y --issue-id SP-2022-Y --parent-source-version v0.3 \
            > annual-ordered-review-v0.8.json

      - name: Verify requested issue repairs
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,pathlib,re
          root=pathlib.Path('worktree')
          state=json.load(open(root/'sources/SP-2022-Y/pipeline-state.json',encoding='utf-8'))
          assert state['lifecycle_state']=='VALIDATED_DRAFT'
          assert state['gates']['latex_build']=='pending'
          assert state['gates']['visual_review']=='pending' and state['gates']['freeze']=='pending'
          source=state['provenance']['validated_issue_source']
          assert source['source_version']=='v0.8'
          src=root/source['path'].parent
          manifest=json.load(open(root/source['path'],encoding='utf-8'))
          assert manifest['evidence_record_count']==42
          notes='\n'.join((src/a['technical_notes_path']).read_text(encoding='utf-8') for a in manifest['articles'] if a.get('technical_notes_path') and (src/a['technical_notes_path']).is_file())
          assert 'が2022年の生成AI技術記録に含まれることを確認できる' not in notes
          assert '一次資料で確認できる範囲の事実を記録しており' not in notes
          assert '時系列 & —' not in notes and ' & PRODUCT & ' not in notes
          front=(src/manifest['frontmatter']['path']).read_text(encoding='utf-8')
          assert r'\setcounter{tocdepth}{1}' in front
          main=(src/manifest['main_tex']['path']).read_text(encoding='utf-8')
          zero=[a for a in manifest['articles'] if int(a.get('evidence_record_count') or 0)==0]
          assert zero
          for a in zero:
              rel=pathlib.Path(a['technical_notes_path']).with_suffix('').as_posix()
              assert rf'\input{{{rel}}}' not in main
          chrono=json.load(open(root/state['provenance']['annual_chronology']['path'],encoding='utf-8'))
          assert len(chrono['events'])==59 and all(e.get('reference_key') for e in chrono['events'])
          ca=next(a for a in manifest['articles'] if a['package_id']=='annual-chronology')
          assert (src/ca['layout_body_path']).read_text(encoding='utf-8').count(r'\cite{')==59
          refs=(src/manifest['references']['path']).read_text(encoding='utf-8')
          assert not re.search(r'title\s*=\s*\{Primary source \d+\}', refs)
          assert 'Primary source used for chronology and technical verification' not in refs
          assert main.count('Referencesには本文・Detailed Chronologyの検証に用いた一次資料')==1
          audit={'schema_version':'1.0','issue_id':'SP-2022-Y','source_version':'v0.8','issues':[54,78,122,139,140,191,271,272],'technical_notes_visible_card_count':42,'generic_claim_fallback_findings':0,'generic_limitation_fallback_findings':0,'raw_product_findings':0,'chronology_placeholder_findings':0,'toc_depth':'section','zero_card_technical_notes_rendered':0,'chronology_event_count':59,'chronology_event_reference_mapping_count':59,'generic_reference_title_findings':0,'repeated_reference_boilerplate_findings':0,'common_reference_note_count':1,'new_external_evidence':False,'accepted_article_claims_changed':False,'publication_preview_approval_recorded':False}
          (root/'sources/SP-2022-Y/editorial/issues-54-78-122-139-140-191-271-272-v0.8.json').write_text(json.dumps(audit,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          print(json.dumps(audit,ensure_ascii=False,indent=2))
          PY

      - name: Commit repaired validated source
        working-directory: worktree
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add sources/SP-2022-Y/pipeline-state.json sources/SP-2022-Y/chronology sources/SP-2022-Y/editorial surveys/special/2022-Y/revisions/v0.3 surveys/special/2022-Y/revisions/v0.4 surveys/special/2022-Y/revisions/v0.5 surveys/special/2022-Y/revisions/v0.6 surveys/special/2022-Y/revisions/v0.7 surveys/special/2022-Y/revisions/v0.8
          git diff --cached --quiet && exit 0
          git commit -m 'Repair SP-2022-Y publication preview review findings'
          git push origin HEAD:special/2022-Y-work

      - name: Upload repair audits
        uses: actions/upload-artifact@v7
        with:
          name: sp-2022-y-publication-preview-repair-v0.8-sparse
          path: |
            annual-source-specific-v0.3.json
            annual-ordered-review-v0.8.json
          retention-days: 14
