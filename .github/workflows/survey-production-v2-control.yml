name: Survey Production Core v2 control

on:
  workflow_dispatch:
    inputs:
      operation:
        description: Advance one ChatGPT-reviewed stage or record one Human Gate approval
        required: true
        type: choice
        options:
          - adopt-stage
          - approve-architecture
          - approve-publication-preview
      issue_id:
        required: true
        type: string
      work_branch:
        required: true
        type: string
      production_state_sha256:
        description: Exact current Production State SHA-256 before this control action
        required: true
        type: string
      stage_artifacts_json:
        description: adopt-stage only; JSON object mapping canonical artifact names to repository-relative paths
        required: false
        default: '{}'
        type: string
      stage_reviews_path:
        description: adopt-stage only; repository-relative JSON file containing ChatGPT/deterministic review rows
        required: false
        type: string
      stage_summary:
        description: adopt-stage only; concise reason the stage is ready to advance
        required: false
        type: string
      reviewed_by:
        required: false
        type: string
      reviewed_at:
        required: false
        type: string
      review_reference:
        required: false
        type: string
      human_gate_authorized:
        description: Must be true for either Human Gate operation
        required: true
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: survey-production-v2-control-${{ inputs.issue_id }}
  cancel-in-progress: false

jobs:
  control:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout production work branch
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.work_branch }}
          path: worktree
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install current reviewed Core v2 dependencies
        run: python -m pip install -r worktree/config/survey-production-v2-requirements.txt

      - name: Resolve and validate current production identity
        id: identity
        shell: bash
        env:
          ISSUE_ID: ${{ inputs.issue_id }}
          WORK_BRANCH: ${{ inputs.work_branch }}
          EXPECTED_STATE_SHA: ${{ inputs.production_state_sha256 }}
        run: |
          set -euo pipefail
          test "$(printf '%s' "$EXPECTED_STATE_SHA" | grep -Ec '^[0-9a-f]{64}$')" -eq 1
          PYTHONPATH=worktree python - <<'PY' >> "$GITHUB_OUTPUT"
          import os, pathlib, re
          from scripts import survey_agent_control_v2 as agent
          from scripts import survey_production_v2 as core
          issue=os.environ['ISSUE_ID']; branch=os.environ['WORK_BRANCH']; root=pathlib.Path('worktree').resolve()
          if not re.fullmatch(r'[A-Za-z0-9._/-]+', branch) or '..' in branch.split('/'):
              raise SystemExit('unsafe work_branch')
          state_path=root/'sources'/issue/'production-state.json'
          if not state_path.is_file(): raise SystemExit(f'missing canonical Production State: {state_path}')
          if core.sha256_file(state_path) != os.environ['EXPECTED_STATE_SHA']:
              raise SystemExit('Production State SHA drift before control action')
          state=core.load_json(state_path)
          if state.get('issue_id') != issue: raise SystemExit('Production State issue_id mismatch')
          profile_path=root/state['profile']['path']; profile=core.load_json(profile_path)
          if profile.get('issue_id') != issue: raise SystemExit('Production Profile issue_id mismatch')
          if profile.get('paths',{}).get('work_branch') != branch:
              raise SystemExit('workflow work_branch does not match Production Profile authority')
          cfg=core.load_json(root/core.DEFAULT_CONFIG)
          errors=agent.validate_agent_state(root,cfg,state)
          if errors: raise SystemExit('; '.join(errors))
          source_root=profile['paths']['source_root']
          print(f'state={state_path.relative_to(root)}')
          print(f'source_root={source_root}')
          print(f'lifecycle={state["lifecycle_state"]}')
          print(f'next_action={state.get("next_action") or ""}')
          print(f'terminal_reason={state.get("terminal_reason") or ""}')
          PY

      - name: Run exact Core v2 stage validation before adoption
        if: inputs.operation == 'adopt-stage'
        shell: bash
        env:
          STATE: ${{ steps.identity.outputs.state }}
          SOURCE_ROOT: ${{ steps.identity.outputs.source_root }}
          ARTIFACTS_JSON: ${{ inputs.stage_artifacts_json }}
          REVIEWS_PATH: ${{ inputs.stage_reviews_path }}
        run: |
          set -euo pipefail
          test -n "$REVIEWS_PATH"
          mapfile -t artifact_args < <(PYTHONPATH=worktree python - <<'PY'
          import json, os
          data=json.loads(os.environ['ARTIFACTS_JSON'])
          if not isinstance(data,dict): raise SystemExit('stage_artifacts_json must be a JSON object')
          for name,path in sorted(data.items()):
              if not isinstance(name,str) or not name or not isinstance(path,str) or not path:
                  raise SystemExit('stage_artifacts_json names/paths must be non-empty strings')
              print(f'--artifact\n{name}={path}')
          PY
          )
          validation_output="$(PYTHONPATH=worktree python - <<'PY'
          import json, os, pathlib
          root=pathlib.Path('worktree').resolve()
          review_path=(root / os.environ['REVIEWS_PATH']).resolve()
          try: review_path.relative_to(root)
          except ValueError: raise SystemExit('stage_reviews_path escapes repository')
          data=json.load(open(review_path,encoding='utf-8'))
          rows=data.get('reviews')
          if not isinstance(rows,list): raise SystemExit('stage review file must contain reviews array')
          matches=[row for row in rows if isinstance(row,dict) and row.get('check_id')=='CORE_STAGE_CONTRACT']
          if len(matches)!=1: raise SystemExit('stage review file requires exactly one CORE_STAGE_CONTRACT row')
          row=matches[0]
          if row.get('kind')!='DETERMINISTIC': raise SystemExit('CORE_STAGE_CONTRACT review must be DETERMINISTIC')
          value=row.get('result_path')
          if not isinstance(value,str) or not value: raise SystemExit('CORE_STAGE_CONTRACT review requires result_path')
          output=(root / value).resolve()
          try: rel=output.relative_to(root)
          except ValueError: raise SystemExit('CORE_STAGE_CONTRACT result_path escapes repository')
          source=(root / os.environ['SOURCE_ROOT']).resolve()
          try: output.relative_to(source)
          except ValueError: raise SystemExit('CORE_STAGE_CONTRACT result_path must remain under source_root')
          if output.exists(): raise SystemExit('refusing pre-existing CORE_STAGE_CONTRACT result before validation')
          print(rel)
          PY
          )"
          PYTHONPATH=worktree python worktree/scripts/survey_stage_validation_v2.py \
            --repo-root worktree --config config/survey-production-v2.json \
            --state "$STATE" \
            "${artifact_args[@]}" \
            --output "$validation_output"

      - name: Advance exactly one ChatGPT-reviewed local stage
        if: inputs.operation == 'adopt-stage'
        shell: bash
        env:
          STATE: ${{ steps.identity.outputs.state }}
          LIFECYCLE: ${{ steps.identity.outputs.lifecycle }}
          TERMINAL: ${{ steps.identity.outputs.terminal_reason }}
          ARTIFACTS_JSON: ${{ inputs.stage_artifacts_json }}
          REVIEWS_PATH: ${{ inputs.stage_reviews_path }}
          STAGE_SUMMARY: ${{ inputs.stage_summary }}
          HUMAN_AUTHORIZED: ${{ inputs.human_gate_authorized }}
        run: |
          set -euo pipefail
          test "$HUMAN_AUTHORIZED" = 'false'
          test "$TERMINAL" = ''
          test "$LIFECYCLE" != 'FROZEN'
          test -n "$REVIEWS_PATH" && test -n "$STAGE_SUMMARY"
          mapfile -t artifact_args < <(PYTHONPATH=worktree python - <<'PY'
          import json, os
          data=json.loads(os.environ['ARTIFACTS_JSON'])
          if not isinstance(data,dict): raise SystemExit('stage_artifacts_json must be a JSON object')
          for name,path in sorted(data.items()):
              if not isinstance(name,str) or not name or not isinstance(path,str) or not path:
                  raise SystemExit('stage_artifacts_json names/paths must be non-empty strings')
              print(f'--artifact\n{name}={path}')
          PY
          )
          PYTHONPATH=worktree python worktree/scripts/survey_agent_control_v2.py \
            --repo-root worktree --config config/survey-production-v2.json \
            advance-stage --state "$STATE" \
            "${artifact_args[@]}" \
            --reviews "$REVIEWS_PATH" \
            --summary "$STAGE_SUMMARY"

      - name: Record exact-byte Architecture Review approval
        if: inputs.operation == 'approve-architecture'
        shell: bash
        env:
          STATE: ${{ steps.identity.outputs.state }}
          AUTHORIZED: ${{ inputs.human_gate_authorized }}
          REVIEWED_BY: ${{ inputs.reviewed_by }}
          REVIEWED_AT: ${{ inputs.reviewed_at }}
          REVIEW_REFERENCE: ${{ inputs.review_reference }}
        run: |
          set -euo pipefail
          test "$AUTHORIZED" = 'true'
          test -n "$REVIEWED_BY" && test -n "$REVIEWED_AT" && test -n "$REVIEW_REFERENCE"
          PYTHONPATH=worktree python worktree/scripts/survey_agent_control_v2.py \
            --repo-root worktree --config config/survey-production-v2.json \
            approve-architecture --state "$STATE" \
            --reviewed-by "$REVIEWED_BY" --reviewed-at "$REVIEWED_AT" --review-reference "$REVIEW_REFERENCE"

      - name: Record exact-byte Publication Preview approval
        if: inputs.operation == 'approve-publication-preview'
        shell: bash
        env:
          STATE: ${{ steps.identity.outputs.state }}
          AUTHORIZED: ${{ inputs.human_gate_authorized }}
          REVIEWED_BY: ${{ inputs.reviewed_by }}
          REVIEWED_AT: ${{ inputs.reviewed_at }}
          REVIEW_REFERENCE: ${{ inputs.review_reference }}
        run: |
          set -euo pipefail
          test "$AUTHORIZED" = 'true'
          test -n "$REVIEWED_BY" && test -n "$REVIEWED_AT" && test -n "$REVIEW_REFERENCE"
          PYTHONPATH=worktree python worktree/scripts/survey_agent_control_v2.py \
            --repo-root worktree --config config/survey-production-v2.json \
            approve-publication-preview --state "$STATE" \
            --reviewed-by "$REVIEWED_BY" --reviewed-at "$REVIEWED_AT" --review-reference "$REVIEW_REFERENCE"

      - name: Validate resulting resumable Production State
        shell: bash
        env:
          STATE: ${{ steps.identity.outputs.state }}
        run: |
          set -euo pipefail
          PYTHONPATH=worktree python - <<'PY'
          import os, pathlib
          from scripts import survey_agent_control_v2 as agent
          from scripts import survey_production_v2 as core
          root=pathlib.Path('worktree').resolve()
          state_path=(root/os.environ['STATE']).resolve()
          state=core.load_json(state_path)
          cfg=core.load_json(root/core.DEFAULT_CONFIG)
          errors=agent.validate_agent_state(root,cfg,state)
          if errors: raise SystemExit('; '.join(errors))
          print('Production State validation PASS')
          PY

      - name: Commit compact control records to production branch
        working-directory: worktree
        shell: bash
        env:
          WORK_BRANCH: ${{ inputs.work_branch }}
          SOURCE_ROOT: ${{ steps.identity.outputs.source_root }}
          ISSUE_ID: ${{ inputs.issue_id }}
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$SOURCE_ROOT"
          if git diff --cached --quiet; then
            echo 'No control changes to commit.' >&2
            exit 1
          fi
          git commit -m "Advance ${ISSUE_ID} Survey Production Core v2"
          git push origin "HEAD:${WORK_BRANCH}"
