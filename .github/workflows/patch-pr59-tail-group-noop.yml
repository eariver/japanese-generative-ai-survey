name: Patch PR59 tail grouping no-op contract once

on:
  pull_request:
    types: [synchronize]
    paths:
      - 'tests/.pr59-tail-group-noop-trigger'

permissions:
  contents: write

jobs:
  patch:
    if: github.event.pull_request.number == 59 && github.event.pull_request.head.ref == 'agent/group-special-technical-note-card-tail'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/group-special-technical-note-card-tail
          fetch-depth: 0
      - name: Relax grouping for cards without attributed claims
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p=Path('scripts/postprocess_special_reader_facing_notes.py')
          text=p.read_text(encoding='utf-8')
          old='''    if groups == 0:\n        raise ValueError("no attributed Technical Notes claim found for coherent tail grouping")\n    return "\\n".join(output) + ("\\n" if text.endswith("\\n") else "")\n'''
          new='''    # Some source records legitimately have no separately attributed claim.\n    # In that case there is no late-card tail to group; keep the card unchanged\n    # apart from removing any obsolete Needspace marker from an older revision.\n    return "\\n".join(output) + ("\\n" if text.endswith("\\n") else "")\n'''
          if old not in text:
              raise SystemExit('expected grouping strictness block not found')
          p.write_text(text.replace(old,new,1),encoding='utf-8')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/postprocess_special_reader_facing_notes.py
          git commit -m 'Allow Technical Notes cards without attributed tail groups'
          git push origin HEAD:agent/group-special-technical-note-card-tail
