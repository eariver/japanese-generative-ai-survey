name: One-time SP-2025-H2 preview capture

on:
  push:
    branches:
      - special/2025-H2-work
    paths:
      - .github/workflows/sp-2025-h2-capture-preview.yml

permissions:
  actions: read
  contents: write

jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: special/2025-H2-work
          fetch-depth: 0
      - name: Wait for latest canonical preview build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          run_id="$(gh run list --workflow build-special-pdf.yml --event workflow_dispatch --limit 1 --json databaseId --jq '.[0].databaseId')"
          test -n "$run_id"
          gh run watch "$run_id" --exit-status
          mkdir -p .preview
          gh run download "$run_id" --dir .preview
          pdf="$(find .preview -type f -name '*.pdf' | head -n1)"
          test -s "$pdf"
          mkdir -p sources/SP-2025-H2/preview-transfer
          cp "$pdf" sources/SP-2025-H2/preview-transfer/SP-2025-H2-publication-preview.pdf
          python - "$run_id" <<'PY'
          import json,sys,pathlib
          run_id=int(sys.argv[1])
          pathlib.Path('sources/SP-2025-H2/preview-transfer/build-run.json').write_text(
              json.dumps({'workflow_run_id':run_id},indent=2)+'\n',encoding='utf-8')
          PY
      - name: Commit transfer copy and remove one-time workflow
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/sp-2025-h2-capture-preview.yml
          git add sources/SP-2025-H2/preview-transfer
          git commit -m 'Stage SP-2025-H2 publication preview for review transfer'
          git push origin HEAD:special/2025-H2-work
