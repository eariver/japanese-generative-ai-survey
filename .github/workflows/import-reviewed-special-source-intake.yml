name: Import reviewed Special source intake

on:
  workflow_dispatch:
    inputs:
      special_slug:
        description: Special slug, for example 2026-M07
        required: true
        type: string
      source_run_id:
        description: Successful Special source-intake Actions run ID
        required: true
        type: string
      review_reference:
        description: Audit reference proving artifact review before acceptance
        required: true
        type: string

permissions:
  contents: write
  actions: read
  pull-requests: write

concurrency:
  group: special-source-intake-import-${{ inputs.special_slug }}
  cancel-in-progress: false

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout current control code
        uses: actions/checkout@v6
        with:
          ref: main
          path: control-src
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Resolve exact Special edition identity
        id: edition
        shell: bash
        env:
          SPECIAL_SLUG: ${{ inputs.special_slug }}
        run: |
          set -euo pipefail
          if ! [[ "$SPECIAL_SLUG" =~ ^[A-Za-z0-9][A-Za-z0-9._-]{2,63}$ ]]; then
            echo '::error::invalid Special slug'
            exit 2
          fi
          manifest="control-src/specials/${SPECIAL_SLUG}/edition.json"
          test -s "$manifest"
          python control-src/scripts/special_pipeline.py --config control-src/config/special-pipeline.json validate --manifest "$manifest"
          special_id="$(python -c "import json; print(json.load(open('$manifest'))['special_id'])")"
          work_branch="$(python -c "import json; print(json.load(open('$manifest'))['paths']['work_branch'])")"
          echo "special_id=$special_id" >> "$GITHUB_OUTPUT"
          echo "work_branch=$work_branch" >> "$GITHUB_OUTPUT"
      - name: Resolve and verify source Actions artifact
        id: source
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          SPECIAL_ID: ${{ steps.edition.outputs.special_id }}
          SPECIAL_SLUG: ${{ inputs.special_slug }}
          SOURCE_RUN_ID: ${{ inputs.source_run_id }}
        run: |
          set -euo pipefail
          [[ "$SOURCE_RUN_ID" =~ ^[0-9]+$ ]]
          gh api "repos/${REPOSITORY}/actions/runs/${SOURCE_RUN_ID}" > source-run.json
          gh api "repos/${REPOSITORY}/actions/runs/${SOURCE_RUN_ID}/artifacts?per_page=100" > source-artifacts.json
          python control-src/scripts/resolve_special_source_intake_artifact.py \
            --run-json source-run.json --artifacts-json source-artifacts.json \
            --repository "$REPOSITORY" --special-id "$SPECIAL_ID" --special-slug "$SPECIAL_SLUG" \
            --source-run-id "$SOURCE_RUN_ID" --output source-artifact.json --github-output "$GITHUB_OUTPUT"
      - name: Require canonical Special work branch
        shell: bash
        env:
          WORK_BRANCH: ${{ steps.edition.outputs.work_branch }}
        run: |
          set -euo pipefail
          git -C control-src ls-remote --exit-code --heads origin "refs/heads/${WORK_BRANCH}" >/dev/null || {
            echo "::error::Special work branch ${WORK_BRANCH} does not exist"; exit 1; }
      - name: Checkout Special work branch
        uses: actions/checkout@v6
        with:
          ref: ${{ steps.edition.outputs.work_branch }}
          path: worktree
          fetch-depth: 0
      - name: Refuse import into divergent edition definition
        shell: bash
        env:
          SPECIAL_SLUG: ${{ inputs.special_slug }}
        run: cmp "control-src/specials/${SPECIAL_SLUG}/edition.json" "worktree/specials/${SPECIAL_SLUG}/edition.json"
      - name: Download exact reviewed artifact
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          SOURCE_RUN_ID: ${{ inputs.source_run_id }}
          ARTIFACT_NAME: ${{ steps.source.outputs.artifact_name }}
        run: |
          set -euo pipefail
          mkdir -p artifact-download
          gh run download "$SOURCE_RUN_ID" --repo "$REPOSITORY" --name "$ARTIFACT_NAME" --dir artifact-download
          test -s artifact-download/special-source-intake/source-intake-report.json
          test -s artifact-download/special-source-intake-control/plan.json
      - name: Accept reviewed collector bytes and Special discovery state
        shell: bash
        env:
          SPECIAL_SLUG: ${{ inputs.special_slug }}
          SOURCE_RUN_ID: ${{ inputs.source_run_id }}
          REVIEW_REFERENCE: ${{ inputs.review_reference }}
          ARTIFACT_ID: ${{ steps.source.outputs.artifact_id }}
          ARTIFACT_NAME: ${{ steps.source.outputs.artifact_name }}
          ARTIFACT_DIGEST: ${{ steps.source.outputs.artifact_digest }}
        run: |
          set -euo pipefail
          python control-src/scripts/accept_special_source_intake_artifact.py \
            --artifact-root artifact-download --repo-root worktree --special-slug "$SPECIAL_SLUG" \
            --workflow-run-id "$SOURCE_RUN_ID" --artifact-id "$ARTIFACT_ID" --artifact-name "$ARTIFACT_NAME" \
            --artifact-digest "$ARTIFACT_DIGEST" --review-reference "$REVIEW_REFERENCE" --report import-result.json
      - name: Update and verify Raw provenance
        shell: bash
        env:
          SPECIAL_ID: ${{ steps.edition.outputs.special_id }}
        run: |
          set -euo pipefail
          python control-src/scripts/raw_provenance.py --repo-root worktree --issue-id "$SPECIAL_ID" --report raw-update-report.json update
          python control-src/scripts/raw_provenance.py --repo-root worktree --issue-id "$SPECIAL_ID" --report raw-check-report.json check
      - name: Commit accepted source intake
        id: commit
        working-directory: worktree
        shell: bash
        env:
          SPECIAL_ID: ${{ steps.edition.outputs.special_id }}
          SOURCE_RUN_ID: ${{ inputs.source_run_id }}
          WORK_BRANCH: ${{ steps.edition.outputs.work_branch }}
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "sources/${SPECIAL_ID}"
          if git diff --cached --quiet; then
            echo 'committed=false' >> "$GITHUB_OUTPUT"
            echo "commit_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -m "Import reviewed source intake for ${SPECIAL_ID} from Actions run ${SOURCE_RUN_ID}"
          git push origin "HEAD:${WORK_BRANCH}"
          echo 'committed=true' >> "$GITHUB_OUTPUT"
          echo "commit_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Create or refresh Draft Special PR
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          SPECIAL_ID: ${{ steps.edition.outputs.special_id }}
          WORK_BRANCH: ${{ steps.edition.outputs.work_branch }}
        run: |
          set -euo pipefail
          number="$(gh pr list --repo "$REPOSITORY" --head "$WORK_BRANCH" --base main --state open --json number --jq '.[0].number // empty')"
          if [ -z "$number" ]; then
            gh pr create --repo "$REPOSITORY" --base main --head "$WORK_BRANCH" --draft \
              --title "Special ${SPECIAL_ID} — reviewed editorial work" \
              --body "Auditable work surface for ${SPECIAL_ID}. Candidate Selection, Issue Architecture, visual review, Freeze, merge, and public Release remain explicit human gates."
          else
            is_draft="$(gh pr view "$number" --repo "$REPOSITORY" --json isDraft --jq '.isDraft')"
            [ "$is_draft" = 'true' ] || { echo "::error::Existing Special PR #${number} is non-Draft"; exit 1; }
          fi
      - name: Upload import audit reports
        uses: actions/upload-artifact@v7
        with:
          name: special-source-intake-import-${{ inputs.special_slug }}-${{ inputs.source_run_id }}
          path: |
            source-run.json
            source-artifacts.json
            source-artifact.json
            import-result.json
            raw-update-report.json
            raw-check-report.json
          if-no-files-found: error
          retention-days: 14
