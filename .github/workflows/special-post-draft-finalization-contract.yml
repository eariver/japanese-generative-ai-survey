name: Special post-draft finalization contract

on:
  pull_request:
    paths:
      - '.github/workflows/finalize-special-validated-draft.yml'
      - '.github/workflows/special-post-draft-finalization-contract.yml'
      - 'scripts/finalize_special_validated_draft.py'
      - 'schemas/issue-synthesis-result.schema.json'
      - 'templates/survey/jgaisurvey.sty'
      - 'tests/test_finalize_special_validated_draft.py'
  push:
    branches: [main]
    paths:
      - '.github/workflows/finalize-special-validated-draft.yml'
      - '.github/workflows/special-post-draft-finalization-contract.yml'
      - 'scripts/finalize_special_validated_draft.py'
      - 'schemas/issue-synthesis-result.schema.json'
      - 'templates/survey/jgaisurvey.sty'
      - 'tests/test_finalize_special_validated_draft.py'

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify Special finalization helpers and shared validators
        run: |
          set -euo pipefail
          python -m py_compile scripts/finalize_special_validated_draft.py
          python -m unittest \
            tests.test_finalize_special_validated_draft \
            tests.test_validate_article_draft \
            tests.test_validate_issue_architecture
