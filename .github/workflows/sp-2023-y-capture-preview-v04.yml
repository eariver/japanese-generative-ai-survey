name: One-time SP-2023-Y v0.4 preview capture

on:
  push:
    branches:
      - special/2023-Y-work
    paths:
      - .github/workflows/sp-2023-y-capture-preview-v04.yml

permissions:
  actions: read
  contents: write

jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: special/2023-Y-work
          fetch-depth: 0
      - name: Capture exact successful canonical preview build
        env:
          GH_TOKEN: ${{ github.token }}
          PREVIEW_RUN_ID: '31956125025'
        run: |
          set -euo pipefail
          gh run watch "$PREVIEW_RUN_ID" --exit-status
          rm -rf .preview
          mkdir -p .preview
          gh run download "$PREVIEW_RUN_ID" --dir .preview
          pdf="$(find .preview -type f -name '*.pdf' | head -n1)"
          log="$(find .preview -type f -name 'main.log' | head -n1)"
          audit="$(find .preview -type f -name 'special-pdf-build-audit.json' | head -n1)"
          test -s "$pdf" && test -s "$log" && test -s "$audit"
          mkdir -p sources/SP-2023-Y/preview-transfer
          cp "$pdf" sources/SP-2023-Y/preview-transfer/SP-2023-Y-publication-preview.pdf
          cp "$log" sources/SP-2023-Y/preview-transfer/main.log
          cp "$audit" sources/SP-2023-Y/preview-transfer/special-pdf-build-audit.json
          python - "$PREVIEW_RUN_ID" <<'PY'
          import hashlib,json,pathlib,sys
          run_id=int(sys.argv[1])
          root=pathlib.Path('sources/SP-2023-Y/preview-transfer')
          pdf=root/'SP-2023-Y-publication-preview.pdf'
          audit=json.load(open(root/'special-pdf-build-audit.json',encoding='utf-8'))
          digest=hashlib.sha256(pdf.read_bytes()).hexdigest()
          assert digest==audit['pdf_sha256'], (digest,audit['pdf_sha256'])
          assert audit['source_version']=='v0.4', audit['source_version']
          assert audit['log_clean'] is True and audit['log_gate_findings']==[], audit
          (root/'build-run.json').write_text(
              json.dumps({
                  'schema_version':'1.0',
                  'workflow_run_id':run_id,
                  'artifact_id':9266016397,
                  'pdf_sha256':digest,
                  'page_count':audit['page_count'],
                  'source_version':audit['source_version'],
                  'source_manifest_sha256':audit['source_manifest_sha256'],
              },ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          PY
      - name: Commit transfer copy and remove one-time workflow
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/sp-2023-y-capture-preview-v04.yml
          git add sources/SP-2023-Y/preview-transfer
          git commit -m 'Stage exact SP-2023-Y v0.4 publication preview'
          git push origin HEAD:special/2023-Y-work
