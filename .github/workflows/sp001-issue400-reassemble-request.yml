name: SP001 Issue 400 one-shot request reassembler

on:
  push:
    branches:
      - 'sp001/issue400-publication-revision'
    paths:
      - '.github/workflows/sp001-issue400-reassemble-request.yml'

permissions:
  contents: write

jobs:
  reassemble:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout revision staging branch
        uses: actions/checkout@v6
        with:
          ref: sp001/issue400-publication-revision
          fetch-depth: 0

      - name: Reassemble exact semantic publication request
        shell: bash
        run: |
          set -euo pipefail
          parts_dir='sources/SP001/orchestration/v2/semantic-publication-request.parts'
          out='sources/SP001/orchestration/v2/interactive-semantic-publication.json'
          test -d "$parts_dir"
          test "$(find "$parts_dir" -maxdepth 1 -type f -name 'part-*.b64' | wc -l)" -eq 7
          cat "$parts_dir"/part-*.b64 | tr -d '\r\n' | base64 --decode > "$out"
          python - <<'PY'
          import hashlib, json, pathlib
          path = pathlib.Path('sources/SP001/orchestration/v2/interactive-semantic-publication.json')
          data = json.loads(path.read_text(encoding='utf-8'))
          if data.get('schema_version') != '2.0-rc1':
              raise SystemExit('unexpected schema_version')
          if data.get('issue_id') != 'SP001':
              raise SystemExit('unexpected issue_id')
          print('request_sha256=' + hashlib.sha256(path.read_bytes()).hexdigest())
          print('request_bytes=' + str(path.stat().st_size))
          PY

      - name: Replace transport chunks with canonical request
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm -rf sources/SP001/orchestration/v2/semantic-publication-request.parts
          rm -f .github/workflows/sp001-issue400-reassemble-request.yml
          git add -A
          git commit -m 'SP001: reconstruct Issue #400 semantic publication request'
          git push origin HEAD:sp001/issue400-publication-revision

# one-shot trigger refresh
