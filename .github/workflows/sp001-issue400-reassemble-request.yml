name: SP001 Issue 400 request reassembler

on:
  pull_request:
    branches:
      - 'special/SP001-v2-work'
    paths:
      - 'sources/SP001/orchestration/v2/semantic-publication-request.parts/**'

permissions:
  contents: write

concurrency:
  group: sp001-issue400-request-${{ github.event.pull_request.head.ref }}
  cancel-in-progress: false

jobs:
  reassemble:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Checkout revision execution branch
        uses: actions/checkout@v6
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Reassemble available semantic publication request bytes
        shell: bash
        run: |
          set -euo pipefail
          parts_dir='sources/SP001/orchestration/v2/semantic-publication-request.parts'
          out='sources/SP001/orchestration/v2/interactive-semantic-publication.json'
          test -d "$parts_dir"
          mapfile -t parts < <(find "$parts_dir" -maxdepth 1 -type f -name 'part-*.b64' | sort)
          test "${#parts[@]}" -eq 7
          cat "${parts[@]}" | tr -d '\r\n' | base64 --decode > "$out"
          sha256sum "$out"
          wc -c "$out"

      - name: Upload reconstructed bytes for interrupted-transport diagnosis
        uses: actions/upload-artifact@v4
        with:
          name: sp001-issue400-partial-semantic-publication-request
          path: sources/SP001/orchestration/v2/interactive-semantic-publication.json
          if-no-files-found: error
          retention-days: 1

      - name: Upload immutable source authorities for request recovery
        uses: actions/upload-artifact@v4
        with:
          name: sp001-issue400-request-recovery-authorities
          path: |
            sources/SP001/architecture-v2.json
            sources/SP001/draft/v2/interactive-drafting-synthesis-input.json
            sources/SP001/draft/v2/profile-synthesis-result.json
            sources/SP001/evidence/v2/accepted/6b730553a0d71201ed40303f5ed126aa47dca224cba63e1797931ce7cd2f63f2/interactive-evidence.json
            sources/SP001/evidence/v2/accepted/6b730553a0d71201ed40303f5ed126aa47dca224cba63e1797931ce7cd2f63f2/evidence-accepted.json
          if-no-files-found: error
          retention-days: 1

      - name: Validate complete semantic publication request
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib, json, pathlib
          path = pathlib.Path('sources/SP001/orchestration/v2/interactive-semantic-publication.json')
          data = json.loads(path.read_text(encoding='utf-8'))
          if data.get('schema_version') != '2.0-rc1':
              raise SystemExit('unexpected schema_version')
          if data.get('issue_id') != 'SP001':
              raise SystemExit('unexpected issue_id')
          print('request_sha256=' + hashlib.sha256(path.read_bytes()).hexdigest())
          print('request_bytes=' + str(path.stat().st_size))
          PY

      - name: Replace transport chunks with canonical request
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm -rf sources/SP001/orchestration/v2/semantic-publication-request.parts
          git add -A sources/SP001/orchestration/v2
          git commit -m 'SP001: reconstruct Issue #400 semantic publication request'
          git push origin "HEAD:${{ github.head_ref }}"
