name: Prepare Weekly Candidate Selection gate

on:
  workflow_dispatch:
    inputs:
      issue_id:
        description: Weekly issue ID (YYYY-Www)
        required: true
        type: string
      evidence_run_sha:
        description: Accepted, non-superseded Evidence result-set SHA
        required: true
        type: string

permissions:
  contents: write
  actions: read

concurrency:
  group: weekly-candidate-selection-${{ inputs.issue_id }}
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout current control code
        uses: actions/checkout@v6
        with:
          ref: main
          path: control-src
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Resolve Weekly work branch
        id: issue
        shell: bash
        env:
          ISSUE_ID: ${{ inputs.issue_id }}
        run: |
          set -euo pipefail
          if ! [[ "$ISSUE_ID" =~ ^[0-9]{4}-W[0-9]{2}$ ]]; then
            echo '::error::issue_id must use YYYY-Www form'
            exit 2
          fi
          echo "work_branch=weekly/${ISSUE_ID}-work" >> "$GITHUB_OUTPUT"

      - name: Checkout Weekly work branch
        uses: actions/checkout@v6
        with:
          ref: ${{ steps.issue.outputs.work_branch }}
          path: worktree
          fetch-depth: 0

      - name: Verify Human Gate input boundary
        working-directory: worktree
        shell: bash
        env:
          ISSUE_ID: ${{ inputs.issue_id }}
          EVIDENCE_RUN_SHA: ${{ inputs.evidence_run_sha }}
        run: |
          set -euo pipefail
          python ../control-src/scripts/raw_provenance.py --repo-root . --issue-id "$ISSUE_ID" check
          state="sources/${ISSUE_ID}/pipeline-state.json"
          run="sources/${ISSUE_ID}/evidence/runs/${EVIDENCE_RUN_SHA}"
          acceptance="${run}/acceptance.json"
          reviewed="${run}/evidence-reviewed.jsonl"
          test -s "$state"
          test -s "$acceptance"
          test -s "$reviewed"
          python - "$state" "$acceptance" "$EVIDENCE_RUN_SHA" "sources/${ISSUE_ID}/evidence/runs" <<'PY'
          import json,pathlib,re,sys
          state=json.load(open(sys.argv[1],encoding='utf-8'))
          acceptance=json.load(open(sys.argv[2],encoding='utf-8'))
          sha=sys.argv[3]
          runs=pathlib.Path(sys.argv[4])
          assert re.fullmatch(r'[0-9a-f]{64}',sha), sha
          assert state['lifecycle_state']=='EVIDENCE_REVIEWED', state['lifecycle_state']
          assert state['gates']['evidence_normalized']=='passed'
          assert state['gates']['candidate_selection']=='pending'
          assert state['gates']['issue_architecture']=='pending'
          assert acceptance['status']=='ACCEPTED'
          assert acceptance['result_set_sha256']==sha
          superseders=[]
          for path in runs.glob('*/supersession.json'):
              value=json.load(open(path,encoding='utf-8'))
              if value.get('supersedes_result_set_sha256')==sha:
                  superseders.append(value.get('result_set_sha256') or path.parent.name)
          if superseders:
              raise SystemExit(f'Evidence run is superseded and cannot initialize Selection: {superseders}')
          PY

      - name: Build deterministic Candidate matrix and pending Human Gate
        working-directory: worktree
        shell: bash
        env:
          ISSUE_ID: ${{ inputs.issue_id }}
          EVIDENCE_RUN_SHA: ${{ inputs.evidence_run_sha }}
        run: |
          set -euo pipefail
          out="sources/${ISSUE_ID}/selection"
          mkdir -p "$out"
          python ../control-src/scripts/build_candidate_matrix.py \
            --evidence-reviewed "sources/${ISSUE_ID}/evidence/runs/${EVIDENCE_RUN_SHA}/evidence-reviewed.jsonl" \
            --pipeline-state "sources/${ISSUE_ID}/pipeline-state.json" \
            --json-output "$out/candidate-matrix-v0.1.json" \
            --markdown-output "$out/candidate-matrix-v0.1.md"
          python ../control-src/scripts/candidate_selection_gate.py init \
            --matrix "$out/candidate-matrix-v0.1.json" \
            --output "$out/candidate-selection-v0.1.json" \
            --selection-version v0.1 >/dev/null
          python ../control-src/scripts/candidate_selection_gate.py validate \
            --selection "$out/candidate-selection-v0.1.json" \
            --matrix "$out/candidate-matrix-v0.1.json" \
            --report candidate-selection-gate-audit.json
          python - "$out/candidate-matrix-v0.1.json" "$out/candidate-selection-v0.1.json" "$EVIDENCE_RUN_SHA" <<'PY'
          import json,sys
          matrix=json.load(open(sys.argv[1],encoding='utf-8'))
          selection=json.load(open(sys.argv[2],encoding='utf-8'))
          assert selection['status']=='PENDING_APPROVAL'
          candidates=[r for r in matrix['rows'] if r['recommendation']=='CANDIDATE']
          unassigned=[a for a in selection['assignments'] if a['role']=='UNASSIGNED']
          assert len(candidates)==len(unassigned), (len(candidates),len(unassigned))
          basis={
              'schema_version':'1.0',
              'issue_id':matrix['issue_id'],
              'status':'HUMAN_CANDIDATE_SELECTION_REQUIRED',
              'evidence_run_sha':sys.argv[3],
              'candidate_count':len(candidates),
              'unassigned_count':len(unassigned),
              'candidate_task_ids':[r['evidence_task_id'] for r in candidates],
          }
          with open('candidate-selection-gate-summary.json','w',encoding='utf-8') as f:
              json.dump(basis,f,ensure_ascii=False,indent=2); f.write('\n')
          PY

      - name: Assert pipeline state is unchanged
        working-directory: worktree
        shell: bash
        env:
          ISSUE_ID: ${{ inputs.issue_id }}
        run: |
          set -euo pipefail
          git diff --exit-code -- "sources/${ISSUE_ID}/pipeline-state.json"

      - name: Commit pending Candidate Selection gate
        working-directory: worktree
        shell: bash
        env:
          ISSUE_ID: ${{ inputs.issue_id }}
          WORK_BRANCH: ${{ steps.issue.outputs.work_branch }}
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "sources/${ISSUE_ID}/selection"
          git diff --cached --quiet && exit 0
          git commit -m "Prepare Human Candidate Selection gate for ${ISSUE_ID}"
          git push origin "HEAD:${WORK_BRANCH}"

      - name: Upload Candidate Selection gate package
        uses: actions/upload-artifact@v7
        with:
          name: weekly-candidate-selection-${{ inputs.issue_id }}
          path: |
            worktree/sources/${{ inputs.issue_id }}/selection/candidate-matrix-v0.1.json
            worktree/sources/${{ inputs.issue_id }}/selection/candidate-matrix-v0.1.md
            worktree/sources/${{ inputs.issue_id }}/selection/candidate-selection-v0.1.json
            worktree/candidate-selection-gate-audit.json
            worktree/candidate-selection-gate-summary.json
          if-no-files-found: error
          retention-days: 14
