name: Survey Production Core v2 interactive Screening

on:
  pull_request:
    branches:
      - 'weekly/*-v2-work'
      - 'special/*-v2-work'
    paths:
      - 'sources/**/screening/v2/interactive-decisions.json'

permissions:
  contents: write

concurrency:
  group: survey-production-v2-interactive-screening-${{ github.base_ref }}
  cancel-in-progress: false

jobs:
  screening:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Checkout interactive Screening branch
        uses: actions/checkout@v6
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Core v2 dependencies
        run: python -m pip install -r config/survey-production-v2-requirements.txt

      - name: Resolve and validate Screening request identity
        id: request
        shell: bash
        env:
          TARGET_WORK_BRANCH: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          PYTHONPATH=. python - <<'PY' >> "$GITHUB_OUTPUT"
          import json, os, pathlib, re
          from scripts import survey_agent_control_v2 as agent
          from scripts import survey_production_v2 as core

          root=pathlib.Path('.').resolve()
          requests=sorted(root.glob('sources/*/screening/v2/interactive-decisions.json'))
          if len(requests) != 1:
              raise SystemExit(f'exactly one interactive Screening request required, found {len(requests)}')
          decisions=requests[0]
          issue=decisions.parts[-4]
          if not re.fullmatch(r'[A-Za-z0-9._-]+', issue): raise SystemExit('unsafe issue_id')
          payload=json.load(open(decisions,encoding='utf-8'))
          if payload.get('schema_version') != '2.0-rc1' or payload.get('issue_id') != issue:
              raise SystemExit('interactive Screening request identity mismatch')
          state_path=root/'sources'/issue/'production-state.json'
          if not state_path.is_file(): raise SystemExit('missing canonical Production State')
          state=core.load_json(state_path)
          if state.get('lifecycle_state') != 'DISCOVERY_COLLECTED':
              raise SystemExit('interactive Screening requires DISCOVERY_COLLECTED State')
          cfg=core.load_json(root/core.DEFAULT_CONFIG)
          errors=agent.validate_agent_state(root,cfg,state)
          if errors: raise SystemExit('; '.join(errors))
          profile=core.load_json(root/state['profile']['path'])
          if profile.get('paths',{}).get('work_branch') != os.environ['TARGET_WORK_BRANCH']:
              raise SystemExit('PR base does not match Production Profile work_branch')
          source_root=profile['paths']['source_root']
          expected=(root/source_root/'screening/v2/interactive-decisions.json').resolve()
          if decisions.resolve() != expected: raise SystemExit('interactive Screening request path is not canonical')
          print(f'issue_id={issue}')
          print(f'state={state_path.relative_to(root)}')
          print(f'decisions={decisions.relative_to(root)}')
          print(f'source_root={source_root}')
          PY

      - name: Generate and accept exact Core v2 Screening results
        shell: bash
        env:
          STATE: ${{ steps.request.outputs.state }}
          DECISIONS: ${{ steps.request.outputs.decisions }}
        run: |
          set -euo pipefail
          PYTHONPATH=. python scripts/run_screening_v2_interactive.py \
            --repo-root . --state "$STATE" --decisions "$DECISIONS" \
            | tee screening-v2-output.json

      - name: Validate accepted Screening output
        shell: bash
        env:
          STATE: ${{ steps.request.outputs.state }}
        run: |
          set -euo pipefail
          PYTHONPATH=. python - <<'PY'
          import json, pathlib
          from scripts import survey_agent_tool_v2 as agent_tool
          from scripts import survey_production_v2 as core
          from scripts import survey_screening_v2 as screening

          root=pathlib.Path('.').resolve()
          output=json.load(open('screening-v2-output.json',encoding='utf-8'))
          path=(root/output['acceptance_path']).resolve()
          with agent_tool.current_stage_basis_override():
              accepted=screening.validate_acceptance(root,path,core.repository_commit_sha(root))
          if accepted.get('record_count') != output.get('record_count'):
              raise SystemExit('interactive Screening output record_count mismatch')
          print('Core v2 Screening acceptance PASS')
          PY

      - name: Persist accepted Screening run to execution branch
        shell: bash
        env:
          SOURCE_ROOT: ${{ steps.request.outputs.source_root }}
          DECISIONS: ${{ steps.request.outputs.decisions }}
          ISSUE_ID: ${{ steps.request.outputs.issue_id }}
          PUSH_BRANCH: ${{ github.head_ref }}
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm -f "$DECISIONS"
          git add "$SOURCE_ROOT"
          if git diff --cached --quiet; then
            echo 'No Screening changes to commit.' >&2
            exit 1
          fi
          git commit -m "Accept ${ISSUE_ID} Core v2 Screening"
          git push origin "HEAD:${PUSH_BRANCH}"
