name: SP001 validated draft adoption prep

on:
  pull_request:
    branches:
      - special/SP001-v2-work

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout adoption branch
        uses: actions/checkout@v6
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - name: Build exact-State-locked control request
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib, json, pathlib
          state=pathlib.Path('sources/SP001/production-state.json')
          digest=hashlib.sha256(state.read_bytes()).hexdigest()
          request={
            'schema_version':'2.0-rc1',
            'operation':'adopt-stage',
            'issue_id':'SP001',
            'production_state_sha256':digest,
            'stage_artifacts':{
              'validated-source':'sources/SP001/publication/v2/validated-source-manifest.json',
              'publication-pdf':'sources/SP001/publication/v2/SP001-publication-preview.pdf',
              'quality-regression-bundle':'sources/SP001/publication/v2/quality-regression-bundle-v2.json'
            },
            'stage_reviews_path':'sources/SP001/orchestration/v2/reviews/DRAFT_COMPLETE.json',
            'stage_summary':'Validated the exact final SP001 source/PDF pair against the complete Core + THEMATIC + LONGFORM_SPECIAL quality family after rendered-page review; established semantic attribution, bibliography, identifier, PDF preflight, wrapper suppression, TOC, technical-tail and page-balance checks.'
          }
          path=pathlib.Path('sources/SP001/orchestration/v2/control-request.json')
          path.write_text(json.dumps(request,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          print('production_state_sha256='+digest)
          PY
      - name: Persist request and remove prep workflow
        shell: bash
        env:
          PUSH_BRANCH: ${{ github.head_ref }}
        run: |
          set -euo pipefail
          rm -f .github/workflows/sp001-validated-draft-adopt-prep.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add sources/SP001/orchestration/v2/control-request.json .github/workflows/sp001-validated-draft-adopt-prep.yml
          git commit -m 'Prepare SP001 VALIDATED_DRAFT adoption'
          git push origin "HEAD:${PUSH_BRANCH}"
