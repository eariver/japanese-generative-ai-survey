name: Retry SP-2023-Y v0.15 residual repair
on:
  push:
    branches: [special/2023-Y-work]
    paths: [.github/workflows/sp-2023-y-v015-139-191-residual-v2.yml]
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: special/2023-Y-work
          path: worktree
          fetch-depth: 0
      - uses: actions/checkout@v6
        with:
          ref: main
          path: control-src
          fetch-depth: 1
      - name: Create immutable v0.15 review repair
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations
          import hashlib, json, re, shutil
          from pathlib import Path

          root = Path('worktree')
          issue = 'SP-2023-Y'
          parent = root / 'surveys/special/2023-Y/revisions/v0.14'
          dest = root / 'surveys/special/2023-Y/revisions/v0.15'
          state_path = root / 'sources' / issue / 'pipeline-state.json'
          state = json.loads(state_path.read_text(encoding='utf-8'))
          prov = state['provenance']['validated_issue_source']
          assert prov['path'] == 'surveys/special/2023-Y/revisions/v0.14/source-manifest.json', prov
          assert prov['source_version'] == 'v0.14', prov
          assert state['lifecycle_state'] == 'RELEASE_CANDIDATE', state['lifecycle_state']
          assert state['gates']['latex_build'] == 'passed'
          assert state['gates']['visual_review'] == 'pending'
          assert state['gates']['freeze'] == 'pending'
          review14 = json.loads((root/'sources'/issue/'reviews'/'publication-preview-v0.14.json').read_text(encoding='utf-8'))
          assert review14['human_publication_preview_approved'] is False
          parent_manifest_path = parent / 'source-manifest.json'
          parent_sha = hashlib.sha256(parent_manifest_path.read_bytes()).hexdigest()
          assert parent_sha == prov['sha256'], (parent_sha, prov['sha256'])
          assert not dest.exists(), dest
          shutil.copytree(parent, dest)

          def replace_fact(rel: str, title: str, new_fact: str) -> None:
              path = dest / rel
              text = path.read_text(encoding='utf-8')
              pattern = re.compile(
                  r'(\\begin\{technicalnote\}\{' + re.escape(title) +
                  r'\}\{[^}]+\}.*?\\item \\textbf\{一次情報で確認できる事実\}: )(.*?)(\n\\end\{itemize\})',
                  re.S,
              )
              match = pattern.search(text)
              assert match is not None, (rel, title, 'card/fact boundary not found')
              old_fact = match.group(2).strip()
              assert re.search(r'対象\s*event\s*近傍', old_fact, re.I), (title, old_fact)
              text = text[:match.start(2)] + new_fact + text[match.end(2):]
              path.write_text(text, encoding='utf-8')

          replace_fact(
              'technical-notes/10-frontier-interface-notes.tex',
              'GPT-4 / GPT-4V',
              'OpenAIのGPT-4 Technical ReportはGPT-4を画像とテキストを入力しテキストを出力するmultimodal modelとして記述し、post-training alignmentでfactuality等の指標が改善したと報告する。2023-09-25のGPT-4V system cardは画像入力に固有の安全性評価・準備・mitigationを扱う。ChatGPTへの画像・音声機能の展開は製品availabilityとして、GPT-4本体の学習仕様とは分けて扱う。',
          )
          replace_fact(
              'technical-notes/20-open-weight-ecosystem-notes.tex',
              'LLaMA / Llama 2 / Code Llama',
              'Metaの一次資料では、LLaMA v1は7B/13B/33B/65B、Llama 2は7B/13B/70B、Code Llamaの2023年初版（v1）は7B/13B/34Bのcode-specialized familyとして記載される。Code Llamaの70Bは2024年の後続改訂に属するため、本カードの2023年eventへは帰属させない。',
          )
          replace_fact(
              'technical-notes/40-runtime-adaptation-notes.tex',
              'vLLM / PagedAttention',
              'vLLMの論文では、PagedAttentionはOSのvirtual memory/pagingに着想を得てKV cacheをblock単位で管理し、vLLMはKV-cache memory wasteをほぼゼロにし、request内外でKV cacheを共有できるよう設計されていると著者が報告する。',
          )
          replace_fact(
              'technical-notes/40-runtime-adaptation-notes.tex',
              'QLoRA',
              'QLoRAはfrozen 4-bit quantized pretrained modelを通してgradientをbackpropagateし、LoRA adapterを学習する。論文は4-bit NormalFloat (NF4)、double quantization、paged optimizersをmemory-saving innovationsとして導入する。',
          )

          llama_path = dest / 'technical-notes/20-open-weight-ecosystem-notes.tex'
          ltext = llama_path.read_text(encoding='utf-8')
          ltext2, n = re.subn(r'https?://arxiv\.org/abs/2308\.12950v3', 'https://arxiv.org/abs/2308.12950v1', ltext, count=1)
          assert n == 1, 'Code Llama v3 locator not found exactly once'
          llama_path.write_text(ltext2, encoding='utf-8')

          rendered_paths = [
              'technical-notes/10-frontier-interface-notes.tex',
              'technical-notes/20-open-weight-ecosystem-notes.tex',
              'technical-notes/40-runtime-adaptation-notes.tex',
          ]
          rendered = '\n'.join((dest / p).read_text(encoding='utf-8') for p in rendered_paths)
          assert re.search(r'対象\s*event\s*近傍', rendered, re.I) is None
          assert '7B parameter scale / 65B parameter scale / 13B parameter scale / 33B parameter scale' not in rendered
          required = {
              'GPT-4 / GPT-4V': ['multimodal model', 'post-training alignment', 'GPT-4V system card', '製品availability'],
              'LLaMA / Llama 2 / Code Llama': ['LLaMA v1は7B/13B/33B/65B', 'Llama 2は7B/13B/70B', '2023年初版（v1）は7B/13B/34B', '2024年の後続改訂'],
              'vLLM / PagedAttention': ['virtual memory/paging', 'KV cacheをblock単位', 'KV-cache memory waste'],
              'QLoRA': ['frozen 4-bit quantized pretrained model', 'LoRA adapter', 'NormalFloat (NF4)', 'double quantization', 'paged optimizers'],
          }
          for title, signals in required.items():
              assert title in rendered, title
              for signal in signals:
                  assert signal in rendered, (title, signal)
          assert 'https://arxiv.org/abs/2308.12950v1' in rendered
          assert '2308.12950v3' not in llama_path.read_text(encoding='utf-8')

          chronology_old = root/'sources'/issue/'chronology'/'annual-chronology-v0.14.json'
          chronology_new = root/'sources'/issue/'chronology'/'annual-chronology-v0.15.json'
          chronology = json.loads(chronology_old.read_text(encoding='utf-8'))
          if 'source_version' in chronology:
              chronology['source_version'] = 'v0.15'
          chronology_new.write_text(json.dumps(chronology, ensure_ascii=False, indent=2)+'\n', encoding='utf-8')
          chronology_sha = hashlib.sha256(chronology_new.read_bytes()).hexdigest()

          audit_path = root/'sources'/issue/'editorial'/'issues-139-191-v0.15.json'
          audit = {
              'schema_version': '1.0',
              'issue_id': issue,
              'source_version': 'v0.15',
              'status': 'VALIDATED_REVIEW_RESIDUAL_REPAIR',
              'issue_refs': [139, 191],
              'basis': {
                  'previous_source_manifest_path': 'surveys/special/2023-Y/revisions/v0.14/source-manifest.json',
                  'previous_source_manifest_sha256': parent_sha,
                  'human_review': [
                      'Issue #139 SP-2023-Y v0.14 Human Review PARTIAL / Open維持',
                      'Issue #191 SP-2023-Y v0.14 Human Review Regression / Reopen推奨',
                  ],
              },
              'repairs': [
                  {'title':'GPT-4 / GPT-4V','technical_boundary':['GPT-4 multimodal input/output scope','post-training factuality author claim','GPT-4V image-input safety evaluation','product availability separated from model training specification']},
                  {'title':'LLaMA / Llama 2 / Code Llama','technical_boundary':['LLaMA v1 7B/13B/33B/65B','Llama 2 7B/13B/70B','Code Llama 2023 v1 7B/13B/34B','Code Llama 70B excluded as 2024 follow-up revision'],'version_exact_source':'https://arxiv.org/abs/2308.12950v1'},
                  {'title':'vLLM / PagedAttention','technical_boundary':['virtual-memory/paging-inspired PagedAttention','block-granular KV-cache management','near-zero KV-cache memory waste author claim','KV sharing within/across requests']},
                  {'title':'QLoRA','technical_boundary':['frozen 4-bit quantized pretrained model','LoRA adapters','NF4','double quantization','paged optimizers']},
              ],
              'contracts': {
                  'proximity_fallback_findings': 0,
                  'flat_multi_family_parameter_bucket_findings': 0,
                  'subject_entity_binding_contract': 'SUBJECT_COMPONENT_VARIANT_PROPERTY_BINDING_V3',
                  'annual_source_specific_detail_contract': 'ANNUAL_SCREENING_BACKED_FAIL_CLOSED_V1',
                  'temporal_version_boundary': 'Code Llama v1 is 2023; 70B follow-up revision is 2024 and is not back-projected',
              },
              'provenance_note': 'Code Llama v1 locator is a Human Review supplied exact-version primary-source correction. Accepted Selection/Architecture and the 75-event annual chronology are not reopened.',
          }
          audit_path.parent.mkdir(parents=True, exist_ok=True)
          audit_path.write_text(json.dumps(audit, ensure_ascii=False, indent=2)+'\n', encoding='utf-8')
          audit_sha = hashlib.sha256(audit_path.read_bytes()).hexdigest()

          manifest_path = dest/'source-manifest.json'
          manifest = json.loads(manifest_path.read_text(encoding='utf-8'))
          manifest['source_version'] = 'v0.15'
          manifest['status'] = 'VALIDATED_ANNUAL_139_191_RESIDUAL_REPAIR'
          manifest['derivation'] = '#139/#191 Human Review residual repair: removes proximity fallback from four cards, restores family/version-scoped parameter ownership, and pins Code Llama to its 2023 v1 source without reopening Selection or Architecture.'
          manifest['basis']['previous_source_manifest_path'] = 'surveys/special/2023-Y/revisions/v0.14/source-manifest.json'
          manifest['basis']['previous_source_manifest_sha256'] = parent_sha
          for article in manifest['articles']:
              rel = article.get('technical_notes_path')
              if rel:
                  article['technical_notes_sha256'] = hashlib.sha256((dest/rel).read_bytes()).hexdigest()
          reader = manifest.setdefault('reader_facing_technical_notes', {})
          reader['residual_review_contract'] = 'ANNUAL_NO_PROXIMITY_FALLBACK_AND_FAMILY_SCOPED_SCALE_V1'
          reader['residual_proximity_fallback_findings'] = 0
          reader['residual_flat_multi_family_parameter_findings'] = 0
          reader['residual_review_issue_refs'] = [139, 191]
          manifest['review_residual_repair'] = {
              'path': 'sources/SP-2023-Y/editorial/issues-139-191-v0.15.json',
              'sha256': audit_sha,
              'issue_refs': [139,191],
          }
          if isinstance(manifest.get('annual_chronology'), dict):
              manifest['annual_chronology']['source_version'] = 'v0.15'
              manifest['annual_chronology']['path'] = 'sources/SP-2023-Y/chronology/annual-chronology-v0.15.json'
              manifest['annual_chronology']['sha256'] = chronology_sha
          manifest_path.write_text(json.dumps(manifest, ensure_ascii=False, indent=2)+'\n', encoding='utf-8')
          manifest_sha = hashlib.sha256(manifest_path.read_bytes()).hexdigest()

          old_chron = dict(state['provenance']['annual_chronology'])
          hist = state.setdefault('provenance_history', {}).setdefault('validated_issue_source', [])
          if not any(x.get('path') == prov['path'] and x.get('sha256') == prov['sha256'] for x in hist if isinstance(x, dict)):
              hist.append(dict(prov))
          state['lifecycle_state'] = 'VALIDATED_DRAFT'
          state['gates']['latex_build'] = 'pending'
          state['gates']['visual_review'] = 'pending'
          state['gates']['freeze'] = 'pending'
          state['provenance']['validated_issue_source'] = {
              'path': 'surveys/special/2023-Y/revisions/v0.15/source-manifest.json',
              'sha256': manifest_sha,
              'source_version': 'v0.15',
              'layout_mode': 'annual-ordered-publication-preview-repair+final-compact-references+139-191-residual',
          }
          state['provenance']['annual_chronology'] = {
              'source_version': 'v0.15',
              'path': 'sources/SP-2023-Y/chronology/annual-chronology-v0.15.json',
              'sha256': chronology_sha,
              'event_count': old_chron['event_count'],
              'unresolved_date_count': old_chron['unresolved_date_count'],
          }
          state['provenance']['review_residual_repair'] = {
              'source_version':'v0.15',
              'path':'sources/SP-2023-Y/editorial/issues-139-191-v0.15.json',
              'sha256':audit_sha,
              'issue_refs':[139,191],
          }
          state['provenance'].pop('latex_build', None)
          state_path.write_text(json.dumps(state, ensure_ascii=False, indent=2)+'\n', encoding='utf-8')
          print(json.dumps({'manifest_sha256':manifest_sha,'chronology_sha256':chronology_sha,'audit_sha256':audit_sha}, indent=2))
          PY
      - name: Verify v0.15 with current main fail-closed checks
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=control-src python control-src/scripts/special_reader_notes_ja.py check --repo-root worktree --issue-id SP-2023-Y
          PYTHONPATH=control-src python control-src/scripts/special_period_consistency.py check --repo-root worktree --special-slug 2023-Y --issue-id SP-2023-Y
          PYTHONPATH=control-src python control-src/scripts/special_publication_layout_check.py --repo-root worktree --issue-id SP-2023-Y
          python - <<'PY'
          import json,re
          from pathlib import Path
          root=Path('worktree')
          m=json.loads((root/'surveys/special/2023-Y/revisions/v0.15/source-manifest.json').read_text(encoding='utf-8'))
          texts=[]
          for a in m['articles']:
              if a.get('technical_notes_reader_facing') and a.get('technical_notes_path'):
                  texts.append((root/'surveys/special/2023-Y/revisions/v0.15'/a['technical_notes_path']).read_text(encoding='utf-8'))
          text='\n'.join(texts)
          assert len(re.findall(r'\\begin\{technicalnote\}', text)) == 26
          assert not re.search(r'対象\s*event\s*近傍', text, re.I)
          assert '7B parameter scale / 65B parameter scale / 13B parameter scale / 33B parameter scale' not in text
          assert 'https://arxiv.org/abs/2308.12950v1' in text
          assert '2024年の後続改訂' in text
          c=json.loads((root/'sources/SP-2023-Y/chronology/annual-chronology-v0.15.json').read_text(encoding='utf-8'))
          events=c.get('events') or c.get('dated_events') or []
          unresolved=c.get('unresolved') or c.get('unresolved_dates') or []
          if events: assert len(events)==75, len(events)
          if unresolved: assert len(unresolved)==3, len(unresolved)
          PY
      - name: Commit repair and remove one-time workflows
        shell: bash
        run: |
          set -euo pipefail
          cd worktree
          rm -f .github/workflows/sp-2023-y-v015-139-191-residual.yml
          rm -f .github/workflows/sp-2023-y-v015-139-191-residual-v2.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add surveys/special/2023-Y/revisions/v0.15 sources/SP-2023-Y/chronology/annual-chronology-v0.15.json sources/SP-2023-Y/editorial/issues-139-191-v0.15.json sources/SP-2023-Y/pipeline-state.json .github/workflows/sp-2023-y-v015-139-191-residual.yml .github/workflows/sp-2023-y-v015-139-191-residual-v2.yml
          git commit -m 'Repair SP-2023-Y residual Technical Notes findings (#139 #191)'
          git push origin HEAD:special/2023-Y-work
