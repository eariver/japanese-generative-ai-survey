name: Survey Production Core v2 CI

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - refactor/survey-production-core-v2
    paths:
      - 'AGENTS.md'
      - 'config/**'
      - 'schemas/**'
      - 'scripts/survey_*_v2.py'
      - 'tests/test_survey_*_v2.py'
      - 'docs/survey-production-core-v2-*.md'
      - 'docs/checkpoints/survey-production-core-v2-*.md'
      - 'docs/checkpoints/survey-production-core-v2-audit-findings/**'
      - '.github/workflows/survey-production-v2-ci.yml'
      - '.github/workflows/survey-production-v2-operator-bridge.yml'
      - '.github/workflows/survey-production-v2-release.yml'
      - '.github/workflows/survey-production-v2-export-publication-preview.yml'
      - '.github/workflows/build-weekly-survey.yml'
      - '.github/workflows/build-special-pdf.yml'
  pull_request:
    paths:
      - 'AGENTS.md'
      - 'config/**'
      - 'schemas/**'
      - 'scripts/survey_*_v2.py'
      - 'tests/test_survey_*_v2.py'
      - 'docs/survey-production-core-v2-*.md'
      - 'docs/checkpoints/survey-production-core-v2-*.md'
      - 'docs/checkpoints/survey-production-core-v2-audit-findings/**'
      - '.github/workflows/survey-production-v2-ci.yml'
      - '.github/workflows/survey-production-v2-operator-bridge.yml'
      - '.github/workflows/survey-production-v2-release.yml'
      - '.github/workflows/survey-production-v2-export-publication-preview.yml'
      - '.github/workflows/build-weekly-survey.yml'
      - '.github/workflows/build-special-pdf.yml'

permissions:
  contents: read

concurrency:
  group: survey-production-core-v2-ci-${{ github.ref }}
  cancel-in-progress: false

jobs:
  core-v2:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Core contract tree
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          sparse-checkout: |
            AGENTS.md
            config
            schemas
            scripts
            tests
            .github/workflows
            docs
          sparse-checkout-cone-mode: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Core v2 validation dependencies
        run: python -m pip install -r config/survey-production-v2-requirements.txt

      - name: Compile Core v2 implementation
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t modules < <(find scripts -maxdepth 1 -type f -name 'survey_*_v2.py' | sort)
          test "${#modules[@]}" -gt 0
          python -m py_compile "${modules[@]}"

      - name: Run Core v2 regression suite
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest discover -s tests -p 'test_survey_*_v2.py' -v

      - name: Parse Core JSON contracts
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path

          roots = [Path('config'), Path('schemas')]
          paths = sorted(
              path
              for root in roots
              for path in root.rglob('*.json')
              if path.is_file()
          )
          if not paths:
              raise SystemExit('no Core JSON contracts found')
          for path in paths:
              json.loads(path.read_text(encoding='utf-8'))
              print(f'OK {path}')
          PY
