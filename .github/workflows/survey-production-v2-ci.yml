      - "schemas/candidate-matrix-v2.schema.json"
      - "schemas/candidate-selection-v2.schema.json"
      - "schemas/issue-architecture-v2.schema.json"
      - "schemas/architecture-review-*.schema.json"
      - "schemas/architecture-approval-record-v2.schema.json"
      - "schemas/draft-v2-*.schema.json"
      - "schemas/profile-synthesis-v2-*.schema.json"
      - "schemas/quality-regression-bundle-v2.schema.json"
      - "schemas/reader-manuscript-v2.schema.json"
      - "schemas/publication-*.schema.json"
      - "schemas/visual-review-record-v2.schema.json"
      - "schemas/freeze-record-v2.schema.json"
      - "schemas/release-*.schema.json"
      - "schemas/merge-verification-v2.schema.json"
      - "schemas/action-*-v2.schema.json"
      - "schemas/stage-validation-attestation-v2.schema.json"
      - "schemas/stage-handoff-v2.schema.json"
      - "schemas/stage-handoff-request-v2.schema.json"
      - "schemas/review-finding-v2.schema.json"
      - "schemas/repair-set-v2.schema.json"
      - "scripts/survey_*_v2.py"
      - "tests/test_survey_*_v2.py"
      - "AGENTS.md"
      - "docs/survey-production-core-v2-*.md"
      - "docs/thematic-special-backlog.md"
      - "docs/checkpoints/survey-production-core-v2-*.md"
      - "docs/checkpoints/survey-production-core-v2-audit-findings/**"
      - ".github/workflows/survey-production-v2-ci.yml"
      - ".github/workflows/survey-production-v2-release.yml"
      - ".github/workflows/survey-production-v2-export-publication-preview.yml"
      - ".github/workflows/build-weekly-survey.yml"
      - ".github/workflows/build-special-pdf.yml"
  pull_request:
    paths:
      - "config/survey-production-v2.json"
      - "config/survey-production-v2-pilots.json"
      - "config/publication-review-v2.json"
      - "config/survey-production-v2-requirements.txt"
      - "config/prompts/source-screening-v2.md"
      - "config/prompts/evidence-verification-v2.md"
      - "config/prompts/article-drafting-v2.md"
      - "config/prompts/profile-synthesis-v2.md"
      - "config/prompts/grok/x-source-intake-*.md"
      - "schemas/survey-production-*.schema.json"
      - "schemas/pilot-bootstrap-v2.schema.json"
      - "schemas/thematic-scope-spec-v2.schema.json"
      - "schemas/stage-checkpoint-v2.schema.json"
      - "schemas/x-source-intake-v2.schema.json"
      - "schemas/survey-discovery-record.schema.json"
      - "schemas/discovery-acceptance-v2.schema.json"
      - "schemas/screening-v2-*.schema.json"
      - "schemas/evidence-v2-*.schema.json"
      - "schemas/edition-evidence-view.schema.json"
      - "schemas/materiality-ledger.schema.json"
      - "schemas/profile-completeness-result.schema.json"
      - "schemas/candidate-matrix-v2.schema.json"
      - "schemas/candidate-selection-v2.schema.json"
      - "schemas/issue-architecture-v2.schema.json"
      - "schemas/architecture-review-*.schema.json"
      - "schemas/architecture-approval-record-v2.schema.json"
      - "schemas/draft-v2-*.schema.json"
      - "schemas/profile-synthesis-v2-*.schema.json"
      - "schemas/quality-regression-bundle-v2.schema.json"
      - "schemas/reader-manuscript-v2.schema.json"
      - "schemas/publication-*.schema.json"
      - "schemas/visual-review-record-v2.schema.json"
      - "schemas/freeze-record-v2.schema.json"
      - "schemas/release-*.schema.json"
      - "schemas/merge-verification-v2.schema.json"
      - "schemas/action-*-v2.schema.json"
      - "schemas/stage-validation-attestation-v2.schema.json"
      - "schemas/stage-handoff-v2.schema.json"
      - "schemas/stage-handoff-request-v2.schema.json"
      - "schemas/review-finding-v2.schema.json"
      - "schemas/repair-set-v2.schema.json"
      - "scripts/survey_*_v2.py"
      - "tests/test_survey_*_v2.py"
      - "AGENTS.md"
      - "docs/survey-production-core-v2-*.md"
      - "docs/thematic-special-backlog.md"
      - "docs/checkpoints/survey-production-core-v2-*.md"
      - "docs/checkpoints/survey-production-core-v2-audit-findings/**"
      - ".github/workflows/survey-production-v2-ci.yml"
      - ".github/workflows/survey-production-v2-release.yml"
      - ".github/workflows/survey-production-v2-export-publication-preview.yml"
      - ".github/workflows/build-weekly-survey.yml"
      - ".github/workflows/build-special-pdf.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  core-v2:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          sparse-checkout: |
            AGENTS.md
            config
            schemas
            scripts
            tests
            .github/workflows
            docs
          sparse-checkout-cone-mode: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install v2 validation dependencies
        run: python -m pip install -r config/survey-production-v2-requirements.txt
      - name: Compile v2 implementation
        run: >-
          python -m py_compile
          scripts/survey_production_v2.py
          scripts/survey_schema_v2.py
          scripts/survey_x_intake_v2.py
          scripts/survey_execution_record_v2.py
          scripts/survey_discovery_v2.py
          scripts/survey_screening_v2.py
          scripts/survey_evidence_v2.py
          scripts/survey_completeness_v2.py
          scripts/survey_architecture_v2.py
          scripts/survey_review_attention_v2.py
          scripts/survey_drafting_v2.py
          scripts/survey_draft_profile_v2.py
          scripts/survey_quality_v2.py
          scripts/survey_reader_publication_v2.py
          scripts/survey_publication_v2.py
          scripts/survey_agent_tool_v2.py
          scripts/survey_stage_validation_v2.py
          scripts/survey_agent_control_v2.py
          scripts/survey_period_v2.py
          scripts/survey_profiled_freeze_v2.py
          scripts/survey_release_checkpoint_v2.py
          scripts/survey_orchestrator_v2.py
          scripts/survey_handlers_v2.py
          scripts/survey_handoff_v2.py
          scripts/survey_pilot_bootstrap_v2.py
          scripts/survey_findings_v2.py
      - name: Run v2 tests
        run: >-
          python -m unittest
          tests.test_survey_production_v2
          tests.test_survey_x_intake_v2
          tests.test_survey_execution_record_v2
          tests.test_survey_discovery_v2
          tests.test_survey_screening_v2
          tests.test_survey_screening_archive_v2
          tests.test_survey_evidence_v2
          tests.test_survey_completeness_v2
          tests.test_survey_completeness_closure_audit_v2
          tests.test_survey_architecture_v2
          tests.test_survey_architecture_review_expansion_v2
          tests.test_survey_review_attention_v2
          tests.test_survey_wu008_contract_identity
          tests.test_survey_drafting_v2
          tests.test_survey_drafting_integrity_v2
          tests.test_survey_draft_profile_v2
          tests.test_survey_quality_v2
          tests.test_survey_publication_v2
          tests.test_survey_agent_control_v2
          tests.test_survey_stage_validation_v2
          tests.test_survey_period_v2
          tests.test_survey_profiled_freeze_v2
          tests.test_survey_final_audit_rule_v2
          tests.test_survey_release_checkpoint_v2
          tests.test_survey_orchestrator_v2
          tests.test_survey_orchestrator_provenance_v2
          tests.test_survey_handoff_v2
          tests.test_survey_handoff_request_v2
          tests.test_survey_pilot_bootstrap_v2
          tests.test_survey_findings_v2
          -v
      - name: Parse v2 JSON contracts
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          paths = [
              Path('config/survey-production-v2.json'),
              Path('config/survey-production-v2-pilots.json'),
              Path('config/publication-review-v2.json'),
              Path('schemas/pilot-bootstrap-v2.schema.json'),
              Path('schemas/thematic-scope-spec-v2.schema.json'),
              Path('schemas/stage-checkpoint-v2.schema.json'),
              Path('schemas/x-source-intake-v2.schema.json'),
              Path('schemas/survey-production-profile.schema.json'),
              Path('schemas/survey-production-state.schema.json'),
              Path('schemas/survey-discovery-record.schema.json'),
              Path('schemas/discovery-acceptance-v2.schema.json'),
              Path('schemas/screening-v2-run-package.schema.json'),
              Path('schemas/screening-v2-batch-result.schema.json'),
              Path('schemas/evidence-v2-run-package.schema.json'),
              Path('schemas/evidence-v2-task.schema.json'),
              Path('schemas/evidence-v2-card.schema.json'),
              Path('schemas/edition-evidence-view.schema.json'),
              Path('schemas/materiality-ledger.schema.json'),
              Path('schemas/profile-completeness-result.schema.json'),
              Path('schemas/candidate-matrix-v2.schema.json'),
              Path('schemas/candidate-selection-v2.schema.json'),
              Path('schemas/issue-architecture-v2.schema.json'),
              Path('schemas/architecture-review-summary-v2.schema.json'),
              Path('schemas/architecture-review-attention-v2.schema.json'),
              Path('schemas/architecture-approval-record-v2.schema.json'),
              Path('schemas/draft-v2-package.schema.json'),
              Path('schemas/draft-v2-result.schema.json'),
              Path('schemas/profile-synthesis-v2-input.schema.json'),
              Path('schemas/profile-synthesis-v2-result.schema.json'),
              Path('schemas/quality-regression-bundle-v2.schema.json'),
              Path('schemas/reader-manuscript-v2.schema.json'),
              Path('schemas/publication-review-record-v2.schema.json'),
              Path('schemas/publication-candidate-v2.schema.json'),
              Path('schemas/publication-preview-approval-v2.schema.json'),
              Path('schemas/visual-review-record-v2.schema.json'),
              Path('schemas/freeze-record-v2.schema.json'),
              Path('schemas/release-manifest-v2.schema.json'),
              Path('schemas/merge-verification-v2.schema.json'),
              Path('schemas/release-record-v2.schema.json'),
              Path('schemas/action-spec-v2.schema.json'),
              Path('schemas/action-result-v2.schema.json'),
              Path('schemas/stage-validation-attestation-v2.schema.json'),
              Path('schemas/stage-handoff-v2.schema.json'),
              Path('schemas/stage-handoff-request-v2.schema.json'),
              Path('schemas/review-finding-v2.schema.json'),
              Path('schemas/repair-set-v2.schema.json'),
          ]
          for path in paths:
              json.loads(path.read_text(encoding='utf-8'))
              print(f'OK {path}')
          PY
