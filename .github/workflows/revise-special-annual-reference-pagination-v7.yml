name: Revise Annual Special References pagination v7

on:
  workflow_dispatch:
    inputs:
      special_slug:
        description: Annual Special slug
        required: true
        type: string
      source_version:
        description: Immutable output source version
        required: true
        type: string

permissions:
  contents: write

jobs:
  revise:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout current control code
        uses: actions/checkout@v6
        with:
          ref: main
          path: control-src
          fetch-depth: 1
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Resolve Annual Special edition
        id: edition
        env:
          SPECIAL_SLUG: ${{ inputs.special_slug }}
        run: |
          set -euo pipefail
          manifest="control-src/specials/${SPECIAL_SLUG}/edition.json"
          test -s "$manifest"
          python control-src/scripts/special_pipeline.py --config control-src/config/special-pipeline.json validate --manifest "$manifest"
          python - "$manifest" "$GITHUB_OUTPUT" <<'PY'
          import json,sys
          value=json.load(open(sys.argv[1],encoding='utf-8'))
          assert value['edition_kind']=='RETROSPECTIVE_PERIOD' and value['special_slug'].endswith('-Y')
          with open(sys.argv[2],'a',encoding='utf-8') as f:
              f.write(f"special_id={value['special_id']}\n")
              f.write(f"work_branch={value['paths']['work_branch']}\n")
          PY
      - name: Checkout Annual Special work branch
        uses: actions/checkout@v6
        with:
          ref: ${{ steps.edition.outputs.work_branch }}
          path: worktree
          fetch-depth: 0
      - name: Verify immutable pre-compaction boundary
        env:
          SPECIAL_ID: ${{ steps.edition.outputs.special_id }}
        run: |
          set -euo pipefail
          python control-src/scripts/raw_provenance.py --repo-root worktree --issue-id "$SPECIAL_ID" check
          python - "$SPECIAL_ID" <<'PY'
          import hashlib,json,pathlib,sys
          issue=sys.argv[1]; root=pathlib.Path('worktree'); state=json.load(open(root/'sources'/issue/'pipeline-state.json',encoding='utf-8'))
          assert state['lifecycle_state']=='RELEASE_CANDIDATE'
          assert state['gates']['claim_and_chronology_validation']=='passed' and state['gates']['latex_build']=='passed'
          assert state['gates']['visual_review']=='pending' and state['gates']['freeze']=='pending'
          assert 'publication_preview' not in state.get('provenance',{})
          source=state['provenance']['validated_issue_source']; p=root/source['path']
          assert p.is_file() and hashlib.sha256(p.read_bytes()).hexdigest()==source['sha256']
          assert state['provenance']['latex_build']['source_version']==source['source_version']
          manifest=json.load(open(p,encoding='utf-8')); lr=manifest['layout_revision']
          assert lr['annual_reference_pagination_v6'] is True and lr['references_columns']==3
          assert lr['references_entry_font']=='6.0pt/6.5pt' and lr['references_url_style']=='same'
          assert lr['references_url_visible_value_changed'] is False and lr['references_url_hyperlink_target_changed'] is False
          assert lr['references_metadata_values_changed'] is False
          assert lr['bibliography_data_changed'] is False and lr['chronology_event_content_changed'] is False
          PY
      - name: Apply bibliography pagination v7
        env:
          SPECIAL_SLUG: ${{ inputs.special_slug }}
          SPECIAL_ID: ${{ steps.edition.outputs.special_id }}
          SOURCE_VERSION: ${{ inputs.source_version }}
        run: |
          set -euo pipefail
          PYTHONPATH=control-src python control-src/scripts/revise_special_annual_reference_pagination_v7.py --repo-root worktree --special-slug "$SPECIAL_SLUG" --issue-id "$SPECIAL_ID" --source-version "$SOURCE_VERSION" > pagination-v7-audit.json
          cat pagination-v7-audit.json
      - name: Verify pagination v7 contract
        env:
          SPECIAL_ID: ${{ steps.edition.outputs.special_id }}
          SOURCE_VERSION: ${{ inputs.source_version }}
        run: |
          set -euo pipefail
          python - "$SPECIAL_ID" "$SOURCE_VERSION" <<'PY'
          import hashlib,json,pathlib,sys
          issue,version=sys.argv[1:]; root=pathlib.Path('worktree'); state=json.load(open(root/'sources'/issue/'pipeline-state.json',encoding='utf-8'))
          assert state['lifecycle_state']=='VALIDATED_DRAFT' and state['gates']['latex_build']=='pending'
          source=state['provenance']['validated_issue_source']; assert source['source_version']==version
          p=root/source['path']; assert hashlib.sha256(p.read_bytes()).hexdigest()==source['sha256']
          m=json.load(open(p,encoding='utf-8')); lr=m['layout_revision']
          assert lr['annual_reference_pagination_v7'] is True and lr['annual_reference_pagination_v7_issue_refs']==[140]
          assert lr['annual_reference_heading_spacing_compacted'] is True
          assert lr['references_heading_preserved'] is True and lr['references_heading_toc_navigation'] is True
          assert lr['references_metadata_values_changed'] is False and lr['bibliography_data_changed'] is False
          assert lr['chronology_event_content_changed'] is False and lr['reader_semantic_content_changed'] is False
          PY
      - name: Commit pagination v7 source
        working-directory: worktree
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A surveys/special/${{ inputs.special_slug }} sources/${{ steps.edition.outputs.special_id }}
          git commit -m "Compact ${{ steps.edition.outputs.special_id }} References heading ${{ inputs.source_version }}"
          git push origin HEAD:${{ steps.edition.outputs.work_branch }}
      - name: Upload pagination audit
        uses: actions/upload-artifact@v7
        with:
          name: annual-reference-pagination-v7-${{ inputs.special_slug }}-${{ inputs.source_version }}
          path: pagination-v7-audit.json
          if-no-files-found: error
