name: Special source expansion contract

on:
  pull_request:
    paths:
      - '.github/workflows/expand-special-validated-source.yml'
      - '.github/workflows/expand-special-validated-source-v2.yml'
      - '.github/workflows/revise-special-mixed-layout.yml'
      - '.github/workflows/build-special-pdf.yml'
      - '.github/workflows/special-source-expansion-contract.yml'
      - 'scripts/expand_special_validated_source.py'
      - 'scripts/run_expand_special_validated_source.py'
      - 'scripts/revise_special_mixed_layout.py'
      - 'scripts/run_revise_special_mixed_layout.py'
      - 'scripts/revise_special_balanced_layout.py'
      - 'scripts/revise_special_adaptive_spacing.py'
      - 'scripts/revise_special_subsection_spacing.py'
      - 'scripts/revise_special_relaxed_subsection_spacing.py'
      - 'docs/special-layout-policy.md'
  push:
    branches: [main]
    paths:
      - '.github/workflows/expand-special-validated-source.yml'
      - '.github/workflows/expand-special-validated-source-v2.yml'
      - '.github/workflows/revise-special-mixed-layout.yml'
      - '.github/workflows/build-special-pdf.yml'
      - '.github/workflows/special-source-expansion-contract.yml'
      - 'scripts/expand_special_validated_source.py'
      - 'scripts/run_expand_special_validated_source.py'
      - 'scripts/revise_special_mixed_layout.py'
      - 'scripts/run_revise_special_mixed_layout.py'
      - 'scripts/revise_special_balanced_layout.py'
      - 'scripts/revise_special_adaptive_spacing.py'
      - 'scripts/revise_special_subsection_spacing.py'
      - 'scripts/revise_special_relaxed_subsection_spacing.py'
      - 'docs/special-layout-policy.md'

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify source-expansion and PDF-build control code
        run: |
          set -euo pipefail
          python -m py_compile \
            scripts/expand_special_validated_source.py \
            scripts/run_expand_special_validated_source.py \
            scripts/revise_special_mixed_layout.py \
            scripts/run_revise_special_mixed_layout.py \
            scripts/revise_special_balanced_layout.py \
            scripts/revise_special_adaptive_spacing.py \
            scripts/revise_special_subsection_spacing.py \
            scripts/revise_special_relaxed_subsection_spacing.py
          python - <<'PY'
          from pathlib import Path
          import tempfile
          from scripts import expand_special_validated_source as e
          from scripts import revise_special_balanced_layout as balanced

          assert e.CLASS_LABELS['PRIMARY_FACT']
          assert e.CLASS_LABELS['AUTHOR_CLAIM']
          text=Path('scripts/run_expand_special_validated_source.py').read_text(encoding='utf-8')
          assert 'replace("_", " ")' in text
          assert r'\scriptsize\url{' in text
          assert 'Retrospective Survey' in text
          assert '14.5pt' in text

          mixed=Path('scripts/revise_special_mixed_layout.py').read_text(encoding='utf-8')
          assert r'\twocolumn' in mixed and r'\onecolumn' in mixed
          runner=Path('scripts/run_revise_special_mixed_layout.py').read_text(encoding='utf-8')
          assert 'revision.false = False' in runner and 'revision.true = True' in runner

          balanced_text=Path('scripts/revise_special_balanced_layout.py').read_text(encoding='utf-8')
          assert r'\usepackage{multicol}' in balanced_text
          assert r'\begin{multicols}{2}' in balanced_text
          assert 'full_width_chapter_headings' in balanced_text
          assert 'final_chapter_added' in balanced_text
          with tempfile.TemporaryDirectory() as td:
              src=Path(td)/'article.tex'; body=Path(td)/'body.tex'
              src.write_text('% generated\n\\section{A long full-width heading}\n\\label{pkg:test}\nBody.\n',encoding='utf-8')
              result=balanced.split_article_section(src,body)
              assert result['section_line']==r'\section{A long full-width heading}'
              assert result['label_line']==r'\label{pkg:test}'
              rendered=body.read_text(encoding='utf-8')
              assert r'\section{' not in rendered and r'\label{' not in rendered

          adaptive=Path('scripts/revise_special_adaptive_spacing.py').read_text(encoding='utf-8')
          assert r'\Needspace{0.45\textheight}' in adaptive
          assert 'forced_bibliography_clearpage' in adaptive

          subsection=Path('scripts/revise_special_subsection_spacing.py').read_text(encoding='utf-8')
          assert r'\par\medskip\Needspace{4\baselineskip}' in subsection
          assert 'subsection_spacing_guard' in subsection

          relaxed=Path('scripts/revise_special_relaxed_subsection_spacing.py').read_text(encoding='utf-8')
          assert r'\par\medskip\Needspace{4\baselineskip}' in relaxed
          assert r'\par\medskip' in relaxed
          assert 'remove_subsection_needspace' in relaxed
          assert 'subsection_needspace_removed' in relaxed
          assert 'reader_content_changed' in relaxed

          workflow=Path('.github/workflows/revise-special-mixed-layout.yml').read_text(encoding='utf-8')
          assert 'revise_special_relaxed_subsection_spacing.py' in workflow
          assert 'remove_subsection_needspace' in workflow
          assert 'relaxed_subsection_spacing' in workflow

          policy=Path('docs/special-layout-policy.md').read_text(encoding='utf-8')
          assert 'chapter / feature heading: **one column, full width**' in policy
          assert 'narrative article body: **two columns**' in policy
          assert 'balanced local multi-column environment' in policy
          assert 'final retrospective chapter' in policy
          PY
