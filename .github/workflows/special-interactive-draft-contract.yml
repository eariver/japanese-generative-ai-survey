name: Special interactive Draft contract

on:
  pull_request:
    paths:
      - '.github/workflows/apply-special-interactive-drafts.yml'
      - '.github/workflows/special-interactive-draft-contract.yml'
      - 'scripts/accept_special_interactive_drafts.py'
      - 'scripts/validate_article_draft.py'
      - 'scripts/render_article_draft_tex.py'
      - 'schemas/article-draft-result.schema.json'
      - 'tests/test_accept_special_interactive_drafts.py'
      - 'tests/test_validate_article_draft.py'
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-special-interactive-drafts.yml'
      - '.github/workflows/special-interactive-draft-contract.yml'
      - 'scripts/accept_special_interactive_drafts.py'
      - 'scripts/validate_article_draft.py'
      - 'scripts/render_article_draft_tex.py'
      - 'schemas/article-draft-result.schema.json'
      - 'tests/test_accept_special_interactive_drafts.py'
      - 'tests/test_validate_article_draft.py'

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify interactive Draft acceptance and article validator
        run: |
          set -euo pipefail
          python -m py_compile scripts/accept_special_interactive_drafts.py
          python -m unittest \
            tests.test_accept_special_interactive_drafts \
            tests.test_validate_article_draft
