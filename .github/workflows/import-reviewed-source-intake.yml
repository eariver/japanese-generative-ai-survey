name: Import reviewed source intake

on:
  workflow_dispatch:
    inputs:
      issue_id:
        description: Weekly issue ID (YYYY-Www)
        required: true
        type: string
      source_run_id:
        description: Successful Weekly pipeline source-intake Actions run ID
        required: true
        type: string
      review_reference:
        description: Audit reference proving this artifact was reviewed before acceptance
        required: true
        type: string

permissions:
  contents: write
  actions: write

concurrency:
  group: weekly-source-intake-import-${{ inputs.issue_id }}
  cancel-in-progress: false

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout current automation code from main
        uses: actions/checkout@v6
        with:
          ref: main
          path: control-src
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Resolve and validate source Actions artifact
        id: source
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          ISSUE_ID: ${{ inputs.issue_id }}
          SOURCE_RUN_ID: ${{ inputs.source_run_id }}
        run: |
          set -euo pipefail
          if ! [[ "${ISSUE_ID}" =~ ^[0-9]{4}-W[0-9]{2}$ ]]; then
            echo "::error::issue_id must use YYYY-Www form"
            exit 2
          fi
          if ! [[ "${SOURCE_RUN_ID}" =~ ^[0-9]+$ ]]; then
            echo "::error::source_run_id must be numeric"
            exit 2
          fi

          gh api "repos/${REPOSITORY}/actions/runs/${SOURCE_RUN_ID}" > source-run.json
          gh api "repos/${REPOSITORY}/actions/runs/${SOURCE_RUN_ID}/artifacts?per_page=100" > source-artifacts.json

          python control-src/scripts/resolve_source_intake_artifact.py \
            --run-json source-run.json \
            --artifacts-json source-artifacts.json \
            --repository "${REPOSITORY}" \
            --issue-id "${ISSUE_ID}" \
            --source-run-id "${SOURCE_RUN_ID}" \
            --output source-artifact.json \
            --github-output "${GITHUB_OUTPUT}"

      - name: Require canonical weekly work branch
        id: branch
        shell: bash
        env:
          ISSUE_ID: ${{ inputs.issue_id }}
        run: |
          set -euo pipefail
          branch="weekly/${ISSUE_ID}-work"
          if ! git -C control-src ls-remote --exit-code --heads origin "refs/heads/${branch}" >/dev/null 2>&1; then
            echo "::error::work branch ${branch} does not exist; run Weekly work PR control first"
            exit 1
          fi
          echo "branch=${branch}" >> "${GITHUB_OUTPUT}"

      - name: Checkout weekly work branch
        uses: actions/checkout@v6
        with:
          ref: ${{ steps.branch.outputs.branch }}
          path: worktree
          fetch-depth: 0

      - name: Download exact reviewed source-intake artifact
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          SOURCE_RUN_ID: ${{ inputs.source_run_id }}
          ARTIFACT_NAME: ${{ steps.source.outputs.artifact_name }}
        run: |
          set -euo pipefail
          mkdir -p artifact-download
          gh run download "${SOURCE_RUN_ID}" \
            --repo "${REPOSITORY}" \
            --name "${ARTIFACT_NAME}" \
            --dir artifact-download
          test -s artifact-download/source-intake/source-intake-report.json

      - name: Accept reviewed collector files append-only
        shell: bash
        env:
          ISSUE_ID: ${{ inputs.issue_id }}
          SOURCE_RUN_ID: ${{ inputs.source_run_id }}
          REVIEW_REFERENCE: ${{ inputs.review_reference }}
          ARTIFACT_ID: ${{ steps.source.outputs.artifact_id }}
          ARTIFACT_NAME: ${{ steps.source.outputs.artifact_name }}
          ARTIFACT_DIGEST: ${{ steps.source.outputs.artifact_digest }}
        run: |
          set -euo pipefail
          python control-src/scripts/accept_source_intake_artifact.py \
            --artifact-root artifact-download \
            --repo-root worktree \
            --issue-id "${ISSUE_ID}" \
            --workflow-run-id "${SOURCE_RUN_ID}" \
            --artifact-id "${ARTIFACT_ID}" \
            --artifact-name "${ARTIFACT_NAME}" \
            --artifact-digest "${ARTIFACT_DIGEST}" \
            --review-reference "${REVIEW_REFERENCE}" \
            --report import-result.json

      - name: Update and verify immutable Raw provenance
        shell: bash
        env:
          ISSUE_ID: ${{ inputs.issue_id }}
        run: |
          set -euo pipefail
          python control-src/scripts/raw_provenance.py update \
            --repo-root worktree \
            --issue-id "${ISSUE_ID}" \
            --report raw-update-report.json
          python control-src/scripts/raw_provenance.py check \
            --repo-root worktree \
            --issue-id "${ISSUE_ID}" \
            --report raw-check-report.json

      - name: Commit accepted source intake to weekly work branch
        id: commit
        shell: bash
        env:
          ISSUE_ID: ${{ inputs.issue_id }}
          SOURCE_RUN_ID: ${{ inputs.source_run_id }}
          WORK_BRANCH: ${{ steps.branch.outputs.branch }}
        working-directory: worktree
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "sources/${ISSUE_ID}"
          if git diff --cached --quiet; then
            echo "No new accepted bytes to commit."
            echo "committed=false" >> "${GITHUB_OUTPUT}"
            echo "commit_sha=$(git rev-parse HEAD)" >> "${GITHUB_OUTPUT}"
            exit 0
          fi
          git commit -m "Import reviewed source intake for ${ISSUE_ID} from Actions run ${SOURCE_RUN_ID}"
          git push origin "HEAD:${WORK_BRANCH}"
          echo "committed=true" >> "${GITHUB_OUTPUT}"
          echo "commit_sha=$(git rev-parse HEAD)" >> "${GITHUB_OUTPUT}"

      - name: Refresh weekly Draft PR control after import commit
        if: steps.commit.outputs.committed == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          ISSUE_ID: ${{ inputs.issue_id }}
        run: |
          set -euo pipefail
          gh api --method POST \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2026-03-10' \
            "repos/${REPOSITORY}/actions/workflows/weekly-work-pr.yml/dispatches" \
            -f ref=main \
            -f "inputs[issue_id]=${ISSUE_ID}" >/dev/null

      - name: Upload import audit reports
        uses: actions/upload-artifact@v7
        with:
          name: weekly-source-intake-import-${{ inputs.issue_id }}-${{ inputs.source_run_id }}
          path: |
            source-run.json
            source-artifacts.json
            source-artifact.json
            import-result.json
            raw-update-report.json
            raw-check-report.json
          if-no-files-found: error
          retention-days: 14
