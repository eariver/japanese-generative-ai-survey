name: Core v2 historical publication rejection self patch

on:
  push:
    branches:
      - fix/core-v2-historical-publication-rejection
    paths:
      - '.github/workflows/core-v2-historical-rejection-self-patch.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/core-v2-historical-publication-rejection
          fetch-depth: 0

      - name: Apply exact patch payload
        shell: bash
        run: python tools/tmp_historical_publication_rejection_patch.py

      - name: Commit repaired Core only
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/core-v2-historical-rejection-self-patch.yml tools/tmp_historical_publication_rejection_patch.py
          git add scripts/survey_human_gate_v2.py tests/test_survey_human_gate_v2.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Fix historical Publication Preview rejection recording'
          git push origin HEAD:fix/core-v2-historical-publication-rejection
