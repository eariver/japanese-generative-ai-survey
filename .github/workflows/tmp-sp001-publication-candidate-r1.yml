name: Temporary SP001 publication candidate r1
on:
  push:
    branches:
      - transport/sp001-publication-candidate-r1
permissions:
  contents: write
jobs:
  build-candidate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Core dependencies
        run: python -m pip install -r config/survey-production-v2-requirements.txt
      - name: Build and validate exact Publication Candidate
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          from datetime import datetime, timezone
          from scripts import survey_production_v2 as core
          from scripts import survey_publication_v2 as publication
          from scripts import survey_stage_validation_v2 as stage

          root=Path('.').resolve()
          out=root/'sources/SP001/publication/v2/publication-candidate-v2.json'
          publication.build_candidate(
              root,
              'SP001',
              'LONGFORM_SPECIAL',
              root/'sources/SP001/publication/v2/reader-manuscript-v2.json',
              root/'surveys/special/SP001/main.tex',
              root/'surveys/special/SP001/main.pdf',
              7,
              root/'sources/SP001/publication/v2/quality-regression-bundle-v2.json',
              root/'sources/SP001/publication/v2/semantic-editorial-review-v2.json',
              root/'sources/SP001/publication/v2/visual-review-v2.json',
              out,
          )
          candidate=publication.validate_candidate(root,out,issue_id='SP001')
          cfg=core.load_json(root/core.DEFAULT_CONFIG)
          contract=Path('/tmp/sp001-publication-candidate-stage-contract.json')
          stage.validate_stage(
              root,
              cfg,
              root/'sources/SP001/production-state.json',
              {'publication-candidate': out},
              contract,
              datetime(2026,8,26,14,22,0,tzinfo=timezone.utc),
          )
          print('CANDIDATE_RAW_SHA256',core.sha256_file(out))
          print('CANDIDATE_CONTENT_SHA256',candidate['candidate_sha256'])
          print('STAGE_VALIDATION_PASS',core.sha256_file(contract))
          print('PDF_SHA256',candidate['pdf']['sha256'])
          print('PDF_BYTE_COUNT',candidate['pdf']['byte_count'])
          print('PDF_PAGE_COUNT',candidate['pdf']['page_count'])
          PY
      - name: Commit candidate only
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add sources/SP001/publication/v2/publication-candidate-v2.json
          git commit -m 'Transport: materialize SP001 publication candidate'
          git push origin HEAD:transport/sp001-publication-candidate-r1
