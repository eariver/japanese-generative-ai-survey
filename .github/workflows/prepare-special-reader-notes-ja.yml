name: Prepare Special Technical Notes Japanese summaries

on:
  workflow_dispatch:
    inputs:
      special_slug:
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: special-reader-notes-ja-${{ inputs.special_slug }}
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout current control code
        uses: actions/checkout@v6
        with:
          ref: main
          path: control-src
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Resolve Special edition
        id: edition
        shell: bash
        env:
          SPECIAL_SLUG: ${{ inputs.special_slug }}
        run: |
          set -euo pipefail
          manifest="control-src/specials/${SPECIAL_SLUG}/edition.json"
          test -s "$manifest"
          python control-src/scripts/special_pipeline.py --config control-src/config/special-pipeline.json validate --manifest "$manifest"
          echo "special_id=$(python -c "import json; print(json.load(open('$manifest'))['special_id'])")" >> "$GITHUB_OUTPUT"
          echo "work_branch=$(python -c "import json; print(json.load(open('$manifest'))['paths']['work_branch'])")" >> "$GITHUB_OUTPUT"
      - name: Checkout Special work branch
        uses: actions/checkout@v6
        with:
          ref: ${{ steps.edition.outputs.work_branch }}
          path: worktree
          fetch-depth: 0
      - name: Verify drafting boundary
        shell: bash
        env:
          SPECIAL_ID: ${{ steps.edition.outputs.special_id }}
        run: |
          set -euo pipefail
          python - "$SPECIAL_ID" <<'PY'
          import json,sys,pathlib
          issue=sys.argv[1]
          root=pathlib.Path('worktree')
          state=json.load(open(root/'sources'/issue/'pipeline-state.json',encoding='utf-8'))
          assert state['gates']['article_draft']=='passed'
          assert state['lifecycle_state'] in {'DRAFT_COMPLETE','VALIDATED_DRAFT'}, state['lifecycle_state']
          assert (root/'sources'/issue/'drafting'/'packages'/'v0.1').is_dir()
          PY
      - name: Prepare or fill exact source-text summary artifact
        shell: bash
        env:
          SPECIAL_ID: ${{ steps.edition.outputs.special_id }}
          SPECIAL_SLUG: ${{ inputs.special_slug }}
        run: |
          set -euo pipefail
          output="sources/${SPECIAL_ID}/editorial/technical-notes-ja-v0.1.json"
          overrides="sources/${SPECIAL_ID}/editorial/technical-notes-ja-overrides-v0.1"
          output_path="worktree/${output}"
          overrides_path="worktree/${overrides}"

          if [ ! -s "$output_path" ]; then
            PYTHONPATH=control-src python control-src/scripts/special_reader_notes_ja.py prepare \
              --repo-root worktree \
              --issue-id "$SPECIAL_ID" \
              --output "$output" \
              > special-reader-notes-ja-prepare-audit.json
          else
            python - "$output_path" <<'PY'
          import json,sys
          data=json.load(open(sys.argv[1],encoding='utf-8'))
          assert data.get('issue_id')
          assert data.get('status') in {'DRAFT','READY'}, data.get('status')
          PY
            printf '%s\n' '{"schema_version":"1.0","status":"EXISTING_TEMPLATE_REUSED"}' > special-reader-notes-ja-prepare-audit.json
          fi

          if [[ "$SPECIAL_SLUG" == *-Y ]] && ! { [ -d "$overrides_path" ] && compgen -G "$overrides_path/part-*.json" >/dev/null; }; then
            PYTHONPATH=control-src python control-src/scripts/prepare_annual_reader_notes_ja_overrides.py \
              --repo-root worktree \
              --issue-id "$SPECIAL_ID" \
              --summary "$output" \
              --overrides-dir "$overrides" \
              > special-reader-notes-ja-annual-overrides-audit.json
          fi

          if [ -d "$overrides_path" ] && compgen -G "$overrides_path/part-*.json" >/dev/null; then
            PYTHONPATH=control-src python control-src/scripts/fill_special_reader_notes_ja.py \
              --repo-root worktree \
              --issue-id "$SPECIAL_ID" \
              --summary "$output" \
              --overrides-dir "$overrides" \
              > special-reader-notes-ja-fill-audit.json
          fi

          python - "$output_path" "$overrides_path" <<'PY'
          import json,sys,pathlib
          p=pathlib.Path(sys.argv[1])
          overrides=pathlib.Path(sys.argv[2])
          data=json.load(open(p,encoding='utf-8'))
          assert data['records']
          has_overrides=overrides.is_dir() and any(overrides.glob('part-*.json'))
          if has_overrides:
              assert data['status']=='READY', data['status']
              assert all(str(item.get('text_ja') or '').strip() for r in data['records'] for k in ('claims','limitations','event_facts') for item in r.get(k,[]))
          else:
              assert data['status'] in {'DRAFT','READY'}
          PY
      - name: Commit summary artifact
        working-directory: worktree
        shell: bash
        env:
          SPECIAL_ID: ${{ steps.edition.outputs.special_id }}
          WORK_BRANCH: ${{ steps.edition.outputs.work_branch }}
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "sources/${SPECIAL_ID}/editorial/technical-notes-ja-v0.1.json"
          if [ -d "sources/${SPECIAL_ID}/editorial/technical-notes-ja-overrides-v0.1" ]; then
            git add "sources/${SPECIAL_ID}/editorial/technical-notes-ja-overrides-v0.1"
          fi
          if git diff --cached --quiet; then
            echo 'Japanese Technical Notes summary artifact is already current.'
            exit 0
          fi
          git commit -m "Prepare Japanese Technical Notes summaries for ${SPECIAL_ID}"
          git push origin "HEAD:${WORK_BRANCH}"
      - name: Upload preparation audit
        uses: actions/upload-artifact@v7
        with:
          name: special-reader-notes-ja-${{ inputs.special_slug }}
          path: |
            special-reader-notes-ja-prepare-audit.json
            special-reader-notes-ja-annual-overrides-audit.json
            special-reader-notes-ja-fill-audit.json
          if-no-files-found: error
          retention-days: 14
