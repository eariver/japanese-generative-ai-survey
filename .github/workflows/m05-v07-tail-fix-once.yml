name: Build SP-2026-M05 v0.7 Technical Notes tail fix once

on:
  pull_request:
    types: [synchronize]
    paths:
      - 'sources/SP-2026-M05/editorial/v0.7-tail-fix-trigger.json'

permissions:
  contents: write

concurrency:
  group: special-m05-v07-tail-fix
  cancel-in-progress: false

jobs:
  build:
    if: github.event.pull_request.number == 53 && github.event.pull_request.head.ref == 'special/2026-M05-work'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout canonical control code
        uses: actions/checkout@v6
        with:
          ref: main
          path: control-src
          fetch-depth: 1

      - name: Checkout May work branch
        uses: actions/checkout@v6
        with:
          ref: special/2026-M05-work
          path: worktree
          fetch-depth: 0

      - name: Create immutable v0.7 from verified v0.6
        working-directory: worktree
        shell: bash
        run: |
          set -euo pipefail
          python ../control-src/scripts/raw_provenance.py --repo-root . --issue-id SP-2026-M05 check >/dev/null
          python - <<'PY'
          import copy,hashlib,json,pathlib,shutil
          root=pathlib.Path('.'); issue='SP-2026-M05'; slug='2026-M05'
          state_path=root/'sources'/issue/'pipeline-state.json'; state=json.load(open(state_path,encoding='utf-8'))
          assert state['lifecycle_state']=='RELEASE_CANDIDATE'
          assert state['gates']['latex_build']=='passed' and state['gates']['visual_review']=='pending' and state['gates']['freeze']=='pending'
          cur=copy.deepcopy(state['provenance']['validated_issue_source']); assert cur['source_version']=='v0.6'
          src=root/cur['path']
          def sha(p): return hashlib.sha256(p.read_bytes()).hexdigest()
          assert sha(src)==cur['sha256']
          old=json.load(open(src,encoding='utf-8'))
          out=root/'surveys'/'special'/slug/'revisions'/'v0.7'
          if out.exists(): raise SystemExit('v0.7 already exists')
          shutil.copytree(src.parent,out)
          for name in ['main.pdf','main.log','main.aux','main.bcf','main.run.xml','main.bbl','main.blg','main.fdb_latexmk','main.fls','main.out','main.toc','jgaisurvey.sty']:
              (out/name).unlink(missing_ok=True)
          marker=root/'sources'/issue/'editorial'/'layout-revision-v0.7.json'
          marker_data={
            'schema_version':'1.0','issue_id':issue,'revision':'v0.7','from_source_version':'v0.6','review_issue':55,
            'constraints':{'new_external_evidence_allowed':False,'reader_claim_content_changed':False,'selected_evidence_only':True,'whole_card_unbreakable':False},
            'changes':['Add localized Needspace guard before each final attributed claim so claim + limitation + source tail stays coherent when page space is tight.','Retain source-heading/URL samepage and paragraph widow/orphan controls from v0.6.'],
            'qa_targets':['no page-top URL-only or small limitation/source tail','no Issue #40 structural whitespace regression','Issues #50/#54 remain fixed']
          }
          marker.write_text(json.dumps(marker_data,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          new=copy.deepcopy(old); new['source_version']='v0.7'; new['status']='VALIDATED_TECHNICAL_NOTES_TAIL_LAYOUT_REVISION'
          new['derivation']='Layout-only follow-up to v0.6 after full-page self-check. Reader-facing Japanese wording, taxonomy, selected Evidence, accepted Article Draft content, Architecture, chronology, and narrative layout are unchanged; only localized Technical Notes late-card tail placement is revised.'
          new['basis']=copy.deepcopy(old.get('basis') or {}); new['basis']['previous_source_manifest_path']=cur['path']; new['basis']['previous_source_manifest_sha256']=cur['sha256']
          new['review_repair']=copy.deepcopy(old.get('review_repair') or {}); new['review_repair']['follow_up_revision']='v0.7'; new['review_repair']['issue_55_tail_layout_only']=True; new['review_repair']['layout_revision_path']=marker.relative_to(root).as_posix(); new['review_repair']['layout_revision_sha256']=sha(marker)
          manifest=out/'source-manifest.json'; manifest.write_text(json.dumps(new,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          hist=state.setdefault('provenance_history',{}); hist.setdefault('validated_issue_source',[]).append(cur)
          prev=copy.deepcopy(state.get('provenance',{}).get('latex_build') or {})
          if prev: hist.setdefault('latex_build',[]).append(prev)
          state['lifecycle_state']='VALIDATED_DRAFT'; state['gates']['latex_build']='pending'; state['gates']['visual_review']='pending'; state['gates']['freeze']='pending'
          state['provenance']['validated_issue_source']={'path':manifest.relative_to(root).as_posix(),'sha256':sha(manifest),'source_version':'v0.7','layout_mode':'balanced-multicol-adaptive-spacing-with-may-chronology-review-repairs-tail-guard','layout_revision_path':marker.relative_to(root).as_posix(),'layout_revision_sha256':sha(marker),'reader_facing_notes_language':'ja-reader-summary-v1','reader_facing_technical_notes':True}
          state['provenance'].pop('latex_build',None)
          state['provenance']['reader_layout_revision']={'source_version':'v0.7','layout_revision_path':marker.relative_to(root).as_posix(),'layout_revision_sha256':sha(marker),'reason':'Self-check of v0.6 found small Technical Notes tails at page tops; Issue #55 follow-up.'}
          state_path.write_text(json.dumps(state,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          PY

      - name: Apply localized late-card tail guard and validate reader layer
        working-directory: worktree
        shell: bash
        env:
          PYTHONPATH: ../control-src
        run: |
          set -euo pipefail
          python ../control-src/scripts/postprocess_special_reader_facing_notes.py --repo-root . --issue-id SP-2026-M05 --special-slug 2026-M05 --source-version v0.7
          python ../control-src/scripts/special_reader_notes_ja.py check --repo-root . --issue-id SP-2026-M05
          python - <<'PY'
          import json,pathlib
          root=pathlib.Path('.'); s=json.load(open(root/'sources/SP-2026-M05/pipeline-state.json',encoding='utf-8'))
          m=root/s['provenance']['validated_issue_source']['path']; d=json.load(open(m,encoding='utf-8'))
          texts='\n'.join((m.parent/a['technical_notes_path']).read_text(encoding='utf-8') for a in d['articles'])
          assert texts.count('reader-facing Technical Notes late-card tail guard') >= 26
          assert texts.count('\\Needspace{12\\baselineskip}') >= 26
          assert 'The preserved primary source identifies' not in texts
          for token in ['OTHER','OFFICIAL\\_PUBLICATION','PRODUCT\\_UPDATE','モデル\\_RELEASE','研究\\_RELEASE','論文\\_RELEASE']:
              assert token not in texts, token
          assert texts.count('評価ガイダンス') >= 2
          PY

      - name: Commit v0.7 source before build
        working-directory: worktree
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'; git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add sources/SP-2026-M05/pipeline-state.json sources/SP-2026-M05/editorial/layout-revision-v0.7.json surveys/special/2026-M05/revisions/v0.7
          git commit -m 'Add M05 v0.7 Technical Notes tail layout revision'
          git push origin HEAD:special/2026-M05-work

      - name: Pin survey style
        shell: bash
        run: cp control-src/templates/survey/jgaisurvey.sty worktree/surveys/special/2026-M05/revisions/v0.7/jgaisurvey.sty

      - name: Set reproducible PDF timestamp
        run: echo 'SOURCE_DATE_EPOCH=1779926400' >> "$GITHUB_ENV"

      - name: Compile v0.7 Preview
        uses: xu-cheng/latex-action@v4
        with:
          root_file: main.tex
          working_directory: worktree/surveys/special/2026-M05/revisions/v0.7
          texlive_version: 2026
          latexmk_use_lualatex: true
          os: alpine

      - name: Audit v0.7 Preview
        id: audit
        shell: bash
        run: |
          set -euo pipefail
          dir=worktree/surveys/special/2026-M05/revisions/v0.7; pdf="$dir/main.pdf"; log="$dir/main.log"
          test -s "$pdf" && test -s "$log"
          bad=$(grep -E -n 'LaTeX Warning: (There were undefined references|Citation .* undefined)|Package biblatex Warning: Please (re)?run|Overfull \\hbox|Underfull \\hbox|Missing character:' "$log" || true)
          pages=$(python - "$log" <<'PY'
          import re,sys
          t=open(sys.argv[1],encoding='utf-8',errors='replace').read(); v=re.findall(r'Output written on .*?\((\d+) pages?',t,re.S); print(v[-1] if v else '-1')
          PY
          )
          sha=$(sha256sum "$pdf" | awk '{print $1}'); [ -z "$bad" ] && clean=true || clean=false
          python - "$pages" "$sha" "$clean" "$bad" <<'PY'
          import json,sys
          pages,sha,clean,bad=sys.argv[1:]; n=int(pages)
          r={'schema_version':'1.0','issue_id':'SP-2026-M05','source_version':'v0.7','page_count':n,'pdf_sha256':sha,'log_clean':clean=='true','log_gate_findings':bad.splitlines() if bad else [],'page_target_min':32,'page_target_max':40,'page_budget_passed':32<=n<=40,'review_issues':[50,54,55],'self_check_follow_up':'Issue #55 late-card tail'}
          open('special-pdf-build-audit.json','w',encoding='utf-8').write(json.dumps(r,ensure_ascii=False,indent=2)+'\n'); print(json.dumps(r,ensure_ascii=False,indent=2))
          if not r['log_clean'] or not r['page_budget_passed']: raise SystemExit(1)
          PY
          echo "pages=$pages" >> "$GITHUB_OUTPUT"; echo "sha=$sha" >> "$GITHUB_OUTPUT"

      - name: Upload v0.7 Preview artifact
        uses: actions/upload-artifact@v7
        with:
          name: japanese-generative-ai-survey-special-2026-M05-v0.7
          path: |
            worktree/surveys/special/2026-M05/revisions/v0.7/main.pdf
            worktree/surveys/special/2026-M05/revisions/v0.7/main.log
            special-pdf-build-audit.json
          if-no-files-found: error
          retention-days: 14

      - name: Record v0.7 release candidate with Visual Review pending
        working-directory: worktree
        shell: bash
        env:
          PAGES: ${{ steps.audit.outputs.pages }}
          PDF_SHA: ${{ steps.audit.outputs.sha }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib,json,pathlib,os
          p=pathlib.Path('sources/SP-2026-M05/pipeline-state.json'); s=json.load(open(p,encoding='utf-8')); src=s['provenance']['validated_issue_source']; m=pathlib.Path(src['path'])
          assert src['source_version']=='v0.7' and hashlib.sha256(m.read_bytes()).hexdigest()==src['sha256']
          s['lifecycle_state']='RELEASE_CANDIDATE'; s['gates']['latex_build']='passed'; s['gates']['visual_review']='pending'; s['gates']['freeze']='pending'
          s['provenance']['latex_build']={'workflow_run_id':int(os.environ['RUN_ID']),'pdf_sha256':os.environ['PDF_SHA'],'page_count':int(os.environ['PAGES']),'source_version':'v0.7','validated_issue_source_path':src['path'],'validated_issue_source_sha256':src['sha256'],'preview_only':True,'log_clean':True,'review_issues_addressed':[50,54,55],'self_check_follow_up':'Issue #55 late-card tail'}
          p.write_text(json.dumps(s,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          PY
          git config user.name 'github-actions[bot]'; git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add sources/SP-2026-M05/pipeline-state.json
          git commit -m 'Record M05 v0.7 pre-Human Preview candidate'
          git push origin HEAD:special/2026-M05-work
