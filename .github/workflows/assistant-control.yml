name: Assistant workflow control

on:
  push:
    branches:
      - automation-control
    paths:
      - 'automation/request.json'

permissions:
  contents: write
  actions: write

concurrency:
  group: assistant-workflow-control
  cancel-in-progress: false

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout automation control branch
        uses: actions/checkout@v6
        with:
          ref: automation-control
          fetch-depth: 1

      - name: Validate request and dispatch allowlisted workflow
        id: dispatch
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import datetime as dt
          import json
          import os
          import pathlib
          import urllib.request

          request_path = pathlib.Path('automation/request.json')
          request = json.loads(request_path.read_text(encoding='utf-8'))

          if request.get('schema_version') != '1.0':
              raise SystemExit('unsupported automation request schema_version')
          nonce = request.get('nonce')
          if not isinstance(nonce, str) or not nonce.strip():
              raise SystemExit('request nonce is required')
          workflow = request.get('workflow')
          inputs = request.get('inputs') or {}
          if not isinstance(inputs, dict):
              raise SystemExit('inputs must be an object')

          allowed = {
              'weekly-pipeline': {
                  'file': 'weekly-pipeline.yml',
                  'keys': {'command', 'issue_id', 'collector', 'target'},
                  'values': {
                      'command': {'plan', 'source-intake', 'validate', 'raw-index', 'raw-check'},
                      'collector': {'all', 'arxiv', 'github', 'official'},
                      'target': {'selection', 'draft', 'release-candidate', 'frozen'},
                  },
              },
              'build-weekly-survey': {
                  'file': 'build-weekly-survey.yml',
                  'keys': {'issue_id'},
                  'values': {},
              },
              'release-weekly-survey': {
                  'file': 'release-weekly-survey.yml',
                  'keys': {'issue_id', 'revision', 'mode', 'confirmation'},
                  'values': {'mode': {'validate', 'draft', 'publish'}},
              },
          }
          spec = allowed.get(workflow)
          if spec is None:
              raise SystemExit(f'workflow is not allowlisted: {workflow!r}')
          unknown = set(inputs) - spec['keys']
          if unknown:
              raise SystemExit(f'unknown inputs for {workflow}: {sorted(unknown)}')
          for key, choices in spec['values'].items():
              if key in inputs and str(inputs[key]) not in choices:
                  raise SystemExit(f'invalid {key}: {inputs[key]!r}')

          if workflow == 'release-weekly-survey' and inputs.get('mode') == 'publish':
              if request.get('publish_authorized') is not True:
                  raise SystemExit('release publish requires publish_authorized=true in the control request')

          ref = request.get('ref', 'main')
          if ref != 'main':
              raise SystemExit('assistant control may dispatch only the main ref')

          payload = json.dumps({'ref': ref, 'inputs': {k: str(v) for k, v in inputs.items()}}).encode('utf-8')
          url = f"https://api.github.com/repos/{os.environ['REPOSITORY']}/actions/workflows/{spec['file']}/dispatches"
          req = urllib.request.Request(
              url,
              data=payload,
              method='POST',
              headers={
                  'Accept': 'application/vnd.github+json',
                  'Authorization': f"Bearer {os.environ['GH_TOKEN']}",
                  'X-GitHub-Api-Version': '2026-03-10',
                  'Content-Type': 'application/json',
                  'User-Agent': 'japanese-generative-ai-survey-assistant-control',
              },
          )
          with urllib.request.urlopen(req, timeout=30) as response:
              body = response.read()
              status = response.status
          if status not in (200, 204):
              raise SystemExit(f'workflow dispatch returned HTTP {status}: {body!r}')
          response_data = json.loads(body.decode('utf-8')) if body else {}
          result = {
              'schema_version': '1.0',
              'request_nonce': nonce,
              'workflow': workflow,
              'workflow_file': spec['file'],
              'ref': ref,
              'inputs': inputs,
              'dispatched_at': dt.datetime.now(dt.timezone.utc).isoformat(timespec='seconds'),
              'http_status': status,
              'workflow_run_id': response_data.get('workflow_run_id'),
              'html_url': response_data.get('html_url'),
              'run_url': response_data.get('run_url'),
          }
          pathlib.Path('automation/last-result.json').write_text(
              json.dumps(result, ensure_ascii=False, indent=2) + '\n', encoding='utf-8'
          )
          print(json.dumps(result, ensure_ascii=False, indent=2))
          PY

      - name: Persist dispatch result without recursive workflow trigger
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add automation/last-result.json
          if git diff --cached --quiet; then
            echo 'No dispatch-result change to persist.'
            exit 0
          fi
          nonce="$(python -c "import json; print(json.load(open('automation/request.json'))['nonce'])")"
          git commit -m "Record assistant workflow dispatch ${nonce}"
          git push origin HEAD:automation-control
