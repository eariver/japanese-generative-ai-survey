name: Assistant workflow control

on:
  push:
    branches:
      - automation-control
    paths:
      - 'automation/request.json'

permissions:
  contents: write
  actions: write

concurrency:
  group: assistant-workflow-control
  cancel-in-progress: false

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout automation control branch
        uses: actions/checkout@v6
        with:
          ref: automation-control
          fetch-depth: 1

      - name: Validate request and dispatch allowlisted workflow
        id: dispatch
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import datetime as dt
          import json
          import os
          import pathlib
          import urllib.request

          request_path = pathlib.Path('automation/request.json')
          request = json.loads(request_path.read_text(encoding='utf-8'))

          if request.get('schema_version') != '1.0':
              raise SystemExit('unsupported automation request schema_version')
          nonce = request.get('nonce')
          if not isinstance(nonce, str) or not nonce.strip():
              raise SystemExit('request nonce is required')
          workflow = request.get('workflow')
          inputs = request.get('inputs') or {}
          if not isinstance(inputs, dict):
              raise SystemExit('inputs must be an object')

          allowed = {
              # Weekly production workflows.
              'weekly-pipeline': {
                  'file': 'weekly-pipeline.yml',
                  'keys': {'command', 'issue_id', 'collector', 'target'},
                  'values': {
                      'command': {'plan', 'source-intake', 'validate', 'raw-index', 'raw-check'},
                      'collector': {'all', 'arxiv', 'github', 'official'},
                      'target': {'selection', 'draft', 'release-candidate', 'frozen'},
                  },
              },
              'build-weekly-survey': {
                  'file': 'build-weekly-survey.yml',
                  'keys': {'issue_id'},
                  'values': {},
              },
              'release-weekly-survey': {
                  'file': 'release-weekly-survey.yml',
                  'keys': {'issue_id', 'revision', 'mode', 'confirmation'},
                  'values': {'mode': {'validate', 'draft', 'publish'}},
              },
              'screening-contract': {
                  'file': 'screening-contract.yml',
                  'keys': set(),
                  'values': {},
              },
              'evidence-contract': {
                  'file': 'evidence-contract.yml',
                  'keys': set(),
                  'values': {},
              },
              'weekly-work-pr': {
                  'file': 'weekly-work-pr.yml',
                  'keys': {'issue_id'},
                  'values': {},
              },
              'import-reviewed-source-intake': {
                  'file': 'import-reviewed-source-intake.yml',
                  'keys': {'issue_id', 'source_run_id', 'review_reference'},
                  'values': {},
              },
              'prepare-weekly-screening': {
                  'file': 'prepare-weekly-screening.yml',
                  'keys': {'issue_id', 'source_ref'},
                  'values': {},
              },
              'apply-weekly-interactive-screening': {
                  'file': 'apply-weekly-interactive-screening.yml',
                  'keys': {'issue_id', 'review_reference'},
                  'values': {},
              },
              'prepare-weekly-evidence': {
                  'file': 'prepare-weekly-evidence.yml',
                  'keys': {'issue_id', 'screening_run_sha'},
                  'values': {},
              },
              'apply-weekly-interactive-evidence': {
                  'file': 'apply-weekly-interactive-evidence.yml',
                  'keys': {'issue_id', 'review_reference'},
                  'values': {},
              },
              'revise-weekly-interactive-evidence': {
                  'file': 'revise-weekly-interactive-evidence.yml',
                  'keys': {'issue_id', 'prior_evidence_run_sha', 'review_reference'},
                  'values': {},
              },
              'prepare-weekly-candidate-selection': {
                  'file': 'prepare-weekly-candidate-selection.yml',
                  'keys': {'issue_id', 'evidence_run_sha'},
                  'values': {},
              },

              # Canonical Special production workflows. Normal human interaction
              # stops only at Architecture Review and Publication Preview.
              'special-pipeline': {
                  'file': 'special-pipeline.yml',
                  'keys': {'command', 'special_slug', 'collector'},
                  'values': {
                      'command': {'plan', 'validate', 'history-plan', 'source-intake'},
                      'collector': {'all', 'arxiv', 'github', 'official'},
                  },
              },
              'import-reviewed-special-source-intake': {
                  'file': 'import-reviewed-special-source-intake.yml',
                  'keys': {'special_slug', 'source_run_id', 'review_reference'},
                  'values': {},
              },
              'collect-special-supplemental-primary-sources': {
                  'file': 'collect-special-supplemental-primary-sources.yml',
                  'keys': {'special_slug', 'plan_revision', 'review_reference'},
                  'values': {},
              },
              'apply-special-interactive-screening': {
                  'file': 'apply-special-interactive-screening.yml',
                  'keys': {'special_slug', 'review_reference'},
                  'values': {},
              },
              'prepare-special-evidence': {
                  'file': 'prepare-special-evidence.yml',
                  'keys': {'special_slug', 'screening_run_sha'},
                  'values': {},
              },
              'apply-special-interactive-evidence': {
                  'file': 'apply-special-interactive-evidence.yml',
                  'keys': {'special_slug', 'review_reference'},
                  'values': {},
              },
              'revise-special-interactive-evidence': {
                  'file': 'revise-special-interactive-evidence.yml',
                  'keys': {'special_slug', 'prior_evidence_run_sha', 'review_reference'},
                  'values': {},
              },
              # Candidate Selection is an auditable editorial checkpoint, not a
              # separate user stop. It prepares the Architecture proposal.
              'apply-special-selection-and-propose-architecture': {
                  'file': 'apply-special-selection-and-propose-architecture.yml',
                  'keys': {'special_slug', 'evidence_run_sha', 'approval_reference'},
                  'values': {},
              },
              # Human Gate 1: Architecture Review.
              'approve-special-architecture-and-prepare-drafts': {
                  'file': 'approve-special-architecture-and-prepare-drafts.yml',
                  'keys': {'special_slug', 'evidence_run_sha', 'approval_reference'},
                  'values': {},
                  'human_gate': True,
              },
              'apply-special-interactive-drafts': {
                  'file': 'apply-special-interactive-drafts.yml',
                  'keys': {'special_slug', 'review_reference'},
                  'values': {},
              },
              'finalize-special-validated-draft': {
                  'file': 'finalize-special-validated-draft.yml',
                  'keys': {'special_slug', 'review_reference'},
                  'values': {},
              },
              'prepare-special-reader-notes-ja': {
                  'file': 'prepare-special-reader-notes-ja.yml',
                  'keys': {'special_slug'},
                  'values': {},
              },
              'expand-special-validated-source-v2': {
                  'file': 'expand-special-validated-source-v2.yml',
                  'keys': {'special_slug', 'source_version'},
                  'values': {},
              },
              'build-special-pdf': {
                  'file': 'build-special-pdf.yml',
                  'keys': {'special_slug'},
                  'values': {},
              },
              'revise-special-mixed-layout': {
                  'file': 'revise-special-mixed-layout.yml',
                  'keys': {'special_slug', 'source_version'},
                  'values': {},
              },
              # Human Gate 2: Publication Preview. One approval SHA-binds the PDF
              # and authorizes deterministic Visual Review recording, Freeze,
              # merge, and public Release.
              'accept-special-publication-preview-issue-only': {
                  'file': 'accept-special-publication-preview-issue-only.yml',
                  'keys': {'special_slug', 'approved_pdf_sha256', 'approved_at', 'approval_reference'},
                  'values': {},
                  'human_gate': True,
              },
              # Internal recovery after an already-approved Publication Preview.
              # Recovery workflows derive authority from the committed approval;
              # they accept no new approval timestamp/reference.
              'accept-special-freeze-issue-only': {
                  'file': 'accept-special-freeze-issue-only.yml',
                  'keys': {'special_slug'},
                  'values': {},
              },
              'publish-special-frozen-release-issue-only': {
                  'file': 'publish-special-frozen-release-issue-only.yml',
                  'keys': {'special_slug'},
                  'values': {},
              },
          }
          spec = allowed.get(workflow)
          if spec is None:
              raise SystemExit(f'workflow is not allowlisted: {workflow!r}')
          unknown = set(inputs) - spec['keys']
          if unknown:
              raise SystemExit(f'unknown inputs for {workflow}: {sorted(unknown)}')
          for key, choices in spec['values'].items():
              if key in inputs and str(inputs[key]) not in choices:
                  raise SystemExit(f'invalid {key}: {inputs[key]!r}')

          if spec.get('human_gate') and request.get('human_gate_authorized') is not True:
              raise SystemExit(f'{workflow} requires human_gate_authorized=true in the control request')

          if workflow == 'release-weekly-survey' and inputs.get('mode') == 'publish':
              if request.get('publish_authorized') is not True:
                  raise SystemExit('release publish requires publish_authorized=true in the control request')

          ref = request.get('ref', 'main')
          if ref != 'main':
              raise SystemExit('assistant control may dispatch only the main ref')

          payload = json.dumps({'ref': ref, 'inputs': {k: str(v) for k, v in inputs.items()}}).encode('utf-8')
          url = f"https://api.github.com/repos/{os.environ['REPOSITORY']}/actions/workflows/{spec['file']}/dispatches"
          req = urllib.request.Request(
              url,
              data=payload,
              method='POST',
              headers={
                  'Accept': 'application/vnd.github+json',
                  'Authorization': f"Bearer {os.environ['GH_TOKEN']}",
                  'X-GitHub-Api-Version': '2026-03-10',
                  'Content-Type': 'application/json',
                  'User-Agent': 'japanese-generative-ai-survey-assistant-control',
              },
          )
          with urllib.request.urlopen(req, timeout=30) as response:
              body = response.read()
              status = response.status
          if status not in (200, 204):
              raise SystemExit(f'workflow dispatch returned HTTP {status}: {body!r}')
          response_data = json.loads(body.decode('utf-8')) if body else {}
          result = {
              'schema_version': '1.0',
              'request_nonce': nonce,
              'workflow': workflow,
              'workflow_file': spec['file'],
              'ref': ref,
              'inputs': inputs,
              'dispatched_at': dt.datetime.now(dt.timezone.utc).isoformat(timespec='seconds'),
              'http_status': status,
              'workflow_run_id': response_data.get('workflow_run_id'),
              'html_url': response_data.get('html_url'),
              'run_url': response_data.get('run_url'),
          }
          pathlib.Path('automation/last-result.json').write_text(
              json.dumps(result, ensure_ascii=False, indent=2) + '\n', encoding='utf-8'
          )
          print(json.dumps(result, ensure_ascii=False, indent=2))
          PY

      - name: Persist dispatch result without recursive workflow trigger
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add automation/last-result.json
          if git diff --cached --quiet; then
            echo 'No dispatch-result change to persist.'
            exit 0
          fi
          nonce="$(python -c "import json; print(json.load(open('automation/request.json'))['nonce'])")"
          git commit -m "Record assistant workflow dispatch ${nonce}"
          git push origin HEAD:automation-control
