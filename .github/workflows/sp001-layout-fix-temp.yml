name: Temporary SP001 layout fix

on:
  push:
    branches:
      - special/SP001-v2-work
    paths:
      - '.github/workflows/sp001-layout-fix-temp.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: special/SP001-v2-work
          fetch-depth: 0
      - name: Remove redundant forced page break
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p = Path('surveys/special/SP001/main.tex')
          text = p.read_text(encoding='utf-8')
          old = r'''\clearpage
          \onecolumn
          \section{最終総括: 2026年のfrontierで収束したもの、残った差}'''.replace('          ', '')
          new = r'''\section{最終総括: 2026年のfrontierで収束したもの、残った差}'''
          if text.count(old) != 1:
              raise SystemExit(f'expected exact layout sequence once, found {text.count(old)}')
          p.write_text(text.replace(old, new), encoding='utf-8')
          PY
          git rm .github/workflows/sp001-layout-fix-temp.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add surveys/special/SP001/main.tex
          git commit -m 'Fix SP001 internal-page balance for Publication r2'
          git push origin HEAD:special/SP001-v2-work
