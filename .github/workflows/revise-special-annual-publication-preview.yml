name: Revise Special Annual Publication Preview

on:
  workflow_dispatch:
    inputs:
      special_slug:
        required: true
        type: string
      source_specific_version:
        description: First immutable revision for source-specific Technical Notes; ordered Annual repairs use the next five revisions.
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: special-annual-publication-preview-${{ inputs.special_slug }}
  cancel-in-progress: false

jobs:
  revise:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout current control code
        uses: actions/checkout@v6
        with:
          ref: main
          path: control-src
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Resolve Annual Special edition
        id: edition
        shell: bash
        env:
          SPECIAL_SLUG: ${{ inputs.special_slug }}
        run: |
          set -euo pipefail
          manifest="control-src/specials/${SPECIAL_SLUG}/edition.json"
          test -s "$manifest"
          python control-src/scripts/special_pipeline.py --config control-src/config/special-pipeline.json validate --manifest "$manifest"
          python - "$manifest" "$GITHUB_OUTPUT" <<'PY'
          import json,sys
          manifest,out=sys.argv[1:]
          value=json.load(open(manifest,encoding='utf-8'))
          assert value['edition_kind']=='RETROSPECTIVE_PERIOD'
          assert value['special_slug'].endswith('-Y')
          with open(out,'a',encoding='utf-8') as f:
              f.write(f"special_id={value['special_id']}\n")
              f.write(f"work_branch={value['paths']['work_branch']}\n")
          PY

      - name: Checkout Annual Special work branch
        uses: actions/checkout@v6
        with:
          ref: ${{ steps.edition.outputs.work_branch }}
          path: worktree
          fetch-depth: 0

      - name: Verify immutable upstream and pre-Publication-Preview boundary
        shell: bash
        env:
          SPECIAL_ID: ${{ steps.edition.outputs.special_id }}
          SOURCE_VERSION: ${{ inputs.source_specific_version }}
        run: |
          set -euo pipefail
          python control-src/scripts/raw_provenance.py --repo-root worktree --issue-id "$SPECIAL_ID" check
          python - "$SPECIAL_ID" "$SOURCE_VERSION" <<'PY'
          import hashlib,json,os,pathlib,re,sys
          issue,version=sys.argv[1:]
          root=pathlib.Path('worktree')
          state=json.load(open(root/'sources'/issue/'pipeline-state.json',encoding='utf-8'))
          assert state['lifecycle_state']=='RELEASE_CANDIDATE'
          gates=state['gates']
          assert gates['issue_architecture']=='passed'
          assert gates['article_draft']=='passed'
          assert gates['claim_and_chronology_validation']=='passed'
          assert gates['latex_build']=='passed'
          assert gates['visual_review']=='pending'
          assert gates['freeze']=='pending'
          assert 'publication_preview' not in state.get('provenance',{})
          current=state['provenance']['validated_issue_source']
          current_path=root/current['path']
          assert current_path.is_file()
          assert hashlib.sha256(current_path.read_bytes()).hexdigest()==current['sha256']
          marker=root/'sources'/issue/'editorial'/f'layout-revision-{version}.json'
          value=json.load(open(marker,encoding='utf-8'))
          changes=value.get('layout_changes') or {}
          constraints=value.get('constraints') or {}
          assert changes.get('annual_source_specific_notes_v1') is True
          assert changes.get('half_year_review_repairs_v3') is True
          assert constraints.get('new_external_evidence_allowed') is False
          assert constraints.get('selected_evidence_only') is True
          assert constraints.get('accepted_article_claims_changed') is False
          assert constraints.get('evidence_cards_mutated') is False
          chronology=state['provenance']['annual_chronology']
          chrono_path=root/chronology['path']
          assert chrono_path.is_file()
          assert hashlib.sha256(chrono_path.read_bytes()).hexdigest()==chronology['sha256']
          event_count=int(chronology['event_count'])
          unresolved=int(chronology['unresolved_date_count'])
          assert event_count >= 1
          assert 0 <= unresolved <= event_count
          match=re.fullmatch(r'v(\d+)\.(\d+)',version)
          assert match, version
          final=f"v{match.group(1)}.{int(match.group(2))+5}"
          with open(os.environ['GITHUB_ENV'],'a',encoding='utf-8') as f:
              f.write(f"BASE_ANNUAL_CHRONOLOGY_EVENT_COUNT={event_count}\n")
              f.write(f"BASE_ANNUAL_CHRONOLOGY_UNRESOLVED_DATE_COUNT={unresolved}\n")
              f.write(f"FINAL_SOURCE_VERSION={final}\n")
          PY

      - name: Repair source-specific Annual Technical Notes (#139)
        shell: bash
        env:
          SPECIAL_ID: ${{ steps.edition.outputs.special_id }}
          SPECIAL_SLUG: ${{ inputs.special_slug }}
          SOURCE_VERSION: ${{ inputs.source_specific_version }}
        run: |
          set -euo pipefail
          PYTHONPATH=control-src python control-src/scripts/revise_special_annual_source_specific_notes_v5.py \
            --repo-root worktree \
            --special-slug "$SPECIAL_SLUG" \
            --issue-id "$SPECIAL_ID" \
            --source-version "$SOURCE_VERSION" \
            > annual-source-specific-audit.json
          cat annual-source-specific-audit.json

      - name: Apply ordered Annual review repairs (#54 #78 #140 #271 #272 #122)
        shell: bash
        env:
          SPECIAL_ID: ${{ steps.edition.outputs.special_id }}
          SPECIAL_SLUG: ${{ inputs.special_slug }}
          SOURCE_VERSION: ${{ inputs.source_specific_version }}
        run: |
          set -euo pipefail
          PYTHONPATH=control-src python control-src/scripts/revise_special_annual_review_sequence_generic_v2.py \
            --repo-root worktree \
            --special-slug "$SPECIAL_SLUG" \
            --issue-id "$SPECIAL_ID" \
            --parent-source-version "$SOURCE_VERSION" \
            > annual-ordered-review-audit.json
          cat annual-ordered-review-audit.json

      - name: Verify repaired Annual reader contract
        shell: bash
        env:
          SPECIAL_ID: ${{ steps.edition.outputs.special_id }}
        run: |
          set -euo pipefail
          python - "$SPECIAL_ID" <<'PY'
          import hashlib,json,os,pathlib,re,sys
          issue=sys.argv[1]
          root=pathlib.Path('worktree')
          state=json.load(open(root/'sources'/issue/'pipeline-state.json',encoding='utf-8'))
          assert state['lifecycle_state']=='VALIDATED_DRAFT'
          gates=state['gates']
          assert gates['issue_architecture']=='passed'
          assert gates['article_draft']=='passed'
          assert gates['claim_and_chronology_validation']=='passed'
          assert gates['latex_build']=='pending'
          assert gates['visual_review']=='pending'
          assert gates['freeze']=='pending'
          assert 'publication_preview' not in state.get('provenance',{})
          source=state['provenance']['validated_issue_source']
          assert source['source_version']==os.environ['FINAL_SOURCE_VERSION']
          manifest_path=root/source['path']
          assert manifest_path.is_file()
          assert hashlib.sha256(manifest_path.read_bytes()).hexdigest()==source['sha256']
          manifest=json.load(open(manifest_path,encoding='utf-8'))
          assert manifest['source_version']==os.environ['FINAL_SOURCE_VERSION']
          steps=[str(x.get('step')) for x in (manifest.get('ordered_review_repairs') or [])[-5:]]
          assert steps==['54','78-140','271','272','122'], steps

          reader=manifest.get('reader_facing_technical_notes') or {}
          assert reader.get('generic_fallback_policy')=='forbidden-fail-closed'
          assert int(reader.get('generic_fallback_findings') or 0)==0
          assert int(reader.get('source_specific_detail_visible_card_count') or 0) >= 1
          assert reader.get('source_specific_detail_visible_card_count')==reader.get('source_specific_detail_enrichment_count')

          source_dir=manifest_path.parent
          rendered=[]
          for article in manifest.get('articles') or []:
              count=int(article.get('evidence_record_count') or 0)
              rel=str(article.get('technical_notes_path') or '')
              if count > 0:
                  path=source_dir/rel
                  assert path.is_file(), rel
                  rendered.append(path.read_text(encoding='utf-8'))
          notes='\n'.join(rendered)
          generic_patterns=(
              r'一次資料で「.+?」が\d{4}年の生成AI技術記録に含まれることを確認できる',
              r'一次資料で「.+?」の\d{4}年における公開・リリースの経緯を確認できる',
              r'一次資料で確認できる範囲の事実を記録しており、提供元・プロジェクト・著者による評価を独立再現済みの結果として扱わない',
          )
          for pattern in generic_patterns:
              assert not re.search(pattern,notes), pattern
          assert '時系列 & —' not in notes
          assert not re.search(r'種別\s*&\s*(?:OTHER|PRODUCT|[A-Z][A-Z0-9]+_[A-Z0-9_]+)\s*\\\\',notes)

          issue271=manifest.get('issue_271') or {}
          assert int(issue271.get('suppressed_count') or 0) >= 1
          main=(source_dir/'main.tex').read_text(encoding='utf-8')
          for article in manifest.get('articles') or []:
              if int(article.get('evidence_record_count') or 0) != 0:
                  continue
              rel=str(article.get('technical_notes_path') or '')
              if rel:
                  token='\\input{'+pathlib.Path(rel).with_suffix('').as_posix()+'}'
                  assert token not in main, token

          chronology=state['provenance']['annual_chronology']
          assert int(chronology['event_count'])==int(os.environ['BASE_ANNUAL_CHRONOLOGY_EVENT_COUNT'])
          assert int(chronology['unresolved_date_count'])==int(os.environ['BASE_ANNUAL_CHRONOLOGY_UNRESOLVED_DATE_COUNT'])
          issue272=manifest.get('issue_272') or {}
          assert issue272.get('q1_q4_narrative_preserved') is True
          assert int(issue272.get('dated_event_count') or 0)==int(os.environ['BASE_ANNUAL_CHRONOLOGY_EVENT_COUNT'])
          assert int(issue272.get('cited_event_count') or 0)==int(os.environ['BASE_ANNUAL_CHRONOLOGY_EVENT_COUNT'])
          index_path=source_dir/str(issue272['objective_index_path'])
          assert index_path.is_file()
          index=index_path.read_text(encoding='utf-8')
          assert index.count('\\cite{')==int(os.environ['BASE_ANNUAL_CHRONOLOGY_EVENT_COUNT'])
          chrono_article=next(a for a in manifest['articles'] if a.get('package_id')=='annual-chronology')
          narrative_path=source_dir/chrono_article['layout_body_path']
          assert hashlib.sha256(narrative_path.read_bytes()).hexdigest()==issue272['narrative_sha256']

          issue122=manifest.get('issue_122') or {}
          assert issue122.get('toc_depth')==1
          assert issue122.get('toc_render_size')=='footnotesize'
          assert issue122.get('compact_rendering') is True
          front=source_dir/str((manifest.get('frontmatter') or {}).get('path') or 'sections/00-frontmatter.tex')
          front_text=front.read_text(encoding='utf-8')
          assert '\\setcounter{tocdepth}{1}' in front_text
          assert '\\footnotesize' in front_text

          refs=source_dir/str((manifest.get('references') or {}).get('path') or 'references.bib')
          refs_text=refs.read_text(encoding='utf-8')
          assert 'Primary source used for chronology and technical verification.' not in refs_text
          assert not re.search(r'title\s*=\s*\{Primary source \d+',refs_text)
          assert 'Language Models are Few-Shot Learners' in refs_text or 'Language models are few-shot learners' in refs_text
          assert 'Retrieval-Augmented Generation for Knowledge-Intensive NLP Tasks' in refs_text
          PY

      - name: Commit revised Annual source
        working-directory: worktree
        shell: bash
        env:
          SPECIAL_ID: ${{ steps.edition.outputs.special_id }}
          WORK_BRANCH: ${{ steps.edition.outputs.work_branch }}
          SPECIAL_SLUG: ${{ inputs.special_slug }}
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A "surveys/special/${SPECIAL_SLUG}" "sources/${SPECIAL_ID}"
          git diff --cached --quiet && { echo 'No Annual Publication Preview repair changes to commit' >&2; exit 1; }
          git commit -m "Repair ${SPECIAL_ID} Annual Publication Preview findings"
          git push origin "HEAD:${WORK_BRANCH}"

      - name: Upload repair audits
        uses: actions/upload-artifact@v4
        with:
          name: annual-publication-preview-${{ inputs.special_slug }}-${{ env.FINAL_SOURCE_VERSION }}
          path: |
            annual-source-specific-audit.json
            annual-ordered-review-audit.json
          if-no-files-found: error
          retention-days: 14
