name: One-time SP-2023-Y ordered review repairs
on:
  push:
    branches: [special/2023-Y-work]
    paths: ['.github/workflows/sp-2023-y-ordered-review-repairs.yml']
permissions:
  contents: write
concurrency:
  group: sp-2023-y-ordered-review-repairs
  cancel-in-progress: false
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout control code
        uses: actions/checkout@v6
        with: {ref: main, path: control-src, fetch-depth: 1}
      - name: Set up Python
        uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Checkout work branch
        uses: actions/checkout@v6
        with: {ref: special/2023-Y-work, path: worktree, fetch-depth: 0}
      - name: Configure git
        run: |
          cd worktree
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
      - name: Verify #139 parent
        run: |
          set -euo pipefail
          python control-src/scripts/raw_provenance.py --repo-root worktree --issue-id SP-2023-Y check
          python - <<'PY'
          import json, pathlib
          r=pathlib.Path('worktree'); s=json.load(open(r/'sources/SP-2023-Y/pipeline-state.json'))
          assert s['lifecycle_state']=='VALIDATED_DRAFT'
          assert s['provenance']['validated_issue_source']['source_version']=='v0.5'
          assert s['gates']['visual_review']=='pending' and s['gates']['freeze']=='pending'
          m=json.load(open(r/s['provenance']['validated_issue_source']['path']))
          n=m['reader_facing_technical_notes']
          assert n['generic_fallback_findings']==0
          assert n['source_specific_detail_visible_card_count']==26
          PY
      - name: ② Issue 54 -> v0.6
        run: |
          set -euo pipefail
          PYTHONPATH=control-src python control-src/scripts/revise_special_annual_review_sequence.py --repo-root worktree --special-slug 2023-Y --issue-id SP-2023-Y --step 54 | tee audit-v0.6.json
          cd worktree
          git add surveys/special/2023-Y/revisions/v0.6 sources/SP-2023-Y
          git commit -m 'Repair SP-2023-Y #54 chronology and taxonomy (v0.6)'
          git push origin HEAD:special/2023-Y-work
      - name: ③ Issues 78 and 140 -> v0.7
        run: |
          set -euo pipefail
          PYTHONPATH=control-src python control-src/scripts/revise_special_annual_review_sequence.py --repo-root worktree --special-slug 2023-Y --issue-id SP-2023-Y --step 78-140 | tee audit-v0.7.json
          cd worktree
          git add surveys/special/2023-Y/revisions/v0.7 sources/SP-2023-Y
          git commit -m 'Repair SP-2023-Y #78 #140 references (v0.7)'
          git push origin HEAD:special/2023-Y-work
      - name: ④ Issue 271 -> v0.8
        run: |
          set -euo pipefail
          PYTHONPATH=control-src python control-src/scripts/revise_special_annual_review_sequence.py --repo-root worktree --special-slug 2023-Y --issue-id SP-2023-Y --step 271 | tee audit-v0.8.json
          cd worktree
          git add surveys/special/2023-Y/revisions/v0.8 sources/SP-2023-Y
          git commit -m 'Repair SP-2023-Y #271 empty Technical Notes (v0.8)'
          git push origin HEAD:special/2023-Y-work
      - name: ⑤ Issue 272 -> v0.9
        run: |
          set -euo pipefail
          PYTHONPATH=control-src python control-src/scripts/revise_special_annual_review_sequence.py --repo-root worktree --special-slug 2023-Y --issue-id SP-2023-Y --step 272 | tee audit-v0.9.json
          cd worktree
          git add surveys/special/2023-Y/revisions/v0.9 sources/SP-2023-Y
          git commit -m 'Repair SP-2023-Y #272 chronology source mapping (v0.9)'
          git push origin HEAD:special/2023-Y-work
      - name: ⑥ Issues 122 and 55 -> v0.10
        run: |
          set -euo pipefail
          PYTHONPATH=control-src python control-src/scripts/revise_special_annual_review_sequence.py --repo-root worktree --special-slug 2023-Y --issue-id SP-2023-Y --step 122-55 | tee audit-v0.10.json
          cd worktree
          git add surveys/special/2023-Y/revisions/v0.10 sources/SP-2023-Y
          git commit -m 'Repair SP-2023-Y #122 #55 TOC and card pagination (v0.10)'
          git push origin HEAD:special/2023-Y-work
      - name: Verify ordered final source
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, pathlib, re
          r=pathlib.Path('worktree'); s=json.load(open(r/'sources/SP-2023-Y/pipeline-state.json'))
          assert s['provenance']['validated_issue_source']['source_version']=='v0.10'
          assert s['provenance']['annual_chronology']['source_version']=='v0.10'
          assert s['provenance']['annual_chronology']['event_count']==75
          assert s['provenance']['annual_chronology']['unresolved_date_count']==3
          d=r/'surveys/special/2023-Y/revisions/v0.10'
          notes='\n'.join(p.read_text() for p in (d/'technical-notes').glob('*.tex'))
          assert '時系列 & —' not in notes
          assert ' & PRODUCT & ' not in notes
          assert '安全性事象' not in notes
          bib=(d/'references.bib').read_text()
          assert not re.search(r'title\s*=\s*\{Primary source \d+\}', bib)
          assert 'Primary source used for chronology and technical verification' not in bib
          main=(d/'main.tex').read_text()
          assert 'technical-notes/80-annual-chronology-notes' not in main
          assert 'technical-notes/90-annual-synthesis-notes' not in main
          chrono=(d/'layout-bodies/annual-chronology.tex').read_text()
          assert chrono.count('\\cite{')==75
          front=(d/'sections/00-frontmatter.tex').read_text()
          assert '\\setcounter{tocdepth}{1}' in front
          assert '\\Needspace{0.35\\textheight}' in notes
          PY
      - name: Remove one-time workflow
        run: |
          set -euo pipefail
          cd worktree
          rm .github/workflows/sp-2023-y-ordered-review-repairs.yml
          git add .github/workflows/sp-2023-y-ordered-review-repairs.yml
          git commit -m 'Remove one-time SP-2023-Y ordered repair workflow'
          git push origin HEAD:special/2023-Y-work
      - name: Upload repair audits
        uses: actions/upload-artifact@v4
        with:
          name: sp-2023-y-ordered-review-repair-audits
          path: audit-v0.*.json
          retention-days: 14
