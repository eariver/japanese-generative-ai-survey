name: Publish Frozen Special Release

on:
  workflow_dispatch:
    inputs:
      special_slug:
        required: true
        type: string
      release_revision:
        required: true
        type: string
      approval_reference:
        required: true
        type: string

permissions:
  contents: write
  actions: read

concurrency:
  group: special-publish-${{ inputs.special_slug }}-${{ inputs.release_revision }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 1

      - name: Resolve and verify frozen release authority
        id: release
        shell: bash
        env:
          SPECIAL_SLUG: ${{ inputs.special_slug }}
          RELEASE_REVISION: ${{ inputs.release_revision }}
          APPROVAL_REFERENCE: ${{ inputs.approval_reference }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib, json, os, pathlib
          root=pathlib.Path('.')
          slug=os.environ['SPECIAL_SLUG']; revision=os.environ['RELEASE_REVISION']
          edition=json.load(open(root/'specials'/slug/'edition.json',encoding='utf-8'))
          issue=edition['special_id']
          state=json.load(open(root/'sources'/issue/'pipeline-state.json',encoding='utf-8'))
          manifest_path=root/'sources'/issue/'release-manifest.json'
          manifest=json.load(open(manifest_path,encoding='utf-8'))
          freeze_path=root/manifest['freeze_record']
          freeze=json.load(open(freeze_path,encoding='utf-8'))
          assert state['lifecycle_state']=='FROZEN'
          assert state['revision']==revision
          assert state['gates']['visual_review']=='passed'
          assert state['gates']['freeze']=='passed'
          assert manifest['status']=='frozen'
          assert manifest['revision']==revision
          assert freeze['status']=='FROZEN'
          assert freeze['release_revision']==revision
          source_path=root/manifest['source_manifest_path']
          assert hashlib.sha256(source_path.read_bytes()).hexdigest()==manifest['source_manifest_sha256']
          assert manifest['expected_pdf_sha256']==freeze['canonical_pdf']['sha256']
          authorized=bool(manifest.get('public_release_authorized'))
          auth_path=root/'sources'/issue/f'release-authorization-{revision}.json'
          if not authorized:
              assert auth_path.is_file(), 'explicit release authorization is required for legacy frozen manifests'
              auth=json.load(open(auth_path,encoding='utf-8'))
              assert auth['status']=='APPROVED'
              assert auth['issue_id']==issue and auth['release_revision']==revision
              assert auth['frozen_pdf_sha256']==manifest['expected_pdf_sha256']
              assert auth['frozen_source_manifest_sha256']==manifest['source_manifest_sha256']
              assert auth['release_tag']==manifest['release_tag']
              authorized=True
          assert authorized
          out={
            'issue_id':issue,
            'tag':manifest['release_tag'],
            'title':manifest['release_title'],
            'asset_name':manifest['asset_name'],
            'expected_pdf_sha256':manifest['expected_pdf_sha256'],
            'page_count':manifest['page_count'],
            'artifact_id':manifest['pdf_source']['artifact_id'],
            'artifact_name':manifest['pdf_source']['artifact_name'],
            'artifact_digest':manifest['pdf_source']['artifact_digest'],
            'source_manifest_sha256':manifest['source_manifest_sha256'],
            'source_version':manifest['source_version'],
          }
          pathlib.Path('release-input.json').write_text(json.dumps(out,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          with open(os.environ['GITHUB_OUTPUT'],'a',encoding='utf-8') as f:
              for k,v in out.items(): f.write(f'{k}={v}\n')
          print(json.dumps(out,ensure_ascii=False,indent=2))
          PY

      - name: Download exact frozen PDF artifact
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          ARTIFACT_ID: ${{ steps.release.outputs.artifact_id }}
          EXPECTED_SHA: ${{ steps.release.outputs.expected_pdf_sha256 }}
          ASSET_NAME: ${{ steps.release.outputs.asset_name }}
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2026-03-10" \
            "https://api.github.com/repos/${REPOSITORY}/actions/artifacts/${ARTIFACT_ID}/zip" \
            --output frozen-artifact.zip
          mkdir artifact
          unzip -q frozen-artifact.zip -d artifact
          mapfile -t pdfs < <(find artifact -type f -name '*.pdf' -print)
          test "${#pdfs[@]}" -eq 1
          cp "${pdfs[0]}" "$ASSET_NAME"
          actual=$(sha256sum "$ASSET_NAME" | awk '{print $1}')
          test "$actual" = "$EXPECTED_SHA"
          echo "verified_pdf_sha256=$actual" >> "$GITHUB_ENV"

      - name: Build release metadata and notes
        shell: bash
        env:
          APPROVAL_REFERENCE: ${{ inputs.approval_reference }}
          RELEASE_REVISION: ${{ inputs.release_revision }}
          RELEASE_INPUT: release-input.json
        run: |
          set -euo pipefail
          python - <<'PY'
          import datetime as dt, json, os, pathlib
          r=json.load(open(os.environ['RELEASE_INPUT'],encoding='utf-8'))
          meta={
            'schema_version':'1.0',
            'issue_id':r['issue_id'],
            'revision':os.environ['RELEASE_REVISION'],
            'release_tag':r['tag'],
            'release_title':r['title'],
            'asset_name':r['asset_name'],
            'pdf_sha256':r['expected_pdf_sha256'],
            'page_count':r['page_count'],
            'source_version':r['source_version'],
            'source_manifest_sha256':r['source_manifest_sha256'],
            'pdf_artifact_id':r['artifact_id'],
            'pdf_artifact_name':r['artifact_name'],
            'pdf_artifact_digest':r['artifact_digest'],
            'release_anchor_commit':os.environ['GITHUB_SHA'],
            'published_at':dt.datetime.now(dt.timezone.utc).isoformat(timespec='seconds'),
            'approval_reference':os.environ['APPROVAL_REFERENCE'],
          }
          pathlib.Path('RELEASE_METADATA.json').write_text(json.dumps(meta,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          notes=(f"# {r['title']}\n\n"
                 f"2026年7月の生成AI技術動向を振り返るRetrospective Specialです。\n\n"
                 f"- ページ数: {r['page_count']}\n"
                 f"- Frozen PDF SHA-256: `{r['expected_pdf_sha256']}`\n"
                 f"- Frozen source manifest SHA-256: `{r['source_manifest_sha256']}`\n"
                 f"- Source revision: `{r['source_version']}`\n\n"
                 "PDFはVisual ReviewおよびFreezeで承認されたActions artifactを再取得し、SHA-256を再検証した同一バイト列です。詳細なprovenanceは添付の `RELEASE_METADATA.json` とリポジトリ内のrelease manifestを参照してください。\n")
          pathlib.Path('release-notes.md').write_text(notes,encoding='utf-8')
          PY

      - name: Publish GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          TAG: ${{ steps.release.outputs.tag }}
          TITLE: ${{ steps.release.outputs.title }}
          ASSET_NAME: ${{ steps.release.outputs.asset_name }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" --repo "$REPOSITORY" >/dev/null 2>&1; then
            echo "Release already exists: $TAG" >&2
            exit 1
          fi
          gh release create "$TAG" \
            "$ASSET_NAME" \
            "RELEASE_METADATA.json" \
            --repo "$REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "$TITLE" \
            --notes-file release-notes.md
          gh release view "$TAG" --repo "$REPOSITORY" --json url,tagName,name,isDraft,isPrerelease > release-result.json
          cat release-result.json

      - name: Upload publication audit
        uses: actions/upload-artifact@v7
        with:
          name: special-release-audit-${{ inputs.special_slug }}-${{ inputs.release_revision }}
          path: |
            release-input.json
            RELEASE_METADATA.json
            release-notes.md
            release-result.json
          if-no-files-found: error
          retention-days: 90
