name: SP001 Draft control prep

on:
  push:
    branches:
      - 'trigger/sp001-draft-stage-adopt-prep'
    paths:
      - 'sources/SP001/orchestration/v2/control-prep.json'
      - '.github/workflows/sp001-draft-control-prep.yml'

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: trigger/sp001-draft-stage-adopt-prep
      - name: Materialize exact locked control request
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib, json, pathlib
          root=pathlib.Path('.').resolve()
          prep_path=root/'sources/SP001/orchestration/v2/control-prep.json'
          state_path=root/'sources/SP001/production-state.json'
          prep=json.load(open(prep_path,encoding='utf-8'))
          if prep.get('schema_version')!='2.0-rc1' or prep.get('issue_id')!='SP001':
              raise SystemExit('invalid control prep identity')
          if not state_path.is_file(): raise SystemExit('missing Production State')
          artifacts=prep.get('stage_artifacts')
          if not isinstance(artifacts,dict) or not artifacts: raise SystemExit('missing stage_artifacts')
          for name,raw in artifacts.items():
              p=(root/raw).resolve()
              try: p.relative_to(root)
              except ValueError: raise SystemExit(f'artifact escapes repository: {name}')
              if not p.is_file(): raise SystemExit(f'missing artifact: {name} -> {raw}')
          reviews=(root/prep['stage_reviews_path']).resolve()
          try: reviews.relative_to(root)
          except ValueError: raise SystemExit('reviews escape repository')
          if not reviews.is_file(): raise SystemExit('missing stage reviews')
          state_sha=hashlib.sha256(state_path.read_bytes()).hexdigest()
          request={
              'schema_version':'2.0-rc1',
              'operation':'adopt-stage',
              'issue_id':'SP001',
              'production_state_sha256':state_sha,
              'stage_artifacts':artifacts,
              'stage_reviews_path':prep['stage_reviews_path'],
              'stage_summary':prep['stage_summary'],
          }
          out=root/'sources/SP001/orchestration/v2/control-request.json'
          out.write_text(json.dumps(request,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          print('Production State SHA-256:',state_sha)
          PY
          rm -f sources/SP001/orchestration/v2/control-prep.json
          rm -f .github/workflows/sp001-draft-control-prep.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Prepare exact SP001 Draft stage adoption request'
          git push origin HEAD:trigger/sp001-draft-stage-adopt-prep
