name: Build weekly survey PDF

on:
  workflow_dispatch:
  push:
    paths:
      - 'surveys/weekly/**'
      - 'templates/survey/**'
      - '.latexmkrc'
      - '.github/workflows/build-weekly-survey.yml'
  pull_request:
    paths:
      - 'surveys/weekly/**'
      - 'templates/survey/**'
      - '.latexmkrc'
      - '.github/workflows/build-weekly-survey.yml'

permissions:
  contents: read

jobs:
  build-2026-w32:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Set reproducible PDF timestamp
        shell: bash
        run: |
          set -euo pipefail
          echo "SOURCE_DATE_EPOCH=$(git show -s --format=%ct HEAD)" >> "$GITHUB_ENV"
          echo 'FORCE_SOURCE_DATE=1' >> "$GITHUB_ENV"

      - name: Compile 2026-W32 with LuaLaTeX
        uses: xu-cheng/latex-action@v4
        with:
          root_file: main.tex
          working_directory: surveys/weekly/2026-W32
          texlive_version: 2026
          os: debian
          latexmk_use_lualatex: true

      - name: Validate final TeX log
        working-directory: surveys/weekly/2026-W32
        shell: bash
        run: |
          set -euo pipefail
          test -s main.pdf
          test -s main.log

          if grep -E -n 'LaTeX Warning: (There were undefined references|Citation .* undefined)|Package biblatex Warning: Please (re)?run|Overfull \\hbox|Underfull \\hbox|Missing character:' main.log; then
            echo '::error::Final TeX log contains publication-blocking warnings.'
            exit 1
          fi

          echo 'Final TeX log passed publication-warning gate.'

      - name: Record PDF digest
        working-directory: surveys/weekly/2026-W32
        shell: bash
        run: |
          set -euo pipefail
          sha256sum main.pdf | tee main.pdf.sha256

      - name: Upload PDF artifact
        uses: actions/upload-artifact@v7
        with:
          name: japanese-generative-ai-survey-2026-W32
          path: |
            surveys/weekly/2026-W32/main.pdf
            surveys/weekly/2026-W32/main.pdf.sha256
          if-no-files-found: error
          retention-days: 14
