name: Special Freeze contract

on:
  pull_request:
    paths:
      - '.github/workflows/accept-special-freeze.yml'
      - '.github/workflows/publish-special-frozen-release.yml'
      - '.github/workflows/special-freeze-contract.yml'
      - 'scripts/accept_special_freeze.py'
      - 'schemas/special-pipeline-state.schema.json'
  push:
    branches: [main]
    paths:
      - '.github/workflows/accept-special-freeze.yml'
      - '.github/workflows/publish-special-frozen-release.yml'
      - '.github/workflows/special-freeze-contract.yml'
      - 'scripts/accept_special_freeze.py'
      - 'schemas/special-pipeline-state.schema.json'

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify Freeze acceptance and publication contract
        run: |
          set -euo pipefail
          python -m py_compile scripts/accept_special_freeze.py
          python - <<'PY'
          import hashlib,json,pathlib,subprocess,tempfile

          def dump(path,obj):
              path.parent.mkdir(parents=True,exist_ok=True)
              path.write_text(json.dumps(obj,indent=2)+'\n',encoding='utf-8')
          def sha(path): return hashlib.sha256(path.read_bytes()).hexdigest()

          with tempfile.TemporaryDirectory() as td:
              root=pathlib.Path(td)
              issue='SP-TEST-M01'; slug='TEST-M01'; rev='v0.1'
              src=root/'surveys/special/TEST-M01/revisions/v0.8/source-manifest.json'
              dump(src,{'schema_version':'1.0','issue_id':issue,'source_version':'v0.8'})
              vr=root/'sources'/issue/'visual-review/v0.8/approval.json'
              dump(vr,{'schema_version':'1.0','status':'APPROVED'})
              candidate_path=root/'sources'/issue/'freeze'/f'freeze-candidate-{rev}.json'
              pdf={'sha256':'a'*64,'page_count':36,'workflow_run_id':123,'artifact_name':'artifact','artifact_id':456,'artifact_digest':'sha256:'+'b'*64}
              dump(candidate_path,{
                  'schema_version':'1.0','issue_id':issue,'special_slug':slug,'status':'PENDING_HUMAN_FREEZE_APPROVAL',
                  'proposed_release_revision':rev,'proposed_release_tag':'special/TEST-M01/v0.1',
                  'proposed_release_title':'Special test','proposed_pdf_asset_name':'test.pdf','source_version':'v0.8',
                  'validated_issue_source':{'path':str(src.relative_to(root)),'sha256':sha(src)},
                  'visual_review':{'path':str(vr.relative_to(root)),'sha256':sha(vr),'approved_at':'2026-08-11T12:20:00+09:00'},
                  'canonical_pdf_candidate':pdf,
              })
              state_path=root/'sources'/issue/'pipeline-state.json'
              dump(state_path,{
                  'schema_version':'1.0','issue_id':issue,'edition_kind':'RETROSPECTIVE_PERIOD','lifecycle_state':'RELEASE_CANDIDATE','revision':'v0.1',
                  'calendar':{'editorial_cutoff':'2026-01-31T23:59:59Z','cutoff_timezone':'UTC','collection_window_start':'2026-01-01T00:00:00Z','collection_window_end':'2026-01-31T23:59:59Z','collection_anchor_at':'2026-01-31T23:59:59Z','retrospective_as_of':'2026-02-01T00:00:00Z','frozen_at':None},
                  'gates':{'raw_sources_preserved':'passed','candidate_inventory':'passed','evidence_normalized':'passed','candidate_selection':'passed','issue_architecture':'passed','article_draft':'passed','claim_and_chronology_validation':'passed','latex_build':'passed','visual_review':'passed','freeze':'pending'},
                  'automation':{'unattended_public_release':False,'human_gate_required_for_selection':True,'human_gate_required_for_architecture':True,'human_gate_required_for_visual_review':True,'human_gate_required_for_freeze':True,'human_gate_required_for_public_release':True},
                  'provenance':{'validated_issue_source':{'path':str(src.relative_to(root)),'sha256':sha(src)},'latex_build':{'pdf_sha256':pdf['sha256'],'page_count':36,'workflow_run_id':123}},
              })
              subprocess.run([
                  'python','scripts/accept_special_freeze.py','--repo-root',str(root),'--issue-id',issue,'--special-slug',slug,
                  '--release-revision',rev,'--approved-at','2026-08-11T13:00:00+09:00','--approval-reference','Human Freeze approval test'
              ],check=True)
              state=json.loads(state_path.read_text())
              assert state['lifecycle_state']=='FROZEN' and state['gates']['freeze']=='passed'
              assert state['calendar']['frozen_at']=='2026-08-11T13:00:00+09:00'
              assert state['automation']['unattended_public_release'] is False
              assert state['automation']['human_gate_required_for_public_release'] is False
              freeze=json.loads((root/'sources'/issue/'freeze'/f'freeze-{rev}.json').read_text())
              release=json.loads((root/'sources'/issue/'release-manifest.json').read_text())
              assert freeze['canonical_pdf']['sha256']==pdf['sha256']
              assert freeze['release_authority']=='FREEZE_APPROVAL'
              assert release['expected_pdf_sha256']==pdf['sha256']
              assert release['public_release_authorized'] is True
              assert release['release_authorization']['mode']=='FREEZE_APPROVAL'

          workflow=pathlib.Path('.github/workflows/accept-special-freeze.yml').read_text(encoding='utf-8')
          publisher=pathlib.Path('.github/workflows/publish-special-frozen-release.yml').read_text(encoding='utf-8')
          assert 'PENDING_HUMAN_FREEZE_APPROVAL' in workflow
          assert 'gh pr merge' in workflow
          assert 'publish-special-frozen-release.yml' in workflow
          assert 'public_release_authorized' in workflow
          assert 'expected_pdf_sha256' in publisher
          assert 'actions/artifacts/${ARTIFACT_ID}/zip' in publisher
          assert 'gh release create' in publisher
          assert 'RELEASE_METADATA.json' in publisher
          PY
