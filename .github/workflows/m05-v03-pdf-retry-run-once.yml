name: Retry SP-2026-M05 v0.3 PDF build once

on:
  pull_request:
    types: [synchronize]

permissions:
  contents: write

concurrency:
  group: special-pdf-2026-M05-v03-retry
  cancel-in-progress: false

jobs:
  build:
    if: github.event.pull_request.number == 53 && github.event.pull_request.head.ref == 'special/2026-M05-work'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout control code
        uses: actions/checkout@v6
        with:
          ref: main
          path: control-src
          fetch-depth: 1
      - name: Checkout May work branch
        uses: actions/checkout@v6
        with:
          ref: special/2026-M05-work
          path: worktree
          fetch-depth: 0
      - name: Resolve and verify v0.3 source
        id: source
        shell: bash
        run: |
          set -euo pipefail
          python control-src/scripts/raw_provenance.py --repo-root worktree --issue-id SP-2026-M05 check >/dev/null
          python - >> "$GITHUB_OUTPUT" <<'PY'
          import hashlib,json,pathlib
          r=pathlib.Path('worktree'); s=json.load(open(r/'sources/SP-2026-M05/pipeline-state.json',encoding='utf-8'))
          assert s['lifecycle_state']=='VALIDATED_DRAFT'; assert s['gates']['latex_build']=='pending' and s['gates']['visual_review']=='pending'
          src=s['provenance']['validated_issue_source']; assert src['source_version']=='v0.3'
          m=r/src['path']; assert hashlib.sha256(m.read_bytes()).hexdigest()==src['sha256']
          d=json.load(open(m,encoding='utf-8')); assert d['status']=='VALIDATED_BALANCED_MIXED_LAYOUT_REVISION'
          print('source_dir='+m.parent.as_posix()); print('source_manifest='+m.as_posix()); print('source_manifest_sha256='+src['sha256'])
          PY
      - name: Pin style and remove copied build products
        id: style
        shell: bash
        env:
          SOURCE_DIR: ${{ steps.source.outputs.source_dir }}
        run: |
          set -euo pipefail
          rm -f "$SOURCE_DIR/main.pdf" "$SOURCE_DIR/main.log" "$SOURCE_DIR/main.aux" "$SOURCE_DIR/main.bcf" "$SOURCE_DIR/main.run.xml" "$SOURCE_DIR/main.bbl" "$SOURCE_DIR/main.blg" "$SOURCE_DIR/main.fdb_latexmk" "$SOURCE_DIR/main.fls" "$SOURCE_DIR/main.out" "$SOURCE_DIR/main.toc"
          cp control-src/templates/survey/jgaisurvey.sty "$SOURCE_DIR/jgaisurvey.sty"
          echo "control_commit=$(git -C control-src rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "style_sha256=$(sha256sum control-src/templates/survey/jgaisurvey.sty|awk '{print $1}')" >> "$GITHUB_OUTPUT"
      - name: Set reproducible timestamp
        run: echo 'SOURCE_DATE_EPOCH=1779926400' >> "$GITHUB_ENV"
      - name: Compile v0.3
        uses: xu-cheng/latex-action@v4
        with:
          root_file: main.tex
          working_directory: ${{ steps.source.outputs.source_dir }}
          texlive_version: 2026
          latexmk_use_lualatex: true
          os: alpine
      - name: Audit v0.3
        id: audit
        shell: bash
        env:
          SOURCE_DIR: ${{ steps.source.outputs.source_dir }}
          MANIFEST: ${{ steps.source.outputs.source_manifest }}
          MANIFEST_SHA: ${{ steps.source.outputs.source_manifest_sha256 }}
          CONTROL_COMMIT: ${{ steps.style.outputs.control_commit }}
          STYLE_SHA: ${{ steps.style.outputs.style_sha256 }}
        run: |
          set -euo pipefail
          pdf="$SOURCE_DIR/main.pdf"; log="$SOURCE_DIR/main.log"; test -s "$pdf" && test -s "$log"
          bad=$(grep -E -n 'LaTeX Warning: (There were undefined references|Citation .* undefined)|Package biblatex Warning: Please (re)?run|Overfull \\hbox|Underfull \\hbox|Missing character:' "$log" || true)
          pages=$(python - "$log" <<'PY'
          import re,sys
          t=open(sys.argv[1],encoding='utf-8',errors='replace').read(); m=re.findall(r'Output written on .*?\((\d+) pages?',t,re.S)
          if not m: raise SystemExit('page count unavailable')
          print(m[-1])
          PY
          ); sha=$(sha256sum "$pdf"|awk '{print $1}'); [ -z "$bad" ] && clean=true || clean=false
          python - "$pages" "$sha" "$clean" "$bad" "$MANIFEST" "$MANIFEST_SHA" "$CONTROL_COMMIT" "$STYLE_SHA" <<'PY'
          import json,sys
          pages,sha,clean,bad,m,msha,commit,style=sys.argv[1:]
          o={'schema_version':'1.0','issue_id':'SP-2026-M05','source_version':'v0.3','page_count':int(pages),'pdf_sha256':sha,'log_clean':clean=='true','log_gate_findings':bad.splitlines() if bad else [],'page_target_min':32,'page_target_max':40,'page_budget_passed':32<=int(pages)<=40,'source_manifest_path':m,'source_manifest_sha256':msha,'build_style':{'control_commit_sha':commit,'path':'templates/survey/jgaisurvey.sty','sha256':style}}
          open('special-pdf-build-audit.json','w').write(json.dumps(o,ensure_ascii=False,indent=2)+'\n'); print(json.dumps(o,ensure_ascii=False,indent=2))
          PY
          echo "pages=$pages" >> "$GITHUB_OUTPUT"; echo "sha=$sha" >> "$GITHUB_OUTPUT"; echo "clean=$clean" >> "$GITHUB_OUTPUT"
          test "$clean" = true
      - name: Upload v0.3 PDF
        uses: actions/upload-artifact@v7
        with:
          name: japanese-generative-ai-survey-special-2026-M05-v0.3-retry
          path: |
            ${{ steps.source.outputs.source_dir }}/main.pdf
            ${{ steps.source.outputs.source_dir }}/main.log
            special-pdf-build-audit.json
          if-no-files-found: error
          retention-days: 14
      - name: Record pre-Human Review candidate when page budget passes
        if: steps.audit.outputs.clean == 'true' && fromJSON(steps.audit.outputs.pages) >= 32 && fromJSON(steps.audit.outputs.pages) <= 40
        working-directory: worktree
        shell: bash
        env:
          PAGES: ${{ steps.audit.outputs.pages }}
          PDF_SHA: ${{ steps.audit.outputs.sha }}
          RUN_ID: ${{ github.run_id }}
          MANIFEST: ${{ steps.source.outputs.source_manifest }}
          MANIFEST_SHA: ${{ steps.source.outputs.source_manifest_sha256 }}
          CONTROL_COMMIT: ${{ steps.style.outputs.control_commit }}
          STYLE_SHA: ${{ steps.style.outputs.style_sha256 }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,pathlib,os
          p=pathlib.Path('sources/SP-2026-M05/pipeline-state.json'); s=json.load(open(p,encoding='utf-8'))
          assert s['lifecycle_state']=='VALIDATED_DRAFT'; s['lifecycle_state']='RELEASE_CANDIDATE'; s['gates']['latex_build']='passed'
          s['provenance']['latex_build']={'workflow_run_id':int(os.environ['RUN_ID']),'pdf_sha256':os.environ['PDF_SHA'],'page_count':int(os.environ['PAGES']),'source_version':'v0.3','validated_issue_source_path':os.environ['MANIFEST'],'validated_issue_source_sha256':os.environ['MANIFEST_SHA'],'build_style':{'control_commit_sha':os.environ['CONTROL_COMMIT'],'path':'templates/survey/jgaisurvey.sty','sha256':os.environ['STYLE_SHA']},'preview_only':True,'log_clean':True}
          p.write_text(json.dumps(s,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          PY
          git config user.name 'github-actions[bot]'; git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add sources/SP-2026-M05/pipeline-state.json
          git commit -m 'Record balanced v0.3 preflight for SP-2026-M05'
          git push origin HEAD:special/2026-M05-work
      - name: Remove copied binary PDF from source tree and wrapper
        if: always()
        working-directory: worktree
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'; git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git pull --rebase origin special/2026-M05-work
          git rm -f surveys/special/2026-M05/revisions/v0.3/main.pdf || true
          git rm .github/workflows/m05-v03-pdf-retry-run-once.yml
          git commit -m 'Clean M05 v0.3 preflight source tree'
          git push origin HEAD:special/2026-M05-work
