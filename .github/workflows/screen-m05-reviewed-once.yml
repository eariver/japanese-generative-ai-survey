name: Screen SP-2026-M05 reviewed selections once

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/screen-m05-reviewed-once.yml'

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: sp-2026-m05-screening-once
  cancel-in-progress: false

jobs:
  screen:
    if: github.event.pull_request.number == 53 && github.head_ref == 'special/2026-M05-work'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout current control code
        uses: actions/checkout@v6
        with:
          ref: main
          path: control-src
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Checkout May work branch
        uses: actions/checkout@v6
        with:
          ref: special/2026-M05-work
          path: worktree
          fetch-depth: 0
      - name: Verify discovery basis
        shell: bash
        run: |
          set -euo pipefail
          python control-src/scripts/raw_provenance.py --repo-root worktree --issue-id SP-2026-M05 check
          python - <<'PY'
          import json
          s=json.load(open('worktree/sources/SP-2026-M05/pipeline-state.json',encoding='utf-8'))
          assert s['lifecycle_state']=='DISCOVERY_COLLECTED', s['lifecycle_state']
          assert s['gates']['raw_sources_preserved']=='passed'
          assert s['gates']['candidate_inventory']=='pending'
          seed=json.load(open('worktree/sources/SP-2026-M05/screening/interactive-selection-seed-v0.1.json',encoding='utf-8'))
          assert seed['issue_id']=='SP-2026-M05'
          ids=[x['screening_id'] for x in seed['selections']]
          assert len(ids)==63 and len(ids)==len(set(ids)), len(ids)
          PY
      - name: Enable Special ID in generic screening helpers for this run
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          old='ISSUE_RE = re.compile(r"^[0-9]{4}-W[0-9]{2}$")'
          new='ISSUE_RE = re.compile(r"^(?:[0-9]{4}-W[0-9]{2}|SP-[A-Za-z0-9][A-Za-z0-9._-]{2,63})$")'
          for rel in ['scripts/prepare_screening_run.py','scripts/accept_screening_results.py']:
              p=Path('control-src')/rel
              t=p.read_text(encoding='utf-8')
              assert old in t, rel
              p.write_text(t.replace(old,new,1),encoding='utf-8')
          PY
      - name: Prepare deterministic screening package
        shell: bash
        run: |
          set -euo pipefail
          commit=$(git -C worktree rev-parse HEAD)
          PYTHONPATH=control-src python control-src/scripts/prepare_screening_run.py \
            --repo-root worktree \
            --output-root screening-package \
            --issue-id SP-2026-M05 \
            --source-ref special/2026-M05-work \
            --source-commit "$commit"
          python - <<'PY'
          import json
          p=json.load(open('screening-package/screening-run-package.json',encoding='utf-8'))
          assert p['issue_id']=='SP-2026-M05'
          assert p['screening_input']['record_count']==1103
          assert len(p['screening_input']['batches'])==39
          PY
      - name: Expand reviewed selections to complete screening results
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p screening-results
          PYTHONPATH=control-src python - <<'PY'
          import hashlib,json,pathlib
          root=pathlib.Path('.')
          package=json.load(open('screening-package/screening-run-package.json',encoding='utf-8'))
          seed=json.load(open('worktree/sources/SP-2026-M05/screening/interactive-selection-seed-v0.1.json',encoding='utf-8'))
          selections={x['screening_id']:x for x in seed['selections']}
          groups=seed['groups']
          prompt_sha=package['prompt']['sha256']
          runner={
            'provider':'OpenAI','model':'GPT-5.6 Sol',
            'invocation':'interactive ChatGPT project review; no paid inference-provider API',
            'generated_at':seed['review']['generated_at'],
            'run_reference':seed['review']['run_reference']
          }
          found=set(); override_rows=[]; counts={'KEEP':0,'MAYBE':0,'INSPECT':0,'DROP':0}
          for bm in package['screening_input']['batches']:
              batch_path=root/'screening-package'/bm['path']
              recs=[json.loads(x) for x in batch_path.read_text(encoding='utf-8').splitlines() if x.strip()]
              decisions=[]
              for rec in recs:
                  sid=rec['screening_id']; selected=selections.get(sid)
                  if selected:
                      found.add(sid); decision=selected['decision']; group=selected['group']; spec=groups[group]
                      if decision=='INSPECT':
                          reason='Official index snapshot retained for item-level May extraction; the supplied index metadata is intentionally insufficient for item-level screening.'
                      else:
                          reason=f"Retained for May retrospective verification after interactive review of supplied metadata: {rec['title']} is technically material to the {group} lane."
                      why='May-dated source record retained for retrospective verification.' if rec.get('published_at') else None
                      dup=None
                      if rec.get('source_type')=='github-release':
                          repo=(rec.get('metadata') or {}).get('repository')
                          dup=f'github-series:{repo}' if repo else None
                      confidence='low' if sid=='arxiv:2608.02611v1' else ('medium' if decision=='MAYBE' else 'high')
                      d={'screening_id':sid,'decision':decision,'reason':reason,'why_now':why,
                         'topic_lanes':spec['topic_lanes'],'duplicate_group':dup,
                         'verification_targets':spec['verification_targets'],'confidence':confidence}
                      override_rows.append({k:d[k] for k in ('screening_id','decision','reason','topic_lanes','verification_targets','confidence')})
                  else:
                      d={'screening_id':sid,'decision':'DROP','reason':seed['default_drop_reason'],'why_now':None,
                         'topic_lanes':[],'duplicate_group':None,'verification_targets':[],'confidence':'high'}
                  counts[d['decision']]+=1; decisions.append(d)
              result={'schema_version':'1.0','issue_id':'SP-2026-M05','batch_id':bm['batch_id'],
                      'input_batch_sha256':bm['sha256'],'prompt_id':'source-screening-v0.1','prompt_sha256':prompt_sha,
                      'runner':runner,'decisions':decisions}
              out=root/'screening-results'/f"{bm['batch_id']}.json"
              out.write_text(json.dumps(result,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          missing=sorted(set(selections)-found)
          assert not missing, missing
          assert sum(counts.values())==1103, counts
          assert counts['KEEP']+counts['MAYBE']+counts['INSPECT']==63, counts
          overrides={'schema_version':'1.0','issue_id':'SP-2026-M05','runner':runner,
                     'default_drop':{'reason':seed['default_drop_reason']},'overrides':override_rows}
          pathlib.Path('generated-overrides.json').write_text(json.dumps(overrides,ensure_ascii=False,separators=(',',':'))+'\n',encoding='utf-8')
          pathlib.Path('screening-counts.json').write_text(json.dumps(counts,indent=2)+'\n',encoding='utf-8')
          print(counts)
          PY
      - name: Validate and merge all 39 batches
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p screening-validation screening-merged
          for batch in screening-package/input/batches/batch-*.jsonl; do
            id=$(basename "$batch" .jsonl)
            PYTHONPATH=control-src python control-src/scripts/validate_screening_result.py \
              --batch "$batch" --result "screening-results/${id}.json" \
              --prompt screening-package/contract/source-screening-v0.1.md \
              --report "screening-validation/${id}.json" >/dev/null
          done
          PYTHONPATH=control-src python control-src/scripts/merge_screening_results.py \
            --batches-dir screening-package/input/batches \
            --results-dir screening-results \
            --prompt screening-package/contract/source-screening-v0.1.md \
            --output-dir screening-merged --require-complete > screening-merge.json
          python - <<'PY'
          import json
          x=json.load(open('screening-merged/screening-progress.json',encoding='utf-8'))
          assert x['complete'] and x['passed']
          assert x['reviewed_record_count']==1103
          assert x['verification_queue_count']==63
          PY
      - name: Accept screening append-only
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=control-src python control-src/scripts/accept_screening_results.py \
            --package-root screening-package \
            --results-dir screening-results \
            --repo-root worktree \
            --issue-id SP-2026-M05 \
            --review-reference 'Interactive GPT-5.6 Sol review of all 1,103 May screening records from exact imported Source Intake; 63 explicit retained/inspect selections and deterministic default DROP for all omitted records; no paid inference-provider API.' \
            --report screening-acceptance-report.json
          cp generated-overrides.json worktree/sources/SP-2026-M05/screening/interactive-overrides-v0.1.json
          python - <<'PY'
          import json
          s=json.load(open('worktree/sources/SP-2026-M05/pipeline-state.json',encoding='utf-8'))
          assert s['lifecycle_state']=='CANDIDATES_NORMALIZED'
          assert s['gates']['candidate_inventory']=='passed'
          PY
          python control-src/scripts/raw_provenance.py --repo-root worktree --issue-id SP-2026-M05 check
      - name: Commit accepted screening and self-delete runner
        working-directory: worktree
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/screen-m05-reviewed-once.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A sources/SP-2026-M05 .github/workflows
          git commit -m 'Accept interactive screening for SP-2026-M05'
          git push origin HEAD:special/2026-M05-work
      - name: Upload screening audit
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: sp-2026-m05-screening-audit
          path: |
            screening-counts.json
            screening-merge.json
            screening-acceptance-report.json
            screening-validation/
          if-no-files-found: warn
          retention-days: 14
