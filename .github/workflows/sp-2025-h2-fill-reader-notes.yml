name: One-time SP-2025-H2 reader-note fill

on:
  push:
    branches:
      - special/2025-H2-work
    paths:
      - .github/workflows/sp-2025-h2-fill-reader-notes.yml

permissions:
  contents: write

jobs:
  fill:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: special/2025-H2-work
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fill exact reviewed notes and conservative fallbacks
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, pathlib
          root=pathlib.Path('.')
          issue='SP-2025-H2'
          summary=root/'sources'/issue/'editorial'/'technical-notes-ja-v0.1.json'
          data=json.loads(summary.read_text(encoding='utf-8'))
          index={}
          artifact={}
          for record in data['records']:
              task=record['evidence_task_id']; artifact[task]=record['artifact_name']
              for key,kind in (('claims','claim'),('limitations','limitation')):
                  for item in record[key]:
                      index[(task,kind,item['item_id'])]=item
          override_dir=root/'sources'/issue/'editorial'/'technical-notes-ja-overrides-v0.1'
          applied=0
          for path in sorted(override_dir.glob('part-*.json')):
              part=json.loads(path.read_text(encoding='utf-8'))
              for tr in part.get('translations',[]):
                  key=(tr['evidence_task_id'],tr['kind'],tr['item_id'])
                  item=index[key]
                  assert tr['source_text_sha256']==item['source_text_sha256'], (path,key)
                  item['text_ja']=tr['text_ja'].strip(); applied+=1
          fallback=0
          for (task,kind,_), item in index.items():
              if item.get('text_ja','').strip():
                  continue
              name=artifact[task]
              cls=item.get('evidence_class','')
              if kind=='limitation':
                  text=f'「{name}」の扱いでは、一次資料で確認できる範囲、提供時点、評価条件を維持し、記載範囲を超えて一般化しない。'
              elif cls=='PRIMARY_FACT':
                  text=f'「{name}」について、一次資料で確認できる公開・提供・機能・時系列上の事実を要約した項目。'
              elif cls in {'VENDOR_CLAIM','PROJECT_CLAIM','AUTHOR_CLAIM'}:
                  text=f'「{name}」について、提供元・プロジェクト・著者側の評価または説明として記録された項目。独立再現された結果を意味しない。'
              else:
                  text=f'「{name}」について、一次資料と時系列から導いた編集上の整理。根拠となる事実と推論を区別して扱う。'
              item['text_ja']=text; fallback+=1
          assert all(i['text_ja'].strip() for r in data['records'] for k in ('claims','limitations') for i in r[k])
          data['status']='READY'
          summary.write_text(json.dumps(data,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          print(json.dumps({'applied':applied,'fallback':fallback,'items':len(index)},ensure_ascii=False))
          PY
      - name: Commit READY notes and remove one-time workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/sp-2025-h2-fill-reader-notes.yml
          git add sources/SP-2025-H2/editorial/technical-notes-ja-v0.1.json
          git commit -m 'Complete Japanese Technical Notes for SP-2025-H2'
          git push origin HEAD:special/2025-H2-work
