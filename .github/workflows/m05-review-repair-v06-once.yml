name: Repair SP-2026-M05 review findings into v0.6 once

on:
  pull_request:
    types: [synchronize]

permissions:
  contents: write

concurrency:
  group: special-review-repair-2026-M05-v06
  cancel-in-progress: false

jobs:
  repair-build:
    if: github.event.pull_request.number == 53 && github.event.pull_request.head.ref == 'special/2026-M05-work'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout canonical control code
        uses: actions/checkout@v6
        with:
          ref: main
          path: control-src
          fetch-depth: 1

      - name: Checkout May work branch
        uses: actions/checkout@v6
        with:
          ref: special/2026-M05-work
          path: worktree
          fetch-depth: 0

      - name: Verify v0.5 and create immutable v0.6
        working-directory: worktree
        shell: bash
        run: |
          set -euo pipefail
          python ../control-src/scripts/raw_provenance.py --repo-root . --issue-id SP-2026-M05 check >/dev/null
          python - <<'PY'
          import copy, hashlib, json, pathlib, shutil
          root=pathlib.Path('.')
          issue='SP-2026-M05'; slug='2026-M05'
          state_path=root/'sources'/issue/'pipeline-state.json'
          state=json.load(open(state_path,encoding='utf-8'))
          assert state['lifecycle_state']=='RELEASE_CANDIDATE'
          assert state['gates']['latex_build']=='passed'
          assert state['gates']['visual_review']=='pending' and state['gates']['freeze']=='pending'
          cur=copy.deepcopy(state['provenance']['validated_issue_source'])
          assert cur['source_version']=='v0.5'
          src_manifest=root/cur['path']
          def sha(p): return hashlib.sha256(p.read_bytes()).hexdigest()
          assert sha(src_manifest)==cur['sha256']
          old=json.load(open(src_manifest,encoding='utf-8'))
          out=root/'surveys'/'special'/slug/'revisions'/'v0.6'
          if out.exists(): raise SystemExit('v0.6 already exists')
          shutil.copytree(src_manifest.parent,out)
          for name in ['main.pdf','main.log','main.aux','main.bcf','main.run.xml','main.bbl','main.blg','main.fdb_latexmk','main.fls','main.out','main.toc','jgaisurvey.sty']:
              (out/name).unlink(missing_ok=True)
          marker=root/'sources'/issue/'editorial'/'layout-revision-v0.6.json'
          marker_data={
            'schema_version':'1.0','issue_id':issue,'revision':'v0.6','from_source_version':'v0.5',
            'review_issues':[50,54,55],
            'constraints':{'new_external_evidence_allowed':False,'selected_evidence_only':True,'evidence_and_draft_packages_immutable':True},
            'changes':[
              'Apply SHA-bound Japanese reader-facing summaries to all Technical Notes claim and limitation narratives, including PRIMARY_FACT.',
              'Render artifact/event enums as reader-facing labels and apply semantic override for the third-party evaluation playbook.',
              'Keep Technical Notes cards breakable while pairing the primary-source heading with its URL list and applying paragraph widow/orphan penalties.'
            ],
            'qa_targets':['Issues #50/#54/#55 acceptance criteria','no Issue #40 blank-page regression','full-page render self-check before Human Visual Review']
          }
          marker.write_text(json.dumps(marker_data,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          new=copy.deepcopy(old)
          new['source_version']='v0.6'
          new['status']='VALIDATED_REVIEW_REPAIR_REVISION'
          new['derivation']='Pre-release review repair of v0.5 for Issues #50, #54, and #55. Selected Evidence, accepted Article Draft content, Architecture, May chronology, and narrative layout are unchanged; only reader-facing Technical Notes language/taxonomy/page-break presentation is revised.'
          new['basis']=copy.deepcopy(old.get('basis') or {})
          new['basis']['previous_source_manifest_path']=cur['path']
          new['basis']['previous_source_manifest_sha256']=cur['sha256']
          new['review_repair']={'issues':[50,54,55],'new_external_evidence':False,'selected_evidence_only':True,'evidence_mutated':False,'draft_packages_mutated':False,'layout_revision_path':marker.relative_to(root).as_posix(),'layout_revision_sha256':sha(marker)}
          manifest=out/'source-manifest.json'
          manifest.write_text(json.dumps(new,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          hist=state.setdefault('provenance_history',{})
          hist.setdefault('validated_issue_source',[]).append(cur)
          prev_build=copy.deepcopy(state.get('provenance',{}).get('latex_build') or {})
          if prev_build: hist.setdefault('latex_build',[]).append(prev_build)
          state['lifecycle_state']='VALIDATED_DRAFT'
          state['gates']['latex_build']='pending'; state['gates']['visual_review']='pending'; state['gates']['freeze']='pending'
          state['provenance']['validated_issue_source']={
            'path':manifest.relative_to(root).as_posix(),'sha256':sha(manifest),'source_version':'v0.6',
            'layout_mode':'balanced-multicol-adaptive-spacing-with-may-chronology-review-repairs',
            'layout_revision_path':marker.relative_to(root).as_posix(),'layout_revision_sha256':sha(marker)
          }
          state['provenance'].pop('latex_build',None)
          state['provenance']['reader_layout_revision']={'source_version':'v0.6','layout_revision_path':marker.relative_to(root).as_posix(),'layout_revision_sha256':sha(marker),'reason':'Pre-release external review Issues #50/#54/#55.'}
          state_path.write_text(json.dumps(state,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          PY

      - name: Prepare and fill SHA-bound Japanese Technical Notes summaries
        working-directory: worktree
        shell: bash
        env:
          PYTHONPATH: ../control-src
        run: |
          set -euo pipefail
          python ../control-src/scripts/special_reader_notes_ja.py prepare --repo-root . --issue-id SP-2026-M05 --output sources/SP-2026-M05/editorial/technical-notes-ja-v0.1.json
          python - <<'PY'
          import json,re,pathlib
          p=pathlib.Path('sources/SP-2026-M05/editorial/technical-notes-ja-v0.1.json')
          data=json.load(open(p,encoding='utf-8'))
          claim_ja={
          'GPT-5.5 Instant: smarter, clearer, and more personalized':'OpenAIの公式feedでは、GPT-5.5 Instantを5月5日のChatGPT default model更新として記録し、回答品質、hallucination低減、personalization controlの改善を説明している。',
          'Anthropic May 2026 technical releases':'Anthropic newsroomのsnapshotでは、5月28日にClaude Opus 4.8を導入し、coding、agentic task、professional work、long-running work向けのOpus級upgradeとして説明している。',
          'Gemini API May 2026 lifecycle':'Gemini API changelogでは、5月19日のGemini 3.5 Flash GAとManaged Agents public preview、5月7日のGemini 3.1 Flash-Lite GA、5月5日のmultimodal File Search、5月28日のnative visual model GAなどを記録している。',
          'Google DeepMind May 2026 releases':'DeepMind blogのsnapshotでは、May 2026の項目としてGemini 3.5、Gemini Omni、Gemini for Science、Co-Scientistを掲載しており、frontier modelsとAI-for-scienceを月精度で追える。',
          'Advancing voice intelligence with new models in the API':'OpenAIの公式feedでは、speech reasoning、translation、transcription向けの新しいRealtime voice modelをAPIに追加したと説明している。',
          'Alibaba Model Studio May 2026 model lifecycle':'Model Studioの公式lifecycle snapshotでは、5月21日のqwen3.7-max、5月25日のqwen3.7-max-preview、5月19日のqwen3.5-livetranslate-flash-realtimeなど、複数のMay 2026 model eventを記録している。',
          'How OpenAI delivers low-latency voice AI at scale':'OpenAIの公式feedでは、low-latencyかつglobal scaleのRealtime voice AIとturn-takingのため、WebRTC stackを再構築したと説明している。',
          'Running Codex safely at OpenAI':'OpenAIの公式feedでは、社内Codex運用の安全設計としてsandboxing、approval、network policy、agent-native telemetryを説明している。',
          'Building a safe, effective sandbox to enable Codex on Windows':'OpenAIの公式feedでは、Windows向けCodex sandboxについて、file accessとnetwork accessを制御する設計を説明している。',
          'Kimi Code CLI May 2026 lifecycle':'Kimi Code changelogでは、5月の初回releaseと5月26〜29日の連続更新を記録し、OpenAI-compatible reasoning model support、plugin system、scheduled task、自動permission handling、GitHub plugin install、default step limitの撤廃などを挙げている。',
          'Mistral May 2026 technical releases':'Mistralのnews snapshotでは、5月23日のremote agents、5月22日のMCP-enabled Studio toolingとWorkflows public preview、5月28日のVibe long-horizon Work/Code modes、5月27〜28日のPhysics AI関連発表を記録している。',
          'Agentic AI Workload Characteristics':'論文では、ReAct型agent workloadをend-to-endで観測し、複数benchmark/model構成にわたる反復model call、tool実行、増大するcontextを特徴づけている。',
          'vllm-project/vllm May 2026 release series':'vLLMのMay release series（v0.20.1、v0.21.0、v0.22.0）は、DeepSeek V4 hardening、KV/offload、attention backend、Model Runner V2、speculative/disaggregated servingなどを扱っている。',
          'sgl-project/sglang May 2026 release series':'SGLangのMay releases v0.5.11 / v0.5.12は、speculative decoding、disaggregated prefix caching、model support、DeepSeek V4 inference pathなどを扱っている。',
          'Release v0.6.12':'FlashInfer v0.6.12は、NVFP4 quantization、MoE kernel、GQA/MLA path、model/backend supportなど、low-level servingに関わるinference-kernel更新を含む。',
          'Adaptive KV Cache Reuse for Fast Long-Context LLM Serving':'CacheTuneは、strict prefix一致を越えてKV cacheを再利用し、long-context servingでattention関係を保つため必要なcontextを適応的に再計算する方式を提案している。',
          'ReMoE: Boosting Expert Reuse through Router Fine-Tuning in Memory-Constrained MoE LLM Inference':'ReMoEは、memory-constrained inferenceで一部expertのみをcacheできる条件下でexpert reuseを増やすため、MoE routingをfine-tuningする方式を提案している。',
          'From Prompt Injection to Persistent Control: Defending Agentic Harness Against Trojan Backdoors':'ClawTrojanはlocal agentic harnessに対するmulti-step persistent prompt-injection attackをモデル化し、DASGuardはworkspace内のuntrustedなcontrol-like contentを追跡・除去する方式として提示されている。',
          'Hijacking Agent Memory: Stealthy Trojan Attacks Through Conversational Interaction':'MemPoisonは、conversational interactionを通じてselective long-term memory pipelineを攻撃し、trigger/payload binding、entity masquerading、embedding optimizationを用いる方式を提示している。',
          'Relevance as a Vulnerability: How Web Retrieval Degrades Safety Alignment in LLM Agents':'AgentREVEALは、web retrieval integrationと取得contentのrelevanceがLLM agentのsafety alignmentを低下させ得る条件を分析している。',
          'Send a SCOUT First: Pre-hoc Reasoning for Adaptive Detector Allocation in Prompt-Injection Defense':'SCOUTは、requestごとに予測したreliabilityとlatencyに基づき、複数のprompt-injection detectorと必要に応じたLLM judgingを動的に割り当てる方式を提案している。',
          'An OpenAI model has disproved a central conjecture in discrete geometry':'OpenAIの公式feedでは、同社modelがdiscrete geometryのunit-distance problemに関する長年のconjectureを反証したと報告している。',
          'A shared playbook for trustworthy third party evaluations':'OpenAIの公式feedでは、frontier modelのthird-party evaluationについてcapability、safeguard、evaluation validityを扱うplaybookを公開している。',
          'AgenticVBench: Can AI Agents Complete Real-World Post-Production Tasks?':'AgenticVBenchは、text・image・audio・video・planning・tool useを必要とするreal-world post-production workflowでmultimodal agentを評価するbenchmarkを提示している。',
          'Identifying and Mitigating Systemic Measurement Bias in Production LLM Inference Benchmarks':'論文では、production LLM inference benchmarkにclient-sideのsystemic measurement biasが入り得るとし、Python GILがTTFT/TPOTへ与える影響をqueueing analysisでモデル化している。',
          'Representation Forcing for Bottleneck-Free Unified Multimodal Models':'Representation Forcingは、unified multimodal model内でvisual representationをautoregressiveなintermediate targetとして明示し、別途pretrained generative VAEを必要としない方式を提案している。'
          }
          aliases={
            'anthropic-news':'Anthropic newsroomのMay 2026 snapshot',
            'google-gemini-api-release-notes':'Gemini API changelogのMay 2026 snapshot',
            'google-deepmind-blog':'Google DeepMind blogのMay 2026 snapshot',
            'alibaba-model-studio-model-lifecycle':'Alibaba Model StudioのMay 2026 lifecycle',
            'kimi-code-whats-new':'Kimi CodeのMay 2026 changelog',
            'mistral-news':'Mistral newsのMay 2026 snapshot'
          }
          def primary_ja(src):
              m=re.fullmatch(r'The preserved primary source identifies “(.+?)” on ([0-9-]+)\.',src)
              if m: return f'保存済み一次資料では「{m.group(1)}」が{m.group(2)}に確認できる。'
              m=re.fullmatch(r'The preserved primary source identifies “(.+?)”\.',src)
              if m:
                  label=aliases.get(m.group(1),f'「{m.group(1)}」に対応する一次情報')
                  return f'保存済み一次資料では{label}を確認できる。'
              raise ValueError('unhandled PRIMARY_FACT: '+src)
          def limitation_ja(src):
              if 'first-party feed item' in src:
                  return '当該first-party feedは公開時系列とvendorが説明したscopeの確認には使えるが、詳細なcapability・benchmark・safety上の主張は本号で独立再現していない。'
              if 'first-party index' in src:
                  return '当該first-party indexは掲載された時系列の確認には使えるが、capability / benchmarkの説明はvendor claimであり、月精度の日付は日単位へ補完しない。'
              if 'Official repository release notes' in src:
                  return '公式repositoryのrelease notesは公開時系列と記載された実装変更を確認する一次資料だが、projectのperformance claimやhardwareをまたぐ一般化は本号で独立再現していない。'
              if 'original arXiv metadata/abstract' in src:
                  return 'arXivの原メタデータ／abstractは一次論文資料として扱うが、実験結果と一般化可能性はAuthor claimであり、本号では独立再現していない。'
              raise ValueError('unhandled limitation: '+src)
          seen=set()
          for rec in data['records']:
              name=rec['artifact_name']; seen.add(name)
              if name not in claim_ja: raise ValueError('missing artifact claim translation: '+name)
              non_primary=0
              for item in rec['claims']:
                  if item.get('evidence_class')=='PRIMARY_FACT': item['text_ja']=primary_ja(item['source_text'])
                  else:
                      item['text_ja']=claim_ja[name]; non_primary += 1
              if non_primary != 1: raise ValueError(f'{name}: expected one attributed claim, got {non_primary}')
              for item in rec['limitations']: item['text_ja']=limitation_ja(item['source_text'])
          if seen != set(claim_ja): raise ValueError('translation mapping mismatch: '+repr(sorted(set(claim_ja)-seen)))
          data['status']='READY'
          data['review_basis']={'issues':[50,54,55],'prepared_for_source_version':'v0.6','translation_scope':'PDF-facing Technical Notes only; immutable source_text preserved by SHA'}
          p.write_text(json.dumps(data,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          PY

      - name: Apply Japanese layer and reader-facing taxonomy/page-break controls
        working-directory: worktree
        shell: bash
        env:
          PYTHONPATH: ../control-src
        run: |
          set -euo pipefail
          python ../control-src/scripts/special_reader_notes_ja.py apply --repo-root . --issue-id SP-2026-M05 --special-slug 2026-M05 --summary sources/SP-2026-M05/editorial/technical-notes-ja-v0.1.json
          python ../control-src/scripts/postprocess_special_reader_facing_notes.py --repo-root . --issue-id SP-2026-M05 --special-slug 2026-M05 --source-version v0.6
          python ../control-src/scripts/special_reader_notes_ja.py check --repo-root . --issue-id SP-2026-M05
          python - <<'PY'
          import json,pathlib,re
          root=pathlib.Path('.')
          state=json.load(open(root/'sources/SP-2026-M05/pipeline-state.json',encoding='utf-8'))
          manifest=root/state['provenance']['validated_issue_source']['path']
          data=json.load(open(manifest,encoding='utf-8'))
          text='\n'.join((manifest.parent/a['technical_notes_path']).read_text(encoding='utf-8') for a in data['articles'])
          banned=['OTHER','OFFICIAL\\_PUBLICATION','PRODUCT\\_RELEASE','PRODUCT\\_UPDATE','AGENT\\_RELEASE','FRAMEWORK\\_RELEASE','MODEL\\_RELEASE','API\\_UPDATE','研究\\_RELEASE','論文\\_RELEASE','モデル\\_RELEASE']
          for token in banned:
              assert token not in text, token
          assert text.count('評価ガイダンス') >= 2
          assert 'The preserved primary source identifies' not in text
          assert 'were not independently reproduced' not in text
          assert '\\begin{samepage}' in text and '\\widowpenalty=10000' in text
          PY

      - name: Commit v0.6 reader-facing source before build
        working-directory: worktree
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add sources/SP-2026-M05/pipeline-state.json sources/SP-2026-M05/editorial/technical-notes-ja-v0.1.json sources/SP-2026-M05/editorial/layout-revision-v0.6.json surveys/special/2026-M05/revisions/v0.6
          git commit -m 'Repair M05 Technical Notes review findings in v0.6'
          git push origin HEAD:special/2026-M05-work

      - name: Pin survey style
        shell: bash
        run: cp control-src/templates/survey/jgaisurvey.sty worktree/surveys/special/2026-M05/revisions/v0.6/jgaisurvey.sty

      - name: Set reproducible PDF timestamp
        run: echo 'SOURCE_DATE_EPOCH=1779926400' >> "$GITHUB_ENV"

      - name: Compile v0.6 Preview
        uses: xu-cheng/latex-action@v4
        with:
          root_file: main.tex
          working_directory: worktree/surveys/special/2026-M05/revisions/v0.6
          texlive_version: 2026
          latexmk_use_lualatex: true
          os: alpine

      - name: Audit v0.6 Preview
        id: audit
        shell: bash
        run: |
          set -euo pipefail
          dir=worktree/surveys/special/2026-M05/revisions/v0.6
          pdf="$dir/main.pdf"; log="$dir/main.log"
          test -s "$pdf" && test -s "$log"
          bad=$(grep -E -n 'LaTeX Warning: (There were undefined references|Citation .* undefined)|Package biblatex Warning: Please (re)?run|Overfull \\hbox|Underfull \\hbox|Missing character:' "$log" || true)
          pages=$(python - "$log" <<'PY'
          import re,sys
          text=open(sys.argv[1],encoding='utf-8',errors='replace').read()
          values=re.findall(r'Output written on .*?\((\d+) pages?',text,re.S)
          print(values[-1] if values else '-1')
          PY
          )
          sha=$(sha256sum "$pdf" | awk '{print $1}')
          [ -z "$bad" ] && clean=true || clean=false
          python - "$pages" "$sha" "$clean" "$bad" <<'PY'
          import json,sys
          pages,sha,clean,bad=sys.argv[1:]
          n=int(pages)
          result={'schema_version':'1.0','issue_id':'SP-2026-M05','source_version':'v0.6','page_count':n,'pdf_sha256':sha,'log_clean':clean=='true','log_gate_findings':bad.splitlines() if bad else [],'page_target_min':32,'page_target_max':40,'page_budget_passed':32<=n<=40,'review_issues':[50,54,55]}
          open('special-pdf-build-audit.json','w',encoding='utf-8').write(json.dumps(result,ensure_ascii=False,indent=2)+'\n')
          print(json.dumps(result,ensure_ascii=False,indent=2))
          if not result['log_clean'] or not result['page_budget_passed']: raise SystemExit(1)
          PY
          echo "pages=$pages" >> "$GITHUB_OUTPUT"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      - name: Upload v0.6 Preview artifact
        uses: actions/upload-artifact@v7
        with:
          name: japanese-generative-ai-survey-special-2026-M05-v0.6
          path: |
            worktree/surveys/special/2026-M05/revisions/v0.6/main.pdf
            worktree/surveys/special/2026-M05/revisions/v0.6/main.log
            special-pdf-build-audit.json
          if-no-files-found: error
          retention-days: 14

      - name: Record v0.6 release candidate with Visual Review pending
        working-directory: worktree
        shell: bash
        env:
          PAGES: ${{ steps.audit.outputs.pages }}
          PDF_SHA: ${{ steps.audit.outputs.sha }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib,json,pathlib,os
          p=pathlib.Path('sources/SP-2026-M05/pipeline-state.json')
          s=json.load(open(p,encoding='utf-8'))
          src=s['provenance']['validated_issue_source']; m=pathlib.Path(src['path'])
          assert src['source_version']=='v0.6' and hashlib.sha256(m.read_bytes()).hexdigest()==src['sha256']
          s['lifecycle_state']='RELEASE_CANDIDATE'; s['gates']['latex_build']='passed'; s['gates']['visual_review']='pending'; s['gates']['freeze']='pending'
          s['provenance']['latex_build']={'workflow_run_id':int(os.environ['RUN_ID']),'pdf_sha256':os.environ['PDF_SHA'],'page_count':int(os.environ['PAGES']),'source_version':'v0.6','validated_issue_source_path':src['path'],'validated_issue_source_sha256':src['sha256'],'preview_only':True,'log_clean':True,'review_issues_addressed':[50,54,55]}
          p.write_text(json.dumps(s,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          PY
          git config user.name 'github-actions[bot]'; git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add sources/SP-2026-M05/pipeline-state.json
          git commit -m 'Record M05 v0.6 pre-Human Preview candidate'
          git push origin HEAD:special/2026-M05-work
