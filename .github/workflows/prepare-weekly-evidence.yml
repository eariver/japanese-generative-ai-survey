name: Prepare weekly Evidence package

on:
  workflow_dispatch:
    inputs:
      issue_id:
        description: Weekly issue ID (YYYY-Www)
        required: true
        type: string
      screening_run_sha:
        description: Accepted complete screening result-set SHA-256
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: weekly-evidence-package-${{ inputs.issue_id }}-${{ inputs.screening_run_sha }}
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout current control code from main
        uses: actions/checkout@v6
        with:
          ref: main
          path: control-src
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Resolve canonical weekly work branch
        id: source
        shell: bash
        env:
          ISSUE_ID: ${{ inputs.issue_id }}
          SCREENING_RUN_SHA: ${{ inputs.screening_run_sha }}
        run: |
          set -euo pipefail
          if ! [[ "${ISSUE_ID}" =~ ^[0-9]{4}-W[0-9]{2}$ ]]; then
            echo '::error::issue_id must use YYYY-Www form'
            exit 2
          fi
          if ! [[ "${SCREENING_RUN_SHA}" =~ ^[0-9a-f]{64}$ ]]; then
            echo '::error::screening_run_sha must be 64 lowercase hex characters'
            exit 2
          fi
          echo "source_ref=weekly/${ISSUE_ID}-work" >> "${GITHUB_OUTPUT}"
          echo "screening_short=${SCREENING_RUN_SHA:0:12}" >> "${GITHUB_OUTPUT}"

      - name: Checkout weekly work tree
        uses: actions/checkout@v6
        with:
          ref: ${{ steps.source.outputs.source_ref }}
          path: source-tree
          fetch-depth: 1

      - name: Verify candidate-normalized source state
        id: provenance
        shell: bash
        env:
          ISSUE_ID: ${{ inputs.issue_id }}
          SCREENING_RUN_SHA: ${{ inputs.screening_run_sha }}
        run: |
          set -euo pipefail
          state="source-tree/sources/${ISSUE_ID}/pipeline-state.json"
          acceptance="source-tree/sources/${ISSUE_ID}/screening/runs/${SCREENING_RUN_SHA}/acceptance.json"
          queue="source-tree/sources/${ISSUE_ID}/screening/runs/${SCREENING_RUN_SHA}/verification-queue.jsonl"
          test -s "${state}"
          test -s "${acceptance}"
          test -s "${queue}"
          python - "${state}" "${acceptance}" "${ISSUE_ID}" "${SCREENING_RUN_SHA}" <<'PY'
          import json, sys
          state_path, acceptance_path, issue_id, screening_sha = sys.argv[1:]
          state = json.load(open(state_path, encoding='utf-8'))
          acceptance = json.load(open(acceptance_path, encoding='utf-8'))
          if state.get('issue_id') != issue_id:
              raise SystemExit('pipeline-state issue_id mismatch')
          if state.get('lifecycle_state') != 'CANDIDATES_NORMALIZED':
              raise SystemExit('Evidence package requires lifecycle_state=CANDIDATES_NORMALIZED')
          gates = state.get('gates') or {}
          if gates.get('candidate_inventory') != 'passed' or gates.get('evidence_normalized') != 'pending':
              raise SystemExit('Evidence package requires candidate_inventory=passed and evidence_normalized=pending')
          if acceptance.get('issue_id') != issue_id or acceptance.get('status') != 'ACCEPTED':
              raise SystemExit('screening acceptance identity/status mismatch')
          if acceptance.get('result_set_sha256') != screening_sha:
              raise SystemExit('screening acceptance result_set_sha256 mismatch')
          PY
          commit_sha="$(git -C source-tree rev-parse HEAD)"
          echo "commit_sha=${commit_sha}" >> "${GITHUB_OUTPUT}"
          echo "commit_short=${commit_sha:0:12}" >> "${GITHUB_OUTPUT}"

      - name: Build deterministic Evidence execution package
        shell: bash
        env:
          ISSUE_ID: ${{ inputs.issue_id }}
          SCREENING_RUN_SHA: ${{ inputs.screening_run_sha }}
          SOURCE_REF: ${{ steps.source.outputs.source_ref }}
          SOURCE_COMMIT: ${{ steps.provenance.outputs.commit_sha }}
        run: |
          set -euo pipefail
          PYTHONPATH=control-src python control-src/scripts/prepare_evidence_run.py \
            --repo-root source-tree \
            --output-root evidence-package \
            --issue-id "${ISSUE_ID}" \
            --screening-run-sha "${SCREENING_RUN_SHA}" \
            --source-ref "${SOURCE_REF}" \
            --source-commit "${SOURCE_COMMIT}"
          python -m json.tool evidence-package/evidence-execution-package.json >/dev/null

      - name: Upload immutable Evidence input package
        uses: actions/upload-artifact@v7
        with:
          name: weekly-evidence-input-${{ inputs.issue_id }}-${{ steps.source.outputs.screening_short }}-${{ steps.provenance.outputs.commit_short }}
          path: evidence-package/
          if-no-files-found: error
          retention-days: 14
          compression-level: 6
