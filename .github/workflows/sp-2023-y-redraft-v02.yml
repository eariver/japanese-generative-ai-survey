name: One-time SP-2023-Y evidence-bound narrative redraft

on:
  push:
    branches:
      - special/2023-Y-work
    paths:
      - .github/workflows/sp-2023-y-redraft-v02.yml

permissions:
  contents: write

jobs:
  redraft:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout current control code
        uses: actions/checkout@v6
        with:
          ref: main
          path: control-src
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Checkout SP-2023-Y work branch
        uses: actions/checkout@v6
        with:
          ref: special/2023-Y-work
          path: worktree
          fetch-depth: 0
      - name: Verify pre-publication recovery boundary
        run: |
          set -euo pipefail
          python control-src/scripts/raw_provenance.py --repo-root worktree --issue-id SP-2023-Y check
          python - <<'PY'
          import json,pathlib
          root=pathlib.Path('worktree')
          state=json.load(open(root/'sources/SP-2023-Y/pipeline-state.json',encoding='utf-8'))
          assert state['lifecycle_state']=='RELEASE_CANDIDATE', state['lifecycle_state']
          assert state['gates']['issue_architecture']=='passed'
          assert state['gates']['article_draft']=='passed'
          assert state['gates']['claim_and_chronology_validation']=='passed'
          assert state['gates']['latex_build']=='passed'
          assert state['gates']['visual_review']=='pending'
          assert state['gates']['freeze']=='pending'
          assert 'publication_preview' not in state.get('provenance',{})
          overrides=root/'sources/SP-2023-Y/drafting/interactive-overrides-v0.2'
          expected={'frontier-interface','open-weight-ecosystem','tool-action-layer','runtime-adaptation','reasoning-retrieval-architecture','generative-media','evaluation-control','annual-chronology','annual-synthesis'}
          found={p.stem for p in overrides.glob('*.json')}
          assert found==expected, (found,expected)
          manifest=json.load(open(root/'sources/SP-2023-Y/drafting/packages/v0.1/draft-package-manifest.json',encoding='utf-8'))
          assert manifest['article_drafting_count']==9, manifest
          PY
      - name: Re-open only downstream drafting and accept revised articles
        run: |
          set -euo pipefail
          generated_at=$(python - <<'PY'
          from datetime import datetime
          from zoneinfo import ZoneInfo
          print(datetime.now(ZoneInfo('Asia/Tokyo')).isoformat(timespec='seconds'))
          PY
          )
          PYTHONPATH=control-src python control-src/scripts/revise_special_interactive_drafts.py \
            --repo-root worktree \
            --issue-id SP-2023-Y \
            --package-dir sources/SP-2023-Y/drafting/packages/v0.1 \
            --overrides-dir sources/SP-2023-Y/drafting/interactive-overrides-v0.2 \
            --prompt config/prompts/editorial/article-drafting-v0.1.md \
            --provider OpenAI \
            --model 'GPT-5.6 Sol' \
            --invocation 'interactive ChatGPT pre-publication redraft after exact v0.3 visual density review; no paid inference-provider API' \
            --generated-at "$generated_at" \
            --run-reference 'SP-2023-Y pre-publication narrative depth repair: exact v0.3 PDF passed machine layout gates but visual review found the seven approved trajectory chapters under-explained; revise prose only against unchanged Draft Packages and Evidence, without reopening Selection or Architecture.' \
            --audit-output redraft-audit.json
      - name: Verify revised Draft acceptance and preserved upstream gates
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,pathlib
          root=pathlib.Path('worktree')
          state=json.load(open(root/'sources/SP-2023-Y/pipeline-state.json',encoding='utf-8'))
          assert state['lifecycle_state']=='DRAFT_COMPLETE', state['lifecycle_state']
          assert state['gates']['issue_architecture']=='passed'
          assert state['gates']['candidate_selection']=='passed'
          assert state['gates']['evidence_normalized']=='passed'
          assert state['gates']['article_draft']=='passed'
          assert state['gates']['claim_and_chronology_validation']=='pending'
          assert state['gates']['latex_build']=='pending'
          assert state['gates']['visual_review']=='pending'
          assert state['gates']['freeze']=='pending'
          assert 'validated_issue_source' not in state.get('provenance',{})
          assert 'annual_chronology' not in state.get('provenance',{})
          assert 'latex_build' not in state.get('provenance',{})
          assert not (root/'sources/SP-2023-Y/preview-transfer').exists()
          history=state.get('provenance_history',{}).get('pre_publication_redraft') or []
          assert history and history[-1]['prior_lifecycle_state']=='RELEASE_CANDIDATE'
          prov=state['provenance']['article_draft']
          run=root/prov['result_set_path']
          assert run.is_dir(), run
          acceptance=json.load(open(run/'acceptance.json',encoding='utf-8'))
          assert acceptance['status']=='ACCEPTED'
          assert acceptance['article_draft_count']==9
          assert len(acceptance['results'])==9
          audit=json.load(open('redraft-audit.json',encoding='utf-8'))
          assert audit['status']=='REDRAFT_ACCEPTED'
          assert audit['new_article_draft_count']==9
          assert audit['architecture_reopened'] is False
          assert audit['selection_reopened'] is False
          assert audit['evidence_reopened'] is False
          PY
      - name: Commit revised Draft run and remove one-time workflow
        working-directory: worktree
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add sources/SP-2023-Y/pipeline-state.json sources/SP-2023-Y/drafting/runs
          git add -A sources/SP-2023-Y/preview-transfer || true
          git rm .github/workflows/sp-2023-y-redraft-v02.yml
          git commit -m 'Accept expanded SP-2023-Y reader narrative v0.2'
          git push origin HEAD:special/2023-Y-work
      - name: Upload redraft audit
        uses: actions/upload-artifact@v7
        with:
          name: sp-2023-y-redraft-v0.2
          path: redraft-audit.json
          if-no-files-found: error
          retention-days: 14
