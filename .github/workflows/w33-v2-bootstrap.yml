name: W33 Core v2 bootstrap

on:
  push:
    branches:
      - weekly/2026-W33-v2-work
    paths:
      - .github/workflows/w33-v2-bootstrap.yml

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: weekly/2026-W33-v2-work
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Core v2 dependencies
        run: python -m pip install -r config/survey-production-v2-requirements.txt
      - name: Initialize W33 from canonical main implementation
        run: |
          PYTHONPATH=. python scripts/survey_pilot_bootstrap_v2.py --repo-root . initialize \
            --pilot W33 \
            --recorded-at 2026-08-22T14:13:00Z \
            --implementation-sha a009ad28c2c2ed61ab90022a93b23eb053cadb3b
      - name: Commit initialized Production Profile and State
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add sources/2026-W33
          git commit -m 'Initialize 2026-W33 Survey Production Core v2'
          git push origin HEAD:weekly/2026-W33-v2-work
