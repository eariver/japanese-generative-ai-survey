name: Release frozen weekly survey — issue-only

on:
  workflow_dispatch:
    inputs:
      issue_id:
        description: Frozen Weekly issue ID, for example 2026-W33
        required: true
        type: string
      approval_reference:
        description: Human Freeze approval reference carried into publication provenance
        required: true
        type: string

permissions:
  contents: write
  actions: read

concurrency:
  group: weekly-release-${{ inputs.issue_id }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release control metadata
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Validate frozen issue-only release manifest
        id: manifest
        shell: bash
        env:
          ISSUE_ID: ${{ inputs.issue_id }}
        run: |
          set -euo pipefail
          manifest="sources/${ISSUE_ID}/release-manifest.json"
          test -s "$manifest"
          python -m json.tool "$manifest" >/dev/null
          python - "$manifest" "$ISSUE_ID" >> "$GITHUB_OUTPUT" <<'PY'
          import json,re,sys
          path,issue_id=sys.argv[1:]
          data=json.load(open(path,encoding='utf-8'))
          required={
              'schema_version','issue_id','release_identity_mode','status','source_commit',
              'release_tag','release_title','asset_name','expected_pdf_sha256','page_count',
              'survey_root','freeze_record','pdf_source','public_release_authorized','release_authorization'
          }
          missing=sorted(required-data.keys())
          if missing: raise SystemExit(f'missing release-manifest fields: {missing}')
          if data['schema_version']!='1.0': raise SystemExit('unsupported schema_version')
          if data['issue_id']!=issue_id: raise SystemExit('issue input does not match release manifest')
          if data['release_identity_mode']!='ISSUE_ONLY': raise SystemExit('future Weekly release must use ISSUE_ONLY identity')
          if 'revision' in data: raise SystemExit('public Weekly release manifest must not contain revision')
          if data['status']!='frozen': raise SystemExit('release manifest is not frozen')
          if data['release_tag']!=f'weekly/{issue_id}': raise SystemExit('release_tag must be weekly/<issue>')
          if data['asset_name']!=f'Japanese_Generative_AI_Technical_Survey_{issue_id}.pdf':
              raise SystemExit('asset_name must be issue-only')
          if not data['public_release_authorized']: raise SystemExit('Freeze approval has not authorized publication')
          auth=data['release_authorization']
          if auth.get('mode')!='FREEZE_APPROVAL' or not auth.get('approval_reference'):
              raise SystemExit('release authorization must be Human Freeze approval')
          if not re.fullmatch(r'[0-9a-f]{40}',data['source_commit']): raise SystemExit('invalid source_commit')
          if not re.fullmatch(r'[0-9a-f]{64}',data['expected_pdf_sha256']): raise SystemExit('invalid PDF SHA')
          pdf=data['pdf_source']; mode=pdf.get('mode')
          if mode not in {'actions-artifact','rebuild'}: raise SystemExit(f'unsupported pdf source mode: {mode}')
          if mode=='actions-artifact':
              for key in ('workflow_run_id','artifact_id','artifact_name'):
                  if not pdf.get(key): raise SystemExit(f'actions-artifact requires {key}')
          values={
              'source_commit':data['source_commit'],'release_tag':data['release_tag'],
              'release_title':data['release_title'],'asset_name':data['asset_name'],
              'expected_pdf_sha256':data['expected_pdf_sha256'],'page_count':data['page_count'],
              'survey_root':data['survey_root'],'freeze_record':data['freeze_record'],
              'pdf_source_mode':mode,'workflow_run_id':pdf.get('workflow_run_id',''),
              'artifact_id':pdf.get('artifact_id',''),'artifact_name':pdf.get('artifact_name',''),
              'artifact_digest':pdf.get('artifact_digest',''),
              'freeze_approval_reference':auth['approval_reference'],
          }
          for key,value in values.items(): print(f'{key}={value}')
          PY
          freeze_record="$(python -c "import json; print(json.load(open('${manifest}'))['freeze_record'])")"
          test -s "$freeze_record"

      - name: Checkout frozen PDF-producing source commit
        uses: actions/checkout@v6
        with:
          ref: ${{ steps.manifest.outputs.source_commit }}
          path: release-src
          fetch-depth: 0

      - name: Download exact frozen Actions artifact
        if: steps.manifest.outputs.pdf_source_mode == 'actions-artifact'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ steps.manifest.outputs.workflow_run_id }}
          ARTIFACT_ID: ${{ steps.manifest.outputs.artifact_id }}
          ARTIFACT_NAME: ${{ steps.manifest.outputs.artifact_name }}
          ARTIFACT_DIGEST: ${{ steps.manifest.outputs.artifact_digest }}
          ASSET_NAME: ${{ steps.manifest.outputs.asset_name }}
        run: |
          set -euo pipefail
          mkdir -p dist frozen-artifact
          actual_name="$(gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${ARTIFACT_ID}" --jq '.name')"
          actual_run="$(gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${ARTIFACT_ID}" --jq '.workflow_run.id')"
          expired="$(gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${ARTIFACT_ID}" --jq '.expired')"
          actual_digest="$(gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${ARTIFACT_ID}" --jq '.digest // ""')"
          test "$actual_name" = "$ARTIFACT_NAME"
          test "$actual_run" = "$RUN_ID"
          test "$expired" = false
          if [ -n "$ARTIFACT_DIGEST" ]; then test "$actual_digest" = "$ARTIFACT_DIGEST"; fi
          gh run download "$RUN_ID" --repo "$GITHUB_REPOSITORY" --name "$ARTIFACT_NAME" --dir frozen-artifact
          test -s frozen-artifact/main.pdf
          cp frozen-artifact/main.pdf "dist/${ASSET_NAME}"

      - name: Set reproducible PDF epoch for rebuild source
        if: steps.manifest.outputs.pdf_source_mode == 'rebuild'
        shell: bash
        env:
          SOURCE_COMMIT: ${{ steps.manifest.outputs.source_commit }}
        run: |
          set -euo pipefail
          echo "SOURCE_DATE_EPOCH=$(git -C release-src show -s --format=%ct "$SOURCE_COMMIT")" >> "$GITHUB_ENV"
          echo 'FORCE_SOURCE_DATE=1' >> "$GITHUB_ENV"

      - name: Compile frozen source with LuaLaTeX
        if: steps.manifest.outputs.pdf_source_mode == 'rebuild'
        uses: xu-cheng/latex-action@v4
        with:
          root_file: main.tex
          working_directory: release-src/${{ steps.manifest.outputs.survey_root }}
          texlive_version: 2026
          os: debian
          latexmk_use_lualatex: true

      - name: Collect reproducibly rebuilt PDF
        if: steps.manifest.outputs.pdf_source_mode == 'rebuild'
        shell: bash
        env:
          SURVEY_ROOT: ${{ steps.manifest.outputs.survey_root }}
          ASSET_NAME: ${{ steps.manifest.outputs.asset_name }}
        run: |
          set -euo pipefail
          build_dir="release-src/${SURVEY_ROOT}"
          test -s "${build_dir}/main.pdf" && test -s "${build_dir}/main.log"
          if grep -E -n 'LaTeX Warning: (There were undefined references|Citation .* undefined)|Package biblatex Warning: Please (re)?run|Overfull \\hbox|Underfull \\hbox|Missing character:' "${build_dir}/main.log"; then
            echo '::error::Final TeX log contains publication-blocking warnings.'
            exit 1
          fi
          mkdir -p dist
          cp "${build_dir}/main.pdf" "dist/${ASSET_NAME}"

      - name: Verify frozen PDF digest
        shell: bash
        env:
          EXPECTED_SHA256: ${{ steps.manifest.outputs.expected_pdf_sha256 }}
          ASSET_NAME: ${{ steps.manifest.outputs.asset_name }}
        run: |
          set -euo pipefail
          test -s "dist/${ASSET_NAME}"
          actual="$(sha256sum "dist/${ASSET_NAME}" | awk '{print $1}')"
          test "$actual" = "$EXPECTED_SHA256"
          (cd dist && sha256sum "$ASSET_NAME" > SHA256SUMS.txt)

      - name: Build release metadata and notes
        shell: bash
        env:
          ISSUE_ID: ${{ inputs.issue_id }}
          APPROVAL_REFERENCE: ${{ inputs.approval_reference }}
          FREEZE_APPROVAL_REFERENCE: ${{ steps.manifest.outputs.freeze_approval_reference }}
          SOURCE_COMMIT: ${{ steps.manifest.outputs.source_commit }}
          PDF_SHA256: ${{ steps.manifest.outputs.expected_pdf_sha256 }}
          PAGE_COUNT: ${{ steps.manifest.outputs.page_count }}
          FREEZE_RECORD: ${{ steps.manifest.outputs.freeze_record }}
          TAG: ${{ steps.manifest.outputs.release_tag }}
          ASSET_NAME: ${{ steps.manifest.outputs.asset_name }}
        run: |
          set -euo pipefail
          default_branch="$(gh api "repos/${GITHUB_REPOSITORY}" --jq '.default_branch')"
          release_anchor="$(gh api "repos/${GITHUB_REPOSITORY}/commits/${default_branch}" --jq '.sha')"
          cat > dist/RELEASE_METADATA.json <<EOF
          {
            "schema_version": "1.0",
            "issue_id": "${ISSUE_ID}",
            "release_identity_mode": "ISSUE_ONLY",
            "release_tag": "${TAG}",
            "release_anchor_commit": "${release_anchor}",
            "frozen_source_commit": "${SOURCE_COMMIT}",
            "pdf_sha256": "${PDF_SHA256}",
            "asset_name": "${ASSET_NAME}",
            "page_count": ${PAGE_COUNT},
            "freeze_record": "${FREEZE_RECORD}",
            "freeze_approval_reference": "${FREEZE_APPROVAL_REFERENCE}"
          }
          EOF
          python -m json.tool dist/RELEASE_METADATA.json >/dev/null
          cat > dist/RELEASE_NOTES.md <<EOF
          # ${ISSUE_ID}

          Frozen release of the Japanese Generative AI Technical Survey.

          - Frozen source commit: \`${SOURCE_COMMIT}\`
          - PDF SHA-256: \`${PDF_SHA256}\`
          - Pages: ${PAGE_COUNT}
          - Freeze record: \`${FREEZE_RECORD}\`
          - Release anchor commit: \`${release_anchor}\`

          The issue number is the complete public Release identity. Internal source/build revisions are provenance only and are not public versions.
          EOF
          echo "RELEASE_ANCHOR=$release_anchor" >> "$GITHUB_ENV"

      - name: Publish verified frozen Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.manifest.outputs.release_tag }}
          TITLE: ${{ steps.manifest.outputs.release_title }}
          ASSET_NAME: ${{ steps.manifest.outputs.asset_name }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::error::Release already exists for issue ${TAG}; post-Release correction requires an exceptional correction path."
            exit 1
          fi
          gh release create "$TAG" \
            "dist/${ASSET_NAME}#Japanese Generative AI Technical Survey PDF" \
            'dist/SHA256SUMS.txt#SHA-256 checksums' \
            'dist/RELEASE_METADATA.json#Release provenance metadata' \
            --repo "$GITHUB_REPOSITORY" \
            --target "$RELEASE_ANCHOR" \
            --title "$TITLE" \
            --notes-file dist/RELEASE_NOTES.md
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json tagName,name,isDraft,isPrerelease,targetCommitish,url > dist/release-result.json
          test "$(jq -r '.isDraft' dist/release-result.json)" = false
          test "$(jq -r '.isPrerelease' dist/release-result.json)" = false
          test "$(jq -r '.tagName' dist/release-result.json)" = "$TAG"

      - name: Verify published PDF and anchor
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.manifest.outputs.release_tag }}
          ASSET_NAME: ${{ steps.manifest.outputs.asset_name }}
          EXPECTED_SHA256: ${{ steps.manifest.outputs.expected_pdf_sha256 }}
        run: |
          set -euo pipefail
          mkdir verify-published
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --dir verify-published \
            --pattern "$ASSET_NAME" --pattern 'RELEASE_METADATA.json'
          test "$(sha256sum "verify-published/${ASSET_NAME}" | awk '{print $1}')" = "$EXPECTED_SHA256"
          metadata_anchor="$(python -c "import json; print(json.load(open('verify-published/RELEASE_METADATA.json'))['release_anchor_commit'])")"
          tag_sha="$(git ls-remote --tags origin "refs/tags/${TAG}" | awk 'NR==1 {print $1}')"
          test "$tag_sha" = "$metadata_anchor"

      - name: Upload publication audit
        uses: actions/upload-artifact@v7
        with:
          name: weekly-release-audit-${{ inputs.issue_id }}
          path: |
            dist/RELEASE_METADATA.json
            dist/RELEASE_NOTES.md
            dist/SHA256SUMS.txt
            dist/release-result.json
          if-no-files-found: error
          retention-days: 90
