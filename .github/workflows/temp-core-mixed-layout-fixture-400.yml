name: Temporary Core mixed-layout fixture repair

on:
  push:
    branches:
      - fix/core-v2-longform-mixed-layout-review-400

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Core dependencies
        run: python -I -m pip install -r config/survey-production-v2-requirements.txt
      - name: Apply fixture repair
        run: python scripts/_temp_patch_longform_mixed_layout_fixture_400.py
      - name: Run affected regressions
        run: |
          python -m unittest \
            tests.test_survey_reader_fidelity_v2 \
            tests.test_survey_publication_v2 \
            tests.test_survey_human_gate_v2 \
            tests.test_survey_core_execution_bridge_human_gate_v2 \
            tests.test_survey_human_gate_audit_matrix_v2
      - name: Remove temporary transport and commit repaired candidate
        run: |
          set -euo pipefail
          git rm .github/workflows/temp-core-mixed-layout-fixture-400.yml
          git rm scripts/_temp_patch_longform_mixed_layout_fixture_400.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/survey_reader_fidelity_v2.py tests/test_survey_human_gate_v2.py docs/checkpoints/core-v2-longform-mixed-layout-review-400-worklog.md
          git commit -m 'Core v2: bind Human Gate fixtures to mixed-layout review'
          git push origin HEAD:fix/core-v2-longform-mixed-layout-review-400
