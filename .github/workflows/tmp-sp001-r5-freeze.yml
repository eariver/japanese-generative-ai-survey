name: Temporary SP001 r5 deterministic freeze

on:
  push:
    branches: [special/SP001-v2-work]
    paths:
      - 'sources/SP001/publication/v2/tmp-r5-freeze-trigger.txt'

permissions:
  contents: write

jobs:
  freeze:
    runs-on: ubuntu-latest
    steps:
      - name: Sparse clone exact trigger head
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          url="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git clone --depth 30 --filter=blob:none --sparse --branch special/SP001-v2-work "$url" repo
          cd repo
          git sparse-checkout set \
            .github/workflows \
            config \
            schemas \
            scripts \
            sources/SP001 \
            surveys/special/SP001 \
            templates/survey \
            tests
          actual=$(git rev-parse HEAD)
          test "$actual" = "$GITHUB_SHA" || { echo "branch moved trigger=$GITHUB_SHA cloned=$actual"; exit 78; }
          git fetch --depth 1 origin main
          test "$(git rev-parse FETCH_HEAD)" = "7f3bc0f65f5cf11ffd559fde37f3f5dff90a9be9" || { echo 'main moved from reviewed Core authority'; exit 78; }
          git diff --quiet FETCH_HEAD HEAD -- config schemas scripts || { echo 'protected Core drift relative to reviewed main'; exit 1; }

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Core v2 dependencies
        working-directory: repo
        run: python -m pip install -r config/survey-production-v2-requirements.txt

      - name: Build and adopt deterministic Freeze
        working-directory: repo
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=. python - <<'PY'
          from datetime import datetime, timezone
          from pathlib import Path
          import json

          from scripts import survey_agent_control_v2 as agent
          from scripts import survey_production_v2 as core
          from scripts import survey_profiled_freeze_v2 as profiled_freeze
          from scripts import survey_publication_v2 as publication
          from scripts import survey_stage_validation_v2 as stage_validation

          root = Path('.').resolve()
          cfg = core.load_json(root/'config/survey-production-v2.json')
          source_root = root/'sources/SP001'
          state_path = source_root/'production-state.json'
          pub = source_root/'publication/v2'
          state = core.load_json(state_path)
          assert state['lifecycle_state'] == 'RELEASE_CANDIDATE'
          assert state['human_gates']['publication_preview'] == 'approved'
          assert state['next_action'] == 'RUN_FREEZE'
          approval_ref = state['human_gate_provenance']['publication_preview']
          approval_path = root/approval_ref['path']
          approval_sha_before = core.sha256_file(approval_path)
          review_index = source_root/'gates/review-index.json'
          review_index_sha_before = core.sha256_file(review_index)
          approval = publication.validate_preview_approval(root, approval_path, issue_id='SP001')
          assert approval['revision'] == 3
          assert approval['reviewed_repository_commit_sha'] == '5de21e4a66a1ab480dc0abcaf4971cc1fefb47d8'
          assert approval['pdf_sha256'] == '9f6bef98d15bfaec1ea2aec3972005487c28e44ec84762e4fbaa51639d7fe1b2'

          candidate_path = pub/'publication-candidate-v2.json'
          candidate = publication.validate_candidate(root, candidate_path, issue_id='SP001')
          assert candidate['candidate_sha256'] == '8f3bc5d851b306e75929fc9bfeb06cf3a584530f92b5088eae4323480b2a5bc0'
          assert candidate['pdf']['sha256'] == approval['pdf_sha256']
          assert candidate['pdf']['byte_count'] == 322250 and candidate['pdf']['page_count'] == 14

          now = datetime.now(timezone.utc)
          freeze_path, manifest_path = profiled_freeze.build_profiled_freeze(root, cfg, state_path, now)
          freeze = core.load_json(freeze_path)
          manifest = publication.validate_release_manifest(root, manifest_path)
          assert freeze['pdf_sha256'] == approval['pdf_sha256']
          assert manifest['pdf_sha256'] == approval['pdf_sha256']
          assert manifest['release_identity'] == 'special/SP001'

          run_root = source_root/'execution/bridge-runs/SP001-r5-freeze'
          run_root.mkdir(parents=True, exist_ok=True)
          result_path = run_root/'core-stage-contract.json'
          artifacts = {'freeze-record': freeze_path, 'release-manifest': manifest_path}
          stage_validation.validate_stage(root, cfg, state_path, artifacts, result_path, now)
          reviews_path = run_root/'reviews.json'
          core.write_json(reviews_path, {'reviews': [
            {
              'check_id': agent.CORE_STAGE_REVIEW_ID,
              'kind': 'DETERMINISTIC',
              'executor': 'survey_stage_validation_v2',
              'evidence': 'Canonical Core RELEASE_CANDIDATE -> FROZEN stage contract validated against the exact r5 Publication Candidate, Human Publication Preview approval r3, pre-preview Visual Review, Freeze record and Release Manifest.',
              'result_path': str(result_path.relative_to(root)),
            },
            {
              'check_id': 'stage:freeze',
              'kind': 'DETERMINISTIC',
              'executor': 'survey_profiled_freeze_v2',
              'evidence': 'Profile-aware deterministic Freeze binds the Human-approved exact PDF SHA-256 9f6bef98d15bfaec1ea2aec3972005487c28e44ec84762e4fbaa51639d7fe1b2, 322250 bytes, 14 pages, and derives issue-only public identity special/SP001 from the Production Profile.',
            },
          ]})
          impl = core.repository_commit_sha(root)
          checkpoint = agent.build_stage_checkpoint(
              root, cfg, state_path, artifacts, reviews_path,
              'Freeze exact SP001 r5 Human-approved Publication Preview bytes and authorize the profile-derived issue-only Release identity without modifying Human review authority.',
              now, impl,
          )
          frozen_state = agent.advance_with_checkpoint(root, cfg, state_path, checkpoint)
          assert frozen_state['lifecycle_state'] == 'FROZEN'
          assert frozen_state['human_gates']['publication_preview'] == 'approved'
          assert frozen_state['machine_checkpoints']['freeze'] == 'passed'
          assert frozen_state['machine_checkpoints']['release'] == 'pending'
          assert core.sha256_file(approval_path) == approval_sha_before
          assert core.sha256_file(review_index) == review_index_sha_before
          errors = agent.validate_agent_state(root, cfg, frozen_state)
          assert errors == [], errors

          audit = {
            'schema_version': '2.0-rc1',
            'issue_id': 'SP001',
            'status': 'PASS',
            'kind': 'DETERMINISTIC_PROFILE_FREEZE',
            'recorded_at': core.iso_utc(datetime.now(timezone.utc)),
            'implementation_commit_sha': impl,
            'approved_candidate_sha256': candidate['candidate_sha256'],
            'approved_pdf_sha256': approval['pdf_sha256'],
            'pdf_byte_count': candidate['pdf']['byte_count'],
            'page_count': candidate['pdf']['page_count'],
            'publication_preview_revision': approval['revision'],
            'freeze_record': {'path': str(freeze_path.relative_to(root)), 'sha256': core.sha256_file(freeze_path)},
            'release_manifest': {'path': str(manifest_path.relative_to(root)), 'sha256': core.sha256_file(manifest_path), 'release_identity': manifest['release_identity']},
            'stage_checkpoint': {'path': str(checkpoint.relative_to(root)), 'sha256': core.sha256_file(checkpoint)},
            'human_review_authority_unchanged': True,
            'review_index_unchanged': True,
            'final_lifecycle_state': frozen_state['lifecycle_state'],
            'final_state_sha256': core.sha256_file(state_path),
          }
          core.write_json(pub/'freeze-audit-r5.json', audit)
          print(json.dumps(audit, ensure_ascii=False, indent=2))
          PY

      - name: Final fail-closed Freeze validation
        working-directory: repo
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=. python - <<'PY'
          from pathlib import Path
          from scripts import survey_agent_control_v2 as agent
          from scripts import survey_production_v2 as core
          from scripts import survey_publication_v2 as publication
          root=Path('.').resolve(); cfg=core.load_json(root/'config/survey-production-v2.json')
          state=core.load_json(root/'sources/SP001/production-state.json')
          assert state['lifecycle_state']=='FROZEN'
          assert state['human_gates']['publication_preview']=='approved'
          assert agent.validate_agent_state(root,cfg,state)==[]
          m=publication.validate_release_manifest(root,root/'sources/SP001/publication/v2/release-manifest-v2.json')
          assert m['release_identity']=='special/SP001'
          assert m['pdf_sha256']=='9f6bef98d15bfaec1ea2aec3972005487c28e44ec84762e4fbaa51639d7fe1b2'
          print('SP001 r5 deterministic Freeze PASS')
          PY

      - name: Commit frozen authority and remove temporary transport
        working-directory: repo
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          rm -f .github/workflows/tmp-sp001-r5-freeze.yml
          rm -f sources/SP001/publication/v2/tmp-r5-freeze-trigger.txt
          find . -type d -name __pycache__ -prune -exec rm -rf {} +
          find . -name '*.pyc' -delete
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'Freeze SP001 r5 approved Publication Preview'
          git fetch --depth 1 origin special/SP001-v2-work
          remote_head=$(git rev-parse FETCH_HEAD)
          test "$remote_head" = "$GITHUB_SHA" || { echo "remote moved trigger=$GITHUB_SHA remote=$remote_head"; exit 78; }
          git push origin HEAD:special/SP001-v2-work
