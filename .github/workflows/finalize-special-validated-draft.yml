name: Finalize Special validated draft source

on:
  workflow_dispatch:
    inputs:
      special_slug:
        required: true
        type: string
      review_reference:
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: special-finalization-${{ inputs.special_slug }}
  cancel-in-progress: false

jobs:
  finalization:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout current control code
        uses: actions/checkout@v6
        with:
          ref: main
          path: control-src
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Resolve Special edition
        id: edition
        shell: bash
        env:
          SPECIAL_SLUG: ${{ inputs.special_slug }}
        run: |
          set -euo pipefail
          manifest="control-src/specials/${SPECIAL_SLUG}/edition.json"
          test -s "$manifest"
          python control-src/scripts/special_pipeline.py --config control-src/config/special-pipeline.json validate --manifest "$manifest"
          echo "special_id=$(python -c "import json; print(json.load(open('$manifest'))['special_id'])")" >> "$GITHUB_OUTPUT"
          echo "work_branch=$(python -c "import json; print(json.load(open('$manifest'))['paths']['work_branch'])")" >> "$GITHUB_OUTPUT"
      - name: Checkout Special work branch
        uses: actions/checkout@v6
        with:
          ref: ${{ steps.edition.outputs.work_branch }}
          path: worktree
          fetch-depth: 0
      - name: Verify post-draft boundary
        id: boundary
        shell: bash
        env:
          SPECIAL_ID: ${{ steps.edition.outputs.special_id }}
        run: |
          set -euo pipefail
          python control-src/scripts/raw_provenance.py --repo-root worktree --issue-id "$SPECIAL_ID" check
          python - "$SPECIAL_ID" >> "$GITHUB_OUTPUT" <<'PY'
          import json,sys
          issue=sys.argv[1]
          state=json.load(open(f'worktree/sources/{issue}/pipeline-state.json',encoding='utf-8'))
          assert state['lifecycle_state']=='DRAFT_COMPLETE', state['lifecycle_state']
          assert state['gates']['article_draft']=='passed'
          assert state['gates']['claim_and_chronology_validation']=='pending'
          path=state['provenance']['article_draft']['result_set_path']
          print(f'article_run_dir={path}')
          PY
          test -s "worktree/sources/${SPECIAL_ID}/synthesis/interactive-overrides-v0.1/issue-synthesis-v0.1.json"
      - name: Finalize synthesis, audits, and issue source
        shell: bash
        env:
          SPECIAL_SLUG: ${{ inputs.special_slug }}
          SPECIAL_ID: ${{ steps.edition.outputs.special_id }}
          ARTICLE_RUN_DIR: ${{ steps.boundary.outputs.article_run_dir }}
          REVIEW_REFERENCE: ${{ inputs.review_reference }}
        run: |
          set -euo pipefail
          generated_at=$(python - <<'PY'
          from datetime import datetime
          from zoneinfo import ZoneInfo
          print(datetime.now(ZoneInfo('Asia/Tokyo')).isoformat(timespec='seconds'))
          PY
          )
          PYTHONPATH=control-src python control-src/scripts/finalize_special_validated_draft.py \
            --repo-root worktree \
            --special-slug "$SPECIAL_SLUG" \
            --issue-id "$SPECIAL_ID" \
            --article-run-dir "$ARTICLE_RUN_DIR" \
            --synthesis-body "sources/${SPECIAL_ID}/synthesis/interactive-overrides-v0.1/issue-synthesis-v0.1.json" \
            --generated-at "$generated_at" \
            --run-reference "$REVIEW_REFERENCE" \
            > special-finalization-audit.json
          PYTHONPATH=control-src python control-src/scripts/special_period_consistency.py apply \
            --repo-root worktree \
            --special-slug "$SPECIAL_SLUG" \
            --issue-id "$SPECIAL_ID" \
            > special-period-consistency-audit.json
      - name: Verify validated-draft state and period consistency
        shell: bash
        env:
          SPECIAL_ID: ${{ steps.edition.outputs.special_id }}
          SPECIAL_SLUG: ${{ inputs.special_slug }}
        run: |
          set -euo pipefail
          python - "$SPECIAL_ID" "$SPECIAL_SLUG" <<'PY'
          import json,sys,pathlib
          issue,slug=sys.argv[1:]
          root=pathlib.Path('worktree')
          state=json.load(open(root/'sources'/issue/'pipeline-state.json',encoding='utf-8'))
          assert state['lifecycle_state']=='VALIDATED_DRAFT', state['lifecycle_state']
          assert state['gates']['claim_and_chronology_validation']=='passed'
          assert state['gates']['latex_build']=='pending'
          audit=json.load(open(root/'sources'/issue/'finalization'/'v0.1'/'claim-chronology-audit.json',encoding='utf-8'))
          assert audit['passed'] is True, audit['errors']
          source=json.load(open(root/'surveys'/'special'/slug/'source-manifest.json',encoding='utf-8'))
          packages=json.load(open(root/'sources'/issue/'drafting'/'packages'/'v0.1'/'draft-package-manifest.json',encoding='utf-8'))
          expected=packages['article_drafting_count']
          assert expected>=1, packages
          assert source['status']=='VALIDATED_SOURCE'
          assert source['article_count']==expected, (source,packages)
          assert source['period_consistency']['retrospective_scope_derived_from_manifest'] is True
          PY
          PYTHONPATH=control-src python control-src/scripts/special_period_consistency.py check \
            --repo-root worktree \
            --special-slug "$SPECIAL_SLUG" \
            --issue-id "$SPECIAL_ID"
      - name: Commit validated Special source
        working-directory: worktree
        shell: bash
        env:
          SPECIAL_ID: ${{ steps.edition.outputs.special_id }}
          SPECIAL_SLUG: ${{ inputs.special_slug }}
          WORK_BRANCH: ${{ steps.edition.outputs.work_branch }}
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "sources/${SPECIAL_ID}/pipeline-state.json" \
                  "sources/${SPECIAL_ID}/finalization/v0.1" \
                  "surveys/special/${SPECIAL_SLUG}"
          git diff --cached --quiet && exit 0
          git commit -m "Finalize validated issue source for ${SPECIAL_ID}"
          git push origin "HEAD:${WORK_BRANCH}"
      - name: Upload finalization audit
        uses: actions/upload-artifact@v7
        with:
          name: special-finalization-${{ inputs.special_slug }}
          path: |
            special-finalization-audit.json
            special-period-consistency-audit.json
          if-no-files-found: error
          retention-days: 14
