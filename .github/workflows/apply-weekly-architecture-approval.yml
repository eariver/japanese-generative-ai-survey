name: Apply Weekly Architecture approval

on:
  push:
    branches:
      - 'weekly/*-work'
    paths:
      - 'scripts/apply_weekly_architecture_approval.py'
      - '.github/workflows/apply-weekly-architecture-approval.yml'
      - 'sources/*/architecture/human-architecture-approval-v0.2.json'
      - 'sources/*/selection/human-role-approval-v0.1.json'

permissions:
  contents: write

concurrency:
  group: weekly-architecture-approval-${{ github.ref }}
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Weekly work branch
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Resolve issue from work branch
        id: issue
        shell: bash
        run: |
          set -euo pipefail
          branch='${{ github.ref_name }}'
          if [[ "$branch" =~ ^weekly/([0-9]{4}-W[0-9]{2})-work$ ]]; then
            issue="${BASH_REMATCH[1]}"
          else
            echo "::error::Unexpected Weekly work branch: ${branch}"
            exit 2
          fi
          echo "issue_id=${issue}" >> "$GITHUB_OUTPUT"

      - name: Apply SHA-bound Human approvals
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=scripts python scripts/apply_weekly_architecture_approval.py \
            --issue-id '${{ steps.issue.outputs.issue_id }}' \
            --audit-output architecture-approval-audit.json

      - name: Verify resulting state
        shell: bash
        run: |
          set -euo pipefail
          python - '${{ steps.issue.outputs.issue_id }}' <<'PY'
          import json, pathlib, sys
          issue=sys.argv[1]
          root=pathlib.Path('sources')/issue
          state=json.load(open(root/'pipeline-state.json',encoding='utf-8'))
          selection=json.load(open(root/'selection'/'candidate-selection-v0.1.json',encoding='utf-8'))
          assert state['lifecycle_state']=='ARCHITECTURE_ESTABLISHED', state['lifecycle_state']
          assert state['gates']['candidate_selection']=='passed'
          assert state['gates']['issue_architecture']=='passed'
          assert state['gates']['article_draft']=='pending'
          assert selection['status']=='APPROVED'
          assert not any(x['role']=='UNASSIGNED' for x in selection['assignments'])
          PY

      - name: Commit approval transition
        shell: bash
        run: |
          set -euo pipefail
          issue='${{ steps.issue.outputs.issue_id }}'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            "sources/${issue}/selection/candidate-selection-v0.1.json" \
            "sources/${issue}/architecture/architecture-approval-audit-v0.2.json" \
            "sources/${issue}/pipeline-state.json"
          if git diff --cached --quiet; then
            echo 'Architecture approval already applied; nothing to commit.'
            exit 0
          fi
          git commit -m "Apply Human Architecture approval for ${issue}"
          git push origin HEAD:'${{ github.ref_name }}'

      - name: Upload approval audit
        uses: actions/upload-artifact@v7
        with:
          name: weekly-architecture-approval-${{ steps.issue.outputs.issue_id }}
          path: architecture-approval-audit.json
          if-no-files-found: error
          retention-days: 14
