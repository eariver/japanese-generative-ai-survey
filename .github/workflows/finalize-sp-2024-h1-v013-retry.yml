name: Finalize SP-2024-H1 v0.13 review repairs retry

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/finalize-sp-2024-h1-v013-retry.yml'

permissions:
  contents: write

concurrency:
  group: finalize-sp-2024-h1-v013-retry
  cancel-in-progress: false

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Special work branch
        uses: actions/checkout@v6
        with:
          ref: special/2024-H1-work
          path: worktree
          fetch-depth: 0

      - name: Checkout current control code
        uses: actions/checkout@v6
        with:
          ref: main
          path: control-src
          fetch-depth: 1

      - name: Normalize review repairs and duplicate cards
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations
          import copy, hashlib, json
          from pathlib import Path

          root = Path('worktree')
          issue, slug, version, parent_version = 'SP-2024-H1', '2024-H1', 'v0.13', 'v0.12'
          rev_root = root / 'surveys' / 'special' / slug / 'revisions'
          parent_dir, out = rev_root / parent_version, rev_root / version
          state_path = root / 'sources' / issue / 'pipeline-state.json'
          marker_path = root / 'sources' / issue / 'editorial' / f'layout-revision-{version}.json'

          def sha(path): return hashlib.sha256(Path(path).read_bytes()).hexdigest()
          def load(path): return json.loads(Path(path).read_text(encoding='utf-8'))
          def write(path, value):
              path = Path(path); path.parent.mkdir(parents=True, exist_ok=True)
              path.write_text(json.dumps(value, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          state = load(state_path)
          current = copy.deepcopy(state['provenance']['validated_issue_source'])
          parent_manifest_path = parent_dir / 'source-manifest.json'
          assert current['path'] == parent_manifest_path.relative_to(root).as_posix()
          assert current['source_version'] == parent_version
          assert state['lifecycle_state'] == 'RELEASE_CANDIDATE'
          assert state['gates']['latex_build'] == 'passed'
          assert state['gates']['visual_review'] == 'pending' and state['gates']['freeze'] == 'pending'
          assert sha(parent_manifest_path) == current['sha256']

          initial_expected = {
              'main.tex',
              'technical-notes/30-edge-private-notes.tex',
              'technical-notes/40-architecture-efficiency-notes.tex',
              'technical-notes/70-safety-control-notes.tex',
          }
          parent_files = {p.relative_to(parent_dir).as_posix(): p for p in parent_dir.rglob('*') if p.is_file()}
          out_files = {p.relative_to(out).as_posix(): p for p in out.rglob('*') if p.is_file()}
          observed = {rel for rel in parent_files.keys() & out_files.keys()
                      if rel not in {'source-manifest.json','technical-note-entity-binding-audit.json'}
                      and parent_files[rel].read_bytes() != out_files[rel].read_bytes()}
          assert observed == initial_expected, (observed, initial_expected)
          assert parent_files.keys() == out_files.keys()

          notes20 = out / 'technical-notes/20-open-ecosystem-notes.tex'
          notes30 = out / 'technical-notes/30-edge-private-notes.tex'
          notes40 = out / 'technical-notes/40-architecture-efficiency-notes.tex'
          notes70 = out / 'technical-notes/70-safety-control-notes.tex'

          openelm_fact = ('Appleの一次資料により、OpenELMについて2024-04-22にPaper First Submission、同日に研究公開を確認した。'
                          'OpenELMはopen language model familyで、Transformer各層へparameter budgetを一様配分せずlayer-wise scaling strategyで割り当てる設計を中心に提示する。'
                          'Appleはtraining/evaluation frameworkに加え、public checkpoints・configurations・logsとApple device向けMLX conversion codeを公開している。')
          deepseek_fact = ('DeepSeekの一次資料により、DeepSeek-V2は2024-05-06、DeepSeek-Coder-V2は2024-06-17にそれぞれモデル公開を確認した。'
                           'DeepSeek-V2自身はMixture-of-Experts構成とMulti-head Latent Attentionを用い、KV-cache量を抑える設計として説明される。'
                           'DeepSeek-Coder-V2はDeepSeek-V2系のMoE code modelとして公開され、128K contextをサポートすると説明される。')

          t20 = notes20.read_text(encoding='utf-8')
          old_oe20 = 'Appleの一次資料により、OpenELMについて2024-04-22にPaper First Submission、2024-04-22に研究公開を確認した。 対象event近傍の一次資料から image generation / small model / cost-efficient deployment を確認できる。'
          old_ds20 = 'DeepSeekの一次資料により、DeepSeek-V2 / DeepSeek-Coder-V2について2024-05-06にモデル公開、2024-06-17にモデル公開を確認した。 対象event近傍の一次資料から source links in search answers / Mixture-of-Experts (MoE) / KV-cache を確認できる。'
          assert old_oe20 in t20 and old_ds20 in t20
          t20 = t20.replace(old_oe20, openelm_fact, 1).replace(old_ds20, deepseek_fact, 1)
          notes20.write_text(t20, encoding='utf-8')

          t30 = notes30.read_text(encoding='utf-8')
          old_oe30 = openelm_fact + 'これらをOpenELM自身の属性として扱い、同一資料近傍のimage generation等の別subjectの語をOpenELMへ帰属させない。'
          assert old_oe30 in t30
          notes30.write_text(t30.replace(old_oe30, openelm_fact, 1), encoding='utf-8')

          t40 = notes40.read_text(encoding='utf-8')
          old_ds40 = deepseek_fact + '`source links in search answers`は両モデルのtechnical propertyとして扱わず、別source/event近傍の語をfamily cardへ混在させない。'
          assert old_ds40 in t40
          t40 = t40.replace(old_ds40, deepseek_fact, 1)
          old_lr = '論文中の8Kはextended modelのcontext上限ではなく、短いcontextでの性能回復のために行うreadjustmentの長さとして記載される値である。したがって本欄では8KをLongRoPE自身のcontext windowとして扱わない。'
          new_lr = '論文中では、短いcontextでの性能回復に用いるreadjustment lengthを8Kとしている。これはextended modelのcontext上限ではなく、2048K tokens超へのcontext extensionとは値の役割が異なる。'
          assert old_lr in t40
          notes40.write_text(t40.replace(old_lr, new_lr, 1), encoding='utf-8')

          t70 = notes70.read_text(encoding='utf-8')
          assert 'Many-shot jailbreaking & 主要資料 & 安全性研究 &' in t70
          ms = t70[t70.index('\\begin{technicalnote}{Many-shot jailbreaking}'):]
          ms = ms[:ms.index('\\end{technicalnote}')]
          assert '種別 & 安全性研究' in ms and '安全性事象' not in ms

          audit_path = out / 'technical-note-entity-binding-audit.json'
          audit = load(audit_path)
          assert audit['contract'] == 'SUBJECT_COMPONENT_VARIANT_PROPERTY_BINDING_V3'
          audit['source_version'] = version
          rows = {row['title']: row for row in audit['artifacts']}
          ds = rows['DeepSeek-V2 / DeepSeek-Coder-V2']
          ds['accepted_entity_bound_signals'] = list(dict.fromkeys(list(ds.get('accepted_entity_bound_signals') or []) + ['128K context']))
          ds['rejected_entity_bound_signals'] = [x for x in (ds.get('rejected_entity_bound_signals') or []) if x != '128K context']
          ds['binding_note'] = '128K context is bound to DeepSeek-Coder-V2; MoE is shared family architecture. Adjacent search-answer properties are not model properties.'
          lr = rows['LongRoPE']
          lr['accepted_entity_bound_signals'] = [x for x in (lr.get('accepted_entity_bound_signals') or []) if x != '8K context']
          lr['accepted_entity_bound_signals'] = list(dict.fromkeys(lr['accepted_entity_bound_signals'] + ['8K readjustment length']))
          lr['rejected_entity_bound_signals'] = list(dict.fromkeys(list(lr.get('rejected_entity_bound_signals') or []) + ['8K context']))
          lr['binding_note'] = '8K is a short-context readjustment length, not context capacity; context extension exceeds 2048K tokens.'
          oe = rows['OpenELM']
          oe['accepted_entity_bound_signals'] = list(dict.fromkeys(list(oe.get('accepted_entity_bound_signals') or []) + ['layer-wise scaling strategy','MLX conversion code']))
          oe['rejected_entity_bound_signals'] = list(dict.fromkeys(list(oe.get('rejected_entity_bound_signals') or []) + ['image generation']))
          oe['binding_note'] = 'OpenELM properties are bound to the language-model family; adjacent image-generation language is rejected.'
          audit['artifact_count'] = len(audit['artifacts'])
          audit['accepted_entity_bound_signal_count'] = sum(len(r.get('accepted_entity_bound_signals') or []) for r in audit['artifacts'])
          audit['rejected_entity_bound_signal_count'] = sum(len(r.get('rejected_entity_bound_signals') or []) for r in audit['artifacts'])
          audit['review_issue_refs'] = [191]
          audit['review_scope'] = 'SP-2024-H1 v0.12 regression re-audit across all rendered duplicate placements: OpenELM, DeepSeek family, LongRoPE value role; all prior V3 audit rows retained.'
          write(audit_path, audit)

          # Exact duplicate placements must now carry identical facts.
          for path in (notes20, notes30):
              text = path.read_text(encoding='utf-8')
              start = text.index('\\begin{technicalnote}{OpenELM}')
              end = text.index('\\end{technicalnote}', start)
              card = text[start:end]
              assert openelm_fact in card and 'image generation' not in card
          for path in (notes20, notes40):
              text = path.read_text(encoding='utf-8')
              start = text.index('\\begin{technicalnote}{DeepSeek-V2 / DeepSeek-Coder-V2}')
              end = text.index('\\end{technicalnote}', start)
              card = text[start:end]
              assert deepseek_fact in card and 'source links in search answers' not in card
          lrtext = notes40.read_text(encoding='utf-8')
          lrstart = lrtext.index('\\begin{technicalnote}{LongRoPE}')
          lrend = lrtext.index('\\end{technicalnote}', lrstart)
          lrcard = lrtext[lrstart:lrend]
          assert 'readjustment lengthを8K' in lrcard and '8K context' not in lrcard

          marker = {
              'schema_version':'1.0','issue_id':issue,'special_slug':slug,'source_version':version,
              'reason':'Incremental Publication Preview repair after SP-2024-H1 v0.12 Human Review for #153, #54, and #191, including chapter-crossing duplicate-card entity audit.',
              'review_issues':[153,54,191],
              'layout_changes':{
                  'incremental_publication_preview_repairs_v013':True,
                  'chronology_reference_forced_clearpage_removed':True,
                  'many_shot_jailbreaking_reader_taxonomy':'安全性研究',
                  'subject_component_variant_property_value_role_repair':True,
                  'duplicate_rendered_card_fact_unification':True,
                  'technical_note_entity_binding':'SUBJECT_COMPONENT_VARIANT_PROPERTY_BINDING_V3',
                  'entity_binding_preflight_required':True,
              },
              'constraints':{
                  'new_external_evidence_allowed':False,'selected_evidence_only':True,
                  'accepted_article_claims_changed':False,'evidence_cards_mutated':False,
                  'half_year_analysis_changed':False,'chronology_event_content_changed':False,
                  'bibliography_data_changed':False,
              },
          }
          write(marker_path, marker)

          manifest = copy.deepcopy(load(parent_manifest_path))
          manifest['source_version'] = version
          manifest['status'] = 'VALIDATED_HALF_YEAR_REVIEW_REPAIR_V3_REVISION'
          manifest['derivation'] = ('Incremental Publication Preview repair over v0.12 for #153/#54/#191. Selected Evidence, accepted Article Drafts, Half-year analysis, chronology event content, and bibliography remain immutable; only chronology/References pagination, reader taxonomy, and subject/property/value-role Technical Notes plus V3 audit are changed.')
          basis = dict(manifest.get('basis') or {})
          basis['previous_source_manifest_path'] = parent_manifest_path.relative_to(root).as_posix()
          basis['previous_source_manifest_sha256'] = sha(parent_manifest_path)
          manifest['basis'] = basis

          def repin(obj, pkey, skey):
              rel = str(obj.get(pkey) or '')
              if rel and (out/rel).is_file(): obj[skey] = sha(out/rel)
          repin(manifest['main_tex'],'path','sha256'); repin(manifest['frontmatter'],'path','sha256'); repin(manifest['references'],'path','sha256')
          if isinstance(manifest.get('half_year_analysis'),dict): repin(manifest['half_year_analysis'],'path','sha256')
          for a in manifest.get('articles') or []:
              for pkey,skey in (('article_section_path','article_section_sha256'),('technical_notes_path','technical_notes_sha256'),('layout_standfirst_path','layout_standfirst_sha256'),('layout_body_path','layout_body_sha256'),('layout_wide_path','layout_wide_sha256')):
                  repin(a,pkey,skey)

          reader = dict(manifest.get('reader_facing_technical_notes') or {})
          reader['source_specific_detail_contract'] = 'SCREENING_BACKED_FAIL_CLOSED'
          reader['entity_binding_contract'] = 'SUBJECT_COMPONENT_VARIANT_PROPERTY_BINDING_V3'
          reader['entity_binding_audit_path'] = 'technical-note-entity-binding-audit.json'
          reader['entity_binding_audit_sha256'] = sha(audit_path)
          reader['entity_binding_audited_artifact_count'] = audit['artifact_count']
          reader['entity_binding_accepted_signal_count'] = audit['accepted_entity_bound_signal_count']
          reader['entity_binding_rejected_signal_count'] = audit['rejected_entity_bound_signal_count']
          manifest['reader_facing_technical_notes'] = reader

          lrmeta = dict(manifest.get('layout_revision') or {})
          lrmeta.update({
              'from_source_version':parent_version,
              'issue_refs':sorted(set([int(x) for x in (lrmeta.get('issue_refs') or [])]+[153,54,191])),
              'incremental_issue_refs':[153,54,191],
              'incremental_publication_preview_repairs_v013':True,
              'reader_content_changed':True,
              'reader_content_change_scope':'chronology/reference pagination + reader taxonomy + subject/property/value-role corrections only',
              'new_external_evidence':False,'accepted_article_sections_changed':False,'evidence_cards_changed':False,
              'technical_notes_content_changed':True,'technical_notes_files_changed_in_v013':4,'main_tex_changed_in_v013':True,
              'chronology_event_content_changed_in_v013':False,'bibliography_data_changed_in_v013':False,'half_year_analysis_changed_in_v013':False,
              'chronology_reference_forced_clearpage_removed':True,'many_shot_jailbreaking_reader_taxonomy':'安全性研究',
              'technical_note_entity_binding':'SUBJECT_COMPONENT_VARIANT_PROPERTY_BINDING_V3','entity_binding_reaudit_issue_ref':191,
              'duplicate_rendered_card_fact_unification':True,
          })
          manifest['layout_revision'] = lrmeta

          final_changed = initial_expected | {'technical-notes/20-open-ecosystem-notes.tex','technical-note-entity-binding-audit.json'}
          changed = [{'path':rel,'before_sha256':sha(parent_dir/rel),'after_sha256':sha(out/rel)} for rel in sorted(final_changed)]
          manifest['incremental_review_repairs'] = {
              'from_source_version':parent_version,'issue_refs':[153,54,191],'changed_files':changed,
              'new_external_evidence':False,'accepted_article_sections_changed':False,'evidence_cards_changed':False,
              'half_year_analysis_changed':False,'chronology_event_content_changed':False,'bibliography_data_changed':False,
          }
          new_manifest_path = out/'source-manifest.json'; write(new_manifest_path,manifest)
          manifest_sha, marker_sha = sha(new_manifest_path), sha(marker_path)

          history = state.setdefault('provenance_history',{})
          hs = history.setdefault('validated_issue_source',[])
          if not any(x.get('path')==current.get('path') and x.get('sha256')==current.get('sha256') for x in hs): hs.append(current)
          prior_build = copy.deepcopy(state['provenance'].get('latex_build') or {})
          if prior_build:
              hb = history.setdefault('latex_build',[])
              if not any(x.get('workflow_run_id')==prior_build.get('workflow_run_id') for x in hb): hb.append(prior_build)
          state['lifecycle_state']='VALIDATED_DRAFT'; state['gates']['latex_build']='pending'; state['gates']['visual_review']='pending'; state['gates']['freeze']='pending'
          state['provenance']['validated_issue_source']={'path':new_manifest_path.relative_to(root).as_posix(),'sha256':manifest_sha,'source_version':version,'layout_mode':str((manifest.get('layout') or {}).get('body_mode') or current.get('layout_mode') or 'mixed'),'layout_revision_sha256':marker_sha}
          state['provenance'].pop('latex_build',None)
          state['provenance']['reader_layout_revision']={'source_version':version,'layout_revision_path':marker_path.relative_to(root).as_posix(),'layout_revision_sha256':marker_sha,'reason':marker['reason']}
          state['provenance']['publication_preview_repair_revision']={'source_version':version,'layout_revision_path':marker_path.relative_to(root).as_posix(),'layout_revision_sha256':marker_sha,'issue_refs':[153,54,191],'entity_binding_contract':'SUBJECT_COMPONENT_VARIANT_PROPERTY_BINDING_V3','previous_preview_pdf_sha256':prior_build.get('pdf_sha256'),'previous_preview_workflow_run_id':prior_build.get('workflow_run_id')}
          write(state_path,state)
          print(json.dumps({'source_manifest_sha256':manifest_sha,'layout_revision_sha256':marker_sha,'entity_audit_sha256':sha(audit_path),'changed_files':changed},ensure_ascii=False,indent=2))
          PY

      - name: Run current main Publication Preview preflight
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=control-src python control-src/scripts/special_reader_notes_ja.py check --repo-root worktree --issue-id SP-2024-H1
          PYTHONPATH=control-src python control-src/scripts/special_period_consistency.py check --repo-root worktree --special-slug 2024-H1 --issue-id SP-2024-H1
          PYTHONPATH=control-src python control-src/scripts/special_technical_note_entity_binding_check.py --repo-root worktree --issue-id SP-2024-H1
          PYTHONPATH=control-src python control-src/scripts/special_publication_layout_check.py --repo-root worktree --issue-id SP-2024-H1

      - name: Persist normalized v0.13
        shell: bash
        working-directory: worktree
        run: |
          set -euo pipefail
          rm -f .github/workflows/finalize-sp-2024-h1-v013.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/finalize-sp-2024-h1-v013.yml sources/SP-2024-H1/pipeline-state.json sources/SP-2024-H1/editorial/layout-revision-v0.13.json surveys/special/2024-H1/revisions/v0.13
          git commit -m 'Finalize SP-2024-H1 v0.13 review repairs'
          git push origin HEAD:special/2024-H1-work

      - name: Retire one-shot workflows from main
        shell: bash
        working-directory: control-src
        run: |
          set -euo pipefail
          rm -f .github/workflows/finalize-sp-2024-h1-v013.yml .github/workflows/finalize-sp-2024-h1-v013-retry.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/finalize-sp-2024-h1-v013.yml .github/workflows/finalize-sp-2024-h1-v013-retry.yml
          git commit -m 'Retire SP-2024-H1 v0.13 finalizers'
          git push origin HEAD:main
