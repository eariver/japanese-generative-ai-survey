name: Screening contract CI

on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/build_screening_index.py'
      - 'scripts/validate_screening_result.py'
      - 'scripts/merge_screening_results.py'
      - 'tests/test_build_screening_index.py'
      - 'tests/test_validate_screening_result.py'
      - 'tests/test_merge_screening_results.py'
      - 'schemas/screening-*.schema.json'
      - 'config/prompts/screening/**'
      - '.github/workflows/screening-contract.yml'
  pull_request:
    paths:
      - 'scripts/build_screening_index.py'
      - 'scripts/validate_screening_result.py'
      - 'scripts/merge_screening_results.py'
      - 'tests/test_build_screening_index.py'
      - 'tests/test_validate_screening_result.py'
      - 'tests/test_merge_screening_results.py'
      - 'schemas/screening-*.schema.json'
      - 'config/prompts/screening/**'
      - '.github/workflows/screening-contract.yml'

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Validate all screening schemas
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r schema; do
            echo "Validating ${schema}"
            python -m json.tool "$schema" >/dev/null
          done < <(find schemas -maxdepth 1 -name 'screening-*.schema.json' -type f | sort)

      - name: Run screening contract tests
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest \
            tests.test_build_screening_index \
            tests.test_validate_screening_result \
            tests.test_merge_screening_results \
            -v
