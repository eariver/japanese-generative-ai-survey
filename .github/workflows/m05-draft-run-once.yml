      - name: Verify accepted Draft state
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,pathlib
          root=pathlib.Path('worktree/sources/SP-2026-M05')
          state=json.load(open(root/'pipeline-state.json',encoding='utf-8'))
          assert state['lifecycle_state']=='DRAFT_COMPLETE'
          assert state['gates']['article_draft']=='passed'
          run=pathlib.Path('worktree')/state['provenance']['article_draft']['result_set_path']
          acc=json.load(open(run/'acceptance.json',encoding='utf-8'))
          assert acc['article_draft_count']==6 and len(acc['results'])==6
          for r in acc['results']:
              val=json.load(open(run/r['validation_path'],encoding='utf-8'))
              assert val['passed'] is True, (r['package_id'],val['errors'])
          print(state['provenance']['article_draft']['result_set_sha256'])
          PY
