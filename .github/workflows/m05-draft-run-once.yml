name: Run SP-2026-M05 drafting once

on:
  pull_request:
    types: [synchronize]

permissions:
  contents: write

concurrency:
  group: special-drafting-2026-M05-run-once
  cancel-in-progress: false

jobs:
  drafting:
    if: github.event.pull_request.number == 53 && github.event.pull_request.head.ref == 'special/2026-M05-work'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout current control code
        uses: actions/checkout@v6
        with:
          ref: main
          path: control-src
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Checkout May work branch
        uses: actions/checkout@v6
        with:
          ref: special/2026-M05-work
          path: worktree
          fetch-depth: 0
      - name: Verify drafting boundary
        shell: bash
        run: |
          set -euo pipefail
          python control-src/scripts/raw_provenance.py --repo-root worktree --issue-id SP-2026-M05 check
          python - <<'PY'
          import json, pathlib
          root=pathlib.Path('worktree/sources/SP-2026-M05')
          state=json.load(open(root/'pipeline-state.json',encoding='utf-8'))
          assert state['lifecycle_state']=='ARCHITECTURE_ESTABLISHED', state['lifecycle_state']
          assert state['gates']['candidate_selection']=='passed'
          assert state['gates']['issue_architecture']=='passed'
          assert state['gates']['article_draft']=='pending'
          m=json.load(open(root/'drafting/packages/v0.1/draft-package-manifest.json',encoding='utf-8'))
          assert m['passed'] is True and m['article_drafting_count']==6
          PY
      - name: Compose evidence-linked May article bodies
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, pathlib, re
          root=pathlib.Path('worktree')
          issue='SP-2026-M05'
          pkgdir=root/'sources'/issue/'drafting/packages/v0.1'
          out=root/'sources'/issue/'drafting/interactive-overrides-v0.1'
          out.mkdir(parents=True,exist_ok=True)

          meta={
            'frontier-models-may':{
              'headline':'Frontier Models & Voice — 5月、モデル更新は「使い方」の更新へ広がった',
              'deck':'GPT-5.5 Instant、Claude Opus 4.8、Gemini API、DeepMindの研究系更新、そしてRealtime voice。2026年5月は、モデル名の世代交代だけでなく、API lifecycle、agent利用、音声対話という提供面が同時に動いた。',
              'intro':'5月のfrontier model競争を一列のbenchmark表へ縮めると、今月の変化を見落とす。実際に一次資料へ並んだのは、ChatGPTのdefault model更新、AnthropicのOpus級モデル更新、Gemini APIのGAとManaged Agents、DeepMindの複数研究・モデル発信、そしてvoice APIの更新だった。利用者にとって重要なのは、能力の大小だけでなく「どのsurfaceから、どのmodalで、どの更新速度で使えるか」である。',
              'synthesis':'5月のfrontier領域では、モデル本体と利用surfaceを切り分けて評価する必要がさらに強まった。closed/API提供ではlifecycle変更が設計条件になり、voiceではモデル能力と低遅延配信の両方が体験を決める。したがって本稿では各社の性能表現を横断ランキングへ変換せず、公開形態・利用経路・更新単位の差を中心に読む。'
            },
            'agents-runtime-may':{
              'headline':'Agents & Runtime — 「賢いAgent」より先に、どこで何を許すか',
              'deck':'Codexのsandbox、Windows上の隔離、Kimi Code CLI、MistralのMCP／workflow更新。5月はagentを単発のtool callではなく、権限・network・state・長時間taskを抱える実行環境として設計する動きが前面に出た。',
              'intro':'Agentが長く動くほど、モデルの推論能力だけではシステムを説明できなくなる。file systemへ何を見せるか、networkをどこまで許可するか、どの操作でapprovalを要求するか、CLIやMCPを通じて何を接続するか。5月の一次資料は、こうしたruntime側の条件がagent capabilityと同じくらい重要になっていることを示している。',
              'synthesis':'共通項は「agentを実行主体として扱う」ことにある。sandboxやapprovalは能力を下げるための付属物ではなく、長時間taskを現実の開発環境へ接続するためのcontrol planeである。一方、ReAct型workloadの特性に関する研究結果は著者報告であり、特定benchmarkやmodel構成を超えた一般則としては扱わない。'
            },
            'inference-serving-may':{
              'headline':'Inference & Serving — 5月、最適化はcache・MoE・kernel・runtimeをまたいだ',
              'deck':'vLLM、SGLang、FlashInferのreleaseが続く一方、研究側ではKV cache再利用やMoE expert reuseが掘り下げられた。モデルの外側にあるserving stackは、単一kernelではなく複数layerの協調問題になっている。',
              'intro':'同じモデルでも、どのruntime・attention backend・cache方針・parallelism・kernelで動かすかによって実運用の制約は大きく変わる。5月はvLLM、SGLang、FlashInferがそれぞれ継続的に更新され、研究側でもlong-context KV reuseやmemory-constrained MoE inferenceが別の角度から扱われた。',
              'synthesis':'ここで重要なのは、個々のproject benchmarkを一つの勝敗表へ混ぜないことだ。release noteは実装変更の一次資料だが性能値はproject条件に依存し、論文のspeedupも著者が選んだmodel・hardware・workload・baselineに依存する。5月の意味は、最適化対象がcacheからexpert、kernel、runtimeまでstack全体へ広がった点にある。'
            },
            'agent-safety-security-may':{
              'headline':'Agent Safety & Security — 攻撃はpromptから記憶とworkspaceへ伸びる',
              'deck':'persistent control、agent memory poisoning、retrieval経由のalignment低下、adaptive detector allocation。5月の研究は、長時間agentでは「一度の危険なprompt」だけを守ればよいわけではないことを示した。',
              'intro':'tool-using agentの安全性をprompt injectionだけで語ると、長時間化によって増える状態を取りこぼす。workspaceへ残るcontrol-like content、会話から選択的に書き込まれるlong-term memory、retrieval結果、detectorをどこへ配分するかというruntime判断は、それぞれ異なるattack surfaceである。',
              'synthesis':'これらの研究をまとめて「agentは危険」と一般化するのは不正確だ。ClawTrojan、MemPoison、retrieval degradation、SCOUTは攻撃者能力・対象component・評価環境が異なる。共通して見えるのは、長時間agentでは権限だけでなくprovenance、state更新、retrieval、monitoring policyまでcontrol boundaryとして扱う必要がある、という設計上の問いである。'
            },
            'capability-evaluation-may':{
              'headline':'Capability & Evaluation — benchmarkの外で起きた成果をどう読むか',
              'deck':'OpenAIは5月、モデルが離散幾何の長年の予想を反証したと報告した。同じ月には第三者評価のplaybookも公開された。単一の印象的成果を一般能力へ拡張せず、何をもって能力の証拠とするかを考える。',
              'intro':'standard benchmarkは比較可能性を与える一方、実際の研究課題で現れる能力をすべて覆うわけではない。5月20日にOpenAIが公表した離散幾何の事例は、その意味で強いattentionを集めるタイプの成果である。しかし、一次資料はOpenAI自身の説明であり、そこから「数学全般で人間を超えた」といった広い結論を導くことはできない。',
              'synthesis':'重要なのは成果の派手さより、評価のchain of custodyである。誰が課題を設定し、model outputをどう検証し、第三者がどこまで再評価できるか。5月末のthird-party evaluation playbookは、capabilityだけでなくsafeguardやevaluation validityを評価対象に含める方向を示す。個別の成功例と一般的な能力評価を分離することが、frontier modelを読むうえでますます重要になっている。'
            },
            'paper-watch-may':{
              'headline':'Paper Watch — Agentを測る、測定器を疑う、modalの壁を外す',
              'deck':'AgenticVBench、production inference benchmarkのmeasurement bias、Representation Forcing。5月の論文から、agent評価、serving測定、unified multimodalという三つの研究方向を短く追う。',
              'intro':'Paper Watchでは、今月の主軸記事と重なるが独立した論点を持つ3本を取り上げる。いずれも原論文は一次資料だが、ここで紹介する性能・比較・有効性は著者報告であり、独立再現済みの結論ではない。',
              'synthesis':'3本に共通するのは、モデルそのものだけでなく「どう測るか」「どこで表現を分けるか」がsystem capabilityを左右する点である。agent taskの現実性、benchmark clientの測定bias、multimodal representationのbottleneckはいずれも、数字だけでは見えにくい設計条件を前景化している。'
            }
          }

          paragraphs={
            'GPT-5.5 Instant: smarter, clearer, and more personalized':'OpenAIは5月5日、ChatGPTのdefault modelに関するGPT-5.5 Instant更新を公表した。一次資料で確認できるのは更新の存在と日付であり、回答品質、hallucination低減、personalization改善といった効果はOpenAI自身の説明として読む必要がある。重要なのは、frontier modelの更新が新しいmodel IDの追加だけでなく、日常的に使われるdefault experienceの更新として現れた点だ。',
            'Anthropic May 2026 technical releases':'Anthropicのnewsroom snapshotでは5月28日にClaude Opus 4.8が記録され、coding、agentic task、professional work、long-running work向けのOpus級upgradeとして説明されている。ここでもcapability評価はAnthropicによる主張であり、本稿ではrelease chronologyと利用領域の広がりを事実層から分けて扱う。',
            'Gemini API May 2026 lifecycle':'Gemini APIの5月は、5日のmultimodal File Search、7日のGemini 3.1 Flash-Lite GA、19日のGemini 3.5 Flash GAとManaged Agents public preview、28日のnative visual model GAなど、modelとAPI機能のlifecycleが複数回動いた。API利用者にとっては「新モデルが出た」ことと同じくらい、GA／preview／feature追加の状態遷移が設計条件になる。',
            'Google DeepMind May 2026 releases':'Google DeepMindの5月snapshotにはGemini 3.5、Gemini Omni、Gemini for Science、Co-Scientistが並ぶ。ただしこのEvidenceは月単位のchronologyであり、日付を補完してはいけない。個々の性能優位を断定するより、frontier modelとAI-for-scienceが同じ月の研究面で並行して更新されたことを確認する材料として使う。',
            'Advancing voice intelligence with new models in the API':'OpenAIは5月7日、API向けの新しいrealtime voice modelを公表し、speech reasoning、translation、transcriptionなどの用途を説明した。音声AIではmodel qualityだけでなくturn-takingやlatencyがUXを直接左右するため、voice modelの更新はserving architectureと切り離して評価しにくい。',
            'Alibaba Model Studio May 2026 model lifecycle':'Alibaba Model StudioのMay lifecycleは、中国系model ecosystemでもmodel catalogが継続的に更新されることを示す補助線になる。本稿では個別benchmarkの比較には使わず、regionやmodel familyを含むmanaged model surfaceが動いていたというchronology contextに限定して用いる。',
            'How OpenAI delivers low-latency voice AI at scale':'OpenAIのlow-latency voice infrastructureに関する説明は、realtime voiceを単なるmodel releaseではなくserving problemとして読む材料になる。低遅延化の仕組みや効果はfirst-partyの説明であり、独立したperformance保証ではないが、voice UXがmodelとinfrastructureの共同設計であることは明確だ。',
            'Running Codex safely at OpenAI':'OpenAIは5月8日、内部でCodexを運用する際のsandbox、approval、network policy、agent-native telemetryを説明した。これは「agentに何ができるか」より「実行時に何を許し、何を観測し、どこで人間承認を入れるか」を中心にした資料であり、agent運用がcontrol-plane設計へ移ったことを示す。',
            'Building a safe, effective sandbox to enable Codex on Windows':'5月13日のWindows向けCodex sandboxでは、file accessとnetwork accessを制御する設計が説明された。OSが変われば利用できるisolation primitiveも変わるため、agent sandboxは抽象的な安全機能ではなく、host platform固有のengineering問題でもある。',
            'Kimi Code CLI May 2026 lifecycle':'Kimi Code CLIは5月中にproduct releaseと複数updateを重ねた。日単位で確定できる更新と月精度に留まる項目が混在するため、本稿では無理に一つのrelease dayへ束ねず、coding agentがCLI surfaceで継続更新されていたMay lifecycleとして扱う。',
            'Mistral May 2026 technical releases':'MistralのMay snapshotでは、22日のMCP-enabled Studio toolingとWorkflows public preview、23日のremote agents、28日のVibe long-horizon Work/Code modesなどが並ぶ。agent featureがchat UIの追加機能ではなく、workflow、remote execution、MCP接続へ広がる方向が見える。',
            'Agentic AI Workload Characteristics':'この論文はReAct型agent workloadをend-to-endで観測し、反復するmodel call、tool execution、増大するcontextを一体のworkloadとして特徴づける。結果は著者報告だが、serving側から見てもagent requestが単発inferenceとは異なるstateful workloadになるという論点を補強する。',
            'vllm-project/vllm May 2026 release series':'vLLMは5月4日のv0.20.1、15日のv0.21.0、29日のv0.22.0と更新を重ねた。release notesではDeepSeek V4 hardening、KV/offload、attention backend、Model Runner V2、speculative/disaggregated servingなどが扱われており、serving engineが複数のmodel familyとruntime techniqueを同時に吸収している。',
            'sgl-project/sglang May 2026 release series':'SGLangは5月5日のv0.5.11と16日のv0.5.12で、speculative decoding、disaggregated prefix caching、model support、DeepSeek V4 inference pathなどを更新した。個別のthroughput値ではなく、prefix/cacheとmodel-specific executionが同じrelease seriesで進んでいる点に注目したい。',
            'Release v0.6.12':'FlashInfer v0.6.12は5月29日に公開され、release notesにはNVFP4 quantization、MoE kernel、GQA/MLA path、model/backend supportが並ぶ。kernel layerでもquantization・attention・MoEが密接に結び付いており、frontier model対応が低level runtimeへ波及している。',
            'Adaptive KV Cache Reuse for Fast Long-Context LLM Serving':'CacheTuneは、厳密なprefix一致だけに頼らず、attention関係を保つため必要なcontextを適応的に再計算しながらKV cacheを再利用する設計を提案する。これは著者による研究結果であり、一般的なspeedup保証ではないが、long-context servingで「何を再利用できるか」自体を最適化対象にする方向を示す。',
            'ReMoE: Boosting Expert Reuse through Router Fine-Tuning in Memory-Constrained MoE LLM Inference':'ReMoEはmemory-constrainedなMoE inferenceでexpert reuseを高めるためrouter fine-tuningを利用する。MoE servingでは計算量だけでなくexpert weightのresident／transfer costが問題になるため、model architectureとruntime memory制約の境界を跨ぐ研究として位置付けられる。',
            'From Prompt Injection to Persistent Control: Defending Agentic Harness Against Trojan Backdoors':'ClawTrojanはlocal agentic harnessを対象に、prompt injectionを一度きりの指示改変ではなく、workspaceへ残る情報を介したmulti-step persistent controlとしてモデル化する。著者はDASGuardによるuntrusted control-like contentのtrace／removalも提案し、simulated workspaceで高いASRを報告しているが、その数値は特定環境での著者評価に限定される。',
            'Hijacking Agent Memory: Stealthy Trojan Attacks Through Conversational Interaction':'MemPoisonは会話を通じてselective long-term memory pipelineへtriggerとpayloadを結び付け、後続interactionで悪性挙動を誘発する攻撃を扱う。著者は複数domain・memory mechanismで高いattack successを報告するが、重要なのは数値そのものより、memory writeが新しいtrust boundaryになるという点だ。',
            'Relevance as a Vulnerability: How Web Retrieval Degrades Safety Alignment in LLM Agents':'この研究は、retrievalで「関連性の高い」情報を取り込むことが必ずしもsafety alignmentと一致しないという問題を扱う。retrieverが有用性を最大化するほど、安全性の低いcontextも強く注入され得るという構造は、RAG／web agentでrelevanceとtrustを別軸に設計する必要性を示す。',
            'Send a SCOUT First: Pre-hoc Reasoning for Adaptive Detector Allocation in Prompt-Injection Defense':'SCOUTは、すべてのinputへ同じ防御costを掛けるのではなく、pre-hoc reasoningでriskを見積もってdetector allocationを適応させる方向を提案する。防御性能は著者評価に依存するが、agent securityをstatic filterではなくruntime resource allocationとして考える点が特徴的だ。',
            'An OpenAI model has disproved a central conjecture in discrete geometry':'OpenAIは5月20日、同社modelがunit-distance problemに関する長年の予想を反証したと報告した。公開日と「OpenAIがそう報告した」ことは確認できるが、数学的成果の意味やmodelの寄与範囲はfirst-party説明に依存する。本稿ではこの事例を、benchmark外のreal research taskで現れるcapabilityをどう検証するかという問題設定へつなげる。',
            'A shared playbook for trustworthy third party evaluations':'5月29日、OpenAIはfrontier modelのthird-party evaluationについて、capability、safeguard、evaluation validityを扱うplaybookを公表した。評価者の独立性だけでなく、test conditionやmeasurement validityまで設計対象にする考え方は、印象的な単発成果を一般能力へ拡張しないための補助線になる。',
            'AgenticVBench: Can AI Agents Complete Real-World Post-Production Tasks?':'AgenticVBenchはtext、image、audio、video、planning、tool useを組み合わせるreal-world post-production workflowを100 taskで評価するbenchmarkを提案する。著者報告では最良stackも約30%をわずかに超える程度で、現実的なmultimodal workflowが依然難しいことを示すが、model ranking自体は評価構成に依存する。',
            'Identifying and Mitigating Systemic Measurement Bias in Production LLM Inference Benchmarks':'この論文はproduction LLM inference benchmarkのclient-side measurementにsystemic biasが入り得ると指摘し、Python GILがTTFT／TPOT観測へ与える影響をqueueing analysisで扱う。serving性能を比較するとき、serverだけでなくmeasurement tool自身を検証対象にする必要があるという方法論的警告である。',
            'Representation Forcing for Bottleneck-Free Unified Multimodal Models':'Representation Forcingはunified multimodal modelでmodal間のrepresentation bottleneckを減らす設計を提案する。ここでは著者の性能比較を独立事実とは扱わず、text・visionなどを一つのmodelへ統合する際にintermediate representation設計が重要な研究対象になっていることを紹介する。'
          }

          def ref(task,kind='CLAIM',eid='claim-reviewed-1'):
              return {'evidence_task_id':task,'kind':kind,'evidence_id':eid}
          def slug(s):
              return re.sub(r'[^a-z0-9]+','-',s.lower()).strip('-')[:45]

          manifest=json.load(open(pkgdir/'draft-package-manifest.json',encoding='utf-8'))
          entries=[x for x in manifest['package_files'] if x['execution_stage']=='ARTICLE_DRAFTING']
          for entry in entries:
              pid=entry['package_id']; pkg=json.load(open(pkgdir/entry['path'],encoding='utf-8')); m=meta[pid]
              ev=pkg['primary_evidence']+pkg['supporting_evidence']
              claimrefs=[ref(x['evidence_task_id']) for x in ev]
              blocks=[]
              blocks.append({'block_id':'opening-heading','block_type':'HEADING','text':'5月の変化を一つのsystemとして読む','attribution_mode':'NONE','evidence_refs':[]})
              blocks.append({'block_id':'opening','block_type':'PARAGRAPH','text':m['intro'],'attribution_mode':'INFERENCE','evidence_refs':claimrefs})
              material_ids=['opening']
              for i,x in enumerate(ev,1):
                  card=x['card']; name=card['artifact']['canonical_name']; task=x['evidence_task_id']
                  bid=f'item-{i:02d}'
                  blocks.append({'block_id':f'{bid}-heading','block_type':'HEADING','text':name,'attribution_mode':'NONE','evidence_refs':[]})
                  text=paragraphs.get(name)
                  if not text:
                      c=next((c for c in card['claims'] if c['claim_id']=='claim-reviewed-1'),None)
                      text='一次資料では次のように位置付けられている。'+(c['text'] if c else name)+' 本稿ではこの記述をsource owner／authorsの主張として扱い、独立検証済みの性能事実へは拡張しない。'
                  blocks.append({'block_id':bid,'block_type':'PARAGRAPH','text':text,'attribution_mode':'ATTRIBUTED','evidence_refs':[ref(task)]})
                  material_ids.append(bid)
              blocks.append({'block_id':'theme-synthesis-heading','block_type':'HEADING','text':'Theme Synthesis','attribution_mode':'NONE','evidence_refs':[]})
              blocks.append({'block_id':'theme-synthesis','block_type':'PARAGRAPH','text':m['synthesis'],'attribution_mode':'INFERENCE','evidence_refs':claimrefs})
              material_ids.append('theme-synthesis')
              boundary_blocks=[]
              for j,boundary in enumerate(pkg['package']['boundaries'],1):
                  bid=f'claim-boundary-{j}'
                  limrefs=[]
                  for x in ev:
                      card=x['card']
                      if card.get('limitations'):
                          limrefs.append(ref(x['evidence_task_id'],'LIMITATION',card['limitations'][0]['limitation_id']))
                  if 'repository release notes' in boundary.lower():
                      btext='Claim Boundary: GitHub release notesはrelease chronologyと記載された実装変更を確認する一次資料だが、projectが示すperformanceやcross-hardwareな一般化は本稿で独立再現していない。'
                  elif 'arxiv' in boundary.lower():
                      btext='Claim Boundary: 原論文は研究内容を確認する一次資料だが、benchmark結果・speedup・attack success・quality比較は著者報告であり、本稿で独立再現した結果ではない。'
                  elif 'index' in boundary.lower():
                      btext='Claim Boundary: first-party indexは掲載されたchronologyを確認する資料だが、capabilityやbenchmark表現はvendor claimである。また月精度の日付は日単位へ補完しない。'
                  else:
                      btext='Claim Boundary: first-party sourceは公開日とsource ownerが説明したscopeを確認する一次資料だが、capability・benchmark・safety・performanceの優位性まで独立検証したものではない。'
                  blocks.append({'block_id':bid,'block_type':'CLAIM_BOUNDARY','text':btext,'attribution_mode':'INFERENCE','evidence_refs':limrefs})
                  boundary_blocks.append(bid)
              body={
                'schema_version':'1.0','issue_id':issue,'package_id':pid,'draft_version':'v0.1','status':'DRAFT',
                'headline':m['headline'],'deck':m['deck'],'deck_attribution_mode':'MIXED','deck_evidence_refs':claimrefs,
                'blocks':blocks,
                'must_cover_coverage':[{'requirement':r,'block_ids':['opening','theme-synthesis']} for r in pkg['package']['must_cover']],
                'boundary_coverage':[{'requirement':r,'block_ids':[boundary_blocks[i]]} for i,r in enumerate(pkg['package']['boundaries'])],
                'late_breaking_acknowledged':False
              }
              (out/f'{pid}.json').write_text(json.dumps(body,ensure_ascii=False,separators=(',',':'))+'\n',encoding='utf-8')
          print('wrote',len(entries),'draft bodies')
          PY
      - name: Accept and render all six drafts
        shell: bash
        run: |
          set -euo pipefail
          generated_at=$(python - <<'PY'
          from datetime import datetime
          from zoneinfo import ZoneInfo
          print(datetime.now(ZoneInfo('Asia/Tokyo')).isoformat(timespec='seconds'))
          PY
          )
