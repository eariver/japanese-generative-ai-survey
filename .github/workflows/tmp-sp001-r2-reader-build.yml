name: Temporary SP001 r2 reader PDF build

on:
  push:
    branches:
      - tmp/sp001-r2-reader-build
    paths:
      - .github/workflows/tmp-sp001-r2-reader-build.yml

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact scratch revision
        uses: actions/checkout@v6
        with:
          ref: tmp/sp001-r2-reader-build
          fetch-depth: 0

      - name: Set reproducible PDF timestamp
        shell: bash
        run: echo "SOURCE_DATE_EPOCH=$(git show -s --format=%ct HEAD)" >> "$GITHUB_ENV"

      - name: Compile SP001 with LuaLaTeX
        uses: xu-cheng/latex-action@v4
        with:
          root_file: main.tex
          working_directory: surveys/special/SP001
          texlive_version: 2026
          latexmk_use_lualatex: true

      - name: Validate log and inspect PDF
        shell: bash
        run: |
          set -euo pipefail
          pdf="surveys/special/SP001/main.pdf"
          log="surveys/special/SP001/main.log"
          test -s "$pdf" && test -s "$log"
          blocking=$(grep -E -n 'LaTeX Warning: (There were undefined references|Citation .* undefined)|Package biblatex Warning: Please (re)?run|Missing character:' "$log" || true)
          if [ -n "$blocking" ]; then
            printf '%s\n' "$blocking"
            exit 1
          fi
          pages=$(python - "$log" <<'PY'
          import re,sys
          text=open(sys.argv[1],encoding='utf-8',errors='replace').read()
          matches=re.findall(r'Output written on .*?\((\d+) pages?',text,re.S)
          if not matches:
              raise SystemExit('could not determine PDF page count')
          print(matches[-1])
          PY
          )
          sha=$(sha256sum "$pdf" | awk '{print $1}')
          bytes=$(stat -c '%s' "$pdf")
          mkdir -p /tmp/sp001-r2-build
          cp "$pdf" /tmp/sp001-r2-build/SP001-r2.pdf
          cp "$log" /tmp/sp001-r2-build/main.log
          printf '{"page_count":%s,"sha256":"%s","byte_count":%s}\n' "$pages" "$sha" "$bytes" > /tmp/sp001-r2-build/metadata.json
          cat /tmp/sp001-r2-build/metadata.json

      - name: Upload exact build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: sp001-r2-reader-build
          path: /tmp/sp001-r2-build
          if-no-files-found: error
          retention-days: 14

      - name: Commit exact generated PDF to scratch branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f surveys/special/SP001/main.pdf
          git commit -m 'Materialize SP001 Publication r2 reader PDF'
          git push origin HEAD:tmp/sp001-r2-reader-build
