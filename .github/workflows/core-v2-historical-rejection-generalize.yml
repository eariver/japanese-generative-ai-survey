name: Core v2 historical rejection generality self patch

on:
  push:
    branches:
      - fix/core-v2-historical-publication-rejection
    paths:
      - '.github/workflows/core-v2-historical-rejection-generalize.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/core-v2-historical-publication-rejection
          fetch-depth: 0
      - name: Apply exact generality patch
        run: python tools/tmp_historical_publication_rejection_generalize.py
      - name: Commit final Core tree
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/core-v2-historical-rejection-generalize.yml tools/tmp_historical_publication_rejection_generalize.py
          git add scripts/survey_human_gate_v2.py tests/test_survey_human_gate_v2.py docs/checkpoints/core-v2-historical-publication-rejection-worklog.md
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Generalize historical Publication Preview rejection'
          git push origin HEAD:fix/core-v2-historical-publication-rejection
