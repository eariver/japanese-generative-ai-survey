name: Survey Production Core v2 interactive semantic quality finalization

on:
  pull_request:
    branches:
      - 'weekly/*-v2-work'
      - 'special/*-v2-work'
    paths:
      - 'sources/**/orchestration/v2/interactive-semantic-quality.json'

permissions:
  contents: write

concurrency:
  group: survey-production-v2-semantic-quality-${{ github.base_ref }}
  cancel-in-progress: false

jobs:
  quality:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Checkout semantic quality branch
        uses: actions/checkout@v6
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Core v2 validation dependencies
        run: python -m pip install -r config/survey-production-v2-requirements.txt

      - name: Resolve semantic quality request identity
        id: request
        shell: bash
        env:
          TARGET_WORK_BRANCH: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          PYTHONPATH=. python - <<'PY' >> "$GITHUB_OUTPUT"
          import json, os, pathlib, re
          from scripts import survey_agent_control_v2 as agent
          from scripts import survey_production_v2 as core
          root=pathlib.Path('.').resolve()
          requests=sorted(root.glob('sources/*/orchestration/v2/interactive-semantic-quality.json'))
          if len(requests)!=1: raise SystemExit(f'exactly one semantic quality request required, found {len(requests)}')
          request=requests[0]; issue=request.parts[-4]
          if not re.fullmatch(r'[A-Za-z0-9._-]+',issue): raise SystemExit('unsafe issue_id')
          data=json.load(open(request,encoding='utf-8'))
          if data.get('schema_version')!='2.0-rc1' or data.get('issue_id')!=issue or data.get('runner')!='CORE_V2_SEMANTIC_QUALITY':
              raise SystemExit('semantic quality request identity mismatch')
          state_path=root/'sources'/issue/'production-state.json'; state=core.load_json(state_path)
          if state.get('lifecycle_state')!='DRAFT_COMPLETE' or state.get('next_action')!='stage:semantic-publication-validation':
              raise SystemExit('semantic quality finalization requires DRAFT_COMPLETE State')
          cfg=core.load_json(root/core.DEFAULT_CONFIG); errors=agent.validate_agent_state(root,cfg,state)
          if errors: raise SystemExit('; '.join(errors))
          profile=core.load_json(root/state['profile']['path'])
          if profile.get('paths',{}).get('work_branch')!=os.environ['TARGET_WORK_BRANCH']:
              raise SystemExit('PR base does not match work_branch')
          print(f'issue_id={issue}')
          print(f'state={state_path.relative_to(root)}')
          print(f'request={request.relative_to(root)}')
          print(f'source_root={profile["paths"]["source_root"]}')
          PY

      - name: Build and validate exact Quality Regression Bundle
        id: finalize
        shell: bash
        env:
          STATE: ${{ steps.request.outputs.state }}
          REQUEST: ${{ steps.request.outputs.request }}
        run: |
          set -euo pipefail
          PYTHONPATH=. python scripts/survey_semantic_quality_v2.py \
            --repo-root . \
            --state "$STATE" \
            --request "$REQUEST" \
            | tee semantic-quality-v2-output.json
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          data=json.load(open('semantic-quality-v2-output.json',encoding='utf-8'))
          print(f'quality_bundle={data["quality_bundle"]}')
          print(f'quality_bundle_sha256={data["quality_bundle_sha256"]}')
          PY

      - name: Persist exact Quality Regression Bundle to execution branch
        shell: bash
        env:
          SOURCE_ROOT: ${{ steps.request.outputs.source_root }}
          REQUEST: ${{ steps.request.outputs.request }}
          ISSUE_ID: ${{ steps.request.outputs.issue_id }}
          PUSH_BRANCH: ${{ github.head_ref }}
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm -f "$REQUEST"
          git add "$SOURCE_ROOT"
          if git diff --cached --quiet; then echo 'No semantic quality changes to commit.' >&2; exit 1; fi
          git commit -m "Finalize ${ISSUE_ID} Core v2 semantic publication quality"
          git push origin "HEAD:${PUSH_BRANCH}"
