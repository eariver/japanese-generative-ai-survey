# retrigger after Toolformer overlay
name: One-time SP-2023-Y v0.5 Technical Notes repair

on:
  push:
    branches: [special/2023-Y-work]
    paths: ['.github/workflows/sp-2023-y-annual-notes-v05.yml']

permissions:
  contents: write

concurrency:
  group: sp-2023-y-annual-notes-v05
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout current control code
        uses: actions/checkout@v6
        with:
          ref: main
          path: control-src
          fetch-depth: 1
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Checkout SP-2023-Y work branch
        uses: actions/checkout@v6
        with:
          ref: special/2023-Y-work
          path: worktree
          fetch-depth: 0
      - name: Verify #139 recovery boundary
        shell: bash
        run: |
          set -euo pipefail
          python control-src/scripts/raw_provenance.py --repo-root worktree --issue-id SP-2023-Y check
          python - <<'PY'
          import json,pathlib
          root=pathlib.Path('worktree')
          state=json.load(open(root/'sources/SP-2023-Y/pipeline-state.json',encoding='utf-8'))
          assert state['lifecycle_state']=='RELEASE_CANDIDATE'
          assert state['gates']['issue_architecture']=='passed'
          assert state['gates']['article_draft']=='passed'
          assert state['gates']['claim_and_chronology_validation']=='passed'
          assert state['gates']['latex_build']=='passed'
          assert state['gates']['visual_review']=='pending'
          assert state['gates']['freeze']=='pending'
          assert 'publication_preview' not in state.get('provenance',{})
          marker=json.load(open(root/'sources/SP-2023-Y/editorial/layout-revision-v0.5.json',encoding='utf-8'))
          assert marker['layout_changes']['annual_source_specific_notes_v1'] is True
          assert marker['constraints']['new_external_evidence_allowed'] is False
          assert marker['constraints']['selected_evidence_only'] is True
          assert marker['constraints']['accepted_article_claims_changed'] is False
          assert marker['constraints']['evidence_cards_mutated'] is False
          PY
      - name: Build immutable v0.5 Technical Notes revision
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=control-src python control-src/scripts/revise_special_annual_source_specific_notes_v3.py \
            --repo-root worktree \
            --special-slug 2023-Y \
            --issue-id SP-2023-Y \
            --source-version v0.5 \
            > annual-source-specific-notes-audit.json
          cat annual-source-specific-notes-audit.json
      - name: Verify #139 repair output
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib,json,pathlib
          root=pathlib.Path('worktree')
          state=json.load(open(root/'sources/SP-2023-Y/pipeline-state.json',encoding='utf-8'))
          assert state['lifecycle_state']=='VALIDATED_DRAFT'
          assert state['gates']['issue_architecture']=='passed'
          assert state['gates']['article_draft']=='passed'
          assert state['gates']['claim_and_chronology_validation']=='passed'
          assert state['gates']['latex_build']=='pending'
          assert state['gates']['visual_review']=='pending'
          assert state['gates']['freeze']=='pending'
          source=state['provenance']['validated_issue_source']
          assert source['source_version']=='v0.5'
          path=root/source['path']
          assert hashlib.sha256(path.read_bytes()).hexdigest()==source['sha256']
          manifest=json.load(open(path,encoding='utf-8'))
          assert manifest['status']=='VALIDATED_ANNUAL_SOURCE_SPECIFIC_NOTES_REVISION'
          reader=manifest['reader_facing_technical_notes']
          assert reader['source_specific_detail_contract']=='SCREENING_BACKED_FAIL_CLOSED'
          assert reader['generic_fallback_policy']=='forbidden-fail-closed'
          assert reader['generic_fallback_findings']==0
          assert reader['source_specific_detail_visible_card_count']==reader['source_specific_detail_enrichment_count']
          assert reader['source_specific_detail_visible_card_count']==26
          assert reader['subject_entity_binding_contract']=='SUBJECT_COMPONENT_VARIANT_PROPERTY_BINDING_V3'
          assert reader['event_window_contract']=='ZERO_PADDED_DATE_AND_LONG_HTML_FAIL_CLOSED_V1'
          chronology=state['provenance']['annual_chronology']
          assert chronology['source_version']=='v0.5'
          assert chronology['event_count']==75
          assert chronology['unresolved_date_count']==3
          cpath=root/chronology['path']
          assert hashlib.sha256(cpath.read_bytes()).hexdigest()==chronology['sha256']
          assert not (root/'sources/SP-2023-Y/preview-transfer').exists()
          PY
      - name: Commit repaired source and remove one-time workflow
        shell: bash
        run: |
          set -euo pipefail
          cd worktree
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm -f .github/workflows/sp-2023-y-annual-notes-v05.yml
          git add -A surveys/special/2023-Y sources/SP-2023-Y .github/workflows/sp-2023-y-annual-notes-v05.yml
          git diff --cached --quiet && { echo 'No repair changes to commit' >&2; exit 1; }
          git commit -m 'Repair SP-2023-Y Technical Notes for #139 (v0.5)'
          git push origin HEAD:special/2023-Y-work
      - name: Upload repair audit
        uses: actions/upload-artifact@v4
        with:
          name: sp-2023-y-v0.5-technical-notes-audit
          path: annual-source-specific-notes-audit.json
          retention-days: 14
