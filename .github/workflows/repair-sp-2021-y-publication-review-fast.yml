name: Temporary SP-2021-Y fast review repair

on:
  pull_request:
    types: [synchronize]
    branches: [main]
    paths:
      - sources/SP-2021-Y/editorial/publication-review-repair-request.json

permissions:
  contents: write

concurrency:
  group: sp-2021-y-publication-review-fast
  cancel-in-progress: false

jobs:
  repair:
    if: github.event.pull_request.head.ref == 'special/2021-Y-work'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout only current main scripts
        uses: actions/checkout@v6
        with:
          ref: main
          path: control-src
          fetch-depth: 1
          sparse-checkout: |
            scripts
          sparse-checkout-cone-mode: true

      - name: Checkout SP-2021-Y work branch
        uses: actions/checkout@v6
        with:
          ref: special/2021-Y-work
          path: worktree
          fetch-depth: 0

      - name: Check one-shot request
        id: request
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,os,pathlib
          p=pathlib.Path('worktree/sources/SP-2021-Y/editorial/publication-review-repair-request.json')
          active=False
          if p.is_file():
              x=json.load(open(p,encoding='utf-8'))
              active=(x.get('status')=='REQUESTED' and x.get('requested_order')==[139,54,'153/272','78/140','122/55'])
          with open(os.environ['GITHUB_OUTPUT'],'a',encoding='utf-8') as f:
              f.write('active=' + ('true' if active else 'false') + '\n')
          PY

      - name: Set up Python
        if: steps.request.outputs.active == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Verify repair boundary
        if: steps.request.outputs.active == 'true'
        shell: bash
        run: |
          set -euo pipefail
          python control-src/scripts/raw_provenance.py --repo-root worktree --issue-id SP-2021-Y check
          python - <<'PY'
          import json,pathlib
          root=pathlib.Path('worktree')
          state=json.load(open(root/'sources/SP-2021-Y/pipeline-state.json',encoding='utf-8'))
          assert state['lifecycle_state']=='RELEASE_CANDIDATE'
          assert state['provenance']['validated_issue_source']['source_version']=='v0.2'
          assert state['gates']['latex_build']=='passed'
          assert state['gates']['visual_review']=='pending' and state['gates']['freeze']=='pending'
          assert 'publication_preview' not in state.get('provenance',{})
          assert (root/'scripts/revise_sp_2021_y_publication_review.py').is_file()
          PY

      - name: Apply requested repair sequence
        if: steps.request.outputs.active == 'true'
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=control-src python worktree/scripts/revise_sp_2021_y_publication_review.py \
            --repo-root worktree --special-slug 2021-Y --issue-id SP-2021-Y \
            > sp-2021-y-publication-review-repair.json
          cat sp-2021-y-publication-review-repair.json

      - name: Run canonical invariants
        if: steps.request.outputs.active == 'true'
        shell: bash
        run: |
          set -euo pipefail
          python control-src/scripts/raw_provenance.py --repo-root worktree --issue-id SP-2021-Y check
          PYTHONPATH=control-src python control-src/scripts/special_period_consistency.py check \
            --repo-root worktree --special-slug 2021-Y --issue-id SP-2021-Y
          python - <<'PY'
          import json,pathlib
          root=pathlib.Path('worktree')
          state=json.load(open(root/'sources/SP-2021-Y/pipeline-state.json',encoding='utf-8'))
          assert state['lifecycle_state']=='VALIDATED_DRAFT'
          assert state['provenance']['validated_issue_source']['source_version']=='v0.7'
          assert state['gates']['latex_build']=='pending'
          assert state['gates']['visual_review']=='pending' and state['gates']['freeze']=='pending'
          assert 'publication_preview' not in state.get('provenance',{})
          audit=json.load(open(root/'sources/SP-2021-Y/editorial/issues-139-54-153-272-78-140-122-55-v0.7.json',encoding='utf-8'))
          assert audit['requested_order']==[139,54,'153/272','78/140','122/55']
          assert audit['generic_fallback_findings']==0
          assert audit['chronology_placeholder_findings']==0
          assert audit['raw_product_findings']==0
          assert audit['duplicate_chronology_cards_rendered']==0
          assert audit['chronology_reference_mapping_count']==45
          assert audit['generic_reference_title_findings']==0
          assert audit['repeated_reference_boilerplate_findings']==0
          assert audit['toc_depth']=='section'
          assert audit['unprotected_technical_note_tail_findings']==0
          assert audit['new_external_evidence'] is False
          assert audit['accepted_article_claims_changed'] is False
          PY

      - name: Persist repaired immutable revisions
        if: steps.request.outputs.active == 'true'
        working-directory: worktree
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm -f sources/SP-2021-Y/editorial/publication-review-repair-request.json
          git rm -f .github/workflows/repair-sp-2021-y-publication-review.yml scripts/revise_sp_2021_y_publication_review.py || true
          git add sources/SP-2021-Y/pipeline-state.json sources/SP-2021-Y/chronology sources/SP-2021-Y/editorial \
            surveys/special/2021-Y/revisions/v0.3 surveys/special/2021-Y/revisions/v0.4 \
            surveys/special/2021-Y/revisions/v0.5 surveys/special/2021-Y/revisions/v0.6 \
            surveys/special/2021-Y/revisions/v0.7
          git commit -m 'Repair SP-2021-Y Publication Preview findings'
          git push origin HEAD:special/2021-Y-work
