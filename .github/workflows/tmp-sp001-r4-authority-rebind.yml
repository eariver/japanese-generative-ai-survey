name: Temporary SP001 r4 authority rebind

on:
  push:
    branches: [special/SP001-v2-work]
    paths:
      - 'sources/SP001/publication/v2/tmp-r4-authority-rebind-trigger.txt'

permissions:
  contents: write

jobs:
  rebind:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: special/SP001-v2-work
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Core v2 dependencies
        run: python -m pip install -r config/survey-production-v2-requirements.txt

      - name: Rebind exact r4 publication authority
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations
          import json
          import os
          import re
          from copy import deepcopy
          from datetime import datetime, timezone
          from pathlib import Path
          from pypdf import PdfReader

          from scripts import survey_production_v2 as core
          from scripts import survey_reader_publication_v2 as reader
          from scripts import survey_quality_v2 as quality
          from scripts import survey_publication_v2 as publication

          root = Path('.').resolve()
          issue = 'SP001'
          pub = root / 'sources/SP001/publication/v2'
          source = root / 'surveys/special/SP001/main.tex'
          bib = root / 'surveys/special/SP001/references.bib'
          style = root / 'templates/survey/jgaisurvey.sty'
          pdf = root / 'surveys/special/SP001/main.pdf'
          profile = root / 'sources/SP001/production-profile.json'
          architecture = root / 'sources/SP001/architecture-v2.json'
          architecture_approval = root / 'sources/SP001/gates/architecture-approval.json'
          build_audit = pub / 'pdf-build-audit-r4.json'
          boundary_audit = pub / 'publication-boundary-audit-r4.json'
          manuscript_path = pub / 'reader-manuscript-v2.json'
          quality_path = pub / 'quality-regression-bundle-v2.json'
          semantic_path = pub / 'semantic-editorial-review-v2.json'
          visual_path = pub / 'visual-review-v2.json'
          candidate_path = pub / 'publication-candidate-v2.json'

          expected = {
              'source': 'ddb5cf7aea900e13a434db98251084d376e30eec238595941e4e17730e1b9150',
              'bib': 'f10841981afa7d12a75ffea749080e64b3cb403511bce26c92563affc93b1f35',
              'pdf': '7b11545cc1138ecc97771b0debfaf7772971f9e93b9195d28cc30bdc099bf419',
              'pdf_bytes': 322271,
              'pages': 14,
          }
          assert core.sha256_file(source) == expected['source']
          assert core.sha256_file(bib) == expected['bib']
          assert core.sha256_file(pdf) == expected['pdf']
          assert pdf.stat().st_size == expected['pdf_bytes']
          exact_reader = PdfReader(pdf, strict=True)
          assert not exact_reader.is_encrypted
          assert len(exact_reader.pages) == expected['pages']
          build = core.load_json(build_audit)
          boundary = core.load_json(boundary_audit)
          assert build['status'] == 'PASS' and not build['blocking_log_findings']
          assert build['pdf']['sha256'] == expected['pdf'] and build['pdf']['page_count'] == expected['pages']
          assert boundary['status'] == 'PASS' and boundary['matches'] == []

          old_manifest = core.load_json(manuscript_path)
          old_bundle = core.load_json(quality_path)
          old_semantic = core.load_json(semantic_path)
          old_visual = core.load_json(visual_path)
          old_source_sha = old_manifest['primary_source']['sha256']
          old_pdf_sha = old_visual['pdf']['sha256']

          now = datetime.now(timezone.utc)
          now_iso = core.iso_utc(now)

          # Reader Manuscript: preserve approved coverage/reader requirements, rebind exact current files.
          tmp = pub / '.reader-manuscript-r4.tmp.json'
          tmp.unlink(missing_ok=True)
          reader.build_manuscript_manifest(
              root,
              issue,
              profile,
              architecture,
              architecture_approval,
              source,
              [
                  {'role': 'BIBLIOGRAPHY', 'path': bib},
                  {'role': 'STYLE', 'path': style},
              ],
              deepcopy(old_manifest['architecture_coverage']),
              deepcopy(old_manifest['reader_requirements']),
              'OpenAI GPT-5.6 Sol',
              now,
              tmp,
          )
          os.replace(tmp, manuscript_path)
          manifest = reader.validate_manuscript_manifest(root, manuscript_path, issue_id=issue)
          assert manifest['primary_source']['sha256'] == expected['source']

          # Deterministic quality results are freshly recomputed from r4 exact bytes.
          result_dir = pub / 'quality/results'
          source_text = source.read_text(encoding='utf-8')
          bib_text = bib.read_text(encoding='utf-8')
          section_count = len(re.findall(r'(?m)^\\section\{', source_text))
          subsection_count = len(re.findall(r'(?m)^\\subsection\{', source_text))
          assert (section_count, subsection_count) == (6, 38)

          def write_result(name, payload):
              path = result_dir / name
              core.write_json(path, payload)
              return path

          empty_path = write_result('empty-wrapper-suppression.json', {
              'schema_version':'2.0-rc1','issue_id':issue,'check_id':'EMPTY_WRAPPER_SUPPRESSION','status':'PASS',
              'source':{'path':'surveys/special/SP001/main.tex','sha256':expected['source'],'byte_count':source.stat().st_size},
              'section_count':section_count,'subsection_count':subsection_count,'empty_numbered_blocks':[],
              'evidence':'All 6 numbered LONGFORM_SPECIAL sections and 38 numbered subsections remain non-empty in the exact r4 TeX; the r4 change is bounded to reader-facing Publication Boundary wording.'
          })

          old_ids = core.load_json(result_dir / 'identifier-preservation.json')
          required_ids = old_ids['required_identifiers']
          bib_keys = old_ids['bibliography_keys']
          missing_ids = [x for x in required_ids if x not in source_text and x not in bib_text]
          present_keys = set(re.findall(r'@[A-Za-z]+\{([^,]+),', bib_text))
          missing_keys = [x for x in bib_keys if x not in present_keys]
          assert not missing_ids and not missing_keys
          identifier_path = write_result('identifier-preservation.json', {
              'schema_version':'2.0-rc1','issue_id':issue,'check_id':'IDENTIFIER_PRESERVATION','status':'PASS',
              'source':{'path':'surveys/special/SP001/main.tex','sha256':expected['source'],'byte_count':source.stat().st_size},
              'bibliography':{'path':'surveys/special/SP001/references.bib','sha256':expected['bib'],'byte_count':bib.stat().st_size},
              'required_identifiers':required_ids,'bibliography_keys':bib_keys,'missing':[]
          })

          pdf_preflight_path = write_result('pdf-preflight.json', {
              'schema_version':'2.0-rc1','issue_id':issue,'check_id':'PDF_PREFLIGHT','status':'PASS',
              'pdf':{'path':'surveys/special/SP001/main.pdf','sha256':expected['pdf'],'byte_count':expected['pdf_bytes'],'page_count':expected['pages']},
              'build_audit':{'path':'sources/SP001/publication/v2/pdf-build-audit-r4.json','status':'PASS','blocking_findings':0},
              'encrypted':False,
              'evidence':'The exact r4 repository PDF parses as an unencrypted 14-page artifact, binds the r4 build audit, and has zero blocking build findings.'
          })

          old_bind = core.load_json(result_dir / 'subject-entity-property-binding.json')
          bindings = deepcopy(old_bind['bindings'])
          for row in bindings:
              row['missing'] = [token for token in row['required_tokens'] if token not in source_text]
              assert row['missing'] == [], (row['family'], row['missing'])
          binding_path = write_result('subject-entity-property-binding.json', {
              'schema_version':'2.0-rc1','issue_id':issue,'check_id':'SUBJECT_ENTITY_PROPERTY_BINDING','status':'PASS',
              'source':{'path':'surveys/special/SP001/main.tex','sha256':expected['source'],'byte_count':source.stat().st_size},
              'bindings':bindings
          })

          result_paths = {
              'EMPTY_WRAPPER_SUPPRESSION': empty_path,
              'IDENTIFIER_PRESERVATION': identifier_path,
              'PDF_PREFLIGHT': pdf_preflight_path,
              'SUBJECT_ENTITY_PROPERTY_BINDING': binding_path,
          }
          evidence = {
              'EMPTY_WRAPPER_SUPPRESSION':'Exact r4 TeX retains six non-empty numbered sections and 38 non-empty numbered subsections after the bounded Publication Boundary wording repair.',
              'IDENTIFIER_PRESERVATION':'Required issue/model/date identifiers and all eleven primary bibliography keys are preserved in the exact r4 source/bibliography pair.',
              'PDF_PREFLIGHT':'The exact r4 repository PDF is the audited 14-page, 322,271-byte artifact with zero blocking build findings.',
              'SUBJECT_ENTITY_PROPERTY_BINDING':'Family-specific endpoint/property tokens remain bound in the exact DeepSeek, Qwen, GLM and Kimi r4 reader source.',
          }
          checks=[]
          for row in old_bundle['checks']:
              cid=row['check_id']
              checks.append({
                  'check_id':cid,'kind':'DETERMINISTIC','status':'PASS',
                  'executor':'ChatGPT GPT-5.6 Sol / Core v2 r4 authority',
                  'evidence':evidence[cid],'recorded_at':now_iso,
                  'result':{'path':str(result_paths[cid].relative_to(root)).replace('\\','/'),'sha256':core.sha256_file(result_paths[cid])},
              })
          tmp = pub / '.quality-r4.tmp.json'
          tmp.unlink(missing_ok=True)
          quality.build_bundle(root, issue, source, pdf, checks, tmp, production_profile_path=profile)
          os.replace(tmp, quality_path)
          quality.validate_bundle(root, quality_path, issue_id=issue)

          def rewrite_strings(value):
              if isinstance(value, str):
                  return (value
                      .replace(old_source_sha, expected['source'])
                      .replace(old_pdf_sha, expected['pdf'])
                      .replace('322,591', '322,271')
                      .replace('pdf-build-audit-r3.json', 'pdf-build-audit-r4.json')
                      .replace('exact r3', 'exact r4')
                      .replace('Exact r3', 'Exact r4')
                      .replace('the r3 ', 'the r4 ')
                      .replace('The r3 ', 'The r4 ')
                      .replace('r3 reader', 'r4 reader')
                      .replace('r3 source', 'r4 source'))
              if isinstance(value, list):
                  return [rewrite_strings(x) for x in value]
              if isinstance(value, dict):
                  return {k: rewrite_strings(v) for k,v in value.items()}
              return value

          semantic_checks = rewrite_strings(deepcopy(old_semantic['checks']))
          smap={row['check_id']:row for row in semantic_checks}
          smap['POST_TRANSFORM_SEMANTIC_REVALIDATION']['detail'] = (
              'The exact r4 source was re-reviewed after a wording-only Publication Boundary repair. '
              'The mixed layout, family-local LONGFORM depth, chronology, architecture/post-training/serving distinctions, '
              'claim boundaries and independent final synthesis are unchanged in substance; internal editorial/provenance language '
              'identified during pre-Human QA is removed from reader-facing prose and bibliography notes.'
          )
          smap['PUBLICATION_BOUNDARY']['detail'] = (
              'The exact r4 TeX, bibliography and extracted PDF text pass the dedicated Publication Boundary regression scan with zero matches '
              'for raw Evidence IDs, package/selection terminology, source-promotion language, coverage-expansion language and other internal production semantics. '
              'Reader-facing uncertainty remains expressed as source-local technical/license/benchmark boundaries.'
          )
          tmp = pub / '.semantic-r4.tmp.json'
          tmp.unlink(missing_ok=True)
          reader.build_review_record(root, manuscript_path, pdf, 14, 'SEMANTIC_EDITORIAL', semantic_checks,
                                     'OpenAI GPT-5.6 Sol', now, tmp)
          os.replace(tmp, semantic_path)
          reader.validate_review_record(root, semantic_path, issue_id=issue, expected_kind='SEMANTIC_EDITORIAL')

          visual_checks = rewrite_strings(deepcopy(old_visual['checks']))
          vmap={row['check_id']:row for row in visual_checks}
          vmap['EXACT_PDF_VISUAL_REVIEW']['detail'] = (
              'All 14 pages of exact r4 repository PDF SHA-256 '+expected['pdf']+
              ' were visually inspected from the GitHub Actions 130-dpi page renders after the wording-only boundary repair. '
              'No clipping, overlap, broken glyph, unreadable overflow, black block, near-empty internal/final page, orphan bibliography page, '
              'or mixed-layout regression is visible.'
          )
          vmap['LONGFORM_PAGE_BALANCE']['detail'] = (
              'All 14 exact r4 PDF pages were visually reviewed. Cover/frontmatter, balanced two-column technical narrative, wide comparison/synthesis surfaces, '
              'Technical Notes, Reader verification matrix and one-column References retain the accepted page balance with no new pagination hole.'
          )
          vmap['LONGFORM_MIXED_LAYOUT']['detail'] = (
              'The exact r4 LONGFORM_SPECIAL preserves the accepted house mixed layout: balanced two-column ordinary narrative, full-width technical/wide surfaces where required, '
              'and one-column References; the wording-only repair introduced no layout-mode change.'
          )
          tmp = pub / '.visual-r4.tmp.json'
          tmp.unlink(missing_ok=True)
          reader.build_review_record(root, manuscript_path, pdf, 14, 'VISUAL', visual_checks,
                                     'OpenAI GPT-5.6 Sol', now, tmp)
          os.replace(tmp, visual_path)
          reader.validate_review_record(root, visual_path, issue_id=issue, expected_kind='VISUAL')

          tmp = pub / '.candidate-r4.tmp.json'
          tmp.unlink(missing_ok=True)
          publication.build_candidate(root, issue, 'LONGFORM_SPECIAL', manuscript_path, source, pdf, 14,
                                      quality_path, semantic_path, visual_path, tmp)
          os.replace(tmp, candidate_path)
          candidate = publication.validate_candidate(root, candidate_path, issue_id=issue)
          assert candidate['source']['sha256'] == expected['source']
          assert candidate['pdf']['sha256'] == expected['pdf']
          assert candidate['pdf']['page_count'] == 14

          audit = {
              'schema_version':'2.0-rc1','issue_id':issue,'publication_revision':'r4',
              'status':'PASS','recorded_at':now_iso,
              'source':candidate['source'],'pdf':candidate['pdf'],
              'reader_manuscript':candidate['reader_manuscript'],
              'quality_bundle':candidate['quality_bundle'],
              'semantic_review':candidate['semantic_review'],
              'visual_review':candidate['visual_review'],
              'candidate_sha256':candidate['candidate_sha256'],
              'boundary_audit':{'path':str(boundary_audit.relative_to(root)),'sha256':core.sha256_file(boundary_audit),'status':'PASS'},
              'build_audit':{'path':str(build_audit.relative_to(root)),'sha256':core.sha256_file(build_audit),'status':'PASS'},
              'note':'Exact r4 publication authority chain rebuilt and validated. Production-state/stage attestation is intentionally handled by the subsequent Core stage reconciliation step; no Human approval is asserted.'
          }
          core.write_json(pub / 'authority-rebind-audit-r4.json', audit)
          print(json.dumps(audit, ensure_ascii=False, indent=2))
          PY

      - name: Validate focused publication stack
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest tests.test_survey_publication_v2 tests.test_survey_quality_v2 tests.test_survey_reader_fidelity_v2 -v

      - name: Commit r4 authority and remove temporary transport
        shell: bash
        env:
          BRANCH: special/SP001-v2-work
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm -f .github/workflows/tmp-sp001-r4-authority-rebind.yml
          rm -f sources/SP001/publication/v2/tmp-r4-authority-rebind-trigger.txt
          git add -A
          git diff --cached --quiet && { echo 'no changes'; exit 1; }
          git commit -m 'Rebind SP001 r4 exact publication authority'
          git push origin HEAD:"$BRANCH"
