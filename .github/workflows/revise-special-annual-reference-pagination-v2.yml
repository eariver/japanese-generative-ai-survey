name: Revise Special Annual References Pagination V2

on:
  workflow_dispatch:
    inputs:
      special_slug:
        required: true
        type: string
      source_version:
        description: Next immutable source revision for bibliography-only pagination compaction.
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: special-annual-reference-pagination-v2-${{ inputs.special_slug }}
  cancel-in-progress: false

jobs:
  revise:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout current control code
        uses: actions/checkout@v6
        with:
          ref: main
          path: control-src
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Resolve Annual Special edition
        id: edition
        shell: bash
        env:
          SPECIAL_SLUG: ${{ inputs.special_slug }}
        run: |
          set -euo pipefail
          manifest="control-src/specials/${SPECIAL_SLUG}/edition.json"
          test -s "$manifest"
          python control-src/scripts/special_pipeline.py --config control-src/config/special-pipeline.json validate --manifest "$manifest"
          python - "$manifest" "$GITHUB_OUTPUT" <<'PY'
          import json,sys
          manifest,out=sys.argv[1:]
          value=json.load(open(manifest,encoding='utf-8'))
          assert value['edition_kind']=='RETROSPECTIVE_PERIOD'
          assert value['special_slug'].endswith('-Y')
          with open(out,'a',encoding='utf-8') as f:
              f.write(f"special_id={value['special_id']}\n")
              f.write(f"work_branch={value['paths']['work_branch']}\n")
          PY

      - name: Checkout Annual Special work branch
        uses: actions/checkout@v6
        with:
          ref: ${{ steps.edition.outputs.work_branch }}
          path: worktree
          fetch-depth: 0

      - name: Verify immutable pre-compaction boundary
        shell: bash
        env:
          SPECIAL_ID: ${{ steps.edition.outputs.special_id }}
        run: |
          set -euo pipefail
          python control-src/scripts/raw_provenance.py --repo-root worktree --issue-id "$SPECIAL_ID" check
          python - "$SPECIAL_ID" <<'PY'
          import hashlib,json,pathlib,sys
          issue=sys.argv[1]; root=pathlib.Path('worktree')
          state=json.load(open(root/'sources'/issue/'pipeline-state.json',encoding='utf-8'))
          assert state['lifecycle_state']=='RELEASE_CANDIDATE'
          assert state['gates']['claim_and_chronology_validation']=='passed'
          assert state['gates']['latex_build']=='passed'
          assert state['gates']['visual_review']=='pending'
          assert state['gates']['freeze']=='pending'
          assert 'publication_preview' not in state.get('provenance',{})
          source=state['provenance']['validated_issue_source']; p=root/source['path']
          assert p.is_file() and hashlib.sha256(p.read_bytes()).hexdigest()==source['sha256']
          assert state['provenance']['latex_build']['source_version']==source['source_version']
          manifest=json.load(open(p,encoding='utf-8')); lr=manifest['layout_revision']
          assert lr['annual_final_reference_compaction'] is True
          assert lr['annual_final_visual_compaction'] is True
          assert lr['bibliography_data_changed'] is False
          assert lr['chronology_event_content_changed'] is False
          PY

      - name: Apply bibliography-only pagination v2
        shell: bash
        env:
          SPECIAL_ID: ${{ steps.edition.outputs.special_id }}
          SPECIAL_SLUG: ${{ inputs.special_slug }}
          SOURCE_VERSION: ${{ inputs.source_version }}
        run: |
          set -euo pipefail
          PYTHONPATH=control-src python control-src/scripts/revise_special_annual_reference_pagination_v2.py \
            --repo-root worktree \
            --special-slug "$SPECIAL_SLUG" \
            --issue-id "$SPECIAL_ID" \
            --source-version "$SOURCE_VERSION" \
            > annual-reference-pagination-v2-audit.json
          cat annual-reference-pagination-v2-audit.json

      - name: Verify pagination v2 contract
        shell: bash
        env:
          SPECIAL_ID: ${{ steps.edition.outputs.special_id }}
          SOURCE_VERSION: ${{ inputs.source_version }}
        run: |
          set -euo pipefail
          python - "$SPECIAL_ID" "$SOURCE_VERSION" <<'PY'
          import hashlib,json,pathlib,sys
          issue,version=sys.argv[1:]; root=pathlib.Path('worktree')
          state=json.load(open(root/'sources'/issue/'pipeline-state.json',encoding='utf-8'))
          assert state['lifecycle_state']=='VALIDATED_DRAFT'
          assert state['gates']['latex_build']=='pending'
          assert state['gates']['visual_review']=='pending'
          assert state['gates']['freeze']=='pending'
          source=state['provenance']['validated_issue_source']; assert source['source_version']==version
          mp=root/source['path']; assert hashlib.sha256(mp.read_bytes()).hexdigest()==source['sha256']
          manifest=json.load(open(mp,encoding='utf-8')); lr=manifest['layout_revision']
          assert lr['annual_reference_pagination_v2'] is True
          assert lr['annual_reference_pagination_v2_issue_refs']==[140]
          assert lr['reader_semantic_content_changed'] is False
          assert lr['new_external_evidence'] is False
          assert lr['accepted_article_sections_changed'] is False
          assert lr['evidence_cards_changed'] is False
          assert lr['chronology_event_content_changed'] is False
          assert lr['bibliography_data_changed'] is False
          assert lr['references_columns']==2
          assert lr['references_entry_font']=='6.2pt/6.8pt'
          refs=mp.parent/manifest['references']['path']
          assert hashlib.sha256(refs.read_bytes()).hexdigest()==lr['bibliography_sha256_before']==lr['bibliography_sha256_after']
          main=(mp.parent/manifest['main_tex']['path']).read_text(encoding='utf-8')
          assert '\\fontsize{6.2pt}{6.8pt}\\selectfont' in main
          assert '\\setlength{\\bibhang}{0pt}' in main
          assert '\\setlength{\\biblabelsep}{0.25em}' in main
          assert main.count('\\printbibliography')==1
          marker=state['provenance']['annual_reference_pagination_v2']; marker_path=root/marker['path']
          assert hashlib.sha256(marker_path.read_bytes()).hexdigest()==marker['sha256']
          PY

      - name: Commit pagination v2 source
        working-directory: worktree
        shell: bash
        env:
          SPECIAL_ID: ${{ steps.edition.outputs.special_id }}
          WORK_BRANCH: ${{ steps.edition.outputs.work_branch }}
          SPECIAL_SLUG: ${{ inputs.special_slug }}
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A "surveys/special/${SPECIAL_SLUG}" "sources/${SPECIAL_ID}"
          git diff --cached --quiet && { echo 'No Annual References pagination v2 changes to commit' >&2; exit 1; }
          git commit -m "Tighten ${SPECIAL_ID} References pagination"
          git push origin "HEAD:${WORK_BRANCH}"

      - name: Upload pagination audit
        uses: actions/upload-artifact@v7
        with:
          name: annual-reference-pagination-v2-${{ inputs.special_slug }}-${{ inputs.source_version }}
          path: annual-reference-pagination-v2-audit.json
          if-no-files-found: error
          retention-days: 14
