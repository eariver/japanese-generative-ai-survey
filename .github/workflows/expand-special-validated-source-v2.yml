name: Expand Special validated source v2

on:
  workflow_dispatch:
    inputs:
      special_slug:
        required: true
        type: string
      source_version:
        required: true
        type: string
        default: v0.2

permissions:
  contents: write

concurrency:
  group: special-source-expansion-${{ inputs.special_slug }}
  cancel-in-progress: false

jobs:
  expand:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout current control code
        uses: actions/checkout@v6
        with:
          ref: main
          path: control-src
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Resolve Special edition
        id: edition
        shell: bash
        env:
          SPECIAL_SLUG: ${{ inputs.special_slug }}
        run: |
          set -euo pipefail
          manifest="control-src/specials/${SPECIAL_SLUG}/edition.json"
          test -s "$manifest"
          python control-src/scripts/special_pipeline.py --config control-src/config/special-pipeline.json validate --manifest "$manifest"
          echo "special_id=$(python -c "import json; print(json.load(open('$manifest'))['special_id'])")" >> "$GITHUB_OUTPUT"
          echo "work_branch=$(python -c "import json; print(json.load(open('$manifest'))['paths']['work_branch'])")" >> "$GITHUB_OUTPUT"
      - name: Checkout Special work branch
        uses: actions/checkout@v6
        with:
          ref: ${{ steps.edition.outputs.work_branch }}
          path: worktree
          fetch-depth: 0
      - name: Verify source-expansion boundary
        shell: bash
        env:
          SPECIAL_ID: ${{ steps.edition.outputs.special_id }}
        run: |
          set -euo pipefail
          python control-src/scripts/raw_provenance.py --repo-root worktree --issue-id "$SPECIAL_ID" check
          python - "$SPECIAL_ID" <<'PY'
          import json,sys,pathlib
          issue=sys.argv[1]
          root=pathlib.Path('worktree')
          state=json.load(open(root/'sources'/issue/'pipeline-state.json',encoding='utf-8'))
          assert state['lifecycle_state']=='VALIDATED_DRAFT', state['lifecycle_state']
          assert state['gates']['article_draft']=='passed'
          assert state['gates']['claim_and_chronology_validation']=='passed'
          assert state['gates']['latex_build']=='pending'
          assert 'validated_issue_source' in state['provenance']
          summary=root/'sources'/issue/'editorial'/'technical-notes-ja-v0.1.json'
          assert summary.is_file(), 'prepare/fill Japanese Technical Notes summary artifact before source expansion'
          data=json.load(open(summary,encoding='utf-8'))
          assert data['status']=='READY', 'Japanese Technical Notes summary artifact must be READY'
          PY
      - name: Expand source, apply Japanese summaries, and make Technical Notes reader-facing
        shell: bash
        env:
          SPECIAL_SLUG: ${{ inputs.special_slug }}
          SPECIAL_ID: ${{ steps.edition.outputs.special_id }}
          SOURCE_VERSION: ${{ inputs.source_version }}
        run: |
          set -euo pipefail
          PYTHONPATH=control-src python control-src/scripts/run_expand_special_validated_source.py \
            --repo-root worktree \
            --special-slug "$SPECIAL_SLUG" \
            --issue-id "$SPECIAL_ID" \
            --source-version "$SOURCE_VERSION" \
            > special-source-expansion-audit.json
          PYTHONPATH=control-src python control-src/scripts/special_reader_notes_ja.py apply \
            --repo-root worktree \
            --special-slug "$SPECIAL_SLUG" \
            --issue-id "$SPECIAL_ID" \
            --summary "sources/${SPECIAL_ID}/editorial/technical-notes-ja-v0.1.json" \
            > special-reader-notes-ja-apply-audit.json
          PYTHONPATH=control-src python control-src/scripts/postprocess_special_reader_facing_notes_v2.py \
            --repo-root worktree \
            --special-slug "$SPECIAL_SLUG" \
            --issue-id "$SPECIAL_ID" \
            --source-version "$SOURCE_VERSION" \
            > special-reader-facing-notes-audit.json
          PYTHONPATH=control-src python control-src/scripts/special_period_consistency.py apply \
            --repo-root worktree \
            --special-slug "$SPECIAL_SLUG" \
            --issue-id "$SPECIAL_ID" \
            > special-period-consistency-audit.json
      - name: Verify expanded source, Japanese Technical Notes, and period consistency
        shell: bash
        env:
          SPECIAL_SLUG: ${{ inputs.special_slug }}
          SPECIAL_ID: ${{ steps.edition.outputs.special_id }}
          SOURCE_VERSION: ${{ inputs.source_version }}
        run: |
          set -euo pipefail
          python - "$SPECIAL_ID" "$SPECIAL_SLUG" "$SOURCE_VERSION" <<'PY'
          import hashlib,json,sys,pathlib
          issue,slug,version=sys.argv[1:]
          root=pathlib.Path('worktree')
          state=json.load(open(root/'sources'/issue/'pipeline-state.json',encoding='utf-8'))
          assert state['lifecycle_state']=='VALIDATED_DRAFT'
          prov=state['provenance']['validated_issue_source']
          manifest=root/prov['path']
          assert manifest==root/'surveys'/'special'/slug/'revisions'/version/'source-manifest.json', manifest
          assert hashlib.sha256(manifest.read_bytes()).hexdigest()==prov['sha256']
          data=json.load(open(manifest,encoding='utf-8'))
          assert data['status']=='VALIDATED_SOURCE_EXPANSION'
          assert data['article_count']>=1
          assert data['evidence_record_count']>=1
          reader=data['reader_facing_technical_notes']
          assert reader['unconditional_clearpage_at_entry'] is False
          assert reader['evidence_ids_rendered_in_pdf'] is False
          assert reader['language_policy']=='ja-reader-summary-v1'
          assert reader['source_evidence_unchanged'] is True
          assert reader['attribution_labels_preserved'] is True
          assert data['period_consistency']['retrospective_scope_derived_from_manifest'] is True
          for article in data['articles']:
              p=manifest.parent/article['technical_notes_path']
              text=p.read_text(encoding='utf-8')
              assert hashlib.sha256(p.read_bytes()).hexdigest()==article['technical_notes_sha256']
              assert not text.lstrip().startswith('\\clearpage')
              for banned in ('Selection済みEvidence','normalized claim','Source-bound record:'):
                  assert banned not in text, (article['package_id'],banned)
          assert len(state.get('provenance_history',{}).get('validated_issue_source',[]))>=1
          assert (manifest.parent/'main.tex').is_file()
          PY
          PYTHONPATH=control-src python control-src/scripts/special_reader_notes_ja.py check \
            --repo-root worktree \
            --issue-id "$SPECIAL_ID"
          PYTHONPATH=control-src python control-src/scripts/special_period_consistency.py check \
            --repo-root worktree \
            --special-slug "$SPECIAL_SLUG" \
            --issue-id "$SPECIAL_ID"
      - name: Commit expanded source revision
        working-directory: worktree
        shell: bash
        env:
          SPECIAL_ID: ${{ steps.edition.outputs.special_id }}
          SPECIAL_SLUG: ${{ inputs.special_slug }}
          SOURCE_VERSION: ${{ inputs.source_version }}
          WORK_BRANCH: ${{ steps.edition.outputs.work_branch }}
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "sources/${SPECIAL_ID}/pipeline-state.json" "surveys/special/${SPECIAL_SLUG}/revisions/${SOURCE_VERSION}"
          git diff --cached --quiet && exit 0
          git commit -m "Expand reader-facing source ${SOURCE_VERSION} for ${SPECIAL_ID}"
          git push origin "HEAD:${WORK_BRANCH}"
      - name: Upload expansion audit
        uses: actions/upload-artifact@v7
        with:
          name: special-source-expansion-${{ inputs.special_slug }}-${{ inputs.source_version }}
          path: |
            special-source-expansion-audit.json
            special-reader-notes-ja-apply-audit.json
            special-reader-facing-notes-audit.json
            special-period-consistency-audit.json
          if-no-files-found: error
          retention-days: 14
