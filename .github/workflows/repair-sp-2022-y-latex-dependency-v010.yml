name: Repair SP-2022-Y LaTeX Dependency v0.10

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: repair-sp-2022-y-latex-dependency-v010
  cancel-in-progress: false

jobs:
  repair:
    if: github.event.pull_request.head.ref == 'special/2022-Y-work'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout current validation control
        uses: actions/checkout@v6
        with:
          ref: main
          path: control-src
          fetch-depth: 1
          sparse-checkout: |
            scripts
            config
            specials/2022-Y
          sparse-checkout-cone-mode: true

      - name: Checkout SP-2022-Y v0.9 source and state
        uses: actions/checkout@v6
        with:
          ref: special/2022-Y-work
          path: worktree
          fetch-depth: 1
          sparse-checkout: |
            specials/2022-Y
            sources/SP-2022-Y/pipeline-state.json
            sources/SP-2022-Y/editorial
            sources/SP-2022-Y/architecture
            sources/SP-2022-Y/drafting
            sources/SP-2022-Y/finalization
            sources/SP-2022-Y/chronology
            surveys/special/2022-Y/revisions/v0.9
            surveys/special/2022-Y/revisions/v0.10
          sparse-checkout-cone-mode: false

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Resolve whether v0.10 dependency repair is needed
        id: boundary
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import hashlib,json,pathlib
          root=pathlib.Path('worktree')
          state=json.load(open(root/'sources/SP-2022-Y/pipeline-state.json',encoding='utf-8'))
          assert state['lifecycle_state']=='VALIDATED_DRAFT'
          assert state['gates']['latex_build']=='pending'
          assert state['gates']['visual_review']=='pending' and state['gates']['freeze']=='pending'
          assert 'publication_preview' not in state.get('provenance',{})
          src=state['provenance']['validated_issue_source']
          if src.get('source_version')=='v0.10':
              print('needed=false')
              raise SystemExit(0)
          assert src.get('source_version')=='v0.9', src
          manifest=root/src['path']
          assert manifest.is_file()
          assert hashlib.sha256(manifest.read_bytes()).hexdigest()==src['sha256']
          assert not (root/'surveys/special/2022-Y/revisions/v0.10').exists()
          print('needed=true')
          PY

      - name: Create immutable v0.10 with declared needspace dependency
        if: steps.boundary.outputs.needed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib,json,pathlib,shutil
          root=pathlib.Path('worktree')
          state_path=root/'sources/SP-2022-Y/pipeline-state.json'
          state=json.load(open(state_path,encoding='utf-8'))
          parent=state['provenance']['validated_issue_source']
          parent_manifest=root/parent['path']
          parent_dir=parent_manifest.parent
          new_dir=parent_dir.parent/'v0.10'
          shutil.copytree(parent_dir,new_dir)
          manifest_path=new_dir/'source-manifest.json'
          manifest=json.load(open(manifest_path,encoding='utf-8'))
          main_path=new_dir/manifest['main_tex']['path']
          text=main_path.read_text(encoding='utf-8')
          needle='\\usepackage{multicol}\n'
          assert text.count(needle)==1
          assert '\\usepackage{needspace}' not in text
          text=text.replace(needle,needle+'\\usepackage{needspace}\n',1)
          main_path.write_text(text,encoding='utf-8')
          sha=lambda p: hashlib.sha256(p.read_bytes()).hexdigest()
          manifest['source_version']='v0.10'
          manifest['status']='VALIDATED_LATEX_DEPENDENCY_REPAIR'
          manifest['derivation']='Build-only immutable revision of v0.9: declares the needspace package required by the existing \\Needspace command before References. Reader-facing content, chronology, Evidence selection, source URLs, and layout semantics are unchanged.'
          manifest.setdefault('basis',{})['previous_source_manifest_path']=parent['path']
          manifest['basis']['previous_source_manifest_sha256']=parent['sha256']
          manifest['main_tex']['sha256']=sha(main_path)
          manifest_path.write_text(json.dumps(manifest,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          manifest_sha=sha(manifest_path)
          audit={
            'schema_version':'1.0','issue_id':'SP-2022-Y','source_version':'v0.10','parent_source_version':'v0.9',
            'parent_source_manifest_path':parent['path'],'parent_source_manifest_sha256':parent['sha256'],
            'source_manifest_path':manifest_path.relative_to(root).as_posix(),'source_manifest_sha256':manifest_sha,
            'repair':'declare-needspace-package','trigger':'LuaLaTeX undefined control sequence at \\Needspace before References',
            'reader_facing_content_changed':False,'chronology_changed':False,'evidence_changed':False,'source_url_sets_changed':False,
            'publication_preview_approval_recorded':False
          }
          audit_path=root/'sources/SP-2022-Y/editorial/latex-dependency-repair-v0.10.json'
          audit_path.write_text(json.dumps(audit,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          history=state.setdefault('provenance_history',{}).setdefault('validated_issue_source',[])
          if not any(x.get('source_version')=='v0.9' and x.get('sha256')==parent['sha256'] for x in history):
              history.append(dict(parent))
          state['provenance']['validated_issue_source']={
            'path':manifest_path.relative_to(root).as_posix(),'sha256':manifest_sha,'source_version':'v0.10',
            'layout_mode':'annual-direct-entity-binding-plus-latex-dependency-repair'
          }
          state['provenance']['latex_source_revision']={
            'source_version':'v0.10','path':audit_path.relative_to(root).as_posix(),'sha256':sha(audit_path),
            'dependency':'needspace','publication_preview_approval_recorded':False
          }
          state.get('provenance',{}).pop('latex_build',None)
          state.get('provenance',{}).pop('publication_preview',None)
          state['lifecycle_state']='VALIDATED_DRAFT'
          state['gates']['latex_build']='pending'; state['gates']['visual_review']='pending'; state['gates']['freeze']='pending'
          state_path.write_text(json.dumps(state,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          print(json.dumps(audit,ensure_ascii=False,indent=2))
          PY

      - name: Run current-main publication preflights
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=control-src python control-src/scripts/special_reader_notes_ja.py check --repo-root worktree --issue-id SP-2022-Y
          PYTHONPATH=control-src python control-src/scripts/special_period_consistency.py check --repo-root worktree --special-slug 2022-Y --issue-id SP-2022-Y
          PYTHONPATH=control-src python control-src/scripts/special_publication_layout_check.py --repo-root worktree --issue-id SP-2022-Y
          python - <<'PY'
          import hashlib,json,pathlib
          root=pathlib.Path('worktree')
          state=json.load(open(root/'sources/SP-2022-Y/pipeline-state.json',encoding='utf-8'))
          src=state['provenance']['validated_issue_source']; assert src['source_version']=='v0.10'
          manifest_path=root/src['path']; assert hashlib.sha256(manifest_path.read_bytes()).hexdigest()==src['sha256']
          manifest=json.load(open(manifest_path,encoding='utf-8'))
          text=(manifest_path.parent/manifest['main_tex']['path']).read_text(encoding='utf-8')
          assert text.count('\\usepackage{needspace}')==1 and '\\Needspace{0.30\\textheight}' in text
          assert state['gates']['latex_build']=='pending' and 'publication_preview' not in state.get('provenance',{})
          PY

      - name: Commit validated v0.10 revision
        if: steps.boundary.outputs.needed == 'true'
        working-directory: worktree
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add sources/SP-2022-Y/pipeline-state.json sources/SP-2022-Y/editorial/latex-dependency-repair-v0.10.json surveys/special/2022-Y/revisions/v0.10
          git commit -m 'Declare SP-2022-Y needspace dependency in v0.10'
          git push origin HEAD:special/2022-Y-work
