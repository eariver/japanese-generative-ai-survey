name: Run M06 adaptive spacing once

on:
  pull_request:
    types: [synchronize]

permissions:
  contents: write

concurrency:
  group: special-adaptive-spacing-2026-M06-run-once
  cancel-in-progress: false

jobs:
  revise:
    if: github.event.pull_request.number == 45 && github.event.pull_request.head.ref == 'special/2026-M06-work'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout current control code
        uses: actions/checkout@v6
        with:
          ref: main
          path: control-src
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Checkout Special work branch
        uses: actions/checkout@v6
        with:
          ref: special/2026-M06-work
          path: worktree
          fetch-depth: 0
      - name: Verify adaptive-spacing boundary
        shell: bash
        run: |
          set -euo pipefail
          python control-src/scripts/raw_provenance.py --repo-root worktree --issue-id SP-2026-M06 check >/dev/null
          python - <<'PY'
          import json,pathlib
          root=pathlib.Path('worktree'); state=json.load(open(root/'sources/SP-2026-M06/pipeline-state.json',encoding='utf-8'))
          assert state['lifecycle_state']=='RELEASE_CANDIDATE'
          assert state['gates']['latex_build']=='passed' and state['gates']['visual_review']=='pending' and state['gates']['freeze']=='pending'
          src=state['provenance']['validated_issue_source']; assert src['source_version']=='v0.4' and src['sha256']=='78e3fbec73efebb2df0c2e63509ff6b9ec759f9eb95bba770b27b0a15281b3ae'
          build=state['provenance']['latex_build']; assert build['workflow_run_id']==31488487327
          marker=root/'sources/SP-2026-M06/editorial/layout-revision-v0.5.json'; assert marker.is_file()
          m=json.load(open(marker,encoding='utf-8')); assert m['constraints']=={'new_external_evidence_allowed':False,'reader_content_changed':False,'selected_evidence_only':True}
          assert not (root/'surveys/special/2026-M06/revisions/v0.5').exists()
          PY
      - name: Build adaptive-spacing v0.5
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=control-src python control-src/scripts/revise_special_adaptive_spacing.py \
            --repo-root worktree \
            --special-slug 2026-M06 \
            --issue-id SP-2026-M06 \
            --source-version v0.5 \
            > special-adaptive-spacing-audit.json
      - name: Normalize provenance and verify v0.5
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib,json,pathlib
          root=pathlib.Path('worktree'); sp=root/'sources/SP-2026-M06/pipeline-state.json'; state=json.load(open(sp,encoding='utf-8'))
          assert state['lifecycle_state']=='VALIDATED_DRAFT'
          assert state['gates']['latex_build']=='pending' and state['gates']['visual_review']=='pending' and state['gates']['freeze']=='pending'
          src=state['provenance']['validated_issue_source']; assert src['source_version']=='v0.5'
          manifest=root/src['path']; assert hashlib.sha256(manifest.read_bytes()).hexdigest()==src['sha256']
          data=json.load(open(manifest,encoding='utf-8')); assert data['status']=='VALIDATED_ADAPTIVE_SPACING_REVISION'
          lr=data['layout_revision']; assert lr['reader_content_changed'] is False and lr['new_external_evidence'] is False
          assert lr['adaptive_chapter_starts'] is True and lr['forced_bibliography_clearpage'] is False
          assert data['layout']['references_start_policy'].startswith('continue after final synthesis')
          main=(manifest.parent/'main.tex').read_text(encoding='utf-8')
          assert '\\clearpage\n\\printbibliography[title={References / Source Notes}]' not in main
          rev=state['provenance'].get('reader_layout_revision',{})
          rev['reason']='Editorial render-first QA before Human Visual Review: v0.4 passed TeX/page gates but retained large structural blank tails from unconditional later-chapter, final-synthesis, and References page breaks. v0.5 changes spacing only.'
          state['provenance']['reader_layout_revision']=rev
          sp.write_text(json.dumps(state,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          print(json.dumps({'source_version':'v0.5','manifest_sha256':src['sha256'],'status':data['status']},ensure_ascii=False))
          PY
      - name: Commit v0.5 and remove wrapper
        working-directory: worktree
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/m06-adaptive-spacing-run-once.yml
          git add sources/SP-2026-M06/pipeline-state.json surveys/special/2026-M06/revisions/v0.5
          git commit -m 'Make M06 v0.5 chapter spacing adaptive'
          git push origin HEAD:special/2026-M06-work
      - name: Upload adaptive-spacing audit
        uses: actions/upload-artifact@v7
        with:
          name: special-adaptive-spacing-2026-M06-v0.5
          path: special-adaptive-spacing-audit.json
          if-no-files-found: error
          retention-days: 14
