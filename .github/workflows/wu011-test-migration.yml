name: WU011 Test migration

on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/wu011-test-migration.yml'

permissions:
  contents: write

jobs:
  migrate:
    if: github.event.pull_request.head.ref == 'refactor/survey-production-core-v2'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/survey-production-core-v2
          fetch-depth: 0
      - name: Apply fixture migration
        run: |
          set -euo pipefail
          python scripts/wu011_test_migration.py
          python -m py_compile tests/test_survey_drafting_v2.py tests/test_survey_orchestrator_v2.py
      - name: Commit fixture migration and remove one-shot files
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/wu011-test-migration.yml scripts/wu011_test_migration.py
          git add tests/test_survey_drafting_v2.py tests/test_survey_orchestrator_v2.py
          git commit -m 'tests: migrate fixtures to WU011 gate and handoff contracts'
          git push origin HEAD:refactor/survey-production-core-v2
