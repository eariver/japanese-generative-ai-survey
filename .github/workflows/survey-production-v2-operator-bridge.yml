name: Survey Production Core v2 operator bridge signal

on:
  push:
    branches:
      - '**'
      - '!main'
    paths:
      - 'sources/**/execution/requests/*.json'

# This work-branch workflow is intentionally unprivileged. It is only a signal
# source for the trusted default-branch workflow_run executor owned by
# pipeline-contract-tests.yml. A drifted work branch may suppress or alter this
# signal (denial of service), but it cannot obtain repository write authority.
permissions:
  contents: read

concurrency:
  group: survey-production-v2-operator-bridge-signal-${{ github.ref }}
  cancel-in-progress: false

jobs:
  signal:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Emit untrusted operator-request signal
        shell: bash
        run: |
          set -euo pipefail
          echo "Operator request signal only."
          echo "request_commit=$GITHUB_SHA"
          echo "request_ref=$GITHUB_REF_NAME"
          echo "Trusted preflight and execution run only from default-branch workflow_run authority."
