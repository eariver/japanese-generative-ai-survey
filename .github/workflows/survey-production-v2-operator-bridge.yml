name: Survey Production Core v2 operator bridge

on:
  push:
    branches:
      - '**'
      - '!main'
    paths:
      - 'sources/**/execution/requests/*.json'

permissions:
  contents: write

concurrency:
  group: survey-production-v2-operator-bridge-${{ github.ref }}
  cancel-in-progress: false

jobs:
  execute-request:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact request commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Core dependencies
        run: python -m pip install -r config/survey-production-v2-requirements.txt

      - name: Resolve one immutable request-only commit
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t added_requests < <(
            git diff-tree --diff-filter=A --no-commit-id --name-only -r "$GITHUB_SHA" -- \
              ':(glob)sources/**/execution/requests/*.json'
          )
          if [[ "${#added_requests[@]}" -ne 1 ]]; then
            echo "Expected exactly one newly added operator request; found ${#added_requests[@]}" >&2
            exit 1
          fi

          mapfile -t changed < <(git diff-tree --no-commit-id --name-only -r "$GITHUB_SHA")
          if [[ "${#changed[@]}" -ne 1 || "${changed[0]}" != "${added_requests[0]}" ]]; then
            echo "Operator request commit must contain only the immutable request file." >&2
            printf 'Changed: %s\n' "${changed[@]}" >&2
            exit 1
          fi

          printf '%s\n' "${added_requests[0]}" > "$RUNNER_TEMP/operator-request-path"

      - name: Execute canonical deterministic Core operation
        shell: bash
        run: |
          set -euo pipefail
          request_path="$(cat "$RUNNER_TEMP/operator-request-path")"
          python scripts/survey_core_execution_bridge_v2.py \
            --request "$request_path" \
            --event-sha "$GITHUB_SHA" \
            --ref-name "$GITHUB_REF_NAME" \
            > "$RUNNER_TEMP/operator-bridge-result.json"
          cat "$RUNNER_TEMP/operator-bridge-result.json"

      - name: Enforce edition-local write boundary
        shell: bash
        run: |
          set -euo pipefail
          source_root="$(python -c 'import json,sys; print(json.load(open(sys.argv[1], encoding="utf-8"))["source_root"])' "$RUNNER_TEMP/operator-bridge-result.json")"
          request_root="$source_root/execution/requests/"
          mapfile -t dirty < <(
            {
              git diff --name-only
              git ls-files --others --exclude-standard
            } | sed '/^$/d' | sort -u
          )
          if [[ "${#dirty[@]}" -eq 0 ]]; then
            echo "Bridge produced no repository changes." >&2
            exit 1
          fi
          for path in "${dirty[@]}"; do
            case "$path" in
              "$source_root"/*) ;;
              *)
                echo "Bridge attempted write outside edition source root: $path" >&2
                exit 1
                ;;
            esac
            case "$path" in
              "$request_root"*)
                echo "Bridge must not mutate immutable request authority: $path" >&2
                exit 1
                ;;
            esac
          done

      - name: Commit deterministic edition-local outputs
        shell: bash
        run: |
          set -euo pipefail
          source_root="$(python -c 'import json,sys; print(json.load(open(sys.argv[1], encoding="utf-8"))["source_root"])' "$RUNNER_TEMP/operator-bridge-result.json")"
          request_id="$(python -c 'import json,sys; print(json.load(open(sys.argv[1], encoding="utf-8"))["request_id"])' "$RUNNER_TEMP/operator-bridge-result.json")"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- "$source_root"
          git commit -m "Execute Core operator request $request_id"
          git push origin "HEAD:$GITHUB_REF_NAME"
