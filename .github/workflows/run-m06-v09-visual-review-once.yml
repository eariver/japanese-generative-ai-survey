name: Run M06 v0.9 Visual Review once

on:
  pull_request:
    types: [synchronize]
    paths:
      - 'sources/SP-2026-M06/editorial/v0.9-visual-review-trigger.txt'

permissions:
  actions: read
  contents: write

jobs:
  accept:
    if: github.event.pull_request.number == 45 && github.event.pull_request.head.ref == 'special/2026-M06-work'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout current control code
        uses: actions/checkout@v6
        with:
          ref: main
          path: control-src
          fetch-depth: 1

      - name: Checkout Special work branch
        uses: actions/checkout@v6
        with:
          ref: special/2026-M06-work
          path: worktree
          fetch-depth: 0

      - name: Resolve and verify approved build
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          python control-src/scripts/raw_provenance.py --repo-root worktree --issue-id SP-2026-M06 check >/dev/null
          python - <<'PY' > build.env
          import json,pathlib
          state=json.load(open(pathlib.Path('worktree/sources/SP-2026-M06/pipeline-state.json'),encoding='utf-8'))
          assert state['lifecycle_state']=='RELEASE_CANDIDATE'
          assert state['gates']['latex_build']=='passed'
          assert state['gates']['visual_review']=='pending'
          assert state['gates']['freeze']=='pending'
          src=state['provenance']['validated_issue_source']; latex=state['provenance']['latex_build']
          assert src['source_version']=='v0.9'
          assert src['sha256']=='4aa9f1803e0dc8b64c56ea0369461d073aca014218031d3efbba0d0fd9abedee'
          assert latex['pdf_sha256']=='2d7b9d3abe3e90fcf3de9112f1204b8b8ed765986a04e30dc0ba92b1c0c499cf'
          assert latex['workflow_run_id']==31496494165
          assert latex['page_count']==32
          print(f"RUN_ID={latex['workflow_run_id']}")
          print('SOURCE_VERSION=v0.9')
          print('ARTIFACT_NAME=japanese-generative-ai-survey-special-2026-M06-v0.9')
          print(f"APPROVED_PDF_SHA256={latex['pdf_sha256']}")
          PY
          cat build.env >> "$GITHUB_ENV"
          mkdir -p approved-build
          gh run download "$RUN_ID" --repo "$GH_REPO" -n "$ARTIFACT_NAME" -D approved-build
          pdf=$(find approved-build -type f -name main.pdf -print -quit)
          test -n "$pdf" && test -s "$pdf"
          actual=$(sha256sum "$pdf" | awk '{print $1}')
          test "$actual" = "$APPROVED_PDF_SHA256"
          echo "APPROVED_PDF_PATH=$pdf" >> "$GITHUB_ENV"
          artifact_json=$(gh api "repos/${GH_REPO}/actions/runs/${RUN_ID}/artifacts" --jq ".artifacts[] | select(.name == \"${ARTIFACT_NAME}\") | {id: .id, digest: .digest, expired: .expired}")
          test -n "$artifact_json"
          test "$(printf '%s' "$artifact_json" | jq -r '.expired')" = false
          echo "ARTIFACT_ID=$(printf '%s' "$artifact_json" | jq -r '.id')" >> "$GITHUB_ENV"
          echo "ARTIFACT_DIGEST=$(printf '%s' "$artifact_json" | jq -r '.digest')" >> "$GITHUB_ENV"

      - name: Accept Human Visual Review
        shell: bash
        env:
          APPROVED_AT: '2026-08-11T22:43:00+09:00'
          APPROVAL_REFERENCE: 'User approval 2026-08-11 22:43 JST: approved the exact SP-2026-M06 v0.9 PDF for Human Visual Review; also authorized proceeding through Freeze and Release if no intervening gate remained.'
        run: |
          set -euo pipefail
          PYTHONPATH=control-src python control-src/scripts/accept_special_visual_review_issue_only.py \
            --repo-root worktree \
            --issue-id SP-2026-M06 \
            --special-slug 2026-M06 \
            --approved-pdf "$APPROVED_PDF_PATH" \
            --approved-pdf-sha256 "$APPROVED_PDF_SHA256" \
            --approved-at "$APPROVED_AT" \
            --approval-reference "$APPROVAL_REFERENCE" \
            --artifact-name "$ARTIFACT_NAME" \
            --artifact-id "$ARTIFACT_ID" \
            --artifact-digest "$ARTIFACT_DIGEST" \
            > visual-review-acceptance-audit.json
          cat visual-review-acceptance-audit.json

      - name: Verify issue-only Freeze candidate
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib,json,pathlib
          root=pathlib.Path('worktree')
          state=json.load(open(root/'sources/SP-2026-M06/pipeline-state.json',encoding='utf-8'))
          assert state['lifecycle_state']=='RELEASE_CANDIDATE'
          assert state['gates']['visual_review']=='passed'
          assert state['gates']['freeze']=='pending'
          fc=state['provenance']['freeze_candidate']; p=root/fc['path']
          assert p.name=='freeze-candidate.json'
          assert hashlib.sha256(p.read_bytes()).hexdigest()==fc['sha256']
          c=json.load(open(p,encoding='utf-8'))
          assert c['status']=='PENDING_HUMAN_FREEZE_APPROVAL'
          assert c['release_identity_mode']=='ISSUE_ONLY'
          assert c['release_tag']=='special/2026-M06'
          assert c['asset_name']=='Japanese_Generative_AI_Technical_Survey_Special_2026-M06.pdf'
          assert c['canonical_pdf_candidate']['sha256']=='2d7b9d3abe3e90fcf3de9112f1204b8b8ed765986a04e30dc0ba92b1c0c499cf'
          PY

      - name: Commit approval and remove one-off wrapper
        working-directory: worktree
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm -f ../.github/workflows/run-m06-v09-visual-review-once.yml
          rm -f sources/SP-2026-M06/editorial/v0.9-visual-review-trigger.txt
          git add -A
          git commit -m 'Accept SP-2026-M06 v0.9 Visual Review and prepare issue-only Freeze candidate'
          git push origin HEAD:special/2026-M06-work

      - name: Upload acceptance audit
        uses: actions/upload-artifact@v7
        with:
          name: special-visual-review-2026-M06-v0.9
          path: visual-review-acceptance-audit.json
          if-no-files-found: error
          retention-days: 30
