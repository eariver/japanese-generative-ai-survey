name: W33 Evidence r2
on:
  pull_request:
    paths:
      - 'automation/w33_evidence_r2.py'
      - '.github/workflows/w33-evidence-r2.yml'
permissions:
  contents: write
jobs:
  evidence-r2:
    if: github.head_ref == 'temp/w33-evidence-r2'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: temp/w33-evidence-r2
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r config/survey-production-v2-requirements.txt
      - name: Build fresh W33 Evidence r2
        run: PYTHONPATH=. python automation/w33_evidence_r2.py
      - name: Validate Evidence r2 exact stage artifacts
        run: |
          set -euo pipefail
          EACC=$(find sources/2026-W33/evidence/v2/accepted -mindepth 2 -maxdepth 2 -name evidence-accepted.json -printf '%T@ %p\n' | sort -nr | head -1 | cut -d' ' -f2-)
          VACC=$(find sources/2026-W33/evidence/v2/edition-views/accepted -mindepth 2 -maxdepth 2 -name edition-views-accepted.json -printf '%T@ %p\n' | sort -nr | head -1 | cut -d' ' -f2-)
          PYTHONPATH=. python scripts/survey_stage_validation_v2.py --repo-root . --config config/survey-production-v2.json \
            --state sources/2026-W33/production-state.json \
            --artifact evidence-acceptance="$EACC" \
            --artifact edition-views-acceptance="$VACC" \
            --artifact materiality-ledger=sources/2026-W33/materiality-ledger-v2.json \
            --artifact profile-completeness=sources/2026-W33/profile-completeness-v2.json \
            --output sources/2026-W33/orchestration/v2/reviews/evidence-r2-core-stage-contract.json
      - name: Persist Evidence r2 and remove temporary runner
        run: |
          set -euo pipefail
          rm automation/w33_evidence_r2.py .github/workflows/w33-evidence-r2.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A sources/2026-W33 docs/checkpoints/2026-W33-core-v2-compilation-session-worklog.md automation .github/workflows/w33-evidence-r2.yml
          git commit -m 'Regenerate W33 Evidence r2 with community signal detail'
          git push origin HEAD:temp/w33-evidence-r2
