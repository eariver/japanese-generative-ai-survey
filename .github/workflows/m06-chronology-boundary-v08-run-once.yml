name: Run M06 chronology boundary v0.8 once

on:
  pull_request:
    types: [synchronize]

permissions:
  contents: write

concurrency:
  group: special-chronology-boundary-2026-M06-v0.8-run-once
  cancel-in-progress: false

jobs:
  revise:
    if: github.event.pull_request.number == 45 && github.event.pull_request.head.ref == 'special/2026-M06-work'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout current control code
        uses: actions/checkout@v6
        with:
          ref: main
          path: control-src
          fetch-depth: 1
      - name: Checkout Special work branch
        uses: actions/checkout@v6
        with:
          ref: special/2026-M06-work
          path: worktree
          fetch-depth: 0
      - name: Verify v0.7 boundary
        shell: bash
        run: |
          set -euo pipefail
          python control-src/scripts/raw_provenance.py --repo-root worktree --issue-id SP-2026-M06 check >/dev/null
          python - <<'PY'
          import json,pathlib
          root=pathlib.Path('worktree'); s=json.load(open(root/'sources/SP-2026-M06/pipeline-state.json',encoding='utf-8'))
          assert s['lifecycle_state']=='RELEASE_CANDIDATE'
          assert s['gates']['latex_build']=='passed' and s['gates']['visual_review']=='pending' and s['gates']['freeze']=='pending'
          src=s['provenance']['validated_issue_source']; assert src['source_version']=='v0.7' and src['sha256']=='30e0f0921ec929832466bc5b1b9e96cae97ac323976f70d9f5bd465c5fff997e'
          b=s['provenance']['latex_build']; assert b['pdf_sha256']=='3ba7d40d1f68b7d68be8558902f911f5110fa8687b322a8e05728b6ac7d2b0af' and b['page_count']==32
          marker=json.load(open(root/'sources/SP-2026-M06/editorial/layout-revision-v0.8.json',encoding='utf-8'))
          assert marker['constraints']['reader_wording_changed'] is False and marker['constraints']['new_external_evidence_allowed'] is False
          assert marker['layout_changes']['preserve_boundary_wording_exactly'] is True
          assert not (root/'surveys/special/2026-M06/revisions/v0.8').exists()
          PY
      - name: Build v0.8 inline-boundary revision
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import copy,hashlib,json,re,shutil
          root=Path('worktree'); issue='SP-2026-M06'; slug='2026-M06'; version='v0.8'
          sp=root/'sources'/issue/'pipeline-state.json'; state=json.load(open(sp,encoding='utf-8'))
          current=copy.deepcopy(state['provenance']['validated_issue_source']); cur_manifest=root/current['path']; data=json.load(open(cur_manifest,encoding='utf-8'))
          out=root/'surveys/special'/slug/'revisions'/version; shutil.copytree(cur_manifest.parent,out)
          def sha(p): return hashlib.sha256(p.read_bytes()).hexdigest()
          chron_info=copy.deepcopy(data['chronology_synthesis']); chron=out/chron_info['tex_path']; before=chron.read_text(encoding='utf-8')
          artifact=json.load(open(root/chron_info['artifact_path'],encoding='utf-8')); boundary=artifact['boundary']
          pat=re.compile(r'\\normalsize\n\\begin\{claimboundary\}\[この年表の境界\]\n(.*?)\n\\end\{claimboundary\}',re.S)
          m=pat.search(before)
          if not m: raise ValueError('chronology Claim Boundary block not found')
          if m.group(1)!=boundary: raise ValueError('chronology boundary wording differs from artifact')
          repl='\\scriptsize\n\\noindent\\textit{'+boundary+'}\n\\normalsize'
          after=pat.sub(lambda _:repl,before,count=1)
          assert after.count('この年表の境界')==0
          assert boundary in after
          chron.write_text(after,encoding='utf-8'); chron_info['tex_sha256']=sha(chron); chron_info['boundary_presentation']='inline scriptsize italic note'; chron_info['reader_wording_changed']=False
          new=copy.deepcopy(data); new['source_version']=version; new['status']='VALIDATED_INLINE_CHRONOLOGY_BOUNDARY_REVISION'
          new['derivation']='Layout-only revision of v0.7. The exact June chronology boundary wording is preserved but rendered as an inline scriptsize italic note so it remains with the chronology table. No other reader content or Evidence changes.'
          new['basis']=copy.deepcopy(data.get('basis') or {}); new['basis']['previous_source_manifest_path']=current['path']; new['basis']['previous_source_manifest_sha256']=current['sha256']
          new['chronology_synthesis']=chron_info
          new['layout_revision']={'from_source_version':'v0.7','reader_content_changed':False,'new_external_evidence':False,'chronology_boundary_inline':True,'chronology_boundary_wording_changed':False,'main_tex_changed':False,'accepted_article_sections_changed':False,'layout_article_bodies_changed':False,'theme_synthesis_changed':False,'technical_notes_changed':False,'final_synthesis_changed':False,'references_bib_changed':False}
          manifest=out/'source-manifest.json'; manifest.write_text(json.dumps(new,ensure_ascii=False,indent=2)+'\n',encoding='utf-8'); msha=sha(manifest)
          hist=state.setdefault('provenance_history',{}); hist.setdefault('validated_issue_source',[]).append(current); prev=copy.deepcopy(state['provenance'].get('latex_build') or {})
          if prev: hist.setdefault('latex_build',[]).append(prev)
          marker=root/'sources'/issue/'editorial'/f'layout-revision-{version}.json'
          state['lifecycle_state']='VALIDATED_DRAFT'; state['gates']['latex_build']='pending'; state['gates']['visual_review']='pending'; state['gates']['freeze']='pending'
          state['provenance']['validated_issue_source']={'path':manifest.relative_to(root).as_posix(),'sha256':msha,'source_version':version,'layout_mode':'balanced-multicol-adaptive-spacing-with-june-chronology-inline-boundary','layout_revision_sha256':sha(marker)}
          state['provenance'].pop('latex_build',None); state['provenance']['reader_layout_revision']={'source_version':version,'layout_revision_path':marker.relative_to(root).as_posix(),'layout_revision_sha256':sha(marker),'reason':'Render-first QA of v0.7 found the chronology Claim Boundary box alone at the top of the next page. Preserve its exact wording but render it inline with the chronology.'}
          sp.write_text(json.dumps(state,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          print(json.dumps({'source_version':version,'source_manifest_sha256':msha,'chronology_tex_sha256':chron_info['tex_sha256'],'reader_wording_changed':False},ensure_ascii=False))
          PY
      - name: Verify v0.8 invariants
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib,json,pathlib
          root=pathlib.Path('worktree'); s=json.load(open(root/'sources/SP-2026-M06/pipeline-state.json',encoding='utf-8'))
          assert s['lifecycle_state']=='VALIDATED_DRAFT' and s['gates']['latex_build']=='pending' and s['gates']['visual_review']=='pending'
          src=s['provenance']['validated_issue_source']; assert src['source_version']=='v0.8'
          m=root/src['path']; assert hashlib.sha256(m.read_bytes()).hexdigest()==src['sha256']; d=json.load(open(m,encoding='utf-8'))
          assert d['status']=='VALIDATED_INLINE_CHRONOLOGY_BOUNDARY_REVISION'; lr=d['layout_revision']
          assert lr['reader_content_changed'] is False and lr['new_external_evidence'] is False and lr['chronology_boundary_inline'] is True and lr['chronology_boundary_wording_changed'] is False
          c=d['chronology_synthesis']; t=(m.parent/c['tex_path']).read_text(encoding='utf-8'); a=json.load(open(root/c['artifact_path'],encoding='utf-8'))
          assert a['boundary'] in t and 'begin{claimboundary}[この年表の境界]' not in t and c['reader_wording_changed'] is False
          PY
      - name: Commit v0.8 and remove wrapper
        working-directory: worktree
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'; git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/m06-chronology-boundary-v08-run-once.yml
          git add sources/SP-2026-M06/pipeline-state.json surveys/special/2026-M06/revisions/v0.8
          git commit -m 'Keep June chronology boundary inline in v0.8'; git push origin HEAD:special/2026-M06-work
