name: One-shot fix Special finalizer cover anchors

on:
  push:
    branches:
      - fix/special-finalizer-cover-anchors
    paths:
      - .github/workflows/one-shot-fix-special-finalizer-cover-anchors.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/special-finalizer-cover-anchors
          fetch-depth: 0
      - name: Patch package-id cover anchors
        shell: python
        run: |
          from pathlib import Path
          path = Path('scripts/finalize_special_validated_draft.py')
          text = path.read_text(encoding='utf-8')
          old1 = '''    cover_evidence_ids = set(plan.get("cover", {}).get("anchor_candidates") or [])
    cover_package_ids: list[str] = []
'''
          new1 = '''    cover_anchor_candidates = set(plan.get("cover", {}).get("anchor_candidates") or [])
    unknown_cover_anchors = sorted(cover_anchor_candidates - set(expected_ids))
    if unknown_cover_anchors:
        raise ValueError(f"Architecture cover anchors reference unknown article packages: {unknown_cover_anchors}")
    cover_package_ids = [package_id for package_id in expected_ids if package_id in cover_anchor_candidates]
'''
          old2 = '''        primary_ids = {
            item.get("evidence_task_id")
            for item in package.get("primary_evidence") or []
            if isinstance(item, dict)
        }
        if primary_ids & cover_evidence_ids:
            cover_package_ids.append(package_id)
'''
          if text.count(old1) != 1 or text.count(old2) != 1:
              raise SystemExit('expected finalizer anchor snippets not found exactly once')
          text = text.replace(old1, new1).replace(old2, '')
          path.write_text(text, encoding='utf-8')
      - name: Remove one-shot workflow and commit fix
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/one-shot-fix-special-finalizer-cover-anchors.yml
          git add scripts/finalize_special_validated_draft.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Fix Special finalizer cover anchor resolution'
          git push origin HEAD:fix/special-finalizer-cover-anchors
