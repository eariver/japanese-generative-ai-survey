name: One-shot fix Special finalizer cover anchors

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/one-shot-fix-special-finalizer-cover-anchors.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
      - name: Patch package-id cover anchors
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          path = Path('scripts/finalize_special_validated_draft.py')
          text = path.read_text(encoding='utf-8')
          old1 = (
              '    cover_evidence_ids = set(plan.get("cover", {}).get("anchor_candidates") or [])\n'
              '    cover_package_ids: list[str] = []\n'
          )
          new1 = (
              '    cover_anchor_candidates = set(plan.get("cover", {}).get("anchor_candidates") or [])\n'
              '    unknown_cover_anchors = sorted(cover_anchor_candidates - set(expected_ids))\n'
              '    if unknown_cover_anchors:\n'
              '        raise ValueError(f"Architecture cover anchors reference unknown article packages: {unknown_cover_anchors}")\n'
              '    cover_package_ids = [package_id for package_id in expected_ids if package_id in cover_anchor_candidates]\n'
          )
          old2 = (
              '        primary_ids = {\n'
              '            item.get("evidence_task_id")\n'
              '            for item in package.get("primary_evidence") or []\n'
              '            if isinstance(item, dict)\n'
              '        }\n'
              '        if primary_ids & cover_evidence_ids:\n'
              '            cover_package_ids.append(package_id)\n'
          )
          if text.count(old1) != 1 or text.count(old2) != 1:
              raise SystemExit(f'expected snippets not found exactly once: old1={text.count(old1)} old2={text.count(old2)}')
          path.write_text(text.replace(old1, new1).replace(old2, ''), encoding='utf-8')
          PY
      - name: Commit repair and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/one-shot-fix-special-finalizer-cover-anchors.yml
          git add scripts/finalize_special_validated_draft.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Fix Special finalizer cover anchor resolution'
          git push origin HEAD:main
