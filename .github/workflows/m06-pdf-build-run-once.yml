name: Run M06 PDF build once

on:
  pull_request:
    types: [synchronize]

permissions:
  contents: write

concurrency:
  group: special-pdf-2026-M06-run-once
  cancel-in-progress: false

jobs:
  build:
    if: github.event.pull_request.number == 45 && github.event.pull_request.head.ref == 'special/2026-M06-work'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout current control code
        uses: actions/checkout@v6
        with:
          ref: main
          path: control-src
          fetch-depth: 1
      - name: Checkout Special work branch
        uses: actions/checkout@v6
        with:
          ref: special/2026-M06-work
          path: worktree
          fetch-depth: 0
      - name: Resolve and verify state-pinned PDF source
        id: source
        shell: bash
        run: |
          set -euo pipefail
          python - >> "$GITHUB_OUTPUT" <<'PY'
          import hashlib,json,pathlib
          root=pathlib.Path('worktree'); issue='SP-2026-M06'
          state=json.load(open(root/'sources'/issue/'pipeline-state.json',encoding='utf-8'))
          assert state['lifecycle_state']=='VALIDATED_DRAFT', state['lifecycle_state']
          assert state['gates']['claim_and_chronology_validation']=='passed'
          assert state['gates']['latex_build']=='pending'
          prov=state['provenance']['validated_issue_source']
          manifest=root/prov['path']; digest=hashlib.sha256(manifest.read_bytes()).hexdigest()
          assert digest==prov['sha256']
          data=json.load(open(manifest,encoding='utf-8'))
          assert data.get('reader_facing_technical_notes',{}).get('evidence_ids_rendered_in_pdf') is False
          source_dir=manifest.parent; main=source_dir/data['main_tex']['path']; assert main.is_file()
          print(f'source_manifest={manifest.as_posix()}')
          print(f'source_manifest_sha256={digest}')
          print(f'source_dir={source_dir.as_posix()}')
          print(f"source_version={data.get('source_version','v0.2')}")
          PY
      - name: Pin current main survey style
        id: build_style
        shell: bash
        env:
          SOURCE_DIR: ${{ steps.source.outputs.source_dir }}
        run: |
          set -euo pipefail
          cp control-src/templates/survey/jgaisurvey.sty "$SOURCE_DIR/jgaisurvey.sty"
          control_commit=$(git -C control-src rev-parse HEAD)
          style_sha=$(sha256sum control-src/templates/survey/jgaisurvey.sty | awk '{print $1}')
          test "$style_sha" = "$(sha256sum "$SOURCE_DIR/jgaisurvey.sty" | awk '{print $1}')"
          echo "control_commit=$control_commit" >> "$GITHUB_OUTPUT"
          echo "style_sha256=$style_sha" >> "$GITHUB_OUTPUT"
      - name: Set reproducible PDF timestamp
        shell: bash
        run: echo 'SOURCE_DATE_EPOCH=1786406400' >> "$GITHUB_ENV"
      - name: Compile Special issue with LuaLaTeX
        uses: xu-cheng/latex-action@v4
        with:
          root_file: main.tex
          working_directory: ${{ steps.source.outputs.source_dir }}
          texlive_version: 2026
          latexmk_use_lualatex: true
      - name: Analyze final TeX log and page count
        id: analyze
        shell: bash
        env:
          SOURCE_DIR: ${{ steps.source.outputs.source_dir }}
          SOURCE_MANIFEST: ${{ steps.source.outputs.source_manifest }}
          SOURCE_MANIFEST_SHA256: ${{ steps.source.outputs.source_manifest_sha256 }}
          SOURCE_VERSION: ${{ steps.source.outputs.source_version }}
          CONTROL_COMMIT: ${{ steps.build_style.outputs.control_commit }}
          STYLE_SHA256: ${{ steps.build_style.outputs.style_sha256 }}
        run: |
          set -euo pipefail
          pdf="$SOURCE_DIR/main.pdf"; log="$SOURCE_DIR/main.log"; test -s "$pdf" && test -s "$log"
          bad=$(grep -E -n 'LaTeX Warning: (There were undefined references|Citation .* undefined)|Package biblatex Warning: Please (re)?run|Overfull \\hbox|Underfull \\hbox|Missing character:' "$log" || true)
          pages=$(python - "$log" <<'PY'
          import re,sys
          text=open(sys.argv[1],encoding='utf-8',errors='replace').read(); m=re.findall(r'Output written on .*?\((\d+) pages?',text,re.S)
          if not m: raise SystemExit('could not determine PDF page count')
          print(m[-1])
          PY
          )
          digest=$(sha256sum "$pdf" | awk '{print $1}'); if [ -z "$bad" ]; then clean=true; else clean=false; fi
          python - "$pages" "$digest" "$clean" "$bad" "$CONTROL_COMMIT" "$STYLE_SHA256" "$SOURCE_MANIFEST" "$SOURCE_MANIFEST_SHA256" "$SOURCE_VERSION" <<'PY'
          import json,sys
          pages,digest,clean,bad,commit,style,manifest,msha,version=sys.argv[1:]
          out={'schema_version':'1.0','issue_id':'SP-2026-M06','special_slug':'2026-M06','source_version':version,
               'source_manifest_path':manifest,'source_manifest_sha256':msha,'page_count':int(pages),'pdf_sha256':digest,
               'log_clean':clean=='true','log_gate_findings':bad.splitlines() if bad else [],'page_target_min':32,'page_target_max':40,
               'build_style':{'source_ref':'main','control_commit_sha':commit,'path':'templates/survey/jgaisurvey.sty','sha256':style}}
          open('special-pdf-build-audit.json','w',encoding='utf-8').write(json.dumps(out,ensure_ascii=False,indent=2)+'\n'); print(json.dumps(out,ensure_ascii=False,indent=2))
          PY
          echo "page_count=$pages" >> "$GITHUB_OUTPUT"; echo "pdf_sha256=$digest" >> "$GITHUB_OUTPUT"; echo "log_clean=$clean" >> "$GITHUB_OUTPUT"
      - name: Upload PDF preview artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: japanese-generative-ai-survey-special-2026-M06-${{ steps.source.outputs.source_version }}
          path: |
            ${{ steps.source.outputs.source_dir }}/main.pdf
            ${{ steps.source.outputs.source_dir }}/main.log
            special-pdf-build-audit.json
          if-no-files-found: error
          retention-days: 14
      - name: Enforce log and page budget
        shell: bash
        env:
          PAGE_COUNT: ${{ steps.analyze.outputs.page_count }}
          LOG_CLEAN: ${{ steps.analyze.outputs.log_clean }}
        run: |
          set -euo pipefail
          test "$LOG_CLEAN" = true
          test "$PAGE_COUNT" -ge 32
          test "$PAGE_COUNT" -le 40
      - name: Record successful PDF gate and remove wrapper
        working-directory: worktree
        shell: bash
        env:
          PAGE_COUNT: ${{ steps.analyze.outputs.page_count }}
          PDF_SHA256: ${{ steps.analyze.outputs.pdf_sha256 }}
          RUN_ID: ${{ github.run_id }}
          CONTROL_COMMIT: ${{ steps.build_style.outputs.control_commit }}
          STYLE_SHA256: ${{ steps.build_style.outputs.style_sha256 }}
          SOURCE_MANIFEST: ${{ steps.source.outputs.source_manifest }}
          SOURCE_MANIFEST_SHA256: ${{ steps.source.outputs.source_manifest_sha256 }}
          SOURCE_VERSION: ${{ steps.source.outputs.source_version }}
        run: |
          set -euo pipefail
          python - "$PAGE_COUNT" "$PDF_SHA256" "$RUN_ID" "$CONTROL_COMMIT" "$STYLE_SHA256" "$SOURCE_MANIFEST" "$SOURCE_MANIFEST_SHA256" "$SOURCE_VERSION" <<'PY'
          import json,sys,pathlib
          pages,pdf_sha,run_id,commit,style,manifest,msha,version=sys.argv[1:]
          p=pathlib.Path('sources/SP-2026-M06/pipeline-state.json'); state=json.load(open(p,encoding='utf-8'))
          assert state['lifecycle_state']=='VALIDATED_DRAFT'; state['lifecycle_state']='RELEASE_CANDIDATE'; state['gates']['latex_build']='passed'
          state.setdefault('provenance',{})['latex_build']={'workflow_run_id':int(run_id),'pdf_sha256':pdf_sha,'page_count':int(pages),'source_version':version,
             'validated_issue_source_path':manifest,'validated_issue_source_sha256':msha,'build_style':{'control_commit_sha':commit,'path':'templates/survey/jgaisurvey.sty','sha256':style}}
          p.write_text(json.dumps(state,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          PY
          git config user.name 'github-actions[bot]'; git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/m06-pdf-build-run-once.yml; git add sources/SP-2026-M06/pipeline-state.json
          git commit -m 'Record successful PDF build for SP-2026-M06'; git push origin HEAD:special/2026-M06-work
