name: One-shot fix Special publication layout and taxonomy contract v3

on:
  push:
    branches:
      - fix/special-publication-layout-taxonomy-contract

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/special-publication-layout-taxonomy-contract
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Execute corrected v2 patch steps
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import subprocess

          workflow = Path('.github/workflows/one-shot-fix-special-publication-layout-taxonomy-contract-v2.yml')
          lines = workflow.read_text(encoding='utf-8').splitlines()
          wanted = [
              'Patch shared reader taxonomy contract',
              'Add generic Special publication layout check',
              'Enforce layout check in canonical Special PDF build',
              'Add regression tests',
              'Run focused regression tests',
          ]

          def extract(name: str) -> str:
              marker = f'      - name: {name}'
              try:
                  start = lines.index(marker)
              except ValueError as exc:
                  raise SystemExit(f'missing v2 step: {name}') from exc
              run_idx = next(i for i in range(start + 1, len(lines)) if lines[i] == '        run: |')
              body = []
              for line in lines[run_idx + 1:]:
                  if line.startswith('      - name: ') or line.startswith('      - uses: '):
                      break
                  if line.startswith('          '):
                      body.append(line[10:])
                  elif not line.strip():
                      body.append('')
                  else:
                      raise SystemExit(f'unexpected indentation in {name}: {line!r}')
              script = '\n'.join(body) + '\n'
              script = script.replace("sed -i 's/^          //' scripts/special_publication_layout_check.py\n", '')
              script = script.replace("sed -i 's/^          //' tests/test_special_publication_contract_regressions.py\n", '')
              return script

          for name in wanted:
              script = extract(name)
              print(f'--- running: {name} ---')
              subprocess.run(['bash', '-euo', 'pipefail', '-c', script], check=True)
          PY
      - name: Commit shared contract repair and remove one-shot workflows
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/one-shot-fix-special-publication-layout-taxonomy-contract*.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Harden Special publication layout and reader taxonomy contracts'
          git push origin HEAD:fix/special-publication-layout-taxonomy-contract
