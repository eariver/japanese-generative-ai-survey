name: One-time SP-2025-H2 preview rebuild dispatcher

on:
  push:
    branches:
      - special/2025-H2-work
    paths:
      - .github/workflows/sp-2025-h2-dispatch-build.yml

permissions:
  actions: write
  contents: write

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: special/2025-H2-work
          fetch-depth: 0
      - name: Dispatch canonical PDF build on main
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run build-special-pdf.yml --ref main -f special_slug=2025-H2
      - name: Remove one-time dispatcher
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/sp-2025-h2-dispatch-build.yml
          git commit -m 'Remove one-time SP-2025-H2 preview rebuild dispatcher'
          git push origin HEAD:special/2025-H2-work
