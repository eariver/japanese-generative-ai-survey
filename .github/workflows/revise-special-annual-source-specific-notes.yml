name: Revise Special Annual source-specific Technical Notes

on:
  workflow_dispatch:
    inputs:
      special_slug:
        required: true
        type: string
      source_version:
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: special-annual-source-specific-notes-${{ inputs.special_slug }}
  cancel-in-progress: false

jobs:
  revise:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout current control code
        uses: actions/checkout@v6
        with:
          ref: main
          path: control-src
          fetch-depth: 1
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Resolve Annual Special edition
        id: edition
        shell: bash
        env:
          SPECIAL_SLUG: ${{ inputs.special_slug }}
        run: |
          set -euo pipefail
          manifest="control-src/specials/${SPECIAL_SLUG}/edition.json"
          test -s "$manifest"
          python control-src/scripts/special_pipeline.py --config control-src/config/special-pipeline.json validate --manifest "$manifest"
          python - "$manifest" "$GITHUB_OUTPUT" <<'PY'
          import json,sys
          manifest,out=sys.argv[1:]
          value=json.load(open(manifest,encoding='utf-8'))
          assert value['edition_kind']=='RETROSPECTIVE_PERIOD'
          assert value['special_slug'].endswith('-Y')
          with open(out,'a',encoding='utf-8') as f:
              f.write(f"special_id={value['special_id']}\n")
              f.write(f"work_branch={value['paths']['work_branch']}\n")
          PY
      - name: Checkout Annual Special work branch
        uses: actions/checkout@v6
        with:
          ref: ${{ steps.edition.outputs.work_branch }}
          path: worktree
          fetch-depth: 0
      - name: Verify immutable upstream and pre-Publication-Preview boundary
        shell: bash
        env:
          SPECIAL_ID: ${{ steps.edition.outputs.special_id }}
          SOURCE_VERSION: ${{ inputs.source_version }}
        run: |
          set -euo pipefail
          python control-src/scripts/raw_provenance.py --repo-root worktree --issue-id "$SPECIAL_ID" check
          python - "$SPECIAL_ID" "$SOURCE_VERSION" <<'PY'
          import json,pathlib,sys
          issue,version=sys.argv[1:]
          root=pathlib.Path('worktree')
          state=json.load(open(root/'sources'/issue/'pipeline-state.json',encoding='utf-8'))
          assert state['lifecycle_state']=='RELEASE_CANDIDATE'
          assert state['gates']['issue_architecture']=='passed'
          assert state['gates']['article_draft']=='passed'
          assert state['gates']['claim_and_chronology_validation']=='passed'
          assert state['gates']['latex_build']=='passed'
          assert state['gates']['visual_review']=='pending'
          assert state['gates']['freeze']=='pending'
          assert 'publication_preview' not in state.get('provenance',{})
          marker=root/'sources'/issue/'editorial'/f'layout-revision-{version}.json'
          value=json.load(open(marker,encoding='utf-8'))
          changes=value.get('layout_changes') or {}
          constraints=value.get('constraints') or {}
          assert changes.get('annual_source_specific_notes_v1') is True
          assert constraints.get('new_external_evidence_allowed') is False
          assert constraints.get('selected_evidence_only') is True
          assert constraints.get('accepted_article_claims_changed') is False
          assert constraints.get('evidence_cards_mutated') is False
          PY
      - name: Build immutable Annual Technical Notes revision
        shell: bash
        env:
          SPECIAL_ID: ${{ steps.edition.outputs.special_id }}
          SPECIAL_SLUG: ${{ inputs.special_slug }}
          SOURCE_VERSION: ${{ inputs.source_version }}
        run: |
          set -euo pipefail
          PYTHONPATH=control-src python control-src/scripts/revise_special_annual_source_specific_notes.py \
            --repo-root worktree \
            --special-slug "$SPECIAL_SLUG" \
            --issue-id "$SPECIAL_ID" \
            --source-version "$SOURCE_VERSION" \
            > annual-source-specific-notes-audit.json
          cat annual-source-specific-notes-audit.json
      - name: Verify revised Annual source
        shell: bash
        env:
          SPECIAL_ID: ${{ steps.edition.outputs.special_id }}
          SOURCE_VERSION: ${{ inputs.source_version }}
        run: |
          set -euo pipefail
          python - "$SPECIAL_ID" "$SOURCE_VERSION" <<'PY'
          import hashlib,json,pathlib,sys
          issue,version=sys.argv[1:]
          root=pathlib.Path('worktree')
          state=json.load(open(root/'sources'/issue/'pipeline-state.json',encoding='utf-8'))
          assert state['lifecycle_state']=='VALIDATED_DRAFT'
          assert state['gates']['issue_architecture']=='passed'
          assert state['gates']['article_draft']=='passed'
          assert state['gates']['claim_and_chronology_validation']=='passed'
          assert state['gates']['latex_build']=='pending'
          assert state['gates']['visual_review']=='pending'
          assert state['gates']['freeze']=='pending'
          source=state['provenance']['validated_issue_source']
          assert source['source_version']==version
          path=root/source['path']
          assert path.is_file()
          assert hashlib.sha256(path.read_bytes()).hexdigest()==source['sha256']
          manifest=json.load(open(path,encoding='utf-8'))
          assert manifest['status']=='VALIDATED_ANNUAL_SOURCE_SPECIFIC_NOTES_REVISION'
          reader=manifest['reader_facing_technical_notes']
          assert reader['source_specific_detail_contract']=='SCREENING_BACKED_FAIL_CLOSED'
          assert reader['generic_fallback_policy']=='forbidden-fail-closed'
          assert reader['generic_fallback_findings']==0
          assert reader['source_specific_detail_visible_card_count']==reader['source_specific_detail_enrichment_count']
          assert reader['source_specific_detail_visible_card_count']>=1
          assert reader['subject_entity_binding_contract']=='SUBJECT_COMPONENT_VARIANT_PROPERTY_BINDING_V3'
          assert reader['event_window_contract']=='ZERO_PADDED_DATE_AND_LONG_HTML_FAIL_CLOSED_V1'
          chronology=state['provenance']['annual_chronology']
          assert chronology['source_version']==version
          assert chronology['event_count']==75
          assert chronology['unresolved_date_count']==3
          chronology_path=root/chronology['path']
          assert chronology_path.is_file()
          assert hashlib.sha256(chronology_path.read_bytes()).hexdigest()==chronology['sha256']
          assert not (root/'sources'/issue/'preview-transfer').exists()
          PY
      - name: Commit revised Annual source
        shell: bash
        env:
          SPECIAL_ID: ${{ steps.edition.outputs.special_id }}
          SPECIAL_SLUG: ${{ inputs.special_slug }}
          SOURCE_VERSION: ${{ inputs.source_version }}
        run: |
          set -euo pipefail
          cd worktree
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A "surveys/special/${SPECIAL_SLUG}" "sources/${SPECIAL_ID}"
          git diff --cached --quiet && { echo 'No Annual Technical Notes revision changes to commit' >&2; exit 1; }
          git commit -m "Revise ${SPECIAL_SLUG} Technical Notes for #139 (${SOURCE_VERSION})"
          git push origin HEAD:${{ steps.edition.outputs.work_branch }}
      - name: Upload repair audit
        uses: actions/upload-artifact@v4
        with:
          name: annual-source-specific-notes-${{ inputs.special_slug }}-${{ inputs.source_version }}
          path: annual-source-specific-notes-audit.json
          retention-days: 14
