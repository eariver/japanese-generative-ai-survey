name: Revise Special interactive Evidence pre-selection

on:
  workflow_dispatch:
    inputs:
      special_slug:
        required: true
        type: string
      prior_evidence_run_sha:
        required: true
        type: string
      review_reference:
        required: true
        type: string

permissions:
  contents: write
  actions: read

concurrency:
  group: special-interactive-evidence-${{ inputs.special_slug }}
  cancel-in-progress: false

jobs:
  evidence-revision:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout current control code
        uses: actions/checkout@v6
        with:
          ref: main
          path: control-src
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Resolve Special edition
        id: edition
        shell: bash
        env:
          SPECIAL_SLUG: ${{ inputs.special_slug }}
        run: |
          set -euo pipefail
          manifest="control-src/specials/${SPECIAL_SLUG}/edition.json"
          test -s "$manifest"
          python control-src/scripts/special_pipeline.py --config control-src/config/special-pipeline.json validate --manifest "$manifest"
          echo "special_id=$(python -c "import json; print(json.load(open('$manifest'))['special_id'])")" >> "$GITHUB_OUTPUT"
          echo "work_branch=$(python -c "import json; print(json.load(open('$manifest'))['paths']['work_branch'])")" >> "$GITHUB_OUTPUT"
      - name: Checkout Special work branch
        uses: actions/checkout@v6
        with:
          ref: ${{ steps.edition.outputs.work_branch }}
          path: worktree
          fetch-depth: 0
      - name: Verify pre-selection revision boundary and resolve prior package basis
        id: prior
        shell: bash
        env:
          SPECIAL_ID: ${{ steps.edition.outputs.special_id }}
          PRIOR_SHA: ${{ inputs.prior_evidence_run_sha }}
        run: |
          set -euo pipefail
          python control-src/scripts/raw_provenance.py --repo-root worktree --issue-id "$SPECIAL_ID" check
          state="worktree/sources/${SPECIAL_ID}/pipeline-state.json"
          prior="worktree/sources/${SPECIAL_ID}/evidence/runs/${PRIOR_SHA}/acceptance.json"
          test -s "$state"
          test -s "$prior"
          python - "$state" "$prior" "$PRIOR_SHA" "$GITHUB_OUTPUT" <<'PY'
          import json, re, sys
          state=json.load(open(sys.argv[1],encoding='utf-8'))
          prior=json.load(open(sys.argv[2],encoding='utf-8'))
          prior_sha=sys.argv[3]
          output=sys.argv[4]
          if not re.fullmatch(r'[0-9a-f]{64}', prior_sha):
              raise SystemExit('prior Evidence SHA must be lowercase SHA-256')
          assert state['lifecycle_state']=='EVIDENCE_REVIEWED', state['lifecycle_state']
          assert state['gates']['evidence_normalized']=='passed'
          assert state['gates']['candidate_selection']=='pending'
          assert state['gates']['issue_architecture']=='pending'
          assert prior['status']=='ACCEPTED'
          assert prior['result_set_sha256']==prior_sha
          pkg=prior['evidence_package']
          with open(output,'a',encoding='utf-8') as fh:
              fh.write(f"screening_sha={pkg['screening_result_set_sha256']}\n")
              fh.write(f"source_ref={pkg['source_ref']}\n")
              fh.write(f"source_commit={pkg['source_commit_sha']}\n")
              fh.write(f"pipeline_state_sha={pkg['pipeline_state_sha256']}\n")
              fh.write(f"package_manifest_sha={pkg['package_manifest_sha256']}\n")
          PY
      - name: Checkout exact prior Evidence basis commit
        uses: actions/checkout@v6
        with:
          ref: ${{ steps.prior.outputs.source_commit }}
          path: basis
          fetch-depth: 1
      - name: Rebuild and verify exact prior Evidence package
        id: package
        shell: bash
        env:
          SPECIAL_ID: ${{ steps.edition.outputs.special_id }}
          SCREENING_SHA: ${{ steps.prior.outputs.screening_sha }}
          SOURCE_REF: ${{ steps.prior.outputs.source_ref }}
          SOURCE_COMMIT: ${{ steps.prior.outputs.source_commit }}
          PIPELINE_STATE_SHA: ${{ steps.prior.outputs.pipeline_state_sha }}
          PACKAGE_MANIFEST_SHA: ${{ steps.prior.outputs.package_manifest_sha }}
        run: |
          set -euo pipefail
          basis_state="basis/sources/${SPECIAL_ID}/pipeline-state.json"
          test -s "$basis_state"
          test "$(sha256sum "$basis_state" | cut -d' ' -f1)" = "$PIPELINE_STATE_SHA"
          rm -rf revision-package
          PYTHONPATH=basis python basis/scripts/prepare_special_evidence_run.py \
            --repo-root basis --output-root revision-package --issue-id "$SPECIAL_ID" \
            --screening-run-sha "$SCREENING_SHA" --source-ref "$SOURCE_REF" --source-commit "$SOURCE_COMMIT" >/dev/null
          test "$(sha256sum revision-package/evidence-execution-package.json | cut -d' ' -f1)" = "$PACKAGE_MANIFEST_SHA"
          echo "basis_state=$basis_state" >> "$GITHUB_OUTPUT"
      - name: Assemble current compact Evidence overrides
        id: input
        shell: bash
        env:
          SPECIAL_ID: ${{ steps.edition.outputs.special_id }}
          SCREENING_SHA: ${{ steps.prior.outputs.screening_sha }}
        run: |
          set -euo pipefail
          directory="worktree/sources/${SPECIAL_ID}/evidence/interactive-overrides-v0.1"
          manifest="${directory}/manifest.json"
          assembled="worktree/.tmp/assembled-evidence-overrides.json"
          mkdir -p worktree/.tmp
          test -s "$manifest"
          python -m json.tool "$manifest" >/dev/null
          python - "$directory" "$assembled" "$SCREENING_SHA" <<'PY'
          import json, pathlib, sys
          directory=pathlib.Path(sys.argv[1]); output=pathlib.Path(sys.argv[2]); screening=sys.argv[3]
          doc=json.loads((directory/'manifest.json').read_text(encoding='utf-8'))
          if doc.get('screening_run_sha') != screening:
              raise SystemExit('Evidence override screening SHA differs from prior accepted Evidence basis')
          overrides=[]
          parts=sorted(directory.glob('part-*.json'))
          if not parts:
              raise SystemExit('no Evidence override part files found')
          for path in parts:
              value=json.loads(path.read_text(encoding='utf-8'))
              items=value.get('overrides')
              if not isinstance(items,list) or not items:
                  raise SystemExit(f'{path}: overrides must be non-empty array')
              overrides.extend(items)
          doc['overrides']=overrides
          output.write_text(json.dumps(doc,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          print(f'assembled {len(overrides)} Evidence overrides from {len(parts)} review parts')
          PY
          echo "overrides_path=$assembled" >> "$GITHUB_OUTPUT"
      - name: Generate, validate, and accept append-only Evidence revision
        shell: bash
        env:
          SPECIAL_ID: ${{ steps.edition.outputs.special_id }}
          PRIOR_SHA: ${{ inputs.prior_evidence_run_sha }}
          OVERRIDES_PATH: ${{ steps.input.outputs.overrides_path }}
          BASIS_STATE: ${{ steps.package.outputs.basis_state }}
          REVIEW_REFERENCE: ${{ inputs.review_reference }}
        run: |
          set -euo pipefail
          PYTHONPATH=control-src python control-src/scripts/revise_special_interactive_evidence.py \
            --repo-root worktree --issue-id "$SPECIAL_ID" --prior-evidence-run-sha "$PRIOR_SHA" \
            --package-root revision-package --basis-state "$BASIS_STATE" --overrides "$OVERRIDES_PATH" \
            --review-reference "$REVIEW_REFERENCE" --audit-output evidence-revision-audit.json
      - name: Assert pipeline state unchanged and commit revision
        working-directory: worktree
        shell: bash
        env:
          SPECIAL_ID: ${{ steps.edition.outputs.special_id }}
          WORK_BRANCH: ${{ steps.edition.outputs.work_branch }}
        run: |
          set -euo pipefail
          git diff --exit-code -- "sources/${SPECIAL_ID}/pipeline-state.json"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "sources/${SPECIAL_ID}/evidence"
          git diff --cached --quiet && exit 0
          git commit -m "Revise interactive Evidence for ${SPECIAL_ID} before Selection"
          git push origin "HEAD:${WORK_BRANCH}"
      - name: Upload Evidence revision audit
        uses: actions/upload-artifact@v7
        with:
          name: special-interactive-evidence-revision-${{ inputs.special_slug }}
          path: evidence-revision-audit.json
          if-no-files-found: error
          retention-days: 14
