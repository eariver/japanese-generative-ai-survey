name: Weekly pipeline spine

on:
  schedule:
    # Saturday 00:30 UTC is after Friday 18:00 America/New_York in both EDT and EST.
    - cron: '30 0 * * 6'
  workflow_dispatch:
    inputs:
      command:
        description: Deterministic pipeline command
        required: true
        default: plan
        type: choice
        options:
          - plan
          - source-intake
          - validate
          - raw-index
          - raw-check
      issue_id:
        description: Required for source-intake/validate/raw-index/raw-check, for example 2026-W32
        required: false
        type: string
      collector:
        description: Source-intake collector set
        required: true
        default: all
        type: choice
        options:
          - all
          - arxiv
          - github
          - official
      target:
        description: Validation target
        required: true
        default: draft
        type: choice
        options:
          - selection
          - draft
          - release-candidate
          - frozen
  push:
    paths:
      - 'scripts/weekly_pipeline.py'
      - 'scripts/raw_provenance.py'
      - 'scripts/generate_grok_trend_run.py'
      - 'scripts/source_intake.py'
      - 'scripts/build_screening_index.py'
      - 'tests/test_*.py'
      - 'config/weekly-pipeline.json'
      - 'config/source-intake.json'
      - 'config/prompts/grok/x-trend-sensor-v0.4.md'
      - 'schemas/weekly-pipeline-state.schema.json'
      - 'schemas/collector-instruction.schema.json'
      - 'schemas/collector-run.schema.json'
      - 'schemas/raw-source-index.schema.json'
      - 'schemas/screening-record.schema.json'
      - 'schemas/weekly-release-manifest.schema.json'
      - 'sources/*/raw-index.json'
      - 'sources/*/release-manifest.json'
      - 'sources/**/raw/**'
      - '.github/workflows/weekly-pipeline.yml'
      - '.github/workflows/build-weekly-survey.yml'
      - '.github/workflows/release-weekly-survey.yml'
  pull_request:
    paths:
      - 'scripts/weekly_pipeline.py'
      - 'scripts/raw_provenance.py'
      - 'scripts/generate_grok_trend_run.py'
      - 'scripts/source_intake.py'
      - 'scripts/build_screening_index.py'
      - 'tests/test_*.py'
      - 'config/weekly-pipeline.json'
      - 'config/source-intake.json'
      - 'config/prompts/grok/x-trend-sensor-v0.4.md'
      - 'schemas/weekly-pipeline-state.schema.json'
      - 'schemas/collector-instruction.schema.json'
      - 'schemas/collector-run.schema.json'
      - 'schemas/raw-source-index.schema.json'
      - 'schemas/screening-record.schema.json'
      - 'schemas/weekly-release-manifest.schema.json'
      - 'sources/*/raw-index.json'
      - 'sources/*/release-manifest.json'
      - 'sources/**/raw/**'
      - '.github/workflows/weekly-pipeline.yml'
      - '.github/workflows/build-weekly-survey.yml'
      - '.github/workflows/release-weekly-survey.yml'

permissions:
  contents: read

concurrency:
  group: weekly-pipeline-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Validate JSON configuration and schema syntax
        shell: bash
        run: |
          set -euo pipefail
          python -m json.tool config/weekly-pipeline.json >/dev/null
          python -m json.tool config/source-intake.json >/dev/null
          python -m json.tool schemas/weekly-pipeline-state.schema.json >/dev/null
          python -m json.tool schemas/collector-instruction.schema.json >/dev/null
          python -m json.tool schemas/collector-run.schema.json >/dev/null
          python -m json.tool schemas/raw-source-index.schema.json >/dev/null
          python -m json.tool schemas/screening-record.schema.json >/dev/null
          python -m json.tool schemas/weekly-release-manifest.schema.json >/dev/null
          while IFS= read -r manifest; do
            python -m json.tool "$manifest" >/dev/null
          done < <(find sources -mindepth 2 -maxdepth 2 -name release-manifest.json -type f | sort)

      - name: Run pipeline unit tests
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest discover -s tests -p 'test_*.py' -v

  raw-integrity:
    needs: test
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Check every committed raw provenance baseline
        shell: bash
        run: |
          set -euo pipefail
          found=0
          while IFS= read -r index; do
            found=1
            issue_id="$(basename "$(dirname "$index")")"
            echo "Checking raw provenance for ${issue_id}"
            python scripts/raw_provenance.py --issue-id "$issue_id" check
          done < <(find sources -mindepth 2 -maxdepth 2 -name raw-index.json -type f | sort)
          if [ "$found" -eq 0 ]; then
            echo 'No committed raw provenance baselines found; nothing to check.'
          fi

  plan:
    needs: test
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.command == 'plan')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build weekly operational plan
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out/weekly-pipeline
          python scripts/weekly_pipeline.py plan \
            --output out/weekly-pipeline/plan.json \
            --markdown-output out/weekly-pipeline/plan.md

      - name: Generate Grok Trend Sensor run instruction when collection anchor is available
        shell: bash
        run: |
          set -euo pipefail
          if python - <<'PY'
          import json
          with open('out/weekly-pipeline/plan.json', encoding='utf-8') as fh:
              plan = json.load(fh)
          raise SystemExit(0 if plan.get('collection_window_start') else 1)
          PY
          then
            python scripts/generate_grok_trend_run.py \
              --plan out/weekly-pipeline/plan.json \
              --markdown-output out/weekly-pipeline/grok-trend-run.md \
              --metadata-output out/weekly-pipeline/grok-trend-instruction.json
          else
            printf '%s\n' \
              'Grok run instruction was not generated because collection_window_start is unset.' \
              'Bootstrap a prior successful collection anchor before unattended collection.' \
              > out/weekly-pipeline/grok-trend-run-NOT-GENERATED.txt
          fi

      - name: Upload weekly plan artifact
        uses: actions/upload-artifact@v7
        with:
          name: weekly-pipeline-plan
          path: out/weekly-pipeline/
          if-no-files-found: error
          retention-days: 14

  source-intake:
    needs: test
    if: github.event_name == 'workflow_dispatch' && inputs.command == 'source-intake'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Validate issue input and build issue-specific plan
        shell: bash
        env:
          EXPECTED_ISSUE_ID: ${{ inputs.issue_id }}
        run: |
          set -euo pipefail
          if [ -z "$EXPECTED_ISSUE_ID" ]; then
            echo '::error::issue_id is required when command=source-intake.'
            exit 2
          fi
          mkdir -p out/source-intake-control
          python scripts/weekly_pipeline.py plan \
            --issue-id "$EXPECTED_ISSUE_ID" \
            --output out/source-intake-control/plan.json \
            --markdown-output out/source-intake-control/plan.md
          python - <<'PY'
          import json
          with open('out/source-intake-control/plan.json', encoding='utf-8') as fh:
              plan = json.load(fh)
          if not plan.get('collection_window_start') or not plan.get('collection_window_end'):
              raise SystemExit('source-intake plan has an incomplete collection window')
          print(
              f"Source intake plan: issue={plan['issue_id']} mode={plan.get('automation_mode')} "
              f"start={plan['collection_window_start']} end={plan['collection_window_end']}"
          )
          PY

      - name: Run reproducible source intake
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python scripts/source_intake.py \
            --plan out/source-intake-control/plan.json \
            --collector '${{ inputs.collector }}' \
            --output-root out/source-intake

      - name: Build deterministic screening index and bounded batches
        shell: bash
        run: |
          set -euo pipefail
          python scripts/build_screening_index.py \
            --input-root out/source-intake \
            --output-dir out/source-intake-screening \
            --issue-id '${{ inputs.issue_id }}' \
            --max-records 40 \
            --max-json-chars 80000

      - name: Upload source intake artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: weekly-source-intake-${{ inputs.issue_id }}
          path: |
            out/source-intake/
            out/source-intake-control/
            out/source-intake-screening/
          if-no-files-found: warn
          retention-days: 14

  validate:
    needs: test
    if: github.event_name == 'workflow_dispatch' && inputs.command == 'validate'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Validate issue input
        shell: bash
        run: |
          set -euo pipefail
          if [ -z '${{ inputs.issue_id }}' ]; then
            echo '::error::issue_id is required when command=validate.'
            exit 2
          fi

      - name: Validate deterministic repository gates
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out/weekly-pipeline
          python scripts/weekly_pipeline.py validate \
            --issue-id '${{ inputs.issue_id }}' \
            --target '${{ inputs.target }}' \
            --output out/weekly-pipeline/validation.json

      - name: Upload validation report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: weekly-pipeline-validation-${{ inputs.issue_id }}
          path: out/weekly-pipeline/
          if-no-files-found: warn
          retention-days: 14

  raw-provenance:
    needs: test
    if: github.event_name == 'workflow_dispatch' && (inputs.command == 'raw-index' || inputs.command == 'raw-check')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Validate issue input
        shell: bash
        run: |
          set -euo pipefail
          if [ -z '${{ inputs.issue_id }}' ]; then
            echo '::error::issue_id is required for raw provenance commands.'
            exit 2
          fi

      - name: Update raw provenance index in checkout
        if: inputs.command == 'raw-index'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out/weekly-pipeline
          python scripts/raw_provenance.py \
            --issue-id '${{ inputs.issue_id }}' \
            --report out/weekly-pipeline/raw-provenance-report.json \
            update
          cp 'sources/${{ inputs.issue_id }}/raw-index.json' out/weekly-pipeline/raw-index.json

      - name: Check committed raw provenance index
        if: inputs.command == 'raw-check'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out/weekly-pipeline
          python scripts/raw_provenance.py \
            --issue-id '${{ inputs.issue_id }}' \
            --report out/weekly-pipeline/raw-provenance-report.json \
            check

      - name: Upload raw provenance artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: weekly-raw-provenance-${{ inputs.issue_id }}
          path: out/weekly-pipeline/
          if-no-files-found: warn
          retention-days: 14
