name: Weekly pipeline spine

on:
  schedule:
    # Saturday 00:30 UTC is after Friday 18:00 America/New_York in both EDT and EST.
    - cron: '30 0 * * 6'
  workflow_dispatch:
    inputs:
      command:
        description: Deterministic pipeline command
        required: true
        default: plan
        type: choice
        options:
          - plan
          - source-intake
          - validate
          - raw-index
          - raw-check
      issue_id:
        description: Required for source-intake/validate/raw-index/raw-check, for example 2026-W32
        required: false
        type: string
      collector:
        description: Source-intake collector set
        required: true
        default: all
        type: choice
        options:
          - all
          - arxiv
          - github
          - official
      target:
        description: Validation target
        required: true
        default: draft
        type: choice
        options:
          - selection
          - draft
          - release-candidate
          - frozen
  push:
    paths:
      - 'scripts/weekly_pipeline.py'
      - 'scripts/raw_provenance.py'
      - 'scripts/generate_grok_trend_run.py'
      - 'scripts/source_intake.py'
      - 'scripts/build_screening_index.py'
      - 'scripts/survey_*.py'
      - 'tests/test_*.py'
      - 'config/weekly-pipeline.json'
      - 'config/source-intake.json'
      - 'config/survey-production-v2-requirements.txt'
      - 'config/prompts/grok/x-trend-sensor-v0.4.md'
      - 'schemas/weekly-pipeline-state.schema.json'
      - 'schemas/collector-instruction.schema.json'
      - 'schemas/collector-run.schema.json'
      - 'schemas/raw-source-index.schema.json'
      - 'schemas/screening-record.schema.json'
      - 'schemas/weekly-release-manifest.schema.json'
      - 'sources/*/raw-index.json'
      - 'sources/*/release-manifest.json'
      - 'sources/**/raw/**'
      - '.github/workflows/weekly-pipeline.yml'
      - '.github/workflows/build-weekly-survey.yml'
      - '.github/workflows/release-weekly-survey.yml'
  pull_request:
    paths:
      - 'scripts/weekly_pipeline.py'
      - 'scripts/raw_provenance.py'
      - 'scripts/generate_grok_trend_run.py'
      - 'scripts/source_intake.py'
      - 'scripts/build_screening_index.py'
      - 'scripts/survey_*.py'
      - 'tests/test_*.py'
      - 'config/weekly-pipeline.json'
      - 'config/source-intake.json'
      - 'config/survey-production-v2-requirements.txt'
      - 'config/prompts/grok/x-trend-sensor-v0.4.md'
      - 'schemas/weekly-pipeline-state.schema.json'
      - 'schemas/collector-instruction.schema.json'
      - 'schemas/collector-run.schema.json'
      - 'schemas/raw-source-index.schema.json'
      - 'schemas/screening-record.schema.json'
      - 'schemas/weekly-release-manifest.schema.json'
      - 'sources/*/raw-index.json'
      - 'sources/*/release-manifest.json'
      - 'sources/**/raw/**'
      - '.github/workflows/weekly-pipeline.yml'
      - '.github/workflows/build-weekly-survey.yml'
      - '.github/workflows/release-weekly-survey.yml'

permissions:
  contents: read

concurrency:
  group: weekly-pipeline-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Survey Production Core v2 test dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install -r config/survey-production-v2-requirements.txt

      - name: Validate JSON configuration and schema syntax
        shell: bash
        run: |
          set -euo pipefail
          python -m json.tool config/weekly-pipeline.json >/dev/null
          python -m json.tool config/source-intake.json >/dev/null
          python -m json.tool schemas/weekly-pipeline-state.schema.json >/dev/null
          python -m json.tool schemas/collector-instruction.schema.json >/dev/null
          python -m json.tool schemas/collector-run.schema.json >/dev/null
          python -m json.tool schemas/raw-source-index.schema.json >/dev/null
          python -m json.tool schemas/screening-record.schema.json >/dev/null
          python -m json.tool schemas/weekly-release-manifest.schema.json >/dev/null
          while IFS= read -r manifest; do
            python -m json.tool "$manifest" >/dev/null
          done < <(find sources -mindepth 2 -maxdepth 2 -name release-manifest.json -type f | sort)

      - name: Run pipeline unit tests
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest discover -s tests -p 'test_*.py' -v

  raw-integrity:
    needs: test
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Check every committed raw provenance baseline
        shell: bash
        run: |
          set -euo pipefail
          found=0
          while IFS= read -r index; do
            found=1
            issue_id="$(basename "$(dirname "$index")")"
            echo "Checking raw provenance for ${issue_id}"
            python scripts/raw_provenance.py --issue-id "$issue_id" check
          done < <(find sources -mindepth 2 -maxdepth 2 -name raw-index.json -type f | sort)
          if [ "$found" -eq 0 ]; then
            echo 'No committed raw provenance baselines found; nothing to check.'
          fi

  plan:
    needs: test
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.command == 'plan')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build weekly operational plan
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out/weekly-pipeline
          python scripts/weekly_pipeline.py plan \
            --output out/weekly-pipeline/plan.json \
            --markdown-output out/weekly-pipeline/plan.md

      - name: Upload plan artifact
        uses: actions/upload-artifact@v4
        with:
          name: weekly-pipeline-plan
          path: out/weekly-pipeline/
          if-no-files-found: error

  source-intake:
    needs: test
    if: github.event_name == 'workflow_dispatch' && inputs.command == 'source-intake'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Validate requested issue
        shell: bash
        env:
          ISSUE_ID: ${{ inputs.issue_id }}
        run: |
          set -euo pipefail
          test -n "$ISSUE_ID"
          python scripts/weekly_pipeline.py validate-issue-id --issue-id "$ISSUE_ID"

      - name: Run source intake collector
        shell: bash
        env:
          ISSUE_ID: ${{ inputs.issue_id }}
          COLLECTOR: ${{ inputs.collector }}
        run: |
          set -euo pipefail
          python scripts/source_intake.py --issue-id "$ISSUE_ID" --collector "$COLLECTOR" --output-root out/source-intake

      - name: Upload source intake artifact
        uses: actions/upload-artifact@v4
        with:
          name: source-intake-${{ inputs.issue_id }}
          path: out/source-intake/
          if-no-files-found: error

  validate:
    needs: test
    if: github.event_name == 'workflow_dispatch' && inputs.command == 'validate'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Validate Weekly pipeline state
        shell: bash
        env:
          ISSUE_ID: ${{ inputs.issue_id }}
          TARGET: ${{ inputs.target }}
        run: |
          set -euo pipefail
          test -n "$ISSUE_ID"
          python scripts/weekly_pipeline.py validate --issue-id "$ISSUE_ID" --target "$TARGET"

  raw-index:
    needs: test
    if: github.event_name == 'workflow_dispatch' && inputs.command == 'raw-index'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Update raw provenance index locally
        shell: bash
        env:
          ISSUE_ID: ${{ inputs.issue_id }}
        run: |
          set -euo pipefail
          test -n "$ISSUE_ID"
          python scripts/raw_provenance.py --issue-id "$ISSUE_ID" update

      - name: Upload raw index candidate
        uses: actions/upload-artifact@v4
        with:
          name: raw-index-${{ inputs.issue_id }}
          path: sources/${{ inputs.issue_id }}/raw-index.json
          if-no-files-found: error

  raw-check:
    needs: test
    if: github.event_name == 'workflow_dispatch' && inputs.command == 'raw-check'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Check raw provenance index
        shell: bash
        env:
          ISSUE_ID: ${{ inputs.issue_id }}
        run: |
          set -euo pipefail
          test -n "$ISSUE_ID"
          python scripts/raw_provenance.py --issue-id "$ISSUE_ID" check
