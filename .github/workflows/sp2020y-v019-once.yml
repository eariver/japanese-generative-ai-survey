name: SP-2020-Y v0.19 one-shot revision

on:
  push:
    branches:
      - special/2020-Y-work
    paths:
      - .github/workflows/sp2020y-v019-once.yml

permissions:
  contents: write

concurrency:
  group: sp-2020-y-v019-once
  cancel-in-progress: false

jobs:
  revise:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout current control code
        uses: actions/checkout@v6
        with:
          ref: main
          path: control-src
          fetch-depth: 1
      - name: Checkout SP-2020-Y work branch
        uses: actions/checkout@v6
        with:
          ref: special/2020-Y-work
          path: worktree
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify pre-revision provenance
        shell: bash
        run: |
          set -euo pipefail
          python control-src/scripts/raw_provenance.py --repo-root worktree --issue-id SP-2020-Y check
          python - <<'PY'
          import json
          from pathlib import Path
          state=json.loads(Path('worktree/sources/SP-2020-Y/pipeline-state.json').read_text(encoding='utf-8'))
          assert state['lifecycle_state']=='RELEASE_CANDIDATE'
          assert state['gates']['latex_build']=='passed'
          assert state['gates']['visual_review']=='pending'
          assert state['gates']['freeze']=='pending'
          assert state['provenance']['validated_issue_source']['source_version']=='v0.18'
          PY
      - name: Build immutable v0.19 tail-policy revision
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=control-src python control-src/scripts/revise_special_technical_note_tail_policy.py \
            --repo-root worktree \
            --special-slug 2020-Y \
            --issue-id SP-2020-Y \
            --source-version v0.19 \
            | tee special-v019-audit.json
          python - <<'PY'
          import json
          from pathlib import Path
          audit=json.loads(Path('special-v019-audit.json').read_text(encoding='utf-8'))
          assert audit['source_version']=='v0.19'
          assert audit['technical_note_card_count']>=1
          assert audit['generic_tail_groups_added']>=1
          assert audit['generic_tail_protected_card_count']==audit['technical_note_card_count']
          assert audit['reader_content_changed'] is False
          assert audit['new_external_evidence'] is False
          state=json.loads(Path('worktree/sources/SP-2020-Y/pipeline-state.json').read_text(encoding='utf-8'))
          assert state['lifecycle_state']=='VALIDATED_DRAFT'
          assert state['gates']['latex_build']=='pending'
          assert state['gates']['visual_review']=='pending'
          assert state['gates']['freeze']=='pending'
          assert state['provenance']['validated_issue_source']['source_version']=='v0.19'
          PY
      - name: Commit v0.19 source and state
        working-directory: worktree
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add sources/SP-2020-Y/pipeline-state.json surveys/special/2020-Y/revisions/v0.19
          git commit -m 'Revise SP-2020-Y Technical Notes tails v0.19'
          git push origin HEAD:special/2020-Y-work
