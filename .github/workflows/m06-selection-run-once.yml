name: Run M06 Selection once
# retry after month-precision Candidate timing fix merged to main

on:
  pull_request:
    types: [synchronize]

permissions:
  contents: write
  actions: read

concurrency:
  group: special-selection-2026-M06-run-once
  cancel-in-progress: false

jobs:
  selection:
    if: github.event.pull_request.number == 45 && github.event.pull_request.head.ref == 'special/2026-M06-work'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout current control code
        uses: actions/checkout@v6
        with:
          ref: main
          path: control-src
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Checkout Special work branch
        uses: actions/checkout@v6
        with:
          ref: special/2026-M06-work
          path: worktree
          fetch-depth: 0
      - name: Verify Selection input boundary
        shell: bash
        run: |
          set -euo pipefail
          python control-src/scripts/raw_provenance.py --repo-root worktree --issue-id SP-2026-M06 check
          state="worktree/sources/SP-2026-M06/pipeline-state.json"
          decision="worktree/sources/SP-2026-M06/editorial/selection-architecture-decision-v0.1.json"
          evidence="worktree/sources/SP-2026-M06/evidence/runs/8d2a27b7958295817e39760b01d85b52dde6d77525b04703118d46b3c2d51449/evidence-reviewed.jsonl"
          test -s "$state"
          test -s "$decision"
          test -s "$evidence"
          python -m json.tool "$decision" >/dev/null
          python - "$state" <<'PY'
          import json,sys
          state=json.load(open(sys.argv[1],encoding='utf-8'))
          assert state['lifecycle_state']=='EVIDENCE_REVIEWED', state['lifecycle_state']
          assert state['gates']['evidence_normalized']=='passed'
          assert state['gates']['candidate_selection']=='pending'
          assert state['gates']['issue_architecture']=='pending'
          PY
      - name: Apply approved Selection and generate proposed Architecture
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=control-src python control-src/scripts/apply_special_selection_and_propose_architecture.py \
            --repo-root worktree \
            --issue-id SP-2026-M06 \
            --evidence-run-sha 8d2a27b7958295817e39760b01d85b52dde6d77525b04703118d46b3c2d51449 \
            --decision worktree/sources/SP-2026-M06/editorial/selection-architecture-decision-v0.1.json \
            --special-manifest control-src/specials/2026-M06/edition.json \
            --approval-reference 'User approval 2026-08-11 JST: approved revised June Candidate Selection aligned with the July Special and Issues 9 and 40.' \
            --audit-output selection-architecture-audit.json
      - name: Commit Selection and proposed Architecture, then remove run-once wrapper
        working-directory: worktree
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/m06-selection-run-once.yml
          git add sources/SP-2026-M06/selection sources/SP-2026-M06/architecture sources/SP-2026-M06/pipeline-state.json
          git commit -m 'Approve Candidate Selection and propose Architecture for SP-2026-M06'
          git push origin HEAD:special/2026-M06-work
      - name: Upload Selection/Architecture audit
        uses: actions/upload-artifact@v7
        with:
          name: special-selection-architecture-2026-M06
          path: selection-architecture-audit.json
          if-no-files-found: error
          retention-days: 14
