name: Special Architecture approval contract

on:
  pull_request:
    paths:
      - '.github/workflows/approve-special-architecture-and-prepare-drafts.yml'
      - '.github/workflows/special-architecture-approval-contract.yml'
      - 'scripts/build_draft_packages.py'
      - 'scripts/validate_issue_architecture.py'
      - 'docs/special-architecture-approval-draft-packages.md'
  push:
    branches: [main]
    paths:
      - '.github/workflows/approve-special-architecture-and-prepare-drafts.yml'
      - '.github/workflows/special-architecture-approval-contract.yml'
      - 'scripts/build_draft_packages.py'
      - 'scripts/validate_issue_architecture.py'
      - 'docs/special-architecture-approval-draft-packages.md'

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify shared Architecture and Draft Package contracts
        run: |
          set -euo pipefail
          python -m unittest \
            tests.test_issue_architecture \
            tests.test_draft_packages
