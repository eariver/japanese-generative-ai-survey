name: Pipeline contract tests

on:
  pull_request:
    branches:
      - 'weekly/*-v2-work'
    paths:
      - 'sources/**/orchestration/v2/interactive-drafting-synthesis.json'
      - '.github/workflows/pipeline-contract-tests.yml'

permissions:
  contents: write

concurrency:
  group: w33-drafting-synthesis-${{ github.head_ref }}
  cancel-in-progress: false

jobs:
  w33-drafting-synthesis:
    if: github.head_ref == 'temp/w33-drafting-synthesis-r1'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout W33 execution branch
        uses: actions/checkout@v6
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Checkout current reviewed Core v2 from main
        uses: actions/checkout@v6
        with:
          ref: main
          path: tested-core
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install current Core v2 dependencies
        run: python -m pip install -r tested-core/config/survey-production-v2-requirements.txt

      - name: Generate and validate W33 Draft Packages, Draft Results, and Profile Synthesis
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=tested-core python tested-core/scripts/run_drafting_synthesis_v2_agent.py \
            --repo-root . \
            --state sources/2026-W33/production-state.json \
            --input sources/2026-W33/orchestration/v2/interactive-drafting-synthesis.json \
            | tee drafting-synthesis-v2-output.json

      - name: Revalidate exact Draft stage contract with current main
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t args < <(PYTHONPATH=tested-core python - <<'PY'
          import json
          out=json.load(open('drafting-synthesis-v2-output.json',encoding='utf-8'))
          for row in out['packages']:
              print('--artifact'); print(f"draft-package:{row['package_id']}={row['package']}")
              print('--artifact'); print(f"draft-result:{row['package_id']}={row['result']}")
          print('--artifact'); print('synthesis-input='+out['synthesis_input'])
          print('--artifact'); print('synthesis-result='+out['synthesis_result'])
          PY
          )
          PYTHONPATH=tested-core python tested-core/scripts/survey_stage_validation_v2.py \
            --repo-root . --config config/survey-production-v2.json \
            --state sources/2026-W33/production-state.json \
            "${args[@]}" \
            --output sources/2026-W33/orchestration/v2/reviews/drafting-r1-core-stage-contract.json

      - name: Persist only W33 Drafting artifacts
        shell: bash
        env:
          PUSH_BRANCH: ${{ github.head_ref }}
          BASE_BRANCH: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm -f sources/2026-W33/orchestration/v2/interactive-drafting-synthesis.json
          git checkout "origin/${BASE_BRANCH}" -- .github/workflows/pipeline-contract-tests.yml
          git add sources/2026-W33 .github/workflows/pipeline-contract-tests.yml
          if git diff --cached --quiet; then
            echo 'No Drafting changes to persist.' >&2
            exit 1
          fi
          git commit -m 'Establish 2026-W33 Core v2 Drafting and Synthesis'
          git push origin "HEAD:${PUSH_BRANCH}"
