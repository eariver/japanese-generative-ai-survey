name: Pipeline contract tests

on:
  pull_request:
    branches:
      - 'weekly/*-v2-work'
    paths:
      - '.github/workflows/pipeline-contract-tests.yml'
      - 'sources/2026-W33/orchestration/v2/reviews/drafting-r1-stage-adoption-reviews.json'

permissions:
  contents: read

jobs:
  w33-draft-state-hash:
    if: github.head_ref == 'temp/w33-draft-adopt'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.head_ref }}
      - name: Print exact W33 Production State SHA-256
        run: sha256sum sources/2026-W33/production-state.json
