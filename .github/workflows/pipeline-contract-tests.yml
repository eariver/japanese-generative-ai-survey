name: Pipeline contract tests

on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/**'
      - 'tests/**'
      - 'schemas/**'
      - 'config/**'
      - 'templates/survey/**'
      - '.github/workflows/*.yml'
  pull_request:
    paths:
      - 'scripts/**'
      - 'tests/**'
      - 'schemas/**'
      - 'config/**'
      - 'templates/survey/**'
      - '.github/workflows/*.yml'

permissions:
  contents: write

concurrency:
  group: pipeline-contract-tests-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          ref: weekly/2026-W33-v2-work
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Survey Production Core v2 test dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install -r config/survey-production-v2-requirements.txt

      - name: Validate JSON configuration and schemas
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' path; do
            echo "Validating JSON: ${path}"
            python -m json.tool "$path" >/dev/null
          done < <(find config schemas -type f -name '*.json' -print0 | sort -z)

          while IFS= read -r -d '' manifest; do
            echo "Validating release manifest: ${manifest}"
            python -m json.tool "$manifest" >/dev/null
          done < <(find sources -mindepth 2 -maxdepth 2 -type f -name 'release-manifest.json' -print0 | sort -z)

      - name: Compile Python modules
        shell: bash
        run: |
          set -euo pipefail
          python -m compileall -q scripts tests

      - name: Run pipeline unit tests before W33 initialization
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest discover -s tests -p 'test_*.py' -v

      - name: Fresh-initialize W33 Core v2 from main authority
        shell: bash
        run: |
          set -euo pipefail
          test ! -e sources/2026-W33/production-profile.json
          test ! -e sources/2026-W33/production-state.json
          python scripts/survey_production_v2.py init-weekly \
            --issue-id 2026-W33 \
            --target-gate ARCHITECTURE_REVIEW \
            --implementation-sha a009ad28c2c2ed61ab90022a93b23eb053cadb3b \
            --now 2026-08-22T15:31:00Z
          python scripts/survey_production_v2.py validate-profile \
            --profile sources/2026-W33/production-profile.json
          python scripts/survey_production_v2.py validate-state \
            --state sources/2026-W33/production-state.json \
            --implementation-sha a009ad28c2c2ed61ab90022a93b23eb053cadb3b

      - name: Record fresh-restart worklog and commit initialization
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p docs/checkpoints
          cat > docs/checkpoints/2026-W33-core-v2-compilation-session-worklog.md <<'EOF'
          # 2026-W33 Core v2 compilation session worklog

          - Issue: `2026-W33`
          - Source of truth: `main` at `a009ad28c2c2ed61ab90022a93b23eb053cadb3b`
          - Canonical work branch: `weekly/2026-W33-v2-work`
          - Requested stop: `ARCHITECTURE_REVIEW`
          - Fresh restart ordered: 2026-08-23 JST

          ## Fresh-restart decision

          The first v2 attempt reused Raw/Source Intake material from the legacy W33 work. The user explicitly rejected that approach. The contaminated attempt was preserved only for audit at `backup/2026-W33-v2-legacy-contaminated-attempt`, PR #311 was closed without merge, and the canonical work branch was force-reset to current `main` before this restart.

          From this point forward, legacy W33 Source Intake results are not inputs to the production run. All non-X sources must be collected in a fresh W33 Source Intake run. X must use a newly generated Core v2 Grok handoff and a newly returned Grok result; legacy Grok r3 is not accepted as Raw authority for this run.

          ## Completed in fresh run

          1. Canonical work branch reset to `main`.
          2. Core v2 Production Profile and Production State freshly initialized for W33.
          3. Initialization validated against the current Core v2 contracts.

          ## Pending

          - Fresh reproducible non-X Source Intake (`arxiv`, `github`, `official`).
          - Fresh Grok/X Source Intake handoff and result import.
          - Discovery through Architecture regenerated only from the fresh intake set.

          This file will be updated as the fresh run advances.
          EOF
          git fetch origin main
          git checkout origin/main -- .github/workflows/pipeline-contract-tests.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/pipeline-contract-tests.yml sources/2026-W33 docs/checkpoints/2026-W33-core-v2-compilation-session-worklog.md
          git commit -m 'Fresh-initialize 2026-W33 Core v2'
          git push origin HEAD:weekly/2026-W33-v2-work
