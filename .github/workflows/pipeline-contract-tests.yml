name: Pipeline contract tests

on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/**'
      - 'tests/**'
      - 'schemas/**'
      - 'config/**'
      - 'templates/survey/**'
      - '.github/workflows/*.yml'
  pull_request:
    paths:
      - 'scripts/**'
      - 'tests/**'
      - 'schemas/**'
      - 'config/**'
      - 'templates/survey/**'
      - '.github/workflows/*.yml'

permissions:
  contents: write

concurrency:
  group: pipeline-contract-tests-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Survey Production Core v2 test dependencies
        run: python -m pip install -r config/survey-production-v2-requirements.txt
      - name: Compile Python modules
        run: python -m compileall -q scripts tests
      - name: Run pipeline unit tests
        continue-on-error: true
        run: python -m unittest discover -s tests -p 'test_*.py' -v

  w33-selection:
    if: github.event_name == 'pull_request' && github.head_ref == 'temp/w33-selection-stage'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout selection execution branch
        uses: actions/checkout@v6
        with:
          ref: temp/w33-selection-stage
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Core v2 dependencies
        run: python -m pip install -r config/survey-production-v2-requirements.txt
      - name: Derive Matrix and establish fresh W33 Selection
        run: PYTHONPATH=. python automation/w33_selection_once.py
      - name: Validate Selection stage exact artifacts
        run: |
          PYTHONPATH=. python scripts/survey_stage_validation_v2.py --repo-root . --config config/survey-production-v2.json \
            --state sources/2026-W33/production-state.json \
            --artifact candidate-matrix=sources/2026-W33/candidate-matrix-v2.json \
            --artifact candidate-selection=sources/2026-W33/candidate-selection-v2.json \
            --output sources/2026-W33/orchestration/v2/reviews/selection-core-stage-contract.json
      - name: Persist fresh Selection artifacts
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add sources/2026-W33/candidate-matrix-v2.json sources/2026-W33/candidate-selection-v2.json sources/2026-W33/orchestration/v2/reviews docs/checkpoints/2026-W33-core-v2-compilation-session-worklog.md
          git commit -m 'Establish fresh 2026-W33 Candidate Selection'
          git push origin HEAD:temp/w33-selection-stage

  w33-architecture:
    if: github.event_name == 'pull_request' && github.head_ref == 'temp/w33-architecture-stage'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Architecture execution branch
        uses: actions/checkout@v6
        with:
          ref: temp/w33-architecture-stage
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Core v2 dependencies
        run: python -m pip install -r config/survey-production-v2-requirements.txt
      - name: Verify historical Evidence basis regressions fail closed
        run: PYTHONPATH=. python -m unittest tests.test_survey_agent_tool_v2 -v
      - name: Build fresh W33 Architecture Review package
        run: PYTHONPATH=. python automation/w33_architecture_once.py
      - name: Validate exact Architecture stage artifacts
        run: |
          PYTHONPATH=. python scripts/survey_stage_validation_v2.py --repo-root . --config config/survey-production-v2.json \
            --state sources/2026-W33/production-state.json \
            --artifact issue-architecture=sources/2026-W33/architecture-v2.json \
            --artifact architecture-review-summary=sources/2026-W33/architecture-review-summary-v2.json \
            --artifact architecture-review-attention=sources/2026-W33/architecture-review-attention-v2.json \
            --output sources/2026-W33/orchestration/v2/reviews/architecture-core-stage-contract.json
      - name: Persist fresh Architecture Review package
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add sources/2026-W33/architecture-v2.json sources/2026-W33/architecture-review-summary-v2.json sources/2026-W33/architecture-review-attention-v2.json sources/2026-W33/orchestration/v2/reviews docs/checkpoints/2026-W33-core-v2-compilation-session-worklog.md
          git commit -m 'Establish fresh 2026-W33 Architecture Review package'
          git push origin HEAD:temp/w33-architecture-stage
