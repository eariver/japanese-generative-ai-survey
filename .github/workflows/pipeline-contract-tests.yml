name: Pipeline contract tests

on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/**'
      - 'tests/**'
      - 'schemas/**'
      - 'config/**'
      - 'templates/survey/**'
      - '.github/workflows/*.yml'
  pull_request:
    paths:
      - 'scripts/**'
      - 'tests/**'
      - 'schemas/**'
      - 'config/**'
      - 'templates/survey/**'
      - '.github/workflows/*.yml'
  # Trust bootstrap for operator execution. GitHub executes workflow_run from
  # default-branch workflow authority, not from the work-branch signal file.
  workflow_run:
    workflows:
      - Survey Production Core v2 operator bridge signal
    types:
      - completed

permissions:
  contents: read

concurrency:
  group: pipeline-contract-tests-${{ github.event_name }}-${{ github.event.workflow_run.head_branch || github.ref }}
  cancel-in-progress: false

jobs:
  test:
    if: github.event_name != 'workflow_run'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Survey Production Core v2 test dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install -r config/survey-production-v2-requirements.txt

      - name: Validate JSON configuration and schemas
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' path; do
            echo "Validating JSON: ${path}"
            python -m json.tool "$path" >/dev/null
          done < <(find config schemas -type f -name '*.json' -print0 | sort -z)

          while IFS= read -r -d '' manifest; do
            echo "Validating release manifest: ${manifest}"
            python -m json.tool "$manifest" >/dev/null
          done < <(find sources -mindepth 2 -maxdepth 2 -type f -name 'release-manifest.json' -print0 | sort -z)

      - name: Compile Python modules
        shell: bash
        run: |
          set -euo pipefail
          python -m compileall -q scripts tests

      - name: Run pipeline unit tests
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest discover -s tests -p 'test_*.py' -v

  operator-preflight:
    # The triggering work-branch workflow is untrusted signal only. This job is
    # loaded from the default branch and independently validates the exact
    # request commit before any write-capable job is admitted.
    if: >-
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      github.event.workflow_run.head_branch != 'main' &&
      github.event.workflow_run.actor.login != 'github-actions[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      request_path: ${{ steps.preflight.outputs.request_path }}
      request_head_sha: ${{ steps.preflight.outputs.request_head_sha }}
      request_head_branch: ${{ steps.preflight.outputs.request_head_branch }}
    steps:
      - name: Checkout exact untrusted request commit as data
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0

      - name: Trusted reviewed-main and request-only preflight
        id: preflight
        shell: bash
        env:
          REQUEST_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          REQUEST_HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
        run: |
          set -euo pipefail

          if [[ "$(git rev-parse HEAD)" != "$REQUEST_HEAD_SHA" ]]; then
            echo "Trusted operator preflight did not checkout the exact workflow_run head SHA." >&2
            exit 1
          fi

          mapfile -t added_requests < <(
            git diff-tree --diff-filter=A --no-commit-id --name-only -r "$REQUEST_HEAD_SHA" -- \
              ':(glob)sources/**/execution/requests/*.json'
          )
          if [[ "${#added_requests[@]}" -ne 1 ]]; then
            echo "Expected exactly one newly added operator request; found ${#added_requests[@]}" >&2
            exit 1
          fi

          mapfile -t changed < <(git diff-tree --no-commit-id --name-only -r "$REQUEST_HEAD_SHA")
          if [[ "${#changed[@]}" -ne 1 || "${changed[0]}" != "${added_requests[0]}" ]]; then
            echo "Operator request commit must contain only the immutable request file." >&2
            printf 'Changed: %s\n' "${changed[@]}" >&2
            exit 1
          fi

          request_path="${added_requests[0]}"
          reviewed_main_sha="$(python -c 'import json,sys; print(json.load(open(sys.argv[1], encoding="utf-8"))["reviewed_main_sha"])' "$request_path")"
          request_work_branch="$(python -c 'import json,sys; print(json.load(open(sys.argv[1], encoding="utf-8"))["work_branch"])' "$request_path")"
          operation_kind="$(python -c 'import json,sys; print(json.load(open(sys.argv[1], encoding="utf-8"))["operation"]["kind"])' "$request_path")"

          if [[ "$request_work_branch" != "$REQUEST_HEAD_BRANCH" ]]; then
            echo "Operator request work_branch does not match workflow_run head branch." >&2
            exit 1
          fi
          if [[ ! "$reviewed_main_sha" =~ ^[0-9a-f]{40}$ ]]; then
            echo "reviewed_main_sha must be exact lowercase 40-hex." >&2
            exit 1
          fi

          git fetch --no-tags origin main:refs/remotes/origin/main
          git cat-file -e "$reviewed_main_sha^{commit}"
          if ! git merge-base --is-ancestor "$reviewed_main_sha" refs/remotes/origin/main; then
            echo "reviewed_main_sha is not an ancestor of current main." >&2
            exit 1
          fi

          request_parent="$REQUEST_HEAD_SHA^"
          request_parent_sha="$(git rev-parse "$request_parent")"
          if ! git merge-base --is-ancestor "$reviewed_main_sha" "$request_parent"; then
            echo "Operator work branch is not descended from reviewed_main_sha." >&2
            exit 1
          fi

          case "$operation_kind" in
            INITIALIZE_WEEKLY|INITIALIZE_RETROSPECTIVE|INITIALIZE_THEMATIC)
              execution_main_sha="$(python -c 'import json,sys; print(json.load(open(sys.argv[1], encoding="utf-8"))["operation"]["execution_record"]["reviewed_main_sha"])' "$request_path")"
              if [[ "$execution_main_sha" != "$reviewed_main_sha" ]]; then
                echo "Initialization execution record reviewed_main_sha must equal request reviewed_main_sha." >&2
                exit 1
              fi
              ;;
            RECORD_ARCHITECTURE_APPROVAL|REQUEST_ARCHITECTURE_REVISION|RECORD_PUBLICATION_PREVIEW_APPROVAL|REQUEST_PUBLICATION_PREVIEW_REVISION)
              human_reviewed_sha="$(python -c 'import json,sys; print(json.load(open(sys.argv[1], encoding="utf-8"))["operation"]["reviewed_repository_commit_sha"])' "$request_path")"
              if [[ ! "$human_reviewed_sha" =~ ^[0-9a-f]{40}$ ]]; then
                echo "reviewed_repository_commit_sha must be exact lowercase 40-hex." >&2
                exit 1
              fi
              if [[ "$human_reviewed_sha" != "$request_parent_sha" ]]; then
                echo "Human Gate request must bind reviewed_repository_commit_sha to the request-only commit parent." >&2
                echo "request parent: $request_parent_sha" >&2
                echo "request value:  $human_reviewed_sha" >&2
                exit 1
              fi
              ;;
          esac

          # Resolve the protected-path set from the reviewed main authority,
          # never from the untrusted work-branch config being admitted.
          mapfile -t protected_paths < <(
            python - "$reviewed_main_sha" <<'PY'
          import json
          import subprocess
          import sys

          reviewed = sys.argv[1]
          raw = subprocess.check_output(
              ["git", "show", f"{reviewed}:config/survey-production-v2.json"],
              text=True,
          )
          cfg = json.loads(raw)
          paths = [".github/workflows", "config", "schemas", "scripts"]
          paths.extend(cfg.get("implementation_control_roots", []))
          for group in cfg.get("contract_files", {}).values():
              paths.extend(group)
          for path in sorted(set(paths)):
              print(path)
          PY
          )

          if ! git diff --quiet "$reviewed_main_sha" "$request_parent" -- "${protected_paths[@]}"; then
            echo "Shared Core or contract authority drifted from reviewed_main_sha before operator execution." >&2
            git diff --name-only "$reviewed_main_sha" "$request_parent" -- "${protected_paths[@]}" >&2
            exit 1
          fi

          {
            echo "request_path=$request_path"
            echo "request_head_sha=$REQUEST_HEAD_SHA"
            echo "request_head_branch=$REQUEST_HEAD_BRANCH"
          } >> "$GITHUB_OUTPUT"

  operator-execute:
    needs: operator-preflight
    if: needs.operator-preflight.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      REQUEST_PATH: ${{ needs.operator-preflight.outputs.request_path }}
      REQUEST_HEAD_SHA: ${{ needs.operator-preflight.outputs.request_head_sha }}
      REQUEST_HEAD_BRANCH: ${{ needs.operator-preflight.outputs.request_head_branch }}
    steps:
      - name: Checkout exact admitted request commit
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.operator-preflight.outputs.request_head_sha }}
          fetch-depth: 0

      - name: Refresh canonical work-branch reachability authority
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin \
            "refs/heads/$REQUEST_HEAD_BRANCH:refs/remotes/origin/$REQUEST_HEAD_BRANCH"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Core dependencies
        run: python -m pip install -r config/survey-production-v2-requirements.txt

      - name: Execute canonical deterministic Core operation
        shell: bash
        run: |
          set -euo pipefail
          python scripts/survey_core_execution_bridge_v2.py \
            --request "$REQUEST_PATH" \
            --event-sha "$REQUEST_HEAD_SHA" \
            --ref-name "$REQUEST_HEAD_BRANCH" \
            > "$RUNNER_TEMP/operator-bridge-result.json"
          cat "$RUNNER_TEMP/operator-bridge-result.json"

      - name: Enforce edition-local write boundary
        shell: bash
        run: |
          set -euo pipefail
          source_root="$(python -c 'import json,sys; print(json.load(open(sys.argv[1], encoding="utf-8"))["source_root"])' "$RUNNER_TEMP/operator-bridge-result.json")"
          request_root="$source_root/execution/requests/"
          mapfile -t dirty < <(
            {
              git diff --name-only
              git ls-files --others --exclude-standard
            } | sed '/^$/d' | sort -u
          )
          if [[ "${#dirty[@]}" -eq 0 ]]; then
            echo "Bridge produced no repository changes." >&2
            exit 1
          fi
          for path in "${dirty[@]}"; do
            case "$path" in
              "$source_root"/*) ;;
              *)
                echo "Bridge attempted write outside edition source root: $path" >&2
                exit 1
                ;;
            esac
            case "$path" in
              "$request_root"*)
                echo "Bridge must not mutate immutable request authority: $path" >&2
                exit 1
                ;;
            esac
          done

      - name: Commit deterministic edition-local outputs
        shell: bash
        run: |
          set -euo pipefail
          source_root="$(python -c 'import json,sys; print(json.load(open(sys.argv[1], encoding="utf-8"))["source_root"])' "$RUNNER_TEMP/operator-bridge-result.json")"
          request_id="$(python -c 'import json,sys; print(json.load(open(sys.argv[1], encoding="utf-8"))["request_id"])' "$RUNNER_TEMP/operator-bridge-result.json")"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- "$source_root"
          git commit -m "Execute Core operator request $request_id"
          git push origin "HEAD:$REQUEST_HEAD_BRANCH"
