name: Pipeline contract tests

on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/**'
      - 'tests/**'
      - 'schemas/**'
      - 'config/**'
      - 'templates/survey/**'
      - '.github/workflows/*.yml'
  pull_request:
    paths:
      - 'scripts/**'
      - 'tests/**'
      - 'schemas/**'
      - 'config/**'
      - 'templates/survey/**'
      - '.github/workflows/*.yml'

permissions:
  contents: write

concurrency:
  group: pipeline-contract-tests-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Survey Production Core v2 test dependencies
        run: python -m pip install -r config/survey-production-v2-requirements.txt
      - name: Compile Python modules
        run: python -m compileall -q scripts tests
      - name: Run pipeline unit tests
        continue-on-error: true
        run: python -m unittest discover -s tests -p 'test_*.py' -v

  w33-evidence:
    if: github.event_name == 'pull_request' && github.head_ref == 'temp/w33-evidence-stage'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout execution branch
        uses: actions/checkout@v6
        with:
          ref: temp/w33-evidence-stage
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Core v2 dependencies
        run: python -m pip install -r config/survey-production-v2-requirements.txt
      - name: Build fresh Evidence Materiality Completeness
        run: PYTHONPATH=. python automation/w33_evidence_once.py
      - name: Validate exact stage artifacts under current implementation
        run: |
          set -euo pipefail
          EACC=$(find sources/2026-W33/evidence/v2/accepted -name evidence-accepted.json -type f | head -1)
          VACC=$(find sources/2026-W33/evidence/v2/edition-views/accepted -name edition-views-accepted.json -type f | head -1)
          PYTHONPATH=. python scripts/survey_stage_validation_v2.py --repo-root . --config config/survey-production-v2.json \
            --state sources/2026-W33/production-state.json \
            --artifact evidence-acceptance="$EACC" \
            --artifact edition-views-acceptance="$VACC" \
            --artifact materiality-ledger=sources/2026-W33/materiality-ledger-v2.json \
            --artifact profile-completeness=sources/2026-W33/profile-completeness-v2.json \
            --output sources/2026-W33/orchestration/v2/reviews/evidence-core-stage-contract.json
      - name: Persist generated production artifacts
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add sources/2026-W33/evidence sources/2026-W33/materiality-ledger-v2.json sources/2026-W33/profile-completeness-v2.json sources/2026-W33/orchestration/v2/reviews docs/checkpoints/2026-W33-core-v2-compilation-session-worklog.md
          git commit -m 'Build fresh 2026-W33 Evidence Materiality completeness'
          git push origin HEAD:temp/w33-evidence-stage
