name: Pipeline contract tests

on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/**'
      - 'tests/**'
      - 'schemas/**'
      - 'config/**'
      - 'templates/survey/**'
      - '.github/workflows/*.yml'
  pull_request:
    paths:
      - 'scripts/**'
      - 'tests/**'
      - 'schemas/**'
      - 'config/**'
      - 'templates/survey/**'
      - '.github/workflows/*.yml'

permissions:
  contents: write

concurrency:
  group: pipeline-contract-tests-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Survey Production Core v2 test dependencies
        run: python -m pip install -r config/survey-production-v2-requirements.txt
      - name: Validate JSON configuration and schemas
        run: |
          set -euo pipefail
          while IFS= read -r -d '' path; do python -m json.tool "$path" >/dev/null; done < <(find config schemas -type f -name '*.json' -print0 | sort -z)
      - name: Compile Python modules
        run: python -m compileall -q scripts tests
      - name: Run pipeline unit tests
        run: python -m unittest discover -s tests -p 'test_*.py' -v

  w33-discovery-review:
    if: github.event_name == 'pull_request' && github.head_ref == 'temp/w33-discovery-review'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: temp/w33-discovery-review
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build compact review from all fresh W33 seed records
        run: PYTHONPATH=. python automation/w33_discovery_review_once.py
      - name: Persist review only and restore workflow
        run: |
          set -euo pipefail
          git fetch origin weekly/2026-W33-v2-work
          git checkout origin/weekly/2026-W33-v2-work -- .github/workflows/pipeline-contract-tests.yml
          git rm automation/w33_discovery_review_once.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add sources/2026-W33/source-intake-v2/fresh-discovery-review.json sources/2026-W33/source-intake-v2/fresh-discovery-review.md .github/workflows/pipeline-contract-tests.yml
          git commit -m 'Build fresh W33 Discovery review set'
          git push origin HEAD:temp/w33-discovery-review
