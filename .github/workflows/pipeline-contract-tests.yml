name: Pipeline contract tests
on:
  workflow_dispatch:
  push:
    paths: ['scripts/**','tests/**','schemas/**','config/**','templates/survey/**','.github/workflows/*.yml']
  pull_request:
    paths: ['scripts/**','tests/**','schemas/**','config/**','templates/survey/**','.github/workflows/*.yml']
permissions:
  contents: write
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install -r config/survey-production-v2-requirements.txt
      - run: python -m compileall -q scripts tests
      - run: python -m unittest discover -s tests -p 'test_*.py' -v
  w33-screening:
    if: github.event_name == 'pull_request' && github.head_ref == 'temp/w33-screening-stage'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with: {ref: temp/w33-screening-stage, fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install -r config/survey-production-v2-requirements.txt
      - name: Build and validate Screening
        run: PYTHONPATH=. python automation/w33_screening_once.py
      - name: Validate accepted Screening under current agent-first implementation
        run: |
          set -euo pipefail
          acc=$(find sources/2026-W33/screening/v2/accepted -name screening-accepted.json -type f -print -quit)
          test -n "$acc"
          PYTHONPATH=. python - <<'PY'
          from pathlib import Path
          from scripts import survey_screening_v2 as s
          from scripts import survey_production_v2 as core
          from scripts.survey_agent_tool_v2 import current_stage_basis_override
          root=Path('.').resolve(); acc=next((root/'sources/2026-W33/screening/v2/accepted').glob('*/screening-accepted.json'))
          with current_stage_basis_override(): s.validate_acceptance(root,acc,core.repository_commit_sha(root))
          print(acc)
          PY
      - name: Persist production artifacts only
        run: |
          set -euo pipefail
          git fetch origin weekly/2026-W33-v2-work
          git checkout origin/weekly/2026-W33-v2-work -- .github/workflows/pipeline-contract-tests.yml
          git rm automation/w33_screening_once.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add sources/2026-W33/screening sources/2026-W33/orchestration/v2/reviews/screening-stage-reviews.json docs/checkpoints/2026-W33-core-v2-compilation-session-worklog.md .github/workflows/pipeline-contract-tests.yml
          git commit -m 'Screen fresh 2026-W33 Discovery set'
          git push origin HEAD:temp/w33-screening-stage
