name: Pipeline contract tests

on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/**'
      - 'tests/**'
      - 'schemas/**'
      - 'config/**/*.json'
      - 'config/prompts/**'
      - 'templates/survey/**'
      - '.github/workflows/*.yml'
  pull_request:
    paths:
      - 'scripts/**'
      - 'tests/**'
      - 'schemas/**'
      - 'config/**/*.json'
      - 'config/prompts/**'
      - 'templates/survey/**'
      - '.github/workflows/*.yml'

permissions:
  contents: write

concurrency:
  group: pipeline-contract-tests-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate JSON configuration and schemas
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' path; do python -m json.tool "$path" >/dev/null; done < <(find config schemas -type f -name '*.json' -print0 | sort -z)
          while IFS= read -r -d '' manifest; do python -m json.tool "$manifest" >/dev/null; done < <(find sources -mindepth 2 -maxdepth 2 -type f -name 'release-manifest.json' -print0 | sort -z)
      - name: Compile Python modules
        run: python -m compileall -q scripts tests
      - name: Run pipeline unit tests
        run: python -m unittest discover -s tests -p 'test_*.py' -v

  m05-preview-v05:
    if: github.event_name == 'pull_request' && github.event.pull_request.number == 53 && github.event.pull_request.head.ref == 'special/2026-M05-work'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout canonical control code
        uses: actions/checkout@v6
        with:
          ref: main
          path: control-src
          fetch-depth: 1
      - name: Checkout May work branch
        uses: actions/checkout@v6
        with:
          ref: special/2026-M05-work
          path: worktree
          fetch-depth: 0
      - name: Create immutable v0.5 from verified v0.4
        shell: bash
        working-directory: worktree
        run: |
          set -euo pipefail
          python ../control-src/scripts/raw_provenance.py --repo-root . --issue-id SP-2026-M05 check >/dev/null
          python - <<'PY'
          import copy,hashlib,json,pathlib,shutil
          root=pathlib.Path('.')
          state_path=root/'sources/SP-2026-M05/pipeline-state.json'
          state=json.load(open(state_path,encoding='utf-8'))
          assert state['lifecycle_state']=='VALIDATED_DRAFT'
          assert state['gates']['latex_build']=='pending' and state['gates']['visual_review']=='pending' and state['gates']['freeze']=='pending'
          cur=state['provenance']['validated_issue_source']
          assert cur['source_version']=='v0.4' and cur['sha256']=='ae036724d888332dbf35c41f78ca1e0bdaf14e0735fd89d6ced50cbedf27c0ea'
          src=root/cur['path']; assert hashlib.sha256(src.read_bytes()).hexdigest()==cur['sha256']
          old=json.load(open(src,encoding='utf-8'))
          out=root/'surveys/special/2026-M05/revisions/v0.5'; assert not out.exists()
          shutil.copytree(src.parent,out)
          for name in ['main.pdf','main.log','main.aux','main.bcf','main.run.xml','main.bbl','main.blg','main.fdb_latexmk','main.fls','main.out','main.toc']:
              (out/name).unlink(missing_ok=True)
          front=out/'sections/00-frontmatter.tex'
          text=front.read_text(encoding='utf-8')
          needle=r'\begin{tabularx}{\linewidth}{@{}p{0.12\linewidth}X@{}}'
          replacement=r'\begin{tabularx}{\dimexpr\linewidth-12pt\relax}{@{}p{0.12\linewidth}X@{}}'
          assert text.count(needle)==1
          front.write_text(text.replace(needle,replacement,1),encoding='utf-8')
          def sha(p): return hashlib.sha256(p.read_bytes()).hexdigest()
          marker=root/'sources/SP-2026-M05/editorial/layout-revision-v0.5.json'
          marker_data={'schema_version':'1.0','issue_id':'SP-2026-M05','revision':'v0.5','from_source_version':'v0.4','constraints':{'new_external_evidence_allowed':False,'selected_evidence_only':True,'reader_content_changed':False},'changes':['Reduce May chronology table outer width by 12pt to eliminate the v0.4 9.9pt Overfull hbox warning.'],'qa_targets':['TeX log clean','32-40 pages','retain v0.4 chronology content and adaptive layout unchanged']}
          marker.write_text(json.dumps(marker_data,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          new=copy.deepcopy(old); new['source_version']='v0.5'; new['status']='VALIDATED_BALANCED_ADAPTIVE_CHRONOLOGY_WIDTH_REVISION'
          new['derivation']='Layout-only revision of v0.4: chronology table width reduced by 12pt. Reader-facing wording, selected Evidence, article bodies, Technical Notes, chronology rows, and final synthesis are unchanged.'
          new['basis']=copy.deepcopy(old.get('basis') or {}); new['basis']['previous_source_manifest_path']=cur['path']; new['basis']['previous_source_manifest_sha256']=cur['sha256']
          new['frontmatter']={'path':'sections/00-frontmatter.tex','sha256':sha(front)}
          new['layout_revision']=copy.deepcopy(old.get('layout_revision') or {}); new['layout_revision'].update({'from_source_version':'v0.4','reader_content_changed':False,'chronology_table_width_adjustment':'-12pt'})
          manifest=out/'source-manifest.json'; manifest.write_text(json.dumps(new,ensure_ascii=False,indent=2)+'\n',encoding='utf-8'); msha=sha(manifest)
          state.setdefault('provenance_history',{}).setdefault('validated_issue_source',[]).append(copy.deepcopy(cur))
          state['provenance']['validated_issue_source']={'path':manifest.relative_to(root).as_posix(),'sha256':msha,'source_version':'v0.5','layout_mode':'balanced-multicol-adaptive-spacing-with-may-chronology-width-fix','layout_revision_path':marker.relative_to(root).as_posix(),'layout_revision_sha256':sha(marker)}
          state['provenance']['reader_layout_revision']={'source_version':'v0.5','layout_revision_path':marker.relative_to(root).as_posix(),'layout_revision_sha256':sha(marker),'reason':'Pre-Human TeX gate: v0.4 chronology table exceeded line width by 9.9pt; reduce only table outer width.'}
          state_path.write_text(json.dumps(state,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          print(msha)
          PY
      - name: Commit v0.5 source before build
        working-directory: worktree
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'; git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add sources/SP-2026-M05/pipeline-state.json sources/SP-2026-M05/editorial/layout-revision-v0.5.json surveys/special/2026-M05/revisions/v0.5
          git commit -m 'Add chronology width fix v0.5 for SP-2026-M05'
          git push origin HEAD:special/2026-M05-work
      - name: Verify exact v0.5 source
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib,json,pathlib
          r=pathlib.Path('worktree'); s=json.load(open(r/'sources/SP-2026-M05/pipeline-state.json',encoding='utf-8')); src=s['provenance']['validated_issue_source']; assert src['source_version']=='v0.5'; m=r/src['path']; assert hashlib.sha256(m.read_bytes()).hexdigest()==src['sha256']; d=json.load(open(m,encoding='utf-8')); assert d['status']=='VALIDATED_BALANCED_ADAPTIVE_CHRONOLOGY_WIDTH_REVISION'
          PY
      - name: Pin survey style
        run: cp control-src/templates/survey/jgaisurvey.sty worktree/surveys/special/2026-M05/revisions/v0.5/jgaisurvey.sty
      - name: Set reproducible PDF timestamp
        run: echo 'SOURCE_DATE_EPOCH=1779926400' >> "$GITHUB_ENV"
      - name: Compile v0.5 Preview
        uses: xu-cheng/latex-action@v4
        with:
          root_file: main.tex
          working_directory: worktree/surveys/special/2026-M05/revisions/v0.5
          texlive_version: 2026
          latexmk_use_lualatex: true
          os: alpine
      - name: Audit v0.5 Preview
        id: audit
        shell: bash
        run: |
          set -u
          pdf=worktree/surveys/special/2026-M05/revisions/v0.5/main.pdf; log=worktree/surveys/special/2026-M05/revisions/v0.5/main.log; test -s "$pdf" && test -s "$log"
          bad=$(grep -E -n 'LaTeX Warning: (There were undefined references|Citation .* undefined)|Package biblatex Warning: Please (re)?run|Overfull \\hbox|Underfull \\hbox|Missing character:' "$log" || true)
          pages=$(python - "$log" <<'PY'
          import re,sys
          t=open(sys.argv[1],encoding='utf-8',errors='replace').read(); m=re.findall(r'Output written on .*?\((\d+) pages?',t,re.S); print(m[-1] if m else '-1')
          PY
          ); sha=$(sha256sum "$pdf"|awk '{print $1}'); [ -z "$bad" ] && clean=true || clean=false
          manifest_sha=$(python - <<'PY'
          import json
          s=json.load(open('worktree/sources/SP-2026-M05/pipeline-state.json',encoding='utf-8')); print(s['provenance']['validated_issue_source']['sha256'])
          PY
          )
          python - "$pages" "$sha" "$clean" "$bad" "$manifest_sha" <<'PY'
          import json,sys
          pages,sha,clean,bad,msha=sys.argv[1:]; n=int(pages); o={'schema_version':'1.0','issue_id':'SP-2026-M05','source_version':'v0.5','page_count':n,'pdf_sha256':sha,'log_clean':clean=='true','log_gate_findings':bad.splitlines() if bad else [],'page_target_min':32,'page_target_max':40,'page_budget_passed':32<=n<=40,'source_manifest_path':'surveys/special/2026-M05/revisions/v0.5/source-manifest.json','source_manifest_sha256':msha}; open('special-pdf-build-audit.json','w',encoding='utf-8').write(json.dumps(o,ensure_ascii=False,indent=2)+'\n'); print(json.dumps(o,ensure_ascii=False,indent=2))
          PY
          echo "pages=$pages" >> "$GITHUB_OUTPUT"; echo "sha=$sha" >> "$GITHUB_OUTPUT"; echo "clean=$clean" >> "$GITHUB_OUTPUT"; echo "manifest_sha=$manifest_sha" >> "$GITHUB_OUTPUT"
      - name: Upload v0.5 Preview artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: japanese-generative-ai-survey-special-2026-M05-v0.5
          path: |
            worktree/surveys/special/2026-M05/revisions/v0.5/main.pdf
            worktree/surveys/special/2026-M05/revisions/v0.5/main.log
            special-pdf-build-audit.json
          if-no-files-found: error
          retention-days: 14
      - name: Record clean page-budget release candidate
        if: steps.audit.outputs.clean == 'true' && fromJSON(steps.audit.outputs.pages) >= 32 && fromJSON(steps.audit.outputs.pages) <= 40
        working-directory: worktree
        shell: bash
        env:
          PAGES: ${{ steps.audit.outputs.pages }}
          PDF_SHA: ${{ steps.audit.outputs.sha }}
          MANIFEST_SHA: ${{ steps.audit.outputs.manifest_sha }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,pathlib,os
          p=pathlib.Path('sources/SP-2026-M05/pipeline-state.json'); s=json.load(open(p,encoding='utf-8')); s['lifecycle_state']='RELEASE_CANDIDATE'; s['gates']['latex_build']='passed'; s['gates']['visual_review']='pending'; s['gates']['freeze']='pending'; s['provenance']['latex_build']={'workflow_run_id':int(os.environ['RUN_ID']),'pdf_sha256':os.environ['PDF_SHA'],'page_count':int(os.environ['PAGES']),'source_version':'v0.5','validated_issue_source_path':'surveys/special/2026-M05/revisions/v0.5/source-manifest.json','validated_issue_source_sha256':os.environ['MANIFEST_SHA'],'preview_only':True,'log_clean':True}; p.write_text(json.dumps(s,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          PY
          git config user.name 'github-actions[bot]'; git config user.email '41898282+github-actions[bot]@users.noreply.github.com'; git add sources/SP-2026-M05/pipeline-state.json; git commit -m 'Record v0.5 pre-Human Preview candidate for SP-2026-M05'; git push origin HEAD:special/2026-M05-work
      - name: Restore canonical contract workflow
        if: always()
        working-directory: worktree
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'; git config user.email '41898282+github-actions[bot]@users.noreply.github.com'; git pull --rebase origin special/2026-M05-work; cp ../control-src/.github/workflows/pipeline-contract-tests.yml .github/workflows/pipeline-contract-tests.yml; git rm -f surveys/special/2026-M05/revisions/v0.5/main.pdf || true; git add .github/workflows/pipeline-contract-tests.yml; if ! git diff --cached --quiet; then git commit -m 'Restore canonical pipeline workflow after M05 v0.5'; git push origin HEAD:special/2026-M05-work; fi
