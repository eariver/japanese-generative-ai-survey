name: Pipeline contract tests
on:
  workflow_dispatch:
  push:
    paths: ['scripts/**','tests/**','schemas/**','config/**','templates/survey/**','.github/workflows/*.yml']
  pull_request:
    paths: ['scripts/**','tests/**','schemas/**','config/**','templates/survey/**','.github/workflows/*.yml']
permissions:
  contents: write
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install -r config/survey-production-v2-requirements.txt
      - run: python -m compileall -q scripts tests
      - run: python -m unittest discover -s tests -p 'test_*.py' -v
  w33-discovery-build:
    if: github.event_name == 'pull_request' && github.head_ref == 'temp/w33-discovery-stage'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with: {ref: temp/w33-discovery-stage, fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install -r config/survey-production-v2-requirements.txt
      - name: Build and validate fresh Discovery
        run: PYTHONPATH=. python automation/w33_build_discovery_once.py
      - name: Validate Discovery acceptance again
        run: PYTHONPATH=. python scripts/survey_discovery_v2.py validate --acceptance sources/2026-W33/discovery/discovery-accepted-v2.json
      - name: Persist production inputs only
        run: |
          set -euo pipefail
          git fetch origin weekly/2026-W33-v2-work
          git checkout origin/weekly/2026-W33-v2-work -- .github/workflows/pipeline-contract-tests.yml
          git rm automation/w33_build_discovery_once.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add sources/2026-W33/discovery sources/2026-W33/orchestration/v2/reviews/discovery-stage-reviews.json docs/checkpoints/2026-W33-core-v2-compilation-session-worklog.md .github/workflows/pipeline-contract-tests.yml
          git commit -m 'Build fresh 2026-W33 Core v2 Discovery'
          git push origin HEAD:temp/w33-discovery-stage
