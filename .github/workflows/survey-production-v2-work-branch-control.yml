name: Survey Production Core v2 work-branch control

on:
  push:
    branches:
      - 'weekly/*-v2-work'
      - 'special/*-v2-work'
    paths:
      - 'sources/**/orchestration/v2/control-request.json'
  pull_request:
    branches:
      - 'weekly/*-v2-work'
      - 'special/*-v2-work'
    paths:
      - 'sources/**/orchestration/v2/control-request.json'

permissions:
  contents: write

concurrency:
  group: survey-production-v2-work-branch-control-${{ github.event_name == 'pull_request' && github.base_ref || github.ref_name }}
  cancel-in-progress: false

jobs:
  adopt:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Checkout production control branch
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event_name == 'pull_request' && github.head_ref || github.ref_name }}
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install current reviewed Core v2 dependencies
        run: python -m pip install -r config/survey-production-v2-requirements.txt

      - name: Resolve and validate local control request
        id: request
        shell: bash
        env:
          TARGET_WORK_BRANCH: ${{ github.event_name == 'pull_request' && github.base_ref || github.ref_name }}
        run: |
          set -euo pipefail
          PYTHONPATH=. python - <<'PY' >> "$GITHUB_OUTPUT"
          import json, pathlib, re, os
          from scripts import survey_agent_control_v2 as agent
          from scripts import survey_production_v2 as core

          root=pathlib.Path('.').resolve()
          requests=sorted(root.glob('sources/*/orchestration/v2/control-request.json'))
          if len(requests) != 1:
              raise SystemExit(f'work branch requires exactly one Core v2 control request, found {len(requests)}')
          request_path=requests[0]
          data=json.load(open(request_path,encoding='utf-8'))
          expected={'schema_version','operation','issue_id','production_state_sha256','stage_artifacts','stage_reviews_path','stage_summary'}
          if set(data) != expected or data.get('schema_version') != '2.0-rc1' or data.get('operation') != 'adopt-stage':
              raise SystemExit('invalid work-branch Core v2 control request')
          issue=data.get('issue_id')
          if not isinstance(issue,str) or not re.fullmatch(r'[A-Za-z0-9._-]+',issue):
              raise SystemExit('unsafe issue_id')
          expected_request=root/'sources'/issue/'orchestration'/'v2'/'control-request.json'
          if request_path.resolve() != expected_request.resolve():
              raise SystemExit('control request path/issue identity mismatch')
          state_path=root/'sources'/issue/'production-state.json'
          if not state_path.is_file(): raise SystemExit('missing canonical Production State')
          state_sha=data.get('production_state_sha256')
          if not isinstance(state_sha,str) or not re.fullmatch(r'[0-9a-f]{64}',state_sha):
              raise SystemExit('production_state_sha256 must be exact lowercase SHA-256')
          if core.sha256_file(state_path) != state_sha:
              raise SystemExit('Production State SHA drift before work-branch control action')
          state=core.load_json(state_path)
          if state.get('issue_id') != issue: raise SystemExit('Production State issue identity mismatch')
          profile_path=root/state['profile']['path']; profile=core.load_json(profile_path)
          if profile.get('paths',{}).get('work_branch') != os.environ['TARGET_WORK_BRANCH']:
              raise SystemExit('target branch does not match Production Profile work_branch')
          cfg=core.load_json(root/core.DEFAULT_CONFIG)
          errors=agent.validate_agent_state(root,cfg,state)
          if errors: raise SystemExit('; '.join(errors))
          artifacts=data.get('stage_artifacts')
          if not isinstance(artifacts,dict) or any(not isinstance(k,str) or not k or not isinstance(v,str) or not v for k,v in artifacts.items()):
              raise SystemExit('stage_artifacts must be an object of non-empty string paths')
          reviews=data.get('stage_reviews_path'); summary=data.get('stage_summary')
          if not isinstance(reviews,str) or not reviews or not isinstance(summary,str) or not summary.strip():
              raise SystemExit('stage_reviews_path and stage_summary are required')
          source_root=profile['paths']['source_root']
          print(f'issue_id={issue}')
          print(f'state={state_path.relative_to(root)}')
          print(f'source_root={source_root}')
          print(f'request_path={request_path.relative_to(root)}')
          print(f'artifacts_json={json.dumps(artifacts,separators=(",",":"),ensure_ascii=False)}')
          print(f'reviews_path={reviews}')
          print(f'summary={json.dumps(summary,ensure_ascii=False)}')
          PY

      - name: Run exact Core v2 stage validation
        shell: bash
        env:
          STATE: ${{ steps.request.outputs.state }}
          SOURCE_ROOT: ${{ steps.request.outputs.source_root }}
          ARTIFACTS_JSON: ${{ steps.request.outputs.artifacts_json }}
          REVIEWS_PATH: ${{ steps.request.outputs.reviews_path }}
        run: |
          set -euo pipefail
          mapfile -t artifact_args < <(PYTHONPATH=. python - <<'PY'
          import json, os
          data=json.loads(os.environ['ARTIFACTS_JSON'])
          for name,path in sorted(data.items()):
              print(f'--artifact\n{name}={path}')
          PY
          )
          validation_output="$(PYTHONPATH=. python - <<'PY'
          import json, os, pathlib
          root=pathlib.Path('.').resolve()
          review_path=(root/os.environ['REVIEWS_PATH']).resolve()
          try: review_path.relative_to(root)
          except ValueError: raise SystemExit('stage_reviews_path escapes repository')
          data=json.load(open(review_path,encoding='utf-8'))
          rows=data.get('reviews')
          if not isinstance(rows,list): raise SystemExit('stage review file must contain reviews array')
          matches=[row for row in rows if isinstance(row,dict) and row.get('check_id')=='CORE_STAGE_CONTRACT']
          if len(matches)!=1 or matches[0].get('kind')!='DETERMINISTIC':
              raise SystemExit('stage review file requires exactly one deterministic CORE_STAGE_CONTRACT row')
          value=matches[0].get('result_path')
          if not isinstance(value,str) or not value: raise SystemExit('CORE_STAGE_CONTRACT review requires result_path')
          output=(root/value).resolve(); source=(root/os.environ['SOURCE_ROOT']).resolve()
          try: rel=output.relative_to(root); output.relative_to(source)
          except ValueError: raise SystemExit('CORE_STAGE_CONTRACT result_path must be repository-local under source_root')
          if output.exists(): raise SystemExit('refusing pre-existing CORE_STAGE_CONTRACT result before validation')
          print(rel)
          PY
          )"
          PYTHONPATH=. python scripts/survey_stage_validation_v2.py \
            --repo-root . --config config/survey-production-v2.json \
            --state "$STATE" \
            "${artifact_args[@]}" \
            --output "$validation_output"

      - name: Advance exactly one reviewed local stage
        shell: bash
        env:
          STATE: ${{ steps.request.outputs.state }}
          ARTIFACTS_JSON: ${{ steps.request.outputs.artifacts_json }}
          REVIEWS_PATH: ${{ steps.request.outputs.reviews_path }}
          STAGE_SUMMARY_JSON: ${{ steps.request.outputs.summary }}
        run: |
          set -euo pipefail
          mapfile -t artifact_args < <(PYTHONPATH=. python - <<'PY'
          import json, os
          data=json.loads(os.environ['ARTIFACTS_JSON'])
          for name,path in sorted(data.items()):
              print(f'--artifact\n{name}={path}')
          PY
          )
          stage_summary="$(PYTHONPATH=. python - <<'PY'
          import json, os
          print(json.loads(os.environ['STAGE_SUMMARY_JSON']))
          PY
          )"
          PYTHONPATH=. python scripts/survey_agent_control_v2.py \
            --repo-root . --config config/survey-production-v2.json \
            advance-stage --state "$STATE" \
            "${artifact_args[@]}" \
            --reviews "$REVIEWS_PATH" \
            --summary "$stage_summary"

      - name: Validate resulting resumable Production State
        shell: bash
        env:
          STATE: ${{ steps.request.outputs.state }}
        run: |
          set -euo pipefail
          PYTHONPATH=. python - <<'PY'
          import os, pathlib
          from scripts import survey_agent_control_v2 as agent
          from scripts import survey_production_v2 as core
          root=pathlib.Path('.').resolve()
          state_path=(root/os.environ['STATE']).resolve()
          state=core.load_json(state_path)
          cfg=core.load_json(root/core.DEFAULT_CONFIG)
          errors=agent.validate_agent_state(root,cfg,state)
          if errors: raise SystemExit('; '.join(errors))
          print('Production State validation PASS')
          PY

      - name: Commit compact control records to execution branch
        shell: bash
        env:
          SOURCE_ROOT: ${{ steps.request.outputs.source_root }}
          REQUEST_PATH: ${{ steps.request.outputs.request_path }}
          ISSUE_ID: ${{ steps.request.outputs.issue_id }}
          PUSH_BRANCH: ${{ github.event_name == 'pull_request' && github.head_ref || github.ref_name }}
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm -f "$REQUEST_PATH"
          git add "$SOURCE_ROOT"
          if git diff --cached --quiet; then
            echo 'No control changes to commit.' >&2
            exit 1
          fi
          git commit -m "Advance ${ISSUE_ID} Survey Production Core v2"
          git push origin "HEAD:${PUSH_BRANCH}"
