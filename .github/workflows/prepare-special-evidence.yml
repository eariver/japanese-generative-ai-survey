name: Prepare Special Evidence package

on:
  workflow_dispatch:
    inputs:
      special_slug:
        description: Special slug, for example 2026-M07
        required: true
        type: string
      screening_run_sha:
        description: Accepted Screening result-set SHA-256
        required: true
        type: string

permissions:
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout current control code
        uses: actions/checkout@v6
        with:
          ref: main
          path: control-src
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Resolve Special edition
        id: edition
        shell: bash
        env:
          SPECIAL_SLUG: ${{ inputs.special_slug }}
        run: |
          set -euo pipefail
          manifest="control-src/specials/${SPECIAL_SLUG}/edition.json"
          test -s "$manifest"
          python control-src/scripts/special_pipeline.py --config control-src/config/special-pipeline.json validate --manifest "$manifest"
          special_id="$(python -c "import json; print(json.load(open('$manifest'))['special_id'])")"
          work_branch="$(python -c "import json; print(json.load(open('$manifest'))['paths']['work_branch'])")"
          echo "special_id=$special_id" >> "$GITHUB_OUTPUT"
          echo "work_branch=$work_branch" >> "$GITHUB_OUTPUT"
      - name: Checkout canonical Special work branch
        uses: actions/checkout@v6
        with:
          ref: ${{ steps.edition.outputs.work_branch }}
          path: worktree
          fetch-depth: 1
      - name: Verify Special state and Raw provenance
        shell: bash
        env:
          SPECIAL_ID: ${{ steps.edition.outputs.special_id }}
        run: |
          set -euo pipefail
          python control-src/scripts/raw_provenance.py --repo-root worktree --issue-id "$SPECIAL_ID" check
          python - <<'PY'
          import json, os
          p=f"worktree/sources/{os.environ['SPECIAL_ID']}/pipeline-state.json"
          s=json.load(open(p,encoding='utf-8'))
          assert s['lifecycle_state']=='CANDIDATES_NORMALIZED', s['lifecycle_state']
          assert s['gates']['candidate_inventory']=='passed'
          assert s['gates']['evidence_normalized']=='pending'
          PY
      - name: Build exact Special Evidence package
        shell: bash
        env:
          SPECIAL_ID: ${{ steps.edition.outputs.special_id }}
          WORK_BRANCH: ${{ steps.edition.outputs.work_branch }}
          SCREENING_RUN_SHA: ${{ inputs.screening_run_sha }}
        run: |
          set -euo pipefail
          source_commit="$(git -C worktree rev-parse HEAD)"
          PYTHONPATH=control-src python control-src/scripts/prepare_special_evidence_run.py \
            --repo-root worktree \
            --output-root out/evidence-package \
            --issue-id "$SPECIAL_ID" \
            --screening-run-sha "$SCREENING_RUN_SHA" \
            --source-ref "$WORK_BRANCH" \
            --source-commit "$source_commit"
      - name: Upload immutable Special Evidence package
        uses: actions/upload-artifact@v7
        with:
          name: special-evidence-input-${{ inputs.special_slug }}-${{ inputs.screening_run_sha }}
          path: out/evidence-package/
          if-no-files-found: error
          retention-days: 14
