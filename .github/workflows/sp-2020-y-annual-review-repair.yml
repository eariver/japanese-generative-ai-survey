name: SP-2020-Y annual review repair

on:
  push:
    branches:
      - special/2020-Y-work
    paths:
      - 'sources/SP-2020-Y/editorial/annual-review-repair-request.json'

permissions:
  contents: write

concurrency:
  group: sp-2020-y-annual-review-repair
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout current control code
        uses: actions/checkout@v6
        with:
          ref: main
          path: control-src
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Checkout SP-2020-Y work branch
        uses: actions/checkout@v6
        with:
          ref: special/2020-Y-work
          path: worktree
          fetch-depth: 0

      - name: Verify request and immutable boundary
        shell: bash
        run: |
          set -euo pipefail
          python control-src/scripts/raw_provenance.py --repo-root worktree --issue-id SP-2020-Y check
          python - <<'PY'
          import hashlib,json,pathlib
          root=pathlib.Path('worktree')
          request=json.load(open(root/'sources/SP-2020-Y/editorial/annual-review-repair-request.json',encoding='utf-8'))
          assert request['schema_version']=='1.0'
          assert request['issue_id']=='SP-2020-Y'
          assert request['parent_source_version']=='v0.4'
          assert request['source_specific_version']=='v0.5'
          assert request['final_source_version']=='v0.10'
          assert request['issue_refs']==[139,54,78,140,271,272,122]
          state=json.load(open(root/'sources/SP-2020-Y/pipeline-state.json',encoding='utf-8'))
          assert state['lifecycle_state']=='RELEASE_CANDIDATE'
          gates=state['gates']
          assert gates['issue_architecture']=='passed'
          assert gates['article_draft']=='passed'
          assert gates['claim_and_chronology_validation']=='passed'
          assert gates['latex_build']=='passed'
          assert gates['visual_review']=='pending'
          assert gates['freeze']=='pending'
          assert 'publication_preview' not in state.get('provenance',{})
          src=state['provenance']['validated_issue_source']
          assert src['source_version']=='v0.4'
          manifest=root/src['path']
          assert manifest.is_file()
          assert hashlib.sha256(manifest.read_bytes()).hexdigest()==src['sha256']
          chronology=state['provenance']['annual_chronology']
          assert int(chronology['event_count'])==28
          assert int(chronology['unresolved_date_count'])==0
          marker=root/'sources/SP-2020-Y/editorial/layout-revision-v0.5.json'
          assert marker.is_file()
          m=json.load(open(marker,encoding='utf-8'))
          assert (m.get('layout_changes') or {}).get('annual_source_specific_notes_v1') is True
          assert (m.get('layout_changes') or {}).get('half_year_review_repairs_v3') is True
          constraints=m.get('constraints') or {}
          assert constraints.get('new_external_evidence_allowed') is False
          assert constraints.get('selected_evidence_only') is True
          assert constraints.get('accepted_article_claims_changed') is False
          assert constraints.get('evidence_cards_mutated') is False
          PY

      - name: Repair source-specific Annual Technical Notes (#139)
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=control-src python control-src/scripts/revise_special_annual_source_specific_notes_v5.py \
            --repo-root worktree \
            --special-slug 2020-Y \
            --issue-id SP-2020-Y \
            --source-version v0.5 \
            > annual-source-specific-v0.5-audit.json
          cat annual-source-specific-v0.5-audit.json

      - name: Apply ordered Annual review repairs (#54 #78 #140 #271 #272 #122)
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=control-src python control-src/scripts/revise_special_annual_review_sequence_generic.py \
            --repo-root worktree \
            --special-slug 2020-Y \
            --issue-id SP-2020-Y \
            --parent-source-version v0.5 \
            > annual-ordered-review-v0.10-audit.json
          cat annual-ordered-review-v0.10-audit.json

      - name: Verify repaired reader contract
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib,json,pathlib,re
          root=pathlib.Path('worktree')
          state=json.load(open(root/'sources/SP-2020-Y/pipeline-state.json',encoding='utf-8'))
          assert state['lifecycle_state']=='VALIDATED_DRAFT'
          gates=state['gates']
          assert gates['claim_and_chronology_validation']=='passed'
          assert gates['latex_build']=='pending'
          assert gates['visual_review']=='pending'
          assert gates['freeze']=='pending'
          src=state['provenance']['validated_issue_source']
          assert src['source_version']=='v0.10'
          manifest_path=root/src['path']
          assert hashlib.sha256(manifest_path.read_bytes()).hexdigest()==src['sha256']
          manifest=json.load(open(manifest_path,encoding='utf-8'))
          repairs=manifest.get('ordered_review_repairs') or []
          assert [x['step'] for x in repairs[-5:]]==['54','78-140','271','272','122']
          assert manifest['issue_54']['card_count']>=1
          assert manifest['issue_271']['suppressed_count']==2
          assert manifest['issue_272']['dated_event_count']==28
          assert manifest['issue_272']['cited_event_count']==28
          assert manifest['issue_122']['toc_depth']==1
          chronology=state['provenance']['annual_chronology']
          assert chronology['source_version']=='v0.10'
          assert int(chronology['event_count'])==28
          assert int(chronology['unresolved_date_count'])==0

          source_dir=manifest_path.parent
          rendered=[]
          for article in manifest.get('articles') or []:
              rel=str(article.get('technical_notes_path') or '')
              if rel and (source_dir/rel).is_file() and int(article.get('evidence_record_count') or 0)>0:
                  rendered.append((source_dir/rel).read_text(encoding='utf-8'))
          notes='\n'.join(rendered)
          generic_patterns=(
              r'一次資料で「[^」]+」が2020年の生成AI技術記録に含まれることを確認できる',
              r'一次資料で確認できる範囲の事実を記録しており、提供元・プロジェクト・著者による評価を独立再現済みの結果として扱わない',
          )
          for pattern in generic_patterns:
              assert not re.search(pattern, notes), pattern
          assert '時系列 & —' not in notes
          assert ' & PRODUCT & ' not in notes
          assert not re.search(r'\b(?:OTHER|PRODUCT|[A-Z][A-Z0-9]+_[A-Z0-9_]+)\b', notes.replace('URL',''))

          refs=(source_dir/'references.bib').read_text(encoding='utf-8')
          assert 'Primary source used for chronology and technical verification' not in refs
          assert not re.search(r'title\s*=\s*\{Primary source \d+', refs)
          assert 'Language Models are Few-Shot Learners' in refs
          assert 'Retrieval-Augmented Generation for Knowledge-Intensive NLP Tasks' in refs

          main=(source_dir/'main.tex').read_text(encoding='utf-8')
          for package in ('annual-chronology','synthesis-transition-2021'):
              article=next(a for a in manifest['articles'] if a.get('package_id')==package)
              rel=str(article.get('technical_notes_path') or '')
              token='\\input{'+pathlib.Path(rel).with_suffix('').as_posix()+'}'
              assert token not in main

          chrono_article=next(a for a in manifest['articles'] if a.get('package_id')=='annual-chronology')
          chrono_body=(source_dir/chrono_article['layout_body_path']).read_text(encoding='utf-8')
          assert chrono_body.count('\\cite{')==28
          front=(source_dir/(manifest.get('frontmatter') or {}).get('path','sections/00-frontmatter.tex')).read_text(encoding='utf-8')
          assert '\\setcounter{tocdepth}{1}' in front
          PY

      - name: Commit repaired Annual source
        working-directory: worktree
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A surveys/special/2020-Y sources/SP-2020-Y
          git diff --cached --quiet && { echo 'No Annual review repair changes to commit' >&2; exit 1; }
          git commit -m 'Repair SP-2020-Y Publication Preview review findings'
          git push origin HEAD:special/2020-Y-work

      - name: Upload repair audits
        uses: actions/upload-artifact@v4
        with:
          name: sp-2020-y-annual-review-repair
          path: |
            annual-source-specific-v0.5-audit.json
            annual-ordered-review-v0.10-audit.json
          retention-days: 14
