name: Collect Special supplemental primary sources

on:
  workflow_dispatch:
    inputs:
      special_slug:
        description: Special slug, for example 2024-H2
        required: true
        type: string
      plan_revision:
        description: Supplemental plan revision, for example v0.1
        required: true
        default: v0.1
        type: string
      review_reference:
        description: Coverage-audit reference authorizing deterministic gap-fill collection
        required: true
        type: string

permissions:
  contents: write
  actions: read

concurrency:
  group: special-supplemental-primary-sources-${{ inputs.special_slug }}
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout current control code
        uses: actions/checkout@v6
        with:
          ref: main
          path: control-src
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Resolve Special edition and canonical work branch
        id: edition
        shell: bash
        env:
          SPECIAL_SLUG: ${{ inputs.special_slug }}
          PLAN_REVISION: ${{ inputs.plan_revision }}
        run: |
          set -euo pipefail
          [[ "$SPECIAL_SLUG" =~ ^[A-Za-z0-9][A-Za-z0-9._-]{2,63}$ ]]
          [[ "$PLAN_REVISION" =~ ^v[0-9]+\.[0-9]+$ ]]
          manifest="control-src/specials/${SPECIAL_SLUG}/edition.json"
          test -s "$manifest"
          python control-src/scripts/special_pipeline.py --config control-src/config/special-pipeline.json validate --manifest "$manifest"
          echo "special_id=$(python -c "import json; print(json.load(open('$manifest'))['special_id'])")" >> "$GITHUB_OUTPUT"
          echo "work_branch=$(python -c "import json; print(json.load(open('$manifest'))['paths']['work_branch'])")" >> "$GITHUB_OUTPUT"
      - name: Checkout Special work branch
        uses: actions/checkout@v6
        with:
          ref: ${{ steps.edition.outputs.work_branch }}
          path: worktree
          fetch-depth: 0
      - name: Verify supplemental collection boundary
        shell: bash
        env:
          SPECIAL_ID: ${{ steps.edition.outputs.special_id }}
          SPECIAL_SLUG: ${{ inputs.special_slug }}
          PLAN_REVISION: ${{ inputs.plan_revision }}
          REVIEW_REFERENCE: ${{ inputs.review_reference }}
        run: |
          set -euo pipefail
          test -n "$REVIEW_REFERENCE"
          cmp "control-src/specials/${SPECIAL_SLUG}/edition.json" "worktree/specials/${SPECIAL_SLUG}/edition.json"
          state="worktree/sources/${SPECIAL_ID}/pipeline-state.json"
          plan="worktree/sources/${SPECIAL_ID}/coverage/supplemental-source-plan-${PLAN_REVISION}.json"
          test -s "$state"
          test -s "$plan"
          python -m json.tool "$plan" >/dev/null
          python - "$state" "$plan" "$SPECIAL_ID" <<'PY'
          import json,sys
          state=json.load(open(sys.argv[1],encoding='utf-8'))
          plan=json.load(open(sys.argv[2],encoding='utf-8'))
          issue=sys.argv[3]
          assert state['issue_id']==issue
          assert state['lifecycle_state']=='DISCOVERY_COLLECTED', state['lifecycle_state']
          assert state['gates']['raw_sources_preserved']=='passed'
          assert state['gates']['candidate_inventory']=='pending'
          assert state['gates']['evidence_normalized']=='pending'
          assert state['gates']['candidate_selection']=='pending'
          assert plan['issue_id']==issue
          assert plan.get('purpose')=='SUPPLEMENTAL_PRIMARY_SOURCE_GAP_FILL'
          assert plan['coverage']['start']==state['calendar']['collection_window_start']
          assert plan['coverage']['end']==state['calendar']['collection_window_end']
          PY
          python control-src/scripts/raw_provenance.py --repo-root worktree --issue-id "$SPECIAL_ID" check
      - name: Collect exact supplemental primary-source pages
        shell: bash
        env:
          SPECIAL_ID: ${{ steps.edition.outputs.special_id }}
          PLAN_REVISION: ${{ inputs.plan_revision }}
        run: |
          set -euo pipefail
          python control-src/scripts/collect_special_supplemental_sources.py \
            --plan "worktree/sources/${SPECIAL_ID}/coverage/supplemental-source-plan-${PLAN_REVISION}.json" \
            --output-root worktree \
            --config control-src/config/source-intake.json \
            --audit-output supplemental-collection-audit.json
      - name: Update and verify Raw provenance
        shell: bash
        env:
          SPECIAL_ID: ${{ steps.edition.outputs.special_id }}
        run: |
          set -euo pipefail
          python control-src/scripts/raw_provenance.py --repo-root worktree --issue-id "$SPECIAL_ID" --report raw-update-report.json update
          python control-src/scripts/raw_provenance.py --repo-root worktree --issue-id "$SPECIAL_ID" --report raw-check-report.json check
      - name: Verify supplemental records enter canonical Screening normalization
        shell: bash
        env:
          SPECIAL_ID: ${{ steps.edition.outputs.special_id }}
          PLAN_REVISION: ${{ inputs.plan_revision }}
        run: |
          set -euo pipefail
          rm -rf screening-check
          python control-src/scripts/build_screening_index.py \
            --input-root worktree \
            --output-dir screening-check \
            --issue-id "$SPECIAL_ID" \
            --max-records 40 \
            --max-json-chars 80000 > screening-check-report.json
          python - "$SPECIAL_ID" "$PLAN_REVISION" <<'PY'
          import json, pathlib, sys
          issue,rev=sys.argv[1:]
          plan=json.load(open(pathlib.Path('worktree')/'sources'/issue/'coverage'/f'supplemental-source-plan-{rev}.json',encoding='utf-8'))
          ids=set()
          for line in open('screening-check/screening-index.jsonl',encoding='utf-8'):
              if line.strip(): ids.add(json.loads(line)['screening_id'])
          missing=[item['id'] for item in plan['items'] if f"official-index:{item['id']}" not in ids]
          assert not missing, f'supplemental sources missing from Screening: {missing}'
          PY
      - name: Record coverage audit collection reference
        shell: bash
        env:
          SPECIAL_ID: ${{ steps.edition.outputs.special_id }}
          PLAN_REVISION: ${{ inputs.plan_revision }}
          REVIEW_REFERENCE: ${{ inputs.review_reference }}
        run: |
          set -euo pipefail
          python - "$SPECIAL_ID" "$PLAN_REVISION" "$REVIEW_REFERENCE" <<'PY'
          import datetime as dt,json,pathlib,sys
          issue,rev,reference=sys.argv[1:]
          root=pathlib.Path('worktree')/'sources'/issue/'coverage'
          audit=json.load(open('supplemental-collection-audit.json',encoding='utf-8'))
          value={
            'schema_version':'1.0',
            'issue_id':issue,
            'plan_revision':rev,
            'status':'COLLECTED',
            'collected_at':dt.datetime.now(dt.timezone.utc).isoformat(timespec='seconds'),
            'review_reference':reference,
            'collector_run_id':audit['collector_run_id'],
            'planned_count':audit['planned_count'],
            'collected_count':audit['collected_count'],
            'screening_ids':audit['screening_ids'],
          }
          (root/f'supplemental-source-collection-{rev}.json').write_text(json.dumps(value,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          PY
      - name: Commit supplemental source observations
        working-directory: worktree
        shell: bash
        env:
          SPECIAL_ID: ${{ steps.edition.outputs.special_id }}
          WORK_BRANCH: ${{ steps.edition.outputs.work_branch }}
          PLAN_REVISION: ${{ inputs.plan_revision }}
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "sources/${SPECIAL_ID}/collectors" "sources/${SPECIAL_ID}/raw-index.json" "sources/${SPECIAL_ID}/coverage"
          git diff --cached --quiet && exit 0
          git commit -m "Collect supplemental primary sources ${PLAN_REVISION} for ${SPECIAL_ID}"
          git push origin "HEAD:${WORK_BRANCH}"
      - name: Upload supplemental collection audit
        uses: actions/upload-artifact@v7
        with:
          name: special-supplemental-primary-sources-${{ inputs.special_slug }}-${{ inputs.plan_revision }}
          path: |
            supplemental-collection-audit.json
            raw-update-report.json
            raw-check-report.json
            screening-check-report.json
          if-no-files-found: error
          retention-days: 14
