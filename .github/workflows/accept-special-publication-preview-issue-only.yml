name: Accept Special Publication Preview — issue-only release

on:
  workflow_dispatch:
    inputs:
      special_slug:
        required: true
        type: string
      approved_pdf_sha256:
        required: true
        type: string
      approved_at:
        required: true
        type: string
      approval_reference:
        required: true
        type: string

permissions:
  actions: write
  contents: write
  pull-requests: write

concurrency:
  group: special-publication-preview-${{ inputs.special_slug }}
  cancel-in-progress: false

jobs:
  approve-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout current control code
        uses: actions/checkout@v6
        with:
          ref: main
          path: control-src
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Resolve Special edition
        id: edition
        shell: bash
        env:
          SPECIAL_SLUG: ${{ inputs.special_slug }}
        run: |
          set -euo pipefail
          manifest="control-src/specials/${SPECIAL_SLUG}/edition.json"
          test -s "$manifest"
          python control-src/scripts/special_pipeline.py --config control-src/config/special-pipeline.json validate --manifest "$manifest"
          echo "special_id=$(python -c "import json; print(json.load(open('$manifest'))['special_id'])")" >> "$GITHUB_OUTPUT"
          echo "work_branch=$(python -c "import json; print(json.load(open('$manifest'))['paths']['work_branch'])")" >> "$GITHUB_OUTPUT"

      - name: Checkout Special work branch
        uses: actions/checkout@v6
        with:
          ref: ${{ steps.edition.outputs.work_branch }}
          path: worktree
          fetch-depth: 0

      - name: Resolve approved Publication Preview build provenance
        shell: bash
        env:
          SPECIAL_ID: ${{ steps.edition.outputs.special_id }}
          SPECIAL_SLUG: ${{ inputs.special_slug }}
          APPROVED_PDF_SHA256: ${{ inputs.approved_pdf_sha256 }}
        run: |
          set -euo pipefail
          python - "$SPECIAL_ID" "$SPECIAL_SLUG" "$APPROVED_PDF_SHA256" <<'PY' > build.env
          import json,pathlib,sys
          issue,slug,approved_sha=sys.argv[1:]
          state=json.load(open(pathlib.Path('worktree')/'sources'/issue/'pipeline-state.json',encoding='utf-8'))
          assert state['lifecycle_state']=='RELEASE_CANDIDATE'
          assert state['gates']['latex_build']=='passed'
          assert state['gates']['visual_review']=='pending'
          assert state['gates']['freeze']=='pending'
          automation=state.get('automation') or {}
          model=automation.get('human_gate_model')
          if model is not None:
              assert model=='ARCHITECTURE_PUBLICATION_PREVIEW_WITH_EXCEPTION'
          latex=state['provenance']['latex_build']; source=state['provenance']['validated_issue_source']
          assert latex['pdf_sha256']==approved_sha
          assert latex['source_version']==source['source_version']
          print(f"RUN_ID={latex['workflow_run_id']}")
          print(f"SOURCE_VERSION={source['source_version']}")
          print(f"ARTIFACT_NAME=japanese-generative-ai-survey-special-{slug}-{source['source_version']}")
          PY
          cat build.env >> "$GITHUB_ENV"

      - name: Re-fetch and verify exact approved PDF artifact
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          APPROVED_PDF_SHA256: ${{ inputs.approved_pdf_sha256 }}
        run: |
          set -euo pipefail
          mkdir -p approved-build
          gh run download "$RUN_ID" --repo "$GH_REPO" -n "$ARTIFACT_NAME" -D approved-build
          pdf=$(find approved-build -type f -name main.pdf -print -quit)
          test -n "$pdf" && test -s "$pdf"
          actual=$(sha256sum "$pdf" | awk '{print $1}')
          test "$actual" = "$APPROVED_PDF_SHA256"
          echo "APPROVED_PDF_PATH=$pdf" >> "$GITHUB_ENV"
          artifact_json=$(gh api "repos/${GH_REPO}/actions/runs/${RUN_ID}/artifacts" --jq ".artifacts[] | select(.name == \"${ARTIFACT_NAME}\") | {id: .id, digest: .digest, expired: .expired}")
          test -n "$artifact_json"
          test "$(printf '%s' "$artifact_json" | jq -r '.expired')" = false
          echo "ARTIFACT_ID=$(printf '%s' "$artifact_json" | jq -r '.id')" >> "$GITHUB_ENV"
          echo "ARTIFACT_DIGEST=$(printf '%s' "$artifact_json" | jq -r '.digest')" >> "$GITHUB_ENV"

      - name: Record Publication Preview approval and create Freeze candidate
        shell: bash
        env:
          SPECIAL_ID: ${{ steps.edition.outputs.special_id }}
          SPECIAL_SLUG: ${{ inputs.special_slug }}
          APPROVED_PDF_SHA256: ${{ inputs.approved_pdf_sha256 }}
          APPROVED_AT: ${{ inputs.approved_at }}
          APPROVAL_REFERENCE: ${{ inputs.approval_reference }}
        run: |
          set -euo pipefail
          PYTHONPATH=control-src python control-src/scripts/accept_special_visual_review_issue_only.py \
            --repo-root worktree \
            --issue-id "$SPECIAL_ID" \
            --special-slug "$SPECIAL_SLUG" \
            --approved-pdf "$APPROVED_PDF_PATH" \
            --approved-pdf-sha256 "$APPROVED_PDF_SHA256" \
            --approved-at "$APPROVED_AT" \
            --approval-reference "$APPROVAL_REFERENCE" \
            --artifact-name "$ARTIFACT_NAME" \
            --artifact-id "$ARTIFACT_ID" \
            --artifact-digest "$ARTIFACT_DIGEST" \
            > publication-preview-acceptance-audit.json
          cat publication-preview-acceptance-audit.json

      - name: Verify Publication Preview authority and exact Freeze candidate
        shell: bash
        env:
          SPECIAL_ID: ${{ steps.edition.outputs.special_id }}
          SPECIAL_SLUG: ${{ inputs.special_slug }}
          APPROVED_AT: ${{ inputs.approved_at }}
          APPROVAL_REFERENCE: ${{ inputs.approval_reference }}
        run: |
          set -euo pipefail
          python - "$SPECIAL_ID" "$SPECIAL_SLUG" "$APPROVED_AT" "$APPROVAL_REFERENCE" <<'PY'
          import hashlib,json,pathlib,sys
          issue,slug,approved_at,reference=sys.argv[1:]; root=pathlib.Path('worktree')
          state=json.load(open(root/'sources'/issue/'pipeline-state.json',encoding='utf-8'))
          assert state['gates']['visual_review']=='passed' and state['gates']['freeze']=='pending'
          preview=state['provenance']['publication_preview']; pp=root/preview['path']
          assert hashlib.sha256(pp.read_bytes()).hexdigest()==preview['sha256']
          approval=json.load(open(pp,encoding='utf-8'))
          assert approval['status']=='APPROVED'
          assert approval['approval_mode']=='PUBLICATION_PREVIEW_APPROVAL'
          assert approval['approved_at']==approved_at
          assert approval['approval_reference']==reference
          assert approval['authorizes']==['visual_review','freeze','work_pr_merge','public_release']
          fc=state['provenance']['freeze_candidate']; p=root/fc['path']
          assert p.name=='freeze-candidate.json'
          assert hashlib.sha256(p.read_bytes()).hexdigest()==fc['sha256']
          candidate=json.load(open(p,encoding='utf-8'))
          assert candidate['status']=='READY_FOR_DETERMINISTIC_FREEZE'
          assert candidate['publication_authority']['mode']=='PUBLICATION_PREVIEW_APPROVAL'
          assert candidate['release_identity_mode']=='ISSUE_ONLY'
          assert candidate['release_tag']==f'special/{slug}'
          assert 'proposed_release_revision' not in candidate
          assert candidate['asset_name']==f'Japanese_Generative_AI_Technical_Survey_Special_{slug}.pdf'
          PY

      - name: Commit Publication Preview approval
        working-directory: worktree
        shell: bash
        env:
          SPECIAL_ID: ${{ steps.edition.outputs.special_id }}
          WORK_BRANCH: ${{ steps.edition.outputs.work_branch }}
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "sources/${SPECIAL_ID}/pipeline-state.json" "sources/${SPECIAL_ID}/visual-review" "sources/${SPECIAL_ID}/freeze"
          git commit -m "Accept ${SPECIAL_ID} Publication Preview"
          git push origin "HEAD:${WORK_BRANCH}"

      - name: Verify publication finalization boundary
        shell: bash
        env:
          SPECIAL_ID: ${{ steps.edition.outputs.special_id }}
          SPECIAL_SLUG: ${{ inputs.special_slug }}
        run: |
          set -euo pipefail
          python control-src/scripts/raw_provenance.py --repo-root worktree --issue-id "$SPECIAL_ID" check
          python - "$SPECIAL_ID" "$SPECIAL_SLUG" <<'PY'
          import hashlib,json,pathlib,sys
          issue,slug=sys.argv[1:]; root=pathlib.Path('worktree')
          state=json.load(open(root/'sources'/issue/'pipeline-state.json',encoding='utf-8'))
          assert state['lifecycle_state']=='RELEASE_CANDIDATE'
          assert state['gates']['visual_review']=='passed' and state['gates']['freeze']=='pending'
          p=root/'sources'/issue/'freeze'/'freeze-candidate.json'
          candidate=json.load(open(p,encoding='utf-8'))
          assert candidate['status']=='READY_FOR_DETERMINISTIC_FREEZE'
          assert candidate['publication_authority']['mode']=='PUBLICATION_PREVIEW_APPROVAL'
          assert candidate['release_identity_mode']=='ISSUE_ONLY'
          assert candidate['release_tag']==f'special/{slug}'
          source=candidate['validated_issue_source']; sp=root/source['path']
          assert hashlib.sha256(sp.read_bytes()).hexdigest()==source['sha256']
          vr=candidate['visual_review']; vp=root/vr['path']; approval=json.load(open(vp,encoding='utf-8'))
          assert hashlib.sha256(vp.read_bytes()).hexdigest()==vr['sha256']
          assert approval['status']=='APPROVED'
          assert approval['approval_mode']=='PUBLICATION_PREVIEW_APPROVAL'
          PY

      - name: Freeze under Publication Preview authority
        shell: bash
        env:
          SPECIAL_ID: ${{ steps.edition.outputs.special_id }}
          SPECIAL_SLUG: ${{ inputs.special_slug }}
          APPROVED_AT: ${{ inputs.approved_at }}
          APPROVAL_REFERENCE: ${{ inputs.approval_reference }}
        run: |
          set -euo pipefail
          PYTHONPATH=control-src python control-src/scripts/accept_special_freeze_issue_only.py \
            --repo-root worktree \
            --issue-id "$SPECIAL_ID" \
            --special-slug "$SPECIAL_SLUG" \
            --approved-at "$APPROVED_AT" \
            --approval-reference "$APPROVAL_REFERENCE" \
            | tee special-freeze-audit.json

      - name: Verify frozen issue-only release manifest
        shell: bash
        env:
          SPECIAL_ID: ${{ steps.edition.outputs.special_id }}
          SPECIAL_SLUG: ${{ inputs.special_slug }}
        run: |
          set -euo pipefail
          python - "$SPECIAL_ID" "$SPECIAL_SLUG" <<'PY'
          import hashlib,json,pathlib,sys
          issue,slug=sys.argv[1:]; root=pathlib.Path('worktree')
          state=json.load(open(root/'sources'/issue/'pipeline-state.json',encoding='utf-8'))
          assert state['lifecycle_state']=='FROZEN' and state['gates']['freeze']=='passed'
          assert state['automation']['unattended_public_release'] is False
          assert state['automation']['human_gate_required_for_public_release'] is False
          freeze=state['provenance']['freeze']; fp=root/freeze['path']; rp=root/freeze['release_manifest_path']
          assert fp.name=='freeze.json'
          assert hashlib.sha256(fp.read_bytes()).hexdigest()==freeze['sha256']
          assert hashlib.sha256(rp.read_bytes()).hexdigest()==freeze['release_manifest_sha256']
          frozen=json.load(open(fp,encoding='utf-8'))
          manifest=json.load(open(rp,encoding='utf-8'))
          assert frozen['release_authority']=='PUBLICATION_PREVIEW_APPROVAL'
          assert manifest['release_identity_mode']=='ISSUE_ONLY'
          assert manifest['release_tag']==f'special/{slug}'
          assert 'revision' not in manifest
          assert manifest['public_release_authorized'] is True
          assert manifest['release_authorization']['mode']=='PUBLICATION_PREVIEW_APPROVAL'
          assert manifest['expected_pdf_sha256']==frozen['canonical_pdf']['sha256']
          current=root/'surveys'/'special'/slug/'CURRENT_RELEASE.md'
          assert current.is_file() and 'not a public Release version' in current.read_text(encoding='utf-8')
          PY

      - name: Commit Freeze record and release-authorized manifest
        working-directory: worktree
        shell: bash
        env:
          SPECIAL_ID: ${{ steps.edition.outputs.special_id }}
          SPECIAL_SLUG: ${{ inputs.special_slug }}
          WORK_BRANCH: ${{ steps.edition.outputs.work_branch }}
        run: |
          set -euo pipefail
          git add \
            "sources/${SPECIAL_ID}/pipeline-state.json" \
            "sources/${SPECIAL_ID}/freeze/freeze.json" \
            "sources/${SPECIAL_ID}/release-manifest.json" \
            "surveys/special/${SPECIAL_SLUG}/CURRENT_RELEASE.md"
          if git ls-files --error-unmatch "surveys/special/${SPECIAL_SLUG}/main.tex" >/dev/null 2>&1; then
            git add "surveys/special/${SPECIAL_SLUG}/main.tex"
          fi
          git commit -m "Freeze ${SPECIAL_ID} under Publication Preview approval"
          git push origin "HEAD:${WORK_BRANCH}"

      - name: Merge frozen work PR
        working-directory: worktree
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          WORK_BRANCH: ${{ steps.edition.outputs.work_branch }}
        run: |
          set -euo pipefail
          pr_number=$(gh pr list --repo "$REPOSITORY" --head "$WORK_BRANCH" --base main --state open --json number --jq '.[0].number')
          test -n "$pr_number"
          if [ "$(gh pr view "$pr_number" --repo "$REPOSITORY" --json isDraft --jq .isDraft)" = "true" ]; then
            gh pr ready "$pr_number" --repo "$REPOSITORY"
          fi
          head_sha=$(git rev-parse HEAD)
          gh pr merge "$pr_number" --repo "$REPOSITORY" --merge --match-head-commit "$head_sha"

      - name: Dispatch exact-byte publication
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          SPECIAL_SLUG: ${{ inputs.special_slug }}
        run: |
          set -euo pipefail
          gh workflow run publish-special-frozen-release-issue-only.yml \
            --repo "$REPOSITORY" --ref main \
            -f special_slug="$SPECIAL_SLUG"

      - name: Upload Publication Preview audit
        uses: actions/upload-artifact@v7
        with:
          name: special-publication-preview-${{ inputs.special_slug }}-${{ env.SOURCE_VERSION }}
          path: |
            publication-preview-acceptance-audit.json
            special-freeze-audit.json
          if-no-files-found: error
          retention-days: 30
