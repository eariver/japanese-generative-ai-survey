name: Apply Special interactive screening

on:
  workflow_dispatch:
    inputs:
      special_slug:
        description: Special slug, for example 2026-M07
        required: true
        type: string
      review_reference:
        description: Human/interactive review reference
        required: true
        type: string

permissions:
  contents: write
  actions: read

concurrency:
  group: special-interactive-screening-${{ inputs.special_slug }}
  cancel-in-progress: false

jobs:
  screening:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout current control code
        uses: actions/checkout@v6
        with:
          ref: main
          path: control-src
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Resolve edition and branch
        id: edition
        shell: bash
        env:
          SPECIAL_SLUG: ${{ inputs.special_slug }}
        run: |
          set -euo pipefail
          manifest="control-src/specials/${SPECIAL_SLUG}/edition.json"
          test -s "$manifest"
          python control-src/scripts/special_pipeline.py --config control-src/config/special-pipeline.json validate --manifest "$manifest"
          special_id="$(python -c "import json; print(json.load(open('$manifest'))['special_id'])")"
          work_branch="$(python -c "import json; print(json.load(open('$manifest'))['paths']['work_branch'])")"
          echo "special_id=$special_id" >> "$GITHUB_OUTPUT"
          echo "work_branch=$work_branch" >> "$GITHUB_OUTPUT"
      - name: Checkout Special work branch
        uses: actions/checkout@v6
        with:
          ref: ${{ steps.edition.outputs.work_branch }}
          path: worktree
          fetch-depth: 0
      - name: Verify Raw provenance before screening
        shell: bash
        env:
          SPECIAL_ID: ${{ steps.edition.outputs.special_id }}
        run: |
          set -euo pipefail
          python control-src/scripts/raw_provenance.py --repo-root worktree --issue-id "$SPECIAL_ID" check
      - name: Require interactive override review file
        id: override
        shell: bash
        env:
          SPECIAL_ID: ${{ steps.edition.outputs.special_id }}
        run: |
          set -euo pipefail
          path="worktree/sources/${SPECIAL_ID}/screening/interactive-overrides-v0.1.json"
          test -s "$path"
          python -m json.tool "$path" >/dev/null
          echo "path=$path" >> "$GITHUB_OUTPUT"
      - name: Remove incomplete persisted Screening payload from an interrupted prior push
        working-directory: worktree
        shell: bash
        env:
          SPECIAL_ID: ${{ steps.edition.outputs.special_id }}
        run: |
          set -euo pipefail
          python - "$SPECIAL_ID" <<'PY'
          import json, pathlib, shutil, sys
          issue = sys.argv[1]
          root = pathlib.Path('sources') / issue
          state = json.loads((root / 'pipeline-state.json').read_text(encoding='utf-8'))
          if state.get('lifecycle_state') != 'DISCOVERY_COLLECTED':
              raise SystemExit(0)
          runs = root / 'screening' / 'runs'
          if not runs.is_dir():
              raise SystemExit(0)
          for candidate in sorted(runs.iterdir()):
              if candidate.is_dir() and not (candidate / 'acceptance.json').is_file():
                  shutil.rmtree(candidate)
          PY
      - name: Generate, validate, and accept complete Screening results
        shell: bash
        env:
          SPECIAL_ID: ${{ steps.edition.outputs.special_id }}
          WORK_BRANCH: ${{ steps.edition.outputs.work_branch }}
          REVIEW_REFERENCE: ${{ inputs.review_reference }}
        run: |
          set -euo pipefail
          source_commit="$(git -C worktree rev-parse HEAD)"
          PYTHONPATH=control-src python control-src/scripts/run_special_interactive_screening.py \
            --repo-root worktree \
            --issue-id "$SPECIAL_ID" \
            --source-ref "$WORK_BRANCH" \
            --source-commit "$source_commit" \
            --overrides "worktree/sources/${SPECIAL_ID}/screening/interactive-overrides-v0.1.json" \
            --review-reference "$REVIEW_REFERENCE" \
            --audit-output screening-audit.json
      - name: Persist accepted Screening payload and state transition
        working-directory: worktree
        shell: bash
        env:
          SPECIAL_ID: ${{ steps.edition.outputs.special_id }}
          WORK_BRANCH: ${{ steps.edition.outputs.work_branch }}
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git config http.version HTTP/1.1
          git config http.postBuffer 524288000

          result_set_sha="$(python - <<'PY'
          import json
          print(json.load(open('../screening-audit.json', encoding='utf-8'))['result_set_sha256'])
          PY
          )"
          run_root="sources/${SPECIAL_ID}/screening/runs/${result_set_sha}"
          test -s "${run_root}/acceptance.json"
          test -d "${run_root}/results"
          test -d "${run_root}/validation"

          push_work_branch() {
            local attempt
            for attempt in 1 2 3; do
              if git push origin "HEAD:${WORK_BRANCH}"; then return 0; fi
              if [ "$attempt" -lt 3 ]; then sleep $((attempt * 2)); fi
            done
            return 1
          }

          mapfile -d '' payload_paths < <(
            find "${run_root}/results" "${run_root}/validation" -type f -print0 | sort -z
          )
          chunk_size=120
          chunk_number=0
          total="${#payload_paths[@]}"
          for ((offset=0; offset<total; offset+=chunk_size)); do
            chunk=("${payload_paths[@]:offset:chunk_size}")
            git add -- "${chunk[@]}"
            if git diff --cached --quiet; then continue; fi
            chunk_number=$((chunk_number + 1))
            git commit -m "Persist Screening payload chunk ${chunk_number} for ${SPECIAL_ID}"
            push_work_branch
          done

          # screening-reviewed.jsonl is a reproducible convenience aggregate of all
          # batch result files. Very large half-year issues can exceed GitHub's 100 MB
          # single-file limit. The canonical acceptance, exact batch results, validation
          # reports, verification queue, and progress/package metadata are sufficient to
          # reproduce it; downstream Evidence consumes the verification queue, not this
          # aggregate. Therefore do not persist the aggregate itself.
          for derived in screening-run-package.json verification-queue.jsonl screening-progress.json; do
            path="${run_root}/${derived}"
            test -f "$path"
            git add -- "$path"
            if git diff --cached --quiet; then continue; fi
            git commit -m "Persist Screening derived ${derived} for ${SPECIAL_ID}"
            push_work_branch
          done

          git add -- "${run_root}/acceptance.json" "sources/${SPECIAL_ID}/pipeline-state.json"
          if git diff --cached --quiet; then
            echo 'No final Screening acceptance/state change to commit.'
            exit 0
          fi
          git commit -m "Accept interactive screening for ${SPECIAL_ID}"
          push_work_branch
      - name: Upload Screening audit
        uses: actions/upload-artifact@v7
        with:
          name: special-interactive-screening-${{ inputs.special_slug }}
          path: screening-audit.json
          if-no-files-found: error
          retention-days: 14
