name: Run M06 balanced layout once

on:
  pull_request:
    types: [synchronize]

permissions:
  contents: write

concurrency:
  group: special-balanced-layout-2026-M06-run-once
  cancel-in-progress: false

jobs:
  revise:
    if: github.event.pull_request.number == 45 && github.event.pull_request.head.ref == 'special/2026-M06-work'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout current control code
        uses: actions/checkout@v6
        with:
          ref: main
          path: control-src
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Checkout Special work branch
        uses: actions/checkout@v6
        with:
          ref: special/2026-M06-work
          path: worktree
          fetch-depth: 0
      - name: Verify balanced-layout boundary
        shell: bash
        run: |
          set -euo pipefail
          python control-src/scripts/raw_provenance.py --repo-root worktree --issue-id SP-2026-M06 check >/dev/null
          python - <<'PY'
          import hashlib,json,pathlib
          root=pathlib.Path('worktree'); state=json.load(open(root/'sources/SP-2026-M06/pipeline-state.json',encoding='utf-8'))
          assert state['lifecycle_state']=='RELEASE_CANDIDATE'
          assert state['gates']['latex_build']=='passed' and state['gates']['visual_review']=='pending' and state['gates']['freeze']=='pending'
          src=state['provenance']['validated_issue_source']; assert src['source_version']=='v0.3' and src['sha256']=='90dc80c01b45a9f89f0f057d33fe931c812b5b5d84afc8231db3a02fe0ba85e0'
          assert state['provenance']['latex_build']['pdf_sha256']=='88810600d5b29a9e366e54b83a90f82188ab39b657941de15f2e68a7ff297bfc'
          assert state['provenance']['latex_build']['page_count']==35
          artifact=root/'sources/SP-2026-M06/editorial/final-synthesis-v0.4.json'; assert artifact.is_file()
          final=json.load(open(artifact,encoding='utf-8'))
          assert final['constraints']['new_external_evidence_allowed'] is False
          assert final['constraints']['selected_evidence_only'] is True
          assert final['closing_heading']=='6月をどう位置づけるか'
          assert not (root/'surveys/special/2026-M06/revisions/v0.4').exists()
          PY
      - name: Build balanced multicol v0.4
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=control-src python control-src/scripts/revise_special_balanced_layout.py \
            --repo-root worktree \
            --special-slug 2026-M06 \
            --issue-id SP-2026-M06 \
            --source-version v0.4 \
            > special-balanced-layout-audit.json
      - name: Normalize pre-Human Visual QA provenance and verify
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib,json,pathlib
          root=pathlib.Path('worktree'); sp=root/'sources/SP-2026-M06/pipeline-state.json'; state=json.load(open(sp,encoding='utf-8'))
          assert state['lifecycle_state']=='VALIDATED_DRAFT'
          assert state['gates']['latex_build']=='pending' and state['gates']['visual_review']=='pending' and state['gates']['freeze']=='pending'
          src=state['provenance']['validated_issue_source']; assert src['source_version']=='v0.4'
          manifest=root/src['path']; assert hashlib.sha256(manifest.read_bytes()).hexdigest()==src['sha256']
          data=json.load(open(manifest,encoding='utf-8'))
          assert data['status']=='VALIDATED_BALANCED_MIXED_LAYOUT_REVISION'
          lr=data['layout_revision']
          assert lr['full_width_chapter_headings'] is True and lr['balanced_multicols'] is True and lr['hard_column_mode_switches'] is False
          assert lr['article_sections_changed'] is False and lr['technical_notes_changed'] is False and lr['theme_synthesis_changed'] is False
          assert lr['final_chapter_added'] is True and lr['new_external_evidence'] is False
          assert data['final_synthesis']['selected_evidence_only'] is True
          rendered=(manifest.parent/data['final_synthesis']['tex_path']).read_text(encoding='utf-8')
          assert '6月をどう位置づけるか' in rendered and '7月をどう位置づけるか' not in rendered
          rev=state.get('provenance',{}).get('reader_layout_revision',{})
          rev['reason']='Editorial render-first QA of v0.3 identified large blank regions from hard column-mode switches before the Human Visual Review gate; use full-width headings, balanced local multicols, preserved Theme Synthesis/Technical Notes, and a selected-Evidence-only final retrospective synthesis.'
          state['provenance']['reader_layout_revision']=rev
          sp.write_text(json.dumps(state,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          print(json.dumps({'source_version':'v0.4','manifest_sha256':src['sha256'],'layout':data['layout']['body_mode']},ensure_ascii=False))
          PY
      - name: Commit v0.4 and remove wrapper
        working-directory: worktree
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/m06-balanced-layout-run-once.yml
          git add sources/SP-2026-M06/pipeline-state.json surveys/special/2026-M06/revisions/v0.4
          git commit -m 'Balance reader layout v0.4 for SP-2026-M06'
          git push origin HEAD:special/2026-M06-work
      - name: Upload balanced layout audit
        uses: actions/upload-artifact@v7
        with:
          name: special-balanced-layout-2026-M06-v0.4
          path: special-balanced-layout-audit.json
          if-no-files-found: error
          retention-days: 14
