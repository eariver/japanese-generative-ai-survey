name: Apply Weekly interactive screening

on:
  workflow_dispatch:
    inputs:
      issue_id:
        description: Weekly issue ID (YYYY-Www)
        required: true
        type: string
      review_reference:
        description: Human/interactive review reference
        required: true
        type: string

permissions:
  contents: write
  actions: read

concurrency:
  group: weekly-interactive-screening-${{ inputs.issue_id }}
  cancel-in-progress: false

jobs:
  screening:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout current control code
        uses: actions/checkout@v6
        with:
          ref: main
          path: control-src
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Resolve Weekly work branch
        id: issue
        shell: bash
        env:
          ISSUE_ID: ${{ inputs.issue_id }}
        run: |
          set -euo pipefail
          if ! [[ "${ISSUE_ID}" =~ ^[0-9]{4}-W[0-9]{2}$ ]]; then
            echo '::error::issue_id must use YYYY-Www form'
            exit 2
          fi
          echo "work_branch=weekly/${ISSUE_ID}-work" >> "$GITHUB_OUTPUT"

      - name: Checkout Weekly work branch
        uses: actions/checkout@v6
        with:
          ref: ${{ steps.issue.outputs.work_branch }}
          path: worktree
          fetch-depth: 0

      - name: Verify Raw provenance before screening
        shell: bash
        env:
          ISSUE_ID: ${{ inputs.issue_id }}
        run: |
          set -euo pipefail
          python control-src/scripts/raw_provenance.py --repo-root worktree --issue-id "$ISSUE_ID" check

      - name: Require compact interactive selection file
        id: selection
        shell: bash
        env:
          ISSUE_ID: ${{ inputs.issue_id }}
        run: |
          set -euo pipefail
          path="worktree/sources/${ISSUE_ID}/screening/interactive-selection-v0.1.json"
          test -s "$path"
          python -m json.tool "$path" >/dev/null
          echo "path=$path" >> "$GITHUB_OUTPUT"

      - name: Generate, validate, and accept complete Screening results
        shell: bash
        env:
          ISSUE_ID: ${{ inputs.issue_id }}
          WORK_BRANCH: ${{ steps.issue.outputs.work_branch }}
          REVIEW_REFERENCE: ${{ inputs.review_reference }}
        run: |
          set -euo pipefail
          source_commit="$(git -C worktree rev-parse HEAD)"
          PYTHONPATH=control-src python control-src/scripts/run_weekly_interactive_screening.py \
            --repo-root worktree \
            --issue-id "$ISSUE_ID" \
            --source-ref "$WORK_BRANCH" \
            --source-commit "$source_commit" \
            --selection "worktree/sources/${ISSUE_ID}/screening/interactive-selection-v0.1.json" \
            --review-reference "$REVIEW_REFERENCE" \
            --audit-output screening-audit.json

      - name: Commit accepted Screening set and state transition
        working-directory: worktree
        shell: bash
        env:
          ISSUE_ID: ${{ inputs.issue_id }}
          WORK_BRANCH: ${{ steps.issue.outputs.work_branch }}
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "sources/${ISSUE_ID}/screening" "sources/${ISSUE_ID}/pipeline-state.json"
          if git diff --cached --quiet; then
            echo 'No Screening change to commit.'
            exit 0
          fi
          git commit -m "Accept interactive screening for ${ISSUE_ID}"
          git push origin "HEAD:${WORK_BRANCH}"

      - name: Upload Screening audit
        uses: actions/upload-artifact@v7
        with:
          name: weekly-interactive-screening-${{ inputs.issue_id }}
          path: screening-audit.json
          if-no-files-found: error
          retention-days: 14
