name: Run M06 Freeze and Release once

on:
  pull_request:
    types: [synchronize]
    paths:
      - 'sources/SP-2026-M06/editorial/freeze-release-trigger.txt'

permissions:
  contents: write
  actions: write
  pull-requests: write

jobs:
  freeze:
    if: github.event.pull_request.number == 45 && github.event.pull_request.head.ref == 'special/2026-M06-work'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout current control code
        uses: actions/checkout@v6
        with:
          ref: main
          path: control-src
          fetch-depth: 1

      - name: Checkout Special work branch
        uses: actions/checkout@v6
        with:
          ref: special/2026-M06-work
          path: worktree
          fetch-depth: 0

      - name: Verify pre-Freeze provenance and authorization
        shell: bash
        run: |
          set -euo pipefail
          python control-src/scripts/raw_provenance.py --repo-root worktree --issue-id SP-2026-M06 check >/dev/null
          python - <<'PY'
          import hashlib,json,pathlib
          root=pathlib.Path('worktree')
          state=json.load(open(root/'sources/SP-2026-M06/pipeline-state.json',encoding='utf-8'))
          assert state['lifecycle_state']=='RELEASE_CANDIDATE'
          assert state['gates']['visual_review']=='passed'
          assert state['gates']['freeze']=='pending'
          vr=state['provenance']['visual_review']
          assert vr['source_version']=='v0.9'
          assert vr['pdf_sha256']=='2d7b9d3abe3e90fcf3de9112f1204b8b8ed765986a04e30dc0ba92b1c0c499cf'
          vp=root/vr['path']; assert hashlib.sha256(vp.read_bytes()).hexdigest()==vr['sha256']
          candidate_path=root/'sources/SP-2026-M06/freeze/freeze-candidate.json'
          c=json.load(open(candidate_path,encoding='utf-8'))
          assert c['status']=='PENDING_HUMAN_FREEZE_APPROVAL'
          assert c['release_identity_mode']=='ISSUE_ONLY'
          assert c['release_tag']=='special/2026-M06'
          assert c['asset_name']=='Japanese_Generative_AI_Technical_Survey_Special_2026-M06.pdf'
          assert c['canonical_pdf_candidate']['sha256']==vr['pdf_sha256']
          PY

      - name: Accept Human Freeze approval
        shell: bash
        env:
          APPROVED_AT: '2026-08-11T22:43:00+09:00'
          APPROVAL_REFERENCE: 'User authorization 2026-08-11 22:43 JST: after approving SP-2026-M06 v0.9 Visual Review, explicitly authorized proceeding directly through Freeze and Release because no intervening editorial or validation gate remains.'
        run: |
          set -euo pipefail
          PYTHONPATH=control-src python control-src/scripts/accept_special_freeze_issue_only.py \
            --repo-root worktree \
            --issue-id SP-2026-M06 \
            --special-slug 2026-M06 \
            --approved-at "$APPROVED_AT" \
            --approval-reference "$APPROVAL_REFERENCE" \
            | tee special-freeze-audit.json

      - name: Verify frozen issue-only release manifest
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib,json,pathlib
          root=pathlib.Path('worktree')
          state=json.load(open(root/'sources/SP-2026-M06/pipeline-state.json',encoding='utf-8'))
          assert state['lifecycle_state']=='FROZEN'
          assert state['gates']['visual_review']=='passed'
          assert state['gates']['freeze']=='passed'
          assert state['automation']['human_gate_required_for_public_release'] is False
          freeze=state['provenance']['freeze']; fp=root/freeze['path']; rp=root/freeze['release_manifest_path']
          assert fp.name=='freeze.json'
          assert hashlib.sha256(fp.read_bytes()).hexdigest()==freeze['sha256']
          assert hashlib.sha256(rp.read_bytes()).hexdigest()==freeze['release_manifest_sha256']
          manifest=json.load(open(rp,encoding='utf-8'))
          assert manifest['release_identity_mode']=='ISSUE_ONLY'
          assert manifest['release_tag']=='special/2026-M06'
          assert manifest['asset_name']=='Japanese_Generative_AI_Technical_Survey_Special_2026-M06.pdf'
          assert manifest['public_release_authorized'] is True
          assert manifest['release_authorization']['mode']=='FREEZE_APPROVAL'
          assert manifest['expected_pdf_sha256']=='2d7b9d3abe3e90fcf3de9112f1204b8b8ed765986a04e30dc0ba92b1c0c499cf'
          current=root/'surveys/special/2026-M06/CURRENT_RELEASE.md'
          assert current.is_file() and 'not a public Release version' in current.read_text(encoding='utf-8')
          PY

      - name: Commit Freeze record and remove one-off wrapper
        working-directory: worktree
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm -f .github/workflows/run-m06-freeze-release-once.yml
          rm -f sources/SP-2026-M06/editorial/freeze-release-trigger.txt
          git add \
            sources/SP-2026-M06/pipeline-state.json \
            sources/SP-2026-M06/freeze/freeze.json \
            sources/SP-2026-M06/release-manifest.json \
            surveys/special/2026-M06/CURRENT_RELEASE.md
          if git diff -- surveys/special/2026-M06/main.tex | grep -q .; then
            git add surveys/special/2026-M06/main.tex
          fi
          git add -u .github/workflows/run-m06-freeze-release-once.yml sources/SP-2026-M06/editorial/freeze-release-trigger.txt || true
          git commit -m 'Freeze SP-2026-M06 and authorize issue-only Release'
          git push origin HEAD:special/2026-M06-work

      - name: Merge frozen work PR
        working-directory: worktree
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          pr_number=$(gh pr list --repo "$REPOSITORY" --head special/2026-M06-work --base main --state open --json number --jq '.[0].number')
          test "$pr_number" = '45'
          if [ "$(gh pr view "$pr_number" --repo "$REPOSITORY" --json isDraft --jq .isDraft)" = "true" ]; then
            gh pr ready "$pr_number" --repo "$REPOSITORY"
          fi
          head_sha=$(git rev-parse HEAD)
          gh pr merge "$pr_number" --repo "$REPOSITORY" --merge --match-head-commit "$head_sha"

      - name: Dispatch publication under Freeze authority
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          APPROVAL_REFERENCE: 'User authorization 2026-08-11 22:43 JST: approved SP-2026-M06 v0.9 Visual Review and authorized direct Freeze and Release; Freeze is the final publication authority.'
        run: |
          set -euo pipefail
          gh workflow run publish-special-frozen-release-issue-only.yml \
            --repo "$REPOSITORY" \
            --ref main \
            -f special_slug=2026-M06 \
            -f approval_reference="$APPROVAL_REFERENCE"

      - name: Upload Freeze audit
        uses: actions/upload-artifact@v7
        with:
          name: special-freeze-2026-M06
          path: special-freeze-audit.json
          if-no-files-found: error
          retention-days: 30
