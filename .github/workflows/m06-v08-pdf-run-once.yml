name: Run M06 v0.8 PDF once

on:
  pull_request:
    types: [synchronize]

permissions:
  contents: write

concurrency:
  group: special-pdf-2026-M06-v0.8-run-once
  cancel-in-progress: false

jobs:
  build:
    if: github.event.pull_request.number == 45 && github.event.pull_request.head.ref == 'special/2026-M06-work'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout current control code
        uses: actions/checkout@v6
        with:
          ref: main
          path: control-src
          fetch-depth: 1
      - name: Checkout Special work branch
        uses: actions/checkout@v6
        with:
          ref: special/2026-M06-work
          path: worktree
          fetch-depth: 0
      - name: Verify v0.8 source boundary
        id: source
        shell: bash
        run: |
          set -euo pipefail
          python control-src/scripts/raw_provenance.py --repo-root worktree --issue-id SP-2026-M06 check >/dev/null
          python - >> "$GITHUB_OUTPUT" <<'PY'
          import hashlib,json,pathlib
          root=pathlib.Path('worktree'); s=json.load(open(root/'sources/SP-2026-M06/pipeline-state.json',encoding='utf-8'))
          assert s['lifecycle_state']=='VALIDATED_DRAFT'
          assert s['gates']['latex_build']=='pending' and s['gates']['visual_review']=='pending' and s['gates']['freeze']=='pending'
          src=s['provenance']['validated_issue_source']; assert src['source_version']=='v0.8' and src['sha256']=='1c4102cd7e56e9c22ab6d1ecc91d1b3390f311b09f162c7f9f6224754703c4c9'
          manifest=root/src['path']; assert hashlib.sha256(manifest.read_bytes()).hexdigest()==src['sha256']
          d=json.load(open(manifest,encoding='utf-8')); assert d['status']=='VALIDATED_INLINE_CHRONOLOGY_BOUNDARY_REVISION'
          lr=d['layout_revision']; assert lr['reader_content_changed'] is False and lr['chronology_boundary_inline'] is True and lr['chronology_boundary_wording_changed'] is False
          c=d['chronology_synthesis']; chron=manifest.parent/c['tex_path']; assert hashlib.sha256(chron.read_bytes()).hexdigest()==c['tex_sha256']
          assert 'begin{claimboundary}[この年表の境界]' not in chron.read_text(encoding='utf-8')
          print(f'source_dir={manifest.parent.as_posix()}'); print(f'source_manifest={manifest.as_posix()}'); print(f"source_manifest_sha256={src['sha256']}")
          PY
      - name: Pin main survey style
        id: style
        shell: bash
        env:
          SOURCE_DIR: ${{ steps.source.outputs.source_dir }}
        run: |
          set -euo pipefail
          cp control-src/templates/survey/jgaisurvey.sty "$SOURCE_DIR/jgaisurvey.sty"
          c=$(git -C control-src rev-parse HEAD); s=$(sha256sum control-src/templates/survey/jgaisurvey.sty | awk '{print $1}')
          test "$s" = "$(sha256sum "$SOURCE_DIR/jgaisurvey.sty" | awk '{print $1}')"
          echo "control_commit=$c" >> "$GITHUB_OUTPUT"; echo "style_sha256=$s" >> "$GITHUB_OUTPUT"
      - name: Set reproducible PDF timestamp
        run: echo 'SOURCE_DATE_EPOCH=1786406400' >> "$GITHUB_ENV"
      - name: Compile with LuaLaTeX
        uses: xu-cheng/latex-action@v4
        with:
          root_file: main.tex
          working_directory: ${{ steps.source.outputs.source_dir }}
          texlive_version: 2026
          latexmk_use_lualatex: true
          os: alpine
      - name: Analyze TeX log and page budget
        id: audit
        shell: bash
        env:
          SOURCE_DIR: ${{ steps.source.outputs.source_dir }}
          MANIFEST: ${{ steps.source.outputs.source_manifest }}
          MANIFEST_SHA: ${{ steps.source.outputs.source_manifest_sha256 }}
          CONTROL_COMMIT: ${{ steps.style.outputs.control_commit }}
          STYLE_SHA: ${{ steps.style.outputs.style_sha256 }}
        run: |
          set -euo pipefail
          pdf="$SOURCE_DIR/main.pdf"; log="$SOURCE_DIR/main.log"; test -s "$pdf" && test -s "$log"
          bad=$(grep -E -n 'LaTeX Warning: (There were undefined references|Citation .* undefined)|Package biblatex Warning: Please (re)?run|Overfull \\hbox|Underfull \\hbox|Missing character:' "$log" || true)
          pages=$(python - "$log" <<'PY'
          import re,sys
          t=open(sys.argv[1],encoding='utf-8',errors='replace').read(); m=re.findall(r'Output written on .*?\((\d+) pages?',t,re.S)
          if not m: raise SystemExit('page count unavailable')
          print(m[-1])
          PY
          )
          sha=$(sha256sum "$pdf" | awk '{print $1}'); [ -z "$bad" ] && clean=true || clean=false
          python - "$pages" "$sha" "$clean" "$bad" "$MANIFEST" "$MANIFEST_SHA" "$CONTROL_COMMIT" "$STYLE_SHA" <<'PY'
          import json,sys
          pages,sha,clean,bad,manifest,msha,commit,style=sys.argv[1:]
          o={'schema_version':'1.0','issue_id':'SP-2026-M06','source_version':'v0.8','page_count':int(pages),'pdf_sha256':sha,'log_clean':clean=='true','log_gate_findings':bad.splitlines() if bad else [],'page_target_min':32,'page_target_max':40,'source_manifest_path':manifest,'source_manifest_sha256':msha,'build_style':{'control_commit_sha':commit,'path':'templates/survey/jgaisurvey.sty','sha256':style}}
          open('special-pdf-build-audit.json','w',encoding='utf-8').write(json.dumps(o,ensure_ascii=False,indent=2)+'\n'); print(json.dumps(o,ensure_ascii=False,indent=2))
          PY
          echo "page_count=$pages" >> "$GITHUB_OUTPUT"; echo "pdf_sha256=$sha" >> "$GITHUB_OUTPUT"; echo "log_clean=$clean" >> "$GITHUB_OUTPUT"
      - name: Upload v0.8 preview
        uses: actions/upload-artifact@v7
        with:
          name: japanese-generative-ai-survey-special-2026-M06-v0.8
          path: |
            ${{ steps.source.outputs.source_dir }}/main.pdf
            ${{ steps.source.outputs.source_dir }}/main.log
            special-pdf-build-audit.json
          if-no-files-found: error
          retention-days: 14
      - name: Enforce clean 32-40 page candidate
        env:
          PAGES: ${{ steps.audit.outputs.page_count }}
          CLEAN: ${{ steps.audit.outputs.log_clean }}
        run: |
          set -euo pipefail
          test "$CLEAN" = true; test "$PAGES" -ge 32; test "$PAGES" -le 40
      - name: Record successful PDF candidate
        working-directory: worktree
        shell: bash
        env:
          PAGES: ${{ steps.audit.outputs.page_count }}
          PDF_SHA: ${{ steps.audit.outputs.pdf_sha256 }}
          RUN_ID: ${{ github.run_id }}
          MANIFEST: ${{ steps.source.outputs.source_manifest }}
          MANIFEST_SHA: ${{ steps.source.outputs.source_manifest_sha256 }}
          CONTROL_COMMIT: ${{ steps.style.outputs.control_commit }}
          STYLE_SHA: ${{ steps.style.outputs.style_sha256 }}
        run: |
          set -euo pipefail
          python - "$PAGES" "$PDF_SHA" "$RUN_ID" "$MANIFEST" "$MANIFEST_SHA" "$CONTROL_COMMIT" "$STYLE_SHA" <<'PY'
          import json,pathlib,sys
          pages,pdfsha,run,manifest,msha,commit,style=sys.argv[1:]
          p=pathlib.Path('sources/SP-2026-M06/pipeline-state.json'); s=json.load(open(p,encoding='utf-8'))
          assert s['lifecycle_state']=='VALIDATED_DRAFT'; s['lifecycle_state']='RELEASE_CANDIDATE'; s['gates']['latex_build']='passed'
          s.setdefault('provenance',{})['latex_build']={'workflow_run_id':int(run),'pdf_sha256':pdfsha,'page_count':int(pages),'source_version':'v0.8','validated_issue_source_path':manifest,'validated_issue_source_sha256':msha,'build_style':{'control_commit_sha':commit,'path':'templates/survey/jgaisurvey.sty','sha256':style}}
          p.write_text(json.dumps(s,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          PY
          git config user.name 'github-actions[bot]'; git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/m06-v08-pdf-run-once.yml; git add sources/SP-2026-M06/pipeline-state.json
          git commit -m 'Record v0.8 PDF candidate for SP-2026-M06'; git push origin HEAD:special/2026-M06-work
