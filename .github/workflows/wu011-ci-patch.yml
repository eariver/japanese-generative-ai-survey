name: WU011 CI patch

on:
  pull_request:
    branches: [main]
    paths: ['.github/workflows/wu011-ci-patch.yml']

permissions:
  contents: write

jobs:
  patch:
    if: github.event.pull_request.head.ref == 'refactor/survey-production-core-v2'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/survey-production-core-v2
          fetch-depth: 0
      - run: |
          set -euo pipefail
          python scripts/wu011_ci_patch.py
          python - <<'PY'
          import yaml
          from pathlib import Path
          yaml.safe_load(Path('.github/workflows/survey-production-v2-ci.yml').read_text())
          PY
        name: Patch Core v2 CI
      - run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/wu011-ci-patch.yml scripts/wu011_ci_patch.py
          git add .github/workflows/survey-production-v2-ci.yml
          git commit -m 'ci: enforce WU011 handoff implementation regressions'
          git push origin HEAD:refactor/survey-production-core-v2
        name: Commit CI hardening and remove one-shot files
