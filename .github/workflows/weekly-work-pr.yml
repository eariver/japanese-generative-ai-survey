name: Weekly work PR control

on:
  workflow_dispatch:
    inputs:
      issue_id:
        description: Weekly issue ID (YYYY-Www)
        required: true
        type: string

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: weekly-work-pr-${{ inputs.issue_id }}
  cancel-in-progress: false

jobs:
  ensure-draft-pr:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build deterministic PR metadata
        shell: bash
        run: |
          set -euo pipefail
          python scripts/weekly_pr_control.py \
            --issue-id '${{ inputs.issue_id }}' \
            --repo-root . \
            --output pr-control/metadata.json
          python - pr-control/metadata.json > pr-control/body.md <<'PY'
          import json, sys
          print(json.load(open(sys.argv[1], encoding='utf-8'))['body'], end='')
          PY

      - name: Ensure work branch and Draft PR
        id: control
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          metadata='pr-control/metadata.json'
          branch="$(python -c "import json; print(json.load(open('$metadata'))['branch'])")"
          title="$(python -c "import json; print(json.load(open('$metadata'))['title'])")"
          default_branch="$(gh api "repos/${REPOSITORY}" --jq '.default_branch')"
          base_sha="$(gh api "repos/${REPOSITORY}/commits/${default_branch}" --jq '.sha')"
          created_branch=false
          fast_forwarded_branch=false
          created_pr=false

          if git ls-remote --exit-code --heads origin "refs/heads/${branch}" >/dev/null 2>&1; then
            echo "Work branch already exists: ${branch}"
          else
            gh api --method POST "repos/${REPOSITORY}/git/refs" \
              -f ref="refs/heads/${branch}" \
              -f sha="${base_sha}" >/dev/null
            created_branch=true
            echo "Created work branch ${branch} at ${base_sha}"
          fi

          git fetch --no-tags origin "refs/heads/${branch}:refs/remotes/origin/weekly-work"
          head_sha="$(git rev-parse refs/remotes/origin/weekly-work)"
          ahead_count="$(git rev-list --count "${base_sha}..refs/remotes/origin/weekly-work")"
          behind_count="$(git rev-list --count "refs/remotes/origin/weekly-work..${base_sha}")"

          if [ "${ahead_count}" -eq 0 ] && [ "${behind_count}" -gt 0 ]; then
            echo "Work branch has no unique commits and is ${behind_count} commit(s) behind; fast-forwarding to ${base_sha}."
            git push origin "${base_sha}:refs/heads/${branch}"
            git fetch --no-tags origin "refs/heads/${branch}:refs/remotes/origin/weekly-work"
            head_sha="$(git rev-parse refs/remotes/origin/weekly-work)"
            ahead_count="$(git rev-list --count "${base_sha}..refs/remotes/origin/weekly-work")"
            behind_count="$(git rev-list --count "refs/remotes/origin/weekly-work..${base_sha}")"
            fast_forwarded_branch=true
          fi

          prs="$(gh pr list \
            --repo "${REPOSITORY}" \
            --head "${branch}" \
            --base "${default_branch}" \
            --state open \
            --json number,isDraft,url,title)"
          pr_count="$(python -c 'import json,sys; print(len(json.load(sys.stdin)))' <<<"${prs}")"
          if [ "${pr_count}" -gt 1 ]; then
            echo "::error::More than one open PR exists for ${branch}; refusing ambiguous control."
            exit 1
          fi

          pr_number=''
          pr_url=''
          status='WAITING_FOR_WORK_COMMIT'
          if [ "${ahead_count}" -eq 0 ]; then
            if [ "${pr_count}" -ne 0 ]; then
              echo "::error::Open PR exists but work branch has no commits ahead of current default branch."
              exit 1
            fi
            echo "Work branch has no unique commit yet; Draft PR creation is deferred."
          elif [ "${pr_count}" -eq 0 ]; then
            pr_url="$(gh pr create \
              --repo "${REPOSITORY}" \
              --base "${default_branch}" \
              --head "${branch}" \
              --draft \
              --title "${title}" \
              --body-file pr-control/body.md)"
            pr_number="$(gh pr view "${pr_url}" --repo "${REPOSITORY}" --json number --jq '.number')"
            created_pr=true
            status='DRAFT_PR_CREATED'
          else
            pr_number="$(python -c 'import json,sys; print(json.load(sys.stdin)[0]["number"])' <<<"${prs}")"
            pr_url="$(python -c 'import json,sys; print(json.load(sys.stdin)[0]["url"])' <<<"${prs}")"
            is_draft="$(python -c 'import json,sys; print(str(json.load(sys.stdin)[0]["isDraft"]).lower())' <<<"${prs}")"
            if [ "${is_draft}" != 'true' ]; then
              echo "::error::PR #${pr_number} is no longer Draft; automation will not overwrite human review state."
              exit 1
            fi
            gh pr edit "${pr_number}" \
              --repo "${REPOSITORY}" \
              --title "${title}" \
              --body-file pr-control/body.md >/dev/null
            status='DRAFT_PR_UPDATED'
          fi

          python - "$metadata" "${status}" "${default_branch}" "${base_sha}" "${branch}" "${head_sha}" "${ahead_count}" "${behind_count}" "${created_branch}" "${fast_forwarded_branch}" "${created_pr}" "${pr_number}" "${pr_url}" <<'PY'
          import datetime as dt
          import json
          import pathlib
          import sys

          metadata_path, status, default_branch, base_sha, branch, head_sha, ahead_count, behind_count, created_branch, fast_forwarded_branch, created_pr, pr_number, pr_url = sys.argv[1:]
          metadata = json.load(open(metadata_path, encoding='utf-8'))
          result = {
              'schema_version': '1.0',
              'issue_id': metadata['issue_id'],
              'status': status,
              'default_branch': default_branch,
              'base_sha_observed': base_sha,
              'work_branch': branch,
              'work_branch_head_sha': head_sha,
              'ahead_count': int(ahead_count),
              'behind_count': int(behind_count),
              'created_branch': created_branch == 'true',
              'fast_forwarded_branch': fast_forwarded_branch == 'true',
              'created_pr': created_pr == 'true',
              'pr_number': int(pr_number) if pr_number else None,
              'pr_url': pr_url or None,
              'observed_at': dt.datetime.now(dt.timezone.utc).isoformat(timespec='seconds'),
              'rules': metadata['rules'],
          }
          pathlib.Path('pr-control/result.json').write_text(
              json.dumps(result, ensure_ascii=False, indent=2) + '\n', encoding='utf-8'
          )
          print(json.dumps(result, ensure_ascii=False, indent=2))
          PY

      - name: Upload PR control result
        uses: actions/upload-artifact@v7
        with:
          name: weekly-pr-control-${{ inputs.issue_id }}
          path: |
            pr-control/metadata.json
            pr-control/result.json
            pr-control/body.md
          if-no-files-found: error
          retention-days: 14
