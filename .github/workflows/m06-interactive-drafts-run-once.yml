name: Run M06 interactive Draft acceptance once

on:
  pull_request:
    types: [synchronize]

permissions:
  contents: write
  actions: read

concurrency:
  group: special-interactive-drafts-2026-M06-run-once
  cancel-in-progress: false

jobs:
  drafting:
    if: github.event.pull_request.number == 45 && github.event.pull_request.head.ref == 'special/2026-M06-work'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout current control code
        uses: actions/checkout@v6
        with:
          ref: main
          path: control-src
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Checkout Special work branch
        uses: actions/checkout@v6
        with:
          ref: special/2026-M06-work
          path: worktree
          fetch-depth: 0
      - name: Verify interactive Draft boundary and complete body set
        shell: bash
        run: |
          set -euo pipefail
          python control-src/scripts/raw_provenance.py --repo-root worktree --issue-id SP-2026-M06 check
          python - <<'PY'
          import json,pathlib
          root=pathlib.Path('worktree')
          issue='SP-2026-M06'
          state=json.load(open(root/'sources'/issue/'pipeline-state.json',encoding='utf-8'))
          assert state['lifecycle_state']=='ARCHITECTURE_ESTABLISHED', state['lifecycle_state']
          assert state['gates']['issue_architecture']=='passed'
          assert state['gates']['article_draft']=='pending'
          manifest=json.load(open(root/'sources'/issue/'drafting/packages/v0.1/draft-package-manifest.json',encoding='utf-8'))
          expected=sorted(f"{row['package_id']}.json" for row in manifest['package_files'] if row['execution_stage']=='ARTICLE_DRAFTING')
          overrides=root/'sources'/issue/'drafting/interactive-overrides-v0.1'
          actual=sorted(p.name for p in overrides.glob('*.json') if p.is_file())
          assert len(expected)==6, expected
          assert actual==expected, {'expected':expected,'actual':actual}
          print(json.dumps({'expected':expected,'actual':actual},ensure_ascii=False,indent=2))
          PY
      - name: Accept, validate, and render complete interactive Draft set
        shell: bash
        run: |
          set -euo pipefail
          generated_at=$(python - <<'PY'
          from datetime import datetime
          from zoneinfo import ZoneInfo
          print(datetime.now(ZoneInfo('Asia/Tokyo')).isoformat(timespec='seconds'))
          PY
          )
          PYTHONPATH=control-src python control-src/scripts/accept_special_interactive_drafts.py \
            --repo-root worktree \
            --issue-id SP-2026-M06 \
            --package-dir sources/SP-2026-M06/drafting/packages/v0.1 \
            --overrides-dir sources/SP-2026-M06/drafting/interactive-overrides-v0.1 \
            --prompt config/prompts/editorial/article-drafting-v0.1.md \
            --provider OpenAI \
            --model 'GPT-5.6 Sol' \
            --invocation 'interactive ChatGPT project drafting; no paid inference-provider API' \
            --generated-at "$generated_at" \
            --run-reference 'ChatGPT interactive article drafting 2026-08-11 JST: six complete evidence-linked June article bodies prepared from the approved 36-page Special Architecture; no paid inference-provider API.' \
            > interactive-draft-acceptance.json
      - name: Verify accepted Draft state
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,pathlib
          root=pathlib.Path('worktree')/'sources'/'SP-2026-M06'
          state=json.load(open(root/'pipeline-state.json',encoding='utf-8'))
          assert state['lifecycle_state']=='DRAFT_COMPLETE', state['lifecycle_state']
          assert state['gates']['article_draft']=='passed'
          prov=state['provenance']['article_draft']
          run=pathlib.Path('worktree')/prov['result_set_path']
          acceptance=json.load(open(run/'acceptance.json',encoding='utf-8'))
          assert acceptance['article_draft_count']==6, acceptance
          assert len(acceptance['results'])==6
          assert all((run/row['draft_path']).is_file() for row in acceptance['results'])
          assert all((run/row['validation_path']).is_file() for row in acceptance['results'])
          assert all((run/row['tex_path']).is_file() for row in acceptance['results'])
          assert all((run/row['bib_path']).is_file() for row in acceptance['results'])
          print(json.dumps({'result_set_sha256':prov['result_set_sha256'],'acceptance_sha256':prov['acceptance_sha256'],'article_draft_count':prov['article_draft_count']},indent=2))
          PY
      - name: Commit validated Draft results and remove run-once wrapper
        working-directory: worktree
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/m06-interactive-drafts-run-once.yml
          git add sources/SP-2026-M06/pipeline-state.json sources/SP-2026-M06/drafting/runs
          git commit -m 'Accept validated interactive Drafts for SP-2026-M06'
          git push origin HEAD:special/2026-M06-work
      - name: Upload Draft acceptance audit
        uses: actions/upload-artifact@v7
        with:
          name: special-interactive-drafts-2026-M06
          path: interactive-draft-acceptance.json
          if-no-files-found: error
          retention-days: 14
