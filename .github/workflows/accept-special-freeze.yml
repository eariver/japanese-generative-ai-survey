name: Accept Special Freeze

on:
  workflow_dispatch:
    inputs:
      special_slug:
        required: true
        type: string
      release_revision:
        required: true
        type: string
      approved_at:
        required: true
        type: string
      approval_reference:
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: special-freeze-${{ inputs.special_slug }}
  cancel-in-progress: false

jobs:
  freeze:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout current control code
        uses: actions/checkout@v6
        with:
          ref: main
          path: control-src
          fetch-depth: 1
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Resolve Special edition
        id: edition
        shell: bash
        env:
          SPECIAL_SLUG: ${{ inputs.special_slug }}
        run: |
          set -euo pipefail
          manifest="control-src/specials/${SPECIAL_SLUG}/edition.json"
          test -s "$manifest"
          python control-src/scripts/special_pipeline.py --config control-src/config/special-pipeline.json validate --manifest "$manifest"
          echo "special_id=$(python -c "import json; print(json.load(open('$manifest'))['special_id'])")" >> "$GITHUB_OUTPUT"
          echo "work_branch=$(python -c "import json; print(json.load(open('$manifest'))['paths']['work_branch'])")" >> "$GITHUB_OUTPUT"
      - name: Checkout Special work branch
        uses: actions/checkout@v6
        with:
          ref: ${{ steps.edition.outputs.work_branch }}
          path: worktree
          fetch-depth: 0
      - name: Verify pre-Freeze provenance
        shell: bash
        env:
          SPECIAL_ID: ${{ steps.edition.outputs.special_id }}
          RELEASE_REVISION: ${{ inputs.release_revision }}
        run: |
          set -euo pipefail
          python control-src/scripts/raw_provenance.py --repo-root worktree --issue-id "$SPECIAL_ID" check
          python - "$SPECIAL_ID" "$RELEASE_REVISION" <<'PY'
          import hashlib,json,pathlib,sys
          issue,revision=sys.argv[1:]
          root=pathlib.Path('worktree')
          state=json.load(open(root/'sources'/issue/'pipeline-state.json',encoding='utf-8'))
          assert state['lifecycle_state']=='RELEASE_CANDIDATE'
          assert state['gates']['visual_review']=='passed'
          assert state['gates']['freeze']=='pending'
          candidate_path=root/'sources'/issue/'freeze'/f'freeze-candidate-{revision}.json'
          candidate=json.load(open(candidate_path,encoding='utf-8'))
          assert candidate['status']=='PENDING_HUMAN_FREEZE_APPROVAL'
          source=candidate['validated_issue_source']
          source_path=root/source['path']
          assert hashlib.sha256(source_path.read_bytes()).hexdigest()==source['sha256']
          vr=candidate['visual_review']
          vr_path=root/vr['path']
          assert hashlib.sha256(vr_path.read_bytes()).hexdigest()==vr['sha256']
          assert json.load(open(vr_path,encoding='utf-8'))['status']=='APPROVED'
          PY
      - name: Accept Human Freeze approval
        shell: bash
        env:
          SPECIAL_ID: ${{ steps.edition.outputs.special_id }}
          SPECIAL_SLUG: ${{ inputs.special_slug }}
          RELEASE_REVISION: ${{ inputs.release_revision }}
          APPROVED_AT: ${{ inputs.approved_at }}
          APPROVAL_REFERENCE: ${{ inputs.approval_reference }}
        run: |
          set -euo pipefail
          python control-src/scripts/accept_special_freeze.py \
            --repo-root worktree \
            --issue-id "$SPECIAL_ID" \
            --special-slug "$SPECIAL_SLUG" \
            --release-revision "$RELEASE_REVISION" \
            --approved-at "$APPROVED_AT" \
            --approval-reference "$APPROVAL_REFERENCE" \
            | tee special-freeze-audit.json
      - name: Verify frozen state and separate Release gate
        shell: bash
        env:
          SPECIAL_ID: ${{ steps.edition.outputs.special_id }}
          RELEASE_REVISION: ${{ inputs.release_revision }}
        run: |
          set -euo pipefail
          python - "$SPECIAL_ID" "$RELEASE_REVISION" <<'PY'
          import hashlib,json,pathlib,sys
          issue,revision=sys.argv[1:]
          root=pathlib.Path('worktree')
          state=json.load(open(root/'sources'/issue/'pipeline-state.json',encoding='utf-8'))
          assert state['schema_version']=='1.0'
          assert state['issue_id']==issue
          assert state['lifecycle_state']=='FROZEN'
          assert state['revision']==revision
          assert state['calendar']['frozen_at']
          assert state['gates']['visual_review']=='passed'
          assert state['gates']['freeze']=='passed'
          assert state['automation']['unattended_public_release'] is False
          assert state['automation']['human_gate_required_for_public_release'] is True
          freeze=state['provenance']['freeze']
          fp=root/freeze['path']; rp=root/freeze['release_manifest_path']
          assert hashlib.sha256(fp.read_bytes()).hexdigest()==freeze['sha256']
          assert hashlib.sha256(rp.read_bytes()).hexdigest()==freeze['release_manifest_sha256']
          manifest=json.load(open(rp,encoding='utf-8'))
          assert manifest['status']=='frozen'
          assert manifest['public_release_authorized'] is False
          assert manifest['revision']==revision
          assert manifest['expected_pdf_sha256']==json.load(open(fp,encoding='utf-8'))['canonical_pdf']['sha256']
          PY
      - name: Commit Freeze record and frozen release manifest
        working-directory: worktree
        shell: bash
        env:
          SPECIAL_ID: ${{ steps.edition.outputs.special_id }}
          WORK_BRANCH: ${{ steps.edition.outputs.work_branch }}
          RELEASE_REVISION: ${{ inputs.release_revision }}
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            "sources/${SPECIAL_ID}/pipeline-state.json" \
            "sources/${SPECIAL_ID}/freeze/freeze-${RELEASE_REVISION}.json" \
            "sources/${SPECIAL_ID}/release-manifest.json"
          git commit -m "Freeze ${SPECIAL_ID} ${RELEASE_REVISION}"
          git push origin "HEAD:${WORK_BRANCH}"
      - name: Upload Freeze audit
        uses: actions/upload-artifact@v7
        with:
          name: special-freeze-${{ inputs.special_slug }}-${{ inputs.release_revision }}
          path: special-freeze-audit.json
          if-no-files-found: error
          retention-days: 30
