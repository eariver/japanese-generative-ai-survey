name: Expand Special validated source

on:
  workflow_dispatch:
    inputs:
      special_slug:
        required: true
        type: string
      source_version:
        required: true
        type: string
        default: v0.2

permissions:
  contents: write

concurrency:
  group: special-source-expansion-${{ inputs.special_slug }}
  cancel-in-progress: false

jobs:
  expand:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout current control code
        uses: actions/checkout@v6
        with:
          ref: main
          path: control-src
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Resolve Special edition
        id: edition
        shell: bash
        env:
          SPECIAL_SLUG: ${{ inputs.special_slug }}
        run: |
          set -euo pipefail
          manifest="control-src/specials/${SPECIAL_SLUG}/edition.json"
          test -s "$manifest"
          python control-src/scripts/special_pipeline.py --config control-src/config/special-pipeline.json validate --manifest "$manifest"
          echo "special_id=$(python -c "import json; print(json.load(open('$manifest'))['special_id'])")" >> "$GITHUB_OUTPUT"
          echo "work_branch=$(python -c "import json; print(json.load(open('$manifest'))['paths']['work_branch'])")" >> "$GITHUB_OUTPUT"
      - name: Checkout Special work branch
        uses: actions/checkout@v6
        with:
          ref: ${{ steps.edition.outputs.work_branch }}
          path: worktree
          fetch-depth: 0
      - name: Verify source-expansion boundary
        shell: bash
        env:
          SPECIAL_ID: ${{ steps.edition.outputs.special_id }}
        run: |
          set -euo pipefail
          python control-src/scripts/raw_provenance.py --repo-root worktree --issue-id "$SPECIAL_ID" check
          python - "$SPECIAL_ID" <<'PY'
          import json,sys
          issue=sys.argv[1]
          state=json.load(open(f'worktree/sources/{issue}/pipeline-state.json',encoding='utf-8'))
          assert state['lifecycle_state']=='VALIDATED_DRAFT', state['lifecycle_state']
          assert state['gates']['article_draft']=='passed'
          assert state['gates']['claim_and_chronology_validation']=='passed'
          assert state['gates']['latex_build']=='pending'
          assert 'validated_issue_source' in state['provenance']
          PY
      - name: Expand reader-facing source from selected Evidence only
        shell: bash
        env:
          SPECIAL_SLUG: ${{ inputs.special_slug }}
          SPECIAL_ID: ${{ steps.edition.outputs.special_id }}
          SOURCE_VERSION: ${{ inputs.source_version }}
        run: |
          set -euo pipefail
          PYTHONPATH=control-src python control-src/scripts/expand_special_validated_source.py \
            --repo-root worktree \
            --special-slug "$SPECIAL_SLUG" \
            --issue-id "$SPECIAL_ID" \
            --source-version "$SOURCE_VERSION" \
            > special-source-expansion-audit.json
      - name: Verify expanded source manifest and provenance
        shell: bash
        env:
          SPECIAL_SLUG: ${{ inputs.special_slug }}
          SPECIAL_ID: ${{ steps.edition.outputs.special_id }}
          SOURCE_VERSION: ${{ inputs.source_version }}
        run: |
          set -euo pipefail
          python - "$SPECIAL_ID" "$SPECIAL_SLUG" "$SOURCE_VERSION" <<'PY'
          import hashlib,json,sys,pathlib
          issue,slug,version=sys.argv[1:]
          root=pathlib.Path('worktree')
          state=json.load(open(root/'sources'/issue/'pipeline-state.json',encoding='utf-8'))
          assert state['lifecycle_state']=='VALIDATED_DRAFT'
          prov=state['provenance']['validated_issue_source']
          manifest=root/prov['path']
          assert manifest==root/'surveys'/'special'/slug/'revisions'/version/'source-manifest.json', manifest
          assert hashlib.sha256(manifest.read_bytes()).hexdigest()==prov['sha256']
          data=json.load(open(manifest,encoding='utf-8'))
          assert data['status']=='VALIDATED_SOURCE_EXPANSION'
          assert data['article_count']==6
          assert data['evidence_record_count']==19, data['evidence_record_count']
          assert len(state.get('provenance_history',{}).get('validated_issue_source',[]))>=1
          assert (manifest.parent/'main.tex').is_file()
          PY
      - name: Commit expanded source revision
        working-directory: worktree
        shell: bash
        env:
          SPECIAL_ID: ${{ steps.edition.outputs.special_id }}
          SPECIAL_SLUG: ${{ inputs.special_slug }}
          SOURCE_VERSION: ${{ inputs.source_version }}
          WORK_BRANCH: ${{ steps.edition.outputs.work_branch }}
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "sources/${SPECIAL_ID}/pipeline-state.json" "surveys/special/${SPECIAL_SLUG}/revisions/${SOURCE_VERSION}"
          git diff --cached --quiet && exit 0
          git commit -m "Expand validated source ${SOURCE_VERSION} for ${SPECIAL_ID}"
          git push origin "HEAD:${WORK_BRANCH}"
      - name: Upload expansion audit
        uses: actions/upload-artifact@v7
        with:
          name: special-source-expansion-${{ inputs.special_slug }}-${{ inputs.source_version }}
          path: special-source-expansion-audit.json
          if-no-files-found: error
          retention-days: 14
