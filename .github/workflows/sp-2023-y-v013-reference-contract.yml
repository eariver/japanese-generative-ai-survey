name: One-time SP-2023-Y v0.13 reference contract repair
on:
  push:
    branches: [special/2023-Y-work]
    paths: ['.github/workflows/sp-2023-y-v013-reference-contract.yml']
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with: {ref: special/2023-Y-work, fetch-depth: 0}
      - name: Create v0.13 contract-only revision
        run: |
          set -euo pipefail
          python - <<'PY'
          import copy,hashlib,json,pathlib,shutil
          r=pathlib.Path('.'); issue='SP-2023-Y'; sp=r/'sources'/issue/'pipeline-state.json'; s=json.load(open(sp,encoding='utf-8'))
          prev=dict(s['provenance']['validated_issue_source']); assert prev['source_version']=='v0.12'; assert s['lifecycle_state']=='VALIDATED_DRAFT'
          src=r/pathlib.Path(prev['path']).parent; out=r/'surveys/special/2023-Y/revisions/v0.13'; assert not out.exists(); shutil.copytree(src,out)
          main=out/'main.tex'; t=main.read_text(encoding='utf-8')
          old='\\begin{multicols}{2}\n\\raggedright\n\\printbibliography[heading=none]'
          new='\\begin{multicols}{2}\n% half-year References ragged-right compaction\n\\raggedright\n\\printbibliography[heading=none]'
          assert old in t; main.write_text(t.replace(old,new,1),encoding='utf-8')
          def sha(p): return hashlib.sha256(p.read_bytes()).hexdigest()
          m=json.load(open(out/'source-manifest.json',encoding='utf-8')); m['source_version']='v0.13'; m['status']='VALIDATED_ANNUAL_REFERENCE_LAYOUT_CONTRACT_REPAIR'
          m['basis']=dict(m.get('basis') or {}); m['basis']['previous_source_manifest_path']=prev['path']; m['basis']['previous_source_manifest_sha256']=prev['sha256']
          lr=dict(m.get('layout_revision') or {}); lr.update({'half_year_reference_multicol_compaction':True,'references_columns':2,'half_year_reference_raggedright_compaction':True,'references_raggedright':True}); m['layout_revision']=lr
          m['reference_layout_repair']=dict(m.get('reference_layout_repair') or {}); m['reference_layout_repair']['preflight_contract_declared']=True
          m['main_tex']={'path':'main.tex','sha256':sha(main)}; mp=out/'source-manifest.json'; mp.write_text(json.dumps(m,ensure_ascii=False,indent=2)+'\n',encoding='utf-8'); ms=sha(mp)
          s.setdefault('provenance_history',{}).setdefault('validated_issue_source',[]).append(prev); s['provenance']['validated_issue_source']={'path':mp.as_posix(),'sha256':ms,'source_version':'v0.13','layout_mode':'annual-ordered-publication-preview-repair+declared-compact-references'}
          oldc=copy.deepcopy(s['provenance']['annual_chronology']); data=json.load(open(r/pathlib.Path(oldc['path']),encoding='utf-8')); data['source_version']='v0.13'; cout=r/'sources'/issue/'chronology/annual-chronology-v0.13.json'; cout.write_text(json.dumps(data,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          s.setdefault('provenance_history',{}).setdefault('annual_chronology',[]).append(oldc); s['provenance']['annual_chronology']={'source_version':'v0.13','path':cout.as_posix(),'sha256':sha(cout),'event_count':75,'unresolved_date_count':3}
          marker=r/'sources'/issue/'editorial/reference-layout-contract-v0.13.json'; marker.write_text(json.dumps({'schema_version':'1.0','source_version':'v0.13','parent':'v0.12','issue_ref':140,'content_or_evidence_changed':False,'change':'declare existing two-column References block to canonical publication layout preflight'},indent=2)+'\n')
          s['provenance']['reader_layout_revision']={'source_version':'v0.13','reference_layout_contract_path':marker.as_posix(),'reference_layout_contract_sha256':sha(marker),'issue_refs':[140]}; sp.write_text(json.dumps(s,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          PY
      - name: Verify canonical layout preflight locally
        run: PYTHONPATH=. python scripts/special_publication_layout_check.py --repo-root . --issue-id SP-2023-Y
      - name: Commit and self-delete
        run: |
          git config user.name 'github-actions[bot]'; git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm .github/workflows/sp-2023-y-v013-reference-contract.yml
          git add -A surveys/special/2023-Y/revisions/v0.13 sources/SP-2023-Y .github/workflows/sp-2023-y-v013-reference-contract.yml
          git commit -m 'Declare SP-2023-Y compact References contract (v0.13)'
          git push origin HEAD:special/2023-Y-work
