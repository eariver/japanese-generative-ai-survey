name: Weekly issue-only release contract

on:
  pull_request:
    paths:
      - '.github/workflows/release-weekly-survey-issue-only.yml'
      - '.github/workflows/weekly-issue-only-release-contract.yml'
      - 'schemas/weekly-release-manifest.schema.json'
      - 'scripts/release_identity.py'
      - 'tests/test_release_identity.py'
      - 'tests/test_release_manifest.py'
      - 'docs/release-identity-policy.md'
      - 'docs/freeze-release-policy.md'
  push:
    branches: [main]
    paths:
      - '.github/workflows/release-weekly-survey-issue-only.yml'
      - '.github/workflows/weekly-issue-only-release-contract.yml'
      - 'schemas/weekly-release-manifest.schema.json'
      - 'scripts/release_identity.py'
      - 'tests/test_release_identity.py'
      - 'tests/test_release_manifest.py'

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify issue-only Weekly identity and legacy compatibility
        run: |
          set -euo pipefail
          python -m unittest -v tests.test_release_identity tests.test_release_manifest
          python -m json.tool schemas/weekly-release-manifest.schema.json >/dev/null
      - name: Verify Weekly publisher has no public version input
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          text=Path('.github/workflows/release-weekly-survey-issue-only.yml').read_text(encoding='utf-8')
          assert 'revision:' not in text
          assert 'inputs.revision' not in text
          assert "release_identity_mode']!='ISSUE_ONLY'" in text
          assert "if 'revision' in data" in text
          assert "data['release_tag']!=f'weekly/{issue_id}'" in text
          assert 'FREEZE_APPROVAL' in text
          assert 'gh release create' in text
          assert 'Release already exists for issue' in text
          assert 'post-Release correction requires an exceptional correction path' in text
          PY
