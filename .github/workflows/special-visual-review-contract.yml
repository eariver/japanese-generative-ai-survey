name: Special visual review contract

on:
  pull_request:
    paths:
      - '.github/workflows/accept-special-visual-review.yml'
      - '.github/workflows/special-visual-review-contract.yml'
      - 'scripts/accept_special_visual_review.py'
  push:
    branches: [main]
    paths:
      - '.github/workflows/accept-special-visual-review.yml'
      - '.github/workflows/special-visual-review-contract.yml'
      - 'scripts/accept_special_visual_review.py'

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate Visual Review acceptance contract
        run: |
          set -euo pipefail
          python -m py_compile scripts/accept_special_visual_review.py
          python - <<'PY'
          from pathlib import Path
          import tempfile, json, hashlib, subprocess, sys

          with tempfile.TemporaryDirectory() as td:
              root=Path(td)
              issue='SP-TEST-M01'; slug='TEST-M01'; source_version='v0.8'
              state_dir=root/'sources'/issue
              src_dir=root/'surveys'/'special'/slug/'revisions'/source_version
              state_dir.mkdir(parents=True)
              src_dir.mkdir(parents=True)
              source_manifest=src_dir/'source-manifest.json'
              source_manifest.write_text('{"source_version":"v0.8"}\n',encoding='utf-8')
              source_sha=hashlib.sha256(source_manifest.read_bytes()).hexdigest()
              pdf=root/'main.pdf'; pdf.write_bytes(b'%PDF-test-visual-review')
              pdf_sha=hashlib.sha256(pdf.read_bytes()).hexdigest()
              state={
                'schema_version':'1.0','issue_id':issue,'lifecycle_state':'RELEASE_CANDIDATE',
                'gates':{'latex_build':'passed','visual_review':'pending','freeze':'pending'},
                'provenance':{
                  'validated_issue_source':{'path':str(source_manifest.relative_to(root)),'sha256':source_sha,'source_version':source_version},
                  'latex_build':{'pdf_sha256':pdf_sha,'page_count':36,'workflow_run_id':123,'source_version':source_version},
                }
              }
              (state_dir/'pipeline-state.json').write_text(json.dumps(state,indent=2)+'\n',encoding='utf-8')
              subprocess.run([
                sys.executable,'scripts/accept_special_visual_review.py',
                '--repo-root',str(root),'--issue-id',issue,'--special-slug',slug,
                '--approved-pdf',str(pdf),'--approved-pdf-sha256',pdf_sha,
                '--approval-reference','Human approval test','--approved-at','2026-08-11T12:20:00+09:00',
                '--artifact-name','artifact','--artifact-id','999','--artifact-digest','sha256:abc',
                '--proposed-release-revision','v0.1'
              ],check=True,capture_output=True,text=True)
              updated=json.loads((state_dir/'pipeline-state.json').read_text(encoding='utf-8'))
              assert updated['gates']['visual_review']=='passed'
              assert updated['gates']['freeze']=='pending'
              assert updated['lifecycle_state']=='RELEASE_CANDIDATE'
              candidate=json.loads((state_dir/'freeze'/'freeze-candidate-v0.1.json').read_text(encoding='utf-8'))
              assert candidate['status']=='PENDING_HUMAN_FREEZE_APPROVAL'
              assert candidate['canonical_pdf_candidate']['sha256']==pdf_sha
              assert candidate['human_gates']['public_release']=='pending'
          PY
