name: WU011 Driver patch

on:
  pull_request:
    branches: [main]
    paths: ['.github/workflows/wu011-driver-patch.yml']

permissions:
  contents: write

jobs:
  patch:
    if: github.event.pull_request.head.ref == 'refactor/survey-production-core-v2'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/survey-production-core-v2
          fetch-depth: 0
      - name: Patch production driver
        run: |
          set -euo pipefail
          python scripts/wu011_driver_patch.py
          python -m py_compile scripts/survey_orchestrator_v2.py scripts/survey_handoff_v2.py
          python -m json.tool config/survey-production-v2.json >/dev/null
      - name: Commit production driver
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add config/survey-production-v2.json scripts/survey_orchestrator_v2.py
          git commit -m 'core-v2: add one-stage production execution control'
          git push origin HEAD:refactor/survey-production-core-v2
