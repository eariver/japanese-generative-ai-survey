name: Temporary SP001 reader visual render

on:
  push:
    branches:
      - transport/sp001-reader-visual-r1

permissions:
  contents: write

jobs:
  render:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Install renderer
        run: python -m pip install --quiet pymupdf pillow
      - name: Render exact repository PDF
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import fitz
          from PIL import Image, ImageDraw
          from pathlib import Path
          pdf=Path('surveys/special/SP001/main.pdf')
          out=Path('/tmp/sp001-visual')
          out.mkdir(parents=True, exist_ok=True)
          doc=fitz.open(pdf)
          thumbs=[]
          for i,page in enumerate(doc):
              pix=page.get_pixmap(matrix=fitz.Matrix(0.50,0.50), alpha=False)
              img=Image.frombytes('RGB',[pix.width,pix.height],pix.samples)
              page_path=out/f'page-small-{i+1:02d}.jpg'
              img.save(page_path,'JPEG',quality=35,optimize=True)
              thumb=img.copy()
              thumb.thumbnail((120,170))
              canvas=Image.new('RGB',(130,190),'white')
              canvas.paste(thumb,((130-thumb.width)//2,4))
              ImageDraw.Draw(canvas).text((5,174),f'Page {i+1}',fill='black')
              thumbs.append(canvas)
          cols=4
          rows=(len(thumbs)+cols-1)//cols
          sheet=Image.new('RGB',(cols*130,rows*190),(235,235,235))
          for i,im in enumerate(thumbs):
              sheet.paste(im,((i%cols)*130,(i//cols)*190))
          sheet.save(out/'contact-tiny.jpg','JPEG',quality=30,optimize=True)
          print(f'pages={len(doc)} contact={out/"contact-tiny.jpg"} bytes={(out/"contact-tiny.jpg").stat().st_size}')
          PY
      - name: Commit rendered review aids
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p sources/SP001/publication/v2/visual-review-render
          cp /tmp/sp001-visual/*.jpg sources/SP001/publication/v2/visual-review-render/
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add sources/SP001/publication/v2/visual-review-render
          git commit -m 'Transport: render compact SP001 PDF review images'
          git push origin HEAD:transport/sp001-reader-visual-r1
