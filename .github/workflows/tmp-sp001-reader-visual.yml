name: Temporary SP001 reader visual render

on:
  push:
    branches:
      - transport/sp001-reader-visual-r1

permissions:
  contents: write

jobs:
  render:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Install renderer
        run: python -m pip install --quiet pymupdf pillow
      - name: Render exact repository PDF
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import fitz
          from PIL import Image, ImageDraw
          from pathlib import Path
          pdf=Path('surveys/special/SP001/main.pdf')
          out=Path('/tmp/sp001-visual')
          out.mkdir(parents=True, exist_ok=True)
          doc=fitz.open(pdf)
          thumbs=[]
          for i,page in enumerate(doc):
              pix=page.get_pixmap(matrix=fitz.Matrix(1.25,1.25), alpha=False)
              img=Image.frombytes('RGB',[pix.width,pix.height],pix.samples)
              page_path=out/f'page-{i+1:02d}.jpg'
              img.save(page_path,'JPEG',quality=60,optimize=True)
              thumb=img.copy()
              thumb.thumbnail((220,320))
              canvas=Image.new('RGB',(240,350),'white')
              canvas.paste(thumb,((240-thumb.width)//2,10))
              ImageDraw.Draw(canvas).text((10,330),f'Page {i+1}',fill='black')
              thumbs.append(canvas)
          cols=4
          rows=(len(thumbs)+cols-1)//cols
          sheet=Image.new('RGB',(cols*240,rows*350),(235,235,235))
          for i,im in enumerate(thumbs):
              sheet.paste(im,((i%cols)*240,(i//cols)*350))
          sheet.save(out/'contact-sheet.jpg','JPEG',quality=55,optimize=True)
          print(f'pages={len(doc)} contact={out/"contact-sheet.jpg"}')
          PY
      - name: Upload exact-PDF review renders
        uses: actions/upload-artifact@v4
        with:
          name: sp001-reader-visual-renders
          path: /tmp/sp001-visual/*.jpg
          if-no-files-found: error
          retention-days: 1
      - name: Commit rendered review aids
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p sources/SP001/publication/v2/visual-review-render
          cp /tmp/sp001-visual/*.jpg sources/SP001/publication/v2/visual-review-render/
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add sources/SP001/publication/v2/visual-review-render
          git commit -m 'Transport: render SP001 PDF review images with artifact'
          git push origin HEAD:transport/sp001-reader-visual-r1
