name: WU011 Runtime finalize

on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/wu011-gate-pr-patch.yml'

permissions:
  contents: write

jobs:
  finalize:
    if: github.event.pull_request.head.ref == 'refactor/survey-production-core-v2'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/survey-production-core-v2
          fetch-depth: 0
      - name: Apply WU011 runtime integration
        shell: bash
        run: |
          set -euo pipefail
          python scripts/wu011_finalize_runtime_patch.py
          python -m py_compile \
            scripts/survey_production_v2.py \
            scripts/survey_drafting_v2.py \
            scripts/survey_orchestrator_v2.py \
            scripts/survey_handlers_v2.py
      - name: Commit runtime integration and remove one-shot patch files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm \
            .github/workflows/wu011-gate-self-patch.yml \
            .github/workflows/wu011-gate-pr-patch.yml \
            scripts/wu011_finalize_runtime_patch.py
          git add \
            scripts/survey_production_v2.py \
            scripts/survey_drafting_v2.py \
            scripts/survey_orchestrator_v2.py
          git commit -m 'core-v2: finalize exact Human Gate runtime authority'
          git push origin HEAD:refactor/survey-production-core-v2
