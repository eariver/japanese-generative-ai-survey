name: Temporary SP001 r4 state reconciliation

on:
  push:
    branches: [special/SP001-v2-work]
    paths:
      - 'sources/SP001/publication/v2/tmp-r4-state-reconcile-trigger.txt'

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - name: Sparse clone exact trigger head
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          url="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git clone --depth 1 --filter=blob:none --sparse --branch special/SP001-v2-work "$url" repo
          cd repo
          git sparse-checkout set \
            .github/workflows \
            config \
            schemas \
            scripts \
            sources/SP001 \
            surveys/special/SP001 \
            templates/survey \
            docs
          actual=$(git rev-parse HEAD)
          if [ "$actual" != "$GITHUB_SHA" ]; then
            echo "Branch moved before sparse clone: trigger=$GITHUB_SHA cloned=$actual"
            exit 78
          fi

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Core v2 dependencies
        working-directory: repo
        run: python -m pip install -r config/survey-production-v2-requirements.txt

      - name: Reconcile r4 machine stage authority
        working-directory: repo
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=. python - <<'PY'
          from __future__ import annotations
          from copy import deepcopy
          from datetime import datetime, timezone
          from pathlib import Path
          import json

          from scripts import survey_agent_control_v2 as agent
          from scripts import survey_human_gate_v2 as human_gate
          from scripts import survey_production_v2 as core
          from scripts import survey_publication_v2 as publication
          from scripts import survey_stage_validation_v2 as stage_validation

          root = Path('.').resolve()
          cfg = core.load_json(root / 'config/survey-production-v2.json')
          state_path = root / 'sources/SP001/production-state.json'
          source_root = root / 'sources/SP001'
          pub = source_root / 'publication/v2'
          checkpoint_dir = source_root / 'orchestration/v2/checkpoints'
          review_index = source_root / 'gates/review-index.json'
          human_r2 = source_root / 'gates/reviews/publication-r2.json'
          candidate_path = pub / 'publication-candidate-v2.json'

          exact_source_sha = 'ddb5cf7aea900e13a434db98251084d376e30eec238595941e4e17730e1b9150'
          exact_pdf_sha = '7b11545cc1138ecc97771b0debfaf7772971f9e93b9195d28cc30bdc099bf419'
          expected_candidate = publication.validate_candidate(root, candidate_path, issue_id='SP001')
          assert expected_candidate['status'] == 'READY_FOR_PUBLICATION_PREVIEW'
          assert expected_candidate['source']['sha256'] == exact_source_sha
          assert expected_candidate['pdf']['sha256'] == exact_pdf_sha
          assert expected_candidate['pdf']['byte_count'] == 322271
          assert expected_candidate['pdf']['page_count'] == 14

          review_index_sha_before = core.sha256_file(review_index)
          human_r2_sha_before = core.sha256_file(human_r2)
          review_r2 = core.load_json(human_r2)
          assert review_r2['decision'] == 'REQUEST_CHANGES'
          assert review_r2['regeneration_boundary'] == 'ARCHITECTURE_ESTABLISHED'

          current = core.load_json(state_path)
          assert current['lifecycle_state'] == 'RELEASE_CANDIDATE'
          assert current['human_gates']['publication_preview'] == 'pending'
          assert current['human_gates']['architecture_review'] == 'approved'
          old_errors = agent.validate_agent_state(root, cfg, current)
          assert old_errors, 'expected stale r3 validation checkpoint drift before r4 reconciliation'
          if not any('Stage Checkpoint artifact drift' in error for error in old_errors):
              raise AssertionError('unexpected pre-reconciliation failure family: ' + '; '.join(old_errors))

          # Deterministic internal revalidation boundary only. This does NOT record
          # a new Human decision; it replays machine publication validation after
          # the bounded r4 wording/PDF authority refresh.
          revised = human_gate._revised_state(
              root, cfg, current, 'PUBLICATION_PREVIEW', 'DRAFT_COMPLETE'
          )
          assert revised['human_gates'] == current['human_gates']
          assert revised['human_gate_provenance'] == current['human_gate_provenance']
          assert revised['lifecycle_state'] == 'DRAFT_COMPLETE'
          core.write_json(state_path, revised)

          # Supersede only the two machine attestations rebuilt below.
          for name in ('DRAFT_COMPLETE.json', 'VALIDATED_DRAFT.json'):
              (checkpoint_dir / name).unlink(missing_ok=True)

          impl = core.repository_commit_sha(root)
          now = datetime.now(timezone.utc)

          def stage_reviews(run_root: Path, result_path: Path, check_id: str, evidence: str) -> Path:
              reviews_path = run_root / 'reviews.json'
              core.write_json(reviews_path, {
                  'reviews': [
                      {
                          'check_id': agent.CORE_STAGE_REVIEW_ID,
                          'kind': 'DETERMINISTIC',
                          'executor': 'survey_stage_validation_v2',
                          'evidence': 'Canonical Core stage contract validated for SP001 r4 deterministic state reconciliation.',
                          'result_path': str(result_path.relative_to(root)),
                      },
                      {
                          'check_id': check_id,
                          'kind': 'AGENT_EDITORIAL',
                          'executor': 'OpenAI GPT-5.6 Sol',
                          'evidence': evidence,
                      },
                  ]
              })
              return reviews_path

          # DRAFT_COMPLETE -> VALIDATED_DRAFT: exact Reader/source/PDF/quality/reviews.
          run1 = source_root / 'execution/bridge-runs/SP001-r4-state-reconcile-validation'
          run1.mkdir(parents=True, exist_ok=True)
          artifacts1 = {
              'reader-manuscript': pub / 'reader-manuscript-v2.json',
              'validated-source': root / 'surveys/special/SP001/main.tex',
              'publication-pdf': root / 'surveys/special/SP001/main.pdf',
              'quality-regression-bundle': pub / 'quality-regression-bundle-v2.json',
              'semantic-review': pub / 'semantic-editorial-review-v2.json',
              'visual-review': pub / 'visual-review-v2.json',
          }
          result1 = run1 / 'core-stage-contract.json'
          stage_validation.validate_stage(root, cfg, state_path, artifacts1, result1, now)
          reviews1 = stage_reviews(
              run1, result1,
              'SP001_READER_PUBLICATION_R4_EXACT_AUTHORITY',
              'Exact r4 publication authority binds source SHA-256 '+exact_source_sha+
              ' and exact 14-page PDF SHA-256 '+exact_pdf_sha+
              '. Publication Boundary audit is PASS with zero matches, focused Core publication validation passed, and all 14 rendered pages were visually reviewed without clipping, overlap, glyph, pagination, or mixed-layout regression.'
          )
          cp1 = agent.build_stage_checkpoint(
              root, cfg, state_path, artifacts1, reviews1,
              'Revalidate and adopt exact SP001 r4 reader/publication authority after bounded Publication Boundary wording repair, without changing Human review history or asserting approval.',
              now, impl,
          )
          state1 = agent.advance_with_checkpoint(root, cfg, state_path, cp1)
          assert state1['lifecycle_state'] == 'VALIDATED_DRAFT'

          # VALIDATED_DRAFT -> RELEASE_CANDIDATE: exact r4 Candidate.
          now2 = datetime.now(timezone.utc)
          run2 = source_root / 'execution/bridge-runs/SP001-r4-state-reconcile-candidate'
          run2.mkdir(parents=True, exist_ok=True)
          artifacts2 = {'publication-candidate': candidate_path}
          result2 = run2 / 'core-stage-contract.json'
          stage_validation.validate_stage(root, cfg, state_path, artifacts2, result2, now2)
          reviews2 = stage_reviews(
              run2, result2,
              'SP001_PUBLICATION_R4_CANDIDATE_EXACT_BINDING',
              'Core-validated r4 Publication Candidate binds exact source SHA-256 '+exact_source_sha+
              ', exact PDF SHA-256 '+exact_pdf_sha+', 322271 bytes and 14 pages. Publication Preview remains pending; this machine transition does not approve, Freeze, Release, or merge.'
          )
          cp2 = agent.build_stage_checkpoint(
              root, cfg, state_path, artifacts2, reviews2,
              'Adopt the exact SP001 r4 Publication Candidate and return to RELEASE_CANDIDATE / pending Publication Preview Human Gate.',
              now2, impl,
          )
          state2 = agent.advance_with_checkpoint(root, cfg, state_path, cp2)
          assert state2['lifecycle_state'] == 'RELEASE_CANDIDATE'
          assert state2['human_gates']['publication_preview'] == 'pending'
          assert state2['human_gates']['architecture_review'] == 'approved'
          assert state2['terminal_reason'] == 'HUMAN_GATE_REACHED'
          final_errors = agent.validate_agent_state(root, cfg, state2)
          assert final_errors == [], final_errors
          publication.validate_candidate(root, candidate_path, issue_id='SP001')

          # Human decision authority must be byte-identical across reconciliation.
          assert core.sha256_file(review_index) == review_index_sha_before
          assert core.sha256_file(human_r2) == human_r2_sha_before

          audit = {
              'schema_version': '2.0-rc1',
              'issue_id': 'SP001',
              'status': 'PASS',
              'kind': 'DETERMINISTIC_MACHINE_STATE_RECONCILIATION',
              'recorded_at': core.iso_utc(datetime.now(timezone.utc)),
              'implementation_commit_sha': impl,
              'pre_reconciliation_errors': old_errors,
              'replay_boundary': 'DRAFT_COMPLETE',
              'human_review_authority': {
                  'path': str(human_r2.relative_to(root)),
                  'sha256': human_r2_sha_before,
                  'decision': 'REQUEST_CHANGES',
                  'recorded_regeneration_boundary': 'ARCHITECTURE_ESTABLISHED',
                  'unchanged': True,
              },
              'review_index': {
                  'path': str(review_index.relative_to(root)),
                  'sha256': review_index_sha_before,
                  'unchanged': True,
              },
              'candidate': {
                  'path': str(candidate_path.relative_to(root)),
                  'sha256': core.sha256_file(candidate_path),
                  'candidate_sha256': expected_candidate['candidate_sha256'],
                  'source_sha256': exact_source_sha,
                  'pdf_sha256': exact_pdf_sha,
                  'pdf_byte_count': 322271,
                  'page_count': 14,
              },
              'stage_checkpoints': [
                  {'path': str(cp1.relative_to(root)), 'sha256': core.sha256_file(cp1)},
                  {'path': str(cp2.relative_to(root)), 'sha256': core.sha256_file(cp2)},
              ],
              'final_lifecycle_state': state2['lifecycle_state'],
              'publication_preview': state2['human_gates']['publication_preview'],
              'terminal_reason': state2['terminal_reason'],
              'final_state_sha256': core.sha256_file(state_path),
          }
          core.write_json(pub / 'state-reconciliation-audit-r4.json', audit)
          print(json.dumps(audit, ensure_ascii=False, indent=2))
          PY

      - name: Final fail-closed validation
        working-directory: repo
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=. python - <<'PY'
          from pathlib import Path
          from scripts import survey_agent_control_v2 as agent
          from scripts import survey_production_v2 as core
          from scripts import survey_publication_v2 as publication
          root=Path('.').resolve()
          cfg=core.load_json(root/'config/survey-production-v2.json')
          state=core.load_json(root/'sources/SP001/production-state.json')
          errors=agent.validate_agent_state(root,cfg,state)
          assert errors == [], errors
          c=publication.validate_candidate(root,root/'sources/SP001/publication/v2/publication-candidate-v2.json',issue_id='SP001')
          assert state['lifecycle_state']=='RELEASE_CANDIDATE'
          assert state['human_gates']['publication_preview']=='pending'
          assert state['terminal_reason']=='HUMAN_GATE_REACHED'
          assert c['pdf']['sha256']=='7b11545cc1138ecc97771b0debfaf7772971f9e93b9195d28cc30bdc099bf419'
          print('SP001 r4 final machine state validation PASS')
          print('candidate='+c['candidate_sha256'])
          PY

      - name: Commit reconciliation and remove temporary transport
        working-directory: repo
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          rm -f .github/workflows/tmp-sp001-r4-*.yml
          rm -f sources/SP001/publication/v2/tmp-r4-*.txt
          rm -f scripts/tmp_sp001_r4_authority_refresh.py
          find . -type d -name __pycache__ -prune -exec rm -rf {} +
          find . -name '*.pyc' -delete
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git status --short
          git commit -m 'Reconcile SP001 r4 machine state to Publication Preview'
          git fetch --depth 1 origin special/SP001-v2-work
          remote_head=$(git rev-parse FETCH_HEAD)
          if [ "$remote_head" != "$GITHUB_SHA" ]; then
            echo "Remote branch moved during reconciliation: trigger=$GITHUB_SHA remote=$remote_head; refusing overwrite"
            exit 78
          fi
          git push origin HEAD:special/SP001-v2-work
