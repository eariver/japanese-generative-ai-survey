name: Prepare weekly screening package

on:
  workflow_dispatch:
    inputs:
      issue_id:
        description: Weekly issue ID (YYYY-Www)
        required: true
        type: string
      source_ref:
        description: Leave empty for weekly/<issue>-work; main is allowed only for a frozen historical smoke/replay
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: weekly-screening-package-${{ inputs.issue_id }}-${{ inputs.source_ref || 'work' }}
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout current control code from main
        uses: actions/checkout@v6
        with:
          ref: main
          path: control-src
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Resolve allowed source ref
        id: source
        shell: bash
        env:
          ISSUE_ID: ${{ inputs.issue_id }}
          REQUESTED_REF: ${{ inputs.source_ref }}
        run: |
          set -euo pipefail
          if ! [[ "${ISSUE_ID}" =~ ^[0-9]{4}-W[0-9]{2}$ ]]; then
            echo '::error::issue_id must use YYYY-Www form'
            exit 2
          fi
          canonical="weekly/${ISSUE_ID}-work"
          source_ref="${REQUESTED_REF:-${canonical}}"
          if [ "${source_ref}" != "${canonical}" ] && [ "${source_ref}" != 'main' ]; then
            echo "::error::source_ref must be ${canonical}, main, or empty"
            exit 2
          fi
          echo "source_ref=${source_ref}" >> "${GITHUB_OUTPUT}"

      - name: Checkout screening source tree
        uses: actions/checkout@v6
        with:
          ref: ${{ steps.source.outputs.source_ref }}
          path: source-tree
          fetch-depth: 1

      - name: Verify source state and Raw provenance
        id: provenance
        shell: bash
        env:
          ISSUE_ID: ${{ inputs.issue_id }}
          SOURCE_REF: ${{ steps.source.outputs.source_ref }}
        run: |
          set -euo pipefail
          state="source-tree/sources/${ISSUE_ID}/pipeline-state.json"
          test -s "${state}"
          python - "${state}" "${ISSUE_ID}" "${SOURCE_REF}" <<'PY'
          import json, sys
          path, issue_id, source_ref = sys.argv[1:]
          state = json.load(open(path, encoding='utf-8'))
          if state.get('issue_id') != issue_id:
              raise SystemExit('pipeline-state issue_id mismatch')
          if source_ref == 'main' and state.get('lifecycle_state') != 'FROZEN':
              raise SystemExit('main may be used only for a FROZEN historical issue')
          PY
          python control-src/scripts/raw_provenance.py \
            --repo-root source-tree \
            --issue-id "${ISSUE_ID}" \
            --report screening-package-raw-check.json \
            check
          commit_sha="$(git -C source-tree rev-parse HEAD)"
          echo "commit_sha=${commit_sha}" >> "${GITHUB_OUTPUT}"
          echo "commit_short=${commit_sha:0:12}" >> "${GITHUB_OUTPUT}"

      - name: Build deterministic screening package
        shell: bash
        env:
          ISSUE_ID: ${{ inputs.issue_id }}
          SOURCE_REF: ${{ steps.source.outputs.source_ref }}
          SOURCE_COMMIT: ${{ steps.provenance.outputs.commit_sha }}
        run: |
          set -euo pipefail
          PYTHONPATH=control-src python control-src/scripts/prepare_screening_run.py \
            --repo-root source-tree \
            --output-root screening-package \
            --issue-id "${ISSUE_ID}" \
            --source-ref "${SOURCE_REF}" \
            --source-commit "${SOURCE_COMMIT}"
          python -m json.tool screening-package/screening-run-package.json >/dev/null

      - name: Upload immutable screening input package
        uses: actions/upload-artifact@v7
        with:
          name: weekly-screening-input-${{ inputs.issue_id }}-${{ steps.provenance.outputs.commit_short }}
          path: |
            screening-package/
            screening-package-raw-check.json
          if-no-files-found: error
          retention-days: 14
          compression-level: 6
