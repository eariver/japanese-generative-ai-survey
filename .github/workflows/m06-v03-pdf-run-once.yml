name: Run M06 v0.3 PDF once

on:
  pull_request:
    types: [synchronize]

permissions:
  contents: write

concurrency:
  group: special-pdf-2026-M06-v03-run-once
  cancel-in-progress: false

jobs:
  build:
    if: github.event.pull_request.number == 45 && github.event.pull_request.head.ref == 'special/2026-M06-work'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout current control code
        uses: actions/checkout@v6
        with:
          ref: main
          path: control-src
          fetch-depth: 1
      - name: Checkout Special work branch
        uses: actions/checkout@v6
        with:
          ref: special/2026-M06-work
          path: worktree
          fetch-depth: 0
      - name: Verify v0.3 source boundary
        id: source
        shell: bash
        run: |
          set -euo pipefail
          python control-src/scripts/raw_provenance.py --repo-root worktree --issue-id SP-2026-M06 check >/dev/null
          python - >> "$GITHUB_OUTPUT" <<'PY'
          import hashlib,json,pathlib
          root=pathlib.Path('worktree'); state=json.load(open(root/'sources/SP-2026-M06/pipeline-state.json',encoding='utf-8'))
          assert state['lifecycle_state']=='VALIDATED_DRAFT'
          assert state['gates']['latex_build']=='pending' and state['gates']['visual_review']=='pending'
          src=state['provenance']['validated_issue_source']; assert src['source_version']=='v0.3'
          manifest=root/src['path']; digest=hashlib.sha256(manifest.read_bytes()).hexdigest(); assert digest==src['sha256']=='90dc80c01b45a9f89f0f057d33fe931c812b5b5d84afc8231db3a02fe0ba85e0'
          data=json.load(open(manifest,encoding='utf-8'))
          assert data['status']=='VALIDATED_MIXED_LAYOUT_REVISION'
          assert data['layout_revision']['new_external_evidence'] is False
          assert data['editorial_supplement']['synthesis_panel_count']==5
          assert data.get('reader_facing_technical_notes',{}).get('evidence_ids_rendered_in_pdf') is False
          source_dir=manifest.parent; main=source_dir/data['main_tex']['path']; assert main.is_file()
          print(f'source_manifest={manifest.as_posix()}')
          print(f'source_manifest_sha256={digest}')
          print(f'source_dir={source_dir.as_posix()}')
          print('source_version=v0.3')
          PY
      - name: Pin main survey style
        id: style
        shell: bash
        env:
          SOURCE_DIR: ${{ steps.source.outputs.source_dir }}
        run: |
          set -euo pipefail
          cp control-src/templates/survey/jgaisurvey.sty "$SOURCE_DIR/jgaisurvey.sty"
          commit=$(git -C control-src rev-parse HEAD)
          sha=$(sha256sum control-src/templates/survey/jgaisurvey.sty | awk '{print $1}')
          test "$sha" = "$(sha256sum "$SOURCE_DIR/jgaisurvey.sty" | awk '{print $1}')"
          echo "control_commit=$commit" >> "$GITHUB_OUTPUT"
          echo "style_sha256=$sha" >> "$GITHUB_OUTPUT"
      - name: Set reproducible PDF timestamp
        run: echo 'SOURCE_DATE_EPOCH=1786406400' >> "$GITHUB_ENV"
      - name: Compile with LuaLaTeX
        uses: xu-cheng/latex-action@v4
        with:
          root_file: main.tex
          working_directory: ${{ steps.source.outputs.source_dir }}
          texlive_version: 2026
          latexmk_use_lualatex: true
      - name: Analyze TeX log and page budget
        id: analyze
        shell: bash
        env:
          SOURCE_DIR: ${{ steps.source.outputs.source_dir }}
          SOURCE_MANIFEST: ${{ steps.source.outputs.source_manifest }}
          SOURCE_MANIFEST_SHA256: ${{ steps.source.outputs.source_manifest_sha256 }}
          CONTROL_COMMIT: ${{ steps.style.outputs.control_commit }}
          STYLE_SHA256: ${{ steps.style.outputs.style_sha256 }}
        run: |
          set -euo pipefail
          pdf="$SOURCE_DIR/main.pdf"; log="$SOURCE_DIR/main.log"; test -s "$pdf" && test -s "$log"
          bad=$(grep -E -n 'LaTeX Warning: (There were undefined references|Citation .* undefined)|Package biblatex Warning: Please (re)?run|Overfull \\hbox|Underfull \\hbox|Missing character:' "$log" || true)
          pages=$(python - "$log" <<'PY'
          import re,sys
          t=open(sys.argv[1],encoding='utf-8',errors='replace').read(); m=re.findall(r'Output written on .*?\((\d+) pages?',t,re.S)
          if not m: raise SystemExit('page count unavailable')
          print(m[-1])
          PY
          )
          pdfsha=$(sha256sum "$pdf" | awk '{print $1}'); [ -z "$bad" ] && clean=true || clean=false
          python - "$pages" "$pdfsha" "$clean" "$bad" "$SOURCE_MANIFEST" "$SOURCE_MANIFEST_SHA256" "$CONTROL_COMMIT" "$STYLE_SHA256" <<'PY'
          import json,sys
          pages,pdfsha,clean,bad,manifest,msha,commit,style=sys.argv[1:]
          out={'schema_version':'1.0','issue_id':'SP-2026-M06','special_slug':'2026-M06','source_version':'v0.3','page_count':int(pages),'pdf_sha256':pdfsha,
               'log_clean':clean=='true','log_gate_findings':bad.splitlines() if bad else [],'page_target_min':32,'page_target_max':40,
               'source_manifest_path':manifest,'source_manifest_sha256':msha,
               'build_style':{'control_commit_sha':commit,'path':'templates/survey/jgaisurvey.sty','sha256':style}}
          open('special-pdf-build-audit.json','w',encoding='utf-8').write(json.dumps(out,ensure_ascii=False,indent=2)+'\n')
          print(json.dumps(out,ensure_ascii=False,indent=2))
          PY
          echo "page_count=$pages" >> "$GITHUB_OUTPUT"
          echo "pdf_sha256=$pdfsha" >> "$GITHUB_OUTPUT"
          echo "log_clean=$clean" >> "$GITHUB_OUTPUT"
      - name: Upload v0.3 preview
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: japanese-generative-ai-survey-special-2026-M06-v0.3
          path: |
            ${{ steps.source.outputs.source_dir }}/main.pdf
            ${{ steps.source.outputs.source_dir }}/main.log
            special-pdf-build-audit.json
          if-no-files-found: error
          retention-days: 14
      - name: Enforce clean 32-40 page candidate
        shell: bash
        env:
          PAGE_COUNT: ${{ steps.analyze.outputs.page_count }}
          LOG_CLEAN: ${{ steps.analyze.outputs.log_clean }}
        run: |
          set -euo pipefail
          test "$LOG_CLEAN" = true
          test "$PAGE_COUNT" -ge 32
          test "$PAGE_COUNT" -le 40
      - name: Record successful PDF build
        working-directory: worktree
        shell: bash
        env:
          PAGE_COUNT: ${{ steps.analyze.outputs.page_count }}
          PDF_SHA256: ${{ steps.analyze.outputs.pdf_sha256 }}
          RUN_ID: ${{ github.run_id }}
          SOURCE_MANIFEST: ${{ steps.source.outputs.source_manifest }}
          SOURCE_MANIFEST_SHA256: ${{ steps.source.outputs.source_manifest_sha256 }}
          CONTROL_COMMIT: ${{ steps.style.outputs.control_commit }}
          STYLE_SHA256: ${{ steps.style.outputs.style_sha256 }}
        run: |
          set -euo pipefail
          python - "$PAGE_COUNT" "$PDF_SHA256" "$RUN_ID" "$SOURCE_MANIFEST" "$SOURCE_MANIFEST_SHA256" "$CONTROL_COMMIT" "$STYLE_SHA256" <<'PY'
          import json,pathlib,sys
          pages,pdfsha,run,manifest,msha,commit,style=sys.argv[1:]
          p=pathlib.Path('sources/SP-2026-M06/pipeline-state.json'); s=json.load(open(p,encoding='utf-8'))
          assert s['lifecycle_state']=='VALIDATED_DRAFT' and s['gates']['latex_build']=='pending'
          s['lifecycle_state']='RELEASE_CANDIDATE'; s['gates']['latex_build']='passed'
          s.setdefault('provenance',{})['latex_build']={'workflow_run_id':int(run),'pdf_sha256':pdfsha,'page_count':int(pages),'source_version':'v0.3',
              'validated_issue_source_path':manifest,'validated_issue_source_sha256':msha,
              'build_style':{'control_commit_sha':commit,'path':'templates/survey/jgaisurvey.sty','sha256':style}}
          p.write_text(json.dumps(s,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          PY
          git config user.name 'github-actions[bot]'; git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/m06-v03-pdf-run-once.yml
          git add sources/SP-2026-M06/pipeline-state.json
          git commit -m 'Record v0.3 PDF candidate for SP-2026-M06'
          git push origin HEAD:special/2026-M06-work
