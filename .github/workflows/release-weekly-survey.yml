name: Release frozen weekly survey

on:
  workflow_dispatch:
    inputs:
      issue_id:
        description: Frozen issue ID, for example 2026-W32
        required: true
        type: string
      revision:
        description: Frozen revision, for example v0.2
        required: true
        type: string
      mode:
        description: Validate frozen PDF, create a draft Release, or publish an existing draft
        required: true
        default: validate
        type: choice
        options:
          - validate
          - draft
          - publish
      confirmation:
        description: Enter ISSUE@REVISION, for example 2026-W32@v0.2
        required: true
        type: string

permissions:
  contents: write
  actions: read

concurrency:
  group: weekly-release-${{ inputs.issue_id }}-${{ inputs.revision }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release control metadata
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Validate frozen release manifest
        id: manifest
        shell: bash
        env:
          ISSUE_ID: ${{ inputs.issue_id }}
          REVISION: ${{ inputs.revision }}
          CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          set -euo pipefail
          expected_confirmation="${ISSUE_ID}@${REVISION}"
          if [ "$CONFIRMATION" != "$expected_confirmation" ]; then
            echo "::error::confirmation must be ${expected_confirmation}"
            exit 2
          fi

          manifest="sources/${ISSUE_ID}/release-manifest.json"
          test -s "$manifest"
          python -m json.tool "$manifest" >/dev/null

          python - "$manifest" "$ISSUE_ID" "$REVISION" >> "$GITHUB_OUTPUT" <<'PY'
          import json
          import re
          import sys

          path, issue_id, revision = sys.argv[1:]
          with open(path, encoding='utf-8') as fh:
              data = json.load(fh)

          required = {
              'schema_version', 'issue_id', 'revision', 'status', 'source_commit',
              'release_tag', 'release_title', 'asset_name', 'expected_pdf_sha256',
              'page_count', 'survey_root', 'freeze_record', 'pdf_source'
          }
          missing = sorted(required - data.keys())
          if missing:
              raise SystemExit(f'missing release-manifest fields: {missing}')
          if data['schema_version'] != '1.0':
              raise SystemExit('unsupported release manifest schema_version')
          if data['issue_id'] != issue_id or data['revision'] != revision:
              raise SystemExit('workflow inputs do not match release-manifest.json')
          if data['status'] != 'frozen':
              raise SystemExit('release manifest is not frozen')
          if not re.fullmatch(r'[0-9a-f]{40}', data['source_commit']):
              raise SystemExit('invalid source_commit')
          if not re.fullmatch(r'[0-9a-f]{64}', data['expected_pdf_sha256']):
              raise SystemExit('invalid expected_pdf_sha256')
          if data['release_tag'] != f"weekly/{issue_id}/{revision}":
              raise SystemExit('release_tag does not match canonical weekly/<issue>/<revision> form')

          pdf_source = data['pdf_source']
          source_mode = pdf_source.get('mode')
          if source_mode not in {'actions-artifact', 'rebuild'}:
              raise SystemExit(f'unsupported pdf_source mode: {source_mode}')
          if source_mode == 'actions-artifact':
              for key in ('workflow_run_id', 'artifact_id', 'artifact_name'):
                  if not pdf_source.get(key):
                      raise SystemExit(f'actions-artifact pdf_source requires {key}')

          values = {
              'source_commit': data['source_commit'],
              'release_tag': data['release_tag'],
              'release_title': data['release_title'],
              'asset_name': data['asset_name'],
              'expected_pdf_sha256': data['expected_pdf_sha256'],
              'page_count': data['page_count'],
              'survey_root': data['survey_root'],
              'freeze_record': data['freeze_record'],
              'pdf_source_mode': source_mode,
              'workflow_run_id': pdf_source.get('workflow_run_id', ''),
              'artifact_id': pdf_source.get('artifact_id', ''),
              'artifact_name': pdf_source.get('artifact_name', ''),
          }
          for key, value in values.items():
              print(f'{key}={value}')
          PY

          freeze_record="$(python - "$manifest" <<'PY'
          import json, sys
          with open(sys.argv[1], encoding='utf-8') as fh:
              print(json.load(fh)['freeze_record'])
          PY
          )"
          test -s "$freeze_record"

      - name: Checkout frozen PDF-producing source commit
        if: inputs.mode != 'publish'
        uses: actions/checkout@v6
        with:
          ref: ${{ steps.manifest.outputs.source_commit }}
          path: release-src
          fetch-depth: 0

      - name: Download exact frozen Actions artifact
        if: inputs.mode != 'publish' && steps.manifest.outputs.pdf_source_mode == 'actions-artifact'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ steps.manifest.outputs.workflow_run_id }}
          ARTIFACT_ID: ${{ steps.manifest.outputs.artifact_id }}
          ARTIFACT_NAME: ${{ steps.manifest.outputs.artifact_name }}
          ASSET_NAME: ${{ steps.manifest.outputs.asset_name }}
        run: |
          set -euo pipefail
          mkdir -p dist frozen-artifact
          actual_name="$(gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${ARTIFACT_ID}" --jq '.name')"
          actual_run="$(gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${ARTIFACT_ID}" --jq '.workflow_run.id')"
          expired="$(gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${ARTIFACT_ID}" --jq '.expired')"
          if [ "$actual_name" != "$ARTIFACT_NAME" ] || [ "$actual_run" != "$RUN_ID" ] || [ "$expired" != "false" ]; then
            echo "::error::Frozen Actions artifact metadata does not match release manifest or artifact has expired."
            exit 1
          fi
          gh run download "$RUN_ID" --repo "$GITHUB_REPOSITORY" --name "$ARTIFACT_NAME" --dir frozen-artifact
          test -s frozen-artifact/main.pdf
          cp frozen-artifact/main.pdf "dist/${ASSET_NAME}"

      - name: Set reproducible PDF epoch for rebuild source
        if: inputs.mode != 'publish' && steps.manifest.outputs.pdf_source_mode == 'rebuild'
        shell: bash
        env:
          SOURCE_COMMIT: ${{ steps.manifest.outputs.source_commit }}
        run: |
          set -euo pipefail
          echo "SOURCE_DATE_EPOCH=$(git -C release-src show -s --format=%ct "$SOURCE_COMMIT")" >> "$GITHUB_ENV"
          echo 'FORCE_SOURCE_DATE=1' >> "$GITHUB_ENV"

      - name: Compile frozen source with LuaLaTeX
        if: inputs.mode != 'publish' && steps.manifest.outputs.pdf_source_mode == 'rebuild'
        uses: xu-cheng/latex-action@v4
        with:
          root_file: main.tex
          working_directory: release-src/${{ steps.manifest.outputs.survey_root }}
          texlive_version: 2026
          os: debian
          latexmk_use_lualatex: true

      - name: Collect reproducibly rebuilt PDF
        if: inputs.mode != 'publish' && steps.manifest.outputs.pdf_source_mode == 'rebuild'
        shell: bash
        env:
          SURVEY_ROOT: ${{ steps.manifest.outputs.survey_root }}
          ASSET_NAME: ${{ steps.manifest.outputs.asset_name }}
        run: |
          set -euo pipefail
          build_dir="release-src/${SURVEY_ROOT}"
          test -s "${build_dir}/main.pdf"
          test -s "${build_dir}/main.log"
          if grep -E -n 'LaTeX Warning: (There were undefined references|Citation .* undefined)|Package biblatex Warning: Please (re)?run|Overfull \\hbox|Underfull \\hbox|Missing character:' "${build_dir}/main.log"; then
            echo '::error::Final TeX log contains publication-blocking warnings.'
            exit 1
          fi
          mkdir -p dist
          cp "${build_dir}/main.pdf" "dist/${ASSET_NAME}"

      - name: Verify frozen PDF digest
        if: inputs.mode != 'publish'
        shell: bash
        env:
          EXPECTED_SHA256: ${{ steps.manifest.outputs.expected_pdf_sha256 }}
          ASSET_NAME: ${{ steps.manifest.outputs.asset_name }}
        run: |
          set -euo pipefail
          test -s "dist/${ASSET_NAME}"
          actual="$(sha256sum "dist/${ASSET_NAME}" | awk '{print $1}')"
          if [ "$actual" != "$EXPECTED_SHA256" ]; then
            echo "::error::Release PDF digest does not match frozen digest. expected=${EXPECTED_SHA256} actual=${actual}"
            exit 1
          fi
          (cd dist && sha256sum "$ASSET_NAME" > SHA256SUMS.txt)
          echo "Frozen PDF digest verified: ${actual}"

      - name: Prepare validation release notes
        if: inputs.mode != 'publish'
        shell: bash
        env:
          ISSUE_ID: ${{ inputs.issue_id }}
          REVISION: ${{ inputs.revision }}
          SOURCE_COMMIT: ${{ steps.manifest.outputs.source_commit }}
          PDF_SHA256: ${{ steps.manifest.outputs.expected_pdf_sha256 }}
          PAGE_COUNT: ${{ steps.manifest.outputs.page_count }}
          FREEZE_RECORD: ${{ steps.manifest.outputs.freeze_record }}
          PDF_SOURCE_MODE: ${{ steps.manifest.outputs.pdf_source_mode }}
        run: |
          set -euo pipefail
          cat > dist/RELEASE_NOTES.md <<EOF
          # ${ISSUE_ID} ${REVISION}

          Frozen release of the Japanese Generative AI Technical Survey.

          - Frozen source commit: \`${SOURCE_COMMIT}\`
          - PDF SHA-256: \`${PDF_SHA256}\`
          - Pages: ${PAGE_COUNT}
          - Freeze record: \`${FREEZE_RECORD}\`
          - PDF source mode: \`${PDF_SOURCE_MODE}\`

          The release tag is a release-control anchor. The frozen PDF-producing source commit and binary digest are recorded separately and remain authoritative for the survey contents.
          EOF

      - name: Upload validation artifact
        if: inputs.mode != 'publish'
        uses: actions/upload-artifact@v7
        with:
          name: weekly-release-validation-${{ inputs.issue_id }}-${{ inputs.revision }}
          path: |
            dist/${{ steps.manifest.outputs.asset_name }}
            dist/SHA256SUMS.txt
            dist/RELEASE_NOTES.md
          if-no-files-found: error
          retention-days: 14

      - name: Create draft Release with pinned release anchor
        if: inputs.mode == 'draft'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.manifest.outputs.release_tag }}
          TITLE: ${{ steps.manifest.outputs.release_title }}
          SOURCE_COMMIT: ${{ steps.manifest.outputs.source_commit }}
          PDF_SHA256: ${{ steps.manifest.outputs.expected_pdf_sha256 }}
          ASSET_NAME: ${{ steps.manifest.outputs.asset_name }}
          PAGE_COUNT: ${{ steps.manifest.outputs.page_count }}
        run: |
          set -euo pipefail

          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            is_draft="$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq '.isDraft')"
            remote_tag="$(git ls-remote --tags origin "refs/tags/${TAG}" | awk 'NR==1 {print $1}')"
            if [ "$is_draft" = 'true' ] && [ -z "$remote_tag" ]; then
              echo "Removing incomplete unpublished Draft Release ${TAG} from a previous failed attempt."
              gh release delete "$TAG" --repo "$GITHUB_REPOSITORY" --yes
            else
              echo "::error::Release ${TAG} already exists in a state that draft mode will not replace."
              exit 1
            fi
          fi

          default_branch="$(gh api "repos/${GITHUB_REPOSITORY}" --jq '.default_branch')"
          release_anchor="$(gh api "repos/${GITHUB_REPOSITORY}/commits/${default_branch}" --jq '.sha')"

          gh release create "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$release_anchor" \
            --draft \
            --title "$TITLE" \
            --notes-file dist/RELEASE_NOTES.md

          draft_target="$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json targetCommitish --jq '.targetCommitish')"
          if [ "$draft_target" != "$release_anchor" ]; then
            echo "::error::Draft targetCommitish ${draft_target} differs from pinned release anchor ${release_anchor}."
            exit 1
          fi

          cat > dist/RELEASE_METADATA.json <<EOF
          {
            "schema_version": "1.0",
            "issue_id": "${{ inputs.issue_id }}",
            "revision": "${{ inputs.revision }}",
            "release_tag": "${TAG}",
            "release_anchor_commit": "${release_anchor}",
            "default_branch": "${default_branch}",
            "frozen_source_commit": "${SOURCE_COMMIT}",
            "pdf_sha256": "${PDF_SHA256}",
            "asset_name": "${ASSET_NAME}",
            "page_count": ${PAGE_COUNT}
          }
          EOF
          python -m json.tool dist/RELEASE_METADATA.json >/dev/null

          cat >> dist/RELEASE_NOTES.md <<EOF

          - Release anchor commit: \`${release_anchor}\`
          EOF
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --notes-file dist/RELEASE_NOTES.md

          gh release upload "$TAG" \
            "dist/${ASSET_NAME}#Japanese Generative AI Technical Survey PDF" \
            'dist/SHA256SUMS.txt#SHA-256 checksums' \
            'dist/RELEASE_METADATA.json#Release provenance metadata' \
            --repo "$GITHUB_REPOSITORY"

      - name: Verify newly created draft assets and anchor
        if: inputs.mode == 'draft'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.manifest.outputs.release_tag }}
          ASSET_NAME: ${{ steps.manifest.outputs.asset_name }}
          EXPECTED_SHA256: ${{ steps.manifest.outputs.expected_pdf_sha256 }}
        run: |
          set -euo pipefail
          is_draft="$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq '.isDraft')"
          target="$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json targetCommitish --jq '.targetCommitish')"
          if [ "$is_draft" != 'true' ]; then
            echo "::error::Expected ${TAG} to remain a Draft Release."
            exit 1
          fi

          rm -rf verify-draft
          mkdir verify-draft
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --dir verify-draft \
            --pattern "$ASSET_NAME" --pattern 'SHA256SUMS.txt' --pattern 'RELEASE_METADATA.json'
          test -s "verify-draft/${ASSET_NAME}"
          test -s verify-draft/SHA256SUMS.txt
          test -s verify-draft/RELEASE_METADATA.json
          actual="$(sha256sum "verify-draft/${ASSET_NAME}" | awk '{print $1}')"
          if [ "$actual" != "$EXPECTED_SHA256" ]; then
            echo "::error::Draft Release PDF digest mismatch after upload."
            exit 1
          fi
          metadata_anchor="$(python -c "import json; print(json.load(open('verify-draft/RELEASE_METADATA.json'))['release_anchor_commit'])")"
          if [ "$target" != "$metadata_anchor" ]; then
            echo "::error::Draft targetCommitish no longer matches RELEASE_METADATA.json."
            exit 1
          fi

      - name: Verify existing draft before publish
        if: inputs.mode == 'publish'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.manifest.outputs.release_tag }}
          ASSET_NAME: ${{ steps.manifest.outputs.asset_name }}
          EXPECTED_SHA256: ${{ steps.manifest.outputs.expected_pdf_sha256 }}
          SOURCE_COMMIT: ${{ steps.manifest.outputs.source_commit }}
        run: |
          set -euo pipefail
          is_draft="$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq '.isDraft')"
          target="$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json targetCommitish --jq '.targetCommitish')"
          if [ "$is_draft" != 'true' ]; then
            echo "::error::Publish requires an existing Draft Release for ${TAG}."
            exit 1
          fi

          rm -rf verify-publish
          mkdir verify-publish
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --dir verify-publish \
            --pattern "$ASSET_NAME" --pattern 'SHA256SUMS.txt' --pattern 'RELEASE_METADATA.json'
          test -s "verify-publish/${ASSET_NAME}"
          test -s verify-publish/SHA256SUMS.txt
          test -s verify-publish/RELEASE_METADATA.json

          actual="$(sha256sum "verify-publish/${ASSET_NAME}" | awk '{print $1}')"
          if [ "$actual" != "$EXPECTED_SHA256" ]; then
            echo "::error::Draft Release PDF digest does not match frozen manifest."
            exit 1
          fi

          python - verify-publish/RELEASE_METADATA.json "$TAG" "$SOURCE_COMMIT" "$EXPECTED_SHA256" "$target" <<'PY'
          import json, sys
          path, tag, source_commit, pdf_sha, target = sys.argv[1:]
          with open(path, encoding='utf-8') as fh:
              data = json.load(fh)
          if data.get('release_tag') != tag:
              raise SystemExit('release metadata tag mismatch')
          if data.get('frozen_source_commit') != source_commit:
              raise SystemExit('release metadata frozen_source_commit mismatch')
          if data.get('pdf_sha256') != pdf_sha:
              raise SystemExit('release metadata PDF digest mismatch')
          if data.get('release_anchor_commit') != target:
              raise SystemExit('draft targetCommitish differs from recorded release anchor')
          PY

      - name: Publish verified draft Release
        if: inputs.mode == 'publish'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.manifest.outputs.release_tag }}
        run: |
          set -euo pipefail
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false --latest

      - name: Verify published tag matches release anchor
        if: inputs.mode == 'publish'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.manifest.outputs.release_tag }}
        run: |
          set -euo pipefail
          rm -rf verify-published
          mkdir verify-published
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --dir verify-published --pattern 'RELEASE_METADATA.json'
          anchor="$(python -c "import json; print(json.load(open('verify-published/RELEASE_METADATA.json'))['release_anchor_commit'])")"
          tag_sha="$(git ls-remote --tags origin "refs/tags/${TAG}" | awk 'NR==1 {print $1}')"
          if [ "$tag_sha" != "$anchor" ]; then
            echo "::error::Published tag ${TAG} resolves to ${tag_sha}, expected release anchor ${anchor}."
            exit 1
          fi

      - name: Verify immutable release attestation when enabled
        if: inputs.mode == 'publish'
        continue-on-error: true
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.manifest.outputs.release_tag }}
        run: |
          set -euo pipefail
          gh release verify "$TAG" --repo "$GITHUB_REPOSITORY"

      - name: Summarize Release state
        if: inputs.mode != 'validate'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.manifest.outputs.release_tag }}
        run: |
          set -euo pipefail
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" \
            --json tagName,name,isDraft,isImmutable,publishedAt,targetCommitish,url
