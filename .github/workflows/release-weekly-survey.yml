name: Release frozen weekly survey

on:
  workflow_dispatch:
    inputs:
      issue_id:
        description: Frozen issue ID, for example 2026-W32
        required: true
        type: string
      revision:
        description: Frozen revision, for example v0.2
        required: true
        type: string
      mode:
        description: Validate only, create/verify a draft, or publish an existing draft
        required: true
        default: validate
        type: choice
        options:
          - validate
          - draft
          - publish
      confirmation:
        description: Enter ISSUE@REVISION, for example 2026-W32@v0.2
        required: true
        type: string

permissions:
  contents: write
  actions: read

concurrency:
  group: weekly-release-${{ inputs.issue_id }}-${{ inputs.revision }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release control metadata
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Validate frozen release manifest
        id: manifest
        shell: bash
        env:
          ISSUE_ID: ${{ inputs.issue_id }}
          REVISION: ${{ inputs.revision }}
          CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          set -euo pipefail
          expected_confirmation="${ISSUE_ID}@${REVISION}"
          if [ "$CONFIRMATION" != "$expected_confirmation" ]; then
            echo "::error::confirmation must be ${expected_confirmation}"
            exit 2
          fi

          manifest="sources/${ISSUE_ID}/release-manifest.json"
          test -s "$manifest"
          python -m json.tool "$manifest" >/dev/null

          python - "$manifest" "$ISSUE_ID" "$REVISION" >> "$GITHUB_OUTPUT" <<'PY'
          import json
          import re
          import sys

          path, issue_id, revision = sys.argv[1:]
          with open(path, encoding='utf-8') as fh:
              data = json.load(fh)

          required = {
              'schema_version', 'issue_id', 'revision', 'status', 'source_commit',
              'release_tag', 'release_title', 'asset_name', 'expected_pdf_sha256',
              'page_count', 'survey_root', 'freeze_record', 'pdf_source'
          }
          missing = sorted(required - data.keys())
          if missing:
              raise SystemExit(f'missing release-manifest fields: {missing}')
          if data['schema_version'] != '1.0':
              raise SystemExit('unsupported release manifest schema_version')
          if data['issue_id'] != issue_id or data['revision'] != revision:
              raise SystemExit('workflow inputs do not match release-manifest.json')
          if data['status'] != 'frozen':
              raise SystemExit('release manifest is not frozen')
          if not re.fullmatch(r'[0-9a-f]{40}', data['source_commit']):
              raise SystemExit('invalid source_commit')
          if not re.fullmatch(r'[0-9a-f]{64}', data['expected_pdf_sha256']):
              raise SystemExit('invalid expected_pdf_sha256')
          if data['release_tag'] != f"weekly/{issue_id}/{revision}":
              raise SystemExit('release_tag does not match canonical weekly/<issue>/<revision> form')

          pdf_source = data['pdf_source']
          mode = pdf_source.get('mode')
          if mode not in {'actions-artifact', 'rebuild'}:
              raise SystemExit(f'unsupported pdf_source mode: {mode}')
          if mode == 'actions-artifact':
              for key in ('workflow_run_id', 'artifact_id', 'artifact_name'):
                  if not pdf_source.get(key):
                      raise SystemExit(f'actions-artifact pdf_source requires {key}')

          print(f"source_commit={data['source_commit']}")
          print(f"release_tag={data['release_tag']}")
          print(f"release_title={data['release_title']}")
          print(f"asset_name={data['asset_name']}")
          print(f"expected_pdf_sha256={data['expected_pdf_sha256']}")
          print(f"page_count={data['page_count']}")
          print(f"survey_root={data['survey_root']}")
          print(f"freeze_record={data['freeze_record']}")
          print(f"pdf_source_mode={mode}")
          print(f"workflow_run_id={pdf_source.get('workflow_run_id', '')}")
          print(f"artifact_id={pdf_source.get('artifact_id', '')}")
          print(f"artifact_name={pdf_source.get('artifact_name', '')}")
          PY

          freeze_record="$(python - "$manifest" <<'PY'
          import json, sys
          with open(sys.argv[1], encoding='utf-8') as fh:
              print(json.load(fh)['freeze_record'])
          PY
          )"
          test -s "$freeze_record"

      - name: Checkout frozen PDF-producing source commit
        uses: actions/checkout@v6
        with:
          ref: ${{ steps.manifest.outputs.source_commit }}
          path: release-src
          fetch-depth: 0

      - name: Download exact frozen Actions artifact
        if: inputs.mode != 'publish' && steps.manifest.outputs.pdf_source_mode == 'actions-artifact'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ steps.manifest.outputs.workflow_run_id }}
          ARTIFACT_ID: ${{ steps.manifest.outputs.artifact_id }}
          ARTIFACT_NAME: ${{ steps.manifest.outputs.artifact_name }}
          ASSET_NAME: ${{ steps.manifest.outputs.asset_name }}
        run: |
          set -euo pipefail
          mkdir -p dist frozen-artifact
          actual_name="$(gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${ARTIFACT_ID}" --jq '.name')"
          actual_run="$(gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${ARTIFACT_ID}" --jq '.workflow_run.id')"
          expired="$(gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${ARTIFACT_ID}" --jq '.expired')"
          if [ "$actual_name" != "$ARTIFACT_NAME" ] || [ "$actual_run" != "$RUN_ID" ] || [ "$expired" != "false" ]; then
            echo "::error::Frozen Actions artifact metadata does not match release manifest or artifact has expired."
            exit 1
          fi
          gh run download "$RUN_ID" --repo "$GITHUB_REPOSITORY" --name "$ARTIFACT_NAME" --dir frozen-artifact
          test -s frozen-artifact/main.pdf
          cp frozen-artifact/main.pdf "dist/${ASSET_NAME}"

      - name: Set reproducible PDF epoch for rebuild source
        if: inputs.mode != 'publish' && steps.manifest.outputs.pdf_source_mode == 'rebuild'
        shell: bash
        env:
          SOURCE_COMMIT: ${{ steps.manifest.outputs.source_commit }}
        run: |
          set -euo pipefail
          echo "SOURCE_DATE_EPOCH=$(git -C release-src show -s --format=%ct "$SOURCE_COMMIT")" >> "$GITHUB_ENV"
          echo 'FORCE_SOURCE_DATE=1' >> "$GITHUB_ENV"

      - name: Compile frozen source with LuaLaTeX
        if: inputs.mode != 'publish' && steps.manifest.outputs.pdf_source_mode == 'rebuild'
        uses: xu-cheng/latex-action@v4
        with:
          root_file: main.tex
          working_directory: release-src/${{ steps.manifest.outputs.survey_root }}
          texlive_version: 2026
          os: debian
          latexmk_use_lualatex: true

      - name: Collect reproducibly rebuilt PDF
        if: inputs.mode != 'publish' && steps.manifest.outputs.pdf_source_mode == 'rebuild'
        shell: bash
        env:
          SURVEY_ROOT: ${{ steps.manifest.outputs.survey_root }}
          ASSET_NAME: ${{ steps.manifest.outputs.asset_name }}
        run: |
          set -euo pipefail
          build_dir="release-src/${SURVEY_ROOT}"
          test -s "${build_dir}/main.pdf"
          test -s "${build_dir}/main.log"
          if grep -E -n 'LaTeX Warning: (There were undefined references|Citation .* undefined)|Package biblatex Warning: Please (re)?run|Overfull \\hbox|Underfull \\hbox|Missing character:' "${build_dir}/main.log"; then
            echo '::error::Final TeX log contains publication-blocking warnings.'
            exit 1
          fi
          mkdir -p dist
          cp "${build_dir}/main.pdf" "dist/${ASSET_NAME}"

      - name: Verify frozen PDF digest
        if: inputs.mode != 'publish'
        shell: bash
        env:
          EXPECTED_SHA256: ${{ steps.manifest.outputs.expected_pdf_sha256 }}
          ASSET_NAME: ${{ steps.manifest.outputs.asset_name }}
        run: |
          set -euo pipefail
          test -s "dist/${ASSET_NAME}"
          actual="$(sha256sum "dist/${ASSET_NAME}" | awk '{print $1}')"
          if [ "$actual" != "$EXPECTED_SHA256" ]; then
            echo "::error::Release PDF digest does not match frozen digest. expected=${EXPECTED_SHA256} actual=${actual}"
            exit 1
          fi
          (cd dist && sha256sum "$ASSET_NAME" > SHA256SUMS.txt)
          echo "Frozen PDF digest verified: ${actual}"

      - name: Prepare release notes
        if: inputs.mode != 'publish'
        shell: bash
        env:
          ISSUE_ID: ${{ inputs.issue_id }}
          REVISION: ${{ inputs.revision }}
          SOURCE_COMMIT: ${{ steps.manifest.outputs.source_commit }}
          PDF_SHA256: ${{ steps.manifest.outputs.expected_pdf_sha256 }}
          PAGE_COUNT: ${{ steps.manifest.outputs.page_count }}
          FREEZE_RECORD: ${{ steps.manifest.outputs.freeze_record }}
          PDF_SOURCE_MODE: ${{ steps.manifest.outputs.pdf_source_mode }}
        run: |
          set -euo pipefail
          cat > dist/RELEASE_NOTES.md <<EOF
          # ${ISSUE_ID} ${REVISION}

          Frozen release of the Japanese Generative AI Technical Survey.

          - Frozen source commit: \`${SOURCE_COMMIT}\`
          - PDF SHA-256: \`${PDF_SHA256}\`
          - Pages: ${PAGE_COUNT}
          - Freeze record: \`${FREEZE_RECORD}\`
          - PDF source mode: \`${PDF_SOURCE_MODE}\`

          The release workflow verified the exact frozen PDF digest before any tag or Release write was attempted.
          EOF

      - name: Upload validation artifact
        if: inputs.mode != 'publish'
        uses: actions/upload-artifact@v7
        with:
          name: weekly-release-validation-${{ inputs.issue_id }}-${{ inputs.revision }}
          path: |
            dist/${{ steps.manifest.outputs.asset_name }}
            dist/SHA256SUMS.txt
            dist/RELEASE_NOTES.md
          if-no-files-found: error
          retention-days: 14

      - name: Create or verify frozen source tag for draft
        if: inputs.mode == 'draft'
        shell: bash
        env:
          TAG: ${{ steps.manifest.outputs.release_tag }}
          SOURCE_COMMIT: ${{ steps.manifest.outputs.source_commit }}
        run: |
          set -euo pipefail
          if git -C release-src ls-remote --exit-code --tags origin "refs/tags/${TAG}" >/dev/null 2>&1; then
            git -C release-src fetch --force origin "refs/tags/${TAG}:refs/tags/${TAG}"
            resolved="$(git -C release-src rev-list -n1 "$TAG")"
            if [ "$resolved" != "$SOURCE_COMMIT" ]; then
              echo "::error::Existing tag ${TAG} resolves to ${resolved}, expected ${SOURCE_COMMIT}."
              exit 1
            fi
          else
            git -C release-src config user.name 'github-actions[bot]'
            git -C release-src config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git -C release-src tag "$TAG" "$SOURCE_COMMIT"
            git -C release-src push origin "refs/tags/${TAG}"
          fi

      - name: Verify frozen source tag for publish
        if: inputs.mode == 'publish'
        shell: bash
        env:
          TAG: ${{ steps.manifest.outputs.release_tag }}
          SOURCE_COMMIT: ${{ steps.manifest.outputs.source_commit }}
        run: |
          set -euo pipefail
          if ! git -C release-src ls-remote --exit-code --tags origin "refs/tags/${TAG}" >/dev/null 2>&1; then
            echo "::error::Publish requires an existing frozen source tag. Run draft mode first."
            exit 1
          fi
          git -C release-src fetch --force origin "refs/tags/${TAG}:refs/tags/${TAG}"
          resolved="$(git -C release-src rev-list -n1 "$TAG")"
          if [ "$resolved" != "$SOURCE_COMMIT" ]; then
            echo "::error::Tag ${TAG} resolves to ${resolved}, expected ${SOURCE_COMMIT}."
            exit 1
          fi

      - name: Create or verify draft release and assets
        if: inputs.mode == 'draft'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.manifest.outputs.release_tag }}
          TITLE: ${{ steps.manifest.outputs.release_title }}
          ASSET_NAME: ${{ steps.manifest.outputs.asset_name }}
          EXPECTED_SHA256: ${{ steps.manifest.outputs.expected_pdf_sha256 }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            is_draft="$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq '.isDraft')"
            if [ "$is_draft" != "true" ]; then
              echo "::error::Release ${TAG} is already published; draft mode will not modify it."
              exit 1
            fi
            rm -rf existing-release && mkdir -p existing-release
            gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern "$ASSET_NAME" --dir existing-release
            test -s "existing-release/${ASSET_NAME}"
            actual="$(sha256sum "existing-release/${ASSET_NAME}" | awk '{print $1}')"
            if [ "$actual" != "$EXPECTED_SHA256" ]; then
              echo "::error::Existing draft PDF asset digest does not match frozen digest."
              exit 1
            fi
            asset_names="$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name')"
            grep -Fxq 'SHA256SUMS.txt' <<< "$asset_names" || { echo '::error::Existing Draft is missing SHA256SUMS.txt.'; exit 1; }
            echo 'Existing Draft and assets verified; no asset was overwritten.'
          else
            gh release create "$TAG" \
              "dist/${ASSET_NAME}#Japanese Generative AI Technical Survey PDF" \
              'dist/SHA256SUMS.txt#SHA-256 checksums' \
              --repo "$GITHUB_REPOSITORY" \
              --verify-tag \
              --draft \
              --title "$TITLE" \
              --notes-file dist/RELEASE_NOTES.md
          fi

      - name: Verify existing draft before publish
        if: inputs.mode == 'publish'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.manifest.outputs.release_tag }}
          ASSET_NAME: ${{ steps.manifest.outputs.asset_name }}
          EXPECTED_SHA256: ${{ steps.manifest.outputs.expected_pdf_sha256 }}
        run: |
          set -euo pipefail
          if ! gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::error::Publish requires an existing draft release. Run draft mode first."
            exit 1
          fi
          is_draft="$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq '.isDraft')"
          if [ "$is_draft" != "true" ]; then
            echo "::error::Release ${TAG} is not a draft; refusing to republish or mutate it."
            exit 1
          fi
          rm -rf existing-release && mkdir -p existing-release
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern "$ASSET_NAME" --dir existing-release
          test -s "existing-release/${ASSET_NAME}"
          actual="$(sha256sum "existing-release/${ASSET_NAME}" | awk '{print $1}')"
          if [ "$actual" != "$EXPECTED_SHA256" ]; then
            echo "::error::Draft PDF asset digest does not match frozen digest."
            exit 1
          fi
          asset_names="$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name')"
          grep -Fxq 'SHA256SUMS.txt' <<< "$asset_names" || { echo '::error::Draft Release is missing SHA256SUMS.txt.'; exit 1; }

      - name: Publish verified draft release
        if: inputs.mode == 'publish'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.manifest.outputs.release_tag }}
        run: |
          set -euo pipefail
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false --latest

      - name: Verify immutable release attestation when enabled
        if: inputs.mode == 'publish'
        continue-on-error: true
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.manifest.outputs.release_tag }}
        run: |
          set -euo pipefail
          immutable="$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isImmutable --jq '.isImmutable')"
          if [ "$immutable" = "true" ]; then
            gh release verify "$TAG" --repo "$GITHUB_REPOSITORY"
          else
            echo 'Immutable Releases is not enabled; the workflow still verified the frozen PDF digest before publication.'
          fi

      - name: Summarize release state
        if: inputs.mode != 'validate'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.manifest.outputs.release_tag }}
        run: |
          set -euo pipefail
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json tagName,name,isDraft,isImmutable,publishedAt,url
