name: W33 Selection r2
on:
  pull_request:
    paths:
      - 'automation/w33_selection_r2.py'
      - '.github/workflows/w33-selection-r2.yml'
permissions:
  contents: write
jobs:
  selection-r2:
    if: github.head_ref == 'temp/w33-selection-r2'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: temp/w33-selection-r2
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r config/survey-production-v2-requirements.txt
      - name: Build W33 Selection r2
        run: PYTHONPATH=. python automation/w33_selection_r2.py
      - name: Validate exact Selection r2 stage artifacts
        run: |
          PYTHONPATH=. python scripts/survey_stage_validation_v2.py --repo-root . --config config/survey-production-v2.json \
            --state sources/2026-W33/production-state.json \
            --artifact candidate-matrix=sources/2026-W33/candidate-matrix-v2.json \
            --artifact candidate-selection=sources/2026-W33/candidate-selection-v2.json \
            --output sources/2026-W33/orchestration/v2/reviews/selection-r2-core-stage-contract.json
      - name: Persist Selection r2 and remove temporary runner
        run: |
          set -euo pipefail
          rm automation/w33_selection_r2.py .github/workflows/w33-selection-r2.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A sources/2026-W33 docs/checkpoints/2026-W33-core-v2-compilation-session-worklog.md automation .github/workflows/w33-selection-r2.yml
          git commit -m 'Establish W33 Candidate Selection r2'
          git push origin HEAD:temp/w33-selection-r2
