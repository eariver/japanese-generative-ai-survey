name: One-shot fix Special publication layout and taxonomy contract v2

on:
  push:
    branches:
      - fix/special-publication-layout-taxonomy-contract

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/special-publication-layout-taxonomy-contract
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Patch shared reader taxonomy contract
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re

          def replace_once(path: str, old: str, new: str) -> None:
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected one anchor, found {count}')
              p.write_text(text.replace(old, new, 1), encoding='utf-8')

          path = 'scripts/postprocess_special_reader_facing_notes.py'
          replace_once(
              path,
              '    "API_UPDATE": "API更新",\n}\nTYPE_LABELS = {',
              '    "API_UPDATE": "API更新",\n'
              '    "AGENT_PRODUCT_RELEASE": "Agent製品公開",\n'
              '    "PROJECT_RELEASE": "プロジェクト公開",\n'
              '    "PROJECT_UPDATE": "プロジェクト更新",\n'
              '    "SYSTEM_CARD_PUBLICATION": "System Card公開",\n'
              '    "RESEARCH_PREVIEW": "研究Preview",\n'
              '    "REGIONAL_MODEL_RELEASE": "地域別モデル公開",\n'
              '    "INTERNATIONAL_MODEL_RELEASE": "国際提供モデル公開",\n'
              '    "OPEN_WEIGHT_MODEL_RELEASE": "オープンウェイトモデル公開",\n'
              '    "TECHNICAL_FRAMEWORK_RELEASE": "技術Framework公開",\n'
              '    "API_MODEL_RELEASE": "APIモデル公開",\n'
              '    "EVALUATION_RELEASE": "評価公開",\n'
              '    "MEDIA_MODEL_RELEASE": "メディアモデル公開",\n'
              '    "MEDIA_MODEL_UPDATE": "メディアモデル更新",\n'
              '}\nTYPE_LABELS = {'
          )
          replace_once(
              path,
              '    "SAFETY EVENT": "安全性関連",\n}\nTYPE_OVERRIDES = {',
              '    "SAFETY EVENT": "安全性関連",\n'
              '    "Agent_製品公開": "Agent製品公開",\n'
              '    "研究_PREVIEW": "研究Preview",\n'
              '    "REGIONAL_モデル公開": "地域別モデル公開",\n'
              '    "INTERNATIONAL_モデル公開": "国際提供モデル公開",\n'
              '    "オープンウェイト_モデル公開": "オープンウェイトモデル公開",\n'
              '    "TECHNICAL_Framework公開": "技術Framework公開",\n'
              '    "API_モデル公開": "APIモデル公開",\n'
              '}\nTYPE_OVERRIDES = {'
          )

          validator = '''
          CHRONOLOGY_EVENT_RE = re.compile(r"\\b\\d{4}-\\d{2}(?:-\\d{2})?\\s*\\(([^)]+)\\)")
          ALLCAPS_SPACE_RE = re.compile(r"^[A-Z][A-Z0-9]*(?:\\s+[A-Z][A-Z0-9]*)+$")
          MACHINE_SINGLE_TYPE_LABELS = {"PRODUCT", "OTHER"}


          def _machine_taxonomy_label(value: str) -> bool:
              value = value.replace(r"\\_", "_").strip()
              if not value:
                  return False
              if "_" in value:
                  return True
              if ALLCAPS_SPACE_RE.fullmatch(value):
                  return True
              if value in MACHINE_SINGLE_TYPE_LABELS:
                  return True
              return False


          def reader_taxonomy_findings(text: str) -> list[str]:
              # Inspect only taxonomy fields, not URLs or free prose.
              normalized = text.replace(r"\\_", "_")
              findings: set[str] = set()
              for value in CHRONOLOGY_EVENT_RE.findall(normalized):
                  label = value.strip()
                  if _machine_taxonomy_label(label):
                      findings.add(label)
              for line in normalized.splitlines():
                  stripped = line.strip()
                  if stripped.startswith("種別 & "):
                      value = stripped[len("種別 & "):].rsplit(r"\\\\", 1)[0].strip()
                      if _machine_taxonomy_label(value):
                          findings.add(value)
                      continue
                  if " & " in stripped and re.search(r"\\b\\d{4}-\\d{2}", stripped):
                      parts = [part.strip() for part in stripped.rsplit(r"\\\\", 1)[0].split(" & ")]
                      if len(parts) >= 4:
                          value = parts[-2]
                          if _machine_taxonomy_label(value):
                              findings.add(value)
              return sorted(findings)
          '''
          lines = validator.splitlines()
          indent = min((len(x) - len(x.lstrip()) for x in lines if x.strip()), default=0)
          validator = '\n'.join(x[indent:] if len(x) >= indent else x for x in lines).strip() + '\n\n'
          replace_once(
              path,
              'def translate_machine_labels(text: str) -> str:\n',
              validator + 'def translate_machine_labels(text: str) -> str:\n'
          )
          replace_once(
              path,
              '    generic = apply_generic_tail_policy(text)\n',
              '    taxonomy_findings = reader_taxonomy_findings(text)\n'
              '    if taxonomy_findings:\n'
              '        raise ValueError(f"reader-facing taxonomy leak remains: {taxonomy_findings}")\n'
              '    generic = apply_generic_tail_policy(text)\n'
          )

          path = 'scripts/special_reader_notes_ja.py'
          replace_once(
              path,
              'from scripts import expand_special_validated_source as expansion\n',
              'from scripts import expand_special_validated_source as expansion\n'
              'from scripts import postprocess_special_reader_facing_notes as reader_taxonomy\n'
          )
          p = Path(path)
          text = p.read_text(encoding='utf-8')
          pattern = re.compile(
              r'def raw_enum_findings\(text: str\) -> list\[str\]:\n.*?\n\n\ndef check\(',
              re.S,
          )
          if len(pattern.findall(text)) != 1:
              raise SystemExit('special_reader_notes_ja.py: raw_enum_findings anchor mismatch')
          text = pattern.sub(
              'def raw_enum_findings(text: str) -> list[str]:\n'
              '    return reader_taxonomy.reader_taxonomy_findings(text)\n\n\n'
              'def check(',
              text,
              count=1,
          )
          p.write_text(text, encoding='utf-8')

          path = 'scripts/revise_special_visual_review_repairs.py'
          p = Path(path)
          text = p.read_text(encoding='utf-8')
          pattern = re.compile(
              r'        forbidden_fragments = \(.*?'
              r'        if leaks:\n'
              r'            raise ValueError\(f"\{rel\}: raw/partial reader taxonomy leak: \{sorted\(set\(leaks\)\)\}"\)\n',
              re.S,
          )
          if len(pattern.findall(text)) != 1:
              raise SystemExit('visual review repair taxonomy guard anchor mismatch')
          text = pattern.sub(
              '        taxonomy_findings = reader_notes.reader_taxonomy_findings(revised)\n'
              '        if taxonomy_findings:\n'
              '            raise ValueError(f"{rel}: raw/partial reader taxonomy leak: {taxonomy_findings}")\n',
              text,
              count=1,
          )
          text = text.replace(
              'reader["machine_enum_policy"] = "reader-facing-labels-v5"',
              'reader["machine_enum_policy"] = "reader-facing-labels-v6-generic-taxonomy-guard"',
          )
          p.write_text(text, encoding='utf-8')
          PY

      - name: Add generic Special publication layout check
        shell: bash
        run: |
          set -euo pipefail
          cat > scripts/special_publication_layout_check.py <<'PY'
          #!/usr/bin/env python3
          # Validate the reader-facing Special layout contract before PDF publication.
          from __future__ import annotations

          import argparse
          import hashlib
          import json
          from pathlib import Path
          from typing import Any


          def load_json(path: Path) -> dict[str, Any]:
              value = json.loads(path.read_text(encoding="utf-8"))
              if not isinstance(value, dict):
                  raise ValueError(f"{path}: expected object")
              return value


          def sha(path: Path) -> str:
              return hashlib.sha256(path.read_bytes()).hexdigest()


          def inspect_layout(
              manifest: dict[str, Any],
              main_text: str,
              architecture: dict[str, Any],
          ) -> list[str]:
              errors: list[str] = []
              articles = [x for x in (manifest.get("articles") or []) if isinstance(x, dict)]
              if not articles:
                  return ["validated Special source has no article entries"]

              override = architecture.get("layout_override") or {}
              single_column_approved = (
                  architecture.get("status") == "APPROVED"
                  and isinstance(override, dict)
                  and override.get("narrative_body_mode") == "single-column"
                  and bool(str(override.get("approval_reference") or "").strip())
              )
              if single_column_approved:
                  return errors

              body_mode = str((manifest.get("layout") or {}).get("body_mode") or "")
              if "single-column" in body_mode.lower():
                  errors.append(
                      "Special narrative body_mode regressed to single-column without approved override"
                  )
              if "two-column" not in body_mode.lower() or "multicol" not in body_mode.lower():
                  errors.append(
                      "Special layout manifest does not declare local two-column multicols narrative"
                  )
              if r"\twocolumn" in main_text or r"\onecolumn" in main_text:
                  errors.append(
                      "global twocolumn/onecolumn switch is forbidden for normal Special layout"
                  )

              begin_count = main_text.count(r"\begin{multicols}{2}")
              end_count = main_text.count(r"\end{multicols}")
              if begin_count != len(articles) or end_count != len(articles):
                  errors.append(
                      "expected one balanced two-column narrative block per article: "
                      f"articles={len(articles)} begin={begin_count} end={end_count}"
                  )

              front = str(
                  (manifest.get("frontmatter") or {}).get("path")
                  or "sections/00-frontmatter.tex"
              )
              front_input = r"\input{" + Path(front).with_suffix("").as_posix() + "}"
              first_multicol = main_text.find(r"\begin{multicols}{2}")
              if front_input not in main_text or (
                  first_multicol >= 0 and main_text.find(front_input) > first_multicol
              ):
                  errors.append("frontmatter must remain full-width before narrative multicols")

              depth = 0
              for line in main_text.splitlines():
                  if r"\begin{multicols}{2}" in line:
                      depth += 1
                  if (
                      "technical-notes/" in line
                      and r"\input{" in line
                      and depth != 0
                  ):
                      errors.append("Technical Notes input is nested inside narrative multicols")
                  if r"\end{multicols}" in line:
                      depth -= 1
                  if depth < 0:
                      errors.append("unbalanced multicols end marker")
                      depth = 0
              if depth != 0:
                  errors.append("unbalanced multicols environment")
              return errors


          def check(repo_root: Path, issue_id: str) -> dict[str, Any]:
              state = load_json(repo_root / "sources" / issue_id / "pipeline-state.json")
              source = state.get("provenance", {}).get("validated_issue_source") or {}
              manifest_path = repo_root / str(source.get("path") or "")
              if not manifest_path.is_file() or sha(manifest_path) != source.get("sha256"):
                  raise ValueError("state-pinned source manifest missing or SHA mismatch")
              manifest = load_json(manifest_path)

              main_rel = str((manifest.get("main_tex") or {}).get("path") or "main.tex")
              main_path = manifest_path.parent / main_rel
              if not main_path.is_file():
                  raise ValueError("state-pinned main.tex missing")

              architecture_path = (
                  repo_root
                  / "sources"
                  / issue_id
                  / "architecture"
                  / "issue-architecture-v0.1.json"
              )
              architecture = load_json(architecture_path)
              errors = inspect_layout(
                  manifest,
                  main_path.read_text(encoding="utf-8"),
                  architecture,
              )
              return {
                  "schema_version": "1.0",
                  "issue_id": issue_id,
                  "source_manifest": manifest_path.relative_to(repo_root).as_posix(),
                  "article_count": len(manifest.get("articles") or []),
                  "passed": not errors,
                  "errors": errors,
              }


          def main() -> int:
              ap = argparse.ArgumentParser()
              ap.add_argument("--repo-root", default=".")
              ap.add_argument("--issue-id", required=True)
              args = ap.parse_args()
              report = check(Path(args.repo_root).resolve(), args.issue_id)
              print(json.dumps(report, ensure_ascii=False, indent=2))
              return 0 if report["passed"] else 1


          if __name__ == "__main__":
              raise SystemExit(main())
          PY
          sed -i 's/^          //' scripts/special_publication_layout_check.py

      - name: Enforce layout check in canonical Special PDF build
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path('.github/workflows/build-special-pdf.yml')
          text = path.read_text(encoding='utf-8')
          pattern = re.compile(
              r'(?m)^(?P<indent>[ \t]*)PYTHONPATH=control-src python control-src/scripts/special_period_consistency\.py check \\\n'
              r'^[ \t]*--repo-root worktree \\\n'
              r'^[ \t]*--special-slug "\$SPECIAL_SLUG" \\\n'
              r'^[ \t]*--issue-id "\$SPECIAL_ID"\n'
          )
          matches = list(pattern.finditer(text))
          if len(matches) != 1:
              raise SystemExit(f'build-special-pdf period preflight matches={len(matches)}')
          match = matches[0]
          indent = match.group('indent')
          addition = (
              f'{indent}PYTHONPATH=control-src python control-src/scripts/special_publication_layout_check.py \\\n'
              f'{indent}  --repo-root worktree \\\n'
              f'{indent}  --issue-id "$SPECIAL_ID"\n'
          )
          text = text[:match.end()] + addition + text[match.end():]
          path.write_text(text, encoding='utf-8')
          PY

      - name: Add regression tests
        shell: bash
        run: |
          set -euo pipefail
          cat > tests/test_special_publication_contract_regressions.py <<'PY'
          from __future__ import annotations

          import unittest

          from scripts.postprocess_special_reader_facing_notes import (
              reader_taxonomy_findings,
              transform_note,
          )
          from scripts.special_publication_layout_check import inspect_layout


          class SpecialPublicationContractRegressionTests(unittest.TestCase):
              def test_m02_composite_and_partial_event_labels_are_normalized(self):
                  source = (
                      r"A & 主要資料 & モデル & 2026-02-02 (Agent\_製品公開); "
                      r"2026-02-05 (SYSTEM\_CARD\_PUBLICATION); "
                      r"2026-02-12 (研究\_PREVIEW) \\" "\n"
                      r"B & 補足資料 & Framework & 2026-02-24 (PROJECT\_RELEASE) \\" "\n"
                      r"C & 主要資料 & モデル & 2026-02-16 (REGIONAL\_モデル公開); "
                      r"2026-02-20 (INTERNATIONAL\_モデル公開) \\" "\n"
                      r"D & 主要資料 & オープンウェイト & 2026-02-12 "
                      r"(オープンウェイト\_モデル公開) \\" "\n"
                      r"E & 主要資料 & Framework & 2026-02-13 "
                      r"(TECHNICAL\_Framework公開) \\" "\n"
                      r"F & 主要資料 & モデル & 2026-02-19 (API\_モデル公開) \\" "\n"
                  )
                  result = transform_note(source)
                  for expected in (
                      "Agent製品公開",
                      "System Card公開",
                      "研究Preview",
                      "プロジェクト公開",
                      "地域別モデル公開",
                      "国際提供モデル公開",
                      "オープンウェイトモデル公開",
                      "技術Framework公開",
                      "APIモデル公開",
                  ):
                      self.assertIn(expected, result)
                  self.assertEqual(reader_taxonomy_findings(result), [])

              def test_generic_taxonomy_guard_rejects_unknown_forms(self):
                  source = (
                      r"A & 主要資料 & Framework & 2026-02-01 (FUTURE\_EVENT) \\" "\n"
                      r"B & 主要資料 & Framework & 2026-02-02 (SECURITY EVENT) \\" "\n"
                      r"C & 主要資料 & Framework & 2026-02-03 (研究\_UNKNOWN) \\" "\n"
                  )
                  findings = reader_taxonomy_findings(source)
                  self.assertIn("FUTURE_EVENT", findings)
                  self.assertIn("SECURITY EVENT", findings)
                  self.assertIn("研究_UNKNOWN", findings)

              def test_balanced_local_multicols_passes(self):
                  manifest = {
                      "layout": {
                          "body_mode": (
                              "mixed: narrative articles two-column via local balanced multicols"
                          )
                      },
                      "frontmatter": {"path": "sections/00-frontmatter.tex"},
                      "articles": [{"package_id": "a"}, {"package_id": "b"}],
                  }
                  main = (
                      "\\input{sections/00-frontmatter}\n"
                      "\\section{A}\n"
                      "\\begin{multicols}{2}\n"
                      "text\n"
                      "\\end{multicols}\n"
                      "\\input{technical-notes/a-notes}\n"
                      "\\section{B}\n"
                      "\\begin{multicols}{2}\n"
                      "text\n"
                      "\\end{multicols}\n"
                      "\\input{technical-notes/b-notes}\n"
                  )
                  self.assertEqual(
                      inspect_layout(manifest, main, {"status": "APPROVED"}),
                      [],
                  )

              def test_single_column_regression_is_rejected(self):
                  manifest = {
                      "layout": {"body_mode": "single-column long-form"},
                      "frontmatter": {"path": "sections/00-frontmatter.tex"},
                      "articles": [{"package_id": "a"}],
                  }
                  main = (
                      "\\input{sections/00-frontmatter}\n"
                      "\\section{A}\n"
                      "text\n"
                      "\\input{technical-notes/a-notes}\n"
                  )
                  errors = inspect_layout(manifest, main, {"status": "APPROVED"})
                  self.assertTrue(any("single-column" in e for e in errors))
                  self.assertTrue(any("two-column" in e for e in errors))

              def test_explicit_approved_single_column_override_can_opt_out(self):
                  manifest = {
                      "layout": {"body_mode": "single-column long-form"},
                      "articles": [{"package_id": "a"}],
                  }
                  architecture = {
                      "status": "APPROVED",
                      "layout_override": {
                          "narrative_body_mode": "single-column",
                          "approval_reference": (
                              "Human Gate explicitly approved single-column narrative"
                          ),
                      },
                  }
                  self.assertEqual(inspect_layout(manifest, "text", architecture), [])


          if __name__ == "__main__":
              unittest.main()
          PY
          sed -i 's/^          //' tests/test_special_publication_contract_regressions.py

      - name: Run focused regression tests
        run: |
          set -euo pipefail
          python -m compileall -q scripts tests
          python -m unittest -v \
            tests.test_special_reader_facing_notes \
            tests.test_special_reader_notes_ja \
            tests.test_special_visual_review_repairs \
            tests.test_special_publication_contract_regressions

      - name: Commit contract repair and remove one-shot workflows
        shell: bash
        run: |
          set -euo pipefail
          rm -f \
            .github/workflows/one-shot-fix-special-publication-layout-taxonomy-contract.yml \
            .github/workflows/one-shot-fix-special-publication-layout-taxonomy-contract-v2.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Harden Special publication layout and reader taxonomy contracts'
          git push origin HEAD:fix/special-publication-layout-taxonomy-contract
