name: SP-2020-Y v0.12 final visual compaction

on:
  push:
    branches:
      - special/2020-Y-work
    paths:
      - 'sources/SP-2020-Y/editorial/v012-final-visual-trigger.json'

permissions:
  contents: write

jobs:
  revise:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout current main control code
        uses: actions/checkout@v6
        with:
          ref: main
          path: control-src
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Checkout SP-2020-Y work branch
        uses: actions/checkout@v6
        with:
          ref: special/2020-Y-work
          path: worktree
          fetch-depth: 0

      - name: Apply fail-closed v0.12 final visual compaction
        shell: bash
        run: |
          set -euo pipefail
          python control-src/scripts/raw_provenance.py --repo-root worktree --issue-id SP-2020-Y check
          PYTHONPATH=control-src python control-src/scripts/revise_special_annual_final_visual_compaction.py \
            --repo-root worktree \
            --special-slug 2020-Y \
            --issue-id SP-2020-Y \
            --source-version v0.12 \
            > annual-final-visual-compaction-v0.12.json
          cat annual-final-visual-compaction-v0.12.json

      - name: Verify v0.12 preservation contract
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib,json,pathlib
          root=pathlib.Path('worktree')
          state=json.load(open(root/'sources/SP-2020-Y/pipeline-state.json',encoding='utf-8'))
          assert state['lifecycle_state']=='VALIDATED_DRAFT'
          assert state['gates']['latex_build']=='pending'
          source=state['provenance']['validated_issue_source']
          assert source['source_version']=='v0.12'
          mp=root/source['path']
          assert hashlib.sha256(mp.read_bytes()).hexdigest()==source['sha256']
          manifest=json.load(open(mp,encoding='utf-8')); lr=manifest['layout_revision']
          assert lr['annual_final_visual_compaction'] is True
          assert lr['annual_final_visual_compaction_issue_refs']==[122,140]
          assert lr['reader_semantic_content_changed'] is False
          assert lr['bibliography_data_changed'] is False
          assert lr['chronology_event_content_changed'] is False
          assert lr['toc_render_size']=='scriptsize'
          assert lr['references_entry_font']=='7pt/8pt'
          refs=mp.parent/manifest['references']['path']
          assert hashlib.sha256(refs.read_bytes()).hexdigest()==lr['bibliography_sha256_before']==lr['bibliography_sha256_after']
          chrono=state['provenance']['annual_chronology']; cp=root/chrono['path']
          assert hashlib.sha256(cp.read_bytes()).hexdigest()==lr['chronology_sha256']
          assert int(chrono['event_count'])==int(lr['chronology_event_count'])==28
          PY

      - name: Commit v0.12
        working-directory: worktree
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A surveys/special/2020-Y sources/SP-2020-Y
          git diff --cached --quiet && { echo 'No v0.12 changes' >&2; exit 1; }
          git commit -m 'Refine SP-2020-Y final visual compaction (v0.12)'
          git push origin HEAD:special/2020-Y-work
